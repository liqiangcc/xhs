name: Build Content Batch 0043 Reorder List

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0043-reorder-list.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-reorder-list-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_afca3609b3e122b11b3e0c6e1e99692e
  SOURCE_QID: afca3609b3e122b11b3e0c6e1e99692e

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const exact='算法：高效重排链表（要求原地修改，空间复杂度O(1)）';
          const raw=JSON.parse(fs.readFileSync('note_structured/68773f190000000017035b4e.json','utf8'));
          if(!(raw.questions||[]).includes(exact)) throw new Error('structured source wording drifted');
          const note=JSON.parse(fs.readFileSync('note_tagged/68773f190000000017035b4e.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==exact) throw new Error(`tagged source boundary drifted: ${row?.original_question}`);
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding') throw new Error('batch0043 inventory state/type drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid])) throw new Error('inventory ownership drifted');
          if(item.source_questions?.[0]?.original_question!==exact) throw new Error('inventory source wording drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('live ownership/type drifted');
          NODE

      - name: Write source-bounded candidate and writer validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";out="review/content_build/answer_batch_0043/$cid";candidate="review/candidates/answers/$cid.md";mkdir -p "$out" review/candidates/answers
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_afca3609b3e122b11b3e0c6e1e99692e","version":1,"status":"draft","updated_at":"2026-08-27","answer_type":"coding","quality_tier":"candidate"} -->
          # 原地 O(1) 空间重排链表

          ## 核心结论

          来源明确保留了“高效重排链表、原地修改、额外空间 O(1)”，但没有保留重排后的精确顺序或方法签名，因此不能把某个具体排列冒充成原题事实。下面采用常见的参考契约来展示这些约束：把 `L0→L1→…→Ln` 原地重排为 `L0→Ln→L1→Ln-1→…`。在这个参考契约下，标准做法是三步：快慢指针找中点 → 原地反转后半段 → 两段链表交替合并；整体 O(n) 时间、O(1) 额外空间。

          ## 1 分钟版

          - 用 `slow/fast` 找到前半段尾节点；偶数长度时让前半段不短于后半段。
          - `second = slow.next` 后先 `slow.next = null`，把链表断成两段，避免后续交织形成旧链路残留。
          - 原地反转后半段，使尾节点可以按 `Ln, Ln-1, ...` 顺序取出。
          - 同时走 `first` 和反转后的 `second`，每次保存两边的 `next` 后交替接回。
          - 全程只使用常数个指针，没有数组、栈或递归辅助空间。

          ## 3 分钟版

          下面 Java 代码把 `L0→Ln→L1→Ln-1→…` 明确标为本答案的参考契约，而不是声称来源已经保存了这个排列：

          ```java
          public final class Solution {
              private Solution() {}

              public static final class Node {
                  public int val;
                  public Node next;
                  public Node(int val) { this.val = val; }
              }

              public static void reorder(Node head) {
                  if (head == null || head.next == null) return;

                  Node slow = head;
                  Node fast = head;
                  while (fast.next != null && fast.next.next != null) {
                      slow = slow.next;
                      fast = fast.next.next;
                  }

                  Node second = slow.next;
                  slow.next = null;

                  Node prev = null;
                  while (second != null) {
                      Node next = second.next;
                      second.next = prev;
                      prev = second;
                      second = next;
                  }
                  second = prev;

                  Node first = head;
                  while (second != null) {
                      Node firstNext = first.next;
                      Node secondNext = second.next;
                      first.next = second;
                      second.next = firstNext;
                      first = firstNext;
                      second = secondNext;
                  }
              }
          }
          ```

          例如 `1→2→3→4→5`：中点是 3，切成 `1→2→3` 与 `4→5`；后半段反转成 `5→4`；交替合并得到 `1→5→2→4→3`。偶数长度 `1→2→3→4` 会得到 `1→4→2→3`。

          ## 关键细节

          - **为什么必须先断链**：找到中点后若不执行 `slow.next = null`，前半段仍指向旧的后半段入口；交替合并时更容易保留错误旧边甚至形成环。
          - **中点选择**：循环条件 `fast.next != null && fast.next.next != null` 让长度 4 的前半段为 `1→2`、后半段为 `3→4`，长度 5 的前半段为 `1→2→3`、后半段为 `4→5`。
          - **改指针前保存后继**：反转和合并都必须先保存原 `next`，否则一旦覆盖指针就可能丢失未处理节点。
          - **奇偶长度统一**：前半段长度等于或比后半段多 1，因此 `while (second != null)` 足以完成交织；奇数时中点自然留在结尾。
          - **空间复杂度**：只维护固定数量的节点引用，额外空间 O(1)；没有递归，所以也没有隐含 O(n) 调用栈。
          - **来源边界**：如果面试官实际要求的是另一种“重排”（如按奇偶位置、按值分区等），应以补充的精确排列为准；这里只证明常见端点交织契约如何满足原地/O(1) 约束。

          ## 原理机制

          不能直接从单链表尾部 O(1) 地不断取节点，因为单链表没有前驱指针。反转后半段把原来的“从尾到中点”的访问顺序转换成一次正向遍历，于是两条链分别提供 `L0,L1,...` 和 `Ln,Ln-1,...`。最后交替合并只是局部重连边。每个节点在找中点、反转、合并三个阶段都只被常数次访问，所以总时间仍为 O(n)。

          ## 项目经验版

          来源没有真实项目场景，不能虚构生产使用。工程里如果确实要原地重排链式结构，我会先把目标顺序写成可执行样例和不变量，再重点测试空链、单节点、两节点、奇偶长度、节点不丢失和无环；如果可读性比 O(1) 空间更重要，也应比较数组收集节点后重连的更简单方案。

          ## 常见追问

          - 问：为什么不用栈保存后半段？答：栈能简化从尾部取节点，但会使用 O(n) 额外空间，不满足来源保留的 O(1) 空间约束。
          - 问：为什么不递归从两端交织？答：递归通常产生 O(n) 调用栈，也不满足严格的 O(1) 额外空间。
          - 问：怎么证明不会丢节点？答：每次修改 `next` 前都保存当前两段的后继；合并循环每次恰好消费一个后半段节点，并保持未消费的两段入口可达。
          - 问：怎么检查没有形成环？答：除针对期望序列逐节点比较外，再用 Floyd 快慢指针验证结果无环，并验证节点数与输入一致。
          - 问：如果只有两个节点呢？答：中点是第一个节点，后半段只有第二个；断链、反转、合并后仍是原顺序，不会产生自环。

          ## 易错点

          - 把“重排链表”未经说明就断言成唯一的 `L0→Ln→L1→…` 来源语义。
          - 找到中点后不切断两段，导致旧链接参与后续合并。
          - 反转时覆盖 `next` 前没有保存后继，直接丢失剩余链表。
          - 合并时先改 `first.next` 或 `second.next` 却没有缓存两边原后继。
          - 用栈/数组或递归实现，却仍声称满足严格 O(1) 额外空间。
          EOF

          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public static void reorder')) throw new Error('exact executable Java candidate block missing or ambiguous');
          fs.writeFileSync('/tmp/Solution.java',blocks[0][1]+'\n');
          fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java
          cat > /tmp/WriterValidation.java <<'JAVA'
          import java.util.*;
          public final class WriterValidation {
              static Solution.Node build(int[] a){Solution.Node dummy=new Solution.Node(0),p=dummy;for(int v:a){p.next=new Solution.Node(v);p=p.next;}return dummy.next;}
              static int[] expected(int[] a){int[] out=new int[a.length];int l=0,r=a.length-1,k=0;while(l<=r){out[k++]=a[l++];if(l<=r)out[k++]=a[r--];}return out;}
              static int[] readNoCycle(Solution.Node h,int max){ArrayList<Integer> xs=new ArrayList<>();Set<Solution.Node> seen=Collections.newSetFromMap(new IdentityHashMap<>());while(h!=null){if(!seen.add(h))throw new AssertionError("cycle");xs.add(h.val);if(xs.size()>max)throw new AssertionError("too many nodes");h=h.next;}return xs.stream().mapToInt(Integer::intValue).toArray();}
              static void check(int[] a){Solution.Node h=build(a);Solution.reorder(h);int[] got=readNoCycle(h,a.length);if(!Arrays.equals(got,expected(a)))throw new AssertionError(Arrays.toString(a)+" -> "+Arrays.toString(got)+" want="+Arrays.toString(expected(a)));if(got.length!=a.length)throw new AssertionError("node count drift");}
              public static void main(String[] args){for(int n=0;n<=128;n++){int[] a=new int[n];for(int i=0;i<n;i++)a[i]=i+1;check(a);}Random r=new Random(0x52454f52444552L);for(int c=0;c<20000;c++){int n=r.nextInt(200);int[] a=new int[n];for(int i=0;i<n;i++)a[i]=r.nextInt();check(a);}System.out.println("PASS lengths=0..128 seeded-random=20000 odd-even=covered node-count=preserved cycle=none");}
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/WriterValidation.java
          stdout="$(java -cp /tmp WriterValidation)";echo "$stdout";grep -E '^PASS lengths=0\.\.128 seeded-random=20000 odd-even=covered node-count=preserved cycle=none$' <<<"$stdout";echo "WRITER_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze writer research and validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const tests=[{case:'list lengths 0 through 128',expected:'matches L0,Ln,L1,Ln-1 reference ordering with identical node count and no cycle',passed:true},{case:'odd and even lengths including 0,1,2',expected:'reference ordering is exact and list terminates',passed:true},{case:'20,000 seeded random value lists up to length 199',expected:'value sequence matches independent index oracle; node count preserved; no cycle',passed:true}];
          fs.writeFileSync(`${out}/reorder_list_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact Java candidate and compare to independent array index oracle',stdout:process.env.WRITER_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'structured-note',title:'Structured interview note preserving reorder-list O(1) prompt',locator:'note_structured/68773f190000000017035b4e.json',source_type:'repository_source_record',checked_at:date},{source_id:'tagged-note',title:'Tagged interview question and canonical ownership',locator:'note_tagged/68773f190000000017035b4e.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Deterministic Java reorder-list validation',locator:`${out}/reorder_list_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source preserves an in-place linked-list reorder with O(1) extra-space requirement but does not preserve the exact target ordering or API.',source_ids:['structured-note','tagged-note','source-inventory'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'reference-behavior',text:'Under the explicitly declared L0,Ln,L1,Ln-1 reference contract, midpoint split, second-half reversal and alternating merge match an independent index oracle across exhaustive lengths and seeded random lists while preserving node count and acyclicity.',source_ids:['writer-validation'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

      - name: Writer repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit candidate with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0043/$CANONICAL_ID/reorder_list_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/writer_research.json"
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: draft batch 0043 reorder-list candidate'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
          done
          exit 1
