name: Review Coroutine Batch 0009

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/review-coroutine-batch-0009.yml

permissions:
  contents: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Repair stale concept context and bind fresh Kotlin source-first review
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const id = 'cq_coroutine_878b831f';
          const candidatePath = `review/candidates/answers/${id}.md`;
          const contextPath = `review/content_build/answer_batch_0009/${id}/context.json`;
          const evidencePath = `review/evidence/${id}.json`;
          const resultPath = `review/content_build/answer_batch_0009/${id}/isolated_review_result.json`;
          const candidate = fs.readFileSync(candidatePath, 'utf8');
          const candidateSha = crypto.createHash('sha256').update(candidate, 'utf8').digest('hex');
          const metadataMatch = candidate.match(/^<!--\s*xhs-answer:\s*(\{.*\})\s*-->/);
          if (!metadataMatch) throw new Error('candidate metadata missing');
          const metadata = JSON.parse(metadataMatch[1]);
          if (metadata.answer_type !== 'concept') throw new Error(`candidate type drift: ${metadata.answer_type}`);

          const contextRaw = execFileSync('node', ['scripts/xhs.js', 'answer', 'context', '--canonical-id', id, '--noWrite'], {encoding:'utf8'});
          const context = JSON.parse(contextRaw);
          if (context.answer_type !== 'concept') throw new Error(`expected concept context, got ${context.answer_type}`);
          if (!(context.source_questions || []).every((q) => /八股文|Concept/i.test(String(q.question_type)))) {
            throw new Error(`source taxonomy drift: ${JSON.stringify((context.source_questions || []).map((q) => q.question_type))}`);
          }
          fs.mkdirSync(path.dirname(contextPath), {recursive:true});
          fs.writeFileSync(contextPath, `${JSON.stringify(context, null, 2)}\n`, 'utf8');

          const sources = [
            {
              source_id: 'kotlin-coroutines-basics-20260819',
              title: 'Kotlin Documentation: Coroutines basics',
              locator: 'https://kotlinlang.org/docs/coroutines-basics.html',
              source_type: 'official_documentation',
              checked_at: '2026-08-19'
            },
            {
              source_id: 'kotlin-supervisor-scope-1.11.0',
              title: 'kotlinx.coroutines 1.11.0 API: supervisorScope',
              locator: 'https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/supervisor-scope.html',
              source_type: 'official_documentation',
              checked_at: '2026-08-19'
            },
            {
              source_id: 'kotlin-run-blocking-1.11.0',
              title: 'kotlinx.coroutines 1.11.0 API: runBlocking',
              locator: 'https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/run-blocking.html',
              source_type: 'official_documentation',
              checked_at: '2026-08-19'
            },
            {
              source_id: 'kotlin-coroutine-dispatcher-1.11.0',
              title: 'kotlinx.coroutines 1.11.0 API: CoroutineDispatcher',
              locator: 'https://kotlinlang.org/api/kotlinx.coroutines/kotlinx-coroutines-core/kotlinx.coroutines/-coroutine-dispatcher/',
              source_type: 'official_documentation',
              checked_at: '2026-08-19'
            }
          ];

          const scores = {
            facts_and_evidence: 25,
            directness_and_relevance: 20,
            type_specific_completeness: 20,
            mechanism_and_causality: 15,
            boundaries_and_tradeoffs: 10,
            followup_quality: 5,
            oral_quality: 5
          };

          const evidence = {
            schema_version: 'answer_evidence.v1',
            canonical_id: id,
            candidate_sha256: candidateSha,
            checked_at: '2026-08-19',
            writer: {
              writer_id: 'answer-curator',
              writer_version: 'kotlin-coroutines-docs.v1'
            },
            sources,
            claims: [
              {
                claim_id: 'kotlin-coroutine-suspension-thread-and-dispatcher-boundary',
                text: 'Current Kotlin documentation defines a coroutine as a suspendable computation, states that on JVM and Kotlin/Native concurrent code including coroutines runs on operating-system-managed threads, explains that suspension can release a thread to run another coroutine, and states that a dispatcher controls which thread or thread pool executes a coroutine.',
                source_ids: ['kotlin-coroutines-basics-20260819', 'kotlin-coroutine-dispatcher-1.11.0'],
                answer_locations: ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问', '易错点']
              },
              {
                claim_id: 'kotlin-structured-concurrency-parent-child-boundary',
                text: 'Current Kotlin documentation describes structured concurrency as a parent-child task tree: a parent waits for children, and parent failure or cancellation recursively cancels children. The candidate correctly uses this as the ordinary scope boundary rather than claiming every supervisor relationship behaves identically.',
                source_ids: ['kotlin-coroutines-basics-20260819'],
                answer_locations: ['1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问', '易错点']
              },
              {
                claim_id: 'kotlin-supervisor-scope-failure-isolation',
                text: 'The kotlinx.coroutines 1.11.0 supervisorScope API states that a child failure does not affect other children, while an exception from the supervisorScope block cancels the scope and its children. The candidate states this boundary accurately.',
                source_ids: ['kotlin-supervisor-scope-1.11.0'],
                answer_locations: ['1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问', '易错点']
              },
              {
                claim_id: 'kotlin-runblocking-and-performance-boundaries',
                text: 'The kotlinx.coroutines 1.11.0 runBlocking API states that runBlocking blocks the current thread until completion, is intended as a bridge from regular blocking code to suspending libraries, and is redundant/blocking inside suspend functions. Kotlin dispatcher documentation also describes shared thread pools and CPU-oriented Dispatchers.Default, supporting the candidate boundary that coroutine count does not create extra CPU parallelism.',
                source_ids: ['kotlin-run-blocking-1.11.0', 'kotlin-coroutine-dispatcher-1.11.0', 'kotlin-coroutines-basics-20260819'],
                answer_locations: ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '项目经验版', '常见追问', '易错点']
              }
            ],
            source_question_coverage: [
              {
                question_id: '444aba6b82aa518c570570ee66b82f69',
                covered: true,
                answer_locations: ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问']
              }
            ],
            review: {
              reviewer_id: 'source-first-isolated-reviewer-coroutine-20260819',
              review_version: 'kotlin-1.11.0-source-first.v3',
              independent: true,
              decision: 'pass',
              revision_round: 2,
              scores,
              hard_failures: [],
              uncovered_source_variants: [],
              unsupported_claims: [],
              findings: [
                'Both duplicate source rows ask the same concept comparison; the stale generated scenario context was repaired to concept.',
                'The candidate explicitly limits implementation-specific claims to Kotlin/JVM instead of universalizing coroutine internals across languages.',
                'Suspension versus thread blocking, dispatcher/thread ownership, structured concurrency, supervisorScope isolation, and runBlocking behavior all match current Kotlin/kotlinx.coroutines 1.11.0 documentation.',
                'The answer correctly bounds the high-concurrency advantage to suspendable waiting and does not claim that more coroutines create more CPU parallelism or make arbitrary blocking APIs nonblocking.'
              ]
            }
          };
          fs.writeFileSync(evidencePath, `${JSON.stringify(evidence, null, 2)}\n`, 'utf8');

          const result = {
            schema_version: 'isolated_answer_review_result.v1',
            canonical_id: id,
            candidate: {
              path: candidatePath,
              sha256: candidateSha,
              version: Number(metadata.version || 1),
              answer_type: 'concept'
            },
            reviewed_at: '2026-08-19',
            reviewer: {
              reviewer_id: 'source-first-isolated-reviewer-coroutine-20260819',
              independent_from_writer: true,
              historical_review_read_before_conclusion: false
            },
            source_type_decision: {
              decision: 'concept',
              historical_source_labels: [...new Set((context.source_questions || []).map((q) => q.question_type))],
              reason: 'The question asks for definition, comparison dimensions, advantages, and selection boundaries; both source rows are Concept, so concept is the response contract.'
            },
            primary_sources_checked: sources.map(({title, locator}) => ({title, locator})),
            scores: {...scores, total: Object.values(scores).reduce((a,b)=>a+b,0)},
            hard_failures: [],
            uncovered_source_variants: [],
            unsupported_claims: [],
            findings: evidence.review.findings,
            decision: 'pass',
            promotion_allowed: false,
            human_review_state: 'mandatory_pilot_review_pending',
            next_required_action: 'Run deterministic evidence audit on the same bytes, then obtain mandatory pilot human approval before atomic promotion. Do not fabricate human approval.'
          };
          fs.writeFileSync(resultPath, `${JSON.stringify(result, null, 2)}\n`, 'utf8');
          fs.writeFileSync(path.join(path.dirname(contextPath), 'candidate_sha256.txt'), `${candidateSha}\n`, 'utf8');
          console.log(JSON.stringify({candidateSha, answer_type: context.answer_type, score: result.scores.total}, null, 2));
          NODE

      - name: Run deterministic evidence audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_coroutine_878b831f.md \
            --require-evidence \
            --noManifest
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('review/candidates/audits/cq_coroutine_878b831f.json', 'utf8'));
          if (!audit.ok) throw new Error(`audit failed: ${JSON.stringify(audit)}`);
          if (audit.answer_type !== 'concept') throw new Error(`audit type drift: ${audit.answer_type}`);
          if (audit.total_score < 90 || (audit.hard_failures || []).length) throw new Error('quality gate failed');
          NODE
          git diff --check

      - name: Record task checkpoint
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const taskPath = 'tasks/answer-batches/TASK-20260711-0313-answer-batch-0009.md';
          let text = fs.readFileSync(taskPath, 'utf8');
          const marker = '### Coroutine source-first checkpoint (2026-08-19)';
          if (!text.includes(marker)) {
            const block = [
              marker,
              '',
              '- `cq_coroutine_878b831f`: independently classified the response contract as `concept`, repaired stale generated context, verified current candidate claims against current Kotlin documentation and kotlinx.coroutines 1.11.0 APIs, rebound evidence, and passed the deterministic `--require-evidence` audit with zero hard failures.',
              '- Mandatory pilot human approval and atomic promotion remain pending; no approval or curated-ready state was fabricated.',
              '',
            ].join('\n');
            const completion = '\n## Completion\n';
            if (!text.includes(completion)) throw new Error('Completion anchor missing');
            text = text.replace(completion, `\n${block}${completion}`);
            fs.writeFileSync(taskPath, text, 'utf8');
          }
          NODE
          git diff --check

      - name: Commit review outputs and retire one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-completion-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git rm .github/workflows/review-coroutine-batch-0009.yml
          git add \
            review/content_build/answer_batch_0009/cq_coroutine_878b831f/context.json \
            review/content_build/answer_batch_0009/cq_coroutine_878b831f/candidate_sha256.txt \
            review/content_build/answer_batch_0009/cq_coroutine_878b831f/isolated_review_result.json \
            review/evidence/cq_coroutine_878b831f.json \
            review/candidates/audits/cq_coroutine_878b831f.json \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0009.md
          git diff --cached --check
          git commit -m "content: source-first review coroutine candidate"
          git push origin HEAD:content/quality-completion
