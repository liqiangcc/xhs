          base='${{ steps.base.outputs.head }}';git fetch --depth=1 origin "$CONTENT_BRANCH";remote="$(git rev-parse origin/$CONTENT_BRANCH)"
          if [ "$remote" != "$base" ];then echo "content advanced: $base -> $remote; discard mixed snapshot";exit 0;fi
          git config user.name 'xhs-content-builder';git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "$task"
          git diff --cached --check;git commit -m "content: stage batch ${BATCH} symmetric character-map candidate";git push origin "HEAD:$CONTENT_BRANCH"
