name: Review Content Batch 0042 String Equals

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0042-string-equals.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-string-equals-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_acd59133be76bf111656b5fb1c49c624
  SOURCE_QID: acd59133be76bf111656b5fb1c49c624
  OPENJDK_SHA: 7e552b4da2f8fec3ff08d63543802132bc87b592

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk/$OPENJDK_SHA/src/java.base/share/classes/java/lang/String.java" -o /tmp/OpenJDKString.java
          curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk/$OPENJDK_SHA/src/java.base/share/classes/java/lang/StringLatin1.java" -o /tmp/StringLatin1.java
          curl -fsSL "https://raw.githubusercontent.com/openjdk/jdk/$OPENJDK_SHA/src/java.base/share/classes/java/lang/Object.java" -o /tmp/OpenJDKObject.java
          grep -F 'public boolean equals(Object anObject)' /tmp/OpenJDKString.java
          grep -F 'if (this == anObject)' /tmp/OpenJDKString.java
          grep -F 'anObject instanceof String aString' /tmp/OpenJDKString.java
          grep -F '!COMPACT_STRINGS || this.coder == aString.coder' /tmp/OpenJDKString.java
          grep -F 'StringLatin1.equals(value, aString.value)' /tmp/OpenJDKString.java
          grep -F 'equal objects must have equal hash codes' /tmp/OpenJDKObject.java
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const structured=JSON.parse(fs.readFileSync('note_structured/685696fe0000000012033bb6.json','utf8'));
          const exact='编程题：如果你是 JDK String 类的设计者，如何实现 equals 方法？';
          if(!Array.isArray(structured.questions)||structured.questions[28]!==exact) throw new Error('String equals source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('ownership/type drifted');
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==exact) throw new Error('source wording drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','this == obj','instanceof MyString','hashCode()','defensive copy','Compact Strings']) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md)) throw new Error('fabricated production claim risk');
          if(!md.includes('仓库没有提供用户亲自设计 JDK String 或线上修改字符串实现的经历')) throw new Error('no-fabrication boundary missing');
          if(!md.includes('当前 OpenJDK')||!md.includes('当前实现')||!md.includes('历史/未来 JDK')) throw new Error('OpenJDK version boundary missing');
          const block=md.match(/```java\n([\s\S]*?)\n```/);
          if(!block||!block[1].includes('public final class Solution')||!block[1].includes('public static final class MyString')) throw new Error('self-contained candidate Java block missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(`review/candidates/answers/${cid}.md`)).digest('hex');
          fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/source-first-preconclusion.json',JSON.stringify({decision:'pass_pending_independent_oracle',source_boundary:'implement equals when designing JDK String; source does not freeze a JDK version or storage representation',upstream_snapshot:process.env.OPENJDK_SHA,observed_current_openjdk:['identity fast path','String type check','Compact Strings coder compatibility','internal value comparison'],candidate_sha256:sha},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent String-value oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;

          public final class Reviewer {
              static List<char[]> generated() {
                  char[] alphabet = new char[]{'a','b','\0','\uD83D'};
                  List<char[]> out = new ArrayList<>();
                  out.add(new char[0]);
                  for (int len=1; len<=4; len++) build(out, new char[len], 0, alphabet);
                  out.add("😀".toCharArray());
                  out.add("a😀b".toCharArray());
                  return out;
              }
              static void build(List<char[]> out, char[] cur, int i, char[] alphabet) {
                  if (i==cur.length) { out.add(cur.clone()); return; }
                  for (char c: alphabet) { cur[i]=c; build(out,cur,i+1,alphabet); }
              }
              static Solution.MyString ms(char[] x) { return new Solution.MyString(x); }
              public static void main(String[] args) {
                  List<char[]> cases=generated();
                  long pairs=0;
                  for (char[] a: cases) {
                      Solution.MyString x=ms(a);
                      if(!x.equals(x)) throw new AssertionError("reflexivity");
                      if(x.equals(null)) throw new AssertionError("null must be false");
                      if(x.equals(new Object())||x.equals(new String(a))) throw new AssertionError("foreign type must be false");
                      if(x.hashCode()!=new String(a).hashCode()) throw new AssertionError("hash mismatch with same char-sequence polynomial");
                      for (char[] b: cases) {
                          Solution.MyString y=ms(b);
                          boolean expected=Arrays.equals(a,b);
                          boolean xy=x.equals(y), yx=y.equals(x);
                          if(xy!=expected||yx!=expected||xy!=yx) throw new AssertionError("value/symmetry mismatch");
                          if(xy&&x.hashCode()!=y.hashCode()) throw new AssertionError("equal hash contract");
                          pairs++;
                      }
                  }
                  Solution.MyString t1=ms("same".toCharArray()), t2=ms("same".toCharArray()), t3=ms("same".toCharArray());
                  if(!(t1.equals(t2)&&t2.equals(t3)&&t1.equals(t3))) throw new AssertionError("transitivity");
                  char[] mutable="mutable".toCharArray();
                  Solution.MyString frozen=ms(mutable); int before=frozen.hashCode(); mutable[0]='X';
                  if(!frozen.equals(ms("mutable".toCharArray()))||frozen.hashCode()!=before) throw new AssertionError("defensive copy failed");
                  Map<Solution.MyString,Integer> map=new HashMap<>(); map.put(ms("key".toCharArray()),7);
                  if(!Objects.equals(map.get(ms("key".toCharArray())),7)) throw new AssertionError("HashMap lookup contract");
                  System.out.println("PASS cases="+cases.size()+" pairs="+pairs+" value-oracle=match reflexive+symmetric+transitive=pass null+type=pass hash-contract=pass defensive-copy=pass hashmap=pass unicode-code-units=covered");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)"
          echo "$stdout"
          grep -E '^PASS cases=[0-9]+ pairs=[0-9]+ value-oracle=match reflexive\+symmetric\+transitive=pass null\+type=pass hash-contract=pass defensive-copy=pass hashmap=pass unicode-code-units=covered$' <<<"$stdout"
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence after conclusion
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0042/$cid"; sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0042/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/source-first-preconclusion.json','utf8'));
          if(pre.decision!=='pass_pending_independent_oracle'||pre.candidate_sha256!==sha) throw new Error('source-first preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha) throw new Error('writer packet/hash drifted');
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/string_equals_validation.json`,'utf8'));
          if(writerValidation.result!=='pass') throw new Error('writer validation did not pass');
          const boundaryTests=[
            {case:'generated UTF-16 char-sequence pair cross-product',expected:'MyString.equals matches exact char-array value equality symmetrically',passed:true},
            {case:'reflexive/transitive laws',expected:'equivalence relation laws hold for equal values',passed:true},
            {case:'null and foreign types',expected:'equals returns false without throwing',passed:true},
            {case:'hash contract and HashMap lookup',expected:'equal values share hash and retrieve equivalent keys',passed:true},
            {case:'mutable constructor input',expected:'defensive copy keeps equality/hash stable after caller mutation',passed:true},
            {case:'supplementary-character UTF-16 units',expected:'char-sequence reference implementation remains deterministic',passed:true}
          ];
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'Repository source asks how equals should be implemented when designing JDK String; it does not freeze a particular JDK version, storage layout, or exact reference-class API.',
            'Pinned OpenJDK source independently confirms the current implementation uses identity, String type checking, Compact Strings coder compatibility, and internal value comparison; the candidate labels these as current implementation details rather than timeless semantics.',
            'The reference MyString implementation defines value equality over immutable char sequences, rejects null/foreign types naturally, performs length and content short-circuiting, and pairs equals with a compatible hashCode.',
            'Independent Java oracle checks generated UTF-16 sequences, equivalence laws, null/type boundaries, hash consistency, HashMap behavior, defensive copying, and supplementary-character code units with no hard failures.',
            'The answer explicitly separates semantic design from physical representation and avoids fabricated production experience; O(n) worst-case comparison and O(1) equals auxiliary-space claims match the shown loop.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate Solution.java; compile/run independent Reviewer.java against generated char-sequence oracle',stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests,environment:{java:'OpenJDK 21'},upstream_snapshot:process.env.OPENJDK_SHA},null,2)+'\n');
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0042-string-equals-20260827-v1',review_version:'batch-0042.string-equals.v1',decision:'pass',revision_round:1,source_packet:['note_structured/685696fe0000000012033bb6.json','review/content_build/answer_batch_0042/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md',`openjdk/jdk@${process.env.OPENJDK_SHA}:String.java,StringLatin1.java,Object.java`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0042-string-equals-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving String equals prompt',locator:'note_structured/685696fe0000000012033bb6.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'openjdk-string',title:'Pinned OpenJDK String/StringLatin1/Object equality sources',locator:`https://github.com/openjdk/jdk/tree/${process.env.OPENJDK_SHA}/src/java.base/share/classes/java/lang`,source_type:'upstream_source_code_or_release_note',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic Java String-equals fixture',locator:`${out}/string_equals_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent generated char-sequence equality oracle',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'String-equals source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The repository source asks how equals should be implemented when designing JDK String but does not itself freeze a JDK version or physical storage representation.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'current-openjdk',text:'At the pinned OpenJDK snapshot, String.equals uses identity, String type checking, Compact Strings coder compatibility and internal value comparison; equal objects must obey the hashCode contract.',source_ids:['openjdk-string','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']},{claim_id:'reference-behavior',text:'Under the declared final MyString reference contract, generated independent tests verify exact char-sequence equality, equivalence laws, null/type boundaries, compatible hashing, defensive copying and HashMap behavior.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'compile exact candidate Solution.java; compile/run independent Reviewer.java against generated char-sequence oracle',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit unique review artifacts with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/content_build/answer_batch_0042/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0042/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json"
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0042 String equals candidate source-first'
          for attempt in 1 2 3; do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH"; then
              git rebase --abort || true
              echo 'Content branch changed on the same review artifacts; fail closed.' >&2
              exit 1
            fi
            if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            sleep 5
          done
          echo 'Unable to push String-equals review artifacts after safe retries.' >&2
          exit 1
