name: Audit Content Batch 0036 C System Bitness Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/audit-content-batch-0036-c-system-bitness-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-c-system-bitness-source-audit
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8759fdb2629c78e7f847052e43922d24

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Extract current context and source-first boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${out}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('C system-bitness canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          const sources=ctx.source_questions||[];
          if(sources.length<1) throw new Error('source question missing');
          const matching=sources.filter(q=>q.original_question==='如何用 C 语言判断当前 system 是 32 位还是 64 位？');
          if(matching.length<1) throw new Error(`expected source wording missing: ${JSON.stringify(sources.map(q=>({qid:q.question_id,text:q.original_question})))}`);

          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const neighborhood=questions.filter(q=>q.is_valid_for_library!==false && /(?:32\s*位.*64\s*位|64\s*位.*32\s*位)/.test(q.original_question||'') && /(?:C\s*语言|system|pointer|指针)/i.test(`${q.original_question||''} ${(q.tech_entities||[]).join(' ')}`));
          const facts={
            schema_version:'source_boundary_audit.v1',canonical_id:cid,audited_at:'2026-08-26',
            canonical_question_ids:[...(ctx.canonical?.question_ids||[])],
            source_questions:sources.map(q=>({question_id:q.question_id,original_question:q.original_question,source_note_id:q.source_note_id??null,source_question_index:q.source_question_index??null})),
            corpus_neighborhood:neighborhood.map(q=>({question_id:q.question_id,canonical_id:q.canonical_id,original_question:q.original_question,source_note_id:q.source_note_id??null})),
            source_preserves:['request to use C language','wording asks whether current system is 32-bit or 64-bit'],
            source_does_not_define:['whether system means compiled-process ABI, operating-system kernel, or CPU capability','required portability scope','exact API/output format','whether compiler predefined macros or platform APIs are allowed'],
            conclusion:'recoverable_with_semantic_boundary: answer must distinguish portable C facts about the compiled program data model/pointer representation from host OS or CPU bitness, and must not present a single sizeof-based probe as a portable OS-bitness detector'
          };
          fs.writeFileSync(`${out}/source_boundary_audit.json`,JSON.stringify(facts,null,2)+'\n');
          const lines=[
            '# C System Bitness Source-First Boundary Audit','',
            '## Primary-source facts','',
            ...sources.map(q=>`- \`${q.question_id}\`: “${q.original_question}”`),
            '',
            `- Current Canonical ownership: ${JSON.stringify(ctx.canonical?.question_ids||[])}.`,
            `- Corpus near-neighborhood candidates under the narrow 32/64 + C/system/pointer query: ${neighborhood.length}.`,
            '',
            '## Boundary conclusion','',
            '- The source is recoverable as a conceptual/C-code question, but the word `system` is not defined precisely enough to equate “32/64-bit system” with one C object size.',
            '- A source-bounded answer must separate the current compiled program/ABI pointer representation from OS-kernel bitness and CPU capability.',
            '- The source does not preserve a required function signature, output format, compiler family, predefined-macro policy, or platform API.',
            '- Therefore any executable sample must label its interpretation explicitly and must not claim that standard C alone portably identifies host OS or CPU bitness.',
            '',
            'No historical answer/remediation record was consulted before this conclusion.',''
          ];
          fs.writeFileSync(`${out}/source_boundary_audit.md`,lines.join('\n'));

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [ ] `cq_q_8759fdb2629c78e7f847052e43922d24` C system-bitness source boundary is source-first audited: the wording is recoverable but leaves `system` ambiguous between compiled-process ABI/pointer representation, OS kernel, and CPU capability. Any rebuilt answer must distinguish those meanings and must not present a `sizeof` probe as a portable host-OS-bitness detector; candidate/reviewer work remains pending.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Run integrity gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during C system-bitness source audit: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git config user.name 'xhs-source-audit-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: audit C system-bitness source boundary'
          git push origin "HEAD:$CONTENT_BRANCH"
