          const fs=require('fs'),path=require('path');
          const cid=process.env.CANONICAL_ID,noteQid=process.env.SOURCE_NOTE_QID,note=process.env.SOURCE_NOTE;
          const expected='算法：业务场景题（购物车合并）？';
