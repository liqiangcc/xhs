name: Content Batch 0015

on:
  push:
    branches:
      - content/quality-completion
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate reverse-between candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_12ddfcc24143adac1b20b63f547516e7
        run: |
          javac ReverseBetween.java ReverseBetweenTest.java
          java ReverseBetweenTest

      - name: Audit completed reverse-between candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_12ddfcc24143adac1b20b63f547516e7.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate three-array median candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_149617b44a4092a42317fcdc4912ca2d
        run: |
          javac MedianOfThreeSortedArrays.java MedianOfThreeSortedArraysTest.java
          java MedianOfThreeSortedArraysTest

      - name: Audit completed three-array median candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_149617b44a4092a42317fcdc4912ca2d.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate Fibonacci-string candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_1547f601c5bd6746da03d6b3cc246ee8
        run: |
          javac FibonacciString.java FibonacciStringTest.java
          java FibonacciStringTest

      - name: Audit completed Fibonacci-string candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_1547f601c5bd6746da03d6b3cc246ee8.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate inputs are immutable under validation
        run: |
          git diff --exit-code -- \
            review/candidates/answers/cq_q_12ddfcc24143adac1b20b63f547516e7.md \
            review/candidates/answers/cq_q_149617b44a4092a42317fcdc4912ca2d.md \
            review/candidates/answers/cq_q_1547f601c5bd6746da03d6b3cc246ee8.md \
            review/content_build/answer_batch_0015 \
            review/evidence/cq_q_12ddfcc24143adac1b20b63f547516e7.json \
            review/evidence/cq_q_149617b44a4092a42317fcdc4912ca2d.json \
            review/evidence/cq_q_1547f601c5bd6746da03d6b3cc246ee8.json
