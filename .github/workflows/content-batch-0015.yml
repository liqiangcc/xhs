name: Content Batch 0015

on:
  push:
    branches:
      - content/quality-completion
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  remediate-go-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Add Go support to shared answer audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/answer_quality.js')
          text = path.read_text()
          if '(java|sql|javascript|js|go)' in text and 'function compileGo(code)' in text and '(?:java|sql|javascript|js|go)' in text:
              print('Go answer-audit support already present')
              raise SystemExit(0)

          old = '(java|sql|javascript|js)'
          if old not in text:
              raise SystemExit('extractCodeBlocks language group not found')
          text = text.replace(old, '(java|sql|javascript|js|go)', 1)

          marker = '\nfunction parseSql(code) {'
          if marker not in text:
              raise SystemExit('parseSql insertion point not found')
          compile_go = r'''

function compileGo(code) {
    const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'xhs-answer-go-'));
    try {
        const filePath = path.join(tempDir, 'answer.go');
        fs.writeFileSync(filePath, code, 'utf8');
        const result = childProcess.spawnSync('go', ['test', filePath], {
            encoding: 'utf8',
            timeout: 10000,
        });
        if (result.error?.code === 'ENOENT') return { ok: false, error: 'go_not_available' };
        if (result.error) return { ok: false, error: 'go_compile_failed', detail: result.error.message };
        if (result.status !== 0) {
            return {
                ok: false,
                error: 'go_compile_failed',
                detail: String(result.stderr || result.stdout || '').trim().slice(0, 1200),
            };
        }
        return { ok: true };
    } finally {
        fs.rmSync(tempDir, { recursive: true, force: true });
    }
}
'''
          text = text.replace(marker, compile_go + marker, 1)

          old_dispatch = """            const validation = block.language === 'java'
                ? compileJava(block.code)
                : block.language === 'sql'
                    ? parseSql(block.code)
                    : parseJavaScript(block.code);"""
          new_dispatch = """            const validation = block.language === 'java'
                ? compileJava(block.code)
                : block.language === 'sql'
                    ? parseSql(block.code)
                    : block.language === 'go'
                        ? compileGo(block.code)
                        : parseJavaScript(block.code);"""
          if old_dispatch not in text:
              raise SystemExit('coding validation dispatch not found')
          text = text.replace(old_dispatch, new_dispatch, 1)

          selector = '(?:java|sql|javascript|js)'
          if selector not in text:
              raise SystemExit('require-code selector language group not found')
          text = text.replace(selector, '(?:java|sql|javascript|js|go)', 1)
          path.write_text(text)

          test_path = Path('test/answer_candidate.test.js')
          tests = test_path.read_text()
          test_marker = "test('require-code accepts and compiles a Go coding candidate'"
          if test_marker not in tests:
              tests += r'''

test('require-code accepts and compiles a Go coding candidate', () => {
    const root = fs.mkdtempSync(path.join(os.tmpdir(), 'xhs-answer-go-candidate-'));
    writeJson(path.join(root, 'config', 'answer_quality.json'), QUALITY);
    writeJsonl(path.join(root, 'data', 'questions', 'canonical_questions.jsonl'), [{
        schema_version: 'canonical_question.v1', canonical_id: 'cq_go', canonical_title: '100 个 goroutine 依次打印 1-100',
        aliases: [], question_ids: ['q-go'], primary_domain: { l1: 'Go', l2: '并发' }, primary_entities: ['goroutine'],
        companies: [], frequency: 1, review_priority: 'P0', answer_status: 'needs_update',
    }]);
    writeJsonl(path.join(root, 'data', 'questions', 'questions.jsonl'), [{
        question_id: 'q-go', canonical_id: 'cq_go', original_question: '100个协程依次打印1-100', question_type: 'coding',
    }]);
    const candidateDir = path.join(root, 'review', 'candidates', 'answers');
    ensureDir(candidateDir);
    const candidatePath = path.join(candidateDir, 'cq_go.md');
    const sections = ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '项目经验版', '常见追问', '易错点'];
    const lines = [
        '<!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_go","version":1,"status":"draft","quality_tier":"candidate","answer_type":"coding","updated_at":"2026-08-22"} -->',
        '# 100 个 goroutine 依次打印 1-100',
    ];
    for (const title of sections) {
        lines.push('', `## ${title}`, '');
        if (title === '3 分钟版') lines.push('```go', 'package orderedprint', 'func Value() int { return 100 }', '```');
        else lines.push(`${title}的 Go 并发题目专属内容。`);
    }
    fs.writeFileSync(candidatePath, `${lines.join('\n')}\n`, 'utf8');

    const report = runAnswerAudit({ root, candidate: candidatePath, noWrite: true, 'require-code': true });
    assert.equal(report.candidate_count, 1);
    assert.equal(report.rows.length, 1);
    assert.equal(report.rows[0].errors.some((row) => row.error === 'coding_block_required'), false);
    assert.equal(report.rows[0].errors.some((row) => row.error === 'go_validation_failed'), false);
    assert.equal(report.rows[0].hard_failures.includes('placeholder_implementation'), false);
    fs.rmSync(root, { recursive: true, force: true });
});
'''
              test_path.write_text(tests)
          PY

          if git diff --quiet -- scripts/lib/answer_quality.js test/answer_candidate.test.js; then
            echo 'No Go audit remediation needed.'
            exit 0
          fi

          node --test test/answer_candidate.test.js
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_187c619f3c62046184546a4f04cc40f2.md \
            --require-evidence \
            --require-code \
            --noWrite

          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add scripts/lib/answer_quality.js test/answer_candidate.test.js
          git diff --cached --check
          git commit -m "fix(answer): support Go coding candidates in shared audit"
          git push origin HEAD:content/quality-completion

  candidate-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go 1.26.6
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
          cache: false

      - name: Validate reverse-between candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_12ddfcc24143adac1b20b63f547516e7
        run: |
          javac ReverseBetween.java ReverseBetweenTest.java
          java ReverseBetweenTest

      - name: Audit completed reverse-between candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_12ddfcc24143adac1b20b63f547516e7.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate three-array median candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_149617b44a4092a42317fcdc4912ca2d
        run: |
          javac MedianOfThreeSortedArrays.java MedianOfThreeSortedArraysTest.java
          java MedianOfThreeSortedArraysTest

      - name: Audit completed three-array median candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_149617b44a4092a42317fcdc4912ca2d.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate Fibonacci-string candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_1547f601c5bd6746da03d6b3cc246ee8
        run: |
          javac FibonacciString.java FibonacciStringTest.java
          java FibonacciStringTest

      - name: Audit completed Fibonacci-string candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_1547f601c5bd6746da03d6b3cc246ee8.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate per-day Top 2 SQL candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_17b558215583de1ad3b47eda00479a00
        run: |
          python3 Top2PerDayTest.py

      - name: Audit completed per-day Top 2 SQL candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_17b558215583de1ad3b47eda00479a00.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate render-visible usePrevious candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_1b54beec356cebaa5bf68b8935cb9e0a
        run: |
          node --check UsePrevious.mjs
          node UsePreviousStateModelTest.js

      - name: Audit completed render-visible usePrevious candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_1b54beec356cebaa5bf68b8935cb9e0a.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate ordered goroutine candidate fixture
        working-directory: review/content_build/answer_batch_0015/cq_q_187c619f3c62046184546a4f04cc40f2
        run: |
          go test -race -count=20 OrderedPrint.go OrderedPrint_test.go

      - name: Verify ordered goroutine source-language and concurrency gates
        run: |
          node - <<'NODE'
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          const candidatePath = 'review/candidates/answers/cq_q_187c619f3c62046184546a4f04cc40f2.md';
          const evidencePath = 'review/evidence/cq_q_187c619f3c62046184546a4f04cc40f2.json';
          const reviewPath = 'review/content_build/answer_batch_0015/cq_q_187c619f3c62046184546a4f04cc40f2/concurrency_review_result.json';
          const candidate = fs.readFileSync(candidatePath, 'utf8');
          const candidateHash = crypto.createHash('sha256').update(candidate).digest('hex');
          const evidence = JSON.parse(fs.readFileSync(evidencePath, 'utf8'));
          const review = JSON.parse(fs.readFileSync(reviewPath, 'utf8'));
          if (!/(?:```|~~~)go\b/i.test(candidate)) throw new Error('runnable Go code fence missing');
          if (evidence.candidate_sha256 !== candidateHash) throw new Error('evidence candidate hash mismatch');
          if (evidence.validation?.result !== 'pass') throw new Error('Go validation evidence did not pass');
          if (!String(evidence.validation?.command || '').includes('go test -race')) throw new Error('Go race command missing from evidence');
          if (review.schema_version !== 'concurrency_review.v1') throw new Error('invalid concurrency review schema');
          if (review.canonical_id !== 'cq_q_187c619f3c62046184546a4f04cc40f2') throw new Error('canonical mismatch');
          if (review.candidate_sha256 !== candidateHash) throw new Error('concurrency review candidate hash mismatch');
          if (review.decision !== 'pass') throw new Error('concurrency review did not pass');
          if (!Array.isArray(review.open_findings) || review.open_findings.length !== 0) throw new Error('open concurrency findings remain');
          if (review.concurrency_model?.race_detector !== 'pass') throw new Error('race detector evidence missing');
          NODE

      - name: Audit completed ordered goroutine candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_187c619f3c62046184546a4f04cc40f2.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate inputs are immutable under validation
        run: |
          git diff --exit-code -- \
            review/candidates/answers/cq_q_12ddfcc24143adac1b20b63f547516e7.md \
            review/candidates/answers/cq_q_149617b44a4092a42317fcdc4912ca2d.md \
            review/candidates/answers/cq_q_1547f601c5bd6746da03d6b3cc246ee8.md \
            review/candidates/answers/cq_q_17b558215583de1ad3b47eda00479a00.md \
            review/candidates/answers/cq_q_1b54beec356cebaa5bf68b8935cb9e0a.md \
            review/candidates/answers/cq_q_187c619f3c62046184546a4f04cc40f2.md \
            review/content_build/answer_batch_0015 \
            review/evidence/cq_q_12ddfcc24143adac1b20b63f547516e7.json \
            review/evidence/cq_q_149617b44a4092a42317fcdc4912ca2d.json \
            review/evidence/cq_q_1547f601c5bd6746da03d6b3cc246ee8.json \
            review/evidence/cq_q_17b558215583de1ad3b47eda00479a00.json \
            review/evidence/cq_q_1b54beec356cebaa5bf68b8935cb9e0a.json \
            review/evidence/cq_q_187c619f3c62046184546a4f04cc40f2.json
