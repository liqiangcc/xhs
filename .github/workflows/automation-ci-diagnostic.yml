name: Automation CI Diagnostic

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/automation-ci-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture CI diagnostics
        shell: bash
        run: |
          set +e
          REPORT="$RUNNER_TEMP/AUTOMATION_CI_DIAGNOSTIC.txt"
          : > "$REPORT"
          run_cmd() {
            name="$1"; shift
            printf '\n===== %s =====\n' "$name" >> "$REPORT"
            "$@" >> "$REPORT" 2>&1
            code=$?
            printf '\nEXIT_CODE=%s\n' "$code" >> "$REPORT"
          }
          run_cmd ci_check npm run ci:check
          run_cmd pilot_audit node scripts/content/build_pilot_answer_audit.js --check
          run_cmd semantic npm run ci:answer:semantic
          run_cmd evidence npm run ci:answer:evidence
          run_cmd code npm run ci:answer:code
          run_cmd coverage npm run ci:answer:coverage
          run_cmd gc node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_gc_algorithms_3f884748.md --require-evidence --noWrite
          run_cmd deep_copy node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_deep_copy_5cfb8eb4.md --require-evidence --noWrite
          run_cmd java_oop node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_java_oop_21912814.md --require-evidence --noWrite
          run_cmd language_compilation node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_language_compilation_0a002e6b.md --require-evidence --noWrite
          run_cmd linux_commands node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_linux_commands_76aadb5b.md --require-evidence --noWrite
          run_cmd mysql_isolation node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_mysql_isolation_c43c6784.md --require-evidence --noWrite
          run_cmd rocketmq_arch node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_rocketmq_arch_22d7b629.md --require-evidence --noWrite
          run_cmd lps node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05ef104a850cbc33126f5c746e00171c.md --require-evidence --require-code --noWrite
          run_cmd coin_change node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_3f52d557f29ac6552e5dc5f5e940f810.md --require-evidence --require-code --noWrite
          run_cmd reorder_list node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_5856fb8727752874f2e1c6d8a3832d67.md --require-evidence --require-code --noWrite
          run_cmd swap_pairs node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0fdff883609d352de9fa841f0a635925.md --require-evidence --require-code --noWrite
          run_cmd git_diff git diff --exit-code
          mkdir -p review/reports
          cp "$REPORT" review/reports/AUTOMATION_CI_DIAGNOSTIC.txt
      - name: Commit diagnostic report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add review/reports/AUTOMATION_CI_DIAGNOSTIC.txt
          git commit -m "ci: refresh current content CI diagnostics"
          git push origin HEAD:content/quality-completion
