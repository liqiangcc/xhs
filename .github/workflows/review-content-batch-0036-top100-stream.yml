name: Review Content Batch 0036 Top100 Stream Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0036-top100-stream.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0036-top100-stream-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_87c935cb9773c23c5088879578e95a82
  SOURCE_QID: 87c935cb9773c23c5088879578e95a82
  SOURCE_TAGGED: note_tagged/680e66cb0000000023012aa3.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "implementation_sha256=$(sha256sum review/content_build/answer_batch_0036/$CANONICAL_ID/TopKStream.java | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review and independent full-sort oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0036/$cid"; candidate="review/candidates/answers/$cid.md"
          rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"

          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：千亿数组Top100';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('source question drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift ${h}`);
          for(const marker of ['PrimitiveIterator.OfLong','O(n log K)','O(K)','重复值','分布式扩展','小顶堆']) if(!md.includes(marker)) throw new Error(`semantic marker missing ${marker}`);
          if(!md.includes('题目只保留了')||!md.includes('这里采用明确的回答契约')) throw new Error('source/answer-side contract boundary missing');
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责|我优化到/.test(md)) throw new Error('fabricated project claim');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public final class TopKStream')) throw new Error('complete Java class missing');
          fs.writeFileSync(`review/content_build/answer_batch_0036/${cid}/reviewer_tmp/TopKStream.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/TopKStreamReviewerTest.java" <<'JAVA'
          import java.util.Arrays;
          import java.util.PrimitiveIterator;
          import java.util.Random;
          import java.util.stream.LongStream;

          public final class TopKStreamReviewerTest {
              private static long exhaustiveArrays;
              private static long exhaustiveCalls;
              private static long randomCases;
              private static long partitionCases;

              public static void main(String[] args) {
                  for (int length = 0; length <= 6; length++) enumerate(new long[length], 0);
                  if (exhaustiveArrays != 19531L) throw new AssertionError("unexpected exhaustive array count=" + exhaustiveArrays);

                  Random r = new Random(0x87C935CB9773L);
                  for (int c = 0; c < 5000; c++) {
                      int n = r.nextInt(201);
                      long[] a = new long[n];
                      for (int i = 0; i < n; i++) a[i] = r.nextInt(101) - 50;
                      int k = r.nextInt(221);
                      check(a, k);
                      randomCases++;
                  }

                  check(new long[] {Long.MIN_VALUE, Long.MAX_VALUE, 0, Long.MIN_VALUE, Long.MAX_VALUE}, 1);
                  check(new long[] {Long.MIN_VALUE, Long.MAX_VALUE, 0, Long.MIN_VALUE, Long.MAX_VALUE}, 3);
                  check(new long[] {7,7,7,7,7,7}, 4);
                  check(new long[] {}, 100);
                  check(new long[] {3,1,2}, 100);

                  boolean nullThrew=false;
                  try { TopKStream.largestK(null, 1); } catch (IllegalArgumentException e) { nullThrew=true; }
                  if(!nullThrew) throw new AssertionError("null input must reject under declared answer contract");
                  boolean negativeThrew=false;
                  try { TopKStream.largestK(LongStream.of(1).iterator(), -1); } catch (IllegalArgumentException e) { negativeThrew=true; }
                  if(!negativeThrew) throw new AssertionError("negative k must reject under declared answer contract");

                  Random pr = new Random(0x10087C935CBL);
                  for (int c = 0; c < 1000; c++) {
                      int n = 1 + pr.nextInt(150);
                      long[] a = new long[n];
                      for (int i = 0; i < n; i++) a[i] = pr.nextInt(61) - 30;
                      int k = 1 + pr.nextInt(30);
                      int parts = 1 + pr.nextInt(Math.min(8, n));
                      long[][] chunks = split(a, parts);
                      long[] merged = new long[0];
                      for (long[] chunk : chunks) merged = concat(merged, TopKStream.largestK(Arrays.stream(chunk).iterator(), k));
                      long[] viaLocal = TopKStream.largestK(Arrays.stream(merged).iterator(), k);
                      long[] expected = oracle(a, k);
                      if(!Arrays.equals(viaLocal, expected)) throw new AssertionError("partition merge mismatch");
                      partitionCases++;
                  }

                  System.out.printf("PASS exhaustive_arrays=%d exhaustive_calls=%d random=%d partition=%d full_sort_oracle=pass duplicates=pass extremes=pass invalid=reject%n",
                      exhaustiveArrays, exhaustiveCalls, randomCases, partitionCases);
              }

              private static void enumerate(long[] a, int pos) {
                  if (pos == a.length) {
                      for (int k = 0; k <= 8; k++) { check(a, k); exhaustiveCalls++; }
                      exhaustiveArrays++;
                      return;
                  }
                  for (long v = -2; v <= 2; v++) { a[pos] = v; enumerate(a, pos + 1); }
              }

              private static void check(long[] source, int k) {
                  long[] actual = TopKStream.largestK(Arrays.stream(source).iterator(), k);
                  long[] expected = oracle(source, k);
                  if (!Arrays.equals(actual, expected)) throw new AssertionError("source="+Arrays.toString(source)+" k="+k+" actual="+Arrays.toString(actual)+" expected="+Arrays.toString(expected));
              }

              private static long[] oracle(long[] source, int k) {
                  long[] sorted = source.clone();
                  Arrays.sort(sorted);
                  int size = Math.min(k, sorted.length);
                  long[] expected = new long[size];
                  for (int i = 0; i < size; i++) expected[i] = sorted[sorted.length - 1 - i];
                  return expected;
              }

              private static long[][] split(long[] source, int parts) {
                  long[][] result = new long[parts][];
                  int base = source.length / parts, extra = source.length % parts, p = 0;
                  for (int i = 0; i < parts; i++) {
                      int len = base + (i < extra ? 1 : 0);
                      result[i] = Arrays.copyOfRange(source, p, p + len);
                      p += len;
                  }
                  return result;
              }

              private static long[] concat(long[] a, long[] b) {
                  long[] r = Arrays.copyOf(a, a.length + b.length);
                  System.arraycopy(b, 0, r, a.length, b.length);
                  return r;
              }
          }
          JAVA
          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror TopKStream.java TopKStreamReviewerTest.java && java TopKStreamReviewerTest > stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/stdout.txt")"
          test "$stdout" = 'PASS exhaustive_arrays=19531 exhaustive_calls=175779 random=5000 partition=1000 full_sort_oracle=pass duplicates=pass extremes=pass invalid=reject'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved repository source says only “算法：千亿数组Top100”; it does not specify largest versus smallest, distinctness, element type, result ordering, storage topology, or API.',
            'The candidate preserves that sparse source boundary and explicitly labels largest values, duplicate-preserving multiset semantics, sequential long input, descending result order, and Java as answer-side contracts rather than source facts.',
            'The min-heap invariant is correct: after each consumed prefix, a full heap contains the largest K values from that prefix under the declared multiset contract, with the root as the weakest retained candidate.',
            'Dropping a value equal to the current heap minimum remains correct for value-multiset TopK because replacing one retained threshold value by an equal value leaves the result multiset unchanged.',
            'The complete Java class is runnable, returns descending output, handles K=0 and K larger than the input, preserves duplicate values, and its O(n log K) time plus O(K) auxiliary-space claims match the implementation.',
            'Reviewer-owned validation extracts the exact candidate Java fence and compares it with an independent full-sort oracle across all 19,531 arrays of length 0..6 over values -2..2 for K=0..8, 5,000 seeded randomized cases, long extremes, and declared invalid-input boundaries.',
            'A separate 1,000-case randomized partition test confirms the stated mergeability property: local TopK candidates from every partition are sufficient to reconstruct the direct global TopK under the same declared contract.',
            'No fabricated production experience, placeholder implementation, cross-topic contamination, or uncovered source variant was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract exact candidate Java; javac -Xlint:all -Werror; compare candidate output to independent full-sort oracle plus partition-merge checks',stdout:process.env.REVIEW_STDOUT,checks:['exact candidate Java compiles with warnings as errors','19531 exhaustive arrays x K=0..8 match full-sort oracle','5000 seeded randomized arrays match full-sort oracle','duplicate and long-extreme boundaries match oracle','declared null and negative-k contracts reject','1000 randomized partition/local-TopK merge cases match direct global oracle'],boundary_tests:[{case:'K=0',expected:'return empty result without consuming a result candidate',passed:true},{case:'K greater than input length',expected:'return all input values in descending order',passed:true},{case:'equal-to-threshold duplicate',expected:'value multiset remains a valid largest-K multiset',passed:true},{case:'partitioned input',expected:'TopK of local TopK union equals direct global TopK',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-top100-stream-20260826-v1',review_version:'top100.full-sort-oracle-and-merge.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_TAGGED,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after independent conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const wr=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||wr.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('review/evidence prerequisite drift');
          if(wv.candidate_sha256!==hash) throw new Error('writer candidate binding drift');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'top100-stream-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-source',title:'Repository tagged Top100 interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer candidate-exact TopK validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent full-sort and partition-merge validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh isolated source-first review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source requires only a Top100 solution at thousand-hundred-million scale; largest/smallest, distinctness, type, ordering, storage, and API are not specified.',source_ids:['tagged-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'topk-correctness',text:'Under the explicit largest-K-with-duplicates sequential-input contract, the exact candidate Java fence matches an independent full-sort oracle across exhaustive, randomized, duplicate, extreme, and K-boundary cases.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']},{claim_id:'mergeability',text:'Under the same contract, taking local TopK per partition and then TopK over the local candidates preserves the direct global TopK.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['关键细节','原理机制','常见追问']},{claim_id:'complexity',text:'The implementation performs one sequential pass and maintains at most K heap values, so CPU time is O(n log K) with O(K) auxiliary memory, excluding source I/O.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['1 分钟版','关键细节']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Update task and commit review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0036/$CANONICAL_ID/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'); const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let t=fs.readFileSync(task,'utf8');
          const pending='- `cq_q_87c935cb9773c23c5088879578e95a82` Top100 candidate preserves the minimal “千亿数组Top100” source boundary, labels largest/duplicates/sequential-input/result-order semantics as answer-side contracts, contains a complete primitive min-heap Java class, and passes fixed plus 5000 seeded writer comparisons; isolated review and promotion gates remain pending.';
          const done='- [x] `cq_q_87c935cb9773c23c5088879578e95a82` Top100 candidate preserves the minimal “千亿数组Top100” source boundary, labels largest/duplicates/sequential-input/result-order semantics as answer-side contracts, contains a complete primitive min-heap Java class, passes exhaustive plus 5000 seeded writer/reviewer oracle checks and randomized partition-merge validation, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!t.includes(pending)) throw new Error('pending task line drift');
          t=t.replace(pending,done); fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-review-bot
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add "review/content_build/answer_batch_0036/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0036/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md
          git commit -m "review: pass batch 0036 Top100 stream candidate source-first"
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse "origin/$CONTENT_BRANCH")" = "${{ steps.base.outputs.head }}" || { echo 'content branch moved during review' >&2; exit 1; }
          git push origin HEAD:"$CONTENT_BRANCH"
