name: Review Content Batch 0036 Balanced Tree

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0036-balanced-tree.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-balanced-tree-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8509e1e25a56c5905f82c1a4ca78c605
  SOURCE_QID: 8509e1e25a56c5905f82c1a4ca78c605

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and oracle rerun
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          source_file='note_tagged/66b0762800000000250337ee.json'
          javac "$out/BalancedBinaryTreeValidation.java"
          stdout="$(java -cp "$out" BalancedBinaryTreeValidation)"
          test "$stdout" = 'PASS fixed=8 randomized=5000 oracle=independent-recomputed-height balanced=1003 unbalanced=3997 empty=true internal-imbalance=true linear-sentinel=true'

          STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const sourceFile='note_tagged/66b0762800000000250337ee.json';
          const note=JSON.parse(fs.readFileSync(sourceFile,'utf8'));
          const src=(note.tagged_questions||[]).find(q=>q.question_id===qid);
          const expected='算法：判断一棵树是否为平衡二叉树。';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          if(src.question_type!=='算法手撕_Coding') throw new Error(`source type drifted: ${src?.question_type}`);
          const md=fs.readFileSync(candidate,'utf8');
          for(const marker of ['public final class BalancedBinaryTree','heightIfBalanced','Math.abs(leftHeight - rightHeight) > 1','这里只判断高度平衡，不额外要求 BST 有序性','O(n)']) {
            if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          }
          if((md.match(/- 问：/g)||[]).length<6) throw new Error('question-specific followups missing');
          if(/真实项目里我|线上事故|我们生产|实际线上/.test(md)) throw new Error('fabricated project-experience language detected');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error('writer state drifted');
          if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error('source coverage missing');
          const validation=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8'));
          if(validation.result!=='pass'||validation.stdout!==process.env.STDOUT) throw new Error('validation drifted');
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-balanced-tree-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source asks only to determine whether a tree is a balanced binary tree and does not preserve a formal balance definition, language/API, empty-tree rule, or AVL/BST ordering requirement.',
            'The candidate explicitly adopts the standard height-balanced interpretation and separates it from AVL/BST validity instead of inventing source constraints.',
            'The postorder sentinel invariant combines height computation and failure propagation so each visited node is processed once.',
            'Fresh executable validation covers fixed boundaries and 5000 deterministic randomized trees against an independent oracle that recomputes child heights.',
            'The corpus includes both balanced and unbalanced trees and a case where equal root-side heights mask deeper internal imbalance.',
            'The stated O(n) time and O(h) recursion-space bounds match the implementation, with the O(n^2) repeated-height alternative correctly identified as avoidable.',
            'No fabricated project experience or unrelated generated-baseline content remains.'
          ];
          const reviewPath=`${out}/isolated_review_result.json`;
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'balanced-tree.v1',decision:'pass',revision_round:1,source_packet:[sourceFile,candidate,`${out}/writer_research.json`,`${out}/code_validation.json`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'balanced-tree-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Didi backend interview note exact balanced-binary-tree prompt',locator:`${sourceFile}#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'validation',title:'Fresh height-sentinel versus recomputed-height oracle validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source asks only whether a tree is balanced; formal balance definition, API, empty behavior and AVL/BST ordering are not preserved source constraints.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'candidate-contract',text:'The candidate explicitly adopts standard height-balance semantics and does not add BST ordering.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节','常见追问']},{claim_id:'oracle-validation',text:'Fixed cases and 5000 randomized trees exactly match an independent recomputed-height oracle, including hidden internal imbalance.',source_ids:['validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:validation.command,result:'pass',reported_stdout:process.env.STDOUT,checks:validation.checks,boundary_tests:validation.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'balanced-tree.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_8509e1e25a56c5905f82c1a4ca78c605` balanced-binary-tree source is recoverable only as “determine whether a tree is balanced”. The candidate explicitly adopts standard height-balance semantics without inventing BST/AVL ordering requirements, supplies a complete Java bottom-up height-sentinel implementation, and passes fixed edge cases plus 5000 randomized trees against an independent recomputed-height oracle, including internal imbalance masked by equal root-side heights. Writer research is frozen; isolated independent source-first review remains pending before promotion.';
          const passed='- [x] `cq_q_8509e1e25a56c5905f82c1a4ca78c605` balanced-binary-tree candidate preserves the minimal recoverable source boundary, explicitly adopts standard height-balance without inventing BST/AVL ordering, supplies complete Java postorder sentinel logic, passes fixed plus 5000 randomized cases against an independent recomputed-height oracle, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$out/code_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0036 balanced-tree source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
