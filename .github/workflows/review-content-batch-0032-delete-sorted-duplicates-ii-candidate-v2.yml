name: Review Content Batch 0032 Delete Sorted Duplicates II Candidate V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0032-delete-sorted-duplicates-ii-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0032-delete-sorted-duplicates-ii-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_73de3e043d9f163144c400e4e1e7dff3
  SOURCE_QID: 73de3e043d9f163144c400e4e1e7dff3
  CANDIDATE_BLOB_SHA: c9b8531415fe6549f909db7a4f3e24505aa7d1eb

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          test -f "review/reports/ANSWER_BATCH_${BATCH}_SOURCE_PACKET.json"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          test -f "$out/code_validation.json"
          test -f "$out/writer_research.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const expected='算法：删除排序链表中的重复元素 II (LeetCode 82)';
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=(packet.canonicals||[]).find(x=>x.canonical_id===cid);
          if(!entry) throw new Error('source packet member missing');
          const exact=(entry.source_hits||[]).filter(h=>h?.match_basis==='question_id'&&h?.tagged_question?.question_id===qid);
          if(exact.length!==1) throw new Error(`expected one exact source hit, got ${exact.length}`);
          const q=exact[0].tagged_question;
          if(q?.original_question!==expected||q?.is_valid_for_library!==true) throw new Error('exact source drifted');
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['public final class Solution','public ListNode deleteDuplicates','LeetCode 82','按值非递减排序','dummy -> head','boolean duplicated = false','prev.next = cur.next','时间复杂度 `O(n)`','额外空间 `O(1)`','不虚构生产经历'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|按本题约束填写|长尾复习底稿|TODO|待补/.test(text)) throw new Error('placeholder/template residue detected');
          NODE

      - name: Compile actual candidate and run independent oracle
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const text=fs.readFileSync(`review/candidates/answers/${process.env.CANONICAL_ID}.md`,'utf8');
          const m=text.match(/```java\s*\n([\s\S]*?)\n```/);
          if(!m) throw new Error('Java candidate block missing');
          if(!/public\s+final\s+class\s+Solution/.test(m[1])) throw new Error('candidate is not a standalone Solution class');
          fs.writeFileSync('/tmp/Solution.java',m[1]+'\n');
          NODE
          cat >/tmp/IndependentReview.java <<'JAVA'
          import java.util.*;

          public final class IndependentReview {
              private static final class Built {
                  Solution.ListNode head;
                  final List<Solution.ListNode> nodes = new ArrayList<>();
              }

              private static Built build(int[] values) {
                  Built b = new Built();
                  Solution.ListNode tail = null;
                  for (int value : values) {
                      Solution.ListNode n = new Solution.ListNode(value);
                      b.nodes.add(n);
                      if (tail == null) b.head = n;
                      else tail.next = n;
                      tail = n;
                  }
                  return b;
              }

              private static List<Integer> expectedValues(int[] values) {
                  List<Integer> out = new ArrayList<>();
                  for (int i = 0; i < values.length;) {
                      int j = i + 1;
                      while (j < values.length && values[j] == values[i]) j++;
                      if (j - i == 1) out.add(values[i]);
                      i = j;
                  }
                  return out;
              }

              private static List<Solution.ListNode> expectedNodes(Built b, int[] values) {
                  List<Solution.ListNode> out = new ArrayList<>();
                  for (int i = 0; i < values.length;) {
                      int j = i + 1;
                      while (j < values.length && values[j] == values[i]) j++;
                      if (j - i == 1) out.add(b.nodes.get(i));
                      i = j;
                  }
                  return out;
              }

              private static void check(int[] values) {
                  for (int i = 1; i < values.length; i++) if (values[i - 1] > values[i]) throw new AssertionError("review input must be sorted");
                  Built b = build(values);
                  List<Integer> expectedValues = expectedValues(values);
                  List<Solution.ListNode> expectedNodes = expectedNodes(b, values);
                  Solution.ListNode result = new Solution().deleteDuplicates(b.head);
                  List<Integer> actualValues = new ArrayList<>();
                  List<Solution.ListNode> actualNodes = new ArrayList<>();
                  Set<Solution.ListNode> seen = Collections.newSetFromMap(new IdentityHashMap<>());
                  for (Solution.ListNode p = result; p != null; p = p.next) {
                      if (!seen.add(p)) throw new AssertionError("cycle in result");
                      actualValues.add(p.val);
                      actualNodes.add(p);
                      if (actualNodes.size() > values.length) throw new AssertionError("result longer than input");
                  }
                  if (!actualValues.equals(expectedValues)) throw new AssertionError("values=" + Arrays.toString(values) + " got=" + actualValues + " expected=" + expectedValues);
                  if (actualNodes.size() != expectedNodes.size()) throw new AssertionError("node-count mismatch");
                  for (int i = 0; i < actualNodes.size(); i++) if (actualNodes.get(i) != expectedNodes.get(i)) throw new AssertionError("candidate did not reuse the original singleton node");
              }

              private static long exhaustive() {
                  int[] domain = {-3,-2,-1,0,1,2,3};
                  long[] count = {0};
                  int[] buf = new int[9];
                  for (int len = 0; len <= buf.length; len++) enumerate(domain, buf, 0, len, 0, count);
                  return count[0];
              }

              private static void enumerate(int[] domain, int[] buf, int pos, int len, int minIndex, long[] count) {
                  if (pos == len) {
                      check(Arrays.copyOf(buf, len));
                      count[0]++;
                      return;
                  }
                  for (int i = minIndex; i < domain.length; i++) {
                      buf[pos] = domain[i];
                      enumerate(domain, buf, pos + 1, len, i, count);
                  }
              }

              public static void main(String[] args) {
                  check(new int[]{});
                  check(new int[]{1});
                  check(new int[]{1,1});
                  check(new int[]{1,1,2,3,3});
                  check(new int[]{1,2,2,3,4,4,5});
                  check(new int[]{1,1,1,2,3});
                  check(new int[]{1,2,3,3,3});
                  check(new int[]{-3,-3,-2,-1,-1,0,2,2,3});
                  long exhaustive = exhaustive();
                  Random random = new Random(820026L);
                  for (int t = 0; t < 25000; t++) {
                      int n = random.nextInt(90);
                      int[] values = new int[n];
                      for (int i = 0; i < n; i++) values[i] = random.nextInt(31) - 15;
                      Arrays.sort(values);
                      check(values);
                  }
                  int[] large = new int[200000];
                  for (int i = 0; i < large.length; i++) large[i] = i / 3;
                  check(large);
                  System.out.println("PASS independent exhaustive=" + exhaustive + " random=25000 large=200000 exact-node-reuse acyclic standalone-java");
              }
          }
          JAVA
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java /tmp/IndependentReview.java
          stdout="$(java -cp /tmp IndependentReview)"
          echo "$stdout" | grep -Eq '^PASS independent exhaustive=[0-9]+ random=25000 large=200000 exact-node-reuse acyclic standalone-java$'
          echo "$stdout" | tee /tmp/independent-review.stdout

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,date='2026-08-26';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_${batch}/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const stdout=fs.readFileSync('/tmp/independent-review.stdout','utf8').trim();
          const validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'standalone Java compilation',expected:'the exact fenced code compiles as Solution.java without wrapper repair',actual:'pass',passed:true},
            {case:'empty/singleton',expected:'empty remains empty; singleton remains the same node',actual:'pass',passed:true},
            {case:'duplicate runs at head/middle/tail and runs longer than two',expected:'every node in a repeated-value run is removed',actual:'pass',passed:true},
            {case:'exhaustive sorted arrays over -3..3 through length 9',expected:'result equals independently computed singleton runs',actual:'all passed',passed:true},
            {case:'25,000 deterministic random sorted arrays',expected:'result equals independent run-length oracle',actual:'all passed',passed:true},
            {case:'identity/topology and 200,000-node input',expected:'exact original singleton nodes, acyclic output, non-recursive completion',actual:'all passed',passed:true}
          ];
          fs.writeFileSync(validationPath,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract exact Java fence to Solution.java; javac Solution.java IndependentReview.java; java IndependentReview',stdout,checks:['standalone Java fence','empty/singleton','head/middle/tail duplicate runs','long duplicate runs','exhaustive sorted inputs','25,000 deterministic random inputs','exact original-node reuse','acyclic result','200,000-node large input'],boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0032-delete-duplicates-ii-20260826-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The frozen repository source is an exact singleton Question identifying Delete Duplicates from Sorted List II / LeetCode 82; Java node shape, null handling, allocation and mutation policy are not preserved source constraints.',
            'The candidate labels those API/ownership choices as answer-side contracts rather than source facts.',
            'The previous review attempt exposed a real repository-gate defect: the Java fence had top-level members and failed the repository Java audit. The remediated candidate is now a standalone Solution class and compiles without reviewer wrapping.',
            'The algorithm correctly exploits sorted-run contiguity: duplicated runs leave prev fixed and reconnect prev.next after the full run, while singleton runs advance prev.',
            'An independently authored oracle compiles the exact candidate and checks 11,440 exhaustive sorted inputs, 25,000 deterministic random cases, exact original-node identity, acyclic output and a 200,000-node large case.',
            'The answer distinguishes LeetCode 82 from 83, states the sorted-input prerequisite, explains O(n) via monotonic pointer movement and does not fabricate project experience.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0032.delete-duplicates-ii.v2',decision:'pass',revision_round:1,source_packet:[`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0032-delete-duplicates-ii-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Batch 0032 exact source-first singleton boundary',locator:`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:date},{source_id:'independent-fixture',title:'Delete-duplicates-II standalone Java exhaustive/random oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Delete-duplicates-II remediated independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The exact source identifies sorted-list duplicate removal II / LeetCode 82; Java node shape, null behavior, allocation and mutation policy are not preserved source constraints.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm-behavior',text:'For nondecreasing input, the candidate classifies contiguous equal-value runs and reconnects around every run longer than one, leaving exactly singleton-value nodes.',source_ids:['independent-fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'runnability-and-boundaries',text:'The exact Java fence compiles standalone and independent execution covers head/middle/tail duplicate runs, exhaustive/random inputs, exact original-node reuse, acyclic output and a 200,000-node large case.',source_ids:['independent-fixture','isolated-review'],answer_locations:['3 分钟版','关键细节','常见追问','易错点']},{claim_id:'complexity',text:'cur moves only forward through the list and the implementation stores a dummy, prev, cur and a boolean, giving O(n) time and O(1) auxiliary space for finite sorted input.',source_ids:['isolated-review'],answer_locations:['1 分钟版','关键细节','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac exact candidate + independent reviewer oracle',result:'pass',reported_stdout:stdout,checks:['standalone Java','fixed boundaries','exhaustive sorted inputs','random sorted inputs','exact node identity','acyclic output','large input'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0032.delete-duplicates-ii.v2',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;
          let text=fs.readFileSync(task,'utf8');
          text=text.split(/\r?\n/).filter(line=>!(line.includes(`\`${cid}\``)&&line.includes('Independent source-first review still required'))).join('\n');
          if(!text.endsWith('\n')) text+='\n';
          const done=`- [x] \`${cid}\` candidate passed independent source-first review after runnable-Java remediation: exact LeetCode 82 singleton source identity is preserved; Java node/null/mutation choices remain explicit answer-side contracts; the exact fenced Solution compiles standalone and the reviewer independently checks exhaustive sorted inputs, 25,000 deterministic random cases, exact original-node reuse, acyclic output and a 200,000-node large case. Formal promotion remains governed by repository promotion and real-review policy.`;
          if(!text.includes(done)) text+=done+'\n';
          fs.writeFileSync(task,text);
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during delete-duplicates-II review; discard local review and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m "review: pass batch ${BATCH} delete-duplicates-II candidate after remediation"
          git push origin "HEAD:$CONTENT_BRANCH"
