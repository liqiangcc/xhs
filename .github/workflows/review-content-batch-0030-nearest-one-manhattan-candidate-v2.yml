name: Review Content Batch 0030 Nearest-One Manhattan Candidate V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0030-nearest-one-manhattan-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0030-nearest-one-manhattan-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6e200e154178aae3cd4320e22f0e44ec
  SOURCE_QID: 6e200e154178aae3cd4320e22f0e44ec
  CANDIDATE_BLOB_SHA: 52c1084e5db1b5a0e3b7b299351acb09b35fa1b0

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun validated oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0030/$CANONICAL_ID"
          test "$(git hash-object "review/candidates/answers/$CANONICAL_ID.md")" = "$CANDIDATE_BLOB_SHA"
          node - <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const source=(JSON.parse(fs.readFileSync('note_tagged/66589f330000000016013431.json','utf8')).tagged_questions||[]).find(x=>x.question_id===qid);
          if(!source||source.original_question!=='算法：二维数组求所有0距离最近的1的曼哈顿距离的最大值'||source.question_type!=='算法手撕_Coding') throw new Error('source drifted');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const needle of ['没有保存题号','不能悄悄套成某一道 LeetCode','多源 BFS','全是 0 怎么办','当前仓库来源没有保存这些信息']) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          NODE
          javac "$out/NearestOneMaxDistance.java" "$out/NearestOneMaxDistanceTest.java"
          test "$(java -cp "$out" NearestOneMaxDistanceTest)" = 'PASS fixed=6 randomized=7200 oracle=bruteforce-manhattan degenerate=explicit validation=yes'

      - name: Write review evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0030/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryPath=`${out}/source_boundary.json`,validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const boundaryTests=[
            {case:'single 1',expected:'0 under explicit no-zero helper convention',actual:'0',passed:true},
            {case:'single 0',expected:'-1 under explicit no-one helper convention',actual:'-1',passed:true},
            {case:'single row [1,0,0]',expected:'2',actual:'2',passed:true},
            {case:'single column [1,0,0,0]',expected:'3',actual:'3',passed:true},
            {case:'3x3 corner ones',expected:'2',actual:'2',passed:true},
            {case:'7200 deterministic random binary rectangles up to 6x6',expected:'multi-source BFS equals direct Manhattan enumeration',actual:'all passed',passed:true}
          ];
          fs.writeFileSync(boundaryPath,JSON.stringify({schema_version:'answer_source_boundary.v1',canonical_id:cid,checked_at:date,source_question_id:qid,source_wording:'算法：二维数组求所有0距离最近的1的曼哈顿距离的最大值',preserved:['two-dimensional array','zero cells','nearest one','Manhattan distance','maximum over per-zero nearest-one distances'],not_preserved:['problem number','matrix shape and size limits','binary-only guarantee','presence of both zero and one','degenerate return values','implementation language or algorithm'],answer_side_contract:{matrix:'non-empty rectangular binary matrix',all_one:'return 0 because there are no zero cells to evaluate',all_zero:'return -1 sentinel because nearest one is undefined',invalid:'reject empty/ragged/non-binary input'}},null,2)+'\n');
          fs.writeFileSync(validationPath,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'javac NearestOneMaxDistance.java NearestOneMaxDistanceTest.java && java NearestOneMaxDistanceTest',stdout:'PASS fixed=6 randomized=7200 oracle=bruteforce-manhattan degenerate=explicit validation=yes',checks:['fixed all-one/all-zero/row/column/rectangle boundaries','7200 deterministic random matrices','structurally different direct Manhattan oracle','empty/ragged/non-binary validation'],boundary_tests:boundaryTests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0030-nearest-one-manhattan-20260825-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The source preserves the two-stage max-of-nearest-Manhattan-distance objective but no problem number or degenerate-input contract.','The candidate explicitly separates recoverable source semantics from binary/rectangular/all-zero/all-one helper conventions.','Multi-source BFS is explained as shortest distance to a source set and first visitation establishes each zero cell’s nearest-one distance.','The exact Java implementation matches direct Manhattan enumeration on 7200 deterministic random rectangles plus fixed row/column/degenerate cases.','Complexity and max-of-min semantics are stated correctly.','No source constraint, problem number, project experience or production metric is fabricated.','Formal promotion remains governed by repository promotion, required human approval and real-review policy.'];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0030.nearest-one-manhattan.v2',decision:'pass',revision_round:1,source_packet:[boundaryPath,candidate,validationPath,'note_tagged/66589f330000000016013431.json','config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0030-nearest-one-manhattan-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Tagged repository nearest-one Manhattan-distance question',locator:`note_tagged/66589f330000000016013431.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Direct Manhattan-enumeration oracle fixture',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Nearest-one Manhattan independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-objective',text:'The source asks for the maximum, across zero cells, of each zero cell’s Manhattan distance to its nearest one; it does not preserve a problem number or degenerate-input policy.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节','常见追问','易错点']},{claim_id:'algorithm-correctness',text:'Under the explicit non-empty rectangular binary-matrix helper contract, the exact multi-source BFS matches direct Manhattan enumeration on fixed cases and 7200 deterministic random rectangles.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']},{claim_id:'answer-side-boundaries',text:'All-one/all-zero sentinel behavior and input validation are explicit helper conventions rather than reconstructed source requirements.',source_ids:['isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac NearestOneMaxDistance.java NearestOneMaxDistanceTest.java && java NearestOneMaxDistanceTest',result:'pass',reported_stdout:'PASS fixed=6 randomized=7200 oracle=bruteforce-manhattan degenerate=explicit validation=yes',checks:['fixed cases','7200 deterministic random rectangles','direct Manhattan oracle','validation boundaries'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0030.nearest-one-manhattan.v2',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md'; let text=fs.readFileSync(task,'utf8');
          const done='- [x] `cq_q_6e200e154178aae3cd4320e22f0e44ec` candidate passed independent source-first review without inventing a hidden problem contract: multi-source BFS matches direct Manhattan enumeration on 7200 deterministic random rectangles plus fixed/degenerate boundaries, while all-zero/all-one and validation behavior remain explicit answer-side conventions. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(done)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+done+'\n');
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced during review; discard local review and retry later."; exit 0; fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0030/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0030 nearest-one Manhattan candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
