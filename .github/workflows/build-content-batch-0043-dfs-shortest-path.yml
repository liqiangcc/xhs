          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live ownership/type drifted');
          NODE

      - name: Write source-bounded candidate and execute writer validation
        shell: bash
        run: |
          set -euo pipefail
