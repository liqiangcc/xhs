name: Build Content Batch 0043 DFS Shortest Path

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0043-dfs-shortest-path.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-dfs-shortest-path-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b0fbb220f5a52047eb85620c3e62c501
  SOURCE_QID: b0fbb220f5a52047eb85620c3e62c501

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
