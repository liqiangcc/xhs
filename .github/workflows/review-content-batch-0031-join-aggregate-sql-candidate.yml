name: Review Content Batch 0031 Join Aggregate SQL Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0031-join-aggregate-sql-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0031-join-aggregate-sql-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_70688148eb122f00c5e224c6cfb2d04e
  SOURCE_QID: 70688148eb122f00c5e224c6cfb2d04e
  CANDIDATE_BLOB_SHA: 25e2c30001134f0eafaa5ebc24dd03a26e3574a9

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and writer SQL validation
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0031/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node - <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='SQL实战技巧：如何利用多表JOIN与GROUP BY聚合函数，在高并发查询场景下准确提取业务分析指标？';
          const tagged=(JSON.parse(fs.readFileSync('note_tagged/686f75b600000000220333f1.json','utf8')).tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tagged||tagged.original_question!==expected||tagged.question_type!=='算法手撕_Coding'||tagged.is_valid_for_library!==true) throw new Error('source drifted');
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0031/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('canonical context missing or drifted');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected) throw new Error('source context missing');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['指标粒度（grain）','fan-out','COUNT(DISTINCT order_id)','[start, end)','`EXPLAIN`','目标数据库','不虚构 QPS','预聚合'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|transition\s*\(|按本题约束填写|TODO|占位|长尾复习底稿/.test(text)) throw new Error('placeholder/template residue detected');
          NODE
          stdout="$(python3 "$out/sql_validation.py")"
          test "$stdout" = 'PASS gold-orders=2 gold-item-rows=3 gold-revenue=3500 silver-orders=1 silver-revenue=900 cancelled=excluded out-window=excluded no-items=excluded'

      - name: Independent reviewer SQL oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0031/$CANONICAL_ID"
          OUT="$out" python3 - <<'PY'
          import os, pathlib, sqlite3
          out=pathlib.Path(os.environ['OUT'])
          sql=(out/'metric.sql').read_text()
          con=sqlite3.connect(':memory:')
          con.executescript('''
          create table users(user_id integer primary key, segment text not null);
          create table orders(order_id integer primary key, user_id integer not null, status text not null, created_at text not null);
          create table order_items(order_id integer not null, quantity integer not null, unit_price_cents integer not null);
          ''')
          users=[(1,'a'),(2,'a'),(3,'b')]
          orders=[(101,1,'paid','2026-01-01'),(102,1,'paid','2026-01-02'),(103,2,'paid','2026-01-03'),(104,3,'cancelled','2026-01-04'),(105,3,'paid','2026-02-01')]
          items=[(101,1,100),(101,2,50),(102,1,250),(103,4,25),(104,100,1000),(105,1,999)]
          con.executemany('insert into users values(?,?)',users); con.executemany('insert into orders values(?,?,?,?)',orders); con.executemany('insert into order_items values(?,?,?)',items)
          actual=con.execute(sql,{'start_at':'2026-01-01','end_at':'2026-02-01'}).fetchall()
          # Independent expected computation from base tuples at order grain.
          user_segment=dict(users); allowed={oid:(uid,status,dt) for oid,uid,status,dt in orders if status=='paid' and '2026-01-01'<=dt<'2026-02-01'}
          per_order={}
          for oid,q,p in items:
              if oid in allowed: per_order[oid]=per_order.get(oid,0)+q*p
          expected_by={}
          for oid,amount in per_order.items():
              uid=allowed[oid][0]; seg=user_segment[uid]; cnt,rev=expected_by.get(seg,(0,0)); expected_by[seg]=(cnt+1,rev+amount)
          expected=sorted((seg,cnt,rev) for seg,(cnt,rev) in expected_by.items())
          assert actual==expected==( [('a',3,550)] ), (actual,expected)
          raw=con.execute("select count(*) from orders o join order_items i on i.order_id=o.order_id join users u on u.user_id=o.user_id where o.status='paid' and o.created_at>=? and o.created_at<? and u.segment='a'",('2026-01-01','2026-02-01')).fetchone()[0]
          assert raw==4 and actual[0][1]==3
          print('PASS reviewer-a-orders=3 raw-item-rows=4 revenue=550 cancelled=excluded end-boundary=excluded independent-order-grain=yes')
          PY

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0031/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'one-to-many fan-out',expected:'order count remains order-grain while item rows are larger',actual:'writer gold 2 orders vs 3 item rows; reviewer segment a 3 orders vs 4 item rows',passed:true},
            {case:'revenue aggregation',expected:'item values aggregate once per order then once per segment',actual:'writer 3500/900 and reviewer 550 match independent computations',passed:true},
            {case:'status filter',expected:'cancelled orders excluded before aggregation',actual:'passed in both datasets',passed:true},
            {case:'half-open time window',expected:'end boundary excluded',actual:'out-of-window/end-boundary rows excluded',passed:true},
            {case:'declared inner-join contract',expected:'paid order with no items excluded',actual:'writer bronze no-item order absent',passed:true}
          ];
          fs.writeFileSync(validationPath,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'python3 sql_validation.py; independent reviewer SQLite oracle',stdout:'PASS writer gold-orders=2 raw-items=3 revenue=3500; PASS reviewer a-orders=3 raw-items=4 revenue=550',checks:['fan-out order count','revenue once per order','status filter','half-open time range','no-item inner-join contract','independent expected computation'],boundary_tests:tests},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_passed',sources:[{source_id:'repository-source',title:'Tagged JOIN/GROUP BY high-concurrency analytics coding question',locator:`note_tagged/686f75b600000000220333f1.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'SQLite join/aggregate grain validation',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source asks generally for JOIN/GROUP BY analytics under high concurrency but preserves no schema, metric, SQL dialect, SLA, isolation target or concurrency number.',source_ids:['repository-source'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'grain-correctness',text:'Under the explicitly illustrative order schema, executable fixtures prove pre-aggregation prevents item fan-out from inflating order count/revenue.',source_ids:['fixture'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0031-join-aggregate-sql-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The source is intentionally broad and preserves no concrete schema, metric definition, database dialect, isolation level, freshness SLA or concurrency target; the candidate correctly labels its order/segment model as an illustrative answer-side contract.',
            'The answer centers metric grain before syntax: one-to-many item fan-out is resolved by pre-aggregating to one row per order before the segment GROUP BY.',
            'The writer fixture demonstrates 2 gold orders expanding to 3 item rows while still producing order_count=2 and revenue=3500; an independently authored fixture demonstrates 3 orders vs 4 item rows and independently computes revenue=550.',
            'Status and half-open time filtering are tested, and the inner-join exclusion of paid orders without items is explicitly documented rather than silently treated as universal business behavior.',
            'The high-concurrency section does not claim an unverified index or QPS result: it requires target-database execution-plan and load-test validation, and presents pre-aggregation/materialization/cache/read paths as options with freshness/consistency costs.',
            'The candidate warns that COUNT(DISTINCT order_id) can repair order count without necessarily repairing duplicated order-level sums, which is the key semantic trap in this class of query.',
            'No production experience or target-database performance result is fabricated.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0031.join-aggregate-sql.v1',decision:'pass',revision_round:1,source_packet:['note_tagged/686f75b600000000220333f1.json',candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0031-join-aggregate-sql-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Tagged JOIN/GROUP BY high-concurrency analytics coding question',locator:`note_tagged/686f75b600000000220333f1.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Writer and reviewer SQLite grain/fan-out validation',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Join/aggregate SQL candidate independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'Schema, concrete metric, SQL dialect, SLA and concurrency target are not preserved by the source; the order example is explicitly illustrative.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'fanout-correctness',text:'Pre-aggregating one-to-many items to order grain prevents item multiplicity from inflating order-level count and revenue in the demonstrated contract.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']},{claim_id:'performance-boundary',text:'The candidate does not claim generic index/QPS wins and instead requires target-database EXPLAIN and concurrent load validation for physical optimization choices.',source_ids:['isolated-review'],answer_locations:['1 分钟版','关键细节','原理机制','项目经验版']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'writer + independent reviewer SQLite fixtures',result:'pass',reported_stdout:'PASS fan-out/revenue/status/time/no-item boundaries',checks:['fan-out grain','revenue','filters','inner-join boundary'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0031.join-aggregate-sql.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md'; let text=fs.readFileSync(task,'utf8');
          const done='- [x] `cq_q_70688148eb122f00c5e224c6cfb2d04e` candidate passed independent source-first review: the broad source boundary is preserved without inventing schema/SLA/QPS, the illustrative SQL fixes one-to-many fan-out by restoring order grain before final GROUP BY, writer and independent SQLite oracles verify counts/revenue/filter boundaries, and physical high-concurrency optimization is correctly deferred to target-database EXPLAIN/load validation. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(done)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+done+'\n');
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo 'Content branch advanced during join/aggregate SQL review; discard local review and retry later.'
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0031/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0031 join-aggregate SQL candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
