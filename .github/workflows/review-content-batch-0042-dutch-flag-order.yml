name: Review Content Batch 0042 Dutch Flag Order

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0042-dutch-flag-order.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-dutch-flag-order-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_af091a4667cf97a15834eaa7bada1877
  SOURCE_QID: af091a4667cf97a15834eaa7bada1877

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：排序包含 1, 0, -1 三种元素的数组，按照 [1, -1, 0] 指定顺序排列 (荷兰国旗变形)';
          const raw=JSON.parse(fs.readFileSync('note_structured/678fa7d6000000002901c387.json','utf8'));
          if(raw.questions?.[12]!==exact)throw new Error('source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('ownership/type drifted');
          if(!(ctx.source_questions||[]).some(x=>x.question_id===qid&&x.original_question===exact))throw new Error('exact source missing');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','[1,-1,0]','oneEnd','zeroStart','O(n)','O(1)'])if(!md.includes(marker))throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated project experience risk');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('public static void reorder'))throw new Error('candidate code missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_count_oracle',candidate_sha256:sha,source_boundary:'array contains only 1, 0, -1 and must be grouped in custom order [1,-1,0]; API, mutation, null/invalid semantics are not source-frozen'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent count-based oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              static int[] countOracle(int[] a){int ones=0,neg=0,zeros=0;for(int v:a){if(v==1)ones++;else if(v==-1)neg++;else if(v==0)zeros++;else throw new IllegalArgumentException();}int[] out=new int[a.length];int k=0;while(ones-->0)out[k++]=1;while(neg-->0)out[k++]=-1;while(zeros-->0)out[k++]=0;return out;}
              static int[] counts(int[] a){int[] c=new int[3];for(int v:a){if(v==1)c[0]++;else if(v==-1)c[1]++;else if(v==0)c[2]++;else throw new AssertionError("unexpected value");}return c;}
              static void check(int[] a){int[] before=a.clone(),want=countOracle(before),cnt=counts(before);Solution.reorder(a);if(!Arrays.equals(a,want))throw new AssertionError("mismatch input="+Arrays.toString(before)+" got="+Arrays.toString(a)+" want="+Arrays.toString(want));if(!Arrays.equals(counts(a),cnt))throw new AssertionError("multiset changed");}
              static long exhaustive=0;static void gen(int[] a,int i,int[] vals){if(i==a.length){check(a.clone());exhaustive++;return;}for(int v:vals){a[i]=v;gen(a,i+1,vals);}}
              public static void main(String[] args){int[] vals={1,-1,0};for(int n=0;n<=11;n++)gen(new int[n],0,vals);Random r=new Random(0x524556444E46L);long randomValues=0;for(int t=0;t<30000;t++){int n=r.nextInt(400);int[] a=new int[n];for(int i=0;i<n;i++)a[i]=vals[r.nextInt(3)];randomValues+=n;check(a);}int[] bad={0,1,2,-1,0},snapshot=bad.clone();try{Solution.reorder(bad);throw new AssertionError("invalid accepted");}catch(IllegalArgumentException expected){}if(!Arrays.equals(bad,snapshot))throw new AssertionError("invalid partially mutated");try{Solution.reorder(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}System.out.println("PASS exhaustive="+exhaustive+" random=30000 random-values="+randomValues+" count-oracle=match multiset=preserved invalid=reject-unchanged null=rejected");}
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)";echo "$stdout";grep -E '^PASS exhaustive=[0-9]+ random=30000 random-values=[0-9]+ count-oracle=match multiset=preserved invalid=reject-unchanged null=rejected$' <<<"$stdout";echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0042/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0042/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_count_oracle'||pre.candidate_sha256!==sha)throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const tests=[{case:'all arrays length 0..11 over {1,-1,0}',expected:'candidate equals count-based [1,-1,0] oracle',passed:true},{case:'30,000 seeded random arrays',expected:'candidate equals independent count oracle and preserves multiset',passed:true},{case:'invalid value',expected:'rejected before mutation',passed:true},{case:'null',expected:'NullPointerException',passed:true}];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; independent count-based oracle on exhaustive/random arrays',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The frozen source requires a three-value array to be arranged in custom order [1,-1,0]; API shape, in-place mutation and invalid-input behavior are not source-preserved constraints.','The candidate explicitly labels its Java in-place API and error semantics as a reference contract rather than source facts.','Its four-region invariant is sufficient: the 1-prefix, -1-middle and 0-suffix remain classified while every branch strictly shrinks the unknown interval.','A structurally independent count-based oracle matches the exact candidate across every array up to length 11 and 30,000 seeded random arrays; category multiplicities are preserved.','The candidate correctly explains why the 0-swap branch does not advance scan, states O(n)/O(1), gives counting as an alternative, and does not fabricate project experience.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0042-dutch-flag-20260827-v1',review_version:'batch-0042.dutch-flag.v1',decision:'pass',revision_round:1,source_packet:['note_structured/678fa7d6000000002901c387.json','review/content_build/answer_batch_0042/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0042-dutch-flag-order-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving Dutch-flag custom-order prompt',locator:'note_structured/678fa7d6000000002901c387.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer comparator-order validation',locator:`${out}/dutch_flag_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent count-based oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Dutch-flag source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source requires values 1, 0 and -1 to be arranged in custom group order [1,-1,0], while API/mutation/error semantics are not source-frozen.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'Under the declared Java contract, the exact three-way-partition implementation equals an independent count-based oracle on exhaustive and random inputs and preserves category multiplicities.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent count-based oracle on exhaustive/random arrays',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/content_build/answer_batch_0042/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0042/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json"
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0042 dutch-flag-order candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
            sleep 5
          done
          exit 1
