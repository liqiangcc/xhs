    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0031-usefetch-params-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0031-usefetch-params-build
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_705fcf4159e89e312094f5a60e7d10f1
  SOURCE_QID: 705fcf4159e89e312094f5a60e7d10f1

