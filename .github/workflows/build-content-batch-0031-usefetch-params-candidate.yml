              {claim_id:'request-lifecycle',text:'Under the declared request(params,{signal}) contract, the executable harness verifies mount/refetch identity semantics, cleanup abort, stale-write prevention, success and error state transitions.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}
            ],
