# Retry source-unrecoverable remediation against the current content branch snapshot: 2026-08-28T02:30Z
name: Remediate Content Batch 0047 Unrecoverable Java Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0047-unrecoverable-java.yml
      - scripts/content/remediate_batch_0047_unrecoverable_java_algorithm.py
      - package.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0047-unrecoverable-java
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CID: cq_q_c276eb84629f6d2f7e0d3c0473a9d5f6
  QID: c276eb84629f6d2f7e0d3c0473a9d5f6

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fail-closed source remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0047_unrecoverable_java_algorithm.py > /tmp/remediate.py
          python3 -m py_compile /tmp/remediate.py
          python3 /tmp/remediate.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify explainable invalid projection and archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path('.');cid=os.environ['CID'];qid=os.environ['QID'];expected='算法：Java实现的算法题'
          canon={json.loads(x)['canonical_id'] for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          questions={row['question_id']:row for row in (json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip())}
          progress_ids={row.get('canonical_id') for row in json.loads((root/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'));decisions={row.get('question_id'):row for row in audit.get('decisions',[])}
          if cid in canon: raise SystemExit('retired Canonical still active')
          row=questions.get(qid)
          if not row or row.get('original_question')!=expected: raise SystemExit('Question projection missing/wording drifted')
          if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'invalid projection incorrect: {row}')
          if cid in progress_ids: raise SystemExit('ReviewProgress still active')
          if (root/'review/answers'/f'{cid}.md').exists(): raise SystemExit('active Answer still exists')
          if not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit('archived baseline Answer missing')
          if (root/'review/candidates/answers'/f'{cid}.md').exists(): raise SystemExit('unexpected candidate exists')
          decision=decisions.get(qid)
          if not decision or decision.get('decision')!='exclude' or decision.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit('validity-audit exclusion missing')
          note=decision.get('exclusion_note') or ''
          for token in ['一道java算法','输入输出','fail-closed','猜测']:
              if token not in note: raise SystemExit(f'exclusion explanation missing {token}')
          print('PASS batch0047 unrecoverable Java source retired fail-closed with explainable audit trail')
          PY

      - name: Gate question coverage
        run: node scripts/content/check_question_coverage.js --check

      - name: Gate canonical integrity
        run: node scripts/xhs.js canonical check --noWrite

      - name: Gate review integrity
        run: node scripts/xhs.js review integrity --noWrite

      - name: Gate answer type audit
        run: node scripts/xhs.js answer type-audit --check --noWrite

      - name: Gate strict answer validation
        run: node scripts/xhs.js answer validate --strict --noWrite

      - name: Gate full repository validation
        run: node scripts/xhs.js validate all --noWrite

      - name: Gate unit tests
        run: npm test

      - name: Gate aggregate CI
        run: npm run ci:check

      - name: Gate answer semantic quality
        run: npm run ci:answer:semantic

      - name: Gate answer evidence
        run: npm run ci:answer:evidence

      - name: Gate answer code validation
        run: npm run ci:answer:code

      - name: Gate answer coverage
        run: npm run ci:answer:coverage

      - name: Record batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0047.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_c276eb84629f6d2f7e0d3c0473a9d5f6` retired fail-closed as source-unrecoverable. The complete repository provenance preserves only “算法：Java实现的算法题” / “一道java算法” under the coding-question list, with no algorithm name, inputs, outputs, constraints, examples, complexity target, or image-text evidence. Selecting any concrete Java algorithm would fabricate the interview contract, so the original Question is retained as explicitly explainable `incomplete_or_unreadable` noise while its Canonical, ReviewProgress, and active long-tail Answer are retired and the baseline Answer is archived.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")";base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced during remediation: $base_head -> $remote_head";echo 'Discard verified local mutation; retry against current state.';exit 0;fi
          git add -A
          if git diff --cached --quiet;then echo 'No batch0047 Java remediation changes.';exit 0;fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0047 java question'
          git push origin "HEAD:$CONTENT_BRANCH"
