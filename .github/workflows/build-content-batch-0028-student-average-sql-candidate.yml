name: Build Content Batch 0028 Student Average SQL Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0028-student-average-sql-candidate.yml
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: content-batch-0028-student-average-sql-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_e9c5bb8468fd0b37bd3f0abf72df80aa
  SOURCE_QID: e9c5bb8468fd0b37bd3f0abf72df80aa

jobs:
  build-candidate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify current split-child source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0028/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('Canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          const expected='SQL：从学生表和成绩表中，查询学生学号、姓名、平均成绩';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          const rr=fs.readFileSync('review/content_build/answer_batch_0028/relation_review.md','utf8');
          if(!rr.includes(`retain \`${cid}\` as its own source-exact Coding/SQL Canonical`)) throw new Error('fresh relation-review conclusion missing');
          NODE

      - id: state
        name: Guard writer idempotence
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          if [ -e "$candidate" ]; then
            test -e "$out/sql_validation.json"
            test -e "$out/writer_research.json"
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write source-bounded SQL candidate and fixture
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_e9c5bb8468fd0b37bd3f0abf72df80aa","version":1,"status":"draft","updated_at":"2026-08-25","answer_type":"coding","quality_tier":"candidate"} -->
          # SQL：从学生表和成绩表查询学号、姓名、平均成绩

          ## 核心结论

          来源只保留“学生表 + 成绩表，查询学生学号、姓名、平均成绩”，没有给真实表名、列名、主外键、无成绩学生是否保留，也没有要求排序或小数位数。先声明一个最小可执行假设：`students(student_id, name)` 保存学生，`grades(student_id, score)` 每行是一条该学生的成绩；本答案只返回至少有一条成绩的学生。按 `student_id` 连接两表，再以学生为粒度分组并对 `score` 求 `AVG`。

          ## 1 分钟版

          - 先明确表结构是假设，不把 `JOIN`、`GROUP BY` 或字段名冒充成来源要求。
          - 用学生主键把 `students` 与 `grades` 连接，避免只按姓名等非稳定字段关联。
          - 结果粒度是一名学生，所以按 `student_id` 和 `name` 分组，对该学生的 `score` 求平均值。
          - 来源没说要包含“还没有成绩”的学生；这里明确采用“至少有一条成绩才返回”的契约，因此使用 `INNER JOIN`。
          - 来源也没给排序、四舍五入和精度规则，因此正式 SQL 不额外添加这些约束。

          ## 3 分钟版

          假设学生表是 `students(student_id, name)`，成绩表是 `grades(student_id, score)`，且 `grades.student_id` 指向学生。每条成绩记录都参与该学生平均分；只有有成绩的学生出现在结果中：

          ```sql
          SELECT
              s.student_id,
              s.name,
              AVG(g.score) AS average_score
          FROM students AS s
          JOIN grades AS g
            ON g.student_id = s.student_id
          GROUP BY s.student_id, s.name;
          ```

          如果题目进一步要求“没有成绩的学生也要展示”，契约就变了：应考虑 `LEFT JOIN`，此时无成绩学生的 `AVG(g.score)` 通常为 `NULL`，是否转成 `0` 仍要继续确认业务口径。若要求固定小数位，也应按目标数据库和精度规则显式处理，而不是默认四舍五入。

          ## 关键细节

          - **结果粒度**：一名学生一行；平均值在该学生所有成绩记录上计算。
          - **关联键**：示例使用 `student_id`，因为来源只说“学生表和成绩表”，实际键名必须以真实 schema 为准。
          - **无成绩学生**：当前候选明确采用只返回有成绩学生的最小契约；需要全量学生时改用外连接并定义空集语义。
          - **重复记录**：若成绩表存在业务重复数据，普通 `AVG` 会把每行都计入。是否去重必须由成绩记录的业务唯一性决定，不能擅自 `DISTINCT score`。
          - **精度**：`AVG` 的返回类型和小数精度受数据库与列类型影响。来源没有规定展示精度，不应把某个数据库的隐式转换当成通用事实。
          - **排序**：来源没有要求顺序，因此答案不把 `ORDER BY` 写成必需条件；若面试官指定顺序，再在最终结果上排序。

          ## 原理机制

          这道题先把两个关系按学生标识做匹配，得到“学生信息 × 该学生成绩”的行集合；随后 `GROUP BY` 把这些行重新收缩到“每个学生一个分组”，`AVG(score)` 在每个分组内部聚合。关键是先确认最终输出粒度和无匹配行的语义：`INNER JOIN` 表示只保留能匹配到成绩的学生，`LEFT JOIN` 则保留学生侧全部行。这是关系语义差异，不只是 SQL 写法差异。

          ## 项目经验版

          来源没有提供真实项目、表规模、索引或执行计划数据，不能虚构。我在真实系统里会先查看 schema、主外键、成绩记录唯一性和空值规则，再用目标数据库的 `EXPLAIN` 与样本数据验证连接和聚合成本；这些是落地验证步骤，不是本题来源事实。

          ## 常见追问

          - 问：为什么用 `student_id` 连接？答：这里把它作为最小 schema 假设；实际题目若给出别的主外键，应按真实键连接，不能把示例字段名当成来源。
          - 问：没有成绩的学生要不要显示？答：来源没说明。本候选明确只返回有成绩学生；若要求保留全部学生，改成 `LEFT JOIN` 并确认无成绩时返回 `NULL`、`0` 还是其他值。
          - 问：为什么不能写 `AVG(DISTINCT score)`？答：相同分数可能来自两门不同课程，值相同不代表记录重复；是否去重要基于业务唯一键，而不是分数值本身。
          - 问：要不要按平均分或学号排序？答：来源没有排序要求；只有题目明确提出时再增加 `ORDER BY`。
          - 问：平均分保留两位小数怎么做？答：需要先确认数据库方言和舍入规则，再用相应函数或类型转换；不能在来源没有要求时默认一种精度策略。

          ## 易错点

          - 把自定义表名、字段名、`JOIN/GROUP BY` 写成“原题已经给出”。
          - 只按姓名连接，忽略姓名可能不唯一。
          - 没定义无成绩学生语义，却在 `INNER JOIN` 和 `LEFT JOIN` 之间随意切换。
          - 用 `AVG(DISTINCT score)` 错误消掉不同课程但分数相同的合法成绩记录。
          - 题目没要求排序、精度或四舍五入，却把实现偏好扩张成题目约束。
          EOF

          cat > "$out/sql_validation.py" <<'PY'
          import sqlite3
          con=sqlite3.connect(':memory:')
          con.execute('create table students(student_id integer primary key, name text not null)')
          con.execute('create table grades(student_id integer not null, score real not null)')
          con.executemany('insert into students values(?,?)',[(1,'Alice'),(2,'Bob'),(3,'Cara'),(4,'Dan')])
          con.executemany('insert into grades values(?,?)',[(1,80),(1,90),(2,70),(4,60),(4,60)])
          sql='''SELECT s.student_id, s.name, AVG(g.score) AS average_score FROM students AS s JOIN grades AS g ON g.student_id=s.student_id GROUP BY s.student_id, s.name'''
          rows=sorted((sid,name,float(avg)) for sid,name,avg in con.execute(sql))
          expected=[(1,'Alice',85.0),(2,'Bob',70.0),(4,'Dan',60.0)]
          assert rows==expected, (rows,expected)
          assert all(row[0]!=3 for row in rows), 'explicit inner-join contract must exclude students without grades'
          assert next(avg for sid,_,avg in rows if sid==4)==60.0, 'equal-valued grades are separate records and both participate'
          print('PASS students=1,2,4 averages=85,70,60 no-grade=excluded equal-valued-records=preserved')
          PY

      - name: Execute fixture and freeze writer research
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          stdout="$(python3 "$out/sql_validation.py")"
          test "$stdout" = 'PASS students=1,2,4 averages=85,70,60 no-grade=excluded equal-valued-records=preserved'
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,out=`review/content_build/answer_batch_0028/${cid}`;
          fs.writeFileSync(path.join(out,'sql_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:'2026-08-25',command:'python3 sql_validation.py',stdout:process.env.STDOUT,checks:['multiple grades average correctly','single grade average','student without grades excluded by explicit candidate contract','equal-valued grade records both participate']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-25',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Answer Batch 0028 repository source packet and split boundary records',locator:'review/content_build/answer_batch_0028/relation_review.md',source_type:'repository_source_record',checked_at:'2026-08-25'},{source_id:'fixture',title:'Student average SQL deterministic SQLite fixture',locator:`${out}/sql_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-25'}],claims:[{claim_id:'source-boundary',text:'The split source asks only for student number, name and average grade from student and grade tables; schema names, join syntax, ordering and precision are not preserved source constraints.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'query-behavior',text:'Under the explicit minimal schema and inner-join assumption, the executable fixture verifies per-student averages, single/multiple grade cases, no-grade exclusion and preservation of separate equal-valued grade records.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0028.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Student/grade average SQL split-child candidate is staged with explicit schema/no-grade assumptions and executable SQLite validation; isolated review remains pending.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Verify candidate and repository gates
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer validate --candidate "review/candidates/answers/$CANONICAL_ID.md" --strict --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit candidate if branch stayed stable
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced during candidate validation: $base_head -> $remote_head"; exit 0; fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0028/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0028.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: draft batch 0028 student-average SQL candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
