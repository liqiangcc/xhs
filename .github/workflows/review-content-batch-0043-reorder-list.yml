name: Review Content Batch 0043 Reorder List

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-reorder-list.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-reorder-list-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_afca3609b3e122b11b3e0c6e1e99692e
  SOURCE_QID: afca3609b3e122b11b3e0c6e1e99692e

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const exact='算法：高效重排链表（要求原地修改，空间复杂度O(1)）';
          const raw=JSON.parse(fs.readFileSync('note_structured/68773f190000000017035b4e.json','utf8'));
          if(!(raw.questions||[]).includes(exact)) throw new Error('structured source wording drifted');
          const note=JSON.parse(fs.readFileSync('note_tagged/68773f190000000017035b4e.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==exact) throw new Error('tagged source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact) throw new Error('inventory drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid])) throw new Error('inventory ownership drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','public static void reorder','slow.next = null','while (second != null)']) if(!md.includes(marker)) throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups missing');
          if(!md.includes('没有保留重排后的精确顺序')||!md.includes('参考契约')) throw new Error('under-specified target-order boundary not explicit');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md)) throw new Error('fabricated experience risk');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public static void reorder')) throw new Error('candidate Java implementation missing or ambiguous');
          fs.writeFileSync('/tmp/Solution.java',blocks[0][1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');
          fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_independent_identity_validation',candidate_sha256:sha,source_boundary:'The source preserves in-place linked-list reordering and O(1) extra space, but not a unique target order or API. The L0,Ln,L1,Ln-1 ordering is an explicitly declared reference contract.'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent node-identity and topology validation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ReviewerValidation.java <<'JAVA'
          import java.util.*;

          public final class ReviewerValidation {
              static final class Fixture {
                  Solution.Node head;
                  final ArrayList<Solution.Node> original = new ArrayList<>();
              }

              static Fixture build(int n, Random r) {
                  Fixture f = new Fixture();
                  Solution.Node tail = null;
                  for (int i=0;i<n;i++) {
                      Solution.Node node = new Solution.Node(r.nextInt(5)); // deliberate duplicate values
                      f.original.add(node);
                      if (tail == null) f.head = node; else tail.next = node;
                      tail = node;
                  }
                  return f;
              }

              static ArrayList<Solution.Node> expectedIdentityOrder(ArrayList<Solution.Node> nodes) {
                  ArrayList<Solution.Node> out = new ArrayList<>(nodes.size());
                  int l=0,r=nodes.size()-1;
                  while (l<=r) {
                      out.add(nodes.get(l++));
                      if (l<=r) out.add(nodes.get(r--));
                  }
                  return out;
              }

              static ArrayList<Solution.Node> traverseNoCycle(Solution.Node head, int expectedSize) {
                  ArrayList<Solution.Node> out = new ArrayList<>();
                  Set<Solution.Node> seen = Collections.newSetFromMap(new IdentityHashMap<>());
                  for (Solution.Node p=head;p!=null;p=p.next) {
                      if (!seen.add(p)) throw new AssertionError("cycle detected");
                      out.add(p);
                      if (out.size()>expectedSize) throw new AssertionError("node count overflow");
                  }
                  return out;
              }

              static void check(int n, long seed) {
                  Random r = new Random(seed);
                  Fixture f = build(n,r);
                  ArrayList<Solution.Node> want = expectedIdentityOrder(f.original);
                  Solution.reorder(f.head);
                  ArrayList<Solution.Node> got = traverseNoCycle(f.head,n);
                  if (got.size()!=n) throw new AssertionError("node count drift n="+n+" got="+got.size());
                  for (int i=0;i<n;i++) if (got.get(i)!=want.get(i)) throw new AssertionError("identity order drift n="+n+" index="+i);
                  Set<Solution.Node> before = Collections.newSetFromMap(new IdentityHashMap<>()); before.addAll(f.original);
                  Set<Solution.Node> after = Collections.newSetFromMap(new IdentityHashMap<>()); after.addAll(got);
                  if (before.size()!=after.size() || !before.containsAll(after) || !after.containsAll(before)) throw new AssertionError("node identity set drift n="+n);
              }

              static void explicitDuplicateValues() {
                  Solution.Node a=new Solution.Node(7),b=new Solution.Node(7),c=new Solution.Node(7),d=new Solution.Node(7);
                  a.next=b;b.next=c;c.next=d;
                  Solution.reorder(a);
                  if (a.next!=d || d.next!=b || b.next!=c || c.next!=null) throw new AssertionError("duplicate-value case must preserve node identity order");
              }

              public static void main(String[] args) {
                  for(int n=0;n<=512;n++) check(n,0x52454F5244455200L+n);
                  Random r=new Random(0x4944454E54495459L);
                  for(int c=0;c<25000;c++) check(r.nextInt(600),r.nextLong());
                  explicitDuplicateValues();
                  System.out.println("PASS identity-lengths=0..512 seeded-random=25000 duplicate-values=identity-checked node-set=preserved cycle=none reference-order=exact");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/ReviewerValidation.java
          stdout="$(java -cp /tmp ReviewerValidation)"; echo "$stdout"
          grep -E '^PASS identity-lengths=0\.\.512 seeded-random=25000 duplicate-values=identity-checked node-set=preserved cycle=none reference-order=exact$' <<<"$stdout"
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));
          if(pre.decision!=='pass_pending_independent_identity_validation'||pre.candidate_sha256!==sha) throw new Error('source-first preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha) throw new Error('writer packet/hash drifted');
          const tests=[
            {case:'all list lengths 0 through 512 with distinct node identities and duplicate-capable values',expected:'same node identity set, no cycle, exact L0,Ln,L1,Ln-1 reference identity order',passed:true},
            {case:'25,000 seeded random lists up to length 599',expected:'reference identity order exact, no lost/new nodes, no cycle regardless of duplicate values',passed:true},
            {case:'explicit four-node all-equal-values fixture',expected:'identity order a,d,b,c proves correctness does not rely on value uniqueness',passed:true}
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact Java candidate and validate node identity topology against independent reference-order oracle',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The source preserves in-place linked-list reordering with O(1) extra-space requirement but does not preserve the exact target ordering or API; the candidate correctly labels L0,Ln,L1,Ln-1 as a reference contract.',
            'Under that explicit reference contract, midpoint split, physical disconnection, in-place second-half reversal and alternating merge form a coherent O(n)-time/O(1)-extra-space pointer algorithm.',
            'Independent validation compares actual node identities rather than node values, proving that duplicate values cannot mask node loss, duplication, substitution or wrong topology.',
            'Lengths 0 through 512 plus 25,000 seeded random lists preserve exactly the original node identity set, produce no cycle and match the independent reference identity order.',
            'The answer explains why stack/array and recursive approaches violate the strict O(1) extra-space source constraint and calls out the source ambiguity instead of inventing a unique original order.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-reorder-list-20260827-v1',review_version:'batch-0043.reorder-list.v1',decision:'pass',revision_round:0,source_packet:['note_structured/68773f190000000017035b4e.json','note_tagged/68773f190000000017035b4e.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-reorder-list-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving linked-list reorder constraints',locator:'note_structured/68773f190000000017035b4e.json',source_type:'repository_source_record',checked_at:date},{source_id:'tagged-note',title:'Tagged linked-list reorder question and canonical ownership',locator:'note_tagged/68773f190000000017035b4e.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic reorder-list validation',locator:`${out}/reorder_list_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent node-identity and topology validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Reorder-list source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves high-efficiency in-place linked-list reordering with O(1) extra-space requirement, but not one exact output permutation or API.',source_ids:['structured-note','tagged-note','source-inventory','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'reference-behavior',text:'Under the explicitly declared L0,Ln,L1,Ln-1 reference contract, the exact candidate preserves the original node identity set, remains acyclic and matches the independent identity-order oracle across exhaustive lengths and seeded random lists.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent node-identity topology validation of exact Java candidate',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_afca3609b3e122b11b3e0c6e1e99692e` completed writer and isolated source-first review. The source preserves in-place linked-list reordering with O(1) extra-space requirement but not one exact target ordering, so `L0→Ln→L1→Ln-1→…` is explicitly a reference contract. Writer validation covered lengths 0..128 and 20,000 seeded random lists; the independent reviewer validated actual node identities for lengths 0..512, 25,000 seeded random lists and duplicate-value topology, proving node-set preservation, exact reference ordering and acyclicity. Strict candidate audit, code gate, and repository gates are green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 reorder-list candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
          done
          exit 1
