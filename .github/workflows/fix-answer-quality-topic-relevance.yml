name: Apply bounded answer topic-relevance fix

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/fix-answer-quality-topic-relevance.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Patch cross-topic relevance detection without weakening foreign-topic gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/answer_quality.js')
          text = path.read_text(encoding='utf-8')
          old = """    const allowedText = [context.canonical.canonical_title, ...(context.primary_entities || []), ...(context.source_variants || [])].join(' ').toLowerCase();
    const coreLower = core.toLowerCase();
    const relevantTokens = [...(context.primary_entities || []), ...String(context.canonical.canonical_title || '').split(/[\\s：:，,？?、与和的]+/)]
        .filter((value) => String(value).length >= 2);
    const hasRelevantCoreToken = relevantTokens.some((token) => coreLower.includes(String(token).toLowerCase()));
    const foreignAnchors = STRONG_TOPIC_ANCHORS.filter((anchor) => coreLower.includes(anchor.toLowerCase()) && !allowedText.includes(anchor.toLowerCase()));
"""
          new = """    const allowedText = [context.canonical.canonical_title, ...(context.primary_entities || []), ...(context.source_variants || [])].join(' ').toLowerCase();
    const coreLower = core.toLowerCase();
    const relevantTokens = [...(context.primary_entities || []), ...String(context.canonical.canonical_title || '').split(/[\\s：:，,？?、与和的]+/)]
        .filter((value) => String(value).length >= 2);
    // Chinese question titles often have no whitespace, so an exact title token
    // can miss an otherwise clearly on-topic core conclusion.  Build bounded
    // lexical fragments from the canonical title/source variants after removing
    // question boilerplate.  This keeps the foreign-topic hard gate while
    // allowing a concrete topic phrase such as “转账” to prove relevance even
    // when a legitimate scope qualifier such as “JVM” is also present.
    const genericTopicFragments = new Set(['原理', '作用', '区别', '说明', '介绍', '比较', '问题', '机制', '流程']);
    const topicFragments = [...new Set([
        context.canonical.canonical_title,
        ...(context.source_variants || []),
    ].flatMap((value) => String(value || '').toLowerCase()
        .replace(/如何|怎么|怎样|为什么|为何|是否|能否|可否|请|说明|解释|介绍|比较|区别|保证|避免|实现|什么|哪些/g, ' ')
        .split(/[^\\p{L}\\p{N}+#.]+/u)
        .filter((token) => token.length >= 2)
        .flatMap((token) => {
            if (/^[\\u3400-\\u9fff]+$/u.test(token)) {
                const chars = Array.from(token);
                return chars.length === 2 ? [token] : chars.slice(0, -1).map((_, index) => chars.slice(index, index + 2).join(''));
            }
            return [token];
        })
        .filter((token) => token.length >= 2 && !genericTopicFragments.has(token))))];
    const hasRelevantCoreToken = relevantTokens.some((token) => coreLower.includes(String(token).toLowerCase()))
        || topicFragments.some((token) => coreLower.includes(token));
    const foreignAnchors = STRONG_TOPIC_ANCHORS.filter((anchor) => coreLower.includes(anchor.toLowerCase()) && !allowedText.includes(anchor.toLowerCase()));
"""
          if old not in text:
              raise SystemExit('expected answer_quality.js cross-topic block not found; refusing broad edit')
          if text.count(old) != 1:
              raise SystemExit('cross-topic block is not unique; refusing edit')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Verify focused regression and repository tests
        shell: bash
        run: |
          node --check scripts/lib/answer_quality.js
          node - <<'NODE'
          const path = require('path');
          const { auditOneCandidate } = require('./scripts/lib/answer_quality');
          const root = process.cwd();
          const file = path.join(root, 'review', 'candidates', 'answers', 'cq_concurrent_transfer_a35181e0.md');
          const row = auditOneCandidate(file, { root, noWrite: true });
          const contamination = (row.hard_failures || []).includes('cross_topic_contamination')
            || (row.errors || []).some((item) => item.error === 'foreign_core_topic');
          if (contamination) throw new Error(JSON.stringify(row));
          if (!row.ok) throw new Error(`focused candidate still fails audit: ${JSON.stringify({hard_failures: row.hard_failures, errors: row.errors})}`);
          console.log(JSON.stringify({canonical_id: row.canonical_id, ok: row.ok, total_score: row.total_score}));
          NODE
          npm test
      - name: Commit bounded validator fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/fix-answer-quality-topic-relevance.yml
          git add scripts/lib/answer_quality.js
          git commit -m "fix: recognize canonical topic fragments in answer audit"
          git push origin HEAD:content/quality-completion
