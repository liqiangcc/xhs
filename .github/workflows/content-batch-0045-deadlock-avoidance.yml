          out=pathlib.Path(f'review/content_build/answer_batch_0045/{cid}'); out.mkdir(parents=True,exist_ok=True)
          validation={
            'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,
            'command':'javac exact candidate + run deterministic concurrency/timeout/interruption boundaries on Java 21',
            'stdout':stdout,
            'checks':['opposite business call directions complete 20000 ordered-lock critical sections','distinct resources with duplicate orderKey are rejected','timed second-lock contention returns false within a bounded observation window','first lock is released after second-lock timeout','timed tryLock interruption is propagated','locks remain acquirable after timeout/interruption cleanup']
          }
          (out/'writer_validation.json').write_text(json.dumps(validation,ensure_ascii=False,indent=2)+'\n')
          sources=[
            {'source_id':'tagged-source','title':'JD backend interview tagged Question','locator':'note_tagged/68653e6300000000170356ec.json','source_type':'repository_structured_source','checked_at':date},
            {'source_id':'source-desc','title':'JD backend interview note text','locator':'note_desc/68653e6300000000170356ec.txt','source_type':'repository_source_record','checked_at':date},
            {'source_id':'batch-inventory','title':'Frozen Batch 0045 source inventory','locator':'review/content_build/answer_batch_0045/source_inventory.json','source_type':'repository_source_record','checked_at':date},
            {'source_id':'java21-reentrantlock','title':'Java SE 21 ReentrantLock API','locator':'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/locks/ReentrantLock.html','source_type':'official_documentation','checked_at':date},
            {'source_id':'writer-validation','title':'Exact Java deadlock-avoidance executable validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
