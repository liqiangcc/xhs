      - name: Compile exact candidate and run concurrency boundaries
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b45-deadlock/DeadlockAvoidanceTest.java <<'JAVA'
          import java.util.concurrent.*;
          import java.util.concurrent.atomic.AtomicInteger;

          public final class DeadlockAvoidanceTest {
              static void require(boolean condition, String message) {
                  if (!condition) throw new AssertionError(message);
              }

              public static void main(String[] args) throws Exception {
                  var a = new DeadlockAvoidance.Resource(1);
                  var b = new DeadlockAvoidance.Resource(2);
                  var count = new AtomicInteger();
                  var start = new CountDownLatch(1);
                  Runnable ab = () -> {
                      try { start.await(); } catch (InterruptedException e) { throw new RuntimeException(e); }
                      for (int i=0;i<10_000;i++) DeadlockAvoidance.withOrderedLocks(a,b,count::incrementAndGet);
                  };
                  Runnable ba = () -> {
                      try { start.await(); } catch (InterruptedException e) { throw new RuntimeException(e); }
                      for (int i=0;i<10_000;i++) DeadlockAvoidance.withOrderedLocks(b,a,count::incrementAndGet);
                  };
                  Thread t1=new Thread(ab,"ordered-ab"), t2=new Thread(ba,"ordered-ba");
                  t1.start(); t2.start(); start.countDown();
                  t1.join(5_000); t2.join(5_000);
                  require(!t1.isAlive() && !t2.isAlive(), "opposite call order must complete under global lock order");
                  require(count.get()==20_000, "critical section count");

                  try {
                      DeadlockAvoidance.withOrderedLocks(new DeadlockAvoidance.Resource(7), new DeadlockAvoidance.Resource(7), () -> {});
                      throw new AssertionError("duplicate order key must fail");
                  } catch (IllegalArgumentException expected) {}

                  var held = new DeadlockAvoidance.Resource(20);
                  var free = new DeadlockAvoidance.Resource(10);
                  var holderEntered = new CountDownLatch(1);
                  var releaseHolder = new CountDownLatch(1);
                  Thread holder = new Thread(() -> DeadlockAvoidance.withOrderedLocks(held, held, () -> {
                      holderEntered.countDown();
                      try { releaseHolder.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                  }), "holder");
                  holder.start(); require(holderEntered.await(2,TimeUnit.SECONDS), "holder did not acquire lock");

                  long before=System.nanoTime();
                  boolean timed = DeadlockAvoidance.withTimedLocks(free, held, 80, TimeUnit.MILLISECONDS, () -> { throw new AssertionError("must not enter critical"); });
                  long elapsedMs=TimeUnit.NANOSECONDS.toMillis(System.nanoTime()-before);
                  require(!timed, "contended second lock should time out");
                  require(elapsedMs >= 40 && elapsedMs < 2_000, "timeout should be bounded, actual ms="+elapsedMs);
                  require(DeadlockAvoidance.withTimedLocks(free, free, 0, TimeUnit.MILLISECONDS, () -> {}), "first lock leaked after second-lock timeout");
                  releaseHolder.countDown(); holder.join(2_000); require(!holder.isAlive(), "holder release");

                  var interruptHeld = new DeadlockAvoidance.Resource(30);
                  var interruptOther = new DeadlockAvoidance.Resource(31);
                  var interruptHolderEntered = new CountDownLatch(1);
                  var interruptRelease = new CountDownLatch(1);
                  Thread interruptHolder = new Thread(() -> DeadlockAvoidance.withOrderedLocks(interruptHeld, interruptHeld, () -> {
                      interruptHolderEntered.countDown();
                      try { interruptRelease.await(); } catch (InterruptedException e) { Thread.currentThread().interrupt(); }
                  }), "interrupt-holder");
                  interruptHolder.start(); require(interruptHolderEntered.await(2,TimeUnit.SECONDS), "interrupt holder did not acquire");
                  var interruptedObserved = new AtomicInteger();
                  Thread waiter = new Thread(() -> {
                      try {
                          DeadlockAvoidance.withTimedLocks(interruptHeld, interruptOther, 5, TimeUnit.SECONDS, () -> {});
                      } catch (InterruptedException expected) {
                          interruptedObserved.incrementAndGet();
                      }
                  }, "interrupt-waiter");
                  waiter.start(); Thread.sleep(60); waiter.interrupt(); waiter.join(2_000);
                  require(!waiter.isAlive() && interruptedObserved.get()==1, "timed tryLock must propagate interruption");
                  interruptRelease.countDown(); interruptHolder.join(2_000); require(!interruptHolder.isAlive(), "interrupt holder release");

                  require(DeadlockAvoidance.withTimedLocks(interruptOther, interruptOther, 0, TimeUnit.MILLISECONDS, () -> {}), "no lock leak after interruption");
                  System.out.println("PASS ordered-opposite-directions=20000 duplicate-order-key=rejected second-lock-timeout=bounded acquired-lock=released interruption=propagated no-leak=true");
              }
          }
          JAVA
          (cd /tmp/b45-deadlock && javac DeadlockAvoidance.java DeadlockAvoidanceTest.java && java DeadlockAvoidanceTest | tee stdout.txt)
          grep -q '^PASS ordered-opposite-directions=20000 duplicate-order-key=rejected second-lock-timeout=bounded acquired-lock=released interruption=propagated no-leak=true$' /tmp/b45-deadlock/stdout.txt

