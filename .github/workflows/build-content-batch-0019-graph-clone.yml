name: Content Batch 0019 Graph Clone Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion' || startsWith(github.event.pull_request.head.ref, 'automation/batch0019-candidate-gate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate graph-clone fixture
        working-directory: review/content_build/answer_batch_0019/cq_q_2f07ba5f8d6e6ad366d2cd13c6d1d1ab
        shell: bash
        run: |
          set -euo pipefail
          javac GraphClone.java GraphCloneTest.java
          stdout="$(java GraphCloneTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=7 randomized=3000 oracle=paired-bijection sharedNodes=0 mutation=none"

      - name: Run formal candidate audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_2f07ba5f8d6e6ad366d2cd13c6d1d1ab.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate, evidence and isolated review binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cid = 'cq_q_2f07ba5f8d6e6ad366d2cd13c6d1d1ab'
          candidate = Path(f'review/candidates/answers/{cid}.md').read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          evidence = json.loads(Path(f'review/evidence/{cid}.json').read_text(encoding='utf-8'))
          review = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/isolated_review_result.json').read_text(encoding='utf-8'))
          validation = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/code_validation.json').read_text(encoding='utf-8'))

          expected_sha = 'd83598e1206e067f11b924bc56f11569564c1828ed33bd012c53f27439b0a205'
          expected_stdout = 'PASS fixed=7 randomized=3000 oracle=paired-bijection sharedNodes=0 mutation=none'
          assert candidate_sha == expected_sha
          assert validation['result'] == 'pass'
          assert validation['stdout'] == expected_stdout
          assert evidence['schema_version'] == 'answer_evidence.v1'
          assert evidence['review_state'] == 'independent_source_first_review_passed'
          assert review['schema_version'] == 'isolated_review.v1'
          assert review['decision'] == 'pass'
          assert review['promotion_blockers'] == ['human_approval_required_for_pilot_promotion']
          assert evidence['candidate_sha256'] == expected_sha
          assert review['candidate_sha256'] == expected_sha
          assert evidence['source_question_coverage'] == [{
              'question_id': '2f07ba5f8d6e6ad366d2cd13c6d1d1ab',
              'covered': True,
              'answer_locations': ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问'],
          }]
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'cq_q_2f07ba5f8d6e6ad366d2cd13c6d1d1ab' review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'candidate-qualified' review/content_build/answer_batch_0019/source_boundary_audit.md
