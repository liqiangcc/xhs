name: Retry Content Batch 0033 Final Two Writers

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/retry-content-batch-0033-final-two-writers.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0033-final-two-writer-retry
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  THROTTLE_CID: cq_q_7a75022f873e722084923cc7db60e1bb
  THROTTLE_QID: 7a75022f873e722084923cc7db60e1bb
  DEDUP_CID: cq_q_7b1c9751da7c787b856440f7bc4088c8
  DEDUP_QID: 7b1c9751da7c787b856440f7bc4088c8

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Re-run bounded writer steps from the registered writer workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:.github/workflows/build-content-batch-0033-final-two-candidates.yml > /tmp/writer.yml

          extract_step() {
            local target="$1"
            awk -v target="$target" '
              $0 == "      - name: " target { found=1; next }
              found && $0 == "        shell: bash" { next }
              found && $0 == "        run: |" { run=1; next }
              run && /^      - / { exit }
              run { sub(/^          /, ""); print }
            ' /tmp/writer.yml
          }

          for step in \
            "Freeze exact source boundaries and ownership" \
            "Write sliding-window rate-limiter candidate and fixture" \
            "Write unsorted linked-list duplicate-removal candidate and fixture" \
            "Record writer slices"; do
            script="$(extract_step "$step")"
            test -n "$script"
            bash -euo pipefail -c "$script"
          done

      - name: Run writer-safe repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit writer slice only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during writer slice: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add \
            "review/candidates/answers/$THROTTLE_CID.md" \
            "review/candidates/answers/$DEDUP_CID.md" \
            "review/content_build/answer_batch_0033/source_boundary_audit.md" \
            "review/content_build/answer_batch_0033/$THROTTLE_CID" \
            "review/content_build/answer_batch_0033/$DEDUP_CID" \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage final two batch 0033 candidates source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
