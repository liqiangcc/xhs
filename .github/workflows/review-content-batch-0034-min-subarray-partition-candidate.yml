name: Review Content Batch 0034 Min Subarray Partition Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0034-min-subarray-partition-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-min-subarray-partition-reviewer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7cf94a421237d5445dc8e6a277be9489

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first isolated review and exact-candidate revalidation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; candidate="review/candidates/answers/$cid.md"
          test -s "$candidate"; test -s "$out/source_mapping.json"; test -s "$out/code_validation.json"; test ! -e "$out/isolated_review_result.json"

          # Deliberately form the independent conclusion from source + candidate + fresh execution before reading writer_research.
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const note=JSON.parse(fs.readFileSync(mapping.note_path,'utf8'));
          const q=(note.tagged_questions||[]).find(x=>x.question_id===mapping.note_question_id);
          const expected='编程题：如何将数组拆分成和小于等于 k 的最少数量子数组？';
          if(!q||q.original_question!==expected||q.question_type!=='手写代码_Coding') throw new Error('preserved source wording/type drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(!md.includes(h)) throw new Error(`missing section ${h}`);
          for(const token of ['非空连续段','前缀和','动态规划','O(n²)','允许负数','返回 -1','来源没有提供真实项目']) if(!md.includes(token)) throw new Error(`required source-bounded content missing: ${token}`);
          const fence=md.match(/```java\n([\s\S]*?)\n```/); if(!fence) throw new Error('Java fence missing');
          fs.writeFileSync('/tmp/MinSubarrayPartition.java',fence[1].trim()+'\n');
          const val=JSON.parse(fs.readFileSync(path.join(out,'code_validation.json'),'utf8'));
          if(val.result!=='pass') throw new Error('writer fixture did not pass');
          NODE

          cat > /tmp/MinSubarrayPartitionReviewTest.java <<'JAVA'
          import java.util.Arrays;

          public final class MinSubarrayPartitionReviewTest {
              private static int oracle(int[] nums, long k) {
                  int n = nums.length;
                  if (n == 0) return 0;
                  int best = Integer.MAX_VALUE;
                  int masks = 1 << (n - 1);
                  for (int mask = 0; mask < masks; mask++) {
                      long sum = 0;
                      int parts = 1;
                      boolean ok = true;
                      for (int i = 0; i < n; i++) {
                          sum += nums[i];
                          boolean cut = i == n - 1 || ((mask >>> i) & 1) != 0;
                          if (cut) {
                              if (sum > k) { ok = false; break; }
                              if (i != n - 1) parts++;
                              sum = 0;
                          }
                      }
                      if (ok) best = Math.min(best, parts);
                  }
                  return best == Integer.MAX_VALUE ? -1 : best;
              }

              private static void check(int[] a, long k) {
                  int[] before = a.clone();
                  int actual = MinSubarrayPartition.minSegments(a, k);
                  int expected = oracle(a, k);
                  if (actual != expected) throw new AssertionError("mismatch a="+Arrays.toString(a)+" k="+k+" expected="+expected+" actual="+actual);
                  if (!Arrays.equals(a, before)) throw new AssertionError("input mutated: "+Arrays.toString(before));
              }

              private static void enumerate(int[] a, int i) {
                  if (i == a.length) {
                      for (long k = -4; k <= 6; k++) check(a, k);
                      return;
                  }
                  for (int v = -3; v <= 3; v++) { a[i] = v; enumerate(a, i + 1); }
              }

              public static void main(String[] args) {
                  check(new int[]{}, 0);
                  for (int n = 1; n <= 6; n++) enumerate(new int[n], 0);
                  check(new int[]{Integer.MAX_VALUE, Integer.MAX_VALUE}, Long.MAX_VALUE);
                  check(new int[]{Integer.MIN_VALUE, Integer.MIN_VALUE}, Long.MIN_VALUE / 2);
                  System.out.println("PASS exact-fence exhaustive-signed-length-1..6 k=-4..6 brute-force-cut-oracle empty extreme-int no-mutation");
              }
          }
          JAVA
          mkdir -p /tmp/min-subarray-review-classes
          javac -d /tmp/min-subarray-review-classes /tmp/MinSubarrayPartition.java /tmp/MinSubarrayPartitionReviewTest.java
          stdout="$(java -cp /tmp/min-subarray-review-classes MinSubarrayPartitionReviewTest)"
          test "$stdout" = 'PASS exact-fence exhaustive-signed-length-1..6 k=-4..6 brute-force-cut-oracle empty extreme-int no-mutation'

          hash="$(sha256sum "$candidate" | awk '{print $1}')"
          CANDIDATE_HASH="$hash" REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const result={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_HASH,reviewed_at:'2026-08-26',review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0034-min-subarray-20260826-v1',review_version:'batch-0034.min-subarray-partition.v1',decision:'pass',revision_round:1,source_packet:[mapping.note_path,path.join(out,'source_mapping.json'),'review/content_build/answer_batch_0034/source_boundary_audit.md',`review/candidates/answers/${cid}.md`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5},hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:['The preserved source asks only for the minimum number of subarrays whose sums are <= k; it does not preserve non-negativity, explicit bounds, empty/impossible return conventions, or an explicit clarification of contiguous versus arbitrary grouping.','The candidate makes those missing pieces explicit as answer-side execution policy rather than recovered source: full ordered partition into non-empty contiguous segments, signed int values, empty -> 0 and impossible -> -1.','Because signed values are allowed by the chosen conservative policy, the prefix-sum last-cut DP is appropriate and does not rely on the monotonicity needed by the usual non-negative greedy shortcut.','The exact Java fence independently compiles on JDK 21 and matches a separate brute-force cut-mask oracle for every array of lengths 1..6 over values -3..3 and k values -4..6, plus empty/extreme-int cases, with no input mutation.','The answer scopes the O(n) greedy optimization only to a later non-negative constraint and does not fabricate project experience or source constraints.'],validation:{command:'javac exact candidate fence + independent brute-force cut-mask oracle && java MinSubarrayPartitionReviewTest',result:'pass',stdout:process.env.REVIEW_STDOUT},promotion_blockers:['required_human_approval_not_yet_satisfied','repository_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(path.join(out,'isolated_review_result.json'),JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Bind independent verdict and task progress
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          test -s "$out/writer_research.json"; test -s "$out/isolated_review_result.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const result=JSON.parse(fs.readFileSync(path.join(out,'isolated_review_result.json'),'utf8'));
          if(result.decision!=='pass'||(result.hard_failures||[]).length) throw new Error('isolated verdict not promotable');
          const wp=path.join(out,'writer_research.json'); const writer=JSON.parse(fs.readFileSync(wp,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error(`writer state drifted: ${writer.review_state}`);
          writer.review_state='independent_source_first_review_passed';
          writer.sources.push({source_id:'isolated-review',title:'Independent source-first min-subarray-partition candidate review',locator:path.join(out,'isolated_review_result.json'),source_type:'repository_structured_source',checked_at:'2026-08-26'});
          writer.claims.push({claim_id:'isolated-review-verdict',text:'Independent source-first review found no hard failures, unsupported claims or uncovered source variants and recompiled the exact candidate Java against an exhaustive small signed-array cut-mask oracle.',source_ids:['isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']});
          writer.promotion_blocker='required_human_approval_and_real_review_policy_not_yet_satisfied';
          writer.review={reviewer_id:result.reviewer_id,review_version:result.review_version,independent:true,decision:'pass',revision_round:1,scores:result.scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:result.findings};
          fs.writeFileSync(wp,JSON.stringify(writer,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8');
          const p='- Min-subarray-partition canonical `'+cid+'` passed isolated source-first review and exact-candidate brute-force revalidation; promotion remains blocked only by required human approval and repository real-review policy.';
          if(!t.includes(p)) t += (t.includes('## Progress')?'\n':'\n\n## Progress\n\n')+p+'\n';
          fs.writeFileSync(task,t);
          NODE

      - name: Commit isolated-review result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0034/$CANONICAL_ID/isolated_review_result.json" "review/content_build/answer_batch_0034/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git commit -m 'review: pass batch 0034 min-subarray candidate source-first'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$CONTENT_BRANCH" && git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((attempt*3));
          done
          exit 1
