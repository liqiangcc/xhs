          import json,os,pathlib
          cid=os.environ['CANONICAL_ID'];qid=os.environ['SOURCE_QID'];exact='算法：反转字符串中的元音字母（LeetCode 345）。'
          ctx=json.loads(pathlib.Path('/tmp/b46-vowels/context.json').read_text())
          if not ctx.get('ok') or ctx.get('canonical',{}).get('canonical_id')!=cid: raise SystemExit('canonical context drift')
          if ctx.get('answer_type')!='coding' or ctx.get('canonical',{}).get('question_ids')!=[qid]: raise SystemExit('type/ownership drift')
          src=next((x for x in ctx.get('source_questions',[]) if x.get('question_id')==qid),None)
          if not src or src.get('original_question')!=exact or src.get('is_valid_for_library') is not True: raise SystemExit('source wording/validity drift')
          inv=json.loads(pathlib.Path('review/content_build/answer_batch_0046/source_inventory.json').read_text())
          row=next((x for x in inv.get('items',[]) if x.get('canonical_id')==cid),None)
          if not row or row.get('state')!='active': raise SystemExit('inventory drift')
          out=pathlib.Path(f'review/content_build/answer_batch_0046/{cid}');out.mkdir(parents=True,exist_ok=True)
          (out/'context.json').write_text(json.dumps(ctx,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Stage source-bounded Java candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          if [ ! -e "$candidate" ]; then
            cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_bfcc770bed44745c89171a30433df36a","version":1,"status":"draft","updated_at":"2026-08-28","answer_type":"coding","quality_tier":"candidate"} -->
          # 反转字符串中的元音字母（LeetCode 345）

          ## 核心结论

          LeetCode 345 的契约是：只反转字符串中所有元音字母的出现顺序，其他字符位置不变；元音是 `a/e/i/o/u`，大小写都算。最直接的做法是双指针：左指针从前往后找元音，右指针从后往前找元音，找到一对后交换并继续收缩。每个字符最多被扫描常数次，时间 `O(n)`；Java `String` 不可变，因此下面转成 `char[]`，额外空间 `O(n)`。

          ## 1 分钟版

          - `left` 从左向右跳过非元音，`right` 从右向左跳过非元音。
          - 当两边都停在元音上时交换；然后 `left++`、`right--`。
          - 非元音从不参与交换，所以位置保持不变；每次交换的是当前最外层的一对元音，因此最终元音子序列恰好整体反转。
          - 大小写不做归一化：交换原字符本身，所以 `A`、`e` 等保留原大小写。

          ## 3 分钟版

          ```java
          public final class ReverseVowels {
              public static String reverseVowels(String s) {
                  char[] chars = s.toCharArray();
                  int left = 0, right = chars.length - 1;
                  while (left < right) {
                      while (left < right && !isVowel(chars[left])) left++;
                      while (left < right && !isVowel(chars[right])) right--;
                      if (left < right) {
                          char tmp = chars[left];
                          chars[left] = chars[right];
                          chars[right] = tmp;
                          left++;
                          right--;
                      }
                  }
                  return new String(chars);
              }

              private static boolean isVowel(char c) {
                  return switch (c) {
                      case 'a','e','i','o','u','A','E','I','O','U' -> true;
                      default -> false;
                  };
              }
          }
          ```

          例如 `"IceCreAm"` 的元音序列是 `I,e,e,A`，反转后放回原来的元音位置得到 `"AceCreIm"`；`"leetcode"` 得到 `"leotcede"`。

          ## 关键细节

          - **不反转整个字符串**：只交换元音位置上的字符，辅音、数字、空格、标点等都留在原索引。
          - **大小写**：题目明确大小写元音都算，所以判断集合必须同时包含十个字符。
          - **双指针不变量**：`left` 左侧和 `right` 右侧已经处理完；未处理区间外的元音已经与其镜像元音完成交换。
          - **空/单元音边界**：官方约束字符串非空；长度 1 或只有一个元音时无需交换。若把方法复用于仓库外并允许 `null`，应另定义空引用策略，不能偷偷把 LeetCode 契约改掉。
          - **复杂度**：左右指针总共最多跨过字符串一次，时间 `O(n)`；Java 为修改字符必须创建 `char[]`，因此空间 `O(n)`。

          ## 原理机制

          可以把原字符串投影成“所有元音按原索引组成的子序列”。目标只要求把这个子序列反转，然后写回同一组索引。双指针无需显式收集所有元音：左指针给出子序列的第一个未处理元素，右指针给出最后一个未处理元素，交换后相当于完成一次子序列首尾互换。重复直到指针相遇，就完成了整个元音子序列的反转。

          ## 项目经验版

          这是确定性的字符串算法题，来源没有生产项目背景，不编造项目经验。真实文本处理如果涉及 Unicode 码点、组合字符或语言学意义上的“元音”，就不能直接把这个 ASCII/English-vowel 题目的字符集合外推过去；要先重新定义字符模型和业务规则。

          ## 常见追问

          - 问：为什么不用额外数组先收集元音？答：可以，但双指针直接在 `char[]` 上交换，逻辑更短，也不需要额外的“元音列表”；Java 仍然需要 `char[]` 承载可变字符。
          - 问：`y` 算元音吗？答：这道题不算；官方定义只包含 `a/e/i/o/u` 的大小写。
          - 问：为什么时间是 O(n) 而不是 O(n²)？答：两个指针都只单向移动，每个索引最多被一侧跨过常数次，没有为每个字符重新扫描整串。
          - 问：能原地修改 `String` 吗？答：Java `String` 不可变；当前实现通过 `char[]` 修改后构造新字符串。

          ## 易错点

          - 只识别小写元音，漏掉大写。
          - 每次从另一端重新扫描，写成 O(n²)。
          - 把所有字母甚至整个字符串都反转，破坏非元音位置。
          - 用正则替换却没有显式维护“元音出现顺序反转”的不变量。
          - 把 LeetCode 的 English-vowel 定义外推成完整 Unicode 语言学规则。
          EOF
          fi
          python3 - <<'PY'
          import hashlib,os,pathlib,re
          cid=os.environ['CANONICAL_ID'];p=pathlib.Path(f'review/candidates/answers/{cid}.md');md=p.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java block, got {len(blocks)}')
          pathlib.Path('/tmp/b46-vowels/ReverseVowels.java').write_text(blocks[0].strip()+'\n')
          pathlib.Path('/tmp/b46-vowels/candidate.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          PY

      - name: Compile and validate exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b46-vowels
          cat > ReverseVowelsTest.java <<'EOF'
          import java.util.*;
          public final class ReverseVowelsTest {
              private static boolean vowel(char c){return "aeiouAEIOU".indexOf(c)>=0;}
              private static String oracle(String s){
                  char[] a=s.toCharArray();List<Character> vs=new ArrayList<>();
                  for(char c:a)if(vowel(c))vs.add(c);
                  Collections.reverse(vs);int k=0;
                  for(int i=0;i<a.length;i++)if(vowel(a[i]))a[i]=vs.get(k++);
                  return new String(a);
              }
              private static void check(String s){String got=ReverseVowels.reverseVowels(s),want=oracle(s);if(!got.equals(want))throw new AssertionError(s+" got="+got+" want="+want);}
              public static void main(String[] args){
                  for(String s:new String[]{"IceCreAm","leetcode","a","b","AEIOU","bcdfg","aA","hello world!","123 u-X-e"})check(s);
                  Random r=new Random(345L);String alphabet="abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 -_!?";
                  for(int n=0;n<5000;n++){int len=1+r.nextInt(200);StringBuilder b=new StringBuilder(len);for(int i=0;i<len;i++)b.append(alphabet.charAt(r.nextInt(alphabet.length())));check(b.toString());}
                  System.out.println("PASS fixed=9 randomized=5000 oracle=collect-reverse-writeback uppercase=yes nonvowels=stable");
              }
          }
          EOF
          javac --release 21 ReverseVowels.java ReverseVowelsTest.java
          java ReverseVowelsTest | tee stdout.txt
          test "$(cat stdout.txt)" = 'PASS fixed=9 randomized=5000 oracle=collect-reverse-writeback uppercase=yes nonvowels=stable'

      - name: Freeze evidence and isolated review
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(cat /tmp/b46-vowels/candidate.sha256)" TEST_STDOUT="$(cat /tmp/b46-vowels/stdout.txt)" python3 - <<'PY'
          import json,os,pathlib
          cid=os.environ['CANONICAL_ID'];qid=os.environ['SOURCE_QID'];digest=os.environ['CANDIDATE_SHA'];stdout=os.environ['TEST_STDOUT'];date='2026-08-28'
          out=pathlib.Path(f'review/content_build/answer_batch_0046/{cid}');out.mkdir(parents=True,exist_ok=True)
          validation={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract exact Java candidate; javac --release 21; java ReverseVowelsTest','stdout':stdout,'checks':['official examples','uppercase/lowercase vowels','non-vowel positions stable','5000 randomized strings vs independent collect/reverse/writeback oracle']}
          (out/'writer_validation.json').write_text(json.dumps(validation,ensure_ascii=False,indent=2)+'\n')
          sources=[{'source_id':'batch-inventory','title':'Batch 0046 source-first inventory','locator':'review/content_build/answer_batch_0046/source_inventory.json','source_type':'repository_structured_source','checked_at':date},{'source_id':'leetcode-345','title':'LeetCode 345 Reverse Vowels of a String','locator':'https://leetcode.com/problems/reverse-vowels-of-a-string/description/','source_type':'primary_problem_statement','checked_at':date},{'source_id':'writer-validation','title':'Exact reverse-vowels randomized differential validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date}]
          claims=[{'claim_id':'problem-contract','text':'LeetCode 345 asks to reverse only the vowels in s and return the resulting string; vowels are a/e/i/o/u in either case.','source_ids':['batch-inventory','leetcode-345'],'answer_locations':['核心结论','1 分钟版','关键细节']},{'claim_id':'algorithm','text':'The two-pointer implementation preserves every non-vowel index and reverses the vowel subsequence; fixed and 5000 randomized cases match an independent collect/reverse/writeback oracle.','source_ids':['writer-validation'],'answer_locations':['1 分钟版','3 分钟版','原理机制']},{'claim_id':'complexity','text':'Each pointer advances monotonically across the input, so scanning is linear; Java String immutability causes the candidate to materialize a char array/new String.','source_ids':['writer-validation'],'answer_locations':['核心结论','关键细节','常见追问']}]
          research={'schema_version':'answer_writer_research.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'review_state':'writer_complete_isolated_review_pending','sources':sources,'claims':claims,'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','项目经验版','常见追问','易错点']}],'promotion_blocker':'isolated_independent_review_not_yet_performed'}
          (out/'writer_research.json').write_text(json.dumps(research,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=['The answer is source-exact to LeetCode 345 and does not invent a different string task.','The two-pointer invariant directly explains why non-vowels stay fixed while the vowel subsequence reverses.','Upper- and lower-case vowels are both handled as required.','The exact Java candidate compiles and matches an independent oracle on fixed examples and 5000 randomized inputs.','Complexity and Java String mutability boundaries are stated without overstating in-place behavior.']
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-batch-0046-reverse-vowels-20260828-v1','review_version':'batch-0046.reverse-vowels.v1','decision':'pass','revision_round':1,'source_packet':['review/content_build/answer_batch_0046/source_inventory.json',f'review/candidates/answers/{cid}.md',str(out/'writer_validation.json'),'https://leetcode.com/problems/reverse-vowels-of-a-string/description/','docs/refactor/09_answer_content_standard.md'],'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']}
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'content-batch-0046-reverse-vowels-builder','writer_version':'xhs-answer-curator.v1'},'sources':sources+[{'source_id':'isolated-review','title':'Reverse-vowels source-first isolated review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}],'claims':claims,'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','项目经验版','常见追问','易错点']}],'validation':{'command':validation['command'],'result':'pass','reported_stdout':validation['stdout'],'checks':validation['checks']},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings},'promotion_blocker':'repository_human_approval_and_real_review_policy_not_yet_satisfied'}
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0046.md');text=task.read_text()
          line='- [x] `cq_q_bfcc770bed44745c89171a30433df36a` now has a source-exact LeetCode 345 reverse-vowels Java candidate. The two-pointer implementation preserves non-vowel positions, handles upper/lower-case vowels, and matches an independent collect/reverse/writeback oracle across official/fixed cases plus 5000 deterministic randomized inputs. Isolated source-first review PASSes; formal promotion remains blocked by repository human-approval/real-review policy.'
          if '## Progress' not in text:text=text.rstrip()+'\n\n## Progress\n'
          if line not in text:text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY

      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit reviewed candidate only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")";base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced during candidate review: $base_head -> $remote_head";echo 'Discard verified local packet; rerun against current branch.';exit 0;fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0046/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0046.md
          if git diff --cached --quiet;then echo 'No reverse-vowels candidate changes to commit.';exit 0;fi
          git diff --cached --check
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: pass batch 0046 reverse-vowels candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
