    branches: [master]
    paths:
      - .github/workflows/content-batch-0046-reverse-vowels.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0046-reverse-vowels
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_bfcc770bed44745c89171a30433df36a
  SOURCE_QID: bfcc770bed44745c89171a30433df36a

