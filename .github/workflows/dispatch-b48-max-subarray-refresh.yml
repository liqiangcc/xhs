name: Dispatch Batch 0048 Max Subarray Refresh

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/dispatch-b48-max-subarray-refresh.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch registered survivor refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run refresh-content-batch-0048-max-subarray-survivor.yml --ref master -R "$GITHUB_REPOSITORY"
