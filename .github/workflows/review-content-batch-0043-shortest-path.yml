name: Review Content Batch 0043 Shortest Path

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-shortest-path.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-shortest-path-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b4585610b9994d240a2ec669176946c4
  SOURCE_QID: b4585610b9994d240a2ec669176946c4

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：最短路径';
          const note=JSON.parse(fs.readFileSync('note_tagged/67d3a6b10000000006029b65.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact)throw new Error('inventory drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid]))throw new Error('inventory ownership drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','Dijkstra','BFS','Bellman-Ford','Long.MAX_VALUE'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(!md.includes('来源只保留“算法：最短路径”')||!md.includes('不存在唯一实现')||!md.includes('非负'))throw new Error('under-specified source/weight boundary not explicit');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];if(blocks.length!==1)throw new Error('candidate Java block missing or ambiguous');
          fs.writeFileSync('/tmp/Solution.java',blocks[0][1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_independent_bellman_ford_differential',candidate_sha256:sha,source_boundary:'The source preserves only a generic shortest-path coding prompt. Direction, weight model, negative-edge policy, API, target and representation are not preserved, so the Dijkstra implementation is a declared nonnegative directed-graph reference contract rather than reconstructed source semantics.'},null,2)+'\n');
          NODE

      - name: Execute independent Bellman-Ford differential validation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ReviewerHarness.java <<'JAVA'
          import java.math.BigInteger;
          import java.util.*;

          public final class ReviewerHarness {
              private record E(int from, int to, long w) {}
              private static final BigInteger LIMIT = BigInteger.valueOf(Long.MAX_VALUE);

              private static List<List<Solution.Edge>> graph(int n, List<E> edges) {
                  List<List<Solution.Edge>> g = new ArrayList<>();
                  for (int i = 0; i < n; i++) g.add(new ArrayList<>());
                  for (E e : edges) g.get(e.from()).add(new Solution.Edge(e.to(), e.w()));
                  return g;
              }

              private static long[] oracle(int n, List<E> edges, int source) {
                  BigInteger[] d = new BigInteger[n];
                  d[source] = BigInteger.ZERO;
                  for (int pass = 0; pass < n - 1; pass++) {
                      boolean changed = false;
                      for (E e : edges) {
                          if (e.w() < 0) throw new IllegalArgumentException("negative edge");
                          if (d[e.from()] == null) continue;
                          BigInteger cand = d[e.from()].add(BigInteger.valueOf(e.w()));
                          if (d[e.to()] == null || cand.compareTo(d[e.to()]) < 0) {
                              d[e.to()] = cand;
                              changed = true;
                          }
                      }
                      if (!changed) break;
                  }
                  long[] out = new long[n];
                  for (int i = 0; i < n; i++) {
                      if (d[i] == null || d[i].compareTo(LIMIT) >= 0) out[i] = Long.MAX_VALUE;
                      else out[i] = d[i].longValueExact();
                  }
                  return out;
              }

              private static void check(int n, List<E> edges, int source) {
                  long[] got = Solution.dijkstra(graph(n, edges), source);
                  long[] want = oracle(n, edges, source);
                  if (!Arrays.equals(got, want)) throw new AssertionError("got=" + Arrays.toString(got) + " want=" + Arrays.toString(want));
              }

              private static void expectNegativeRejected() {
                  List<E> edges = List.of(new E(0, 1, -1));
                  try {
                      Solution.dijkstra(graph(2, edges), 0);
                      throw new AssertionError("negative edge accepted");
                  } catch (IllegalArgumentException expected) {
                      if (!String.valueOf(expected.getMessage()).contains("negative")) throw expected;
                  }
              }

              public static void main(String[] args) {
                  check(4, List.of(new E(0,1,4),new E(0,2,1),new E(2,1,2),new E(1,3,1),new E(2,3,5)), 0);
                  check(5, List.of(new E(0,0,0),new E(0,1,7),new E(0,1,2),new E(1,2,0),new E(2,3,3)), 0);
                  check(2, List.of(new E(0,1,Long.MAX_VALUE)), 0);
                  check(2, List.of(new E(0,1,Long.MAX_VALUE-1)), 0);
                  check(3, List.of(new E(0,1,Long.MAX_VALUE-2),new E(1,2,10),new E(0,2,Long.MAX_VALUE-1)), 0);
                  expectNegativeRejected();

                  Random r = new Random(0x53484F5254455354L);
                  for (int t = 0; t < 20000; t++) {
                      int n = 1 + r.nextInt(9), m = r.nextInt(45), source = r.nextInt(n);
                      List<E> edges = new ArrayList<>();
                      for (int i = 0; i < m; i++) edges.add(new E(r.nextInt(n), r.nextInt(n), r.nextInt(1001)));
                      check(n, edges, source);
                  }

                  for (int t = 0; t < 5000; t++) {
                      int n = 2 + r.nextInt(7), m = 1 + r.nextInt(30), source = r.nextInt(n);
                      List<E> edges = new ArrayList<>();
                      for (int i = 0; i < m; i++) {
                          long w;
                          switch (r.nextInt(5)) {
                              case 0 -> w = Long.MAX_VALUE;
                              case 1 -> w = Long.MAX_VALUE - 1 - r.nextInt(1000);
                              default -> w = r.nextInt(1000000);
                          }
                          edges.add(new E(r.nextInt(n), r.nextInt(n), w));
                      }
                      check(n, edges, source);
                  }
                  System.out.println("PASS fixed=covered zero-parallel-selfloop-unreachable=covered sentinel-boundary=covered random-small=20000 random-near-max=5000 negative-edge=rejected oracle=bellman-ford-bigint");
              }
          }
          JAVA
          cp /tmp/Solution.java /tmp/Solution.java.tmp && mv /tmp/Solution.java.tmp /tmp/Solution.java
          (cd /tmp && javac Solution.java ReviewerHarness.java && stdout="$(java ReviewerHarness)" && echo "$stdout" && test "$stdout" = 'PASS fixed=covered zero-parallel-selfloop-unreachable=covered sentinel-boundary=covered random-small=20000 random-near-max=5000 negative-edge=rejected oracle=bellman-ford-bigint' && printf 'REVIEW_STDOUT=%s\n' "$stdout" >> "$GITHUB_ENV")

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_independent_bellman_ford_differential'||pre.candidate_sha256!==sha)throw new Error('source-first preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/shortest_path_validation.json`,'utf8'));if(writerValidation.result!=='pass'||writerValidation.candidate_sha256!==sha)throw new Error('writer validation/hash drifted');
          const tests=[{case:'fixed weighted graph plus zero-weight/self-loop/parallel/unreachable boundaries',expected:'exact distances match independent Bellman-Ford oracle',passed:true},{case:'Long.MAX_VALUE sentinel, Long.MAX_VALUE-1 finite value and overflow-path competition',expected:'reserved sentinel is never emitted as a representable finite path while Long.MAX_VALUE-1 remains representable',passed:true},{case:'20,000 seeded small nonnegative directed graphs',expected:'all distances equal independent Bellman-Ford oracle',passed:true},{case:'5,000 seeded near-long-maximum graphs',expected:'all representable/sentinel results equal BigInteger Bellman-Ford oracle',passed:true},{case:'negative edge',expected:'declared Dijkstra reference contract rejects unsupported input',passed:true}];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact Java candidate and differential-test against independent BigInteger Bellman-Ford oracle',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The source preserves only the generic prompt “算法：最短路径”; direction, weight model, target, API and negative-edge semantics are not recoverable, and the candidate explicitly keeps those as clarification points before declaring its reference contract.','The candidate does not collapse shortest-path choices into one algorithm: it distinguishes BFS for equal-weight/unweighted graphs, Dijkstra for nonnegative weights and negative-edge algorithms such as Bellman-Ford when the weight model changes.','Within its declared directed nonnegative-long reference contract, the Java implementation maintains the Dijkstra relaxation invariant and handles stale priority-queue entries without an unsafe early visited fence.','The reserved Long.MAX_VALUE sentinel is now explicit: representable finite distances are strictly below the sentinel, Long.MAX_VALUE-1 is preserved, and sentinel-equal or overflowing candidates are not silently misrepresented as finite results.','Independent BigInteger Bellman-Ford differential testing passes fixed structural boundaries, 20,000 seeded small graphs and 5,000 seeded near-long-maximum graphs; negative edges are rejected as declared.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-shortest-path-20260827-v1',review_version:'batch-0043.shortest-path.v1',decision:'pass',revision_round:0,source_packet:['note_tagged/67d3a6b10000000006029b65.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-shortest-path-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-note',title:'Tagged interview note preserving generic shortest-path coding prompt',locator:'note_tagged/67d3a6b10000000006029b65.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer shortest-path differential validation',locator:`${out}/shortest_path_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent BigInteger Bellman-Ford differential validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Shortest-path source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves only a generic shortest-path coding prompt; graph direction, weight model, negative-edge policy, API and target are not preserved.',source_ids:['tagged-note','source-inventory','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'algorithm-selection',text:'The candidate conditions BFS/Dijkstra/Bellman-Ford selection on the preserved-or-explicit weight contract instead of presenting Dijkstra as an unconditional source requirement.',source_ids:['isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节','常见追问']},{claim_id:'reference-behavior',text:'Under the declared directed nonnegative-long contract with Long.MAX_VALUE reserved as unreachable/out-of-range sentinel, the exact Java implementation matches independent BigInteger Bellman-Ford results over fixed boundaries, 20,000 small random graphs and 5,000 near-long-maximum graphs and rejects negative edges.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'compile exact Java candidate and differential-test against independent BigInteger Bellman-Ford oracle',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b4585610b9994d240a2ec669176946c4` completed writer remediation and isolated source-first review. The source preserves only a generic shortest-path coding prompt, so graph direction, weight model, target, API and negative-edge semantics remain clarification points; the nonnegative directed-graph Dijkstra implementation is explicitly a reference contract. Writer remediation made Long.MAX_VALUE a reserved unreachable/out-of-range sentinel and preserved Long.MAX_VALUE-1 as the largest representable finite distance. The independent reviewer differential-tested the exact Java implementation against a structurally separate BigInteger Bellman-Ford oracle on fixed boundaries, 20,000 seeded small graphs and 5,000 seeded near-long-maximum graphs, and confirmed negative-edge rejection. Strict candidate audit, code gate, and repository gates are green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 shortest-path candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
          done
          exit 1
