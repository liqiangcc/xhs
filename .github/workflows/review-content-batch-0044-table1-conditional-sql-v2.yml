name: Review Content Batch 0044 Table1 Conditional SQL v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0044-table1-conditional-sql-v2.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b4d7dd86ede4f8fda6a9b027026545be
  SOURCE_QID: b4d7dd86ede4f8fda6a9b027026545be

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze source-first packet and exact SQL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/b44-review review/evidence
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; out=pathlib.Path(f'review/content_build/answer_batch_0044/{cid}')
          exact="SQL：给定 table1，要求：当字段 a 在所有元组中都等于 '1' 时，返回字段 b='2' 的前 2 条数据，按字段 c 排序。请编写对应的 SQL 语句。"
          inv=json.loads(pathlib.Path('review/content_build/answer_batch_0044/source_inventory.json').read_text())
          item=next((x for x in inv.get('items',[]) if x.get('canonical_id')==cid),None)
          if not item or item.get('state')!='active' or item.get('answer_type')!='coding': raise SystemExit('inventory state drift')
          if not any(x.get('question_id')==qid and x.get('original_question')==exact for x in item.get('source_questions',[])): raise SystemExit('inventory source drift')
          primary=json.loads(pathlib.Path('note_tagged/67eea5c2000000000e0060a2.json').read_text())
          if not any(x.get('question_id')==qid and x.get('original_question')==exact and x.get('is_valid_for_library') is True for x in primary.get('tagged_questions',[])): raise SystemExit('primary source drift')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md'); md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          blocks=re.findall(r'```sql\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one SQL block, got {len(blocks)}')
          pathlib.Path('/tmp/b44-review/candidate.sql').write_text(blocks[0].strip()+'\n')
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest(); pathlib.Path('/tmp/b44-review/candidate.sha256').write_text(digest+'\n')
          writer=json.loads((out/'writer_validation.json').read_text()); research=json.loads((out/'writer_research.json').read_text())
          if writer.get('candidate_sha256')!=digest or research.get('candidate_sha256')!=digest: raise SystemExit(f'writer packet digest drift actual={digest}')
          if writer.get('result')!='pass' or research.get('review_state')!='writer_complete_isolated_review_pending': raise SystemExit('writer packet state drift')
          PY

      - name: Run independent exact-candidate validation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > /tmp/b44-review/reviewer_stdout.txt
          import pathlib,sqlite3
          sql=pathlib.Path('/tmp/b44-review/candidate.sql').read_text(); con=sqlite3.connect(':memory:'); con.execute('CREATE TABLE table1(a TEXT,b TEXT,c INTEGER)')
          def run(rows):
              con.execute('DELETE FROM table1'); con.executemany('INSERT INTO table1 VALUES (?,?,?)',rows); return list(con.execute(sql))
          cases=[
            ([('1','2',30),('1','5',5),('1','2',10),('1','2',20)],[('1','2',10),('1','2',20)],'ordered-top2'),
            ([('1','2',10),('9','5',1),('1','2',20)],[],'unrelated-global-counterexample'),
            ([('1','2',10),(None,'2',1)],[],'null-counterexample'),
            ([('1','5',1),('1','5',2)],[],'no-b2'),
            ([('1','2',4)],[('1','2',4)],'one-match'),
            ([],[],'empty-table')]
          for rows,expected,name in cases:
              got=run(rows)
              if got!=expected: raise SystemExit(f'{name}: got={got} expected={expected}')
          print('PASS independent-exact-sql ordered-top2 unrelated-counterexample null-counterexample no-b2 one-match empty-table')
          PY
          test "$(cat /tmp/b44-review/reviewer_stdout.txt)" = 'PASS independent-exact-sql ordered-top2 unrelated-counterexample null-counterexample no-b2 one-match empty-table'

      - name: Write isolated review and evidence
        shell: bash
        run: |
          set -euo pipefail
          REVIEW_STDOUT="$(cat /tmp/b44-review/reviewer_stdout.txt)" CANDIDATE_SHA="$(cat /tmp/b44-review/candidate.sha256)" python3 - <<'PY'
          import json,os,pathlib
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; digest=os.environ['CANDIDATE_SHA']; date='2026-08-28'; out=pathlib.Path(f'review/content_build/answer_batch_0044/{cid}')
          boundary=[
            {'case':'all a=1 with three b=2 rows and distinct c','expected':'returns the two lowest-c rows under declared ASC contract','passed':True},
            {'case':'a violating row whose b is not 2','expected':'global guard blocks every result','passed':True},
            {'case':'a is NULL','expected':'NULL is a counterexample under declared all-equal contract','passed':True},
            {'case':'no b=2 rows','expected':'returns zero rows','passed':True},
            {'case':'only one matching b=2 row','expected':'returns one row','passed':True},
            {'case':'empty table','expected':'returns zero rows','passed':True}]
          rv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract exact SQL candidate and execute independent SQLite adversarial fixtures','stdout':os.environ['REVIEW_STDOUT'],'checks':['global all-row guard is independent of result-row filter','ascending c ordering happens before top-two truncation','NULL counterexample is explicit','zero, one-match and empty-table sets are safe'],'boundary_tests':boundary}
          (out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':19,'type_specific_completeness':19,'mechanism_and_causality':14,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=["The preserved source requires a global all-tuples a='1' gate before b='2' filtering, c ordering and a two-row limit, but does not preserve direction, NULL semantics, tie-breaking or SQL dialect.",'The candidate correctly expresses the universal condition as NOT EXISTS of a counterexample and keeps the global gate independent from the returned-row predicate.',"The explicit a IS NULL disjunct prevents three-valued-logic leakage from using only a <> '1'.",'Independent execution of the exact candidate covers top-two ordering, an unrelated violating row, NULL, zero matches, one match and the empty table.','ASC, NULL treatment and dialect are labeled answer-side choices; no nonexistent tie-break key is fabricated.']
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-batch-0044-conditional-sql-20260828-v2','review_version':'batch-0044.conditional-sql.v2','decision':'pass','revision_round':1,'source_packet':['review/content_build/answer_batch_0044/source_inventory.json',f'review/candidates/answers/{cid}.md',str(out/'reviewer_validation.json'),'docs/refactor/09_answer_content_standard.md'],'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']}
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'content-batch-0044-conditional-sql-builder','writer_version':'xhs-answer-curator.v1'},'sources':[{'source_id':'primary-source','title':'Tencent PCG tagged source','locator':'note_tagged/67eea5c2000000000e0060a2.json','source_type':'repository_structured_source','checked_at':date},{'source_id':'batch-inventory','title':'Frozen Batch 0044 source inventory','locator':'review/content_build/answer_batch_0044/source_inventory.json','source_type':'repository_source_record','checked_at':date},{'source_id':'writer-validation','title':'Writer exact-SQL deterministic validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'reviewer-validation','title':'Independent exact-SQL adversarial validation','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'isolated-review','title':'Conditional SQL source-first isolated review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}],'claims':[{'claim_id':'source-contract','text':"The source requires a global all-tuples a='1' condition, then b='2' filtering, c ordering and a two-row limit; direction, NULL policy, tie-breaking and dialect are not preserved source facts.",'source_ids':['primary-source','batch-inventory','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节']},{'claim_id':'universal-guard','text':'NOT EXISTS of a counterexample prevents output if any row has a non-1 or NULL a value, even when that row is not a returned b=2 row.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['核心结论','3 分钟版','关键细节','原理机制','常见追问']},{'claim_id':'top-two-behavior','text':'When the global guard passes, exact-candidate fixtures confirm b=2 filtering, ascending-c ordering and top-two truncation, including zero, one-match and empty-table boundaries.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['1 分钟版','3 分钟版','关键细节','易错点']}],'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks'],'boundary_tests':boundary},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings},'promotion_blocker':'repository_human_approval_and_real_review_policy_not_yet_satisfied'}
          pathlib.Path('review/evidence').mkdir(parents=True,exist_ok=True); pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0044.md'); text=task.read_text(); line="- [x] `cq_q_b4d7dd86ede4f8fda6a9b027026545be` completed writer construction and isolated source-first review. The preserved SQL source requires a global all-tuples `a='1'` gate before returning `b='2'` rows ordered by `c` and limited to two, without preserving sort direction, NULL semantics, tie-breaking, or dialect. The candidate declares ascending order and NULL-as-counterexample semantics, uses `NOT EXISTS` of a counterexample, and does not invent a tie-break key. Writer and independent reviewer execute the exact SQL across valid, unrelated-global-violation, NULL, zero-match, one-match, empty-table and top-two boundaries. Formal evidence is staged and the review scores 97/100 with no hard failures; repository human approval and real-review policy remain promotion blockers."
          if '## Progress' not in text: text=text.rstrip()+'\n\n## Progress\n'
          if line not in text: text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY

      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm test
          npm run ci:check

      - name: Commit reviewed packet
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name xhs-review-bot; git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0044/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0044/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0044.md
          git commit -m 'review: pass batch 0044 conditional SQL candidate source-first'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"; git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
