name: Content Batch 0054 Slice B

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0054-slice-b.yml
      - scripts/content/build_batch_0054_slice_b.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0054-slice-b
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  validate-review-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build validate and source-first review bounded slice
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/build_batch_0054_slice_b.py > /tmp/build.py
          python3 -m py_compile /tmp/build.py
          python3 /tmp/build.py

      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          for cid in \
            cq_q_f04ccedc97d093d669b3f71ba92dbcaf \
            cq_q_f278e0d3e4b7873755b454efd1dc9692; do
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/$cid.md" --require-evidence --require-code --noWrite --noDraftCheck
          done
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0054 slice B: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          for cid in \
            cq_q_f04ccedc97d093d669b3f71ba92dbcaf \
            cq_q_f278e0d3e4b7873755b454efd1dc9692; do
            git add "review/candidates/answers/$cid.md" "review/content_build/answer_batch_0054/$cid" "review/evidence/$cid.json"
          done
          git add tasks/answer-batches/TASK-20260711-0313-answer-batch-0054.md
          if git diff --cached --quiet; then
            echo 'No Batch 0054 slice B changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: pass batch 0054 coding slice B source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
