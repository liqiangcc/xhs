          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Answer Batch 0029 frozen repository source boundary',locator:'review/content_build/answer_batch_0029/source_boundary_audit.json',source_type:'repository_source_record',checked_at:date},{source_id:'leetcode-1488',title:'LeetCode 1488 - Avoid Flood in The City',locator:'https://leetcode.com/problems/avoid-flood-in-the-city/',source_type:'official_problem_statement',checked_at:date},{source_id:'fixture',title:'Avoid Flood deterministic Java simulation fixture',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-identity',text:'The repository source explicitly identifies LeetCode 1488 Avoid Flood; the official problem statement defines rainy days, dry days, -1 on rain, arbitrary positive lake on dry days, and empty output when impossible.',source_ids:['repository-source','leetcode-1488'],answer_locations:['核心结论','1 分钟版','关键细节']},{claim_id:'greedy-scheduling',text:'The candidate tracks each lake last-rain date and assigns the earliest still-unused dry day strictly after that date when the lake rains again.',source_ids:['fixture'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']},{claim_id:'boundary-validation',text:'The executable simulator validates successful schedules and impossibility across repeated-lake windows, unused dry days and immediate repeats, plus defensive null/negative input handling.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Avoid-Flood/LeetCode-1488 candidate staged source-first against the repository identity plus the official problem statement; TreeSet scheduling and impossible cases are covered by a deterministic Java simulator; isolated source-first review remains pending.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Run repository gates for writer stage
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:coverage

      - name: Commit candidate only from stable content head
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during avoid-flood writer: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0029/$CANONICAL_ID/context.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/AvoidFlood.java" "review/content_build/answer_batch_0029/$CANONICAL_ID/AvoidFloodTest.java" "review/content_build/answer_batch_0029/$CANONICAL_ID/code_validation.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage batch 0029 avoid-flood candidate'
