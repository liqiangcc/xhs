name: Retry Content Batch 0035 Tree Substructure Strict Review

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/retry-content-batch-0035-tree-substructure-strict-review.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0035-tree-substructure-strict-review-retry
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_2c267f2f448a08e8b1f1e1590ce6df72
  EXPLICIT_QID: 7f3216de4698813dc7c1e7cf479deb0f
  GENERIC_QID: 2c267f2f448a08e8b1f1e1590ce6df72

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard, executable rerun, and round-capped evidence
        shell: bash
        run: |
          set -euo pipefail
          oldout="review/content_build/answer_batch_0018/$CANONICAL_ID"
          newout='review/content_build/answer_batch_0035/tree_substructure_source_expansion'
          javac "$oldout/BinaryTreeSubstructure.java" "$oldout/BinaryTreeSubstructureTest.java"
          stdout="$(java -cp "$oldout" BinaryTreeSubstructureTest)"
          test "$stdout" = 'PASS fixed=9 randomized=5000 oracle=enumerate-roots-and-match emptyB=false mutation=none'
          STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,eq=process.env.EXPLICIT_QID,gq=process.env.GENERIC_QID,date='2026-08-26',newout='review/content_build/answer_batch_0035/tree_substructure_source_expansion';
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cs=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const c=cs.find(x=>x.canonical_id===cid), expected=[eq,gq].sort();
          if(!c||JSON.stringify([...(c.question_ids||[])].sort())!==JSON.stringify(expected)) throw new Error('source ownership drifted');
          const explicit=qs.find(q=>q.question_id===eq),generic=qs.find(q=>q.question_id===gq);
          if(!explicit?.original_question.includes('约定空树不是子结构')||!explicit.original_question.includes('请分析时空复杂度')) throw new Error('explicit source drifted');
          if(generic?.original_question!=='算法：判断树B是否是树A的子结构 ：输入两颗二叉树，判断B是否是A的子结构') throw new Error('generic source drifted');
          const candidate=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(candidate,'utf8');
          if(!md.includes('public final class BinaryTreeSubstructure')) throw new Error('complete Java class missing');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          const h=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const writer=JSON.parse(fs.readFileSync(`${newout}/writer.json`,'utf8')); if(writer.candidate_sha256!==h) throw new Error('writer hash stale');
          fs.writeFileSync(`${newout}/code_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'javac BinaryTreeSubstructure.java BinaryTreeSubstructureTest.java && java BinaryTreeSubstructureTest',stdout:process.env.STDOUT,checks:['fixed=9','randomized=5000','independent enumerate-roots-and-match oracle','empty B false','repeated candidate roots','extra A descendants allowed','no mutation']},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-tree-substructure-expansion-20260826-v3';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The surviving Canonical owns exactly the two current tree-substructure Questions.','Only the newer source explicitly says empty B is not a substructure and requests time/space complexity; the candidate preserves that source asymmetry.','The Java answer is a complete compilable class and the followups are question-specific.','The matcher correctly permits extra descendants in A after B is exhausted.','Nine fixed plus 5000 deterministic randomized cases match an independent enumerate-roots-and-match oracle without mutation.','Worst-case O(|A|*|B|) time and recursion-height space match the implementation and explicit complexity request.','No unsupported attribution, fabricated experience, uncovered variant, placeholder implementation, or hard failure remains; formal promotion remains policy-gated.'];
          const reviewPath=`${newout}/isolated_review_result.json`;
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:h,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'tree-substructure.source-expansion.v3',decision:'pass',revision_round:2,source_packet:['review/content_build/answer_batch_0035/tree_substructure_relation_review.md',candidate,`${newout}/code_validation.json`,'data/questions/questions.jsonl','config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:h,checked_at:date,writer:{writer_id:'tree-substructure-source-expansion-writer-20260826-v2',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'explicit-source',title:'Tree-substructure source with empty-tree and complexity requirements',locator:`data/questions/questions.jsonl#question_id=${eq}`,source_type:'repository_source_record',checked_at:date},{source_id:'generic-source',title:'Generic tree-substructure source',locator:`data/questions/questions.jsonl#question_id=${gq}`,source_type:'repository_source_record',checked_at:date},{source_id:'relation-review',title:'Batch 0035 tree-substructure source-first relation review',locator:'review/content_build/answer_batch_0035/tree_substructure_relation_review.md',source_type:'repository_structured_source',checked_at:date},{source_id:'validation',title:'Fresh deterministic tree-substructure validation',locator:`${newout}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'shared-goal',text:'Both retained Questions ask whether binary tree B is a substructure of binary tree A.',source_ids:['explicit-source','generic-source','relation-review'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'source-asymmetry',text:'Only the newer source explicitly states empty B is not a substructure and requests complexity analysis.',source_ids:['explicit-source','generic-source','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','常见追问']},{claim_id:'matching-correctness',text:'Searching candidate roots in A and succeeding when B is exhausted implements substructure semantics and permits extra descendants in A.',source_ids:['validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'complexity',text:'The implementation has O(|A|*|B|) worst-case time and recursion stack bounded by tree heights.',source_ids:['validation','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'validation',text:'The exact implementation passes 9 fixed and 5000 deterministic randomized cases against an independent oracle with empty-B=false and no mutation.',source_ids:['validation'],answer_locations:['关键细节','原理机制']}],source_question_coverage:[{question_id:eq,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']},{question_id:gq,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac BinaryTreeSubstructure.java BinaryTreeSubstructureTest.java && java BinaryTreeSubstructureTest',result:'pass',reported_stdout:process.env.STDOUT,checks:['fixed=9','randomized=5000','independent oracle','empty B false','no mutation'],boundary_tests:[{case:'empty B',expected:'false from explicit source contract',passed:true},{case:'A extra descendants after B ends',expected:'still matches',passed:true},{case:'repeated values',expected:'later candidate roots not skipped',passed:true},{case:'5000 deterministic random pairs',expected:'matches independent oracle',passed:true}]},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'tree-substructure.source-expansion.v3',independent:true,decision:'pass',revision_round:2,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md';let t=fs.readFileSync(task,'utf8');
          const pending=`- [ ] \`${cid}\` surviving tree-substructure candidate has been source-attribution refreshed for both consolidated Questions; deterministic fixture rerun and fresh isolated source-first review/evidence are required before this source-expansion slice is complete.`;
          const passed=`- [x] \`${cid}\` surviving tree-substructure candidate covers both consolidated Questions, preserves source asymmetry, is strict-auditable as a complete Java class with question-specific followups, and passes fresh isolated source-first review plus the 9-fixed/5000-random oracle validation. Formal promotion remains governed by repository human approval and real-review policy.`;
          if(!t.includes(pending)) throw new Error('pending task marker missing'); fs.writeFileSync(task,t.replace(pending,passed));
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$newout" tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass strict tree-substructure source expansion'
          git push origin "HEAD:$CONTENT_BRANCH"
