name: Review Content Batch 0021 Topological Sort Isolated

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/review-content-batch-0021-topological-sort-isolated.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0021-topological-sort-isolated-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_37ffe67ab69164654b0a19aa57b410df
  SOURCE_QID: 37ffe67ab69164654b0a19aa57b410df
  SOURCE_NOTE: note_desc/65f3d1b5000000001302669c.txt
  SOURCE_TAGGED: note_tagged/65f3d1b5000000001302669c.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Phase A source-first review and independent permutation oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0021/$cid"
          candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"
          rm -rf "$out/reviewer_tmp"
          mkdir -p "$out/reviewer_tmp"

          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const out=`review/content_build/answer_batch_0021/${cid}`;
          const raw=fs.readFileSync(process.env.SOURCE_NOTE,'utf8');
          if(!raw.includes('8.手撕 拓扑排序')) throw new Error('primary source wording drift');
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const tq=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tq||tq.original_question!=='算法：拓扑排序') throw new Error('tagged question drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift: ${h}`);
          for(const marker of ['Kahn','入度','有向环','O(V + E)','答案可能不唯一','来源没有真实项目经历']) if(!md.includes(marker)) throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md)) throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1) throw new Error(`expected one Java block, got ${blocks.length}`);
          fs.writeFileSync(`${out}/reviewer_tmp/TopologicalSort.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/IndependentReviewerTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Random;

          public final class IndependentReviewerTest {
              private static long exhaustiveGraphs = 0;
              private static long exhaustiveDags = 0;
              private static long exhaustiveCycles = 0;
              private static long randomizedDags = 0;

              public static void main(String[] args) {
                  for (int n = 0; n <= 4; n++) exhaustive(n);
                  deterministicBoundaries();
                  randomizedDags();
                  invalidInputs();
                  System.out.printf("PASS exhaustive_graphs=%d exhaustive_dags=%d exhaustive_cycles=%d randomized_dags=%d oracle=permutation-validity duplicates=pass invalid=reject%n",
                          exhaustiveGraphs, exhaustiveDags, exhaustiveCycles, randomizedDags);
              }

              private static void exhaustive(int n) {
                  List<int[]> possible = new ArrayList<>();
                  for (int u = 0; u < n; u++) for (int v = 0; v < n; v++) if (u != v) possible.add(new int[]{u,v});
                  int total = 1 << possible.size();
                  for (int mask = 0; mask < total; mask++) {
                      List<int[]> es = new ArrayList<>();
                      for (int bit = 0; bit < possible.size(); bit++) if ((mask & (1 << bit)) != 0) es.add(possible.get(bit));
                      int[][] edges = es.toArray(new int[0][]);
                      int[] oracle = permutationOracle(n, edges);
                      exhaustiveGraphs++;
                      if (oracle != null) {
                          exhaustiveDags++;
                          int[] actual = TopologicalSort.sort(n, edges);
                          assertValidOrder(n, edges, actual);
                      } else {
                          exhaustiveCycles++;
                          expect(IllegalArgumentException.class, () -> TopologicalSort.sort(n, edges));
                      }
                  }
              }

              private static int[] permutationOracle(int n, int[][] edges) {
                  int[] p = new int[n];
                  boolean[] used = new boolean[n];
                  return searchPermutation(0, p, used, edges) ? p.clone() : null;
              }

              private static boolean searchPermutation(int pos, int[] p, boolean[] used, int[][] edges) {
                  if (pos == p.length) return isValidOrder(p.length, edges, p);
                  for (int v = 0; v < p.length; v++) {
                      if (used[v]) continue;
                      used[v] = true;
                      p[pos] = v;
                      if (searchPermutation(pos + 1, p, used, edges)) return true;
                      used[v] = false;
                  }
                  return false;
              }

              private static void deterministicBoundaries() {
                  assertValidOrder(0, new int[0][], TopologicalSort.sort(0, new int[0][]));
                  assertValidOrder(4, new int[][]{{0,2},{1,2},{2,3}}, TopologicalSort.sort(4, new int[][]{{0,2},{1,2},{2,3}}));
                  int[][] duplicate = {{0,1},{0,1},{1,2},{1,2}};
                  assertValidOrder(3, duplicate, TopologicalSort.sort(3, duplicate));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(1, new int[][]{{0,0}}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(3, new int[][]{{0,1},{1,2},{2,0}}));
              }

              private static void randomizedDags() {
                  Random r = new Random(0x37ffe67aL);
                  for (int n = 1; n <= 40; n++) {
                      for (int rep = 0; rep < 20; rep++) {
                          int[] hidden = shuffled(n, r);
                          List<int[]> es = new ArrayList<>();
                          for (int i = 0; i < n; i++) {
                              for (int j = i + 1; j < n; j++) {
                                  if (r.nextInt(9) == 0) es.add(new int[]{hidden[i], hidden[j]});
                              }
                          }
                          int[][] edges = es.toArray(new int[0][]);
                          int[] actual = TopologicalSort.sort(n, edges);
                          assertValidOrder(n, edges, actual);
                          randomizedDags++;
                      }
                  }
              }

              private static int[] shuffled(int n, Random r) {
                  int[] a = new int[n];
                  for (int i = 0; i < n; i++) a[i] = i;
                  for (int i = n - 1; i > 0; i--) {
                      int j = r.nextInt(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
                  }
                  return a;
              }

              private static void invalidInputs() {
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(-1, new int[0][]));
                  expect(NullPointerException.class, () -> TopologicalSort.sort(1, null));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{null}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{0}}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{0,2}}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{-1,1}}));
              }

              private static void assertValidOrder(int n, int[][] edges, int[] order) {
                  if (!isValidOrder(n, edges, order)) throw new AssertionError("invalid topological order: " + Arrays.toString(order));
              }

              private static boolean isValidOrder(int n, int[][] edges, int[] order) {
                  if (order == null || order.length != n) return false;
                  int[] pos = new int[n];
                  boolean[] seen = new boolean[n];
                  for (int i = 0; i < n; i++) {
                      int v = order[i];
                      if (v < 0 || v >= n || seen[v]) return false;
                      seen[v] = true;
                      pos[v] = i;
                  }
                  for (int[] e : edges) if (pos[e[0]] >= pos[e[1]]) return false;
                  return true;
              }

              private static void expect(Class<? extends Throwable> type, Runnable action) {
                  try {
                      action.run();
                      throw new AssertionError("missing " + type.getSimpleName());
                  } catch (Throwable t) {
                      if (!type.isInstance(t)) throw new AssertionError("wrong exception " + t);
                  }
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror TopologicalSort.java IndependentReviewerTest.java && java IndependentReviewerTest > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          expected='PASS exhaustive_graphs=4167 exhaustive_dags=543 exhaustive_cycles=3624 randomized_dags=800 oracle=permutation-validity duplicates=pass invalid=reject'
          test "$stdout" = "$expected"

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source preserves only a hand-written topological-sort request; Java, graph representation, vertex numbering, Kahn/BFS, ordering policy and cycle API are not recovered source constraints.',
            'The candidate explicitly labels Java, 0..V-1 vertices, int[][] directed edges, arbitrary-valid-order semantics, Kahn processing and exception-on-cycle as answer-side choices.',
            'The Kahn invariant and cycle argument are sound for the declared contract: only current zero-indegree vertices are emitted, outgoing edges are removed exactly once per edge record, and an early-empty zero-indegree frontier with unprocessed vertices implies a directed cycle.',
            'An independent permutation-existence oracle, which does not use Kahn or DFS cycle detection, validates every simple directed graph through four vertices: 4,167 graphs total, 543 DAGs accepted with a valid order and 3,624 cyclic graphs rejected.',
            'Reviewer checks additionally validate 800 seeded DAGs up to 40 vertices, duplicate-edge bookkeeping, self/cyclic rejection, empty graph behavior and declared invalid-input boundaries.',
            'No fixed-order assumption, fabricated project experience, unsupported source expansion or unresolved source variant was found.'
          ];
          const rv={schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; independent permutation-existence oracle for all simple directed graphs through V=4 plus seeded DAG validation',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','all 4167 simple directed graphs through four vertices classified by independent permutation oracle','all 543 exhaustive DAGs return a valid vertex permutation respecting every edge','all 3624 exhaustive cyclic graphs reject','800 seeded DAGs up to 40 vertices return valid orders','duplicate edges remain balanced by indegree/decrement accounting','empty graph and declared invalid-input boundaries pass'],boundary_tests:[{case:'source versus answer-side contract',expected:'Java/0..V-1/int[][]/Kahn/arbitrary-valid-order/exception-on-cycle remain explicitly answer-side',passed:true},{case:'non-unique topological order',expected:'review validates edge precedence and vertex uniqueness rather than one fixed array',passed:true},{case:'cycle semantics',expected:'self-cycle and multi-vertex cycles reject under the declared API',passed:true}]};
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify(rv,null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-topological-sort-20260826-v1',review_version:'topological-sort.permutation-oracle.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,process.env.SOURCE_TAGGED,candidate,'review/content_build/answer_batch_0021/source_boundary_audit.md','docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('evidence prerequisite drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered)) throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'topological-sort-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'raw-note',title:'Interview note preserving the hand-written topological-sort request',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'tagged-question',title:'Tagged topological-sort question record',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic Java validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent permutation-oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The recoverable source only asks the candidate to hand-write topological sort; it does not prescribe Java, graph representation, ordering policy, algorithm variant, or cycle API.',source_ids:['raw-note','tagged-question'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'candidate-contract',text:'Java vertices 0..V-1, int[][] directed edges, any valid topological order, Kahn processing, and exception-on-cycle are explicit answer-side choices.',source_ids:['raw-note','tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'implementation-validation',text:'The Java implementation matches an independent permutation-existence oracle over every simple directed graph through four vertices and passes larger seeded DAG plus boundary validation.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';
          let lines=fs.readFileSync(task,'utf8').split(/\r?\n/);
          const summaryPrefix='- `cq_q_37ffe67ab69164654b0a19aa57b410df` — coding;';
          const gatePrefix='- [ ] `cq_q_37ffe67ab69164654b0a19aa57b410df` writer pass is complete:';
          let summaryChanged=false,gateChanged=false;
          lines=lines.map(line=>{
            if(line.startsWith(summaryPrefix)){summaryChanged=true;return '- `cq_q_37ffe67ab69164654b0a19aa57b410df` — coding; source-bounded Java topological-sort candidate keeps language/API/cycle behavior explicit, writer validation PASS, independent permutation-oracle validation PASS across all 4,167 simple directed graphs through four vertices plus 800 seeded DAGs, isolated source-first review PASS, and complete evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';}
            if(line.startsWith(gatePrefix)){gateChanged=true;return '- [x] `cq_q_37ffe67ab69164654b0a19aa57b410df` isolated source-first review PASS: raw note and tagged question were reviewed before writer evidence, the source-bounded Java candidate matches an independent permutation-existence oracle across all simple directed graphs through four vertices plus seeded larger DAGs, reviewer validation PASS, and evidence binding is complete. Formal promotion remains governed by repository human approval and real-review policy.';}
            return line;
          });
          if(!summaryChanged||!gateChanged) throw new Error(`task status drift summary=${summaryChanged} gate=${gateChanged}`);
          fs.writeFileSync(task,lines.join('\n'));
          NODE

      - name: Validate bound candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Commit isolated review artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0021/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" \
                  tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md
          git diff --cached --quiet && exit 0
          git commit -m "review: pass topological sort source-first"
          git push origin HEAD:"$CONTENT_BRANCH"
