name: Review Content Batch 0034 KMP Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0034-kmp-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-kmp-reviewer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7e01e07cd1fe6acda1a2206768766697

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first isolated review and exhaustive exact-fence validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; candidate="review/candidates/answers/$cid.md"
          test -s "$candidate"; test -s "$out/source_mapping.json"; test -s "$out/code_validation.json"; test ! -e "$out/isolated_review_result.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8')); const note=JSON.parse(fs.readFileSync(mapping.note_path,'utf8')); const q=(note.tagged_questions||[]).find(x=>x.question_id===mapping.note_question_id);
          const expected='算法：实现子串匹配（KMP 算法或暴力搜索）。'; if(!q||q.original_question!==expected||q.question_type!=='算法手撕_Coding') throw new Error('source drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(!md.includes(h)) throw new Error(`missing ${h}`);
          for(const token of ['lps','O(n+m)','O(m)','UTF-16','首次匹配','来源没有真实项目']) if(!md.includes(token)) throw new Error(`required content missing ${token}`);
          const fence=md.match(/```java\n([\s\S]*?)\n```/); if(!fence) throw new Error('Java fence missing'); fs.writeFileSync('/tmp/KmpSearch.java',fence[1].trim()+'\n');
          NODE
          cat > /tmp/KmpSearchReviewTest.java <<'JAVA'
          public final class KmpSearchReviewTest {
              private static int brute(String t,String p){
                  if(p.isEmpty()) return 0;
                  outer: for(int i=0;i+p.length()<=t.length();i++){
                      for(int j=0;j<p.length();j++) if(t.charAt(i+j)!=p.charAt(j)) continue outer;
                      return i;
                  }
                  return -1;
              }
              private static String word(int mask,int len){StringBuilder s=new StringBuilder();for(int i=0;i<len;i++)s.append(((mask>>>i)&1)==0?'a':'b');return s.toString();}
              private static void check(String t,String p){int a=KmpSearch.indexOf(t,p),e=brute(t,p);if(a!=e)throw new AssertionError("t="+t+" p="+p+" e="+e+" a="+a);}
              public static void main(String[] args){
                  for(int n=0;n<=7;n++) for(int tm=0;tm<(1<<n);tm++){String t=word(tm,n);for(int m=0;m<=5;m++)for(int pm=0;pm<(1<<m);pm++)check(t,word(pm,m));}
                  check("\uD83D\uDE00a\uD83D\uDE00","a\uD83D\uDE00");
                  boolean t=false,p=false;try{KmpSearch.indexOf(null,"x");}catch(IllegalArgumentException e){t=true;}try{KmpSearch.indexOf("x",null);}catch(IllegalArgumentException e){p=true;}if(!t||!p)throw new AssertionError("null contract");
                  System.out.println("PASS exhaustive-binary-text<=7-pattern<=5 independent-brute unicode-char-index null-contract");
              }
          }
          JAVA
          mkdir -p /tmp/kmp-review-classes
          javac -d /tmp/kmp-review-classes /tmp/KmpSearch.java /tmp/KmpSearchReviewTest.java
          stdout="$(java -cp /tmp/kmp-review-classes KmpSearchReviewTest)"; test "$stdout" = 'PASS exhaustive-binary-text<=7-pattern<=5 independent-brute unicode-char-index null-contract'
          hash="$(sha256sum "$candidate"|awk '{print $1}')"
          CANDIDATE_HASH="$hash" REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`,mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const result={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_HASH,reviewed_at:'2026-08-26',review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0034-kmp-20260826-v1',review_version:'batch-0034.kmp.v1',decision:'pass',revision_round:1,source_packet:[mapping.note_path,path.join(out,'source_mapping.json'),'review/content_build/answer_batch_0034/source_boundary_audit.md',`review/candidates/answers/${cid}.md`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5},hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:['The preserved source asks for substring matching and explicitly accepts KMP or brute force, but leaves API/null/Unicode/all-match semantics unspecified.','The candidate makes a narrow first-match Java String contract explicit instead of claiming those details came from the source.','The lps construction and mismatch fallback are explained through the no-text-backtracking invariant, with O(n+m) time and O(m) extra space correctly scoped.','The exact Java fence independently matches a separate brute-force oracle exhaustively for all binary strings with text length <=7 and pattern length <=5, plus UTF-16 and null-contract cases.','The answer contrasts brute force without dismissing it, identifies UTF-16 char indexing as a Java boundary, and does not fabricate project experience.'],validation:{command:'javac exact candidate fence + independent exhaustive brute oracle && java KmpSearchReviewTest',result:'pass',stdout:process.env.REVIEW_STDOUT},promotion_blockers:['required_human_approval_not_yet_satisfied','repository_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(path.join(out,'isolated_review_result.json'),JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Bind verdict after independent conclusion and commit
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const r=JSON.parse(fs.readFileSync(path.join(out,'isolated_review_result.json'),'utf8')); if(r.decision!=='pass'||r.hard_failures.length)throw new Error('review fail');
          const wp=path.join(out,'writer_research.json'),w=JSON.parse(fs.readFileSync(wp,'utf8')); if(w.review_state!=='writer_complete_isolated_review_pending')throw new Error(`writer state ${w.review_state}`);
          w.review_state='independent_source_first_review_passed';w.sources.push({source_id:'isolated-review',title:'Independent source-first KMP candidate review',locator:path.join(out,'isolated_review_result.json'),source_type:'repository_structured_source',checked_at:'2026-08-26'});w.claims.push({claim_id:'isolated-review-verdict',text:'Independent review found no hard failures or uncovered source variants and exhaustively validated the exact KMP fence against a separate brute-force oracle on bounded strings.',source_ids:['isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']});w.promotion_blocker='required_human_approval_and_real_review_policy_not_yet_satisfied';w.review={reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:1,scores:r.scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:r.findings};fs.writeFileSync(wp,JSON.stringify(w,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md';let t=fs.readFileSync(task,'utf8');const p='- KMP canonical `'+cid+'` passed isolated source-first review and independent exhaustive exact-fence validation; promotion remains blocked only by required human approval and repository real-review policy.';if(!t.includes(p))t=t.trimEnd()+'\n'+p+'\n';fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-review-bot;git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0034/$CANONICAL_ID/isolated_review_result.json" "review/content_build/answer_batch_0034/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git commit -m 'review: pass batch 0034 KMP candidate source-first'
          for attempt in 1 2 3 4 5;do if git pull --rebase origin "$CONTENT_BRANCH"&&git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi;git rebase --abort 2>/dev/null||true;sleep $((attempt*3));done;exit 1
