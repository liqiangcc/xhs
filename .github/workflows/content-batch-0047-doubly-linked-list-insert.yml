name: Content Batch 0047 Doubly Linked List Insert

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0047-doubly-linked-list-insert.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0047-doubly-linked-list-insert
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_c4a953536191c8fe484174e0b0bcbb20
  SOURCE_QID: c4a953536191c8fe484174e0b0bcbb20

jobs:
