            {'claim_id':'source-boundary','text':'The preserved source says only doubly linked list insertion and does not define insertion position, node API, sentinels, ownership checks or concurrency semantics; the answer labels insert-after with sentinels as an explicit candidate contract.','source_ids':['source-context'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节']},
