          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0047.md');text=task.read_text()
          line='- [x] `cq_q_c4a953536191c8fe484174e0b0bcbb20` source-first isolated review PASS: the source only says doubly linked list insertion, so insert-after, sentinel boundaries, node ownership checks and single-thread semantics are explicitly candidate-contract choices rather than source facts. The complete OpenJDK 21 implementation maintains the four-way left/x/right pointer invariant; deterministic tests cover empty/head/tail/middle insertion, forward/backward traversal consistency and invalid anchors. Formal promotion remains blocked by repository human-approval/real-review policy.'
