name: Content Batch 0018 Concurrent Transfer Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate concurrent-transfer fixture
        working-directory: review/content_build/answer_batch_0018/cq_q_29ea4b45d754e65e5837153e52ba2abd
        shell: bash
        run: |
          set -euo pipefail
          javac ConcurrentTransfer.java ConcurrentTransferTest.java
          stdout="$(java ConcurrentTransferTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=6 opposingThreads=8 opposingOps=160000 randomThreads=12 randomOps=60000 conservation=true nonnegative=true progress=true"

      - name: Verify candidate, evidence and isolated review binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cid = 'cq_q_29ea4b45d754e65e5837153e52ba2abd'
          candidate = Path(f'review/candidates/answers/{cid}.md').read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          evidence = json.loads(Path(f'review/evidence/{cid}.json').read_text(encoding='utf-8'))
          review = json.loads(Path(f'review/content_build/answer_batch_0018/{cid}/isolated_review_result.json').read_text(encoding='utf-8'))
          validation = json.loads(Path(f'review/content_build/answer_batch_0018/{cid}/code_validation.json').read_text(encoding='utf-8'))

          expected_sha = '3a0f45245ebc33e1403e82393762efb29a011550d373ea40fa90907a9ae8b136'
          expected_stdout = 'PASS fixed=6 opposingThreads=8 opposingOps=160000 randomThreads=12 randomOps=60000 conservation=true nonnegative=true progress=true'
          assert candidate_sha == expected_sha
          assert validation['result'] == 'pass'
          assert validation['stdout'] == expected_stdout
          assert evidence['schema_version'] == 'answer_evidence.v1'
          assert evidence['review_state'] == 'independent_source_first_review_passed'
          assert review['schema_version'] == 'isolated_review.v1'
          assert review['decision'] == 'pass'
          assert review['promotion_blockers'] == ['human_approval_required_for_pilot_promotion']
          assert evidence['candidate_sha256'] == expected_sha
          assert review['candidate_sha256'] == expected_sha
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0018/source_boundary_audit.md
          grep -Fq 'cq_q_29ea4b45d754e65e5837153e52ba2abd' review/content_build/answer_batch_0018/source_boundary_audit.md
