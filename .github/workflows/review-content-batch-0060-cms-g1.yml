name: Review Content Batch 0060 CMS G1

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/review-content-batch-0060-cms-g1.yml
      - review/candidates/answers/cq_q_d3fea003c007b50735b8e695473de9ac.md
      - review/evidence/cq_q_d3fea003c007b50735b8e695473de9ac.json
      - review/content_build/answer_batch_0060/cq_q_d3fea003c007b50735b8e695473de9ac/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-batch-0060-cms-g1-review
  cancel-in-progress: true

env:
  CANONICAL_ID: cq_q_d3fea003c007b50735b8e695473de9ac

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck source-first review boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const qids=['04d79b4f1d5942b0cb976a988536a3b2','0866c4b58bd2fb97cb4b5379e767d035','7960226d99224c6c8d4411110ff10c8b','82f00b764cb3e39680f5e559f2a2db67','d3fea003c007b50735b8e695473de9ac','fc4d287ddc9fb55fb09c4d1acc68398e'];
          const base=`review/content_build/answer_batch_0060/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
          if(!ctx.ok||ctx.answer_type!=='mechanism'||ctx.canonical?.canonical_id!==cid) throw new Error('context/type drift');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(qids)) throw new Error(`ownership drift: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const primary=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
          if(primary.schema_version!=='answer_primary_source_research.v1'||primary.canonical_id!==cid) throw new Error('primary research drift');
          for(const sourceId of ['oracle-j8-cms','oracle-j8-g1','oracle-j8-g1-tuning','oracle-j25-g1-tuning','oracle-j9-cms-deprecation','oracle-j15-migration-g1-default','oracle-j24-cms-removed']) {
            if(!(primary.sources||[]).some(x=>x.source_id===sourceId)) throw new Error(`primary source missing: ${sourceId}`);
          }
          if(JSON.stringify(primary.source_boundary?.question_ids||[])!==JSON.stringify(qids)) throw new Error('primary-source Question scope drift');
          const path=`review/candidates/answers/${cid}.md`;
          const digest=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          const expected='f4954d6d0045da06ad8f3aa24de26a80b31ead58be5cb6b22f8a5375f99b8a75';
          if(digest!==expected) throw new Error(`candidate digest drift: ${digest}`);
          const r=JSON.parse(fs.readFileSync(`${base}/isolated_review_result.json`,'utf8'));
          if(r.review_mode!=='source_first_isolated'||r.decision!=='pass'||r.candidate_sha256!==digest||r.hard_failures?.length||r.unsupported_claims?.length||r.uncovered_source_variants?.length) throw new Error('review drift');
          if(Object.values(r.scores||{}).reduce((a,b)=>a+b,0)<90) throw new Error('review score below gate');
          const e=JSON.parse(fs.readFileSync(`review/evidence/${cid}.json`,'utf8'));
          if(e.review_state!=='independent_source_first_review_passed'||e.candidate_sha256!==digest||e.review?.decision!=='pass'||e.review?.independent!==true) throw new Error('evidence drift');
          if(JSON.stringify((e.source_question_coverage||[]).map(x=>x.question_id))!==JSON.stringify(qids)) throw new Error('source coverage drift');
          NODE
      - name: Strict candidate audit
        shell: bash
        run: node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --noWrite --noDraftCheck
      - name: Question coverage
        run: node scripts/content/check_question_coverage.js --check
      - name: Canonical integrity
        run: node scripts/xhs.js canonical check --noWrite
      - name: Review integrity
        run: node scripts/xhs.js review integrity --noWrite
      - name: Strict answer validation
        run: node scripts/xhs.js answer validate --strict --noWrite
      - name: Full repository validation
        run: node scripts/xhs.js validate all --noWrite
      - name: Unit tests
        run: npm test
      - name: CI check
        run: npm run ci:check
      - name: Semantic answer gate
        run: npm run ci:answer:semantic
      - name: Evidence answer gate
        run: npm run ci:answer:evidence
      - name: Code answer gate
        run: npm run ci:answer:code
      - name: Coverage answer gate
        run: npm run ci:answer:coverage
