name: Review Content Batch 0032 Symmetric Character Map Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0032-symmetric-char-map-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0032-symmetric-char-map-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_735f5e34d9dfae656347c8b21c6d7142
  SOURCE_QID: 735f5e34d9dfae656347c8b21c6d7142
  CANDIDATE_BLOB_SHA: e2f816c0d7715873bcf411d6adea359168e95cc9

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and independent actual-candidate oracle
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          test -f "$out/code_validation.json"; test -f "$out/writer_research.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const expected='算法：将一个字符串改变其字符，使其与另一个字符串相等（映射替换）';
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=packet.canonicals.find(x=>x.canonical_id===cid), hits=entry?.source_hits||[];
          if(hits.length!==1||hits[0]?.match_basis!=='question_id') throw new Error('source identity not exact singleton');
          const q=hits[0].tagged_question;
          if(q?.question_id!==qid||q?.original_question!==expected||q?.is_valid_for_library!==true) throw new Error('source drifted');
          const transcript=hits[0].note_img_txt||'';
          for(const x of ['字符x变成y','y也需要变','aabba','eeffe','asdf','asag']) if(!transcript.includes(x)) throw new Error(`source transcript missing: ${x}`);
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const needle of ['f(f(c)) = c','partner.put(x, y)','partner.put(y, x)','codePoints()','aabba','eeffe','asdf','asag','O(n)','O(u)']) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|按本题约束填写|长尾复习底稿/.test(text)) throw new Error('template residue');
          const m=text.match(/```java\s*\n([\s\S]*?)\n```/); if(!m) throw new Error('Java block missing');
          fs.writeFileSync('/tmp/SymmetricCharMapping.java',m[1]);
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/SymmetricCharMapping.java
          cat >/tmp/SymmetricCharMappingIndependentTest.java <<'JAVA'
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public final class SymmetricCharMappingIndependentTest {
              private static final int[] ALPHABET={'a','b','c'};
              private static final List<Map<Integer,Integer>> INVOLUTIONS=buildInvolutions();

              private static List<Map<Integer,Integer>> buildInvolutions(){
                  List<Map<Integer,Integer>> out=new ArrayList<>();
                  boolean[] used=new boolean[ALPHABET.length];
                  build(used,new HashMap<>(),out);
                  return out;
              }
              private static void build(boolean[] used,Map<Integer,Integer> f,List<Map<Integer,Integer>> out){
                  int i=0;while(i<used.length&&used[i])i++;
                  if(i==used.length){out.add(new HashMap<>(f));return;}
                  used[i]=true; f.put(ALPHABET[i],ALPHABET[i]); build(used,f,out); f.remove(ALPHABET[i]);
                  for(int j=i+1;j<used.length;j++) if(!used[j]){
                      used[j]=true;f.put(ALPHABET[i],ALPHABET[j]);f.put(ALPHABET[j],ALPHABET[i]);
                      build(used,f,out);
                      f.remove(ALPHABET[i]);f.remove(ALPHABET[j]);used[j]=false;
                  }
                  used[i]=false;
              }
              private static boolean oracle(String source,String target){
                  int[] a=source.codePoints().toArray(),b=target.codePoints().toArray();
                  if(a.length!=b.length)return false;
                  for(Map<Integer,Integer> f:INVOLUTIONS){
                      boolean ok=true;
                      for(int i=0;i<a.length;i++) if(f.get(a[i])!=b[i]){ok=false;break;}
                      if(ok)return true;
                  }
                  return false;
              }
              private static void check(String a,String b){
                  boolean x=SymmetricCharMapping.canTransform(a,b),y=oracle(a,b);
                  if(x!=y)throw new AssertionError(a+" -> "+b+" actual="+x+" oracle="+y);
              }
              private static String decode(int code,int len){
                  char[] s=new char[len];for(int i=0;i<len;i++){s[i]=(char)ALPHABET[code%3];code/=3;}return new String(s);
              }
              public static void main(String[] args){
                  if(INVOLUTIONS.size()!=4)throw new AssertionError("involutions="+INVOLUTIONS.size());
                  if(!SymmetricCharMapping.canTransform("aabba","eeffe"))throw new AssertionError("source true example");
                  if(SymmetricCharMapping.canTransform("asdf","asag"))throw new AssertionError("source false example");
                  if(!SymmetricCharMapping.canTransform("🙂你🙂","你🙂你"))throw new AssertionError("unicode swap");
                  if(SymmetricCharMapping.canTransform("a","aa"))throw new AssertionError("length mismatch");
                  boolean n1=false,n2=false;
                  try{SymmetricCharMapping.canTransform(null,"");}catch(NullPointerException e){n1=true;}
                  try{SymmetricCharMapping.canTransform("",null);}catch(NullPointerException e){n2=true;}
                  if(!n1||!n2)throw new AssertionError("null contract");
                  long pairs=0;
                  for(int len=0;len<=6;len++){
                      int count=1;for(int i=0;i<len;i++)count*=3;
                      for(int a=0;a<count;a++)for(int b=0;b<count;b++){check(decode(a,len),decode(b,len));pairs++;}
                  }
                  if(pairs!=597871L)throw new AssertionError("pairs="+pairs);
                  System.out.println("PASS actual-candidate exhaustive-pairs=597871 alphabet=abc lengths=0..6 brute-involutions=4 plus-source-and-unicode-boundaries");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/SymmetricCharMappingIndependentTest.java
          stdout="$(java -cp /tmp SymmetricCharMappingIndependentTest)"
          test "$stdout" = 'PASS actual-candidate exhaustive-pairs=597871 alphabet=abc lengths=0..6 brute-involutions=4 plus-source-and-unicode-boundaries'
          echo "$stdout"

      - name: Write independent source-first evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_${batch}/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex'), validation=`${out}/code_validation.json`, review=`${out}/isolated_review_result.json`;
          const tests=[{case:'recovered true example',expected:'aabba -> eeffe true',actual:'pass',passed:true},{case:'recovered false example',expected:'asdf -> asag false',actual:'pass',passed:true},{case:'exhaustive brute involution oracle',expected:'actual equals existence of one of all four involutions over abc for every string pair length 0..6',actual:'pass across 597,871 pairs',passed:true},{case:'Unicode and API boundaries',expected:'non-BMP pair swap works, length mismatch false, null rejected',actual:'pass',passed:true}];
          const old=JSON.parse(fs.readFileSync(validation,'utf8'));
          fs.writeFileSync(validation,JSON.stringify({...old,validated_at:date,independent_command:'compile actual candidate and enumerate every involution over abc across every string pair length 0..6',independent_stdout:'PASS actual-candidate exhaustive-pairs=597871 alphabet=abc lengths=0..6 brute-involutions=4 plus-source-and-unicode-boundaries',boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0032-symmetric-char-map-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['Recovered source explicitly requires x->y to imply y->x and gives both a true and false example; the candidate preserves those details.','The one-global-involution interpretation is clearly marked as the implemented contract, while arbitrary multi-round swap semantics are explicitly left outside the preserved source.','The partner-map invariant is sufficient and constructive: every constrained code point has exactly one symmetric partner or itself.','Independent review enumerates all involutions over a three-character alphabet and all 597,871 source/target pairs through length six against the compiled actual candidate, plus Unicode and API boundaries.','Code-point handling supports non-BMP characters without falsely claiming grapheme-cluster semantics.','O(n) expected time and O(u) state match one scan and a hash map over constrained characters.','No project experience is fabricated.'];
          fs.writeFileSync(review,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0032.symmetric-char-map.v1',decision:'pass',revision_round:0,source_packet:[`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,candidate,validation,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0032-symmetric-char-map-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Batch 0032 exact packet with recovered examples',locator:`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Writer relation fixture plus exhaustive independent involution oracle',locator:validation,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Independent source-first review',locator:review,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'Source requires symmetric x<->y replacement and preserves aabba->eeffe true plus asdf->asag false, without defining arbitrary multi-round swap semantics.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm',text:'Actual candidate enforces one symmetric partner per constrained code point; exhaustive brute-involution review validates all small-domain mappings.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'unicode',text:'Implementation operates on Unicode code points and passes a non-BMP swap boundary.',source_ids:['fixture','isolated-review'],answer_locations:['关键细节']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{result:'pass',reported_stdout:'PASS writer randomized=20000; PASS exhaustive independent pairs=597871',boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0032.symmetric-char-map.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;let text=fs.readFileSync(task,'utf8');
          const pending=`- [ ] \`${cid}\` candidate staged source-first: recovered x<->y rule plus aabba->eeffe true and asdf->asag false are preserved; one-global-involution interpretation is explicit; Java candidate passes Unicode/fixed-point boundaries and 20,000 deterministic relation-oracle cases. Independent review still required.`;
          text=text.replace(pending+'\n','');
          const done=`- [x] \`${cid}\` candidate passed independent source-first review: recovered x<->y symmetry and both source examples are preserved; one-global-involution semantics remain explicit rather than silently generalized; writer validation passes 20,000 relation-oracle cases and the independent reviewer compiles the actual candidate and exhaustively checks all 597,871 abc string pairs of lengths 0..6 against all four possible involutions, plus Unicode/API boundaries. Formal promotion remains governed by repository promotion and real-review policy.`;
          if(!text.includes(done))text=(text.endsWith('\n')?text:text+'\n')+done+'\n';fs.writeFileSync(task,text);
          NODE

      - name: Run candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit isolated review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          base='${{ steps.base.outputs.head }}';git fetch --depth=1 origin "$CONTENT_BRANCH";remote="$(git rev-parse origin/$CONTENT_BRANCH)"
          if [ "$remote" != "$base" ];then echo "content advanced: $base -> $remote; discard mixed review";exit 0;fi
          git config user.name 'xhs-review-bot';git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git diff --cached --check;git commit -m "review: pass batch ${BATCH} symmetric character-map candidate";git push origin "HEAD:$CONTENT_BRANCH"
