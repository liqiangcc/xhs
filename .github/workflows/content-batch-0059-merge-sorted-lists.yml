name: Content Batch 0059 Merge Sorted Lists

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0059-merge-sorted-lists.yml
      - scripts/content/build_batch_0059_merge_sorted_lists.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0059-merge-sorted-lists
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_4046b5252e29fc4fdc52fb2fdd54e544

jobs:
  build-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and execute source-bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/build_batch_0059_merge_sorted_lists.py > /tmp/build.py
          python3 -m py_compile /tmp/build.py
          python3 /tmp/build.py

      - name: Gate current source and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0059 merge-lists build: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add \
            "review/candidates/answers/$CANONICAL_ID.md" \
            "review/content_build/answer_batch_0059/$CANONICAL_ID" \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0059.md
          if git diff --cached --quiet; then
            echo 'No Batch 0059 merge-lists changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: stage batch 0059 merge-lists candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
