name: Bind Content Batch 0060 Redis Data Types Writer

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/bind-content-batch-0060-redis-data-types-writer.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0060-redis-data-types-writer
  cancel-in-progress: false

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6bd7f5149d6bbae7bab2f3c693efe008

jobs:
  bind-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard frozen source and candidate then bind digest
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          base="review/content_build/answer_batch_0060/$cid"
          candidate="review/candidates/answers/$cid.md"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const qids=['6bd7f5149d6bbae7bab2f3c693efe008','c03d4906e887be9b7e75dd21e288bfeb','e62af843c158e6489e166a8312cce593'];
          const base=`review/content_build/answer_batch_0060/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
          if(!ctx.ok||ctx.answer_type!=='concept'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(qids)) throw new Error('context/ownership drift');
          const p=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
          for(const id of ['redis-current-data-types','redis-current-strings','redis-current-hashes','redis-current-lists','redis-current-sets','redis-current-sorted-sets','redis-current-streams']) if(!(p.sources||[]).some(x=>x.source_id===id)) throw new Error(`primary source missing: ${id}`);
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const section of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(section).length-1!==1) throw new Error(`section drift: ${section}`);
          for(const marker of ['String','List','Hash','Set','Sorted Set','ZSet','Stream']) if(!md.includes(marker)) throw new Error(`required Redis marker missing: ${marker}`);
          if((md.match(/^- 问：/gm)||[]).length<3) throw new Error('followups insufficient');
          if(/生产环境里我|我负责过|我在线上|实际线上我们|我们项目中/.test(md)) throw new Error('fabricated experience risk');
          if(!md.includes('现代 Redis 不止这五种')||!md.includes('Redis 5.0')||!md.includes('不要给一个脱离版本的永久数字')) throw new Error('modern/version boundary missing');
          NODE
          digest="$(sha256sum "$candidate" | awk '{print $1}')"
          DIGEST="$digest" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,digest=process.env.DIGEST;
          const base=`review/content_build/answer_batch_0060/${cid}`;
          const out={
            schema_version:'answer_writer_research.v1',canonical_id:cid,candidate_sha256:digest,checked_at:'2026-08-30',review_state:'writer_complete_isolated_review_pending',
            sources:[
              {source_id:'repository-source',title:'Batch 0060 frozen Redis data-types repository context',locator:`${base}/context.json`,source_type:'repository_source_record',checked_at:'2026-08-30'},
              {source_id:'primary-source-research',title:'Redis official data-types primary-source research packet',locator:`${base}/primary_source_research.json`,source_type:'official_documentation',checked_at:'2026-08-30'}
            ],
            claims:[
              {claim_id:'classic-five-first',text:'The candidate directly answers the frozen classic interview wording with String, List, Hash, Set and Sorted Set/ZSet first.',source_ids:['repository-source','primary-source-research'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','常见追问']},
              {claim_id:'current-not-exactly-five',text:'The answer keeps a current-version boundary: modern Redis documentation contains Stream and additional specialized/newer data types, so exactly five is not stated as a timeless complete inventory.',source_ids:['primary-source-research'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','常见追问','易错点']},
              {claim_id:'semantic-selection',text:'Each classic type is explained by data model and access semantics rather than by a command list: byte sequence, ordered sequence, field-value record, unique unordered members, or unique score-ordered members.',source_ids:['primary-source-research'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']},
              {claim_id:'stream-boundary',text:'Stream is presented as a modern append-only log-like structure with IDs and consumer-group semantics, not silently counted as part of the historical five-type mnemonic.',source_ids:['primary-source-research'],answer_locations:['1 分钟版','3 分钟版','关键细节','常见追问']}
            ],
            source_question_coverage:[
              {question_id:'6bd7f5149d6bbae7bab2f3c693efe008',covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','常见追问']},
              {question_id:'c03d4906e887be9b7e75dd21e288bfeb',covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','常见追问']},
              {question_id:'e62af843c158e6489e166a8312cce593',covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','常见追问']}
            ],
            promotion_blocker:'isolated_independent_review_and_human_approval_not_yet_performed'
          };
          fs.writeFileSync(`${base}/writer_research.json`,JSON.stringify(out,null,2)+'\n');
          console.log(`candidate_sha256=${digest}`);
          NODE
      - name: Writer-stage audit has only expected pre-review blockers
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --noWrite --noDraftCheck > /tmp/audit.json
          rc=$?
          set -e
          cat /tmp/audit.json
          test "$rc" -ne 0
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const row=report.rows?.[0]; if(!row) throw new Error('audit row missing');
          const actual=[...(row.hard_failures||[])].sort(),expected=['missing_evidence','missing_independent_review'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`unexpected writer-stage hard failures: ${JSON.stringify(actual)}`);
          for(const e of (row.errors||[]).map(x=>x.error)) if(!['missing_evidence','missing_dimension_score','review_not_passed','total_score_below_minimum'].includes(e)) throw new Error(`unexpected writer-stage audit error: ${e}`);
          NODE
      - name: Baseline repository invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
      - name: Commit writer research
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0060/$CANONICAL_ID/writer_research.json"
          if git diff --cached --quiet; then
            echo 'writer research already current'
            exit 0
          fi
          git commit -m 'research: bind batch 0060 Redis data-types writer evidence'
          git push origin "HEAD:$CONTENT_BRANCH"
