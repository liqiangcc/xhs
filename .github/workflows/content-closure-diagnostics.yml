name: Content Closure Diagnostics

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-closure-diagnostics.yml
      - scripts/content/build_content_closure_diagnostics.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-closure-diagnostics
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build current closure snapshot
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/build_content_closure_diagnostics.py > /tmp/diagnose.py
          python3 -m py_compile /tmp/diagnose.py
          python3 /tmp/diagnose.py
      - name: Gate structural integrity before recording snapshot
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
      - name: Commit snapshot only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"; base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during diagnostics: $base_head -> $remote_head"
            echo 'Discard diagnostic snapshot; retry against current state.'
            exit 0
          fi
          git add review/content_build/closure/current_state.json
          if git diff --cached --quiet; then echo 'Closure snapshot unchanged.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-content-audit-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: refresh current content closure diagnostics'
          git push origin "HEAD:$CONTENT_BRANCH"

