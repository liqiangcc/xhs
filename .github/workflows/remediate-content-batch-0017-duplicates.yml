name: Remediate Content Batch 0017 Duplicate Canonicals

on:
  pull_request:
    branches:
      - master

permissions:
  contents: write

jobs:
  remediate:
    if: github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Retire source-unrecoverable batch 0019 singleton assets
        run: python3 scripts/content/remediate_batch_0019_unrecoverable.py

      - name: Merge source-confirmed duplicate Canonicals through supported consistency boundary
        shell: bash
        run: |
          set -euo pipefail

          merge_if_source_exists() {
            local target="$1"
            local source="$2"
            local reason="$3"
            if python3 - "$target" "$source" <<'PY'
          import json
          import pathlib
          import sys
          target, source = sys.argv[1:3]
          rows = [json.loads(line) for line in pathlib.Path('data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          ids = {row.get('canonical_id') for row in rows}
          if target not in ids:
              raise SystemExit(f'target canonical missing: {target}')
          raise SystemExit(0 if source in ids else 1)
          PY
            then
              node scripts/xhs.js canonical merge \
                --target "$target" \
                --source "$source" \
                --reason "$reason"
            else
              echo "Source $source already retired; treating merge as idempotently complete."
            fi
          }

          merge_if_source_exists \
            cq_q_6c3e7f9d826622bce0c25df5beee24a0 \
            cq_q_271d5e7c97e9f51b7b5ab4fdc1331411 \
            'Batch 0017 source-first boundary audit found both Canonicals represent LeetCode 115 Distinct Subsequences; preserve all source Question bindings under one existing Canonical.'

          merge_if_source_exists \
            cq_q_8f04cfa510fe868afcf072c93499a8ea \
            cq_q_27f9476e6f17473bae89a7a3c05db42f \
            'Batch 0017 source-first boundary audit found both Canonicals represent the same two-thread alternating AB print problem; preserve all source Question bindings under one existing Canonical.'

      - name: Verify duplicate sources are retired and target ownership preserved
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib

          rows = [json.loads(line) for line in pathlib.Path('data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          by_id = {row['canonical_id']: row for row in rows}
          pairs = [
              ('cq_q_6c3e7f9d826622bce0c25df5beee24a0', 'cq_q_271d5e7c97e9f51b7b5ab4fdc1331411'),
              ('cq_q_8f04cfa510fe868afcf072c93499a8ea', 'cq_q_27f9476e6f17473bae89a7a3c05db42f'),
          ]
          for target, source in pairs:
              if source in by_id:
                  raise SystemExit(f'duplicate source still active after merge: {source}')
              target_row = by_id.get(target)
              if target_row is None:
                  raise SystemExit(f'merge target missing after merge: {target}')
              source_qid = source.removeprefix('cq_q_')
              owned = set(target_row.get('question_ids') or [])
              if source_qid not in owned:
                  raise SystemExit(f'{target}: merged source Question {source_qid} not preserved in target ownership')
          PY

      - name: Regenerate Question and index projections
        run: |
          set -euo pipefail
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest

      - name: Verify full repository gates
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record duplicate-normalization progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0017.md')
          text = path.read_text(encoding='utf-8')
          old = '- [ ] Duplicate normalization remains for `cq_q_271d5e7c97e9f51b7b5ab4fdc1331411` (LeetCode 115) and `cq_q_27f9476e6f17473bae89a7a3c05db42f` (two-thread alternating print); these must be merged through the supported Canonical consistency boundary before the batch can close.'
          new = '- [x] Duplicate normalization is resolved through `canonical merge`: `cq_q_271d5e7c97e9f51b7b5ab4fdc1331411` is merged into `cq_q_6c3e7f9d826622bce0c25df5beee24a0`, and `cq_q_27f9476e6f17473bae89a7a3c05db42f` is merged into `cq_q_8f04cfa510fe868afcf072c93499a8ea`; source Question ownership is preserved and merge-side Answer/ReviewProgress invalidation follows the repository consistency policy.'
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              text = text.rstrip() + '\n\n## Duplicate normalization progress\n\n' + new + '\n'
          path.write_text(text, encoding='utf-8')
          PY

      - name: Record bounded batch 0019 remediation progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0019.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Remediation progress\n'
          section = '''## Remediation progress

- [x] Two source-unrecoverable singleton Questions are excluded without inventing coding contracts: `cq_q_2dcc4ae8850241c339c211516c55b307` (the supplied Shell script body is absent) and `cq_q_2e11155d7a78e8fda6758fc98aa44029` (only “一道sql” is preserved). Their singleton Canonicals are retired, active placeholder Answers archived, ReviewProgress entries removed, and the Question validity audit records explicit `incomplete_or_unreadable` reasons.
- [ ] Four additional normalization/conflict records remain blocked pending bounded Question/Canonical remediation: `cq_q_2e26508950e5da505c44621129f41a26`, `cq_q_2f278e6b489feb680f8b173047815566`, `cq_q_3022a886d714c0fc8bc2fa4d0b7812a5`, and `cq_q_3022eb4f8a66f69b09a2d019164f0bb5`.
'''
          if marker not in text:
              text = text.rstrip() + '\n\n' + section
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit bounded remediation updates to content branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No bounded-remediation changes to commit.'
            exit 0
          fi
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "content: retire source-unrecoverable batch 0019 questions"
          git push origin HEAD:content/quality-completion
