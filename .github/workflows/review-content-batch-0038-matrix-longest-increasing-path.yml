name: Review Content Batch 0038 Matrix Longest Increasing Path Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0038-matrix-longest-increasing-path.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0038-matrix-longest-increasing-path-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_970da913bce4438085cbdef5645512cd
  SOURCE_QID: 970da913bce4438085cbdef5645512cd
  SOURCE_STRUCTURED: note_structured/688193b20000000010013b6b.json
  SOURCE_TAGGED: note_tagged/688193b20000000010013b6b.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Phase A source-first boundary and exact-candidate review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0038/$cid"
          tmp="$out/reviewer_tmp"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          python3 - <<'PY'
          import json, os, pathlib, re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']
          exact='算法：矩阵中的最长递增路径？'
          structured=json.loads(pathlib.Path(os.environ['SOURCE_STRUCTURED']).read_text())
          if exact not in structured.get('questions',[]): raise SystemExit('structured source drift')
          tagged=json.loads(pathlib.Path(os.environ['SOURCE_TAGGED']).read_text())
          q=next((x for x in tagged.get('tagged_questions',[]) if x.get('question_id')==qid),None)
          if not q or q.get('original_question')!=exact or q.get('is_valid_for_library') is not True:
              raise SystemExit('tagged source drift')

          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md')
          md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in [
              'DFS + 记忆化搜索',
              'memo[r][c]',
              'matrix[nr][nc] <= matrix[r][c]',
              'matrix must be rectangular',
              '严格递增消除环',
              'O(mn)',
              '拓扑 BFS'
          ]:
              if marker not in md: raise SystemExit(f'candidate missing {marker}')
          if len(re.findall(r'^- 问：',md,re.M)) < 5: raise SystemExit('followups insufficient')
          if re.search(r'我在线上|我负责过|我们生产|真实项目里我曾|线上事故',md): raise SystemExit('fabricated project claim')
          if '这些是为了让实现可执行而补充的契约，不是来源原文已经规定的条件' not in md:
              raise SystemExit('source/candidate contract separation missing')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java block, got {len(blocks)}')
          snippet=blocks[0].strip()
          harness='''import java.util.*;\n\npublic class CandidateHarness {\n'''+snippet+'''\n
            static int topoOracle(int[][] a) {
              if (a == null || a.length == 0) return 0;
              int cols = a[0].length;
              if (cols == 0) return 0;
              for (int[] row : a) {
                if (row == null || row.length != cols) throw new IllegalArgumentException("matrix must be rectangular");
              }
              int rows=a.length;
              int[][] out=new int[rows][cols];
              int[][] d={{1,0},{-1,0},{0,1},{0,-1}};
              ArrayDeque<int[]> q=new ArrayDeque<>();
              for(int r=0;r<rows;r++) for(int c=0;c<cols;c++){
                for(int[] x:d){int nr=r+x[0],nc=c+x[1]; if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&a[nr][nc]>a[r][c]) out[r][c]++;}
                if(out[r][c]==0) q.add(new int[]{r,c});
              }
              int layers=0, seen=0;
              while(!q.isEmpty()){
                int n=q.size(); layers++;
                while(n-->0){
                  int[] cur=q.remove(); int r=cur[0],c=cur[1]; seen++;
                  for(int[] x:d){
                    int nr=r+x[0],nc=c+x[1];
                    if(nr>=0&&nr<rows&&nc>=0&&nc<cols&&a[nr][nc]<a[r][c]){
                      if(--out[nr][nc]==0) q.add(new int[]{nr,nc});
                    }
                  }
                }
              }
              if(seen!=rows*cols) throw new AssertionError("strict-increase graph unexpectedly cyclic");
              return layers;
            }

            static void check(int[][] a, int expected) {
              int got=longestIncreasingPath(a);
              if(got!=expected) throw new AssertionError("expected="+expected+" got="+got+" matrix="+Arrays.deepToString(a));
              int oracle=topoOracle(a);
              if(got!=oracle) throw new AssertionError("oracle mismatch got="+got+" oracle="+oracle+" matrix="+Arrays.deepToString(a));
            }

            static int[][] decode(int rows,int cols,int states,int alphabet){
              int[][] a=new int[rows][cols];
              for(int i=0;i<rows*cols;i++){a[i/cols][i%cols]=states%alphabet;states/=alphabet;}
              return a;
            }

            static int pow(int b,int e){int x=1;while(e-->0)x*=b;return x;}

            public static void main(String[] args) {
              if(longestIncreasingPath(null)!=0) throw new AssertionError("null contract");
              if(longestIncreasingPath(new int[0][0])!=0) throw new AssertionError("zero-row contract");
              if(longestIncreasingPath(new int[][]{{}})!=0) throw new AssertionError("zero-col contract");
              boolean jagged=false;
              try{longestIncreasingPath(new int[][]{{1,2},{3}});}catch(IllegalArgumentException e){jagged=true;}
              if(!jagged) throw new AssertionError("jagged not rejected");

              check(new int[][]{{9,9,4},{6,6,8},{2,1,1}},4);
              check(new int[][]{{3,4,5},{3,2,6},{2,2,1}},4);
              check(new int[][]{{1}},1);
              check(new int[][]{{1,2,3,4,5}},5);
              check(new int[][]{{5},{4},{3},{2},{1}},5);
              check(new int[][]{{7,7},{7,7}},1);
              check(new int[][]{{-3,-2},{-4,-1}},4);

              int exhaustive=0;
              int[][] shapes={{1,1},{1,3},{2,2},{2,3}};
              for(int[] s:shapes){
                int total=pow(3,s[0]*s[1]);
                for(int code=0;code<total;code++){
                  int[][] a=decode(s[0],s[1],code,3);
                  int got=longestIncreasingPath(a), oracle=topoOracle(a);
                  if(got!=oracle) throw new AssertionError("exhaustive mismatch shape="+Arrays.toString(s)+" code="+code+" got="+got+" oracle="+oracle+" matrix="+Arrays.deepToString(a));
                  exhaustive++;
                }
              }

              Random rnd=new Random(0x970da913L);
              int randomized=20000;
              for(int t=0;t<randomized;t++){
                int rows=1+rnd.nextInt(7), cols=1+rnd.nextInt(7);
                int[][] a=new int[rows][cols];
                for(int r=0;r<rows;r++) for(int c=0;c<cols;c++) a[r][c]=rnd.nextInt(41)-20;
                int got=longestIncreasingPath(a), oracle=topoOracle(a);
                if(got!=oracle) throw new AssertionError("random mismatch t="+t+" got="+got+" oracle="+oracle+" matrix="+Arrays.deepToString(a));
              }
              System.out.println("PASS exact_candidate deterministic=7 exhaustive="+exhaustive+" randomized="+randomized+" oracle=kahn-topological-layers strict=greater rectangular=validated empty=0");
            }
          }
          '''
          pathlib.Path(f'review/content_build/answer_batch_0038/{cid}/reviewer_tmp/CandidateHarness.java').write_text(harness)
          PY

          (cd "$tmp" && javac CandidateHarness.java && java CandidateHarness > stdout.txt)
          stdout="$(cat "$tmp/stdout.txt")"
          case "$stdout" in
            PASS\ exact_candidate\ deterministic=7\ exhaustive=840\ randomized=20000\ oracle=kahn-topological-layers\ strict=greater\ rectangular=validated\ empty=0) ;;
            *) echo "unexpected reviewer stdout: $stdout" >&2; exit 1 ;;
          esac

          REVIEW_STDOUT="$stdout" python3 - <<'PY'
          import hashlib, json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-27'
          out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md')
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          checks=[
            'exact candidate Java implementation compiles under Java 21 inside an independent harness',
            'null, zero-row, zero-column and jagged-array behaviors follow the candidate contract',
            'standard, rectangular, equal-valued, negative-valued, row-only and column-only deterministic cases match expected lengths',
            '840 exhaustive small matrices match an independent Kahn topological-layer oracle',
            '20000 seeded randomized matrices up to 7x7 match the independent Kahn topological-layer oracle',
            'strict greater-than four-direction movement preserves acyclicity and the exact candidate never requires a path-level visited set'
          ]
          rv={
            'schema_version':'answer_code_validation.v1',
            'canonical_id':cid,
            'candidate_sha256':digest,
            'result':'pass',
            'validated_at':date,
            'command':'extract the exact candidate Java block, compile it in an independent harness, and compare deterministic plus 840 exhaustive and 20000 seeded randomized matrices against an independent Kahn topological-layer oracle',
            'stdout':os.environ['REVIEW_STDOUT'],
            'checks':checks
          }
          (out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=[
            'The answer preserves the exact matrix-longest-increasing-path source boundary and explicitly labels four-direction movement, strict increase, rectangular input and null/empty behavior as candidate contracts rather than source facts.',
            'The memoized DFS state is coherent: memo[r][c] means the best path starting at the current cell, so each cell is fully expanded once and reused by all predecessors.',
            'Under the explicit strict-increase rule, every legal directed edge increases the cell value, so the state graph is acyclic; the no-path-level-visited explanation is therefore justified for this contract.',
            'The exact candidate Java compiles under Java 21 and independently matches a Kahn topological-layer oracle on deterministic cases, 840 exhaustive small matrices and 20000 seeded randomized matrices.',
            'The answer covers empty input, jagged Java arrays, equal values, negative values, four-versus-eight-direction variation, recursion-depth risk and the alternative iterative topological formulation.',
            'The O(mn) time and O(mn) memo-space claims are consistent with one memoized expansion per cell and at most four neighbor checks per expansion; the answer separately records worst-case O(mn) recursion depth.',
            'No fabricated production experience or result is claimed; the project section remains a clearly hypothetical implementation-choice discussion.'
          ]
          review={
            'schema_version':'isolated_review.v1',
            'canonical_id':cid,
            'candidate_sha256':digest,
            'reviewed_at':date,
            'review_mode':'source_first_isolated',
            'reviewer_id':'source-first-isolated-reviewer-matrix-lip-20260827-v1',
            'review_version':'matrix-lip.memoized-dfs.v1',
            'decision':'pass',
            'revision_round':1,
            'source_packet':[os.environ['SOURCE_STRUCTURED'],os.environ['SOURCE_TAGGED'],str(candidate),'docs/refactor/09_answer_content_standard.md',str(out/'reviewer_validation.json')],
            'scores':scores,
            'hard_failures':[],
            'unsupported_claims':[],
            'uncovered_source_variants':[],
            'findings':findings,
            'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          }
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Phase B bind evidence and record task progress
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0038/$cid"
          javac "$out/writer_validation.java"
          java -cp "$out" writer_validation

          python3 - <<'PY'
          import json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-27'
          out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}')
          writer=json.loads((out/'writer_research.json').read_text())
          wv=json.loads((out/'writer_validation.json').read_text())
          rv=json.loads((out/'reviewer_validation.json').read_text())
          review=json.loads((out/'isolated_review_result.json').read_text())
          if writer.get('review_state')!='writer_complete_isolated_review_pending' or wv.get('result')!='pass' or rv.get('result')!='pass' or review.get('decision')!='pass':
              raise SystemExit('phase state mismatch')
          evidence={
            'schema_version':'answer_evidence.v1',
            'canonical_id':cid,
            'candidate_sha256':review['candidate_sha256'],
            'checked_at':date,
            'writer':{'writer_id':'matrix-lip-source-bounded-writer-20260827-v1','writer_version':'xhs-answer-curator.v1'},
            'sources':[
              {'source_id':'repository-structured','title':'Structured interview source containing the matrix longest-increasing-path prompt','locator':os.environ['SOURCE_STRUCTURED'],'source_type':'repository_structured_source','checked_at':date},
              {'source_id':'repository-tagged','title':'Tagged matrix longest-increasing-path coding question','locator':os.environ['SOURCE_TAGGED'],'source_type':'repository_structured_source','checked_at':date},
              {'source_id':'writer-validation','title':'Writer matrix longest-increasing-path differential validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'reviewer-validation','title':'Independent exact-candidate matrix longest-increasing-path topological differential validation','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'isolated-review','title':'Fresh isolated source-first matrix longest-increasing-path review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}
            ],
            'claims':[
              {'claim_id':'source-boundary','text':'The preserved source asks only for the longest increasing path in a matrix; four-direction movement, strict increase, rectangular input, null/empty handling and Java API behavior are explicit candidate contracts rather than preserved source wording.','source_ids':['repository-structured','repository-tagged','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节']},
              {'claim_id':'memoized-dfs-state','text':'The candidate defines memo[r][c] as the longest path starting at the cell and explores only strictly larger four-direction neighbors, allowing each state to be computed once and reused.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['1 分钟版','3 分钟版','关键细节','原理机制']},
              {'claim_id':'acyclicity-complexity','text':'Under the explicit strict-increase contract every legal edge increases the value, so the state graph is acyclic; with at most four outgoing neighbor checks per cell, memoized DFS performs O(mn) state work, uses O(mn) memo storage and may use O(mn) recursion depth.','source_ids':['reviewer-validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','关键细节','原理机制','常见追问']},
              {'claim_id':'behavior-validation','text':'Writer and independent reviewer validations cover deterministic edge cases, empty and jagged-input contracts, 840 exhaustive small matrices and 20000 seeded randomized matrices, with the reviewer using an independent Kahn topological-layer oracle.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['3 分钟版','关键细节','常见追问','易错点']}
            ],
            'source_question_coverage':[{'question_id':os.environ['SOURCE_QID'],'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],
            'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks']},
            'review_state':'independent_source_first_review_passed',
            'review':{
              'reviewer_id':review['reviewer_id'],
              'review_version':review['review_version'],
              'independent':True,
              'decision':'pass',
              'revision_round':1,
              'scores':review['scores'],
              'hard_failures':[],
              'uncovered_source_variants':[],
              'unsupported_claims':[],
              'findings':review['findings']
            }
          }
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')

          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md')
          text=task.read_text()
          old='- [ ] `cq_q_970da913bce4438085cbdef5645512cd` matrix longest-increasing-path candidate preserves the exact source wording, adopts explicit four-direction/strict-increase/rectangular-input Java contracts, provides complete memoized-DFS Java, and passes deterministic plus 840-exhaustive and 20000-randomized differential validation against an independent value-sorted dynamic-programming oracle. Isolated source-first review and evidence binding remain pending.'
          new='- [x] `cq_q_970da913bce4438085cbdef5645512cd` matrix longest-increasing-path candidate preserves the exact source wording, labels four-direction/strict-increase/rectangular/null-empty behavior as explicit candidate contracts, provides complete memoized-DFS Java, passes writer validation plus an independent exact-candidate review using a Kahn topological-layer oracle across deterministic, 840 exhaustive and 20000 randomized matrices, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              if '## Progress' not in text: text=text.rstrip()+'\n\n## Progress\n\n'
              text=text.rstrip()+'\n\n'+new+'\n'
          task.write_text(text)
          PY
          rm -rf "$out/reviewer_tmp"

      - name: Commit reviewed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0038/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0038/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" \
                  tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md
          git commit -m 'review: pass batch 0038 matrix longest-increasing-path candidate source-first'
          for attempt in 1 2 3; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
