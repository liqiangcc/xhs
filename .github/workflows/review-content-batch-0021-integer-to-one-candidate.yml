name: Review Content Batch 0021 Integer To One Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0021-integer-to-one-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-integer-to-one-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_377898b5b67a6219eaa583c6d2e21081
  SOURCE_QID: 377898b5b67a6219eaa583c6d2e21081
  SOURCE_NOTE: note_img_txt/66138d03000000001a00e8ca.txt

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$SOURCE_NOTE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review and independent shortest-path checks
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0021/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"; rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID;
          const raw=fs.readFileSync(process.env.SOURCE_NOTE,'utf8');
          for(const marker of ['实现一个函数，对一个正整数n，算得到1需要的最少操作次数','如果n为偶数，将其除以2','如果n为奇数，可以加1或减1'])if(!raw.includes(marker))throw new Error(`primary source drift: ${marker}`);
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点'])if(md.split(h).length!==2)throw new Error(`section drift: ${h}`);
          for(const marker of ['Java `int` 作为输入契约','内部转成 `long`','n == 3','n % 4 == 1','Integer.MAX_VALUE','O(log n)','精确递推 oracle'])if(!md.includes(marker))throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md))throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups insufficient');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block)throw new Error('Java code block missing');
          fs.writeFileSync(`review/content_build/answer_batch_0021/${cid}/reviewer_tmp/IntegerToOne.java`,block[1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/ReviewerHarness.java" <<'JAVA'
          import java.util.ArrayDeque;
          import java.util.Arrays;
          import java.util.HashMap;
          import java.util.Map;

          public final class ReviewerHarness {
              private static final Map<Long,Integer> MEMO = new HashMap<>();
              static { MEMO.put(1L, 0); }

              private static int exact(long n) {
                  Integer cached = MEMO.get(n);
                  if (cached != null) return cached;
                  int v;
                  if ((n & 1L) == 0L) v = 1 + exact(n >>> 1);
                  else v = 2 + Math.min(exact(n >>> 1), exact((n >>> 1) + 1L));
                  MEMO.put(n, v);
                  return v;
              }

              private static int[] reverseBfs(int max) {
                  int[] d = new int[max + 1]; Arrays.fill(d, -1); d[1] = 0;
                  ArrayDeque<Integer> q = new ArrayDeque<>(); q.add(1);
                  while (!q.isEmpty()) {
                      int y = q.removeFirst();
                      long doubled = (long)y * 2L;
                      if (doubled <= max && d[(int)doubled] < 0) { d[(int)doubled] = d[y] + 1; q.add((int)doubled); }
                      if ((y & 1) == 0) {
                          int lo = y - 1, hi = y + 1;
                          if (lo >= 1 && d[lo] < 0) { d[lo] = d[y] + 1; q.add(lo); }
                          if (hi <= max && d[hi] < 0) { d[hi] = d[y] + 1; q.add(hi); }
                      }
                  }
                  return d;
              }

              public static void main(String[] args) {
                  // From an odd state the only increase is +1 and the next state is forced even -> /2,
                  // so a path starting at n never needs a state above n+1. max=100001 is therefore closed for n<=100000.
                  int[] dist = reverseBfs(100001);
                  for (int n = 1; n <= 100000; n++) {
                      int actual = IntegerToOne.minOperations(n);
                      if (dist[n] < 0 || actual != dist[n]) throw new AssertionError("BFS mismatch n=" + n + " actual=" + actual + " bfs=" + dist[n]);
                  }
                  int[] edge = {1,2,3,7,15,31,63,127,1023,65535,Integer.MAX_VALUE};
                  for (int n : edge) {
                      int actual = IntegerToOne.minOperations(n), expected = exact(n);
                      if (actual != expected) throw new AssertionError("exact mismatch n=" + n + " actual=" + actual + " expected=" + expected);
                  }
                  if (IntegerToOne.minOperations(Integer.MAX_VALUE) != 32) throw new AssertionError("int max must be 32");
                  try { IntegerToOne.minOperations(0); throw new AssertionError("zero accepted"); } catch (IllegalArgumentException expected) {}
                  try { IntegerToOne.minOperations(-7); throw new AssertionError("negative accepted"); } catch (IllegalArgumentException expected) {}
                  System.out.println("PASS reverse-bfs=1..100000 exact-edges=11 int-max=32 invalid=reject");
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror IntegerToOne.java ReviewerHarness.java && java ReviewerHarness > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS reverse-bfs=1..100000 exact-edges=11 int-max=32 invalid=reject'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The primary source preserves only the positive-integer transition rules and minimum-step goal; Java, int range, invalid-input behavior, and implementation strategy are not source constraints.','Candidate explicitly labels the Java int API and long intermediate state as answer-side choices and does not expand them into source facts.','Even states are treated as forced division; odd-state low-bit reasoning includes the n=3 exception and the Integer.MAX_VALUE overflow boundary.','Reviewer-extracted Java compiles with warnings as errors and matches a reviewer-owned reverse-graph BFS for every n from 1 through 100000; selected edge values including Integer.MAX_VALUE also match an exact recurrence.','The O(log n) time and O(1) auxiliary-space claims match the iterative implementation over a fixed-width integer domain.','No fabricated production experience, placeholder code, or unresolved source variant was found.'];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; reverse-graph BFS 1..100000 plus exact edge recurrence',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','reverse BFS equality for all n=1..100000','n=3 exception','powers-of-two-adjacent edge values','Integer.MAX_VALUE exact result 32','declared invalid-input rejection'],boundary_tests:[{case:'source versus Java API',expected:'Java/int/exception contract remains explicitly answer-side',passed:true},{case:'odd 3 exception',expected:'3 reaches 1 in two operations by decrementing',passed:true},{case:'int overflow boundary',expected:'Integer.MAX_VALUE can increment safely via long intermediate state',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-integer-to-one-20260826-v1',review_version:'integer-to-one.greedy.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8')),w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8')),wv=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8')),rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass')throw new Error('evidence prerequisite drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered))throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'integer-to-one-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'primary-source',title:'Baidu interview image transcription',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Writer exact-recurrence differential validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent reverse-BFS and exact-edge validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source requires the minimum operations from a positive integer to 1, with even values divided by 2 and odd values allowed +/-1.',source_ids:['primary-source'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'candidate-contract',text:'Java int input, invalid-input rejection, and long intermediate state are explicit candidate choices, not recovered source requirements.',source_ids:['primary-source','isolated-review'],answer_locations:['核心结论','关键细节','项目经验版']},{claim_id:'algorithm-validation',text:'Greedy low-bit implementation including the n=3 exception matches writer exact recurrence and independent reviewer reverse-BFS/edge validation; Integer.MAX_VALUE is safely handled.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md'; let text=fs.readFileSync(task,'utf8');
          const p='- `cq_q_377898b5b67a6219eaa583c6d2e21081` — coding; risks: long_tail_baseline, placeholder_implementation';
          const d='- `cq_q_377898b5b67a6219eaa583c6d2e21081` — coding; source-bounded Java candidate declares its int/overflow contract, matches writer exact recurrence and independent reverse-BFS validation, and passes isolated source-first review with evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(!text.includes(p)&&!text.includes(d))throw new Error('task marker drift'); if(text.includes(p))fs.writeFileSync(task,text.replace(p,d));
          NODE

      - name: Strict candidate audit and complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git add -A; git diff --cached --check
          git config user.name 'xhs-review-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass integer-to-one candidate source-first'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"; base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_source="$(git show "origin/$CONTENT_BRANCH:$SOURCE_NOTE" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_source" = '${{ steps.base.outputs.source_sha256 }}' || { echo 'source changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
