name: Patch Go Answer Audit

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/patch-go-answer-audit.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Patch shared answer auditor and regression test
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/lib/answer_quality.js')
          text = path.read_text()

          old = '(java|sql|javascript|js)'
          if old not in text:
              raise SystemExit('extractCodeBlocks language group not found')
          text = text.replace(old, '(java|sql|javascript|js|go)', 1)

          marker = '\nfunction parseSql(code) {'
          if marker not in text:
              raise SystemExit('parseSql insertion point not found')
          compile_go = r'''

function compileGo(code) {
    const tempDir = fs.mkdtempSync(path.join(os.tmpdir(), 'xhs-answer-go-'));
    try {
        const filePath = path.join(tempDir, 'answer.go');
        fs.writeFileSync(filePath, code, 'utf8');
        const result = childProcess.spawnSync('go', ['test', filePath], {
            encoding: 'utf8',
            timeout: 10000,
        });
        if (result.error?.code === 'ENOENT') return { ok: false, error: 'go_not_available' };
        if (result.error) return { ok: false, error: 'go_compile_failed', detail: result.error.message };
        if (result.status !== 0) {
            return {
                ok: false,
                error: 'go_compile_failed',
                detail: String(result.stderr || result.stdout || '').trim().slice(0, 1200),
            };
        }
        return { ok: true };
    } finally {
        fs.rmSync(tempDir, { recursive: true, force: true });
    }
}
'''
          text = text.replace(marker, compile_go + marker, 1)

          old_dispatch = """            const validation = block.language === 'java'
                ? compileJava(block.code)
                : block.language === 'sql'
                    ? parseSql(block.code)
                    : parseJavaScript(block.code);"""
          new_dispatch = """            const validation = block.language === 'java'
                ? compileJava(block.code)
                : block.language === 'sql'
                    ? parseSql(block.code)
                    : block.language === 'go'
                        ? compileGo(block.code)
                        : parseJavaScript(block.code);"""
          if old_dispatch not in text:
              raise SystemExit('coding validation dispatch not found')
          text = text.replace(old_dispatch, new_dispatch, 1)

          selector = '(?:java|sql|javascript|js)'
          if selector not in text:
              raise SystemExit('require-code selector language group not found')
          text = text.replace(selector, '(?:java|sql|javascript|js|go)', 1)
          path.write_text(text)

          test_path = Path('test/answer_candidate.test.js')
          tests = test_path.read_text()
          test_marker = "test('require-code accepts and compiles a Go coding candidate'"
          if test_marker not in tests:
              tests += r'''

test('require-code accepts and compiles a Go coding candidate', () => {
    const root = fs.mkdtempSync(path.join(os.tmpdir(), 'xhs-answer-go-candidate-'));
    writeJson(path.join(root, 'config', 'answer_quality.json'), QUALITY);
    writeJsonl(path.join(root, 'data', 'questions', 'canonical_questions.jsonl'), [{
        schema_version: 'canonical_question.v1', canonical_id: 'cq_go', canonical_title: '100 个 goroutine 依次打印 1-100',
        aliases: [], question_ids: ['q-go'], primary_domain: { l1: 'Go', l2: '并发' }, primary_entities: ['goroutine'],
        companies: [], frequency: 1, review_priority: 'P0', answer_status: 'needs_update',
    }]);
    writeJsonl(path.join(root, 'data', 'questions', 'questions.jsonl'), [{
        question_id: 'q-go', canonical_id: 'cq_go', original_question: '100个协程依次打印1-100', question_type: 'coding',
    }]);
    const candidateDir = path.join(root, 'review', 'candidates', 'answers');
    ensureDir(candidateDir);
    const candidatePath = path.join(candidateDir, 'cq_go.md');
    const sections = ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '项目经验版', '常见追问', '易错点'];
    const lines = [
        '<!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_go","version":1,"status":"draft","quality_tier":"candidate","answer_type":"coding","updated_at":"2026-08-22"} -->',
        '# 100 个 goroutine 依次打印 1-100',
    ];
    for (const title of sections) {
        lines.push('', `## ${title}`, '');
        if (title === '3 分钟版') lines.push('```go', 'package orderedprint', 'func Value() int { return 100 }', '```');
        else lines.push(`${title}的 Go 并发题目专属内容。`);
    }
    fs.writeFileSync(candidatePath, `${lines.join('\n')}\n`, 'utf8');

    const report = runAnswerAudit({ root, candidate: candidatePath, noWrite: true, 'require-code': true });
    assert.equal(report.candidate_count, 1);
    assert.equal(report.rows.length, 1);
    assert.equal(report.rows[0].errors.some((row) => row.error === 'coding_block_required'), false);
    assert.equal(report.rows[0].errors.some((row) => row.error === 'go_validation_failed'), false);
    assert.equal(report.rows[0].hard_failures.includes('placeholder_implementation'), false);
    fs.rmSync(root, { recursive: true, force: true });
});
'''
              test_path.write_text(tests)
          PY

      - name: Run targeted regression tests
        run: node --test test/answer_candidate.test.js

      - name: Verify ordered goroutine candidate now passes require-code
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_187c619f3c62046184546a4f04cc40f2.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add scripts/lib/answer_quality.js test/answer_candidate.test.js
          git diff --cached --check
          git commit -m "fix(answer): support Go coding candidates in shared audit"
          git push origin HEAD:content/quality-completion
