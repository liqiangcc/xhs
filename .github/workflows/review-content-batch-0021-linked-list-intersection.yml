name: Review Content Batch 0021 Linked List Intersection

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/review-content-batch-0021-linked-list-intersection.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0021-linked-list-intersection-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_3a314d375a1b0bdf127953e8614906e0
  SOURCE_QID: 3a314d375a1b0bdf127953e8614906e0
  SOURCE_OCR: note_img_txt/66138d03000000001a00e8ca.txt
  SOURCE_TAGGED: note_tagged/66138d03000000001a00e8ca.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Phase A source-first isolated review and independent oracle validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0021/$cid"
          candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"
          rm -rf "$out/reviewer_tmp"
          mkdir -p "$out/reviewer_tmp"

          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const out=`review/content_build/answer_batch_0021/${cid}`;
          const raw=fs.readFileSync(process.env.SOURCE_OCR,'utf8');
          if(!raw.includes('15. 两条相交的单向链表，如何求他们的第一个公共节点?')) throw new Error('primary OCR source wording drift');
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const tq=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tq||tq.original_question!=='算法：两条相交的单向链表，如何求他们的第一个公共节点?') throw new Error('tagged question drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift: ${h}`);
          for(const marker of ['无环','节点 identity','不相交返回 `null`','时间 `O(m+n)`','空间 `O(1)`','来源没有真实项目经历']) if(!md.includes(marker)) throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md)) throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1) throw new Error(`expected one Java block, got ${blocks.length}`);
          fs.writeFileSync(`${out}/reviewer_tmp/LinkedListIntersection.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/IndependentReviewerTest.java" <<'JAVA'
          import java.util.Random;

          public final class IndependentReviewerTest {
              private static long intersectingCases = 0;
              private static long disjointCases = 0;
              private static long randomizedCases = 0;

              public static void main(String[] args) {
                  verify(null, null);
                  LinkedListIntersection.Node same = chain(4, 9000, null);
                  if (LinkedListIntersection.firstCommon(same, same) != same) throw new AssertionError("same-head identity");

                  for (int a = 0; a <= 25; a++) {
                      for (int b = 0; b <= 25; b++) {
                          for (int c = 1; c <= 15; c++) {
                              LinkedListIntersection.Node shared = chain(c, 100000, null);
                              verify(chain(a, 1000, shared), chain(b, 2000, shared));
                              intersectingCases++;
                          }
                          verify(chain(a, 3000, null), chain(b, 4000, null));
                          disjointCases++;
                      }
                  }

                  Random r = new Random(0x3a314d37L);
                  for (int i = 0; i < 5000; i++) {
                      int a = r.nextInt(101), b = r.nextInt(101);
                      boolean intersects = (i % 3) != 0;
                      LinkedListIntersection.Node shared = intersects ? chain(1 + r.nextInt(50), 7000, null) : null;
                      LinkedListIntersection.Node ha = chain(a, i % 7, shared);
                      LinkedListIntersection.Node hb = chain(b, i % 7, intersects ? shared : null);
                      verify(ha, hb);
                      randomizedCases++;
                  }

                  LinkedListIntersection.Node sameValueA = new LinkedListIntersection.Node(7);
                  LinkedListIntersection.Node sameValueB = new LinkedListIntersection.Node(7);
                  if (LinkedListIntersection.firstCommon(sameValueA, sameValueB) != null) throw new AssertionError("value equality is not node identity");
                  if (LinkedListIntersection.firstCommon(null, chain(8, 10, null)) != null) throw new AssertionError("empty versus nonempty");

                  System.out.printf("PASS intersecting=%d disjoint=%d randomized=%d oracle=length-align identity=pass same-head=pass empty=pass%n", intersectingCases, disjointCases, randomizedCases);
              }

              private static void verify(LinkedListIntersection.Node a, LinkedListIntersection.Node b) {
                  LinkedListIntersection.Node expected = lengthAlignedOracle(a, b);
                  LinkedListIntersection.Node actual = LinkedListIntersection.firstCommon(a, b);
                  if (actual != expected) throw new AssertionError("candidate disagrees with independent length-alignment oracle");
              }

              private static LinkedListIntersection.Node lengthAlignedOracle(LinkedListIntersection.Node a, LinkedListIntersection.Node b) {
                  int la = length(a), lb = length(b);
                  while (la > lb) { a = a.next; la--; }
                  while (lb > la) { b = b.next; lb--; }
                  while (a != b) {
                      a = a.next;
                      b = b.next;
                  }
                  return a;
              }

              private static int length(LinkedListIntersection.Node n) {
                  int len = 0;
                  while (n != null) {
                      len++;
                      if (len > 10000) throw new AssertionError("unexpected cycle in reviewer fixture");
                      n = n.next;
                  }
                  return len;
              }

              private static LinkedListIntersection.Node chain(int n, int base, LinkedListIntersection.Node tail) {
                  LinkedListIntersection.Node head = tail;
                  for (int i = n - 1; i >= 0; i--) {
                      LinkedListIntersection.Node x = new LinkedListIntersection.Node(base + i);
                      x.next = head;
                      head = x;
                  }
                  return head;
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror LinkedListIntersection.java IndependentReviewerTest.java && java IndependentReviewerTest > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS intersecting=10140 disjoint=676 randomized=5000 oracle=length-align identity=pass same-head=pass empty=pass'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository OCR and tagged source preserve only the request for the first common node of two intersecting singly linked lists; Java, acyclic-input scope, node representation and no-intersection return behavior are not source constraints.',
            'The candidate labels Java, acyclic singly linked lists, object identity and null-on-no-intersection as answer-side executable choices instead of attributing them to the interview source.',
            'For the declared acyclic contract, the head-switch invariant is sound: each pointer traverses A then B or B then A, equalizing the two unique-prefix lengths before any shared suffix comparison.',
            'An independent length-alignment oracle agrees with the extracted candidate implementation for 10,140 deterministic intersecting shapes, 676 disjoint shapes and 5,000 seeded randomized shapes; same-head, empty-input and equal-value-distinct-node boundaries also pass.',
            'The answer correctly distinguishes node identity from value equality, states O(m+n) time and O(1) auxiliary space, and explicitly excludes cyclic-list semantics from the proof.',
            'No fabricated project experience, placeholder implementation, unsupported source expansion or unresolved source variant was found.'
          ];
          const reviewerValidation={schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; independent length-alignment oracle over deterministic and seeded randomized acyclic-list shapes',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','10140 intersecting prefix/tail shapes match an independent length-alignment oracle','676 disjoint prefix pairs return null','5000 seeded randomized shapes match the independent oracle','same-head and empty boundaries pass','equal-valued distinct nodes are not treated as an intersection'],boundary_tests:[{case:'source versus answer-side contract',expected:'Java/acyclic/object-identity/null-on-no-intersection choices remain explicitly answer-side',passed:true},{case:'intersection semantics',expected:'common node is reference identity, not equal payload value',passed:true},{case:'cycle scope',expected:'candidate does not claim the acyclic head-switch proof handles cyclic lists',passed:true}]};
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify(reviewerValidation,null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-linked-list-intersection-20260826-v1',review_version:'linked-list-intersection.head-switch.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_OCR,process.env.SOURCE_TAGGED,candidate,'review/content_build/answer_batch_0021/source_boundary_audit.md','docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('evidence prerequisite drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered)) throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'linked-list-intersection-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'ocr-note',title:'OCR interview note preserving the linked-list intersection wording',locator:process.env.SOURCE_OCR,source_type:'repository_source_record',checked_at:date},{source_id:'tagged-question',title:'Tagged linked-list intersection question record',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic Java validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent length-alignment oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The recoverable source asks for the first common node of two intersecting singly linked lists; it does not prescribe Java, node representation, cycle handling, or no-intersection return behavior.',source_ids:['ocr-note','tagged-question'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'candidate-contract',text:'Java, acyclic singly linked lists, object identity as common-node semantics, and null for no intersection are explicit answer-side choices.',source_ids:['ocr-note','tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'implementation-validation',text:'The head-switch implementation matches an independent length-alignment oracle over deterministic and seeded randomized acyclic-list shapes and preserves identity semantics across edge cases.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';
          let text=fs.readFileSync(task,'utf8');
          const oldLine='- `cq_q_3a314d375a1b0bdf127953e8614906e0` — coding; source-bounded Java acyclic linked-list intersection candidate is staged with identity/no-intersection semantics explicit, writer 19,220-intersection plus 961-disjoint deterministic validation PASS, and source binding recorded. Isolated independent review remains pending; formal promotion remains blocked by repository human approval and real-review policy.';
          const newLine='- `cq_q_3a314d375a1b0bdf127953e8614906e0` — coding; source-bounded Java acyclic linked-list intersection candidate keeps identity/no-intersection semantics explicit, writer validation PASS, independent length-alignment oracle validation PASS across 10,140 intersecting + 676 disjoint + 5,000 seeded randomized shapes, isolated source-first review PASS, and complete evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(!text.includes(oldLine)) throw new Error('task canonical summary drift');
          text=text.replace(oldLine,newLine);
          const oldGate='- [ ] `cq_q_3a314d375a1b0bdf127953e8614906e0` writer pass is complete: OCR note and tagged question bind the first-common-node request, a source-bounded Java identity candidate plus reproducible fixture are committed, and writer validation is PASS. Next gate is isolated source-first review.';
          const newGate='- [x] `cq_q_3a314d375a1b0bdf127953e8614906e0` isolated source-first review PASS: OCR note and tagged question were reviewed before writer evidence, the source-bounded Java identity candidate matches an independent length-alignment oracle, reviewer validation PASS, and evidence binding is complete. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(oldGate)) throw new Error('task review gate drift');
          text=text.replace(oldGate,newGate);
          fs.writeFileSync(task,text);
          NODE

      - name: Validate bound candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Commit isolated review artifacts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0021/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" \
                  tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md
          git diff --cached --quiet && exit 0
          git commit -m "review: pass linked-list intersection source-first"
          git push origin HEAD:"$CONTENT_BRANCH"
