name: Remediate Content Batch 0040 Subarray Sum Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0040-subarray-sum-relation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0040-subarray-sum-relation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_QID: d63322aa9fd4048a05c37c235c47ce2c
  TARGET_CID: cq_q_d63322aa9fd4048a05c37c235c47ce2c
  DUP_QID: a4a80af48b7e1af0a3cdd334e8e43506
  DUP_CID: cq_q_a4a80af48b7e1af0a3cdd334e8e43506

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Freeze source-first relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0040
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          const expected=new Map([
            [process.env.TARGET_QID,'算法：和为 K 的子数组（LeetCode 560）'],
            [process.env.DUP_QID,'算法：和为 K 的子数组 (LeetCode 560 - 前缀和 + 哈希表)'],
          ]);
          for(const [qid,text] of expected){
            const q=byQ.get(qid);
            if(!q||q.original_question!==text) throw new Error(`${qid}: source wording drifted: ${q?.original_question}`);
            if(q.is_valid_for_library!==true) throw new Error(`${qid}: source unexpectedly invalid`);
            if(!/Coding/.test(String(q.question_type||''))) throw new Error(`${qid}: not Coding: ${q.question_type}`);
          }
          if(byQ.get(process.env.TARGET_QID)?.canonical_id!==process.env.TARGET_CID) throw new Error('target ownership drifted');
          if(byQ.get(process.env.DUP_QID)?.canonical_id!==process.env.DUP_CID) throw new Error('duplicate ownership drifted');
          const target=byC.get(process.env.TARGET_CID), dup=byC.get(process.env.DUP_CID);
          if(!target || JSON.stringify(target.question_ids||[])!==JSON.stringify([process.env.TARGET_QID])) throw new Error(`target must remain singleton: ${JSON.stringify(target?.question_ids)}`);
          if(!dup || JSON.stringify(dup.question_ids||[])!==JSON.stringify([process.env.DUP_QID])) throw new Error(`duplicate must remain singleton: ${JSON.stringify(dup?.question_ids)}`);
          const srcTarget=JSON.parse(fs.readFileSync('note_tagged/684828fc000000002001ce6f.json','utf8'));
          const srcDup=JSON.parse(fs.readFileSync('note_tagged/6766bb4d000000001300beae.json','utf8'));
          const has=(doc,qid,text)=>doc.tagged_questions?.some(q=>q.question_id===qid&&q.original_question===text&&q.is_valid_for_library===true);
          if(!has(srcTarget,process.env.TARGET_QID,expected.get(process.env.TARGET_QID))) throw new Error('target primary source drifted');
          if(!has(srcDup,process.env.DUP_QID,expected.get(process.env.DUP_QID))) throw new Error('duplicate primary source drifted');
          const inventory=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0040/source_inventory.json','utf8'));
          const item=inventory.items?.find(x=>x.canonical_id===process.env.DUP_CID);
          if(!item||!item.source_questions?.some(q=>q.question_id===process.env.DUP_QID&&q.original_question===expected.get(process.env.DUP_QID))) throw new Error('Batch 0040 frozen source inventory drifted');
          const review=`# Batch 0040 Subarray-Sum-K Source-First Relation Review\n\n`+
            `## Primary-source facts\n\n`+
            `- \`${process.env.TARGET_QID}\`: “${expected.get(process.env.TARGET_QID)}”.\n`+
            `- \`${process.env.DUP_QID}\`: “${expected.get(process.env.DUP_QID)}”.\n`+
            `- Both repository sources explicitly identify LeetCode 560, Subarray Sum Equals K. The second wording additionally names the standard prefix-sum + hash-map technique, but that is an implementation cue for the same problem rather than a different input/output contract. Neither source preserves a variant such as longest subarray, non-negative-only sliding window, returning indices, or counting subsequences.\n\n`+
            `No historical relation/remediation record was consulted before this conclusion.\n\n`+
            `## Decision\n\nRelation: \`same\`. Consolidate Batch 0040 singleton \`${process.env.DUP_CID}\` into survivor \`${process.env.TARGET_CID}\`, preserving both Questions.\n\n`+
            `## Content consequence\n\nThis relation slice does not promote content. The survivor still requires source-bounded curation, executable tests, isolated review, evidence/code gates, required human approval, and real-review policy.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0040/subarray_sum_relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Select decide and apply reviewed duplicate pair
        shell: bash
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0040/subarray_sum_relation_apply'
          mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$TARGET_QID,$DUP_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(r.relation_candidates)||r.relation_candidates.length!==1) throw new Error(`expected one RelationCandidate, got ${r.relation_candidates?.length}`);
          const c=r.relation_candidates[0];
          const actual=[...c.question_ids].sort(), expected=[process.env.TARGET_QID,process.env.DUP_QID].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`selected pair drifted: ${JSON.stringify(actual)}`);
          process.stdout.write(c.relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide \
            --relation-candidate-key "$key" \
            --relation same \
            --actor-type ai \
            --actor-id batch-0040-subarray-sum-source-first-review \
            --actor-display-name 'Subarray Sum Equals K source-first reviewer' \
            --rationale 'Two independent repository sources explicitly identify LeetCode 560 / Subarray Sum Equals K. Prefix-sum + hash-map in one wording is an implementation cue, not a distinct input/output contract.' > "$out/decide.json"
          node scripts/xhs.js dedup apply \
            --relation-candidate-key "$key" \
            --canonical-id "$TARGET_CID" \
            --canonical-title '算法：和为 K 的子数组（LeetCode 560）' > "$out/apply.json"

      - name: Verify reviewed consolidation and update task
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          for(const qid of [process.env.TARGET_QID,process.env.DUP_QID]) if(byQ.get(qid)?.canonical_id!==process.env.TARGET_CID) throw new Error(`${qid}: survivor ownership missing`);
          if(byC.has(process.env.DUP_CID)) throw new Error('duplicate Subarray Sum Canonical survived consolidation');
          const target=byC.get(process.env.TARGET_CID);
          if(!target||!(target.question_ids||[]).includes(process.env.TARGET_QID)||!(target.question_ids||[]).includes(process.env.DUP_QID)) throw new Error(`survivor members missing: ${JSON.stringify(target?.question_ids)}`);
          fs.writeFileSync('review/content_build/answer_batch_0040/subarray_sum_relation_apply.md',
            '# Batch 0040 Subarray-Sum-K Relation Application\n\n- Relation: `same`.\n- Survivor: `'+process.env.TARGET_CID+'`; it now owns both reviewed source Questions.\n- Retired duplicate Canonical: `'+process.env.DUP_CID+'`.\n- This normalization does not promote the survivor Answer.\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0040.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_a4a80af48b7e1af0a3cdd334e8e43506` was reviewed source-first against existing `cq_q_d63322aa9fd4048a05c37c235c47ce2c`: two independent repository sources explicitly identify LeetCode 560 / 和为 K 的子数组. The “前缀和 + 哈希表” suffix is an implementation cue, not a different contract. Relation is `same`; the Batch 0040 duplicate singleton is retired and its Question is consolidated under the survivor. This normalization does not promote content.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Refresh generated audits and run full gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during subarray-sum relation slice: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: normalize batch 0040 subarray-sum source relation'
          git push origin "HEAD:$CONTENT_BRANCH"
