name: Build Content Batch 0042 Thousands Separator

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0042-thousands-separator.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-thousands-separator-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_adba6c6166d2030d07b88f2e58455f26
  SOURCE_QID: adba6c6166d2030d07b88f2e58455f26

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const structured=JSON.parse(fs.readFileSync('note_structured/6678d3f7000000001e013539.json','utf8'));
          const exact='算法：给一个整型数字,将其按三位三位划分并加上逗号';
          if(!Array.isArray(structured.questions)||structured.questions[0]!==exact) throw new Error('thousands-separator source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('ownership/type drifted');
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==exact) throw new Error('source wording drifted');
          NODE

      - name: Write source-bounded candidate and deterministic fixture
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0042/$cid"; candidate="review/candidates/answers/$cid.md"
          mkdir -p "$out" review/candidates/answers
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_adba6c6166d2030d07b88f2e58455f26","version":1,"status":"draft","updated_at":"2026-08-27","answer_type":"coding","quality_tier":"candidate"} -->
          # 给一个整型数字，按三位分组并插入逗号

          ## 核心结论

          这道题的稳定规则只有一个：十进制整数部分要从右往左每三位分一组，组之间插入逗号。来源没有保存具体语言、整数位宽、负数是否出现、是否允许调用格式化库，因此参考实现明确选择 Java `long`，保留负号，只处理整数十进制表示，不引入小数、货币符号或本地化规则。实现时先得到十进制字符串，再只对数字部分按“右侧剩余位数是 3 的倍数”插入逗号；这样不需要 `Math.abs`，也能正确覆盖 `Long.MIN_VALUE`。

          ## 1 分钟版

          - 分组方向一定是从右往左，因为最低三位组成最后一组。
          - 负号不是数字位，先单独保留，再对后面的十进制数字分组。
          - 遍历数字字符串时，如果当前字符不是第一位，而且“从当前位置到末尾的字符数”是 3 的倍数，就在它前面加逗号。
          - `0`、1~3 位数不加逗号；4 位开始出现第一个逗号。
          - 用字符串处理可以直接覆盖 `Long.MIN_VALUE`，避免先取绝对值时溢出。

          ## 3 分钟版

          来源只说“整型数字按三位划分并加逗号”，没有规定 API。下面把参考契约定成 `format(long value)`：输入任意 Java `long`，输出普通十进制字符串；负数保留 `-`，每三位数字之间插入 `,`。

          ```java
          public final class Solution {
              private Solution() {}

              public static String format(long value) {
                  String s = Long.toString(value);
                  int start = s.charAt(0) == '-' ? 1 : 0;
                  StringBuilder out = new StringBuilder(s.length() + s.length() / 3);

                  if (start == 1) {
                      out.append('-');
                  }
                  for (int i = start; i < s.length(); i++) {
                      if (i > start && (s.length() - i) % 3 == 0) {
                          out.append(',');
                      }
                      out.append(s.charAt(i));
                  }
                  return out.toString();
              }
          }
          ```

          例如 `1234567` 的数字长度是 7。遍历到第二个数字时，右侧连同当前位还剩 6 位，是 3 的倍数，所以先插入逗号；再往后三位，同样在剩余 3 位的位置插入逗号，得到 `1,234,567`。负数只是把数字起点从下标 0 调整到 1，分组逻辑本身不变。

          ## 关键细节

          - **来源边界**：原题没有说明语言、位宽、负数、前导零、本地化或小数。本答案的 Java `long`、负号保留都是显式参考契约，不冒充原题条件。
          - **为什么不 `Math.abs`**：`Long.MIN_VALUE` 的绝对值无法用正的 `long` 表示；直接处理 `Long.toString(value)` 没有这个溢出问题。
          - **三位边界**：`999` 不变，`1000 -> 1,000`，`1000000 -> 1,000,000`。
          - **负数**：`-1234567 -> -1,234,567`；负号不参与“三位”计数。
          - **0**：`0 -> 0`，不会产生空分组或多余逗号。
          - **复杂度**：设十进制数字位数为 d，遍历一次，时间 O(d)，输出本身也需要 O(d) 空间。
          - **本地化**：有些地区不是使用逗号作为千位分隔符；题目已经明确“加逗号”，所以这里不引入 Locale/NumberFormat 的其他规则。

          ## 原理机制

          “每三位一个逗号”本质上是按最低位对齐的分块。若从左向右看，第一个分组可能只有 1~3 位，后续每组固定 3 位；所以判断一个位置前是否加逗号，可以转化成检查它右侧剩余的数字数量。除第一数字外，只要当前位置到末尾的数字数是 3 的倍数，它就是一个新三位组的起点。

          这种写法不需要反转字符串，也不需要先计算绝对值。它只依赖最终十进制字符序列，因此对正数、负数和边界整数使用同一套不变量。

          ## 项目经验版

          来源没有提供用户在真实项目里实现金额/报表格式化的经历，不能虚构。工程上如果这是展示层需求，我会先确认是否真的是固定英文逗号规则：若业务需要 Locale、货币、小数精度或舍入，应使用相应格式化组件并把规则写进契约；如果就是面试题中的固定整数分组，保持这个纯函数更容易验证。

          ## 常见追问

          - 问：为什么从右边分组？答：十进制最低三位天然构成最后一组，千位、百万位等边界都由距离末尾的位数决定。
          - 问：负数怎么办？答：负号单独复制，不参与数字位计数，后续数字按同样规则分组。
          - 问：为什么不用 `Math.abs` 再处理？答：`Long.MIN_VALUE` 取绝对值仍然溢出；直接处理 `Long.toString` 更稳健。
          - 问：能不能用 `NumberFormat`？答：如果题目允许当然可以，但它会带入 Locale 等额外语义；手写题更重要的是明确分组不变量和边界。
          - 问：时间复杂度是多少？答：每个十进制字符最多处理一次，是 O(d)；结果字符串也占 O(d) 空间。
          - 问：前导零怎么办？答：本参考 API 接收数值 `long`，数值本身没有前导零语义；如果输入改成数字字符串，需要另外定义是否保留前导零。

          ## 易错点

          - 从左边固定每三位切一次，导致 `1234` 被错误分成 `123,4`。
          - 把负号计入三位长度，负数的逗号位置整体偏移。
          - 对 `Long.MIN_VALUE` 先取绝对值，引入溢出。
          - 在 3 位数前也加逗号，产生 `,999`。
          - 题目只要求固定逗号，却擅自加入货币符号、小数位或 Locale 规则。
          EOF

          cat > "$out/ThousandsSeparatorValidation.java" <<'JAVA'
          import java.util.*;

          public final class ThousandsSeparatorValidation {
              static String oracle(long value) {
                  String s=Long.toString(value);
                  int start=s.charAt(0)=='-'?1:0;
                  String digits=s.substring(start);
                  int first=digits.length()%3;
                  if(first==0) first=3;
                  StringBuilder out=new StringBuilder();
                  if(start==1) out.append('-');
                  out.append(digits,0,first);
                  for(int i=first;i<digits.length();i+=3) out.append(',').append(digits,i,i+3);
                  return out.toString();
              }
              static void check(long x, String expected) {
                  String got=Solution.format(x);
                  if(!got.equals(expected)) throw new AssertionError(x+" got="+got+" expected="+expected);
              }
              public static void main(String[] args) {
                  check(0L,"0"); check(1L,"1"); check(999L,"999"); check(1000L,"1,000");
                  check(1234567L,"1,234,567"); check(-1L,"-1"); check(-1000L,"-1,000");
                  check(-1234567L,"-1,234,567"); check(Long.MAX_VALUE,"9,223,372,036,854,775,807");
                  check(Long.MIN_VALUE,"-9,223,372,036,854,775,808");
                  Random r=new Random(0x42A11CE5L);
                  for(int i=0;i<20000;i++){
                      long x=r.nextLong();
                      String got=Solution.format(x), want=oracle(x);
                      if(!got.equals(want)) throw new AssertionError("random x="+x+" got="+got+" want="+want);
                  }
                  System.out.println("PASS fixed=10 random=20000 positive+negative+zero+long-extremes=covered");
              }
          }
          JAVA

          node <<'NODE'
          const fs=require('fs');
          const md=fs.readFileSync(`review/candidates/answers/${process.env.CANONICAL_ID}.md`,'utf8');
          const block=md.match(/```java\n([\s\S]*?)\n```/);
          if(!block||!block[1].includes('public final class Solution')) throw new Error('candidate Java block missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java "$out/ThousandsSeparatorValidation.java"
          stdout="$(java -cp /tmp ThousandsSeparatorValidation)"
          echo "$stdout"
          test "$stdout" = 'PASS fixed=10 random=20000 positive+negative+zero+long-extremes=covered'
          echo "WRITER_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze writer research packet
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0042/$cid"
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0042/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryTests=[
            {case:'0 and one-to-three digit integers',expected:'no separator',passed:true},
            {case:'1000 and multi-group positives',expected:'commas every three digits from the right',passed:true},
            {case:'negative values',expected:'minus sign preserved outside grouping',passed:true},
            {case:'Long.MIN_VALUE / Long.MAX_VALUE',expected:'no absolute-value overflow and correct grouping',passed:true},
            {case:'20,000 seeded random long values',expected:'matches independent first-group-then-three-groups oracle',passed:true}
          ];
          fs.writeFileSync(`${out}/thousands_separator_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate Solution.java; run ThousandsSeparatorValidation.java',stdout:process.env.WRITER_STDOUT,boundary_tests:boundaryTests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const research={schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'structured-note',title:'Structured interview note 6678d3f7000000001e013539',locator:'note_structured/6678d3f7000000001e013539.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Answer Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Thousands-separator deterministic Java fixture',locator:`${out}/thousands_separator_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-contract',text:'The repository source requires an integer to be divided into groups of three and separated with commas; it does not preserve language, integer width, negative-number behavior, locale, fractional formatting, or an API signature.',source_ids:['structured-note','source-inventory'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'Under the explicit Java long reference contract, the staged implementation groups decimal digits from the right, preserves a leading minus sign, avoids absolute-value overflow, and matches an independent grouping oracle over fixed boundaries and 20,000 seeded random long values.',source_ids:['writer-validation'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed',candidate_sha256:sha};
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify(research,null,2)+'\n');
          NODE

      - name: Writer-side repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit candidate and writer packet with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0042/$CANONICAL_ID/ThousandsSeparatorValidation.java" "review/content_build/answer_batch_0042/$CANONICAL_ID/thousands_separator_validation.json" "review/content_build/answer_batch_0042/$CANONICAL_ID/writer_research.json"
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage batch 0042 thousands-separator candidate'
          for attempt in 1 2 3; do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH"; then
              git rebase --abort || true
              echo 'Content branch changed on the same writer artifacts; fail closed.' >&2
              exit 1
            fi
            if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            sleep 5
          done
          echo 'Unable to push thousands-separator writer artifacts after safe retries.' >&2
          exit 1
