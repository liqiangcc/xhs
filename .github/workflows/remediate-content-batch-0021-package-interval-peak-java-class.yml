name: Remediate Content Batch 0021 Package Interval Peak Java Class

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0021-package-interval-peak-java-class.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0021-package-interval-peak-java-class-remediation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_3a1c2667429257c4fbe7e2d8d8012096
  EXPECTED_CANDIDATE_SHA256: 0d03a03c1c9124552234beef4c2fd03eee4369e553e6b0a63779129f540289ca

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "implementation_sha256=$(sha256sum review/content_build/answer_batch_0021/$CANONICAL_ID/PackagePeak.java | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          test "${{ env.EXPECTED_CANDIDATE_SHA256 }}" = "$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Replace placeholder method block with complete executable class
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const cid=process.env.CANONICAL_ID;
          const candidate=`review/candidates/answers/${cid}.md`;
          const impl=`review/content_build/answer_batch_0021/${cid}/PackagePeak.java`;
          let md=fs.readFileSync(candidate,'utf8');
          const implementation=fs.readFileSync(impl,'utf8').trimEnd();
          if(!implementation.includes('public final class PackagePeak')) throw new Error('implementation class missing');
          const blocks=[...md.matchAll(/```java\n[\s\S]*?\n```/g)];
          if(blocks.length!==1) throw new Error(`expected exactly one Java block, got ${blocks.length}`);
          const replacement='```java\n'+implementation+'\n```';
          md=md.replace(blocks[0][0],replacement);
          fs.writeFileSync(candidate,md);
          const hash=crypto.createHash('sha256').update(Buffer.from(md)).digest('hex');
          if(hash===process.env.EXPECTED_CANDIDATE_SHA256) throw new Error('candidate hash did not change');
          console.log(`remediated_candidate_sha256=${hash}`);
          NODE

      - name: Validate candidate-extracted Java against existing writer oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0021/$cid"
          rm -rf "$out/remediation_tmp"
          mkdir -p "$out/remediation_tmp"
          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const m=md.match(/```java\n([\s\S]*?)\n```/);
          if(!m) throw new Error('candidate Java block missing');
          fs.writeFileSync(`review/content_build/answer_batch_0021/${cid}/remediation_tmp/PackagePeak.java`,m[1]+'\n');
          NODE
          cp "$out/PackagePeakWriterTest.java" "$out/remediation_tmp/PackagePeakWriterTest.java"
          (cd "$out/remediation_tmp" && javac -Xlint:all -Werror PackagePeak.java PackagePeakWriterTest.java && java PackagePeakWriterTest > stdout.txt)
          stdout="$(cat "$out/remediation_tmp/stdout.txt")"
          test "$stdout" = 'PASS randomized_cases=12000 simultaneous_boundary=pass disjoint_peaks=pass large_timestamp=pass invalid_contract=pass'
          WRITER_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID;
          const candidate=`review/candidates/answers/${cid}.md`;
          const validation=`review/content_build/answer_batch_0021/${cid}/writer_validation.json`;
          const v=JSON.parse(fs.readFileSync(validation,'utf8'));
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const implHash=crypto.createHash('sha256').update(fs.readFileSync(`review/content_build/answer_batch_0021/${cid}/PackagePeak.java`)).digest('hex');
          if(v.result!=='pass'||v.implementation_sha256!==implHash) throw new Error('existing writer validation/implementation binding drift');
          v.candidate_sha256=hash;
          v.validated_at='2026-08-26';
          v.command='extract candidate Java; javac -Xlint:all -Werror PackagePeak.java PackagePeakWriterTest.java && java PackagePeakWriterTest';
          v.stdout=process.env.WRITER_STDOUT;
          if(!v.checks.includes('candidate answer Java block is a complete executable class compiled from current candidate bytes')) v.checks.push('candidate answer Java block is a complete executable class compiled from current candidate bytes');
          fs.writeFileSync(validation,JSON.stringify(v,null,2)+'\n');
          NODE

      - name: Repository consistency gates before isolated review
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Commit remediation without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/remediation_tmp"
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0021/$CANONICAL_ID/writer_validation.json"
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: make package peak Java candidate executable'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"
          base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_implementation="$(git show "origin/$CONTENT_BRANCH:review/content_build/answer_batch_0021/$CANONICAL_ID/PackagePeak.java" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_implementation" = '${{ steps.base.outputs.implementation_sha256 }}' || { echo 'implementation changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
