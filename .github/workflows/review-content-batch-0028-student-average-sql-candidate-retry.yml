name: Review Content Batch 0028 Student Average SQL Candidate Retry

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0028-student-average-sql-candidate-retry.yml

permissions:
  contents: write

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_e9c5bb8468fd0b37bd3f0abf72df80aa
  SOURCE_QID: e9c5bb8468fd0b37bd3f0abf72df80aa

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Guard source and rerun exact fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object review/candidates/answers/$CANONICAL_ID.md)" = '94b2e829457bdc36d1ed470a57677787afe386ea'
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          test "$(python3 "$out/sql_validation.py")" = 'PASS students=1,2,4 averages=85,70,60 no-grade=excluded equal-valued-records=preserved'
          node <<'NODE'
          const fs=require('fs'), cid=process.env.CANONICAL_ID, qid=process.env.SOURCE_QID;
          const rows=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').trim().split(/\r?\n/).map(JSON.parse);
          const row=rows.find(r=>r.canonical_id===cid);
          if(!row || JSON.stringify(row.question_ids)!==JSON.stringify([qid])) throw new Error('source ownership drifted');
          NODE

      - name: Write corrected isolated review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),path=require('path');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`, fixture=`review/content_build/answer_batch_0028/${cid}/sql_validation.json`;
          const reviewPath=`review/content_build/answer_batch_0028/${cid}/isolated_review_result.json`;
          const h=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0028-20260825-v3';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The split repository source asks only for student number, student name and average grade from student and grade tables; the candidate labels concrete schema names, join key, no-grade behavior, ordering and precision as assumptions or unresolved boundaries.',
            'Under the explicit minimal schema, joining by student identity, grouping at student grain and averaging score rows satisfies the requested output.',
            'INNER JOIN is explicitly scoped to the candidate contract that only students with at least one grade are returned; LEFT JOIN is described only as a different contract.',
            'The SQLite fixture passes multiple-grade and single-grade averages, no-grade exclusion and preservation of equal-valued separate grade records.',
            'No fabricated experience, unsupported source expansion, uncovered source variant or hard failure remains; formal promotion is still subject to the repository human-review policy.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:h,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0028.student-average-sql.v1',decision:'pass',revision_round:0,source_packet:['review/reports/ANSWER_BATCH_0028_SOURCE_PACKET.md','review/content_build/answer_batch_0028/source_boundary_audit.md','review/content_build/answer_batch_0028/relation_review.md',candidate,fixture,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['human_approval_required_for_pilot_promotion']};
          fs.mkdirSync(path.dirname(reviewPath),{recursive:true}); fs.writeFileSync(reviewPath,JSON.stringify(review,null,2)+'\n');
          const boundary=[
            {case:'multiple and single grade rows',expected:'per-student averages are 85 and 70',passed:true},
            {case:'student without grades',expected:'excluded by the explicitly stated INNER JOIN contract',passed:true},
            {case:'equal-valued separate grade records',expected:'both records participate in AVG and Dan remains 60',passed:true}
          ];
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:h,checked_at:date,writer:{writer_id:'content-batch-0028-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[
            {source_id:'repo-source',title:'Answer Batch 0028 repository source packet',locator:'review/reports/ANSWER_BATCH_0028_SOURCE_PACKET.md',source_type:'repository_source_record',checked_at:date},
            {source_id:'relation-review',title:'Answer Batch 0028 relation review',locator:'review/content_build/answer_batch_0028/relation_review.md',source_type:'repository_structured_source',checked_at:date},
            {source_id:'fixture',title:'Student average SQL deterministic SQLite fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
            {source_id:'isolated-review',title:'Source-first isolated review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
          ],claims:[
            {claim_id:'source-contract',text:'The split source requests student number, name and average grade without preserving concrete schema, ordering, precision or no-grade behavior.',source_ids:['repo-source','relation-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},
            {claim_id:'query-behavior',text:'Under the explicitly stated minimal schema and INNER JOIN contract, the query returns one row per matched student with AVG(score).',source_ids:['fixture','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制']},
            {claim_id:'validation',text:'The executable fixture verifies multiple/single grade averages, no-grade exclusion and preservation of equal-valued separate grade records.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}
          ],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'python3 sql_validation.py',result:'pass',reported_stdout:'PASS students=1,2,4 averages=85,70,60 no-grade=excluded equal-valued-records=preserved',checks:['multiple grades average correctly','single grade average','student without grades excluded by explicit contract','equal-valued records both participate'],boundary_tests:boundary},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0028.student-average-sql.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0028.md'; let text=fs.readFileSync(task,'utf8');
          const note='- Student/grade average SQL split-child candidate passed isolated source-first review and executable evidence; formal promotion remains approval-gated.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit corrected review if branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced; retry on next run.'; exit 0; }
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0028/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0028.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0028 student-average SQL candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
