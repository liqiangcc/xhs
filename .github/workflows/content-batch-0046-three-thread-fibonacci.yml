          import java.math.BigInteger;
          import java.util.List;

          public final class ThreeThreadFibonacciTest {
              private static void check(int n) throws Exception {
                  List<ThreeThreadFibonacci.Output> got = ThreeThreadFibonacci.generate(n);
                  if (got.size() != n) throw new AssertionError("size=" + got.size() + " n=" + n);
                  BigInteger a=BigInteger.ZERO,b=BigInteger.ONE;
                  for (int i=0;i<n;i++) {
                      var row=got.get(i);
                      if (row.index()!=i) throw new AssertionError("index " + row);
                      if (row.threadSlot()!=i%3) throw new AssertionError("slot " + row);
                      if (!row.value().equals(a)) throw new AssertionError("fib i="+i+" got="+row.value()+" want="+a);
                      BigInteger next=a.add(b);a=b;b=next;
                  }
              }
              public static void main(String[] args) throws Exception {
                  for (int r=0;r<300;r++) check(100);
