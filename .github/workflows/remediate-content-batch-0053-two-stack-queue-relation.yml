name: Remediate Content Batch 0053 Two Stack Queue Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0053-two-stack-queue-relation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0053-two-stack-queue-relation-remediation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  SURVIVOR_QID: 36ab1630843f456fa940c19962292fbe
  SURVIVOR_CID: cq_q_36ab1630843f456fa940c19962292fbe
  DUP_QID: eaae17962ef4c12e3a382e102ff461c1
  DUP_CID: cq_q_eaae17962ef4c12e3a382e102ff461c1

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Freeze source-first same-relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          dir='review/content_build/answer_batch_0053/two_stack_queue_relation'
          node <<'NODE'
          const fs=require('fs');
          const path='review/content_build/answer_batch_0053/two_stack_queue_relation/source_relation_packet.json';
          const packet=JSON.parse(fs.readFileSync(path,'utf8'));
          const target=packet.target, adjacent=packet.adjacent;
          if(target?.canonical_id!==process.env.DUP_CID) throw new Error(`target drift: ${target?.canonical_id}`);
          if(adjacent?.canonical_id!==process.env.SURVIVOR_CID) throw new Error(`adjacent drift: ${adjacent?.canonical_id}`);
          const tq=target.questions||[], aq=adjacent.questions||[];
          if(tq.length!==1 || tq[0].question_id!==process.env.DUP_QID || tq[0].original_question!=='编程题: 用两个栈模拟队列 (实现push、pop、count)') throw new Error('target frozen source drifted');
          const expected=new Map([
            ['36ab1630843f456fa940c19962292fbe','算法：两个栈实现队列'],
            ['4a4761c79b9ebbb35a45eaf3843caca0','算法：两个栈模拟队列？'],
            ['7f276bae3d88861ba9c9abc663d172cf','算法 2：使用两个栈实现一个队列（要求不使用额外的辅助数据结构）'],
          ]);
          if(aq.length!==expected.size) throw new Error(`adjacent source count drift: ${aq.length}`);
          for(const q of aq){ if(expected.get(q.question_id)!==q.original_question) throw new Error(`adjacent source drift ${q.question_id}: ${q.original_question}`); }

          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          if(byQ.get(process.env.DUP_QID)?.canonical_id!==process.env.DUP_CID) throw new Error('duplicate ownership already drifted');
          for(const qid of expected.keys()) if(byQ.get(qid)?.canonical_id!==process.env.SURVIVOR_CID) throw new Error(`survivor ownership drifted: ${qid}`);
          if(JSON.stringify(byC.get(process.env.DUP_CID)?.question_ids||[])!==JSON.stringify([process.env.DUP_QID])) throw new Error('duplicate Canonical is no longer bounded singleton');
          const survivor=byC.get(process.env.SURVIVOR_CID);
          if(!survivor || ![...expected.keys()].every(qid=>(survivor.question_ids||[]).includes(qid))) throw new Error('survivor source membership drifted');

          const review=`# Batch 0053 Two-Stack Queue Source-First Relation Review\n\n`+
            `## Primary repository source facts\n\n`+
            `- \`${process.env.DUP_QID}\`: “编程题: 用两个栈模拟队列 (实现push、pop、count)”.\n`+
            `- \`36ab1630843f456fa940c19962292fbe\`: “算法：两个栈实现队列”.\n`+
            `- \`4a4761c79b9ebbb35a45eaf3843caca0\`: “算法：两个栈模拟队列？”.\n`+
            `- \`7f276bae3d88861ba9c9abc663d172cf\`: “算法 2：使用两个栈实现一个队列（要求不使用额外的辅助数据结构）”.\n\n`+
            `No historical relation/remediation record was consulted before this conclusion.\n\n`+
            `## Decision\n\n`+
            `Relation: \`same\`. All four preserved prompts ask for the same observable Coding contract: implement FIFO queue behavior using two stacks. The Batch 0053 wording makes push/pop/count explicit; that is interface detail within the same queue implementation, not a distinct algorithmic goal. The “no extra auxiliary data structure” wording is an implementation constraint and is compatible with count derived from the two stack sizes. Consolidate singleton \`${process.env.DUP_CID}\` into existing survivor \`${process.env.SURVIVOR_CID}\`.\n\n`+
            `## Content consequence\n\n`+
            `The survivor Answer must cover all four source variants, including push/pop/count and the no-extra-data-structure constraint. This normalization does not promote content; exact-code validation, isolated review/evidence, required human approval, and real-review policy remain mandatory.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0053/two_stack_queue_relation/relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Select decide and apply reviewed duplicate pair
        shell: bash
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0053/two_stack_queue_relation/apply'
          mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$SURVIVOR_QID,$DUP_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const expected=[process.env.SURVIVOR_QID,process.env.DUP_QID].sort();
          const matches=(r.relation_candidates||[]).filter(c=>JSON.stringify([...(c.question_ids||[])].sort())===JSON.stringify(expected));
          if(matches.length!==1) throw new Error(`expected exactly one selected two-stack RelationCandidate, got ${matches.length}`);
          process.stdout.write(matches[0].relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide \
            --relation-candidate-key "$key" \
            --relation same \
            --actor-type ai \
            --actor-id batch-0053-two-stack-queue-source-first-review \
            --actor-display-name 'Two-stack queue source-first reviewer' \
            --rationale 'Four exact repository prompts preserve the same Coding operation: implement FIFO queue behavior using two stacks. The singleton adds explicit push/pop/count methods; the existing variants express the same queue contract, including one no-extra-data-structure constraint. Count can be derived from the two stack sizes, so no distinct algorithmic target is preserved.' > "$out/decide.json"
          node scripts/xhs.js dedup apply \
            --relation-candidate-key "$key" \
            --canonical-id "$SURVIVOR_CID" \
            --canonical-title '算法：两个栈实现队列' > "$out/apply.json"

      - name: Verify consolidation and update task
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          const qids=['36ab1630843f456fa940c19962292fbe','4a4761c79b9ebbb35a45eaf3843caca0','7f276bae3d88861ba9c9abc663d172cf',process.env.DUP_QID];
          for(const qid of qids) if(byQ.get(qid)?.canonical_id!==process.env.SURVIVOR_CID) throw new Error(`${qid}: survivor ownership missing`);
          if(byC.has(process.env.DUP_CID)) throw new Error('duplicate two-stack Canonical survived consolidation');
          const survivor=byC.get(process.env.SURVIVOR_CID);
          if(!survivor || !qids.every(qid=>(survivor.question_ids||[]).includes(qid))) throw new Error(`survivor members missing: ${JSON.stringify(survivor?.question_ids)}`);

          fs.writeFileSync('review/content_build/answer_batch_0053/two_stack_queue_relation/relation_apply.md',
            '# Batch 0053 Two-Stack Queue Relation Application\n\n'+
            '- Relation: `same`.\n'+
            '- Survivor: `'+process.env.SURVIVOR_CID+'`; it now owns all four reviewed source Questions.\n'+
            '- Retired duplicate Canonical: `'+process.env.DUP_CID+'`.\n'+
            '- The merge does not promote the survivor Answer; the next content slice must cover push/pop/count and the no-extra-data-structure source constraint.\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0053.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_eaae17962ef4c12e3a382e102ff461c1` source-first relation remediation: its exact push/pop/count two-stack queue prompt was compared with all three source Questions under existing `cq_q_36ab1630843f456fa940c19962292fbe`. Relation is `same`: all preserve the same FIFO-via-two-stacks Coding contract; explicit count is interface detail and can use the two stack sizes without another auxiliary data structure. The singleton is retired into the existing survivor. The survivor still requires one source-bounded answer covering all four variants plus exact-code validation, isolated review/evidence, human approval, and real-review policy.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Refresh generated audits and run full gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during two-stack relation remediation: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: normalize two-stack queue source relation'
          git push origin "HEAD:$CONTENT_BRANCH"
