name: Review Content Batch 0037 Non-Empty Subsets Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0037-non-empty-subsets.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0037-non-empty-subsets-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9351a8346067d7995b644219ad53ced3
  SOURCE_QID: 9351a8346067d7995b644219ad53ced3
  SOURCE_RAW: note_img_txt/68075d56000000000d017fd3.txt
  SOURCE_TAGGED: note_tagged/68075d56000000000d017fd3.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first boundary and exact-candidate validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0037/$cid"
          candidate="review/candidates/answers/$cid.md"
          tmp="$out/reviewer_tmp"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          python3 - <<'PY'
          import json, os, pathlib, re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']
          raw=pathlib.Path(os.environ['SOURCE_RAW']).read_text()
          if '3.算法题,子集问题,但不包含空集。' not in raw:
              raise SystemExit('raw subset source drift')
          tagged=json.loads(pathlib.Path(os.environ['SOURCE_TAGGED']).read_text())
          q=next((x for x in tagged.get('tagged_questions',[]) if x.get('question_id')==qid),None)
          if not q or q.get('original_question')!='算法：子集问题 (不包含空集)' or q.get('is_valid_for_library') is not True:
              raise SystemExit('tagged subset source drift')
          md=pathlib.Path(f'review/candidates/answers/{cid}.md').read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in ['按位置定义的非空子集','result.add(new ArrayList<>(path))','backtrack(nums, i + 1','path.remove(path.size() - 1)','重复值边界','2^n - 1','O(n * 2^n)']:
              if marker not in md: raise SystemExit(f'candidate missing {marker}')
          if len(re.findall(r'^- 问：',md,re.M))<5: raise SystemExit('followups insufficient')
          if re.search(r'我在线上|我负责过|我们生产|真实项目里我曾|线上事故',md): raise SystemExit('fabricated project claim')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java implementation, got {len(blocks)}')
          snippet=re.sub(r'^import\s+java\.util\.[^;]+;\s*$', '', blocks[0], flags=re.M).strip()
          harness='''import java.util.*;\npublic class CandidateHarness {\n'''+snippet+'''\n
            static List<List<Integer>> oracle(int[] nums) {
              List<List<Integer>> out=new ArrayList<>();
              for(int mask=1;mask<(1<<nums.length);mask++){
                List<Integer> row=new ArrayList<>();
                for(int i=0;i<nums.length;i++) if((mask&(1<<i))!=0) row.add(nums[i]);
                out.add(row);
              }
              return out;
            }
            static Map<List<Integer>,Integer> multiset(List<List<Integer>> rows){
              Map<List<Integer>,Integer> m=new HashMap<>();
              for(List<Integer> row:rows)m.merge(List.copyOf(row),1,Integer::sum);
              return m;
            }
            static void check(int[] nums){
              List<List<Integer>> got=nonEmptySubsets(nums), exp=oracle(nums);
              if(got.size()!=exp.size()||!multiset(got).equals(multiset(exp))) throw new AssertionError(Arrays.toString(nums));
              for(List<Integer> row:got) if(row.isEmpty()) throw new AssertionError("empty subset emitted");
            }
            public static void main(String[] args){
              check(new int[]{}); check(new int[]{7}); check(new int[]{1,2,3}); check(new int[]{1,1}); check(new int[]{2,1,2}); check(new int[]{0,-1,2,2});
              int exhaustive=0;
              for(int n=0;n<=7;n++) for(int mask=0;mask<(1<<n);mask++){
                int[] a=new int[n]; for(int i=0;i<n;i++) a[i]=((mask&(1<<i))==0)?0:1; check(a); exhaustive++;
              }
              Random r=new Random(0x9351a834L); int randomized=0;
              for(int t=0;t<5000;t++){int n=r.nextInt(13);int[] a=new int[n];for(int i=0;i<n;i++)a[i]=r.nextInt(9)-4;check(a);randomized++;}
              int[] twelve=new int[12]; for(int i=0;i<12;i++) twelve[i]=i;
              if(nonEmptySubsets(twelve).size()!=4095) throw new AssertionError("n12 count");
              System.out.println("PASS exact_candidate deterministic=6 exhaustive_binary_arrays="+exhaustive+" randomized="+randomized+" n12=4095 duplicate_position_semantics=pass empty_excluded=pass");
            }
          }
          '''
          pathlib.Path(f'review/content_build/answer_batch_0037/{cid}/reviewer_tmp/CandidateHarness.java').write_text(harness)
          PY

          (cd "$tmp" && javac CandidateHarness.java && java CandidateHarness > stdout.txt)
          stdout="$(cat "$tmp/stdout.txt")"
          test "$stdout" = 'PASS exact_candidate deterministic=6 exhaustive_binary_arrays=255 randomized=5000 n12=4095 duplicate_position_semantics=pass empty_excluded=pass'

          REVIEW_STDOUT="$stdout" python3 - <<'PY'
          import hashlib, json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-26'
          out=pathlib.Path(f'review/content_build/answer_batch_0037/{cid}')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md')
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          stdout=os.environ['REVIEW_STDOUT']
          checks=[
            'exact candidate Java implementation compiles under Java 21',
            'six deterministic cases match an independent bitmask oracle',
            'all 255 binary-valued arrays of length 0..7 match as output multisets',
            '5000 seeded randomized arrays of length 0..12 match as output multisets',
            'duplicate values preserve position-defined multiplicity',
            'no empty subset is emitted',
            'n=12 produces exactly 4095 non-empty subsets'
          ]
          rv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract exact candidate Java block, compile it in an independent harness, and compare against a bitmask oracle','stdout':stdout,'checks':checks}
          (out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=[
            'The answer stays inside the preserved non-empty-subset source boundary and labels position-based semantics as an explicit executable contract.',
            'The exact Java implementation records only non-empty paths, advances the start index, copies mutable path state, and restores it after recursion.',
            'Duplicate-value behavior is explicitly separated from value-level deduplication instead of silently inventing an element-uniqueness requirement.',
            'The increasing-index-sequence argument supports both completeness and absence of position-level duplicates.',
            'The complexity discussion includes output-copy cost rather than claiming only O(2^n).',
            'Independent exact-candidate compilation and differential validation passed.',
            'No fabricated production experience is claimed.'
          ]
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-nonempty-subsets-20260826-v2','review_version':'nonempty-subsets.position-contract.v2','decision':'pass','revision_round':1,'source_packet':[os.environ['SOURCE_RAW'],os.environ['SOURCE_TAGGED'],str(candidate),'docs/refactor/09_answer_content_standard.md',str(out/'reviewer_validation.json')],'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']}
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Bind evidence and record task progress
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0037/$cid"
          javac "$out/writer_validation.java"
          java -cp "$out" writer_validation

          python3 - <<'PY'
          import json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-26'
          out=pathlib.Path(f'review/content_build/answer_batch_0037/{cid}')
          writer=json.loads((out/'writer_research.json').read_text())
          wv=json.loads((out/'writer_validation.json').read_text())
          rv=json.loads((out/'reviewer_validation.json').read_text())
          review=json.loads((out/'isolated_review_result.json').read_text())
          if writer.get('review_state')!='writer_complete_isolated_review_pending' or wv.get('result')!='pass' or rv.get('result')!='pass' or review.get('decision')!='pass':
              raise SystemExit('phase state mismatch')
          evidence={
            'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':review['candidate_sha256'],'checked_at':date,
            'writer':{'writer_id':'nonempty-subsets-source-bounded-writer-20260826-v1','writer_version':'xhs-answer-curator.v1'},
            'sources':[
              {'source_id':'repository-raw-ocr','title':'ByteDance backend interview raw OCR source','locator':os.environ['SOURCE_RAW'],'source_type':'repository_source_record','checked_at':date},
              {'source_id':'repository-tagged','title':'Structured tagged non-empty subset question','locator':os.environ['SOURCE_TAGGED'],'source_type':'repository_structured_source','checked_at':date},
              {'source_id':'writer-validation','title':'Writer non-empty subset differential validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'reviewer-validation','title':'Independent exact-candidate subset differential validation','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'isolated-review','title':'Fresh isolated source-first review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}
            ],
            'claims':[
              {'claim_id':'source-boundary','text':'The source specifies a subset coding problem with the empty subset excluded, but does not specify input uniqueness, value-level deduplication, output order, or size limits.','source_ids':['repository-raw-ocr','repository-tagged','isolated-review'],'answer_locations':['核心结论','1 分钟版','关键细节']},
              {'claim_id':'position-contract','text':'The candidate makes position-based subset semantics explicit and treats duplicate-value deduplication as a separate contract requiring clarification.','source_ids':['repository-raw-ocr','repository-tagged','writer-validation','reviewer-validation','isolated-review'],'answer_locations':['核心结论','关键细节','常见追问']},
              {'claim_id':'implementation-correctness','text':'The exact Java candidate compiles and matches an independent bitmask oracle across deterministic, exhaustive, and seeded randomized cases while never emitting the empty subset.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['3 分钟版','关键细节','原理机制','常见追问']}
            ],
            'source_question_coverage':[{'question_id':os.environ['SOURCE_QID'],'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],
            'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks']},
            'review_state':'independent_source_first_review_passed',
            'review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':review['scores'],'hard_failures':[],'uncovered_source_variants':[],'unsupported_claims':[],'findings':review['findings']}
          }
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md')
          text=task.read_text()
          pending='- [ ] `cq_q_9351a8346067d7995b644219ad53ced3` non-empty-subsets candidate now preserves the raw OCR/structured source boundary without inventing element uniqueness, adopts explicit position-based subset semantics with duplicate-value behavior called out, provides complete Java backtracking, and passes five deterministic plus 2000 seeded randomized differential cases against an independent bitmask oracle; isolated source-first review and evidence/code gate are still pending.'
          passed='- [x] `cq_q_9351a8346067d7995b644219ad53ced3` non-empty-subsets candidate preserves the raw OCR/structured source boundary without inventing element uniqueness, adopts an explicit position-based contract with duplicate-value behavior called out, contains complete Java backtracking, passes writer validation plus independent exact-candidate compilation and deterministic/exhaustive/randomized differential validation, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.'
          if pending not in text: raise SystemExit('pending task marker missing')
          task.write_text(text.replace(pending,passed))
          PY
          rm -rf "$out/reviewer_tmp"

      - name: Commit reviewed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0037/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0037/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" \
                  tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md
          git commit -m 'review: pass batch 0037 non-empty subsets candidate source-first'
          for attempt in 1 2 3; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
