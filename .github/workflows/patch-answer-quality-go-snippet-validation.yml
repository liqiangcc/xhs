name: Patch Answer Quality Go Snippet Validation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/patch-answer-quality-go-snippet-validation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-answer-quality-go-snippet-validation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Make Go validation accept standalone snippets without weakening compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('scripts/lib/answer_quality.js')
          s = p.read_text(encoding='utf-8')
          old = """        const filePath = path.join(tempDir, 'answer.go');
        fs.writeFileSync(filePath, code, 'utf8');
        const result = childProcess.spawnSync('go', ['test', filePath], {"""
          new = """        const filePath = path.join(tempDir, 'answer.go');
        const source = /^\\s*package\\s+[A-Za-z_]\\w*/m.test(code)
            ? code
            : `package main\\n\\n${code}\\n`;
        fs.writeFileSync(filePath, source, 'utf8');
        const result = childProcess.spawnSync('go', ['test', filePath], {"""
          if old not in s:
              raise SystemExit('compileGo write block drifted')
          s = s.replace(old, new, 1)

          old_export = '    validateShell,\n    parseSql,'
          new_export = '    validateShell,\n    compileGo,\n    parseSql,'
          if old_export not in s:
              raise SystemExit('module export anchor drifted')
          s = s.replace(old_export, new_export, 1)
          p.write_text(s, encoding='utf-8')

          t = Path('test/answer_code_validation.test.js')
          x = t.read_text(encoding='utf-8')
          old_import = "const { compileJava, compileC, compileCpp, validateShell, parseSql, validateSpecializedCandidate } = require('../scripts/lib/answer_quality');"
          new_import = "const { compileJava, compileC, compileCpp, validateShell, compileGo, parseSql, validateSpecializedCandidate } = require('../scripts/lib/answer_quality');"
          if old_import not in x:
              raise SystemExit('answer code validation import drifted')
          x = x.replace(old_import, new_import, 1)

          marker = "\ntest('shell validation accepts bash/sh fences and rejects malformed scripts', () => {"
          lines = [
              '',
              "test('Go validation compiles full files and function-only answer snippets', () => {",
              "    assert.equal(compileGo('package main\\nfunc add(a, b int) int { return a + b }').ok, true);",
              "    assert.equal(compileGo('func add(a, b int) int { return a + b }').ok, true);",
              "    assert.equal(compileGo('func add(a, b int) int { return a + }').ok, false);",
              '});',
              '',
          ]
          test_block = '\n'.join(lines)
          if marker not in x:
              raise SystemExit('Go regression insertion marker drifted')
          x = x.replace(marker, test_block + marker, 1)
          t.write_text(x, encoding='utf-8')
          PY

      - name: Run focused and repository regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test test/answer_code_validation.test.js test/answer_candidate.test.js
          npm test
          npm run ci:check
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Commit validated patch to content branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-maintenance-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add scripts/lib/answer_quality.js test/answer_code_validation.test.js
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Patch already applied.'; exit 0; fi
          git commit -m 'fix: compile Go answer snippets in strict audit'
          for attempt in 1 2 3; do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH"; then
              git rebase --abort || true
              echo 'Concurrent validator edit detected; fail closed.' >&2
              exit 1
            fi
            if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            sleep 5
          done
          echo 'Unable to push Go validator patch after retries.' >&2
          exit 1
