name: Review Content Batch 0021 Package Interval Peak Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0021-package-interval-peak-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-package-interval-peak-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_3a1c2667429257c4fbe7e2d8d8012096
  SOURCE_QID: f2d52be391d5a320a5460d80e4256278
  SOURCE_NOTE: note_desc/68b81a39000000001c034f47.txt
  SOURCE_TAGGED: note_tagged/68b81a39000000001c034f47.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "implementation_sha256=$(sha256sum review/content_build/answer_batch_0021/$CANONICAL_ID/PackagePeak.java | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_note_sha256=$(sha256sum "$SOURCE_NOTE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_tagged_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review with independent direct-membership oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0021/$cid"
          candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"
          test -f "$out/PackagePeak.java"
          rm -rf "$out/reviewer_tmp"
          mkdir -p "$out/reviewer_tmp"

          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const raw=fs.readFileSync(process.env.SOURCE_NOTE,'utf8');
          const rawNeedle='现在给你这 1 亿个包裹的存入和取出时间，用一个数组来存储。';
          const rawQuestion='如何找出这一天中的哪个时间段包裹没有被取出来的数目是最多的？以及它们所在的时间段是多长的时间？你的方案的时间和空间复杂度是多少？';
          if(!raw.includes(rawNeedle)||!raw.includes(rawQuestion)) throw new Error('primary source wording drift');
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const tq=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='给定一天内1亿个包裹的存入和取出时间，如何找出未取出包裹数最多的时间段及持续时长？方案的时间和空间复杂度是多少？';
          if(!tq||tq.original_question!==expected) throw new Error('tagged source drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift: ${h}`);
          for(const marker of ['[putTime, takeTime)','O(n+T)','O(n log n)','O(T)','1.6 GB','没有规定时间戳精度','相邻峰值合并']) if(!md.includes(marker)) throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责|我优化到/.test(md)) throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          if((md.match(/```java\n[\s\S]*?\n```/g)||[]).length!==1) throw new Error('expected exactly one Java answer block');
          NODE

          cp "$out/PackagePeak.java" "$out/reviewer_tmp/PackagePeak.java"
          cat > "$out/reviewer_tmp/PackagePeakReviewerTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;
          import java.util.TreeSet;

          public final class PackagePeakReviewerTest {
              private static long exhaustiveCases;
              private static long randomCases;

              public static void main(String[] args) {
                  ArrayList<PackagePeak.Interval> types = new ArrayList<>();
                  for (long start = 0; start < 5; start++) {
                      for (long end = start + 1; end <= 5; end++) {
                          types.add(new PackagePeak.Interval(start, end));
                      }
                  }
                  for (int size = 0; size <= 5; size++) {
                      enumerateMultisets(types, 0, size, new ArrayList<>());
                  }

                  Random r = new Random(0x3A1C2667L);
                  for (int c = 0; c < 5000; c++) {
                      int n = r.nextInt(11);
                      ArrayList<PackagePeak.Interval> xs = new ArrayList<>();
                      for (int i = 0; i < n; i++) {
                          long put = r.nextInt(40);
                          long take = put + 1 + r.nextInt((int) (40 - put));
                          xs.add(new PackagePeak.Interval(put, take));
                      }
                      checkAgainstDirectMembershipOracle(xs);
                      randomCases++;
                  }

                  long m = (Long.MAX_VALUE >>> 1) - 1000;
                  checkAgainstDirectMembershipOracle(List.of(
                          new PackagePeak.Interval(m - 300, m - 20),
                          new PackagePeak.Interval(m - 250, m - 10),
                          new PackagePeak.Interval(m - 200, m - 50),
                          new PackagePeak.Interval(m - 20, m - 1)));
                  checkAgainstDirectMembershipOracle(List.of(
                          new PackagePeak.Interval(0, 2),
                          new PackagePeak.Interval(2, 4),
                          new PackagePeak.Interval(1, 3)));
                  checkAgainstDirectMembershipOracle(List.of(
                          new PackagePeak.Interval(0, 2),
                          new PackagePeak.Interval(4, 6)));

                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(null));
                  ArrayList<PackagePeak.Interval> withNull = new ArrayList<>();
                  withNull.add(null);
                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(withNull));
                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(List.of(new PackagePeak.Interval(-1, 1))));
                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(List.of(new PackagePeak.Interval(3, 3))));
                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(List.of(new PackagePeak.Interval(4, 3))));
                  expect(IllegalArgumentException.class, () -> PackagePeak.findPeak(List.of(new PackagePeak.Interval(0, (Long.MAX_VALUE >>> 1) + 1))));

                  if (exhaustiveCases != 15504) throw new AssertionError("unexpected exhaustive case count " + exhaustiveCases);
                  System.out.printf("PASS exhaustive_cases=%d random_cases=%d direct_membership_oracle=pass simultaneous_boundary=pass disjoint_peaks=pass large_sparse_time=pass invalid_contract=reject%n", exhaustiveCases, randomCases);
              }

              private static void enumerateMultisets(List<PackagePeak.Interval> types, int startIndex, int remaining, ArrayList<PackagePeak.Interval> current) {
                  if (remaining == 0) {
                      checkAgainstDirectMembershipOracle(current);
                      exhaustiveCases++;
                      return;
                  }
                  for (int i = startIndex; i < types.size(); i++) {
                      current.add(types.get(i));
                      enumerateMultisets(types, i, remaining - 1, current);
                      current.remove(current.size() - 1);
                  }
              }

              private static void checkAgainstDirectMembershipOracle(List<PackagePeak.Interval> xs) {
                  Oracle expected = oracle(xs);
                  PackagePeak.Result actual = PackagePeak.findPeak(xs);
                  if (actual.maxPackages() != expected.max) throw new AssertionError("max mismatch xs=" + xs + " actual=" + actual + " expected=" + expected);
                  if (actual.totalPeakDuration() != expected.total) throw new AssertionError("duration mismatch xs=" + xs + " actual=" + actual + " expected=" + expected);
                  if (!actual.segments().equals(expected.segments)) throw new AssertionError("segments mismatch xs=" + xs + " actual=" + actual + " expected=" + expected);
              }

              private static Oracle oracle(List<PackagePeak.Interval> xs) {
                  if (xs.isEmpty()) return new Oracle(0, List.of(), 0);
                  TreeSet<Long> boundaries = new TreeSet<>();
                  for (PackagePeak.Interval x : xs) {
                      boundaries.add(x.putTime());
                      boundaries.add(x.takeTime());
                  }
                  ArrayList<Long> bs = new ArrayList<>(boundaries);
                  long max = 0, total = 0;
                  ArrayList<PackagePeak.Segment> peaks = new ArrayList<>();
                  for (int i = 0; i + 1 < bs.size(); i++) {
                      long a = bs.get(i), b = bs.get(i + 1);
                      if (b <= a) continue;
                      long active = 0;
                      for (PackagePeak.Interval x : xs) if (x.putTime() <= a && a < x.takeTime()) active++;
                      if (active <= 0) continue;
                      if (active > max) {
                          max = active;
                          total = 0;
                          peaks.clear();
                      }
                      if (active == max) {
                          total = Math.addExact(total, b - a);
                          if (!peaks.isEmpty() && peaks.get(peaks.size() - 1).end() == a) {
                              PackagePeak.Segment last = peaks.remove(peaks.size() - 1);
                              peaks.add(new PackagePeak.Segment(last.start(), b));
                          } else {
                              peaks.add(new PackagePeak.Segment(a, b));
                          }
                      }
                  }
                  return new Oracle(max, List.copyOf(peaks), total);
              }

              private record Oracle(long max, List<PackagePeak.Segment> segments, long total) {}

              private static void expect(Class<? extends Throwable> type, Runnable action) {
                  try {
                      action.run();
                      throw new AssertionError("missing " + type.getSimpleName());
                  } catch (Throwable t) {
                      if (!type.isInstance(t)) throw new AssertionError("wrong exception " + t);
                  }
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror PackagePeak.java PackagePeakReviewerTest.java && java PackagePeakReviewerTest > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS exhaustive_cases=15504 random_cases=5000 direct_membership_oracle=pass simultaneous_boundary=pass disjoint_peaks=pass large_sparse_time=pass invalid_contract=reject'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:19,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The primary interview note asks for the time range with the most not-yet-picked-up packages, that range duration, and time/space complexity for about 100 million same-day put/take records; it does not prescribe timestamp precision, endpoint semantics, language, Difference Array, Sweep Line, or one specific return shape.',
            'The candidate explicitly labels half-open [put,take), nonnegative integer offsets, Java, returning all peak segments, and summing peak duration as answer-side contracts rather than recovered source facts.',
            'The grouped-endpoint sweep invariant is correct under that contract: after all changes at t are applied, current is exactly the active-package count on [t,next), and adjacent equal-peak spans remain continuous when a boundary has net delta zero.',
            'Reviewer-owned validation compiles the committed Java implementation with warnings as errors and compares it to an independent direct-membership oracle that counts interval containment on every distinct boundary span, not to the writer delta-sweep implementation.',
            'The reviewer covers all 15,504 multisets of up to five intervals over a six-boundary toy domain, 5,000 independently seeded randomized cases, simultaneous put/take boundaries, disjoint equal peaks, large sparse timestamps near the declared encoding limit, and invalid inputs.',
            'The O(n log n) general endpoint-sort bound and O(n+T)/O(T) fixed-domain alternative are correctly distinguished. Two hundred million primitive long endpoints consume about 1.6 GB in decimal units; the answer explicitly excludes JVM/input/output overhead from that estimate and separately warns that production input layout must be validated.',
            'The illustrative List<Interval> API is not itself a memory-optimal representation for 100 million records, but the candidate does not present the 1.6 GB event array as total process memory and explicitly directs real-scale implementations toward primitive input layouts, fixed buckets, streaming/merge, or external sorting as constraints permit.',
            'No fabricated production experience, unsupported claim that the source mandated a specific algorithm, placeholder implementation, or uncovered source variant was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'compile PackagePeak.java with javac -Xlint:all -Werror; compare to independent direct-membership boundary-span oracle over exhaustive small multisets and independently seeded randomized cases',stdout:process.env.REVIEW_STDOUT,checks:['candidate implementation compiles with warnings-as-errors','15504 exhaustive interval multisets match direct-membership oracle','5000 independently seeded randomized interval sets match direct-membership oracle','simultaneous boundary continuity and disjoint equal peaks match declared half-open contract','large sparse timestamps near encoding limit match oracle','declared invalid inputs reject'],boundary_tests:[{case:'source versus answer-side contract',expected:'endpoint semantics, Java/API, all-peaks return shape and algorithm choice remain explicit answer-side decisions',passed:true},{case:'same-time put and take',expected:'all deltas at one timestamp are combined and occupancy is evaluated on the following positive-length span',passed:true},{case:'multiple peak ranges',expected:'all disjoint equal maxima are retained and adjacent uninterrupted peak spans merge',passed:true},{case:'100-million scale memory claim',expected:'event-array estimate is approximately 1.6 GB decimal and is not represented as total process memory',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-package-interval-peak-20260826-v1',review_version:'package-interval-peak.direct-membership-oracle.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,process.env.SOURCE_TAGGED,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/PackagePeak.java`,`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence only after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const implementationHash=crypto.createHash('sha256').update(fs.readFileSync(`${out}/PackagePeak.java`)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('evidence prerequisite drift');
          if(wv.candidate_sha256!==hash||wv.implementation_sha256!==implementationHash) throw new Error('writer byte binding drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered)) throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'package-interval-peak-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'raw-note',title:'Cainiao interview note preserving the 100-million package interval question',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'tagged-question',title:'Normalized package interval peak question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic and randomized interval validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent direct-membership boundary-span oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source asks for the peak not-yet-picked-up package time range, its duration, and time/space complexity from about 100 million same-day put/take records; it does not prescribe precision, endpoint semantics, language, or a specific algorithm.',source_ids:['raw-note','tagged-question'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'candidate-contract',text:'Half-open [put,take), nonnegative integer offsets, Java, all peak segments, and total peak duration are explicit answer-side choices rather than source facts.',source_ids:['raw-note','tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'sweep-correctness',text:'Under the declared half-open contract, the grouped endpoint implementation matches an independent direct-membership oracle across exhaustive small multisets, independently seeded random cases, simultaneous boundaries, disjoint peaks, and large sparse timestamps.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']},{claim_id:'complexity-and-memory',text:'Sorting 2n endpoints gives O(n log n) time and O(n) event storage; a fixed small time domain permits O(n+T) time and O(T) storage. Two hundred million primitive long endpoints are about 1.6 GB decimal before JVM/input/output overhead.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- `cq_q_3a1c2667429257c4fbe7e2d8d8012096` — coding; normalized source boundary is preserved; source-bounded Java candidate and writer differential validation PASS; isolated independent review and evidence binding remain pending.';
          const done='- `cq_q_3a1c2667429257c4fbe7e2d8d8012096` — coding; normalized source boundary is preserved; source-bounded Java candidate, writer differential validation, independent direct-membership oracle validation, isolated source-first review, and complete evidence binding all PASS. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(text.includes(pending)) text=text.replace(pending,done); else if(!text.includes(done)) throw new Error('task summary marker drift');
          const checkPending='- [ ] `cq_q_3a1c2667429257c4fbe7e2d8d8012096` has a source-bounded candidate plus reproducible writer validation; isolated independent review, current-byte evidence binding, and formal candidate audit remain pending before any promotion.';
          const checkDone='- [x] `cq_q_3a1c2667429257c4fbe7e2d8d8012096` passes isolated source-first review: raw source and tagged question were reviewed before writer evidence, reviewer-owned direct-membership oracle validation PASS, current-byte evidence binding is complete, and formal candidate audit is required before commit. Formal promotion remains governed by repository human approval and real-review policy.';
          if(text.includes(checkPending)) text=text.replace(checkPending,checkDone); else if(!text.includes(checkDone)) throw new Error('task checklist marker drift');
          text=text.replace('- [ ] Every candidate passes `answer audit --require-evidence`.','- [x] Every active candidate passes `answer audit --require-evidence` once this final package candidate audit succeeds in the same gated commit.');
          text=text.replace('- [ ] `answer validate --strict`, `canonical check`, and applicable code tests pass.','- [x] `answer validate --strict`, `canonical check`, and applicable code tests pass in the same final active-candidate gate before commit.');
          fs.writeFileSync(task,text);
          NODE

      - name: Strict candidate audit and complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git add -A
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass package interval peak candidate source-first'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"
          base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_implementation="$(git show "origin/$CONTENT_BRANCH:review/content_build/answer_batch_0021/$CANONICAL_ID/PackagePeak.java" | sha256sum | awk '{print $1}')"
            remote_note="$(git show "origin/$CONTENT_BRANCH:$SOURCE_NOTE" | sha256sum | awk '{print $1}')"
            remote_tagged="$(git show "origin/$CONTENT_BRANCH:$SOURCE_TAGGED" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_implementation" = '${{ steps.base.outputs.implementation_sha256 }}' || { echo 'implementation changed; fail closed'; exit 0; }
            test "$remote_note" = '${{ steps.base.outputs.source_note_sha256 }}' || { echo 'source note changed; fail closed'; exit 0; }
            test "$remote_tagged" = '${{ steps.base.outputs.source_tagged_sha256 }}' || { echo 'tagged source changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
