name: Diagnose Content Batch 0039 useFetch Repository Gates

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/diagnose-content-batch-0039-usefetch-gates.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Question coverage
        run: node scripts/content/check_question_coverage.js --check
      - name: Canonical check
        run: node scripts/xhs.js canonical check --noWrite
      - name: Review integrity
        run: node scripts/xhs.js review integrity --noWrite
      - name: Answer type audit
        run: node scripts/xhs.js answer type-audit --check --noWrite
      - name: Strict answer validation
        run: node scripts/xhs.js answer validate --strict --noWrite
      - name: Validate all
        run: node scripts/xhs.js validate all --noWrite
      - name: Unit tests
        run: npm test
      - name: CI check
        run: npm run ci:check
      - name: Answer semantic gate
        run: npm run ci:answer:semantic
      - name: Answer evidence gate
        run: npm run ci:answer:evidence
      - name: Answer code gate
        run: npm run ci:answer:code
      - name: Answer coverage gate
        run: npm run ci:answer:coverage
