name: Reconcile Content Batch 0045 Container Water Duplicate

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/reconcile-content-batch-0045-container-most-water.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0045-container-water-reconcile
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_CID: cq_q_b537060b9176a759ceeeefa6fd13625f
  TARGET_QID: b537060b9176a759ceeeefa6fd13625f
  SOURCE_CID: cq_q_b93d1936b263eae6c64dca254aecc24c
  SOURCE_QID: b93d1936b263eae6c64dca254aecc24c

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source-first duplicate relation on current live state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0045
          node scripts/xhs.js answer context --canonical-id "$TARGET_CID" --noWrite > /tmp/target.json
          node scripts/xhs.js answer context --canonical-id "$SOURCE_CID" --noWrite > /tmp/source.json
          node <<'NODE'
          const fs=require('fs');
          const target=JSON.parse(fs.readFileSync('/tmp/target.json','utf8'));
          const source=JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const tc=process.env.TARGET_CID, sc=process.env.SOURCE_CID;
          const tq=process.env.TARGET_QID, sq=process.env.SOURCE_QID;
          if(!target.ok||target.canonical?.canonical_id!==tc) throw new Error('target context missing');
          if(!source.ok||source.canonical?.canonical_id!==sc) throw new Error('source context missing');
          if(target.answer_type!=='coding'||source.answer_type!=='coding') throw new Error('answer type mismatch');
          if(JSON.stringify(target.canonical.question_ids)!==JSON.stringify([tq])) throw new Error(`target ownership drifted: ${JSON.stringify(target.canonical.question_ids)}`);
          if(JSON.stringify(source.canonical.question_ids)!==JSON.stringify([sq])) throw new Error(`source ownership drifted: ${JSON.stringify(source.canonical.question_ids)}`);
          const targetQ=target.source_questions.find(q=>q.question_id===tq);
          const sourceQ=source.source_questions.find(q=>q.question_id===sq);
          const expectedTarget='算法：盛最多水的容器（Container With Most Water），双指针法逻辑分析。';
          const expectedSource='算法：盛水最多的容器';
          if(targetQ?.original_question!==expectedTarget) throw new Error(`target source drifted: ${targetQ?.original_question}`);
          if(sourceQ?.original_question!==expectedSource) throw new Error(`source wording drifted: ${sourceQ?.original_question}`);
          const targetEntities=new Set(targetQ.tech_entities||[]), sourceEntities=new Set(sourceQ.tech_entities||[]);
          if(!targetEntities.has('双指针')||!sourceEntities.has('双指针')) throw new Error('shared two-pointer entity evidence missing');
          if(!/Container With Most Water|盛最多水/.test(target.canonical.canonical_title||'')) throw new Error('target title no longer identifies container-water problem');
          if(!/盛水最多/.test(source.canonical.canonical_title||'')) throw new Error('source title no longer identifies container-water problem');
          const candidate='review/candidates/answers/'+tc+'.md';
          if(!fs.existsSync(candidate)) throw new Error('reviewed target candidate missing; do not merge into unreviewed target');
          const body=fs.readFileSync(candidate,'utf8');
          for(const token of ['min(height[l], height[r])','双指针','较短']) if(!body.includes(token)) throw new Error(`target candidate lost problem-specific token ${token}`);
          const record={
            schema_version:'canonical_relation_review.v1',
            reviewed_at:'2026-08-28',
            source_first:true,
            target_canonical_id:tc,
            source_canonical_id:sc,
            target_question_ids:[tq],
            source_question_ids:[sq],
            relation:'duplicate',
            decision:'merge_source_into_target',
            rationale:[
              'Both preserved Questions name the same maximum-water-container interview problem; the target additionally preserves the standard English name Container With Most Water.',
              'Both source records classify the task as coding and explicitly preserve the two-pointer technique/entity.',
              'The source wording is a shorter Chinese paraphrase and does not introduce a distinct input/output contract or variant.',
              'The target already has a source-bounded executable candidate and isolated review; merging ownership avoids producing a second answer for the same recoverable problem.'
            ],
            post_merge_requirement:'The target candidate evidence/review must be refreshed to cover both source Questions before any promotion; this relation decision alone is not promotion evidence.'
          };
          fs.writeFileSync('review/content_build/answer_batch_0045/container_water_relation_review.json',JSON.stringify(record,null,2)+'\n');
          NODE

      - name: Merge duplicate Canonical using repository transaction boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical merge \
            --target "$TARGET_CID" \
            --source "$SOURCE_CID" \
            --reason 'Batch 0045 source-first review: shorter 盛水最多的容器 source is duplicate of the existing Container With Most Water/two-pointer Canonical' \
            --noManifest > /tmp/merge.json
          node <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('/tmp/merge.json','utf8'));
          if(!r.ok) throw new Error(`canonical merge integrity failed: ${JSON.stringify(r.integrity||r)}`);
          if(r.target!==process.env.TARGET_CID||r.source!==process.env.SOURCE_CID) throw new Error('merge result identity drifted');
          if(JSON.stringify(r.moved_question_ids)!==JSON.stringify([process.env.SOURCE_QID])) throw new Error(`unexpected moved question scope: ${JSON.stringify(r.moved_question_ids)}`);
          NODE

      - name: Rebuild derived projections and verify merged reachability
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest
          node <<'NODE'
          const fs=require('fs');
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const target=canon.find(x=>x.canonical_id===process.env.TARGET_CID);
          const source=canon.find(x=>x.canonical_id===process.env.SOURCE_CID);
          if(!target) throw new Error('merged target missing');
          if(source) throw new Error('duplicate source canonical still active');
          const owned=[...(target.question_ids||[])].sort();
          const expected=[process.env.TARGET_QID,process.env.SOURCE_QID].sort();
          if(JSON.stringify(owned)!==JSON.stringify(expected)) throw new Error(`merged ownership wrong: ${JSON.stringify(owned)}`);
          for(const qid of expected){const q=qs.find(x=>x.question_id===qid);if(!q||q.canonical_id!==process.env.TARGET_CID||q.is_valid_for_library!==true)throw new Error(`${qid}: Question reachability not rebound to merged target`);}
          if(target.answer_status!=='needs_update') throw new Error(`merge must invalidate target answer until refreshed, got ${target.answer_status}`);
          NODE

      - name: Verify repository integrity gates for bounded normalization
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test

      - name: Record Batch 0045 normalization progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0045.md')
          t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b93d1936b263eae6c64dca254aecc24c` reconciled source-first as a duplicate of `cq_q_b537060b9176a759ceeeefa6fd13625f`: both preserved Questions are the same maximum-water-container coding problem and preserve the two-pointer technique; the shorter Batch 0045 Question is rebound into the already reviewed target Canonical instead of receiving a duplicate Answer. The transactional Canonical merge migrates ReviewProgress/ownership, archives the source baseline, and deliberately invalidates the target formal Answer until its candidate evidence/review is refreshed to cover both source Questions. Relation evidence is frozen in `review/content_build/answer_batch_0045/container_water_relation_review.json`.'
          if '## Progress' not in t:
              t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:
              t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during reconciliation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against the later current snapshot.'
            exit 0
          fi
          git rm .github/workflows/reconcile-content-batch-0045-container-most-water.yml
          git add -A
          if git diff --cached --quiet; then echo 'No reconciliation changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: merge duplicate batch 0045 container-water canonical'
          git push origin "HEAD:$CONTENT_BRANCH"
