name: Review Content Batch 0041 Spiral Matrix v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0041-spiral-matrix-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0041-spiral-matrix-review-v3
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_aa5412e581a46db5a2dbf3f5bc6262eb
  SOURCE_QID: aa5412e581a46db5a2dbf3f5bc6262eb

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first inspection before writer evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"
          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const structured=JSON.parse(fs.readFileSync('note_structured/681055de000000000900d6df.json','utf8'));
          if(!Array.isArray(structured.questions)||structured.questions[0]!=='算法：手撕螺旋矩阵（Spiral Matrix）。') throw new Error('spiral source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('ownership/type drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','顺时针螺旋遍历','参考契约','ragged matrix unsupported']) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md)) throw new Error('fabricated production claim risk');
          if(!md.includes('没有明确是“按螺旋顺序遍历矩阵”还是“生成螺旋矩阵”')) throw new Error('traversal-vs-generation ambiguity is not explicit');
          const block=md.match(/```go\n([\s\S]*?)```/); if(!block) throw new Error('candidate Go block missing');
          fs.writeFileSync('/tmp/spiral_candidate.go','package main\n\n'+block[1]);
          fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(fs.readFileSync(`review/candidates/answers/${cid}.md`)).digest('hex')+'\n');
          NODE

      - name: Execute independent direction-walk oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/spiral_reviewer_oracle.go <<'GO'
          package main
          import "fmt"
          func oracle(matrix [][]int) []int {
              if len(matrix)==0 || len(matrix[0])==0 { return []int{} }
              rows, cols := len(matrix), len(matrix[0])
              seen := make([][]bool, rows)
              for r:=0; r<rows; r++ { seen[r]=make([]bool,cols) }
              dr := []int{0,1,0,-1}; dc := []int{1,0,-1,0}; dir:=0; r,c:=0,0
              out:=make([]int,0,rows*cols)
              for step:=0; step<rows*cols; step++ {
                  out=append(out,matrix[r][c]); seen[r][c]=true
                  nr,nc:=r+dr[dir],c+dc[dir]
                  if nr<0||nr>=rows||nc<0||nc>=cols||seen[nr][nc] { dir=(dir+1)%4; nr,nc=r+dr[dir],c+dc[dir] }
                  r,c=nr,nc
              }
              return out
          }
          func equal(a,b []int) bool { if len(a)!=len(b){return false}; for i:=range a{if a[i]!=b[i]{return false}}; return true }
          func matrix(rows,cols int) [][]int { m:=make([][]int,rows); v:=1; for r:=0;r<rows;r++{m[r]=make([]int,cols); for c:=0;c<cols;c++{m[r][c]=v; v++}}; return m }
          func main(){
              if got:=spiralOrder([][]int{}); len(got)!=0 { panic("empty matrix must be empty") }
              checked:=0
              for rows:=1; rows<=6; rows++ { for cols:=1; cols<=6; cols++ { m:=matrix(rows,cols); got:=spiralOrder(m); want:=oracle(m); if !equal(got,want){panic(fmt.Sprintf("%dx%d got=%v want=%v",rows,cols,got,want))}; checked++ } }
              raggedPanicked:=false
              func(){ defer func(){ if recover()!=nil { raggedPanicked=true } }(); spiralOrder([][]int{{1,2},{3}}) }()
              if !raggedPanicked { panic("declared ragged contract must reject input") }
              fmt.Printf("PASS dimensions=%d independent-direction-oracle single-row-column square-rectangular ragged-rejected\n",checked)
          }
          GO
          stdout="$(cd /tmp && go run spiral_candidate.go spiral_reviewer_oracle.go)"
          test "$stdout" = 'PASS dimensions=36 independent-direction-oracle single-row-column square-rectangular ragged-rejected'
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and strict evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0041/$cid"; sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0041/${cid}`,sha=process.env.CANDIDATE_SHA;
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha) throw new Error('writer packet/hash drifted');
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/spiral_order_validation.json`,'utf8'));
          if(writerValidation.result!=='pass'||writerValidation.candidate_sha256!==sha) throw new Error('writer validation/hash drifted');
          const boundaryTests=[
            {case:'all dimensions 1x1..6x6',expected:'candidate equals independent direction-walk oracle',passed:true},
            {case:'single row/column',expected:'each element emitted once',passed:true},
            {case:'odd square center',expected:'center emitted once',passed:true},
            {case:'ragged input',expected:'declared reference contract rejects input',passed:true}
          ];
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'Repository source preserves only a Spiral Matrix hand-written problem; API, language, rectangular guarantee, and traversal-versus-generation semantics are not source-proven.',
            'Candidate labels clockwise traversal, Go, rectangular input, empty behavior, and ragged rejection as a reference contract rather than source facts.',
            'Four-boundary implementation protects the bottom and left passes after earlier boundary contraction.',
            'Independent direction-and-visited oracle matches all 36 dimensions from 1x1 through 6x6 and verifies declared ragged rejection.',
            'Answer explains the shrinking-rectangle invariant, O(m*n) time, O(1) auxiliary boundary state, ambiguity handling, and avoids fabricated production experience.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'extract candidate Go; go run spiral_candidate.go spiral_reviewer_oracle.go',stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests},null,2)+'\n');
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0041-spiral-matrix-20260827-v3',review_version:'batch-0041.spiral-matrix.v3',decision:'pass',revision_round:1,source_packet:['note_structured/681055de000000000900d6df.json','review/content_build/answer_batch_0041/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0041-spiral-matrix-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving Spiral Matrix wording',locator:'note_structured/681055de000000000900d6df.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0041 frozen source inventory',locator:'review/content_build/answer_batch_0041/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic Go spiral-order fixture',locator:`${out}/spiral_order_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent direction-walk Go oracle',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Spiral Matrix source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'Strongest repository source preserves only a Spiral Matrix hand-written problem; traversal-versus-generation, language, API, and input-shape guarantees are not source-proven.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-implementation',text:'Under the explicitly declared clockwise rectangular traversal contract, the Go implementation matches an independently written direction-walk oracle across 36 dimensions and rejects ragged input as declared.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'extract candidate Go; go run spiral_candidate.go spiral_reviewer_oracle.go',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit unique review artifacts with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/content_build/answer_batch_0041/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0041/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json"
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0041 spiral-matrix candidate source-first'
          for attempt in 1 2 3; do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH"; then
              git rebase --abort || true
              echo 'Content branch changed on the same review artifacts; fail closed.' >&2
              exit 1
            fi
            if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            sleep 5
          done
          echo 'Unable to push review artifacts after safe retries.' >&2
          exit 1
