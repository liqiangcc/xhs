name: Execute Canonical Boundary Merge Batch 001

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .boundary-merge-batch-001-trigger

permissions:
  contents: write

jobs:
  merge:
    if: "${{ github.event.head_commit.message == 'chore: execute canonical boundary merge batch 001' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Freeze pre-merge state
        shell: bash
        run: |
          set -euo pipefail
          out=review/content_build/canonical_boundary_review/batch_001
          node scripts/xhs.js canonical stats > "$out/canonical-stats-before-merges.json"
          cp data/manifests/quality/answer_pilot_set.json "$out/answer-pilot-set-before-merges.json"

      - name: Execute reviewed merges through Canonical Application
        shell: bash
        run: |
          set -euo pipefail
          out=review/content_build/canonical_boundary_review/batch_001/merge_results
          mkdir -p "$out"

          node scripts/xhs.js canonical merge \
            --target cq_q_ff67c5194b913ce1ab318f3020d31170 \
            --source cq_q_0165356d4f703eea4990e5bdda333d92 \
            --reason 'Boundary review batch 001: same synchronized lock-escalation mechanism; JOL is validation detail.' \
            > "$out/01-synchronized-lock-upgrade.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_d3fea003c007b50735b8e695473de9ac \
            --source cq_q_04d79b4f1d5942b0cb976a988536a3b2 \
            --reason 'Boundary review batch 001: equivalent CMS versus G1 collector comparison.' \
            > "$out/02-cms-g1-comparison.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_1c4c8e00ef1bbd647ba9a00ab1dd4b45 \
            --source cq_q_48206d6b985dc40c4ac6c4a417dc03c6 \
            --reason 'Boundary review batch 001: equivalent Redis memory eviction-policy enumeration.' \
            > "$out/03-redis-eviction-policy.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_d3fea003c007b50735b8e695473de9ac \
            --source cq_q_0866c4b58bd2fb97cb4b5379e767d035 \
            --reason 'Boundary review batch 001: CMS/G1 selection conditions are part of the same comparison answer boundary.' \
            > "$out/04-cms-g1-selection.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_60fb9ee432ae20f1a97138c93598c22f \
            --source cq_q_dcb9a48657af9b70e0f87735009a1cde \
            --reason 'Boundary review batch 001: same equals/hashCode override contract; cautions are supporting detail.' \
            > "$out/05-equals-hashcode.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_46b80bbf2441759405c81fa0ceb5bec6 \
            --source cq_q_0ea2107893f23ca0d6ccfde82fe0d190 \
            --reason 'Boundary review batch 001: same final/finally/finalize comparison; usage is supporting detail.' \
            > "$out/06-final-finally-finalize.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_ae1651ba6576c28fcd53d4f4888dbd3e \
            --source cq_q_13d712dbbbe982e220bc87d74737abcd \
            --reason 'Boundary review batch 001: equivalent String/StringBuffer/StringBuilder comparison.' \
            > "$out/07-string-family-a.json"

          node scripts/xhs.js canonical merge \
            --target cq_q_ae1651ba6576c28fcd53d4f4888dbd3e \
            --source cq_q_1bb63b161281368c9e9095fa9bed3b90 \
            --reason 'Boundary review batch 001: equivalent String/StringBuffer/StringBuilder comparison.' \
            > "$out/08-string-family-b.json"

      - name: Regenerate all merge-sensitive quality state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_answer_types.js
          node scripts/content/build_answer_rewrite_queue.js
          node scripts/content/select_answer_pilot.js
          node scripts/content/build_pilot_answer_audit.js
          node scripts/content/build_pilot_human_review_plan.js
          node scripts/content/audit_canonical_boundaries.js

      - name: Verify post-merge invariants
        shell: bash
        run: |
          set -euo pipefail
          out=review/content_build/canonical_boundary_review/batch_001
          node scripts/xhs.js canonical stats > "$out/canonical-stats-after-merges.json"
          node scripts/xhs.js canonical check --noWrite > "$out/canonical-check-after-merges.json"
          node scripts/xhs.js answer reachability --full --noWrite > "$out/reachability-after-merges.json" || true
          node - <<'NODE'
          const fs = require('fs');
          const after = JSON.parse(fs.readFileSync('review/content_build/canonical_boundary_review/batch_001/canonical-stats-after-merges.json', 'utf8'));
          if (after.canonical_count !== 9026) {
            throw new Error(`expected canonical_count=9026 after 8 reviewed merges, got ${after.canonical_count}`);
          }
          const removed = [
            'cq_q_0165356d4f703eea4990e5bdda333d92',
            'cq_q_04d79b4f1d5942b0cb976a988536a3b2',
            'cq_q_48206d6b985dc40c4ac6c4a417dc03c6',
            'cq_q_0866c4b58bd2fb97cb4b5379e767d035',
            'cq_q_dcb9a48657af9b70e0f87735009a1cde',
            'cq_q_0ea2107893f23ca0d6ccfde82fe0d190',
            'cq_q_13d712dbbbe982e220bc87d74737abcd',
            'cq_q_1bb63b161281368c9e9095fa9bed3b90',
          ];
          const canonicalRows = fs.readFileSync('data/questions/canonical_questions.jsonl', 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const ids = new Set(canonicalRows.map((row) => row.canonical_id));
          for (const id of removed) if (ids.has(id)) throw new Error(`source canonical still present: ${id}`);
          for (const source of removed) {
            const archive = `review/answers/_archive/${source}.md`;
            if (!fs.existsSync(archive)) throw new Error(`source answer archive missing: ${archive}`);
          }
          NODE

      - name: Verify generated state and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_answer_types.js --check
          node scripts/content/build_answer_rewrite_queue.js --check
          node scripts/content/select_answer_pilot.js --check
          node scripts/content/build_pilot_answer_audit.js --check
          node scripts/content/build_pilot_human_review_plan.js --check
          node scripts/content/audit_canonical_boundaries.js --check
          node scripts/xhs.js answer queue check --set data/manifests/quality/answer_pilot_set.json --noWrite
          npm test
          npm run ci:check

      - name: Record post-merge boundary state
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('data/manifests/canonical/long_tail_duplicate_candidates.jsonl', 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const report = {
            schema_version: 'canonical_boundary_batch_merge_summary.v1',
            batch_id: 'batch_001',
            merge_count: 8,
            remaining_candidate_count: rows.length,
            remaining_pending_count: rows.filter((row) => row.reviewer_decision === 'pending').length,
            reviewed_keep_separate_count: rows.filter((row) => row.reviewer_decision === 'keep_separate').length,
          };
          fs.writeFileSync('review/content_build/canonical_boundary_review/batch_001/post_merge_summary.json', `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Commit reviewed Canonical merges
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "content: apply canonical boundary merge batch 001"

      - name: Remove temporary merge workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .boundary-merge-batch-001-trigger .github/workflows/execute-boundary-merge-batch-001.yml
          git add -A
          git commit -m "chore: remove canonical boundary merge batch 001 workflow"

      - name: Push merged content state
        shell: bash
        run: git push origin HEAD:content/quality-completion
