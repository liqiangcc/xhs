          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({
            schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,
            review_state:'writer_complete_isolated_review_pending',
            sources:[
              {source_id:'explicit-repository-source',title:'Exact Daily Temperatures interview source wording',locator:`note_tagged/68be8049000000001c03cc9a.json#question_id=${explicit}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'shorthand-repository-source',title:'Consolidated temperature monotonic-stack shorthand source',locator:`note_tagged/680e66cb0000000023012aa3.json#question_id=${shorthand}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'relation-review',title:'Source-first same-relation review for the two temperature Questions',locator:'review/content_build/answer_batch_0036/temperature_relation_review.md',source_type:'repository_structured_source',checked_at:date},
              {source_id:'validation',title:'Fresh monotonic-stack versus quadratic next-warmer oracle',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The surviving Canonical owns the explicit Daily Temperatures wording plus the source-near shorthand “温度 (单调栈)”; full function signature and numeric constraints are not preserved.',source_ids:['explicit-repository-source','shorthand-repository-source','relation-review'],answer_locations:['核心结论','3 分钟版','关键细节']},
              {claim_id:'monotonic-stack-correctness',text:'Under the explicitly adopted next strictly-warmer distance contract, the index monotonic-stack implementation exactly matches an independent quadratic oracle on fixed boundaries and 5000 deterministic randomized arrays.',source_ids:['validation'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']},
              {claim_id:'strict-greater-boundary',text:'Equal temperatures must not close a waiting position under the adopted strictly-warmer contract; dedicated duplicate-value tests distinguish > from >=.',source_ids:['validation'],answer_locations:['1 分钟版','关键细节','常见追问','易错点']}
            ],
            source_question_coverage:[
              {question_id:explicit,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']},
              {question_id:shorthand,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']}
            ],
            promotion_blocker:'isolated_independent_review_not_yet_performed'
          },null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_870fc85ff34de337bdcf1e05799217ca` Daily Temperatures survivor now has a source-bounded candidate covering both consolidated source Questions, an explicit next-strictly-warmer distance contract, complete Java index-monotonic-stack implementation, fixed boundary tests, and 5000 deterministic randomized arrays checked against an independent quadratic oracle. Writer research is frozen; isolated source-first review remains pending before promotion.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Writer-stage repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
