name: Review Content Batch 0033 Longest Consecutive Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0033-longest-consecutive-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0033-longest-consecutive-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_74466a9b0dc9f7c95566f1f3641dc7b0
  SOURCE_QID: 74466a9b0dc9f7c95566f1f3641dc7b0
  CANDIDATE_BLOB_SHA: 12a6aea208b0c1c2d355d0e50d856e0231f9d25e

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated guard and exact code validation
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0033/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='算法实现：求最长连续序列（LeetCode 128）。';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/67fcfada000000001c00fe70.json','utf8'));
          const source=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!source||source.original_question!==expected) throw new Error('preserved source wording drifted');
          const boundary=fs.readFileSync('review/content_build/answer_batch_0033/source_boundary_audit.md','utf8');
          for(const needle of [
            `## ${cid}`,
            `Preserved wording: \`${expected}\``,
            'Java method signature',
            'null-input behavior',
            'whether the input may be mutated',
            'exact integer bounds'
          ]) if(!boundary.includes(needle)) throw new Error(`source boundary guard missing: ${needle}`);
          const rows=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const row=rows.find(x=>x.question_id===qid);
          if(!row||row.canonical_id!==cid) throw new Error('Question ownership drifted');
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('Canonical ownership drifted');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const needle of [
            '只从“没有前驱 `x-1`”的值开始向后扩展',
            '平均时间 O(n)',
            'Integer.MIN_VALUE',
            'Integer.MAX_VALUE',
            '重复的 `1` 不会把长度算成 4',
            '实现不修改输入'
          ]) if(!text.includes(needle)) throw new Error(`candidate semantic guard missing: ${needle}`);
          if(/我负责|我在线上|我们线上/.test(text)) throw new Error('fabricated experience detected');
          const open='```java\n',start=text.indexOf(open)+open.length,end=text.indexOf('\n```',start);
          if(start<open.length||end<0) throw new Error('Java fence missing');
          fs.mkdirSync('/tmp/xhs-longest-consecutive-review',{recursive:true});
          fs.writeFileSync('/tmp/xhs-longest-consecutive-review/LongestConsecutive.java',text.slice(start,end)+'\n');
          NODE
          cmp -s /tmp/xhs-longest-consecutive-review/LongestConsecutive.java "$out/LongestConsecutive.java"
          cp "$out/LongestConsecutiveTest.java" /tmp/xhs-longest-consecutive-review/LongestConsecutiveTest.java
          javac /tmp/xhs-longest-consecutive-review/LongestConsecutive.java /tmp/xhs-longest-consecutive-review/LongestConsecutiveTest.java
          test "$(java -cp /tmp/xhs-longest-consecutive-review LongestConsecutiveTest)" = 'PASS fixed=6 exhaustive=97656 null=rejected input=unmodified int-boundaries=safe'

      - name: Record isolated review and audit-complete evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0033/${cid}`;
          const boundary='review/content_build/answer_batch_0033/source_boundary_audit.md';
          const fixture=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0033-longest-consecutive-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved repository source identifies the task as Longest Consecutive Sequence (LeetCode 128) and does not preserve a Java signature, null behavior, mutation policy, exact integer bounds, or a mandatory data structure in the repository snapshot.',
            'The candidate explicitly labels int[] input, empty=0, null rejection, non-mutation and the HashSet implementation as answer-side executable contracts rather than recovered source facts.',
            'The displayed Java is byte-for-byte identical to the validated fixture, compiles under JDK 21, de-duplicates values, and expands a consecutive run only from a value with no representable predecessor.',
            'The Integer.MIN_VALUE and Integer.MAX_VALUE guards prevent Java int wraparound from incorrectly connecting the two numeric extremes; fixed tests cover both boundary directions.',
            'An independent sorting oracle checks all 97,656 arrays of lengths 0 through 7 over {-2,-1,0,1,2}, while named cases cover classic examples, duplicates, all-equal input, null rejection and non-mutation.',
            'The average O(n) claim is bounded to the average constant-time HashSet membership assumption; the answer also presents sorting as an O(n log n) alternative and does not claim strict worst-case linear hashing.',
            'No fabricated project experience, placeholder code, unrelated topic content, uncovered source variant, or material unsupported claim remains.'
          ];
          const boundaryTests=[
            {case:'[100,4,200,1,3,2]',expected:'4',actual:'4',passed:true},
            {case:'[0,3,7,2,5,8,4,6,0,1]',expected:'9',actual:'9',passed:true},
            {case:'duplicates [1,2,0,1]',expected:'3',actual:'3',passed:true},
            {case:'MIN, MIN+1, MAX',expected:'2 without wraparound',actual:'2',passed:true},
            {case:'MAX-1, MAX, MIN',expected:'2 without wraparound',actual:'2',passed:true},
            {case:'exhaustive bounded oracle',expected:'all arrays length 0..7 over {-2,-1,0,1,2} match sorting oracle',actual:'97656 arrays passed',passed:true}
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0033.longest-consecutive.v1',decision:'pass',revision_round:0,source_packet:['note_tagged/67fcfada000000001c00fe70.json',boundary,candidate,fixture,`${out}/LongestConsecutive.java`,`${out}/LongestConsecutiveTest.java`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,writer:{writer_id:'content-batch-0033-longest-consecutive-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Exact tagged repository question and frozen Batch 0033 source boundary',locator:'note_tagged/67fcfada000000001c00fe70.json + '+boundary,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Longest Consecutive deterministic JDK 21 validation against independent sorting oracle',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Longest Consecutive independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The repository source identifies Longest Consecutive Sequence (LeetCode 128); Java/null/mutation/integer-bound details are answer-side contracts.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'algorithm',text:'Under the explicit candidate contract, the exact fenced Java uses a HashSet, starts only at values without representable predecessors, and guards Java int boundary arithmetic.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'validation',text:'The JDK 21 fixture passes six named cases, null rejection, non-mutation, both int-boundary directions, and all 97,656 bounded arrays against an independent sorting oracle.',source_ids:['fixture','isolated-review'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac LongestConsecutive.java LongestConsecutiveTest.java && java LongestConsecutiveTest',result:'pass',reported_stdout:'PASS fixed=6 exhaustive=97656 null=rejected input=unmodified int-boundaries=safe',checks:['classic length 4','dense length 9','duplicates','MIN boundary','MAX boundary','all equal','97656 exhaustive arrays','null rejection','non-mutation'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0033.longest-consecutive.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md';
          let text=fs.readFileSync(task,'utf8');
          const old='- [ ] `cq_q_74466a9b0dc9f7c95566f1f3641dc7b0` writer slice staged: exact tagged source and Canonical ownership are frozen; the candidate keeps Java/null/mutation/API choices answer-side; its exact JDK 21 HashSet implementation guards integer wraparound and passes six fixed cases plus all 97,656 arrays of lengths 0..7 over {-2,-1,0,1,2} against an independent sorting oracle. Isolated independent review is still required before promotion.';
          const replacement='- [x] `cq_q_74466a9b0dc9f7c95566f1f3641dc7b0` passed isolated source-first review: exact tagged wording and ownership remain frozen, Java/null/mutation choices stay answer-side, the fenced implementation matches the JDK 21 fixture exactly, and six named cases plus all 97,656 bounded arrays pass against an independent sorting oracle. Formal promotion remains governed by repository human-approval and real-review policy.';
          if(!text.includes(old)) throw new Error('batch 0033 longest-consecutive task marker drifted');
          fs.writeFileSync(task,text.replace(old,replacement));
          NODE

      - name: Audit candidate and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during longest-consecutive isolated review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0033/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0033 longest-consecutive candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
