name: Build Content Batch 0034 Max Version Candidate V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0034-max-version-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-max-version-writer-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7ca6615c45d3aeb785c27dc7796d1afb
  SOURCE_QID: 7ca6615c45d3aeb785c27dc7796d1afb
  SOURCE_NOTE: note_tagged/6888685a0000000005008900.json
  SOURCE_IMAGE_TEXT: note_img_txt/6888685a0000000005008900.txt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze repository and official problem boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0034/$CANONICAL_ID"; mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='算法：最大版本号 (165. 比较版本号)';
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_NOTE,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!q||q.original_question!==expected||q.question_type!=='算法手撕_Coding') throw new Error('tagged source drifted');
          const raw=fs.readFileSync(process.env.SOURCE_IMAGE_TEXT,'utf8');
          for(const token of ['手撕：最大版本号','165. 比较版本号','输入多个版本号进行比较']) if(!raw.includes(token)) throw new Error(`strong source detail missing: ${token}`);
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0034/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('canonical context/type drifted');
          const library=(ctx.source_questions||[]).find(x=>x.original_question===expected);
          if(!library||!ctx.canonical?.question_ids?.includes(library.question_id)) throw new Error('Question -> Canonical reachability drifted');
          if(fs.existsSync(`review/candidates/answers/${cid}.md`)) throw new Error('candidate already exists; refuse overwrite');
          fs.writeFileSync(path.join(`review/content_build/answer_batch_0034/${cid}`,'source_mapping.json'),JSON.stringify({schema_version:'answer_source_mapping.v1',canonical_id:cid,library_question_id:library.question_id,note_question_id:qid,note_path:process.env.SOURCE_NOTE,image_text_path:process.env.SOURCE_IMAGE_TEXT,original_question:expected,strong_source_detail:'面试的时候是输入多个版本号进行比较',official_problem:{id:165,title:'Compare Version Numbers',locator:'https://leetcode.com/problems/compare-version-numbers/'},verified_at:'2026-08-26'},null,2)+'\n');
          const boundary='review/content_build/answer_batch_0034/source_boundary_audit.md'; let text=fs.existsSync(boundary)?fs.readFileSync(boundary,'utf8'):'# Answer Batch 0034 Source Boundary Audit\n'; const h=`## ${cid}`;
          if(!text.includes(h)) text += `\n${h}\n\n- Exact tagged source: \`${process.env.SOURCE_NOTE}\`, question \`${qid}\`: \`${expected}\`.\n- Stronger repository image text: \`${process.env.SOURCE_IMAGE_TEXT}\` explicitly says the interview variant supplied multiple version numbers to compare.\n- The source identifies LeetCode 165, so the pairwise revision semantics are recoverable from the official problem: dot-separated numeric revisions, leading zeros ignored, missing revisions treated as zero.\n- Answer-side adapter: linearly reduce multiple versions with the LeetCode-165 comparator; semantically equal versions retain the first original representation.\n- The repository does not preserve concrete ACM stdin/stdout layout or tie-representation rules; those remain explicit adapter choices.\n- Promotion remains blocked until isolated review, evidence gate, required human approval, and real-review policy are satisfied.\n`;
          fs.writeFileSync(boundary,text);
          NODE

      - name: Write source-bounded max-version candidate
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          cat > "review/candidates/answers/$cid.md" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_7ca6615c45d3aeb785c27dc7796d1afb","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # 最大版本号：基于 LeetCode 165 比较多个版本字符串

          ## 核心结论

          仓库更强来源明确写了“最大版本号（165. 比较版本号）”，并补充“面试的时候是输入多个版本号进行比较”。所以先实现 LeetCode 165 的两版本比较语义：按 `.` 分隔的 revision 从左到右比较、忽略前导零、缺失 revision 当 0；再对多个版本做一次线性扫描保留最大值。来源没有保存 ACM 的具体输入行格式，也没有规定语义相等的不同字符串表示返回哪一个；下面显式约定输入为非空 `List<String>`，相等时保留首次出现的原字符串。

          ## 1 分钟版

          - 版本号不能当浮点数；`1.10 > 1.2`，因为第二个 revision 是 10 和 2。
          - 两个版本同步取下一段；去掉段内前导零后，先比较有效数字长度，长度相同再逐字符比较，等价于比较非负整数且无需转整型 API。
          - 一边 revision 用完时按 0 处理，所以 `1.0 = 1.0.0`。
          - 多版本求最大：从第一个开始，只有 `compareVersion(current,best)>0` 才替换；语义相等保留第一个原字符串。
          - 总字符量为 L 时整体扫描 O(L)，除少量下标外额外空间 O(1)。

          ## 3 分钟版

          ```java
          import java.util.List;

          public final class MaxVersion {
              public static String maxVersion(List<String> versions) {
                  if (versions == null || versions.isEmpty()) {
                      throw new IllegalArgumentException("versions must not be empty");
                  }
                  String best = requireValid(versions.get(0));
                  for (int i = 1; i < versions.size(); i++) {
                      String current = requireValid(versions.get(i));
                      if (compareVersion(current, best) > 0) {
                          best = current;
                      }
                  }
                  return best;
              }

              public static int compareVersion(String a, String b) {
                  requireValid(a);
                  requireValid(b);
                  int i = 0, j = 0;
                  while (i < a.length() || j < b.length()) {
                      int aEnd = nextDot(a, i);
                      int bEnd = nextDot(b, j);
                      int cmp = compareRevision(a, i, aEnd, b, j, bEnd);
                      if (cmp != 0) return cmp;
                      i = aEnd < a.length() ? aEnd + 1 : a.length();
                      j = bEnd < b.length() ? bEnd + 1 : b.length();
                  }
                  return 0;
              }

              private static int nextDot(String s, int start) {
                  if (start >= s.length()) return s.length();
                  int p = start;
                  while (p < s.length() && s.charAt(p) != '.') p++;
                  return p;
              }

              private static int compareRevision(
                      String a, int aStart, int aEnd,
                      String b, int bStart, int bEnd) {
                  while (aStart < aEnd && a.charAt(aStart) == '0') aStart++;
                  while (bStart < bEnd && b.charAt(bStart) == '0') bStart++;
                  int aLen = aEnd - aStart;
                  int bLen = bEnd - bStart;
                  if (aLen != bLen) return Integer.compare(aLen, bLen);
                  for (int k = 0; k < aLen; k++) {
                      char x = a.charAt(aStart + k), y = b.charAt(bStart + k);
                      if (x != y) return Character.compare(x, y);
                  }
                  return 0;
              }

              private static String requireValid(String s) {
                  if (s == null || s.isEmpty() || s.charAt(0) == '.' || s.charAt(s.length() - 1) == '.') {
                      throw new IllegalArgumentException("invalid version");
                  }
                  boolean needDigit = true;
                  for (int i = 0; i < s.length(); i++) {
                      char ch = s.charAt(i);
                      if (ch == '.') {
                          if (needDigit) throw new IllegalArgumentException("invalid version");
                          needDigit = true;
                      } else if (ch >= '0' && ch <= '9') {
                          needDigit = false;
                      } else {
                          throw new IllegalArgumentException("invalid version");
                      }
                  }
                  if (needDigit) throw new IllegalArgumentException("invalid version");
                  return s;
              }
          }
          ```

          例如输入 `['1.0.9','1.01.0','1.0.10','1.0.10.0']`。`1.01.0` 的 revisions 是 `[1,1,0]`，它大于 `1.0.10` 的 `[1,0,10]`，所以最大值是 `1.01.0`。另一个 tie 例子 `['2.0','2.0.0']` 在 LeetCode 165 语义下相等，因此按本答案适配约定返回首次出现的 `2.0`。

          ## 关键细节

          - **前导零**：`1.01` 与 `1.001` 的第二段都代表 1，应相等。
          - **缺失段为 0**：`1.0`、`1.0.0`、`1.0.0.0` 语义相等。
          - **不能用浮点数**：版本是 revision 序列，不是十进制小数。
          - **避免整数解析依赖**：官方 165 当前约束允许 revision 放进 32 位整数，但去零后按长度+字典序比较同样符合其非负整数语义，并能避免扩展输入的解析溢出。
          - **多版本适配**：官方 165 是二元比较；“输入多个版本号”由仓库截图明确保存，因此用同一 comparator 线性归约。
          - **相等代表**：题源没有说明语义相等时返回哪个原始表示；“保留第一个”是答案侧适配契约。
          - **ACM 格式**：截图只保存“ACM 不熟”，未保存 stdin/stdout 格式，所以不虚构 `n`、空格或换行布局。

          ## 原理机制

          单个 revision 去掉前导零后，位数更多的非负十进制整数一定更大；位数相同时逐字符字典序与数值顺序一致。因此无需构造整数也能实现 LeetCode 165 的 revision 比较。整个版本按 revision 序列从左到右比较，第一个不同段决定结果；尾部缺失段补 0。多个版本求最大就是在这个比较器上做 fold：维护 `best`，新值严格更大才替换，因此结束时 `best` 不小于所有已扫描版本。

          ## 项目经验版

          来源没有真实版本治理系统或线上事故数据，不能虚构项目经历。工程里还要区分这种纯数字点分版本与 SemVer；SemVer 有 prerelease、build metadata 等不同规则，不能直接复用 LeetCode 165 comparator，应按真实规范选择解析器并做规范样例测试。

          ## 常见追问

          - 问：为什么 `1.10 > 1.2`？答：第二个 revision 是整数 10 与 2，不是小数位。
          - 问：`1.01` 与 `1.001` 呢？答：忽略前导零，两个 revision 都是 1，所以相等。
          - 问：`1.0` 与 `1.0.0` 呢？答：缺失 revision 按 0 处理，因此相等。
          - 问：为什么不用 `Integer.parseInt`？答：官方约束下可以；这里用长度+字典序直接比较非负整数段，少依赖一个转换 API，也避免扩展输入溢出。
          - 问：多个版本怎么求最大？答：用同一个 pairwise comparator 线性扫描，严格更大才更新当前最大。

          ## 易错点

          - 把版本号当 `double`。
          - 直接按原字符串字典序比较。
          - 忽略前导零或缺失 revision 视为 0。
          - 为了“多个输入”虚构没有保存的 ACM 输入格式。
          - 把 LeetCode 165 规则误当成完整 SemVer 规则。
          EOF

          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const m=md.match(/```java\n([\s\S]*?)\n```/); if(!m) throw new Error('Java fence missing');
          fs.writeFileSync(`review/content_build/answer_batch_0034/${cid}/MaxVersion.java`,m[1].trim()+'\n');
          NODE
          cat > "$out/MaxVersionTest.java" <<'JAVA'
          import java.util.List;
          public final class MaxVersionTest {
              static void eq(Object a,Object b,String n){if(!a.equals(b))throw new AssertionError(n+" expected="+b+" actual="+a);}
              static void cmp(String a,String b,int sign){int x=Integer.signum(MaxVersion.compareVersion(a,b));if(x!=sign)throw new AssertionError(a+" vs "+b+" got "+x);}
              static void bad(String s){try{MaxVersion.compareVersion(s,"1");throw new AssertionError("expected invalid "+s);}catch(IllegalArgumentException ok){}}
              public static void main(String[] args){
                  cmp("1.2","1.10",-1); cmp("1.01","1.001",0); cmp("1.0","1.0.0.0",0); cmp("0.1","1.1",-1); cmp("1.0.1","1",1);
                  cmp("2147483647.0000000000000000000000000001","2147483647.1",0);
                  eq(MaxVersion.maxVersion(List.of("1.0.9","1.01.0","1.0.10","1.0.10.0")),"1.01.0","multiple max");
                  eq(MaxVersion.maxVersion(List.of("2.0","2.0.0","1.999")),"2.0","equal-first");
                  bad("1..0"); bad(".1"); bad("1."); bad("1.a");
                  System.out.println("PASS lc165 examples leading-zero missing-zero long-revision multiple-input first-equal invalid-input");
              }
          }
          JAVA

      - name: Execute validation and freeze writer evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          pushd "$out" >/dev/null; javac MaxVersion.java MaxVersionTest.java; stdout="$(java MaxVersionTest)"; popd >/dev/null
          test "$stdout" = 'PASS lc165 examples leading-zero missing-zero long-revision multiple-input first-equal invalid-input'
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`; const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          fs.writeFileSync(path.join(out,'code_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:'2026-08-26',command:'javac MaxVersion.java MaxVersionTest.java && java MaxVersionTest',stdout:process.env.STDOUT,checks:['LeetCode 165 examples','leading-zero semantics','missing revisions as zero','long revision digit comparison','multiple-version reduction','first representative on semantic equality','malformed input rejection']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-26',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-tagged',title:'Tagged repository source naming LeetCode 165',locator:mapping.note_path,source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'repository-image-text',title:'Stronger repository image text preserving multiple-version interview variant',locator:mapping.image_text_path,source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'leetcode-165',title:'LeetCode 165 Compare Version Numbers',locator:'https://leetcode.com/problems/compare-version-numbers/',source_type:'official_documentation',checked_at:'2026-08-26'},{source_id:'fixture',title:'Deterministic JDK 21 max-version validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-26'}],claims:[{claim_id:'repository-boundary',text:'Repository source explicitly identifies LeetCode 165 and stronger image text preserves the multiple-version interview variant.',source_ids:['repository-tagged','repository-image-text'],answer_locations:['核心结论','关键细节']},{claim_id:'official-contract',text:'LeetCode 165 compares dot-separated numeric revisions left-to-right, ignores leading zeros, and treats missing revisions as zero.',source_ids:['leetcode-165'],answer_locations:['核心结论','1 分钟版','关键细节','常见追问']},{claim_id:'adapter-validation',text:'The exact Java fixture validates pairwise 165 semantics plus the explicit multiple-version first-equal-representative adapter.',source_ids:['fixture'],answer_locations:['3 分钟版','原理机制','常见追问']}],source_question_coverage:[{question_id:mapping.library_question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8'); const p='- Max-version/LeetCode-165 canonical `'+cid+'` has a source-bounded multiple-input adapter, official-contract evidence, deterministic JDK 21 validation, and writer evidence; isolated review and promotion gates remain pending.'; if(!t.includes(p)) t += (t.includes('## Progress')?'\n':'\n## Progress\n\n')+p+'\n'; fs.writeFileSync(task,t);
