name: AQS Rereview Regression

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .content-readiness-audit-trigger

permissions:
  contents: read

jobs:
  verify-aqs-rereview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit revised AQS candidate and independent rereview
        shell: bash
        run: |
          node <<'NODE'
          const path = require('path');
          const { auditOneCandidate } = require('./scripts/lib/answer_quality');
          const candidate = path.join(process.cwd(), 'review', 'candidates', 'answers', 'cq_aqs_f718305c.md');
          const row = auditOneCandidate(candidate, { root: process.cwd(), noWrite: true });
          console.log(JSON.stringify(row, null, 2));
          if (row.candidate_sha256 !== '725393967217173a0ee0bfed840eb84cb08cd8b5f4c121d295fd885023ed404b') {
            throw new Error(`unexpected AQS candidate hash: ${row.candidate_sha256}`);
          }
          if (!row.ok) {
            throw new Error(`AQS candidate/rereview audit failed: ${JSON.stringify({ hard_failures: row.hard_failures, errors: row.errors })}`);
          }
          if (row.total_score < 90) throw new Error(`AQS rereview score below promotion threshold: ${row.total_score}`);
          if ((row.hard_failures || []).length) throw new Error(`unexpected AQS hard failures: ${row.hard_failures.join(',')}`);
          console.log(JSON.stringify({
            aqs_source_first_rereview_passed: true,
            candidate_sha256: row.candidate_sha256,
            total_score: row.total_score,
          }));
          NODE
