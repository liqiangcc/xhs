          boundary=[{'case':'official examples','expected':'IceCreAm→AceCreIm; leetcode→leotcede','actual':'pass','passed':True},{'case':'uppercase/lowercase plus non-vowels','expected':'only vowel positions change','actual':'pass','passed':True},{'case':'5000 deterministic randomized strings','expected':'independent oracle equality','actual':'pass','passed':True}]
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'content-batch-0046-reverse-vowels-builder-v2','writer_version':'xhs-answer-curator.v1'},'sources':sources,'claims':claims,'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','项目经验版','常见追问','易错点']}],'validation':{'command':validation['command'],'result':'pass','reported_stdout':stdout,'checks':validation['checks'],'boundary_tests':boundary},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings},'promotion_blocker':'repository_human_approval_and_real_review_policy_not_yet_satisfied'};pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0046.md');text=task.read_text();line='- [x] `cq_q_bfcc770bed44745c89171a30433df36a` now has a source-exact LeetCode 345 reverse-vowels Java candidate. The two-pointer implementation preserves non-vowel positions, handles upper/lower-case vowels, and matches an independent oracle across fixed cases plus 5000 deterministic randomized inputs. Isolated source-first review PASSes; formal promotion remains blocked by repository human-approval/real-review policy.'
          if '## Progress' not in text:text=text.rstrip()+'\n\n## Progress\n'
          if line not in text:text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY
      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage
      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH";remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")";base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ];then echo "Content branch advanced: $base_head -> $remote_head";exit 0;fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0046/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0046.md
          if git diff --cached --quiet;then exit 0;fi
          git diff --cached --check;git config user.name xhs-review-bot;git config user.email 43640935+liqiangcc@users.noreply.github.com;git commit -m 'review: pass batch 0046 reverse-vowels candidate source-first';git push origin "HEAD:$CONTENT_BRANCH"
