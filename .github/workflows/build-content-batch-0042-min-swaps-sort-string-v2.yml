          const research={schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'structured-note',title:'Structured interview note 67de17c2000000001a005fa3',locator:'note_structured/67de17c2000000001a005fa3.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Answer Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Corrected min-swaps deterministic Java fixture',locator:`${out}/min_swaps_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-contract',text:'The repository source requires the minimum number of arbitrary character swaps needed to make a string ordered, but does not preserve comparator, duplicate-character semantics, Unicode unit, or implementation language.',source_ids:['structured-note','source-inventory'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'Under the explicit distinct-Java-char ascending-order contract, source positions map uniquely to target positions, the permutation decomposes into cycles, and summing L-1 matches a separate constructive target-fixing implementation over every permutation of sizes 1 through 7; the dcab example is a four-cycle and requires 3 swaps.',source_ids:['writer-validation'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed',candidate_sha256:sha,remediation_note:'Initial pre-staging v1 fixture caught an incorrect dcab=2 example; v2 corrected the prose and assertion before any candidate was committed to the content branch.'};
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify(research,null,2)+'\n');
          NODE

