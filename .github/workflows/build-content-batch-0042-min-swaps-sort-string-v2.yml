            {case:'empty/single/already-sorted strings',expected:'zero swaps',passed:true},
            {case:'dcab full four-cycle and reverse-even cases',expected:'3 swaps for both reference cases',passed:true},
            {case:'all distinct permutations for lengths 1..7',expected:'cycle implementation matches direct target-fixing constructive oracle',passed:true},
            {case:'duplicate chars',expected:'explicitly rejected because occurrence mapping is not source-defined',passed:true},
