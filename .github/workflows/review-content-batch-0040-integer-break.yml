name: Review Content Batch 0040 Integer Break

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0040-integer-break.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0040-integer-break-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_a193569a39b993f4f71e524fae08295b
  SOURCE_QID: a193569a39b993f4f71e524fae08295b

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first independent contract and candidate review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0040/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"
          test -f "$out/IntegerBreak.java"
          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > /tmp/integer-break-context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='算法 1：整数拆分。将正整数 n（2≤n≤53）拆分成 k（k≥2）个正整数的和，求这些整数乘积的最大值';
          const sourceFile='note_tagged/67e658a3000000001c003f7d.json';
          const note=JSON.parse(fs.readFileSync(sourceFile,'utf8'));
          const src=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected||src.question_type!=='算法手撕_Coding'||src.is_valid_for_library!==true) throw new Error(`source contract drifted: ${JSON.stringify(src)}`);
          const ctx=JSON.parse(fs.readFileSync('/tmp/integer-break-context.json','utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('canonical context drifted');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`singleton ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0040/source_inventory.json','utf8'));
          const item=inv.items?.find(x=>x.canonical_id===cid);
          if(!item||!item.source_questions?.some(x=>x.question_id===qid&&x.original_question===expected)) throw new Error('frozen source inventory drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['# 整数拆分：拆成至少两个正整数后乘积最大值','## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','public final class Solution','dp[i] = max(dp[i], j*(i-j), j*dp[i-j])','n < 2 || n > 53','O(n²)','258280326'];
          for(const marker of required) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if(!md.includes('k≥2')||!md.includes('至少拆')) throw new Error('mandatory split semantics missing');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          if(/线上事故|生产环境里我|我负责过/.test(md)) throw new Error('fabricated project experience risk');
          const hash=crypto.createHash('sha256').update(fs.readFileSync(`review/candidates/answers/${cid}.md`)).digest('hex');
          fs.writeFileSync('/tmp/integer-break-candidate-sha',hash+'\n');
          NODE

          cat > "$out/ReviewerIntegerBreak.java" <<'JAVA'
          public final class ReviewerIntegerBreak {
              private static long compositionOracle(int n) {
                  int gaps = n - 1;
                  long best = Long.MIN_VALUE;
                  int limit = 1 << gaps;
                  for (int mask = 1; mask < limit; mask++) {
                      int part = 1;
                      long product = 1;
                      for (int g = 0; g < gaps; g++) {
                          if ((mask & (1 << g)) != 0) {
                              product *= part;
                              part = 1;
                          } else {
                              part++;
                          }
                      }
                      product *= part;
                      if (product > best) best = product;
                  }
                  return best;
              }

              private static long theoremOracle(int n) {
                  if (n == 2) return 1;
                  if (n == 3) return 2;
                  long p = 1;
                  while (n > 4) { p *= 3; n -= 3; }
                  return p * n;
              }

              public static void main(String[] args) {
                  for (int n = 2; n <= 18; n++) {
                      long expected = compositionOracle(n);
                      long actual = IntegerBreak.solve(n);
                      if (actual != expected) throw new AssertionError("composition mismatch n=" + n + " expected=" + expected + " actual=" + actual);
                  }
                  for (int n = 2; n <= 53; n++) {
                      long expected = theoremOracle(n);
                      long actual = IntegerBreak.solve(n);
                      if (actual != expected) throw new AssertionError("range mismatch n=" + n + " expected=" + expected + " actual=" + actual);
                  }
                  if (IntegerBreak.solve(2) != 1 || IntegerBreak.solve(3) != 2 || IntegerBreak.solve(10) != 36 || IntegerBreak.solve(53) != 258_280_326L) throw new AssertionError("boundary/example mismatch");
                  System.out.println("PASS compositions-n=2..18 theorem-n=2..53 boundaries=1,2,36,258280326");
              }
          }
          JAVA
          javac "$out/IntegerBreak.java" "$out/ReviewerIntegerBreak.java"
          stdout="$(java -cp "$out" ReviewerIntegerBreak)"
          test "$stdout" = 'PASS compositions-n=2..18 theorem-n=2..53 boundaries=1,2,36,258280326'
          CANDIDATE_SHA="$(cat /tmp/integer-break-candidate-sha)" STDOUT="$stdout" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,date='2026-08-27',out=`review/content_build/answer_batch_0040/${cid}`;
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({
            schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_SHA,result:'pass',validated_at:date,
            command:'javac IntegerBreak.java ReviewerIntegerBreak.java && java ReviewerIntegerBreak',stdout:process.env.STDOUT,
            checks:['independent cut-mask composition oracle for every n=2..18','independent 2/3 mathematical theorem oracle for every n=2..53','mandatory-split boundaries n=2->1 and n=3->2','representative n=10->36','upper source boundary n=53->258280326']
          },null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0040-integer-break-20260827-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The live repository source is a singleton Coding contract: 2<=n<=53, split into k>=2 positive integers, maximize their product.',
            'The candidate encodes the mandatory split in the dp-state semantics and compares both stopping after the first cut and recursively splitting the remainder.',
            'The Java implementation matches an independent cut-mask enumeration of every positive-integer composition for n=2..18.',
            'A separate mathematical 2/3 decomposition oracle matches the implementation for every source value n=2..53, including the upper-bound result 258280326.',
            'The standalone Java answer block compiles independently and the stated O(n^2) time/O(n) state bounds match the implementation.',
            'The answer is source-bounded, includes concrete edge cases/follow-ups, and does not fabricate project experience.'
          ];
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_SHA,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0040.integer-break.v2',decision:'pass',revision_round:1,
            source_packet:['note_tagged/67e658a3000000001c003f7d.json','review/content_build/answer_batch_0040/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');
          NODE

      - name: Bind writer evidence only after independent conclusion
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0040/$cid"
          CANDIDATE_SHA="$(cat /tmp/integer-break-candidate-sha)" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0040/${cid}`;
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==process.env.CANDIDATE_SHA) throw new Error('writer packet state/hash drifted');
          if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error('writer source coverage missing');
          const reviewResult=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          if(reviewResult.decision!=='pass'||reviewResult.candidate_sha256!==process.env.CANDIDATE_SHA) throw new Error('independent review binding failed');
          const reviewer=reviewResult.reviewer_id;
          const boundaryTests=[
            {case:'n=2 mandatory split',expected:1,passed:true},
            {case:'n=3 mandatory split',expected:2,passed:true},
            {case:'n=10 representative',expected:36,passed:true},
            {case:'n=53 source upper bound',expected:258280326,passed:true}
          ];
          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_SHA,checked_at:date,
            writer:{writer_id:'content-batch-0040-integer-break-builder',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'repository-source',title:'Exact Batch 0040 integer-break repository source',locator:`note_tagged/67e658a3000000001c003f7d.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'writer-validation',title:'Writer integer-break Java validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'reviewer-validation',title:'Independent integer-composition and theorem validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Integer-break source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-contract',text:'The source requires 2<=n<=53, k>=2 positive summands, and the maximum product.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节']},
              {claim_id:'dp-recurrence',text:'After choosing a first positive summand j, the remainder can stay whole or be optimally split; comparing both branches yields the mandatory-split DP recurrence.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['核心结论','3 分钟版','原理机制']},
              {claim_id:'range-validation',text:'Independent review matches exhaustive composition enumeration through n=18 and a mathematical oracle for every n through the source upper bound 53.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['1 分钟版','关键细节','常见追问']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:'javac IntegerBreak.java ReviewerIntegerBreak.java && java ReviewerIntegerBreak',result:'pass',reported_stdout:'PASS compositions-n=2..18 theorem-n=2..53 boundaries=1,2,36,258280326',boundary_tests:boundaryTests},
            review:{reviewer_id:reviewer,review_version:reviewResult.review_version,independent:true,decision:'pass',revision_round:1,scores:reviewResult.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:reviewResult.findings},
            promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'
          };
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0040.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_a193569a39b993f4f71e524fae08295b` integer-break writer slice is source-bounded and staged: DP encodes the mandatory k>=2 split, Java validation matches independent recursive enumeration for n=2..16 and an independent mathematical decomposition for every n=2..53, including n=53 -> 258280326. The nearby vague “算法：数字拆分” source remains explicitly invalid and does not widen the contract. Independent source-first review is still required.';
          const passed='- [x] `cq_q_a193569a39b993f4f71e524fae08295b` passed isolated source-first review at the remediated candidate SHA: the mandatory k>=2 contract is preserved, the standalone Java answer block compiles, a separate cut-mask composition oracle matches every n=2..18, and a mathematical oracle matches every n=2..53 including n=53 -> 258280326. Strict candidate audit evidence is bound; repository human approval and S11 real-review policy still block curated promotion.';
          if(!text.includes(pending)) throw new Error('integer-break writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing isolated review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0040/$cid"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$cid.json" "$out/ReviewerIntegerBreak.java" "$out/reviewer_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0040.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0040 integer-break candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
