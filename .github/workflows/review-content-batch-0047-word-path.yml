name: Review Content Batch 0047 Word Path Candidate

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/review-content-batch-0047-word-path.yml
      - review/candidates/answers/cq_q_c5b4000d8ac232781338c2a1dd71be15.md

permissions:
  contents: write

concurrency:
  group: content-batch-0047-word-path-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_c5b4000d8ac232781338c2a1dd71be15
  SOURCE_QID: c5b4000d8ac232781338c2a1dd71be15
  SOURCE_IMG_TXT: note_img_txt/680e66cb0000000023012aa3.txt
  CANDIDATE: review/candidates/answers/cq_q_c5b4000d8ac232781338c2a1dd71be15.md
  OUT: review/content_build/answer_batch_0047/cq_q_c5b4000d8ac232781338c2a1dd71be15

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze source-first packet and extract exact candidate Java
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync(process.env.SOURCE_IMG_TXT,'utf8');
          if(!src.includes('单词路径(二维字母表,是否存在给\n定字符串的路径)')) throw new Error('image transcription source drift');
          const inventory=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0047/source_inventory.json','utf8'));
          const item=inventory.items.find(x=>x.canonical_id===process.env.CANONICAL_ID);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||JSON.stringify(item.question_ids)!==JSON.stringify([process.env.SOURCE_QID])) throw new Error('inventory boundary drift');
          const md=fs.readFileSync(process.env.CANDIDATE,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift ${h}`);
          if(!md.includes('二维字母表')||!md.includes('给定字符串')) throw new Error('source supplement missing');
          if(/我在线上|我负责过|线上事故|我们生产|真实项目里我曾/.test(md)) throw new Error('fabricated project claim');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public final class WordPath')) throw new Error('complete Java candidate missing');
          fs.writeFileSync(`${process.env.OUT}/reviewer_tmp/WordPath.java`,blocks[0][1]+'\n');
          NODE

      - name: Execute independent boundary suite
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/reviewer_tmp/WordPathReviewerTest.java" <<'JAVA'
          import java.util.*;

          public final class WordPathReviewerTest {
              static long exhaustiveCases;
              static void check(boolean v,String name){if(!v)throw new AssertionError(name);}
              public static void main(String[] args) {
                  char[][] sample={{'A','B','C','E'},{'S','F','C','S'},{'A','D','E','E'}};
                  check(WordPath.exists(sample,"ABCCED"),"ABCCED");
                  check(WordPath.exists(sample,"SEE"),"SEE");
                  check(!WordPath.exists(sample,"ABCB"),"no reuse");
                  check(WordPath.exists(new char[][]{{'A'}},"A"),"single");
                  check(!WordPath.exists(new char[][]{{'A'}},"AA"),"single no reuse");
                  check(WordPath.exists(new char[][]{{'X','A'},{'A','B'}},"AB"),"scan all starts");
                  check(WordPath.exists(new char[][]{},""),"empty word on empty board");
                  check(!WordPath.exists(null,"A"),"null board");
                  check(!WordPath.exists(sample,null),"null word");

                  boolean firstNullRejected=false;
                  String firstNullClass="none";
                  try { WordPath.exists(new char[][]{null},"A"); }
                  catch (IllegalArgumentException e){ firstNullRejected=true; firstNullClass="IllegalArgumentException"; }
                  catch (RuntimeException e){ firstNullClass=e.getClass().getSimpleName(); }

                  boolean raggedRejected=false;
                  try { WordPath.exists(new char[][]{{'A'},{'B','C'}},"A"); }
                  catch (IllegalArgumentException e){ raggedRejected=true; }

                  boolean raggedEmptyRejected=false;
                  try { WordPath.exists(new char[][]{{'A'},{'B','C'}},""); }
                  catch (IllegalArgumentException e){ raggedEmptyRejected=true; }

                  exhaustiveTwoByThree();
                  System.out.printf("PASS fixed=9 exhaustive=%d first-null-rejected=%s first-null-class=%s ragged-rejected=%s ragged-empty-rejected=%s%n",
                      exhaustiveCases,firstNullRejected,firstNullClass,raggedRejected,raggedEmptyRejected);
              }

              static void exhaustiveTwoByThree(){
                  int rows=2,cols=3,cells=rows*cols;
                  for(int boardMask=0;boardMask<(1<<cells);boardMask++){
                      char[][] b=new char[rows][cols];
                      for(int p=0;p<cells;p++) b[p/cols][p%cols]=((boardMask>>>p)&1)==0?'A':'B';
                      for(int len=0;len<=6;len++){
                          int words=1<<len;
                          for(int wm=0;wm<words;wm++){
                              StringBuilder sb=new StringBuilder();
                              for(int i=0;i<len;i++) sb.append(((wm>>>i)&1)==0?'A':'B');
                              String w=sb.toString();
                              boolean expected=reference(b,w);
                              boolean actual=WordPath.exists(b,w);
                              if(actual!=expected) throw new AssertionError("mismatch board="+Arrays.deepToString(b)+" word="+w+" expected="+expected+" actual="+actual);
                              exhaustiveCases++;
                          }
                      }
                  }
              }

              static boolean reference(char[][] b,String w){
                  if(w.isEmpty()) return true;
                  int rows=b.length,cols=b[0].length;
                  for(int r=0;r<rows;r++)for(int c=0;c<cols;c++)if(refDfs(b,w,r,c,0,0))return true;
                  return false;
              }
              static boolean refDfs(char[][] b,String w,int r,int c,int i,int used){
                  int rows=b.length,cols=b[0].length;
                  if(r<0||r>=rows||c<0||c>=cols)return false;
                  int bit=1<<(r*cols+c);
                  if((used&bit)!=0||b[r][c]!=w.charAt(i))return false;
                  if(i==w.length()-1)return true;
                  int next=used|bit;
                  return refDfs(b,w,r+1,c,i+1,next)||refDfs(b,w,r-1,c,i+1,next)||refDfs(b,w,r,c+1,i+1,next)||refDfs(b,w,r,c-1,i+1,next);
              }
          }
          JAVA
          (cd "$OUT/reviewer_tmp" && javac -Xlint:all -Werror WordPath.java WordPathReviewerTest.java && java WordPathReviewerTest > stdout.txt)
          cat "$OUT/reviewer_tmp/stdout.txt"

      - name: Record isolated review decision
        shell: bash
        run: |
          set -euo pipefail
          stdout="$(cat "$OUT/reviewer_tmp/stdout.txt")"
          REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const cid=process.env.CANONICAL_ID,out=process.env.OUT,candidate=process.env.CANDIDATE,date='2026-08-28';
          const md=fs.readFileSync(candidate,'utf8');
          const hash=crypto.createHash('sha256').update(md).digest('hex');
          const one=(md.match(/## 1 分钟版\n\n([\s\S]*?)(?=\n## )/)||[])[1]||'';
          const bullets=(one.match(/^- /gm)||[]).length;
          const stdout=process.env.REVIEW_STDOUT||'';
          const firstNullRejected=/first-null-rejected=true/.test(stdout);
          const firstNullClass=(stdout.match(/first-null-class=([^ ]+)/)||[])[1]||'unknown';
          const raggedRejected=/ragged-rejected=true/.test(stdout);
          const raggedEmptyRejected=/ragged-empty-rejected=true/.test(stdout);
          const round1=`${out}/isolated_review_round1.json`;

          if(!fs.existsSync(round1)){
            const findings=[];
            if(bullets<3||bullets>5) findings.push({severity:'major',code:'one_minute_backbone_count',detail:`1 分钟版有 ${bullets} 个主干点，当前语义标准要求 3–5 个。`});
            if(!firstNullRejected||firstNullClass!=='IllegalArgumentException') findings.push({severity:'major',code:'rectangular_contract_first_null_row',detail:`候选宣称非法二维数组形状会显式拒绝，但首行 null 的实际行为是 ${firstNullClass}，与候选契约不一致。`});
            if(!raggedRejected) findings.push({severity:'major',code:'rectangular_contract_ragged',detail:'非空 word 下 ragged array 未按候选契约显式拒绝。'});
            if(!raggedEmptyRejected) findings.push({severity:'major',code:'empty_word_bypasses_shape_contract',detail:'空 word 在二维数组形状校验前直接返回 true，使 ragged array 绕过候选所声明的 rectangular contract。'});
            if(findings.length===0) findings.push({severity:'minor',code:'unexpected_clean_round1',detail:'初始候选未复现预期边界问题；仍冻结本轮观察后进入下一轮。'});
            fs.writeFileSync(`${out}/reviewer_validation_round1.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:hash,result:'fail',validated_at:date,runtime:'OpenJDK 21',command:'extract exact candidate Java; javac -Xlint:all -Werror; fixed cases; exhaustive 2x3 A/B boards with all words length <= 6; invalid-shape probes',stdout,checks:['exact candidate compiles','classic positive/negative cases','no cell reuse','scan all starts','exhaustive 2x3 reference equivalence','first-null-row contract','ragged-array contract including empty-word path']},null,2)+'\n');
            fs.writeFileSync(round1,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0047-word-path-20260828-r1',review_version:'batch-0047.word-path.r1',decision:'fail',revision_round:1,source_packet:['review/content_build/answer_batch_0047/source_inventory.json',process.env.SOURCE_IMG_TXT,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation_round1.json`],scores:{facts_and_evidence:25,directness_and_relevance:17,type_specific_completeness:14,mechanism_and_causality:15,boundaries_and_tradeoffs:6,followup_quality:5,oral_quality:3},hard_failures:['coding_candidate_claims_explicit_rectangular_rejection_but_first_null_row_and_empty_word_shape_paths_do_not_follow_that_contract'],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['revision_required','repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          } else {
            if(bullets<3||bullets>5) throw new Error(`round2 one-minute backbone still invalid: ${bullets}`);
            if(!firstNullRejected||firstNullClass!=='IllegalArgumentException'||!raggedRejected||!raggedEmptyRejected) throw new Error(`round2 rectangular contract still invalid: ${stdout}`);
            const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
            const findings=[
              'The repository image transcription preserves the source as a two-dimensional letter table asking whether a path for a given string exists; adjacency direction and cell-reuse semantics are not preserved, and the candidate labels its four-neighbor/no-reuse behavior as an explicit executable contract rather than source fact.',
              'The revised one-minute answer now satisfies the 3–5 backbone requirement while retaining the DFS state, pruning, backtracking invariant and complexity boundary.',
              'The exact Java candidate compiles with OpenJDK 21 and validates rectangular input before the empty-word shortcut, so null/ragged rows cannot contradict the documented input contract.',
              'Independent execution covers classic positive/negative cases, no-cell-reuse, alternate starting cells, null/empty boundaries, explicit invalid-shape rejection, and exhaustive equivalence across every 2x3 A/B board and every A/B word of length 0 through 6.',
              'The project section remains hypothetical and does not fabricate production experience; variants such as diagonal movement, reusable cells and path-returning APIs are clearly separated from the chosen contract.'
            ];
            fs.writeFileSync(`${out}/writer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:hash,result:'pass',validated_at:date,runtime:'OpenJDK 21',command:'extract exact candidate Java; javac -Xlint:all -Werror; fixed cases and exhaustive 2x3 A/B board/word suite',stdout,checks:['exact candidate compiles','classic ABCCED/SEE/ABCB semantics','single-cell and no-reuse','all starts scanned','null and empty contract','first-null and ragged arrays rejected explicitly','all 8128 2x3 A/B board-word combinations match independent reference']},null,2)+'\n');
            fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source-image-transcription',title:'Tencent WXG interview image transcription',locator:process.env.SOURCE_IMG_TXT,source_type:'repository_source_record',checked_at:date},{source_id:'executable-validation',title:'Word-path exact candidate validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved image transcription says word path in a two-dimensional letter table and asks whether a path for the given string exists; neighbor directions and cell reuse are not preserved source constraints.',source_ids:['repository-source-image-transcription'],answer_locations:['核心结论','1 分钟版','关键细节','易错点']},{claim_id:'candidate-contract-behavior',text:'Under the explicitly chosen four-neighbor/no-reuse contract, the exact Java candidate matches the independent exhaustive reference and rejects invalid rectangular shapes as documented.',source_ids:['executable-validation'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:process.env.SOURCE_QID,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
            fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0047-word-path-20260828-r2',review_version:'batch-0047.word-path.r2-exhaustive',decision:'pass',revision_round:2,source_packet:['review/content_build/answer_batch_0047/source_inventory.json',process.env.SOURCE_IMG_TXT,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/writer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          }
          NODE

      - name: Commit review artifacts atomically
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT/reviewer_tmp"
          if git diff --quiet -- "$OUT"; then
            echo 'No review artifact changes.'
            exit 0
          fi
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "$OUT"
          if [ -f "$OUT/isolated_review_result.json" ]; then
            git commit -m 'review: pass batch 0047 word-path candidate source-first'
          else
            git commit -m 'review: fail batch 0047 word-path candidate round 1'
          fi
          git push origin HEAD:"$CONTENT_BRANCH"
