          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(src?.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=(packet.canonicals||[]).find(x=>x.canonical_id===cid);
          if(!entry) throw new Error('source packet member missing');
          const exact=(entry.source_hits||[]).find(h=>h?.match_basis==='question_id'&&h?.tagged_question?.question_id===qid);
          if(exact?.tagged_question?.original_question!==expected||exact?.tagged_question?.is_valid_for_library!==true) throw new Error('exact packet hit missing');
          let tagged=null,taggedPath=null;
          for(const name of fs.readdirSync('note_tagged')){
            if(!name.endsWith('.json')) continue;
            const p=path.join('note_tagged',name);let doc;
            try{doc=JSON.parse(fs.readFileSync(p,'utf8'));}catch{continue;}
            const q=(doc.tagged_questions||[]).find(x=>x.question_id===qid);
