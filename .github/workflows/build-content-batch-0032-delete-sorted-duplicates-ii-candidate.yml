          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-25',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Batch 0032 exact source packet and tagged Question SSOT',locator:`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,source_type:'repository_source_record',checked_at:'2026-08-25'},{source_id:'fixture',title:'Delete-sorted-duplicates-II actual-candidate exhaustive/random oracle',locator:path.join(out,'code_validation.json'),source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-25'}],claims:[{claim_id:'source-boundary',text:'The exact source identifies Delete Duplicates from Sorted List II / LeetCode 82 and preserves no Java node/API details beyond the sorted-list problem identity.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm-behavior',text:'Under the explicit answer-side Java linked-list contract, the actual candidate removes every entire equal-value run of length greater than one and keeps only singleton runs.',source_ids:['fixture'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundaries',text:'Executable validation covers empty/single input, duplicate runs at head/middle/tail, long runs, randomized sorted inputs, node reuse and acyclic output.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;
          let text=fs.readFileSync(task,'utf8');
          const note=`- [ ] \`${cid}\` candidate staged source-first: exact sorted-list / LeetCode 82 source identity preserved; dummy-predecessor Java candidate removes entire duplicate runs and the actual code passes exhaustive nondecreasing arrays plus 20,000 deterministic randomized sorted cases with node-reuse/acyclic checks. Independent review still required.`;
          if(!text.includes(note)) text+=(text.endsWith('\n')?'':'\n')+note+'\n';
          fs.writeFileSync(task,text);
          NODE

