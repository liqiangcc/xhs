name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests and read-only checks
        run: npm run ci:check

      - name: Verify pilot audit ledger is current
        run: node scripts/content/build_pilot_answer_audit.js --check

      - name: Enforce answer semantic and evidence gates
        run: npm run ci:answer:semantic && npm run ci:answer:evidence && npm run ci:answer:code && npm run ci:answer:coverage

      - name: Audit active answer-batch candidates
        run: |
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_gc_algorithms_3f884748.md --require-evidence --noWrite
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_deep_copy_5cfb8eb4.md --require-evidence --noWrite
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_java_oop_21912814.md --require-evidence --noWrite
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_language_compilation_0a002e6b.md --require-evidence --noWrite
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_linux_commands_76aadb5b.md --require-evidence --noWrite

      - name: Verify no generated changes
        run: git diff --exit-code
