name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run tests and read-only checks
        run: npm run ci:check

      - name: Verify pilot audit ledger is current
        run: node scripts/content/build_pilot_answer_audit.js --check

      - name: Enforce answer semantic and evidence gates
        run: npm run ci:answer:semantic && npm run ci:answer:evidence && npm run ci:answer:code && npm run ci:answer:coverage

      - name: Audit short-video pilot candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_short_video_bcbcf234.md --require-evidence --noWrite

      - name: Audit batch 0010 GC algorithms candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_gc_algorithms_3f884748.md --require-evidence --noWrite

      - name: Audit batch 0010 deep-copy candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_deep_copy_5cfb8eb4.md --require-evidence --noWrite

      - name: Audit batch 0010 Java OOP candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_java_oop_21912814.md --require-evidence --noWrite

      - name: Audit batch 0010 language-compilation candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_language_compilation_0a002e6b.md --require-evidence --noWrite

      - name: Audit batch 0010 Linux-commands candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_linux_commands_76aadb5b.md --require-evidence --noWrite

      - name: Audit batch 0010 MySQL-isolation candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_mysql_isolation_c43c6784.md --require-evidence --noWrite

      - name: Audit batch 0010 RocketMQ-architecture candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_rocketmq_arch_22d7b629.md --require-evidence --noWrite

      - name: Audit batch 0011 longest-palindromic-subsequence candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05ef104a850cbc33126f5c746e00171c.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 coin-change candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_3f52d557f29ac6552e5dc5f5e940f810.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 reorder-list candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_5856fb8727752874f2e1c6d8a3832d67.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 swap-nodes-in-pairs candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0fdff883609d352de9fa841f0a635925.md --require-evidence --require-code --noWrite

      - name: Capture batch 0011 audit diagnostics
        if: always()
        run: |
          mkdir -p audit-diagnostics
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05ef104a850cbc33126f5c746e00171c.md --require-evidence --require-code --noWrite > audit-diagnostics/lps.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_3f52d557f29ac6552e5dc5f5e940f810.md --require-evidence --require-code --noWrite > audit-diagnostics/coin-change.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_5856fb8727752874f2e1c6d8a3832d67.md --require-evidence --require-code --noWrite > audit-diagnostics/reorder-list.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0fdff883609d352de9fa841f0a635925.md --require-evidence --require-code --noWrite > audit-diagnostics/swap-pairs.json || true

      - name: Upload batch 0011 audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-0011-audit-diagnostics
          path: audit-diagnostics

      - name: Verify no generated changes
        run: git diff --exit-code
