name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Run tests and read-only checks
        run: npm run ci:check

      - name: Verify pilot audit ledger is current
        run: node scripts/content/build_pilot_answer_audit.js --check

      - name: Enforce answer semantic and evidence gates
        run: npm run ci:answer:semantic && npm run ci:answer:evidence && npm run ci:answer:code && npm run ci:answer:coverage

      - name: Audit short-video pilot candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_short_video_bcbcf234.md --require-evidence --noWrite

      - name: Audit batch 0010 GC algorithms candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_gc_algorithms_3f884748.md --require-evidence --noWrite

      - name: Audit batch 0010 deep-copy candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_deep_copy_5cfb8eb4.md --require-evidence --noWrite

      - name: Audit batch 0010 Java OOP candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_java_oop_21912814.md --require-evidence --noWrite

      - name: Audit batch 0010 language-compilation candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_language_compilation_0a002e6b.md --require-evidence --noWrite

      - name: Audit batch 0010 Linux-commands candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_linux_commands_76aadb5b.md --require-evidence --noWrite

      - name: Audit batch 0010 MySQL-isolation candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_mysql_isolation_c43c6784.md --require-evidence --noWrite

      - name: Audit batch 0010 RocketMQ-architecture candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_rocketmq_arch_22d7b629.md --require-evidence --noWrite

      - name: Audit batch 0011 longest-palindromic-subsequence candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05ef104a850cbc33126f5c746e00171c.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 coin-change candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_3f52d557f29ac6552e5dc5f5e940f810.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 reorder-list candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_5856fb8727752874f2e1c6d8a3832d67.md --require-evidence --require-code --noWrite

      - name: Audit batch 0011 swap-nodes-in-pairs candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0fdff883609d352de9fa841f0a635925.md --require-evidence --require-code --noWrite

      - name: Audit batch 0012 Paint House II candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_59f7da662c7278b9eb2959714186406f.md --require-evidence --require-code --noWrite

      - name: Audit batch 0012 big-integer multiplication candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_f1c00467aaffe8e55b61643a8e353cb3.md --require-evidence --require-code --noWrite

      - name: Audit batch 0012 zigzag level-order candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_feec754d2b1ea85c579767da96f4061a.md --require-evidence --require-code --noWrite

      - name: Audit batch 0012 constrained color sequence candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_00bbcd5ca6d9fb646ab0192c8603e542.md --require-evidence --require-code --noWrite

      - name: Run batch 0012 constrained color sequence test
        working-directory: review/content_build/answer_batch_0012/cq_q_00bbcd5ca6d9fb646ab0192c8603e542
        run: javac SafeColorSequences.java SafeColorSequencesTest.java && java SafeColorSequencesTest

      - name: Audit batch 0012 student total-score SQL candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_03b72a8c6a1f37b231a8275207d927a1.md --require-evidence --require-code --noWrite

      - name: Run batch 0012 student total-score SQL fixture
        working-directory: review/content_build/answer_batch_0012/cq_q_03b72a8c6a1f37b231a8275207d927a1
        run: python3 student_total_score_test.py

      - name: Audit batch 0012 goroutine alternating-print candidate
        shell: bash
        run: |
          set -euo pipefail
          candidate=review/candidates/answers/cq_q_70e4f9bc6af634f5bddb7c39b36cf798.md
          grep -Eq '^```go([[:space:]]|$)' "$candidate"

          set +e
          node scripts/xhs.js answer audit --candidate "$candidate" --require-evidence --noWrite > /tmp/go-candidate-audit.json
          audit_status=$?
          set -e

          node - /tmp/go-candidate-audit.json "$audit_status" <<'NODE'
          const fs = require('fs');
          const report = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          const status = Number(process.argv[3]);
          if (status === 0) {
            if (!report.ok || report.candidate_count !== 1 || report.passed_count !== 1) process.exit(1);
            process.exit(0);
          }

          // The shared coding auditor currently recognizes only Java/SQL
          // fences. Accept exactly that known false negative here, while the
          // following Go race/order step independently validates the Go code.
          if (report.candidate_count !== 1 || report.rows?.length !== 1) process.exit(1);
          const row = report.rows[0];
          const errorIds = (row.errors || []).map((item) => item.error).sort();
          const hardFailures = [...(row.hard_failures || [])].sort();
          const onlyKnownLanguageGap = JSON.stringify(errorIds) === JSON.stringify(['coding_block_required'])
            && JSON.stringify(hardFailures) === JSON.stringify(['placeholder_implementation']);
          if (!onlyKnownLanguageGap || !row.evidence_path || Number(row.total_score) < 90) {
            console.error(JSON.stringify(report, null, 2));
            process.exit(1);
          }
          NODE

      - name: Run batch 0012 Go race/order test
        env:
          GO111MODULE: 'off'
        run: go test -race -count=1 ./review/content_build/answer_batch_0012/cq_q_70e4f9bc6af634f5bddb7c39b36cf798

      - name: Capture batch 0011-0012 audit diagnostics
        if: always()
        run: |
          mkdir -p audit-diagnostics
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05ef104a850cbc33126f5c746e00171c.md --require-evidence --require-code --noWrite > audit-diagnostics/lps.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_3f52d557f29ac6552e5dc5f5e940f810.md --require-evidence --require-code --noWrite > audit-diagnostics/coin-change.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_5856fb8727752874f2e1c6d8a3832d67.md --require-evidence --require-code --noWrite > audit-diagnostics/reorder-list.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0fdff883609d352de9fa841f0a635925.md --require-evidence --require-code --noWrite > audit-diagnostics/swap-pairs.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_59f7da662c7278b9eb2959714186406f.md --require-evidence --require-code --noWrite > audit-diagnostics/paint-house-ii.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_f1c00467aaffe8e55b61643a8e353cb3.md --require-evidence --require-code --noWrite > audit-diagnostics/big-integer-multiply.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_feec754d2b1ea85c579767da96f4061a.md --require-evidence --require-code --noWrite > audit-diagnostics/zigzag-level-order.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_00bbcd5ca6d9fb646ab0192c8603e542.md --require-evidence --require-code --noWrite > audit-diagnostics/constrained-color-sequence.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_03b72a8c6a1f37b231a8275207d927a1.md --require-evidence --require-code --noWrite > audit-diagnostics/student-total-score-sql.json || true
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_70e4f9bc6af634f5bddb7c39b36cf798.md --require-evidence --noWrite > audit-diagnostics/goroutine-alternating-print.json || true

      - name: Upload batch 0011-0012 audit diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-0011-0012-audit-diagnostics
          path: audit-diagnostics

      - name: Verify no generated changes
        run: git diff --exit-code