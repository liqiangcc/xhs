name: Capture Kafka Duplicate Context

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/capture-kafka-duplicate-context.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Capture authoritative context and candidate hash
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="review/content_build/answer_batch_0009/cq_kafka_duplicate_0a558c94"
          mkdir -p "$OUT_DIR"
          node scripts/xhs.js answer context \
            --canonical-id cq_kafka_duplicate_0a558c94 \
            --noWrite > "$OUT_DIR/context.json"
          sha256sum review/candidates/answers/cq_kafka_duplicate_0a558c94.md \
            | awk '{print $1}' > "$OUT_DIR/candidate_sha256.txt"
          node - "$OUT_DIR/context.json" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const row = JSON.parse(fs.readFileSync(path, 'utf8'));
          if (!row.ok || row.canonical?.canonical_id !== 'cq_kafka_duplicate_0a558c94') {
            throw new Error('unexpected Kafka duplicate answer context');
          }
          if (!Array.isArray(row.source_questions) || row.source_questions.length === 0) {
            throw new Error('source questions are required before evidence/review work');
          }
          if (!Array.isArray(row.source_variants) || row.source_variants.length === 0) {
            throw new Error('source variants are required before evidence/review work');
          }
          NODE
      - name: Remove one-off workflow and commit captured context
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/capture-kafka-duplicate-context.yml
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git commit -m "content: capture Kafka duplicate review context"
          git push origin HEAD:content/quality-completion
