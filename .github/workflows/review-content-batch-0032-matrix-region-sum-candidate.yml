name: Review Content Batch 0032 Immutable Matrix Region Sum Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0032-matrix-region-sum-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0032-matrix-region-sum-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_73af437ce6f5e3b9ca7799372632dbaf
  SOURCE_QID: 73af437ce6f5e3b9ca7799372632dbaf
  CANDIDATE_BLOB_SHA: ce8c2a4d60af6385f0b82ed6df8b6dc4399426f5

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard, compile actual candidate, and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          test -f "$out/code_validation.json"
          test -f "$out/writer_research.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const expected='算法手撕：二维区域和检索 - 矩阵不可变。';
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=(packet.canonicals||[]).find(x=>x.canonical_id===cid);
          if(!entry) throw new Error('source packet member missing');
          const hits=entry.source_hits||[];
          if(hits.length<1||!hits.some(h=>h?.match_basis==='question_id'&&h?.tagged_question?.question_id===qid)) throw new Error('exact source identity missing');
          const q=hits.find(h=>h?.tagged_question?.question_id===qid)?.tagged_question;
          if(q?.original_question!==expected||q?.is_valid_for_library!==true) throw new Error('source wording drifted');
          if(!hits.some(h=>(h?.note_img_txt||'').includes('304'))) throw new Error('LeetCode 304 recovered context missing');
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          const text=fs.readFileSync(candidate,'utf8');
          const required=['二维前缀和','O(1)','long','不可变契约','prefix[row2 + 1][col2 + 1]','matrix must be rectangular'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|按本题约束填写|长尾复习底稿/.test(text)) throw new Error('placeholder/template residue detected');
          const m=text.match(/```java\s*\n([\s\S]*?)\n```/);
          if(!m) throw new Error('candidate Java block missing');
          fs.writeFileSync('/tmp/NumMatrix.java',m[1]);
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/NumMatrix.java
          cat >/tmp/NumMatrixIndependentTest.java <<'JAVA'
          import java.util.Random;

          public final class NumMatrixIndependentTest {
              private static long brute(int[][] m, int r1, int c1, int r2, int c2) {
                  long s = 0;
                  for (int r = r1; r <= r2; r++) {
                      for (int c = c1; c <= c2; c++) s += m[r][c];
                  }
                  return s;
              }

              private static long checkAllRegions(int[][] m) {
                  NumMatrix actual = new NumMatrix(m);
                  long checked = 0;
                  for (int r1 = 0; r1 < m.length; r1++) {
                      for (int r2 = r1; r2 < m.length; r2++) {
                          for (int c1 = 0; c1 < m[0].length; c1++) {
                              for (int c2 = c1; c2 < m[0].length; c2++) {
                                  long got = actual.sumRegion(r1,c1,r2,c2);
                                  long expected = brute(m,r1,c1,r2,c2);
                                  if (got != expected) throw new AssertionError("got="+got+" expected="+expected);
                                  checked++;
                              }
                          }
                      }
                  }
                  return checked;
              }

              private static long exhaustive(int rows, int cols) {
                  int[] alphabet = {-2,0,3};
                  int cells = rows * cols;
                  long total = 1;
                  for (int i = 0; i < cells; i++) total *= alphabet.length;
                  long regions = 0;
                  for (long mask = 0; mask < total; mask++) {
                      long x = mask;
                      int[][] m = new int[rows][cols];
                      for (int i = 0; i < cells; i++) {
                          m[i / cols][i % cols] = alphabet[(int)(x % alphabet.length)];
                          x /= alphabet.length;
                      }
                      regions += checkAllRegions(m);
                  }
                  return regions;
              }

              public static void main(String[] args) {
                  long regions = 0;
                  regions += exhaustive(1,1);
                  regions += exhaustive(1,2);
                  regions += exhaustive(1,3);
                  regions += exhaustive(2,1);
                  regions += exhaustive(2,2);
                  regions += exhaustive(2,3);

                  Random rnd = new Random(304L);
                  long randomMatrices = 5000;
                  for (int t = 0; t < randomMatrices; t++) {
                      int rows = 1 + rnd.nextInt(5), cols = 1 + rnd.nextInt(5);
                      int[][] m = new int[rows][cols];
                      for (int r=0;r<rows;r++) for (int c=0;c<cols;c++) m[r][c]=rnd.nextInt(2001)-1000;
                      NumMatrix actual = new NumMatrix(m);
                      for (int q=0;q<20;q++) {
                          int r1=rnd.nextInt(rows),r2=rnd.nextInt(rows),c1=rnd.nextInt(cols),c2=rnd.nextInt(cols);
                          if(r1>r2){int z=r1;r1=r2;r2=z;} if(c1>c2){int z=c1;c1=c2;c2=z;}
                          long got=actual.sumRegion(r1,c1,r2,c2), expected=brute(m,r1,c1,r2,c2);
                          if(got!=expected) throw new AssertionError("random mismatch");
                      }
                  }

                  int[][] snapshot={{1,2},{3,4}};
                  NumMatrix snap=new NumMatrix(snapshot);
                  snapshot[0][0]=999;
                  if(snap.sumRegion(0,0,1,1)!=10L) throw new AssertionError("snapshot not immutable");

                  int M=Integer.MAX_VALUE;
                  NumMatrix large=new NumMatrix(new int[][]{{M,M},{M,M}});
                  if(large.sumRegion(0,0,1,1)!=4L*M) throw new AssertionError("long accumulation failed");

                  boolean jagged=false,invalid=false,empty=false;
                  try { new NumMatrix(new int[][]{{1},{2,3}}); } catch (IllegalArgumentException e) { jagged=true; }
                  try { new NumMatrix(new int[][]{}); } catch (IllegalArgumentException e) { empty=true; }
                  try { new NumMatrix(new int[][]{{1}}).sumRegion(0,0,1,0); } catch (IndexOutOfBoundsException e) { invalid=true; }
                  if(!jagged||!empty||!invalid) throw new AssertionError("API boundary failure");

                  System.out.println("PASS actual-candidate exhaustive-regions="+regions+" random-matrices=5000 random-queries=100000 snapshot=immutable long-overflow=covered jagged-empty-bounds=rejected");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/NumMatrixIndependentTest.java
          independent_stdout="$(java -cp /tmp NumMatrixIndependentTest)"
          echo "$independent_stdout" | grep -Eq '^PASS actual-candidate exhaustive-regions=[0-9]+ random-matrices=5000 random-queries=100000 snapshot=immutable long-overflow=covered jagged-empty-bounds=rejected$'
          echo "$independent_stdout"
          printf '%s\n' "$independent_stdout" > /tmp/independent_stdout.txt

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_${batch}/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const independent=fs.readFileSync('/tmp/independent_stdout.txt','utf8').trim();
          const tests=[
            {case:'actual candidate exhaustive small matrices',expected:'all inclusive sub-rectangle sums equal direct nested-loop oracle',actual:independent,passed:true},
            {case:'deterministic randomized matrices',expected:'100,000 random regions equal direct summation oracle',actual:'pass across 5,000 matrices',passed:true},
            {case:'immutable snapshot',expected:'caller mutation after construction does not change answer',actual:'pass',passed:true},
            {case:'long accumulation',expected:'2x2 Integer.MAX_VALUE matrix sums without int overflow',actual:'pass',passed:true},
            {case:'Java API boundaries',expected:'jagged/empty matrices and invalid region rejected',actual:'pass',passed:true}
          ];
          const previous=JSON.parse(fs.readFileSync(validationPath,'utf8'));
          fs.writeFileSync(validationPath,JSON.stringify({...previous,validated_at:date,independent_command:'extract actual candidate Java; compile; exhaustive {-2,0,3} matrices through 2x3 plus 5,000 deterministic random matrices against direct-sum oracle',independent_stdout:independent,boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0032-matrix-region-sum-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The exact repository source identifies the immutable two-dimensional region-sum problem and preserves the LeetCode 304 context; it does not preserve Java API, numeric-width, invalid-input, or mutation-after-construction contracts.',
            'The candidate keeps those unstated API choices explicit as answer-side contracts instead of presenting them as recovered source requirements.',
            'The two-dimensional prefix recurrence and four-term inclusion-exclusion query are internally consistent, including the +1 sentinel row/column convention and inclusive query endpoints.',
            'Independent review compiles and runs the actual candidate against a direct nested-loop oracle over exhaustive small matrices and 100,000 deterministic randomized regions.',
            'Snapshot immutability, long accumulation beyond int range, jagged/empty input rejection, and invalid-region rejection are independently exercised and match the candidate text.',
            'O(RC) preprocessing/space and O(1) query claims match the implementation structure; the answer correctly separates mutable-matrix alternatives as a different contract.',
            'No project experience is fabricated.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0032.matrix-region-sum.v1',decision:'pass',revision_round:0,source_packet:[`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0032-matrix-region-sum-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Batch 0032 exact source-first singleton boundary',locator:`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Matrix region-sum writer fixture plus actual-candidate independent oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Matrix region-sum independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source identifies immutable 2D region-sum / LeetCode 304 without preserving Java-specific API, numeric width, or invalid-input contracts.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm-behavior',text:'The actual candidate constructs a 2D prefix table and answers inclusive sub-rectangles by four-term inclusion-exclusion.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundaries',text:'Independent checks confirm snapshot immutability, long accumulation, rectangular-input enforcement and invalid-region rejection under the explicit answer-side contract.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','关键细节','常见追问']},{claim_id:'complexity',text:'The implementation fills one (R+1)x(C+1) table once and each query reads four entries, matching O(RC) preprocessing/space and O(1) query time.',source_ids:['isolated-review'],answer_locations:['1 分钟版','关键细节']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'writer randomized fixture plus independently compiled actual-candidate exhaustive/random direct-sum oracle',result:'pass',reported_stdout:independent,checks:['exhaustive small matrices','100,000 random regions','snapshot immutability','long overflow boundary','jagged/empty rejection','invalid region rejection'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0032.matrix-region-sum.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;
          let text=fs.readFileSync(task,'utf8');
          text=text.split(/\r?\n/).filter(line=>!(line.includes('`'+cid+'`')&&line.includes('Independent review still required'))).join('\n');
          if(!text.endsWith('\n')) text+='\n';
          const done=`- [x] \`${cid}\` candidate passed independent source-first review: exact source preserves immutable 2D region-sum / LeetCode 304 but not Java-specific API choices; the candidate uses a sentinel-padded 2D prefix table with four-term inclusion-exclusion, writer validation passes 3,000 matrices / 60,000 queries, and an independent oracle compiles the actual candidate and exhaustively checks small matrices plus 100,000 deterministic random regions and API boundaries. Formal promotion remains governed by repository promotion and real-review policy.`;
          if(!text.includes(done)) text+=done+'\n';
          fs.writeFileSync(task,text);
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit independent review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during matrix region-sum review; discard local review and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m "review: pass batch ${BATCH} matrix region-sum candidate"
          git push origin "HEAD:$CONTENT_BRANCH"
