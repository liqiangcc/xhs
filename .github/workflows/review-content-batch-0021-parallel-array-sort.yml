name: Review Content Batch 0021 Parallel Array Sort

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0021-parallel-array-sort.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-parallel-array-sort-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_37c73385b683ba395f0d066744d02f37
  SOURCE_QID: 37c73385b683ba395f0d066744d02f37
  SOURCE_NOTE: note_desc/68c82557000000001d00fb7c.txt
  SOURCE_TAGGED: note_tagged/68c82557000000001d00fb7c.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_note_sha256=$(sha256sum "$SOURCE_NOTE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_tagged_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review and independent differential checks
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0021/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"; rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const raw=fs.readFileSync(process.env.SOURCE_NOTE,'utf8');
          if(!raw.includes('2、多线程实现数组排序')) throw new Error('primary source wording drift');
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const tq=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tq||tq.original_question!=='算法手撕：多线程实现数组排序。') throw new Error('tagged question drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift: ${h}`);
          for(const marker of ['Java `int[]` 原地升序排序','parallelism','threshold','Fork/Join','共享一个 `tmp` 可以不加锁','O(n log n)','O(n)','来源没有真实生产数据']) if(!md.includes(marker)) throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md)) throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1) throw new Error(`expected one Java block, got ${blocks.length}`);
          fs.writeFileSync(`${out}/reviewer_tmp/ParallelMergeSort.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/IndependentReviewerTest.java" <<'JAVA'
          import java.util.Arrays;
          import java.util.Random;

          public final class IndependentReviewerTest {
              private static long exhaustiveArrays = 0;
              private static long stressShapes = 0;

              public static void main(String[] args) {
                  checkExceptions();
                  int[] domain = {-2, -1, 0, 1, 2};
                  for (int len = 0; len <= 4; len++) enumerate(new int[len], 0, domain);

                  Random random = new Random(0x37c73385L);
                  int[][] configs = {{1,1},{2,1},{3,7},{4,32},{8,128}};
                  for (int n : new int[]{2,3,7,31,32,33,257,1024,4097}) {
                      for (int rep = 0; rep < 8; rep++) {
                          int[] a = new int[n];
                          for (int i = 0; i < n; i++) {
                              int mode = rep % 4;
                              a[i] = mode == 0 ? random.nextInt() : mode == 1 ? (i % 9) - 4 : mode == 2 ? n - i : i;
                          }
                          for (int[] c : configs) verify(a, c[0], c[1]);
                          stressShapes++;
                      }
                  }

                  int[] extremes = {Integer.MAX_VALUE, Integer.MIN_VALUE, 0, -1, 1, Integer.MAX_VALUE, Integer.MIN_VALUE};
                  for (int[] c : configs) verify(extremes, c[0], c[1]);
                  System.out.printf("PASS exhaustive_arrays=%d exhaustive_configs=4 stress_shapes=%d stress_configs=5 extremes=pass invalid=reject%n", exhaustiveArrays, stressShapes);
              }

              private static void enumerate(int[] a, int p, int[] domain) {
                  if (p == a.length) {
                      int[][] configs = {{1,1},{2,1},{3,2},{4,8}};
                      for (int[] c : configs) verify(a, c[0], c[1]);
                      exhaustiveArrays++;
                      return;
                  }
                  for (int v : domain) {
                      a[p] = v;
                      enumerate(a, p + 1, domain);
                  }
              }

              private static void verify(int[] input, int parallelism, int threshold) {
                  int[] expected = input.clone();
                  Arrays.sort(expected);
                  int[] actual = input.clone();
                  ParallelMergeSort.sort(actual, parallelism, threshold);
                  if (!Arrays.equals(actual, expected)) {
                      throw new AssertionError("mismatch p=" + parallelism + " t=" + threshold + " input=" + Arrays.toString(input));
                  }
              }

              private static void checkExceptions() {
                  expect(NullPointerException.class, () -> ParallelMergeSort.sort(null, 2, 2));
                  expect(IllegalArgumentException.class, () -> ParallelMergeSort.sort(new int[]{2,1}, 0, 2));
                  expect(IllegalArgumentException.class, () -> ParallelMergeSort.sort(new int[]{2,1}, 2, 0));
              }

              private static void expect(Class<? extends Throwable> type, Runnable action) {
                  try {
                      action.run();
                      throw new AssertionError("missing " + type.getSimpleName());
                  } catch (Throwable t) {
                      if (!type.isInstance(t)) throw new AssertionError("wrong exception " + t);
                  }
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror ParallelMergeSort.java IndependentReviewerTest.java && java IndependentReviewerTest > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS exhaustive_arrays=781 exhaustive_configs=4 stress_shapes=72 stress_configs=5 extremes=pass invalid=reject'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The primary source preserves only the request to implement array sorting with multiple threads; Java, int element type, ascending order, in-place mutation, parallelism, threshold and merge sort are not recovered source constraints.',
            'The candidate explicitly labels those language/API/algorithm choices as an answer-side executable contract rather than attributing them to the interview source.',
            'The concurrency argument is coherent: sibling tasks mutate disjoint half-open array intervals, invokeAll establishes child completion before the parent merge, and the shared temporary array is likewise written only within each task-owned interval while siblings run.',
            'Reviewer-extracted Java compiles with warnings as errors and matches Arrays.sort for every array of length 0 through 4 over {-2,-1,0,1,2} under four independent parallelism/threshold configurations, plus 72 larger deterministic stress shapes under five configurations and integer-extreme cases.',
            'Declared null and non-positive parallelism/threshold boundaries are enforced; complexity and serial-merge scalability limits are stated without claiming unmeasured production speedup.',
            'No fabricated production experience, placeholder implementation, unsupported source expansion, or unresolved source variant was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; exhaustive small-domain and deterministic stress differential checks versus Arrays.sort',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','all 781 arrays of length 0..4 over {-2,-1,0,1,2} match Arrays.sort under four reviewer configurations','72 deterministic larger stress shapes match Arrays.sort under five reviewer configurations','Integer.MIN_VALUE/Integer.MAX_VALUE and duplicates sort correctly','declared null and non-positive parameter rejection'],boundary_tests:[{case:'source versus answer-side contract',expected:'Java/int[]/ascending/in-place/ForkJoin/threshold choices remain explicitly answer-side',passed:true},{case:'shared temporary array concurrency',expected:'parallel siblings write disjoint half-open intervals and parent merge begins only after invokeAll completion',passed:true},{case:'small-workload tradeoff',expected:'candidate does not claim multithreading is always faster and recommends measurement',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-parallel-array-sort-20260826-v1',review_version:'parallel-array-sort.forkjoin-merge.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,process.env.SOURCE_TAGGED,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('evidence prerequisite drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered)) throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'parallel-array-sort-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'raw-note',title:'Interview note preserving the multithreaded array-sort wording',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'tagged-question',title:'Tagged question record for the multithreaded array-sort source',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer deterministic Java differential validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent exhaustive-small-domain and stress differential validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The recoverable source asks only for a multithreaded implementation of array sorting; it does not prescribe language, element type, ordering direction, stability, thread count or algorithm.',source_ids:['raw-note','tagged-question'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'candidate-contract',text:'Java int[] ascending in-place sorting with caller-supplied parallelism/threshold and ForkJoin merge sort is an explicit answer-side executable contract.',source_ids:['raw-note','tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'implementation-validation',text:'The implementation matches independent standard-library sorting oracles across writer and reviewer suites; reviewer checks additionally cover exhaustive small arrays, larger deterministic stress shapes, integer extremes and declared argument rejection.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- `cq_q_37c73385b683ba395f0d066744d02f37` — coding; source-bounded Java parallel-merge-sort candidate is staged with language/API choices explicit, writer `javac -Xlint:all -Werror` plus 305-case deterministic `Arrays.sort` differential validation PASS, and source/evidence binding recorded. Isolated independent review remains pending; formal promotion remains blocked by repository human approval and real-review policy.';
          const done='- `cq_q_37c73385b683ba395f0d066744d02f37` — coding; source-bounded Java parallel-merge-sort candidate keeps language/API choices explicit, passes writer and independent reviewer differential validation, isolated source-first review PASS, and complete evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(text.includes(pending)) text=text.replace(pending,done); else if(!text.includes(done)) throw new Error('task summary marker drift');
          const checkPending='- [ ] `cq_q_37c73385b683ba395f0d066744d02f37` writer pass is complete: raw note and tagged question bind the source wording, a source-bounded Java candidate plus reproducible Java fixture are committed, and writer validation is PASS. Next gate is an isolated source-first reviewer run that must not consume writer self-assessment.';
          const checkDone='- [x] `cq_q_37c73385b683ba395f0d066744d02f37` passes isolated source-first review: raw source and tagged question were reviewed before writer evidence, reviewer-owned Java differential checks PASS, and evidence binding is complete. Formal promotion remains governed by repository human approval and real-review policy.';
          if(text.includes(checkPending)) text=text.replace(checkPending,checkDone); else if(!text.includes(checkDone)) throw new Error('task checklist marker drift');
          fs.writeFileSync(task,text);
          NODE

      - name: Strict candidate audit and complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git add -A; git diff --cached --check
          git config user.name 'xhs-review-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass parallel array sort candidate source-first'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"; base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_note="$(git show "origin/$CONTENT_BRANCH:$SOURCE_NOTE" | sha256sum | awk '{print $1}')"
            remote_tagged="$(git show "origin/$CONTENT_BRANCH:$SOURCE_TAGGED" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_note" = '${{ steps.base.outputs.source_note_sha256 }}' || { echo 'source note changed; fail closed'; exit 0; }
            test "$remote_tagged" = '${{ steps.base.outputs.source_tagged_sha256 }}' || { echo 'tagged source changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
