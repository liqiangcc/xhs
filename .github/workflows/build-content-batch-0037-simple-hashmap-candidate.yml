name: Build Content Batch 0037 Simple HashMap Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0037-simple-hashmap-candidate.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0037-simple-hashmap-build
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8ae2ef1fe486e36a35795e5e7e4edb92
  SOURCE_QID: 8ae2ef1fe486e36a35795e5e7e4edb92
  SOURCE_TAGGED: note_tagged/662e0912000000000d031ea3.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "formal_sha256=$(sha256sum review/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Guard source and singleton ownership
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),qid=process.env.SOURCE_QID,cid=process.env.CANONICAL_ID;
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：手撕实现 HashMap (包含数组+链表结构及基本 put/get 逻辑)';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('source question drift');
          const formal=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!formal.includes('"status":"needs_update"')||!formal.includes('"quality_tier":"long_tail_baseline"')) throw new Error('formal answer no longer baseline');
          if(!formal.includes(expected)) throw new Error('formal source locator drift');
          if(fs.existsSync(`review/candidates/answers/${cid}.md`)) throw new Error('candidate already exists');
          NODE
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!c.ok||c.canonical?.canonical_id!==process.env.CANONICAL_ID||c.answer_type!=='coding') throw new Error('canonical/type drift');
          const ids=(c.source_questions||[]).map(x=>x.question_id);
          if(JSON.stringify(ids)!==JSON.stringify([process.env.SOURCE_QID])) throw new Error(`unexpected source ownership ${JSON.stringify(ids)}`);
          NODE

      - name: Write source-bounded HashMap candidate and writer validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0037/$cid"; mkdir -p "$out" review/candidates/answers
          cat > "review/candidates/answers/$cid.md" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_8ae2ef1fe486e36a35795e5e7e4edb92","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # 手撕一个数组 + 链表的简化 HashMap：put / get

          ## 核心结论

          来源明确要求“数组 + 链表结构及基本 put/get 逻辑”，但没有要求复刻 `java.util.HashMap` 的全部行为。这里采用一个最小可执行契约：实现泛型 `SimpleHashMap<K,V>`，桶数组长度在构造时固定；哈希冲突用单链表分离链接；`put` 对已有 key 覆盖 value、对新 key 头插；`get` 找不到返回 `null`。为了让 `null` 能唯一表示“不存在”，本实现明确拒绝 null key 和 null value；也暂不实现扩容、删除、迭代、树化或并发安全。

          ## 1 分钟版

          - 底层是 `Node<K,V>[] buckets`，每个数组槽保存一条冲突链表的头节点。
          - `put(key,value)` 先算桶下标；遍历链表，key 已存在就更新 value，否则把新节点插到链表头。
          - `get(key)` 算同一个桶下标，再沿链表逐个比较 key，命中就返回 value，链尾还没命中则返回 `null`。
          - 哈希值只决定“去哪条链”，真正判断是不是同一个 key 仍要用 `equals`；不同 key 的 `hashCode` 相同必须能共存。
          - 在哈希分布良好且负载受控时，put/get 平均接近 O(1)；固定桶数组如果碰撞严重，单个操作最坏会退化到 O(n)。

          ## 3 分钟版

          ```java
          import java.util.Objects;

          public final class SimpleHashMap<K, V> {
              private final Node<K, V>[] buckets;

              @SuppressWarnings("unchecked")
              public SimpleHashMap(int capacity) {
                  if (capacity <= 0) throw new IllegalArgumentException("capacity must be positive");
                  this.buckets = (Node<K, V>[]) new Node<?, ?>[capacity];
              }

              public void put(K key, V value) {
                  Objects.requireNonNull(key, "key");
                  Objects.requireNonNull(value, "value");
                  int index = index(key);
                  for (Node<K, V> node = buckets[index]; node != null; node = node.next) {
                      if (node.key.equals(key)) {
                          node.value = value;
                          return;
                      }
                  }
                  buckets[index] = new Node<>(key, value, buckets[index]);
              }

              public V get(K key) {
                  Objects.requireNonNull(key, "key");
                  int index = index(key);
                  for (Node<K, V> node = buckets[index]; node != null; node = node.next) {
                      if (node.key.equals(key)) return node.value;
                  }
                  return null;
              }

              private int index(K key) {
                  int h = key.hashCode();
                  h ^= h >>> 16;
                  return Math.floorMod(h, buckets.length);
              }

              private static final class Node<K, V> {
                  private final K key;
                  private V value;
                  private final Node<K, V> next;

                  private Node(K key, V value, Node<K, V> next) {
                      this.key = key;
                      this.value = value;
                      this.next = next;
                  }
              }
          }
          ```

          这段代码展示的是题目明确点名的核心结构和 put/get 链路，不宣称等价于 JDK HashMap。固定容量让冲突链可能越来越长；真实通用 Map 通常还要维护 size/load factor，并在阈值后扩容重散列。

          ## 关键细节

          - **数组负责定位，链表负责解冲突**：哈希函数把大 key 空间压缩到有限桶下标，不同 key 可能落到同一个桶，因此每个桶必须能保存多个节点。
          - **为什么还要 equals**：`hashCode` 相同不代表 key 相等；命中桶后必须逐节点做等价判断，否则碰撞会把不同 key 错当成同一个。
          - **覆盖语义**：同一个 key 再 put 时更新现有节点，不新增重复 key；这也是 reviewer 测试会专门检查的状态转换。
          - **负哈希值**：不能直接 `hash % length` 后拿结果当数组下标；示例用 `Math.floorMod` 保证下标落在 `[0, length)`。
          - **null 边界**：Java 自带 HashMap 支持部分 null 语义，但来源没有要求复刻它。本简化实现拒绝 null key/value，使 `get()==null` 可以明确表示不存在。
          - **扩容边界**：当前数组长度固定，所以功能正确性不依赖扩容，但性能会随链长恶化；若继续追问，应增加 size/load factor、创建新桶数组并把所有节点重新按新容量分桶。
          - **线程安全**：来源没有并发要求；这个实现不是线程安全 Map。并发 put/get 需要额外同步或采用并发容器，不能因为单线程测试通过就声称并发安全。

          ## 原理机制

          Map 要把 key 映射到 value。哈希表先用 `hashCode` 得到可重复计算的整数，再压缩到桶数组下标；这一步只缩小搜索范围，不能消除冲突。分离链接把同桶元素串成链表，因此查找过程是“先 O(1) 定位桶，再在该桶链表内线性比较”。如果哈希分布均匀且桶数量相对元素数足够，期望链长很短；如果所有 key 都碰撞到同一个桶，结构就退化成普通链表。

          ## 项目经验版

          来源没有真实项目或 JDK 版本，不能虚构“线上手写 HashMap”。工程里通常直接使用经过充分验证的集合实现；手写版本的价值是理解冲突、覆盖、扩容和复杂度边界。若真的要实现基础容器，我会把 equals/hashCode 契约、扩容阈值、异常/null 语义和随机碰撞测试写成明确规范，再用参考 Map 做差分测试。

          ## 常见追问

          - 问：为什么不能只比较 hashCode？答：不同 key 可以有相同 hashCode；hash 只帮助定位候选桶，最终相等性仍要由 equals 判断。
          - 问：put 一个已存在 key 会怎样？答：本契约覆盖原 value，不增加新节点；否则同一个 key 会在链上出现多份并让 get 语义不稳定。
          - 问：什么时候扩容？答：当前简化实现没有扩容；若补齐，可维护 size 和 load factor，超过阈值后扩大桶数组并重新分配已有节点，因为桶下标依赖数组长度。
          - 问：为什么 JDK 里不只用链表？答：真实实现还会针对高碰撞链做更多优化；但来源只要求数组+链表和基本 put/get，本答案不把特定 JDK 版本的树化阈值冒充成题目要求。
          - 问：这个实现线程安全吗？答：不是。并发更新同一桶可能丢写或看到不一致状态；并发语义必须另加同步设计或换用专门并发 Map。

          ## 易错点

          - 直接用 `hashCode()` 当数组下标，没有压缩到桶范围。
          - 用 `%` 处理负 hash 后忘记结果也可能为负。
          - 只看 hashCode，不用 equals，导致碰撞 key 被误覆盖。
          - 已存在 key 仍然新增节点，没有实现覆盖语义。
          - 只实现链表却没有桶数组，或只实现数组却没有碰撞处理，偏离来源明确要求。
          - 固定容量实现却声称所有情况下 put/get 都严格 O(1)。
          EOF

          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1) throw new Error('expected exactly one Java block');
          fs.writeFileSync(`review/content_build/answer_batch_0037/${cid}/SimpleHashMap.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/SimpleHashMapWriterTest.java" <<'JAVA'
          import java.util.HashMap;
          import java.util.Map;
          import java.util.Objects;
          import java.util.Random;

          public final class SimpleHashMapWriterTest {
              private record Key(int id, int hash) {
                  @Override public int hashCode() { return hash; }
              }

              public static void main(String[] args) {
                  SimpleHashMap<Key,String> map=new SimpleHashMap<>(4);
                  Key a=new Key(1,7),b=new Key(2,7),c=new Key(3,-17);
                  map.put(a,"A"); map.put(b,"B"); map.put(c,"C");
                  eq(map.get(a),"A"); eq(map.get(b),"B"); eq(map.get(c),"C");
                  map.put(b,"B2"); eq(map.get(b),"B2");
                  if(map.get(new Key(99,7))!=null) throw new AssertionError("missing key must return null");
                  expect(() -> new SimpleHashMap<Key,String>(0));
                  expect(() -> map.put(null,"x"));
                  expect(() -> map.put(a,null));
                  expect(() -> map.get(null));

                  SimpleHashMap<Key,Integer> actual=new SimpleHashMap<>(17);
                  Map<Key,Integer> oracle=new HashMap<>();
                  Random r=new Random(0x8AE2EF1FL);
                  for(int i=0;i<5000;i++){
                      Key k=new Key(r.nextInt(150),r.nextInt(9)-4);
                      if(r.nextBoolean()){
                          int v=r.nextInt(); actual.put(k,v); oracle.put(k,v);
                      } else {
                          eq(actual.get(k),oracle.get(k));
                      }
                  }
                  for(Map.Entry<Key,Integer> e:oracle.entrySet()) eq(actual.get(e.getKey()),e.getValue());
                  System.out.println("PASS collisions=pass update=pass negative-hash=pass random=5000 hashmap-oracle=pass null-contract=reject");
              }

              private static void eq(Object a,Object b){ if(!Objects.equals(a,b)) throw new AssertionError("actual="+a+" expected="+b); }
              private static void expect(Runnable r){ boolean ok=false; try{r.run();}catch(IllegalArgumentException|NullPointerException e){ok=true;} if(!ok) throw new AssertionError("expected rejection"); }
          }
          JAVA
          (cd "$out" && javac -Xlint:all -Werror SimpleHashMap.java SimpleHashMapWriterTest.java && java SimpleHashMapWriterTest > writer_stdout.txt)
          test "$(cat "$out/writer_stdout.txt")" = 'PASS collisions=pass update=pass negative-hash=pass random=5000 hashmap-oracle=pass null-contract=reject'

      - name: Freeze writer records and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0037/$cid"; WRITER_STDOUT="$(cat "$out/writer_stdout.txt")" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const ch=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const ih=crypto.createHash('sha256').update(fs.readFileSync(`${out}/SimpleHashMap.java`)).digest('hex');
          fs.writeFileSync(`${out}/writer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,candidate_sha256:ch,implementation_sha256:ih,command:'extract candidate Java; javac -Xlint:all -Werror SimpleHashMap.java SimpleHashMapWriterTest.java && java SimpleHashMapWriterTest',stdout:process.env.WRITER_STDOUT,checks:['forced same-hash collisions coexist','existing key update overwrites value','negative hash indexes safely','5000 seeded put/get operations match java.util.HashMap oracle under declared non-null contract','capacity/null boundaries reject']},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'tagged-source',title:'Repository tagged hand-written HashMap interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Simple HashMap executable differential validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source requires an array-plus-linked-list HashMap with basic put/get but does not require full java.util.HashMap null, resize, treeification, iteration or concurrency semantics.',source_ids:['tagged-source'],answer_locations:['核心结论','关键细节']},{claim_id:'map-behavior',text:'Under the explicit fixed-capacity/non-null contract, collision chaining, overwrite and lookup behavior match a reference HashMap across forced and randomized operations.',source_ids:['writer-validation'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE
          rm -f "$out/writer_stdout.txt"
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node <<'NODE'
          const fs=require('fs'); const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md'; let t=fs.readFileSync(task,'utf8');
          if(t.includes('- Status: `pending`')) t=t.replace('- Status: `pending`','- Status: `in_progress`');
          const line='- `cq_q_8ae2ef1fe486e36a35795e5e7e4edb92` simple HashMap candidate preserves the explicit array+linked-list put/get source boundary, adopts a fixed-capacity/non-null contract, handles collisions and overwrite semantics, and passes forced plus 5000 seeded writer differential checks; isolated review and promotion gates remain pending.';
          if(!t.includes(line)) t=t.trimEnd()+'\n\n## Progress\n\n'+line+'\n';
          fs.writeFileSync(task,t);
          NODE
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0037/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage batch 0037 simple HashMap candidate'
          git fetch --depth=1 origin "$CONTENT_BRANCH"; remote="$(git rev-parse origin/$CONTENT_BRANCH)"; base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            test "$(git show "origin/$CONTENT_BRANCH:$SOURCE_TAGGED" | sha256sum | awk '{print $1}')" = '${{ steps.base.outputs.source_sha256 }}' || { echo source-changed; exit 0; }
            test "$(git show "origin/$CONTENT_BRANCH:review/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')" = '${{ steps.base.outputs.formal_sha256 }}' || { echo formal-changed; exit 0; }
            test -z "$(git ls-tree -r --name-only "origin/$CONTENT_BRANCH" -- "review/candidates/answers/$CANONICAL_ID.md")" || { echo candidate-concurrent; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
