name: Remediate Content Batch 0045 Unrecoverable Coding Sources

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0045-unrecoverable-coding.yml
      - scripts/content/remediate_batch_0045_unrecoverable_coding.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0045-unrecoverable-coding
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fail-closed source remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0045_unrecoverable_coding.py > /tmp/remediate_batch_0045_unrecoverable_coding.py
          python3 -m py_compile /tmp/remediate_batch_0045_unrecoverable_coding.py
          python3 /tmp/remediate_batch_0045_unrecoverable_coding.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify explainable invalid projections and preserved neighboring evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          specs=[
            ('cq_q_bc13ebbe774e5778175dc8ab0fd760ed','bc13ebbe774e5778175dc8ab0fd760ed','编程题：涉及到 HashMap 累加应用。',['HashMap','输入结构','fail-closed']),
            ('cq_q_bcee79935af85edcb001b4ffafcc3004','bcee79935af85edcb001b4ffafcc3004','场景：一维数组转二维数组',['二维形状','输入输出','fail-closed']),
          ]
          canon={json.loads(x)['canonical_id'] for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          questions={row['question_id']:row for row in (json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip())}
          progress_ids={row.get('canonical_id') for row in json.loads((root/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'))
          decisions={row.get('question_id'):row for row in audit.get('decisions',[])}
          for cid,qid,expected,tokens in specs:
            if cid in canon: raise SystemExit(f'{qid}: retired Canonical still active')
            row=questions.get(qid)
            if not row or row.get('original_question')!=expected: raise SystemExit(f'{qid}: Question projection missing/wording drifted')
            if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'{qid}: invalid projection incorrect: {row}')
            if cid in progress_ids: raise SystemExit(f'{qid}: ReviewProgress still active')
            if (root/'review/answers'/f'{cid}.md').exists(): raise SystemExit(f'{qid}: active Answer still exists')
            if not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit(f'{qid}: archived baseline Answer missing')
            if (root/'review/candidates/answers'/f'{cid}.md').exists(): raise SystemExit(f'{qid}: unexpected candidate exists')
            decision=decisions.get(qid)
            if not decision or decision.get('decision')!='exclude' or decision.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'{qid}: validity-audit exclusion missing')
            note=decision.get('exclusion_note') or ''
            for token in tokens:
              if token not in note: raise SystemExit(f'{qid}: exclusion explanation missing {token}')
          neighbor=questions.get('cb07e30d4af66d5fca38037bdfb3a98d')
          if not neighbor or neighbor.get('is_valid_for_library') is not True or not neighbor.get('canonical_id'):
            raise SystemExit('HashMap Integer-overflow follow-up was incorrectly retired with unrecoverable coding prompt')
          print('PASS batch0045 unrecoverable coding sources retired fail-closed; neighboring recoverable follow-up preserved')
          PY

      - name: Verify complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record bounded batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0045.md'); t=p.read_text(encoding='utf-8')
          lines=[
            '- [x] `cq_q_bc13ebbe774e5778175dc8ab0fd760ed` retired fail-closed as source-unrecoverable: the repository preserves only “编程题：涉及到 HashMap 累加应用。” plus a separate follow-up about Integer overflow during accumulation, but no original input structure, key/value meaning, accumulation goal, return contract, boundaries, examples, or complexity constraints. Choosing a concrete HashMap coding problem would fabricate the source. The invalid Question remains explicitly explainable with `incomplete_or_unreadable`; the independent Integer-overflow follow-up remains active.',
            '- [x] `cq_q_bcee79935af85edcb001b4ffafcc3004` retired fail-closed as source-unrecoverable: the repository preserves only “场景：一维数组转二维数组” and no row/column shape, chunk size, remainder/fill semantics, index mapping, examples, or API contract. Multiple incompatible reshaping contracts fit that phrase, so selecting one would fabricate the original interview task. The invalid Question remains explicitly explainable with `incomplete_or_unreadable`.',
          ]
          if '## Progress' not in t: t=t.rstrip()+'\n\n## Progress\n'
          for line in lines:
            if line not in t: t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during remediation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; a later run may retry against current state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then echo 'No batch 0045 unrecoverable-source changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0045 coding questions'
          git push origin "HEAD:$CONTENT_BRANCH"
