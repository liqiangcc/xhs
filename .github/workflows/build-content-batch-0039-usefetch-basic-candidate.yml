name: Build Content Batch 0039 Basic useFetch Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0039-usefetch-basic-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0039-usefetch-basic-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9c94b4e13076cb425b6a321e5124a5d7
  SOURCE_QID: 9c94b4e13076cb425b6a321e5124a5d7
  PARAMS_QID: 705fcf4159e89e312094f5a60e7d10f1
  PARAMS_CANONICAL_ID: cq_q_705fcf4159e89e312094f5a60e7d10f1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify source and follow-up boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0039/$CANONICAL_ID"
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
