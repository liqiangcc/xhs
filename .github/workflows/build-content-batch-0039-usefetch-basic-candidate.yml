          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,paramsQid=process.env.PARAMS_QID,paramsCid=process.env.PARAMS_CANONICAL_ID;
          const exact='代码实战：手写一个自定义 Hook `useFetch`（使用 `.then` / `.catch` 处理异步请求）。';
          const paramsExact='代码实战：在 `useFetch` 基础上，增加新需求：当请求参数 `params` 变化时，能够自动重新发起请求。';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/68ca70d2000000000e00f5bb.json','utf8')).tagged_questions||[];
          const src=tagged.find(x=>x.question_id===qid), next=tagged.find(x=>x.question_id===paramsQid);
          if(!src||src.original_question!==exact||src.question_type!=='算法手撕_Coding'||src.is_valid_for_library!==true) throw new Error('basic useFetch source drifted');
          if(!next||next.original_question!==paramsExact||next.is_valid_for_library!==true) throw new Error('params follow-up source drifted');
          const rows=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const basicRow=rows.find(x=>x.question_id===qid), paramsRow=rows.find(x=>x.question_id===paramsQid);
          if(!basicRow||basicRow.canonical_id!==cid) throw new Error(`basic ownership drifted: ${basicRow?.canonical_id}`);
          if(!paramsRow||paramsRow.canonical_id!==paramsCid||paramsCid===cid) throw new Error(`params ownership drifted: ${paramsRow?.canonical_id}`);
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0039/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('canonical context drifted');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`canonical question ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const ctxSrc=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!ctxSrc||ctxSrc.original_question!==exact) throw new Error('context source missing');
          const inventory=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0039/source_inventory.json','utf8'));
          const item=inventory.items?.find(x=>x.canonical_id===cid);
          if(!item||!item.source_questions?.some(q=>q.question_id===qid&&q.original_question===exact)) throw new Error('frozen Batch 0039 source inventory drifted');
