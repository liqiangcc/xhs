name: Remediate Content Batch 0060 Stale ReviewProgress

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0060-stale-review-progress.yml
      - scripts/content/retire_batch_0060_stale_review_progress.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0060-stale-review-progress
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Retire only default stale canonical artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/retire_batch_0060_stale_review_progress.py > /tmp/retire-progress.py
          python3 -m py_compile /tmp/retire-progress.py
          python3 /tmp/retire-progress.py

      - name: Verify exact artifact retirement state
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          old='cq_q_7960226d99224c6c8d4411110ff10c8b'
          survivor='cq_q_d3fea003c007b50735b8e695473de9ac'
          progress=json.loads(Path('review/progress.json').read_text(encoding='utf-8'))
          items=progress.get('items',[])
          if any(r.get('canonical_id')==old for r in items): raise SystemExit('stale ReviewProgress remains')
          survivors=[r for r in items if r.get('canonical_id')==survivor]
          if len(survivors)!=1: raise SystemExit(f'survivor ReviewProgress count invalid: {len(survivors)}')
          if Path(f'review/answers/{old}.md').exists(): raise SystemExit('orphan formal Answer remains')
          if Path(f'review/candidates/answers/{old}.md').exists(): raise SystemExit('orphan candidate remains')
          if Path(f'review/evidence/{old}.json').exists(): raise SystemExit('orphan evidence remains')
          record=json.loads(Path('review/content_build/answer_batch_0060/stale_review_progress_retirement.json').read_text(encoding='utf-8'))
          if record.get('schema_version')!='canonical_artifact_retirement.v2': raise SystemExit('retirement record schema invalid')
          if record.get('decision')!='retired_zero_telemetry_stale_progress': raise SystemExit('retirement record decision invalid')
          snap=record.get('retired_progress_snapshot') or {}
          if snap.get('status')!='new' or snap.get('review_count')!=0 or snap.get('last_reviewed_at') is not None or snap.get('mistake_count')!=0:
              raise SystemExit(f'non-zero telemetry was retired: {snap}')
          ans=(record.get('retired_orphan_answer_snapshot') or {}).get('metadata') or {}
          expected={'canonical_id':old,'version':1,'status':'needs_update','quality_tier':'long_tail_baseline','generator_version':'long_tail.v1'}
          bad={k:(v,ans.get(k)) for k,v in expected.items() if ans.get(k)!=v}
          if bad: raise SystemExit(f'non-default orphan Answer retirement recorded: {bad}')
          print('PASS exact Batch 0060 stale artifact retirement verified')
          PY

      - name: Refresh answer-type audit after canonical consolidation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit --noManifest

      - name: Check question coverage
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check

      - name: Check canonical integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite

      - name: Check review integrity
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js review integrity --noWrite

      - name: Check answer-type audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit --check --noWrite

      - id: strict
        name: Capture strict answer validation
        shell: bash
        run: |
          set +e
          node scripts/xhs.js answer validate --strict --noWrite > /tmp/strict-answer-validation.json 2>&1
          rc=$?
          cat /tmp/strict-answer-validation.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload strict answer validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-0060-strict-answer-validation
          path: /tmp/strict-answer-validation.json
          if-no-files-found: error
          retention-days: 7

      - name: Enforce strict answer validation
        if: steps.strict.outputs.rc != '0'
        shell: bash
        run: |
          echo 'Strict answer validation failed; see diagnostic artifact.'
          exit 1

      - name: Run aggregate validation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js validate all --noWrite

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during artifact remediation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          old='cq_q_7960226d99224c6c8d4411110ff10c8b'
          git add review/progress.json review/content_build/answer_batch_0060/stale_review_progress_retirement.json data/manifests/quality/answer_type_audit.jsonl "review/answers/$old.md"
          if git diff --cached --quiet; then
            echo 'Batch 0060 stale canonical artifacts and answer-type audit are already current.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire batch 0060 stale canonical artifacts'
          git push origin "HEAD:$CONTENT_BRANCH"
