name: Audit Content Batch 0035 Two Stack Queue Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/audit-content-batch-0035-two-stack-queue-relation.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_CANONICAL: cq_q_7f276bae3d88861ba9c9abc663d172cf

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Enumerate source-near queue-via-stacks questions and canonical ownership
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const matches=questions.filter(q=>q.is_valid_for_library!==false && /两个栈.*队列|两.*栈.*队列|栈.*实现.*队列|栈.*模拟.*队列|队列.*两个栈/i.test(q.original_question||''));
          const ids=[...new Set(matches.map(q=>q.canonical_id).filter(Boolean))];
          const cs=ids.map(id=>canonicals.find(c=>c.canonical_id===id)).filter(Boolean);
          console.log('RELATION_AUDIT_BEGIN');
          console.log(JSON.stringify({target:process.env.TARGET_CANONICAL,match_count:matches.length,canonical_count:ids.length,matches:matches.map(q=>({question_id:q.question_id,canonical_id:q.canonical_id,original_question:q.original_question,source_note_id:q.source_note_id,source_question_index:q.source_question_index,question_type:q.question_type})),canonicals:cs.map(c=>({canonical_id:c.canonical_id,canonical_question:c.canonical_question,frequency:c.frequency,question_ids:c.question_ids}))},null,2));
          console.log('RELATION_AUDIT_END');
          NODE
          node scripts/xhs.js answer context --canonical-id "$TARGET_CANONICAL" --noWrite
