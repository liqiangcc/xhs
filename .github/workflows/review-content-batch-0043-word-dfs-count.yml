name: Review Content Batch 0043 Word DFS Count

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-word-dfs-count.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-word-dfs-count-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_af10ec1e2112b975228ff2abfa549317
  SOURCE_QID: af10ec1e2112b975228ff2abfa549317

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：给定单词，人工DFS查找出现次数';
          const note=JSON.parse(fs.readFileSync('note_tagged/63ef8724000000001203c1aa.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);if(!row||row.original_question!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8')),item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact||JSON.stringify(item.question_ids)!==JSON.stringify([qid]))throw new Error('inventory drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','countOccurrences','4 邻接','每一条不同的格子路径算一次出现','Math.addExact'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(!md.includes('没有保留单词是在哪种数据结构里查')||!md.includes('二维网格只是本候选的参考契约'))throw new Error('source ambiguity not explicit');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];if(blocks.length!==1)throw new Error('candidate Java block missing/ambiguous');
          fs.writeFileSync('/tmp/Solution.java',blocks[0][1]+'\n');const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_independent_state_dp_differential',candidate_sha256:sha,source_boundary:'The source preserves only a word/DFS occurrence-count request; container, adjacency, reuse rule and occurrence identity are missing. The candidate declares a rectangular four-neighbor no-cell-reuse distinct-path-count contract as one reference rather than reconstructing it as source fact.'},null,2)+'\n');
          NODE

      - name: Execute independent sparse-state DP validation
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/ReviewerHarness.java <<'JAVA'
          import java.util.*;
          public final class ReviewerHarness {
              private record State(long mask,int pos) {}
              private static long oracle(char[][] b,String w) {
                  if(w.isEmpty()||b.length==0)return 0L;int rows=b.length,cols=b[0].length;if(cols==0||w.length()>rows*cols)return 0L;
                  Map<State,Long> cur=new HashMap<>();
                  for(int r=0;r<rows;r++)for(int c=0;c<cols;c++)if(b[r][c]==w.charAt(0)){int p=r*cols+c;cur.merge(new State(1L<<p,p),1L,Math::addExact);}
                  int[][] ds={{1,0},{-1,0},{0,1},{0,-1}};
                  for(int idx=1;idx<w.length();idx++){
                      Map<State,Long> next=new HashMap<>();
                      for(var e:cur.entrySet()){
                          State s=e.getKey();int r=s.pos()/cols,c=s.pos()%cols;
                          for(int[]d:ds){int nr=r+d[0],nc=c+d[1];if(nr<0||nr>=rows||nc<0||nc>=cols||b[nr][nc]!=w.charAt(idx))continue;int p=nr*cols+nc;long bit=1L<<p;if((s.mask()&bit)!=0)continue;State ns=new State(s.mask()|bit,p);next.merge(ns,e.getValue(),Math::addExact);}
                      }
                      cur=next;
                  }
                  long total=0;for(long v:cur.values())total=Math.addExact(total,v);return total;
              }
              private static void check(char[][]b,String w){long got=Solution.countOccurrences(b,w),want=oracle(b,w);if(got!=want)throw new AssertionError("word="+w+" got="+got+" want="+want);}
              private static void expectRagged(){try{Solution.countOccurrences(new char[][]{{'A'},{'B','C'}},"A");throw new AssertionError("ragged accepted");}catch(IllegalArgumentException expected){}}
              public static void main(String[]args){
                  check(new char[][]{{'A','B'},{'B','A'}},"AB");check(new char[][]{{'A','A','A'}},"AA");check(new char[][]{{'A'}},"A");check(new char[][]{{'A'}},"");check(new char[0][0],"A");expectRagged();
                  Random r=new Random(0x53544154454450L);char[] alphabet={'A','B','C'};
                  for(int t=0;t<12000;t++){int rows=1+r.nextInt(3),cols=1+r.nextInt(3);char[][]b=new char[rows][cols];for(int i=0;i<rows;i++)for(int j=0;j<cols;j++)b[i][j]=alphabet[r.nextInt(3)];int len=1+r.nextInt(Math.min(7,rows*cols));StringBuilder w=new StringBuilder();for(int i=0;i<len;i++)w.append(alphabet[r.nextInt(3)]);check(b,w.toString());}
                  System.out.println("PASS fixed-path-count=covered empty=covered no-reuse=covered random-vs-sparse-state-dp=12000 ragged=rejected oracle=bottom-up-mask-dp");
              }
          }
          JAVA
          (cd /tmp && javac Solution.java ReviewerHarness.java && stdout="$(java ReviewerHarness)" && echo "$stdout" && test "$stdout" = 'PASS fixed-path-count=covered empty=covered no-reuse=covered random-vs-sparse-state-dp=12000 ragged=rejected oracle=bottom-up-mask-dp' && printf 'REVIEW_STDOUT=%s\n' "$stdout" >> "$GITHUB_ENV")

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_independent_state_dp_differential'||pre.candidate_sha256!==sha)throw new Error('source-first preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/word_dfs_validation.json`,'utf8'));if(writerValidation.result!=='pass'||writerValidation.candidate_sha256!==sha)throw new Error('writer validation/hash drifted');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const tests=[{case:'fixed path-count and repeated-letter boards',expected:'distinct simple four-neighbor path counts match sparse-state DP',passed:true},{case:'empty word/board and single-cell boundary',expected:'declared boundary semantics hold',passed:true},{case:'12,000 seeded random boards up to 3x3 and words up to length 7',expected:'recursive candidate equals independent bottom-up mask-state DP',passed:true},{case:'ragged board',expected:'malformed grid rejected',passed:true}];
          const findings=['The preserved source is genuinely underspecified about the searched container, adjacency, cell reuse and the identity of one occurrence; the candidate explicitly preserves this uncertainty.','The rectangular four-neighbor distinct-simple-path model is labeled as a reference contract rather than claimed as recovered source semantics.','The recursive implementation has the required counting semantics: successful paths contribute one and sibling branches are accumulated; per-path used state is restored so different paths may reuse cells independently.','The answer distinguishes existence from counting and explains why global visited or success short-circuiting would be incorrect for the declared path-count contract.','A structurally separate bottom-up sparse DP over (mask,end-position) states passes fixed boundaries and 12,000 seeded random cases; malformed ragged grids are rejected consistently.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-word-dfs-20260827-v1',review_version:'batch-0043.word-dfs.v1',decision:'pass',revision_round:0,source_packet:['note_tagged/63ef8724000000001203c1aa.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact Java candidate and differential-test recursive path count against independent bottom-up sparse mask-state DP',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-word-dfs-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-note',title:'Tagged interview note preserving word/DFS occurrence-count prompt',locator:'note_tagged/63ef8724000000001203c1aa.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer iterative-enumerator differential validation',locator:`${out}/word_dfs_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent sparse-state DP differential validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Word-DFS source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves a word/DFS occurrence-count request but not the container, adjacency, reuse rule or occurrence identity.',source_ids:['tagged-note','source-inventory','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'reference-behavior',text:'Under the explicitly declared four-neighbor no-cell-reuse distinct-path-count contract, the exact recursive Java DFS matches independent bottom-up mask-state DP counts across fixed cases and 12,000 seeded random boards/words.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'compile exact Java candidate and differential-test against independent sparse-state DP oracle',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_af10ec1e2112b975228ff2abfa549317` completed writer construction and isolated source-first review. The preserved source leaves the searched container, adjacency, reuse rule and occurrence identity unspecified, so the rectangular four-neighbor no-cell-reuse distinct-path model remains explicitly a reference contract. The exact recursive Java DFS passed the writer iterative-enumerator differential and an independent bottom-up sparse mask-state DP reviewer over fixed boundaries and 12,000 seeded random boards/words. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 word-DFS candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
          done
          exit 1
