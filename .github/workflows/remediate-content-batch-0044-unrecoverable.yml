name: Remediate Content Batch 0044 Unrecoverable Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0044-unrecoverable.yml
      - scripts/content/remediate_batch_0044_unrecoverable.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0044-unrecoverable
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b83fcd37847eaf3324471d85ead2a95f
  SOURCE_QID: b83fcd37847eaf3324471d85ead2a95f

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fail-closed source remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0044_unrecoverable.py > /tmp/remediate_batch_0044_unrecoverable.py
          python3 -m py_compile /tmp/remediate_batch_0044_unrecoverable.py
          python3 /tmp/remediate_batch_0044_unrecoverable.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify explainable invalid projection and retired reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.'); cid='cq_q_b83fcd37847eaf3324471d85ead2a95f'; qid='b83fcd37847eaf3324471d85ead2a95f'; expected='算法：力扣原题，动态规划。'
          canon={json.loads(x)['canonical_id'] for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          questions={row['question_id']:row for row in (json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip())}
          progress_ids={row.get('canonical_id') for row in json.loads((root/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'))
          decisions={row.get('question_id'):row for row in audit.get('decisions',[])}
          if cid in canon: raise SystemExit('retired Canonical still active')
          row=questions.get(qid)
          if not row or row.get('original_question')!=expected: raise SystemExit('Question projection missing/wording drifted')
          if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'invalid projection incorrect: {row}')
          if cid in progress_ids: raise SystemExit('ReviewProgress still active')
          if (root/'review/answers'/f'{cid}.md').exists(): raise SystemExit('active Answer still exists')
          if not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit('archived baseline Answer missing')
          if (root/'review/candidates/answers'/f'{cid}.md').exists(): raise SystemExit('unexpected candidate exists')
          decision=decisions.get(qid)
          if not decision or decision.get('decision')!='exclude' or decision.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit('validity-audit exclusion missing')
          note=decision.get('exclusion_note') or ''
          for token in ['力扣原题','动态规划','具体 LeetCode 题号','输入输出','无法从','fail-closed']:
              if token not in note: raise SystemExit(f'exclusion explanation missing {token}')
          print('PASS batch0044 generic LeetCode/DP source retired fail-closed and remains explainable')
          PY

      - name: Verify complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record bounded batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0044.md'); t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b83fcd37847eaf3324471d85ead2a95f` retired fail-closed as source-unrecoverable: the repository preserves only “算法：力扣原题，动态规划。” and no concrete problem number, task contract, I/O, constraints, examples, expected result, or variant rule; choosing any particular DP problem would fabricate the original interview question. The invalid Question remains explicitly explainable with `incomplete_or_unreadable`, while its long-tail baseline is archived and Canonical/ReviewProgress reachability is removed.'
          if '## Progress' not in t: t=t.rstrip()+'\n\n## Progress\n'
          if line not in t: t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during remediation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; a later run may retry against current state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then echo 'No batch 0044 unrecoverable-source changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0044 DP question'
          git push origin "HEAD:$CONTENT_BRANCH"
