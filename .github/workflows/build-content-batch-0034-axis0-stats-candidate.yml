          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-26',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Exact repository axis0 mean/variance question and verified mapping',locator:`${mapping.note_path} + ${out}/source_mapping.json + review/content_build/answer_batch_0034/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'fixture',title:'Deterministic JDK 21 Welford fixture',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-26'}],claims:[{claim_id:'source-boundary',text:'The source asks for mean and variance on the first dimension but does not preserve Data shape/type, axis convention, population-vs-sample definition, missing-value policy or API.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'algorithm',text:'Under the explicit rectangular finite double[][]/axis0/population-variance contract, per-column Welford state computes mean and M2 in one pass.',source_ids:['fixture'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'validation',text:'The exact fixture validates normal, single-row, large-offset, shape, finite-value and immutability cases.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','常见追问']}],source_question_coverage:[{question_id:mapping.library_question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8').replace('- Status: `pending`','- Status: `in_progress`');
          const p='- Axis-0 mean/variance canonical `'+cid+'` has a source-bounded Welford candidate, verified mapping, deterministic JDK 21 validation, and writer evidence; isolated review and promotion gates remain pending.';
          if(!t.includes(p)) t += (t.includes('## Progress')?'\n':'\n## Progress\n\n')+p+'\n'; fs.writeFileSync(task,t);
          NODE

      - name: Verify exact code fence
