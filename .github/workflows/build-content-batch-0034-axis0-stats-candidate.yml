name: Build Content Batch 0034 Axis0 Stats Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0034-axis0-stats-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-axis0-stats-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7bf6988f5dc924ebd953a660966d019f
  SOURCE_QID: 7bf6988f5dc924ebd953a660966d019f
  SOURCE_NOTE: note_tagged/68234a600000000023013b38.json

