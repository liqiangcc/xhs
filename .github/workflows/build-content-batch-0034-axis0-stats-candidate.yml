        run: |
          set -euo pipefail
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0034/source_boundary_audit.md" "review/content_build/answer_batch_0034/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
