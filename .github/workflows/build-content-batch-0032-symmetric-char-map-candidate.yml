          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"; task="tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git config user.name 'xhs-content-builder'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "$candidate" "$out" "$task"; git diff --cached --check; git commit -m "content: stage batch ${BATCH} symmetric character-map candidate"; git push origin "HEAD:$CONTENT_BRANCH"
