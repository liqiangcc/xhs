name: Content Batch 0019 Equal Sum Candidate Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion' || startsWith(github.event.pull_request.head.ref, 'automation/batch0019-candidate-gate') || github.event.pull_request.head.ref == 'ci/batch0019-equal-sum-candidate-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate equal-sum fixture
        working-directory: review/content_build/answer_batch_0019/cq_q_2f278e6b489feb680f8b173047815566
        shell: bash
        run: |
          set -euo pipefail
          javac EqualSumPartition.java EqualSumPartitionTest.java
          stdout="$(java EqualSumPartitionTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=10 randomized=5000 oracle=exhaustive-subset-partition mutation=none"

      - name: Verify candidate, evidence and isolated review binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cid = 'cq_q_2f278e6b489feb680f8b173047815566'
          candidate = Path(f'review/candidates/answers/{cid}.md').read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          evidence = json.loads(Path(f'review/evidence/{cid}.json').read_text(encoding='utf-8'))
          review = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/isolated_review_result.json').read_text(encoding='utf-8'))
          validation = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/code_validation.json').read_text(encoding='utf-8'))

          expected_sha = '933835a7f303f5dc06dc2bfd8b735153f4871577c25893579cf783ea5e2b699b'
          expected_stdout = 'PASS fixed=10 randomized=5000 oracle=exhaustive-subset-partition mutation=none'
          assert candidate_sha == expected_sha
          assert validation['result'] == 'pass'
          assert validation['stdout'] == expected_stdout
          assert evidence['schema_version'] == 'answer_evidence.v1'
          assert evidence['review_state'] == 'independent_source_first_review_passed'
          assert review['schema_version'] == 'isolated_review.v1'
          assert review['decision'] == 'pass'
          assert review['promotion_blockers'] == ['human_approval_required_for_pilot_promotion']
          assert evidence['candidate_sha256'] == expected_sha
          assert review['candidate_sha256'] == expected_sha
          coverage = evidence['source_question_coverage']
          assert coverage == [{
              'question_id': '603d950161a66de0191f24236561b8df',
              'covered': True,
              'answer_locations': ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问'],
          }]
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'cq_q_2f278e6b489feb680f8b173047815566' review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'normalized; candidate-qualified' review/content_build/answer_batch_0019/source_boundary_audit.md
