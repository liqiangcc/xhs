          import java.util.*;
          public final class WriterValidation {
              static String oracle(String s){
                  if(s==null)throw new NullPointerException("s");
                  String t=s.trim();if(t.isEmpty())return "";
                  String[] parts=t.split(" +");StringBuilder b=new StringBuilder();
                  for(int i=parts.length-1;i>=0;i--){if(b.length()>0)b.append(' ');b.append(parts[i]);}return b.toString();
              }
              static void check(String s){String got=Solution.reverseWords(s),want=oracle(s);if(!got.equals(want))throw new AssertionError("input=["+s+"] got=["+got+"] want=["+want+"]");}
              public static void main(String[] args){
                  for(String s:new String[]{""," ","     ","a"," a ","hello world","  hello   world  ","the sky is blue","a good   example","🙂  hello  世界"})check(s);
                  Random r=new Random(0x52575652495445L);String[] words={"a","bb","cat","delta","世界","🙂","x1"};long chars=0;
                  for(int t=0;t<50000;t++){StringBuilder s=new StringBuilder();int lead=r.nextInt(5);s.append(" ".repeat(lead));int n=r.nextInt(12);for(int i=0;i<n;i++){if(i>0)s.append(" ".repeat(1+r.nextInt(5)));s.append(words[r.nextInt(words.length)]);}s.append(" ".repeat(r.nextInt(5)));chars+=s.length();check(s.toString());}
                  try{Solution.reverseWords(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}
                  System.out.println("PASS fixed=10 random=50000 chars="+chars+" trim-collapse=verified unicode-word-content=covered null=rejected");
              }
          }
