          const crypto=require('crypto'),fs=require('fs');const cid=process.env.CANONICAL_ID,p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p);const text=md.toString('utf8'),block=text.match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('public static String reverseWords'))throw new Error('candidate code missing');fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(md).digest('hex')+'\n');
