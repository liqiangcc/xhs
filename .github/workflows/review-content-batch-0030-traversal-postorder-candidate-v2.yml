name: Review Content Batch 0030 Traversal Postorder Candidate v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0030-traversal-postorder-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0030-traversal-postorder-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6d58c327c55f005301c8a0b6759c1147
  SOURCE_QID: 6d58c327c55f005301c8a0b6759c1147
  CANDIDATE_BLOB_SHA: fbc875284ebf9d2d6155203599fa47b6c4c7ea7e

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Re-review fixed candidate source-first
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0030/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          CANDIDATE="$candidate" OUT="$out" node <<'NODE'
          const fs=require('fs'),qid=process.env.SOURCE_QID,cid=process.env.CANONICAL_ID;
          const expected='算法：根据先序和中序遍历序列，给出后序序列';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/68307f6d0000000023017c20.json','utf8'));
          const src=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected||src.question_type!=='算法手撕_Coding') throw new Error('source drifted');
          const structured=JSON.parse(fs.readFileSync('note_structured/68307f6d0000000023017c20.json','utf8'));
          if(!(structured.questions||[]).includes(expected)) throw new Error('structured source drifted');
          const boundary=JSON.parse(fs.readFileSync(`${process.env.OUT}/source_boundary.json`,'utf8'));
          for(const x of ['whether node values are unique','whether inputs are guaranteed valid and mutually consistent','maximum node count']) if(!(boundary.not_preserved||[]).includes(x)) throw new Error(`missing boundary ${x}`);
          const text=fs.readFileSync(process.env.CANDIDATE,'utf8');
          for(const x of ['public final class Solution','节点值唯一','重复值','leftSize','O(n)','不用真的构造树']) if(!text.includes(x)) throw new Error(`candidate missing ${x}`);
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('canonical ownership drifted');
          NODE
          javac "$out/TraversalPostorder.java" "$out/TraversalPostorderTest.java"
          test "$(java -cp "$out" TraversalPostorderTest)" = 'PASS example=yes all-shapes-n0..8=2056 duplicate-rejected=yes invalid-set-rejected=yes inconsistent-order-rejected=yes'

      - name: Write review evidence for fixed bytes
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0030/${cid}`,boundary=`${out}/source_boundary.json`,fixture=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0030-traversal-postorder-20260825-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'Source preserves preorder/inorder to postorder only; node-value uniqueness, validity guarantees, scale, recursion policy and signature are not preserved.',
            'The fixed candidate now contains a standalone compilable Java class while keeping unique integer values explicitly scoped as its executable contract rather than a source fact.',
            'Preorder root selection, inorder partitioning and leftSize-based preorder slicing are mechanically consistent with direct left-right-root emission and require no intermediate tree allocation.',
            'The hash index removes repeated inorder scans, supporting expected O(n) total time; recursion depth still reaches O(n) for a degenerate tree and is disclosed.',
            'Duplicate value ambiguity and inconsistent traversals fail closed instead of being silently guessed.',
            'The independent fixture matches direct conversion against generated postorder for all 2056 binary-tree shapes through eight nodes and covers malformed inputs; no hard failure remains.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0030.traversal-postorder.v2',decision:'pass',revision_round:2,source_packet:['note_tagged/68307f6d0000000023017c20.json','note_structured/68307f6d0000000023017c20.json',boundary,candidate,fixture],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,writer:{writer_id:'content-batch-0030-traversal-postorder-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'source-boundary',title:'Frozen preorder/inorder to postorder source boundary',locator:boundary,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Exhaustive binary-tree-shape traversal oracle through eight nodes',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Traversal postorder independent source-first review v2',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source requests preorder plus inorder to postorder conversion but does not preserve uniqueness, validity, scale or signature constraints.',source_ids:['source-boundary','isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节','易错点']},{claim_id:'direct-conversion',text:'Under the explicit unique-value valid-traversal fixture contract, indexed recursion emits correct postorder directly for every binary-tree shape through eight nodes and rejects malformed or ambiguous inputs.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac TraversalPostorder.java TraversalPostorderTest.java && java TraversalPostorderTest',result:'pass',reported_stdout:'PASS example=yes all-shapes-n0..8=2056 duplicate-rejected=yes invalid-set-rejected=yes inconsistent-order-rejected=yes',checks:['standalone candidate Java compilation','all 2056 tree shapes n=0..8','duplicate ambiguity rejected','mismatched sets rejected','structural inconsistency rejected'],boundary_tests:[{case:'all unique tree shapes n=0..8',expected:'conversion equals independent postorder oracle',actual:'PASS all-shapes-n0..8=2056',passed:true},{case:'duplicate values',expected:'reject',actual:'PASS duplicate-rejected=yes',passed:true},{case:'mismatched traversal sets',expected:'reject',actual:'PASS invalid-set-rejected=yes',passed:true},{case:'inconsistent traversal structure',expected:'reject',actual:'PASS inconsistent-order-rejected=yes',passed:true}]},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0030.traversal-postorder.v2',independent:true,decision:'pass',revision_round:2,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md';
          let text=fs.readFileSync(task,'utf8');
          const old='- [ ] `cq_q_6d58c327c55f005301c8a0b6759c1147` writer stage complete: the candidate derives postorder directly from preorder/inorder without fabricating a hidden unique-value guarantee, explicitly rejects duplicate-value ambiguity in its executable contract, and validates all binary-tree shapes through 8 nodes plus malformed inputs. Promotion remains blocked on isolated independent review and downstream evidence/strict gates.';
          const next='- [x] `cq_q_6d58c327c55f005301c8a0b6759c1147` candidate passed independent source-first review after the standalone-Java audit remediation: the source-boundary gap around node-value uniqueness remains explicit, direct conversion matches all 2056 binary-tree shapes through 8 nodes, and ambiguous or inconsistent inputs fail closed. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(old)) throw new Error('writer note missing');
          fs.writeFileSync(task,text.replace(old,next));
          NODE

      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during traversal postorder v2 review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0030/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0030 traversal postorder candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
