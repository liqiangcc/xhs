name: Review Content Batch 0036 Daily Temperatures

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0036-daily-temperatures.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-daily-temperatures-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_870fc85ff34de337bdcf1e05799217ca
  EXPLICIT_QID: 870fc85ff34de337bdcf1e05799217ca
  SHORTHAND_QID: 85d552bc1c5e793996cb2ea34fe2e614

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and reviewer-owned oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          test -f "$candidate"
          rm -rf "$out/reviewer_tmp"
          mkdir -p "$out/reviewer_tmp"

          # Phase A deliberately excludes writer_research, prior evidence, formal-answer
          # history and remediation ledgers. Review the primary source, candidate and
          # current answer standard first, then execute the candidate code independently.
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID, explicit=process.env.EXPLICIT_QID, shorthand=process.env.SHORTHAND_QID;
          const primary=[
            ['note_tagged/68be8049000000001c03cc9a.json',explicit,'算法手撕：每日温度（Daily Temperatures）。'],
            ['note_tagged/680e66cb0000000023012aa3.json',shorthand,'算法：温度 (单调栈)'],
          ];
          for(const [file,qid,text] of primary){
            const note=JSON.parse(fs.readFileSync(file,'utf8'));
            const q=(note.tagged_questions||[]).find(x=>x.question_id===qid);
            if(!q||q.original_question!==text) throw new Error(`${qid}: primary source drifted: ${q?.original_question}`);
          }
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']){
            if(md.split(h).length!==2) throw new Error(`section missing/duplicated: ${h}`);
          }
          for(const marker of ['public final class DailyTemperatures','daysUntilWarmer','temperatures[i] > temperatures[stack.peek()]','answer[j] = i - j','严格 `>`','来源没有保存完整函数签名','接口细节是为了复习与测试显式采用的合同','`null` 不在本候选采用的输入合同内']){
            if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          }
          if((md.match(/- 问：/g)||[]).length<6) throw new Error('question-specific followups insufficient');
          if(/真实项目里我|线上事故|我们生产|实际线上/.test(md)) throw new Error('fabricated project-experience language detected');
          const code=md.match(/```java\n([\s\S]*?)\n```/);
          if(!code) throw new Error('Java code block missing');
          fs.writeFileSync(`review/content_build/answer_batch_0036/${cid}/reviewer_tmp/DailyTemperatures.java`,code[1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/DailyTemperaturesReviewer.java" <<'JAVA'
          import java.util.Arrays;
          import java.util.Random;

          public final class DailyTemperaturesReviewer {
              static int[] oracle(int[] a) {
                  int[] out = new int[a.length];
                  for (int i = 0; i < a.length; i++) {
                      for (int j = i + 1; j < a.length; j++) {
                          if (a[j] > a[i]) { out[i] = j - i; break; }
                      }
                  }
                  return out;
              }
              static void check(int[] a, int[] expected) {
                  int[] actual = DailyTemperatures.daysUntilWarmer(a);
                  if (!Arrays.equals(actual, expected)) {
                      throw new AssertionError("input=" + Arrays.toString(a)
                              + " expected=" + Arrays.toString(expected)
                              + " actual=" + Arrays.toString(actual));
                  }
              }
              public static void main(String[] args) {
                  check(new int[]{73,74,75,71,69,72,76,73}, new int[]{1,1,4,2,1,1,0,0});
                  check(new int[]{70,70,71}, new int[]{2,1,0});
                  check(new int[]{71,70,70,72}, new int[]{3,2,1,0});
                  check(new int[]{60,50,40,30}, new int[]{0,0,0,0});
                  check(new int[]{30,40,50,60}, new int[]{1,1,1,0});
                  check(new int[]{}, new int[]{});
                  check(new int[]{42}, new int[]{0});
                  check(new int[]{70,71,70,71,72}, new int[]{1,3,1,1,0});

                  Random r = new Random(2026082602L);
                  long elements = 0;
                  for (int round = 0; round < 3000; round++) {
                      int n = r.nextInt(96);
                      int[] a = new int[n];
                      for (int i = 0; i < n; i++) a[i] = -30 + r.nextInt(151);
                      int[] expected = oracle(a);
                      int[] actual = DailyTemperatures.daysUntilWarmer(a);
                      if (!Arrays.equals(actual, expected)) {
                          throw new AssertionError("round=" + round + " input=" + Arrays.toString(a));
                      }
                      elements += n;
                  }
                  System.out.println("PASS fixed=8 randomized=3000 oracle=quadratic-first-strictly-warmer duplicates=true decreasing=true increasing=true empty=true single=true checked-elements=" + elements);
              }
          }
          JAVA
          javac "$out/reviewer_tmp/DailyTemperatures.java" "$out/reviewer_tmp/DailyTemperaturesReviewer.java"
          reviewer_stdout="$(java -cp "$out/reviewer_tmp" DailyTemperaturesReviewer)"
          case "$reviewer_stdout" in
            PASS\ fixed=8\ randomized=3000\ oracle=quadratic-first-strictly-warmer\ duplicates=true\ decreasing=true\ increasing=true\ empty=true\ single=true\ checked-elements=*) ;;
            *) echo "unexpected reviewer validation output: $reviewer_stdout"; exit 1 ;;
          esac

          REVIEWER_STDOUT="$reviewer_stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-daily-temperatures-20260826-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const boundaryTests=[
            {case:'canonical mixed example',expected:'[1,1,4,2,1,1,0,0]',passed:true},
            {case:'equal temperatures 70,70,71',expected:'strict > keeps first day pending for distance 2',passed:true},
            {case:'decreasing sequence',expected:'all zero because no future warmer day',passed:true},
            {case:'3000 deterministic randomized arrays',expected:'exact agreement with independent quadratic first-strictly-warmer oracle',passed:true}
          ];
          const findings=[
            'The repository preserves an explicit Daily Temperatures title and a same-relation shorthand that names a monotonic stack; complete API, numeric bounds, null behavior and examples are not preserved source facts.',
            'The candidate labels next-strictly-warmer distance semantics as an adopted executable contract instead of presenting missing details as source text.',
            'Indices, strict > comparison and i-j resolution implement the adopted nearest-warmer contract and correctly preserve equal-temperature waiting positions.',
            'Java extracted directly from the candidate compiles and matches a reviewer-owned quadratic oracle on eight fixed cases plus 3000 deterministic randomized arrays.',
            'The monotonic unresolved-stack invariant supports nearest-match correctness and O(n) amortized time with O(n) worst-case auxiliary space.',
            'No fabricated production experience or unsupported source-specific implementation constraint was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({
            schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,
            command:'extract candidate Java; javac DailyTemperatures.java DailyTemperaturesReviewer.java; java DailyTemperaturesReviewer',
            stdout:process.env.REVIEWER_STDOUT,
            checks:['candidate code compiles directly','mixed example','duplicates','increasing/decreasing','empty/single under adopted local contract','3000 deterministic randomized arrays'],
            boundary_tests:boundaryTests,
            oracle:'independent quadratic first strictly-warmer scan'
          },null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,
            review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'daily-temperatures.v2',decision:'pass',revision_round:2,
            source_packet:['note_tagged/68be8049000000001c03cc9a.json','note_tagged/680e66cb0000000023012aa3.json',candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,
            promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');
          NODE

      - name: Bind evidence only after source-first conclusion
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,explicit=process.env.EXPLICIT_QID,shorthand=process.env.SHORTHAND_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const review=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          if(review.decision!=='pass'||review.candidate_sha256!==hash) throw new Error('isolated-review binding drifted');

          // Historical/writer records are intentionally first opened here, after the independent conclusion.
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8'));
          const reviewerValidation=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writerValidation.result!=='pass'||reviewerValidation.result!=='pass') throw new Error('post-conclusion evidence prerequisite drifted');
          for(const qid of [explicit,shorthand]) if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error(`${qid}: writer coverage missing`);

          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,
            writer:{writer_id:'daily-temperatures-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'explicit-source',title:'Exact Daily Temperatures interview source wording',locator:`note_tagged/68be8049000000001c03cc9a.json#question_id=${explicit}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'shorthand-source',title:'Consolidated temperature monotonic-stack shorthand source',locator:`note_tagged/680e66cb0000000023012aa3.json#question_id=${shorthand}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'relation-review',title:'Source-first same-relation review',locator:'review/content_build/answer_batch_0036/temperature_relation_review.md',source_type:'repository_structured_source',checked_at:date},
              {source_id:'writer-validation',title:'Writer quadratic-oracle validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'reviewer-validation',title:'Independent candidate-code compilation and quadratic-oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The survivor covers both consolidated temperature sources while full API and numeric constraints remain non-source assumptions.',source_ids:['explicit-source','shorthand-source','relation-review'],answer_locations:['核心结论','3 分钟版','关键细节']},
              {claim_id:'algorithm-correctness',text:'The candidate Java monotonic stack matches independent quadratic first-strictly-warmer validation across fixed and randomized inputs.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']},
              {claim_id:'strict-comparison',text:'Equal temperatures do not resolve a waiting day under the adopted strict-warmer contract.',source_ids:['writer-validation','reviewer-validation'],answer_locations:['1 分钟版','关键细节','常见追问','易错点']}
            ],
            source_question_coverage:[
              {question_id:explicit,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']},
              {question_id:shorthand,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']}
            ],
            validation:{
              command:reviewerValidation.command,
              result:'pass',
              reported_stdout:reviewerValidation.stdout,
              checks:reviewerValidation.checks,
              boundary_tests:reviewerValidation.boundary_tests
            },
            review_state:'independent_source_first_review_passed',
            review:{reviewer_id:review.reviewer_id,review_version:'daily-temperatures.v2',independent:true,decision:'pass',revision_round:2,scores:review.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:review.findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_870fc85ff34de337bdcf1e05799217ca` Daily Temperatures survivor now has a source-bounded candidate covering both consolidated source Questions, an explicit next-strictly-warmer distance contract, complete Java index-monotonic-stack implementation, fixed boundary tests, and 5000 deterministic randomized arrays checked against an independent quadratic oracle. Writer research is frozen; isolated source-first review remains pending before promotion.';
          const passed='- [x] `cq_q_870fc85ff34de337bdcf1e05799217ca` Daily Temperatures survivor covers both consolidated source Questions without inventing missing API constraints, uses complete Java strict-warmer monotonic-stack logic, passes writer plus independent reviewer oracle validation including duplicate-temperature boundaries and thousands of deterministic randomized arrays, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE
          node scripts/xhs.js review integrity --noWrite

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          rm -rf "$out/reviewer_tmp"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during Daily Temperatures review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$out/reviewer_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0036 daily-temperatures source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
