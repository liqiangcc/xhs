          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md';let t=fs.readFileSync(task,'utf8'),p='- Rotate-list canonical `'+cid+'` has a source-bounded right-rotation candidate with exact Java fence, identity/no-cycle validation, and writer evidence; isolated review and promotion gates remain pending.';if(!t.includes(p))t=t.trimEnd()+'\n'+p+'\n';fs.writeFileSync(task,t);
