name: Apply Boundary Review Batch 002 Decisions

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .boundary-review-batch-002-decision-trigger

permissions:
  contents: write

jobs:
  decide:
    if: "${{ github.event.head_commit.message == 'chore: apply boundary review batch 002 decisions' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Record source-first decisions and merge plan
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const decisionsPath = 'data/manifests/canonical/boundary_review_decisions.json';
          const batchPath = 'review/content_build/canonical_boundary_review/batch_002/candidates.json';
          const outDir = 'review/content_build/canonical_boundary_review/batch_002';
          const manifest = JSON.parse(fs.readFileSync(decisionsPath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          const byCandidate = new Map(batch.candidates.map((row) => [row.candidate_id, row]));
          const decisions = [
            { candidate_id: 'boundary_cq_q_2c3c4fa1085402b330b5eb2cbf14ce60_cq_q_6c4969d7501911e36aaf755387eb1dbf', decision: 'merge', note: 'Both sources ask the Redis distributed-lock implementation. SETNX/Redisson details belong to the same implementation answer boundary.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_36ab1630843f456fa940c19962292fbe_cq_q_4a4761c79b9ebbb35a45eaf3843caca0', decision: 'merge', note: 'Both sources are the same coding problem: implement/simulate a queue with two stacks.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_3d5d13acdab083a156ef517c912f63ab_cq_q_5c1699c7cf7b705eb01cafc6bdd48dfe', decision: 'merge', note: 'Both sources ask the common ways to create a thread in Java and share the same expected concept answer.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_405f5367d452cfc3e19f514578adef21_cq_q_ff4897f985ff6ed6678f7d1a1647571f', decision: 'merge', note: 'Both sources ask the Eureka-versus-Nacos comparison; registry-center context is supporting detail.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_459c9ce67b30af74fd840fadf1a81777_cq_q_92bced868d60db4a3b27a97e5c21d612', decision: 'merge', note: 'Both sources ask for the core object-oriented features and their meaning; wording depth does not create a separate boundary.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_5ea01f4bcfdcbee565a8b166c60d2171_cq_q_749edd1b264c7f3a2e9fa03c8f784f3f', decision: 'merge', note: 'Both sources ask the Spring-versus-Spring-Boot comparison; auto-configuration is a comparison dimension, not a separate question.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_78495b0e35fd0d2cbf1880f79c74168d_cq_q_8d628ccd4f53104177c00bbca4528c1a', decision: 'merge', note: 'Both sources ask the Java-versus-C++ comparison with the same semantic boundary.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_d0b70d126320ddd7e4a234f0f3c6066f_cq_q_d6793c017bd5cd31952352d7a0e98464', decision: 'keep_separate', note: 'Finding the m-th node from the end and deleting the n-th node from the end share a two-pointer technique but have different output contracts, edge cases and coding implementations.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_391a80e26ea1b198baf27e6c1d19942d_cq_q_84293eb0fbaef6a59844fe11efd5079b', decision: 'merge', note: 'Both sources ask Spring AOP implementation; dynamic proxy, bytecode enhancement and weaving timing are completion details of the same mechanism answer.', reviewed_at: '2026-08-17' },
            { candidate_id: 'boundary_cq_q_3c967c50a4bd11dff1090f6e011e872d_cq_topic_2494ec69', decision: 'merge', note: 'Both sources ask Redis RDB/AOF persistence. Underlying execution principles deepen the existing persistence-mechanism asset rather than creating a new core question.', reviewed_at: '2026-08-17' },
          ];
          const existing = new Map(manifest.items.map((item) => [item.candidate_id, item]));
          for (const decision of decisions) {
            if (!byCandidate.has(decision.candidate_id)) throw new Error(`batch candidate missing: ${decision.candidate_id}`);
            if (existing.has(decision.candidate_id)) throw new Error(`decision already exists: ${decision.candidate_id}`);
            manifest.items.push(decision);
          }
          fs.writeFileSync(decisionsPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const mergePlan = [
            { target: 'cq_q_6c4969d7501911e36aaf755387eb1dbf', source: 'cq_q_2c3c4fa1085402b330b5eb2cbf14ce60', candidate_id: decisions[0].candidate_id },
            { target: 'cq_q_36ab1630843f456fa940c19962292fbe', source: 'cq_q_4a4761c79b9ebbb35a45eaf3843caca0', candidate_id: decisions[1].candidate_id },
            { target: 'cq_q_3d5d13acdab083a156ef517c912f63ab', source: 'cq_q_5c1699c7cf7b705eb01cafc6bdd48dfe', candidate_id: decisions[2].candidate_id },
            { target: 'cq_q_405f5367d452cfc3e19f514578adef21', source: 'cq_q_ff4897f985ff6ed6678f7d1a1647571f', candidate_id: decisions[3].candidate_id },
            { target: 'cq_q_92bced868d60db4a3b27a97e5c21d612', source: 'cq_q_459c9ce67b30af74fd840fadf1a81777', candidate_id: decisions[4].candidate_id },
            { target: 'cq_q_749edd1b264c7f3a2e9fa03c8f784f3f', source: 'cq_q_5ea01f4bcfdcbee565a8b166c60d2171', candidate_id: decisions[5].candidate_id },
            { target: 'cq_q_8d628ccd4f53104177c00bbca4528c1a', source: 'cq_q_78495b0e35fd0d2cbf1880f79c74168d', candidate_id: decisions[6].candidate_id },
            { target: 'cq_q_84293eb0fbaef6a59844fe11efd5079b', source: 'cq_q_391a80e26ea1b198baf27e6c1d19942d', candidate_id: decisions[8].candidate_id },
            { target: 'cq_topic_2494ec69', source: 'cq_q_3c967c50a4bd11dff1090f6e011e872d', candidate_id: decisions[9].candidate_id },
          ];
          fs.writeFileSync(path.join(outDir, 'review_result.json'), `${JSON.stringify({ schema_version: 'canonical_boundary_review_result.v1', batch_id: 'batch_002', source_first: true, historical_reviewer_decisions_read_before_conclusion: false, decisions, merge_plan: mergePlan }, null, 2)}\n`);
          fs.writeFileSync('/tmp/batch-002-merge-plan.json', JSON.stringify(mergePlan));
          NODE

      - name: Inventory all assets referenced by planned merges
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const plan = JSON.parse(fs.readFileSync('/tmp/batch-002-merge-plan.json', 'utf8'));
          function exists(p) { return fs.existsSync(p); }
          function refs(id) {
            try {
              const out = cp.execFileSync('git', ['grep', '-l', '-F', id, '--', 'review', 'data/manifests'], { encoding: 'utf8' });
              return out.split(/\r?\n/).filter(Boolean).sort();
            } catch (error) {
              if (error.status === 1) return [];
              throw error;
            }
          }
          const rows = plan.map((item) => ({ ...item, source_assets: { formal_answer: exists(`review/answers/${item.source}.md`), candidate_answer: exists(`review/candidates/answers/${item.source}.md`), evidence: exists(`review/evidence/${item.source}.json`), references: refs(item.source) }, target_assets: { formal_answer: exists(`review/answers/${item.target}.md`), candidate_answer: exists(`review/candidates/answers/${item.target}.md`), evidence: exists(`review/evidence/${item.target}.json`), references: refs(item.target) } }));
          fs.writeFileSync('review/content_build/canonical_boundary_review/batch_002/merge_asset_inventory.json', `${JSON.stringify({ schema_version: 'canonical_merge_asset_inventory.v1', batch_id: 'batch_002', rows }, null, 2)}\n`);
          NODE

      - name: Regenerate candidate queue with recorded decisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_canonical_boundaries.js
          node scripts/content/audit_canonical_boundaries.js --check
          node - <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('data/manifests/canonical/long_tail_duplicate_candidates.jsonl', 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const pending = rows.filter((row) => row.reviewer_decision === 'pending');
          if (pending.length !== 70) throw new Error(`expected 70 pending after batch 002 decisions, got ${pending.length}`);
          NODE

      - name: Verify repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run ci:check

      - name: Commit review decisions and inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "content: review canonical boundary batch 002"

      - name: Remove temporary decision workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .boundary-review-batch-002-decision-trigger .github/workflows/apply-boundary-review-batch-002.yml
          git add -A
          git commit -m "chore: remove boundary review batch 002 decision workflow"

      - name: Push reviewed boundary state
        shell: bash
        run: git push origin HEAD:content/quality-completion
