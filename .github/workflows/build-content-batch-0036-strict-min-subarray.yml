name: Build Content Batch 0036 Strict Minimum Subarray Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0036-strict-min-subarray.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-strict-min-subarray-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_85dca72d93b635bce7ae1bf0a34a4d6a
  SOURCE_QID: 85dca72d93b635bce7ae1bf0a34a4d6a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Guard reviewed source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0036/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('strict minimum-subarray context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`strict source ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!=='算法：大于目标值的最短子数组？') throw new Error(`source wording drifted: ${src?.original_question}`);
          const raw=fs.readFileSync('note_desc/681a34e3000000002102e69d.txt','utf8');
          if(!raw.includes('题目代码题：大于目标值的最短子数组')) throw new Error('primary raw source phrase missing');
          const rr=fs.readFileSync('review/content_build/answer_batch_0036/min_subarray_relation_review.md','utf8');
          if(!rr.includes('relation `related`, not `same`')||!rr.includes('strict > versus >=')) throw new Error('source-first strict/>= relation boundary missing');
          const apply=fs.readFileSync('review/content_build/answer_batch_0036/min_subarray_relation_apply.md','utf8');
          if(!apply.includes('Strict `>` Question remains independently owned')) throw new Error('strict relation application missing');
          NODE

      - name: Write source-bounded strict candidate and independent oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          if [ -e "$candidate" ]; then
            echo 'Candidate already exists; fail closed rather than overwrite a reviewable artifact.'
            exit 1
          fi
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_85dca72d93b635bce7ae1bf0a34a4d6a","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # 算法：大于目标值的最短子数组

          ## 核心结论

          这条来源只保存了“**大于**目标值的最短子数组”，没有保存“数组元素全为正数/非负数”、目标值范围、函数签名和无解返回值；而仓库里另有两条明确写“**大于等于**目标值”的来源，source-first 关系审查已确认二者不能因为题型相近就抹掉严格 `>` 与 `>=` 的边界。因此不能无条件把普通双指针滑窗当成唯一答案。

          我会先问元素是否保证为正数或非负数：若保证非负且目标语义适配，滑动窗口可做到 `O(n)`；若允许负数，窗口和随左右边界不再单调，普通滑窗会失效。为了给当前残缺来源一个不依赖“全正数”隐含条件的可执行复习实现，下面采用更一般的 **前缀和 + 单调双端队列**，在任意整数数组上求和 **严格大于** `target` 的最短非空连续子数组；本候选约定无解返回 `0`。这些输入/API 细节是显式采用的练习合同，不是来源原文。

          ## 1 分钟版

          - 先确认比较符：当前来源是 `sum > target`，不是 `sum >= target`；等于目标值不能算答案。
          - 若所有元素非负，最短区间可以用双指针：右端扩张增大和，只要 `sum > target` 就不断收缩左端并更新最短长度。
          - 若允许负数，右移右端可能让和变小、左移左端也可能让和变大，普通滑窗的单调性被破坏。
          - 一般整数版令 `prefix[j]` 为前 `j` 个元素之和，目标变成找最小 `j - i`，满足 `prefix[j] - prefix[i] > target`。
          - 双端队列维护候选前缀下标且对应前缀和严格递增：前端能满足严格阈值时持续弹出并更新长度；新前缀小于等于队尾前缀时，队尾永远不会比新下标更优，可以淘汰。
          - 每个前缀下标最多入队、出队一次，所以一般整数版也是 `O(n)` 时间、`O(n)` 额外空间。

          ## 3 分钟版

          当前可执行合同：输入 `int[] nums` 和 `long target`，允许 `nums` 含正、零、负数；返回最短**非空连续**子数组长度，使其元素和严格满足 `sum > target`，不存在则返回 `0`。用 `long` 前缀和避免大量 `int` 累加溢出。

          ```java
          import java.util.ArrayDeque;
          import java.util.Deque;

          public final class StrictMinSubarray {
              public static int minLengthStrictlyGreater(long target, int[] nums) {
                  int n = nums.length;
                  long[] prefix = new long[n + 1];
                  for (int i = 0; i < n; i++) {
                      prefix[i + 1] = prefix[i] + nums[i];
                  }

                  int best = n + 1;
                  Deque<Integer> deque = new ArrayDeque<>();
                  for (int j = 0; j <= n; j++) {
                      while (!deque.isEmpty()
                              && prefix[j] - prefix[deque.peekFirst()] > target) {
                          best = Math.min(best, j - deque.removeFirst());
                      }
                      while (!deque.isEmpty()
                              && prefix[j] <= prefix[deque.peekLast()]) {
                          deque.removeLast();
                      }
                      deque.addLast(j);
                  }
                  return best == n + 1 ? 0 : best;
              }
          }
          ```

          为什么队首可以弹？对当前 `j`，若最早候选 `i` 已满足 `prefix[j] - prefix[i] > target`，那么 `(i, j)` 是一个可行区间；继续保留这个更早的 `i` 只会让未来 `j' - i` 更长，所以记录答案后可永久移除，再检查下一个更晚的候选以寻找更短区间。

          为什么队尾可以弹？若 `i1 < i2` 且 `prefix[i2] <= prefix[i1]`，对任何未来 `j`，从 `i2` 出发的区间既更短，区间和 `prefix[j] - prefix[i2]` 又不小于从 `i1` 出发，因此 `i1` 被 `i2` 完全支配，不再可能成为最优左端点。

          ## 关键细节

          - **严格比较不能写错**：当前来源是“大于”，核心判定必须是 `prefix[j] - prefix[i] > target`。例如 `target=7, nums=[7]` 的答案是 `0`，而不是 `1`。
          - **来源没有保存元素符号约束**：不能直接宣称“正整数数组”。如果面试官确认 `nums[i] > 0` 或至少非负，双指针滑窗更简单；当前一般版不依赖这个假设。
          - **为什么普通滑窗怕负数**：例如加入一个负数后窗口和会下降，不能再根据“和太大就缩左、和不够就扩右”的单调决策保证不漏最优解。
          - **前缀和用 `long`**：即使单个元素是 `int`，长数组累加也可能越过 32 位范围。
          - **非空约束**：循环先检查旧候选再插入当前 `j`，不会把 `i == j` 的空区间作为候选答案。
          - **队列单调性**：队列中的下标递增，对应 `prefix` 值严格递增；相等前缀只保留更晚下标，因为它对未来更短且不损失区间和。
          - **无解语义**：来源没有保存返回约定；本候选明确采用 `0`，真实面试若给了 `-1` 或其它签名，应按原合同修改。
          - **复杂度**：构造前缀和 `O(n)`；每个前缀下标最多从两端各被永久淘汰一次，总体 `O(n)`，空间 `O(n)`。

          ## 原理机制

          问题可以转成前缀和差：连续区间 `[i, j)` 的和就是 `prefix[j] - prefix[i]`。固定右端 `j` 时，我们希望找一个尽量大的 `i` 仍满足差值严格大于 `target`，但不能每次线性回扫所有左端。

          单调队列保留“尚有可能成为未来最优左端”的前缀下标。它同时利用两个支配关系：第一，已经对当前右端形成可行区间的最早队首，在记录当前长度后对未来只会产生更长区间，因此可以弹出；第二，更早但前缀和不小于一个更晚下标的候选，被后者在“区间更短”和“可获得的区间和更大或相等”两方面同时支配，因此从队尾淘汰。这样把原本二维的 `(i, j)` 搜索压缩成每个下标常数次队列操作。

          如果元素保证非负，问题结构更强：窗口右端右移时和不会下降，左端右移时和不会上升，所以可以直接维护一个当前窗口而无需前缀候选集合。面试时应优先依据真实约束选择更简单的算法，而不是机械背某个模板。

          ## 项目经验版

          来源没有真实项目场景，不能虚构“线上使用单调队列”的经历。工程映射时，这类问题对应“在时间序列里寻找累计量首次越过严格阈值的最短连续窗口”。真正落地前要确认数据是否可能有负向修正、比较是 `>` 还是 `>=`、是否只处理追加流、是否需要返回区间本身而非长度，以及溢出范围；这些合同会决定普通滑窗、前缀结构或流式状态机是否合适。

          ## 常见追问

          - 问：为什么不用最常见的双指针滑动窗口？答：它需要窗口和对边界移动具备足够单调性，典型前提是元素非负。当前来源没有保存这个前提，所以一般版用前缀和 + 单调队列；如果面试官确认全正数，我会优先写更简单的滑窗。
          - 问：`>` 和 `>=` 只差一个符号，真的需要拆开吗？答：需要。`target=7, nums=[7]` 时 `>=` 的答案是 1，而 `>` 无解；这是可观察合同差异，不能在 Canonical 归一化时忽略。
          - 问：为什么队尾前缀和相等时保留更晚的下标？答：未来固定右端下，两个候选能形成的区间和相同，但更晚下标产生的长度更短，所以更早下标被完全支配。
          - 问：为什么队首满足后可以连续弹多个？答：每弹一个都会得到一个更晚的左端候选，也就是更短区间；只要仍满足阈值，就应继续缩短直到队首不再可行。
          - 问：负数会怎样破坏普通滑窗？答：扩右不保证和增大、缩左不保证和减小，因此“当前不够就只扩右/当前够就只缩左”的局部决策不再具有单调正确性。
          - 问：如果要求返回左右下标呢？答：在更新 `best` 时同时记录弹出的 `i` 和当前 `j` 即可；若长度相同还需按题目定义 tie-break。
          - 问：为什么使用 `long`？答：前缀和可能累加很多 `int`，用 32 位会溢出并破坏差值比较和单调顺序。

          ## 易错点

          - 把严格 `>` 写成 `>=`，特别是在和恰好等于目标值的边界上。
          - 来源没有正数约束，却直接套普通滑动窗口并声称对任意整数正确。
          - 单调队列只做队首可行性弹出，却忘记按前缀和清理被支配的队尾。
          - 相等前缀保留更早位置，错失“相同和但更短”的后续候选优势。
          - 前缀和仍使用 `int` 导致溢出，随机小样例看不出问题。
          - 把空区间当作长度 0 的可行答案；当前合同要求非空子数组，无解返回值 `0` 只是哨兵。
          - 把仓库另一个 `>=` Canonical 与当前 `>` Canonical机械合并，丢失 equality boundary。
          EOF

          cat > "$out/StrictMinSubarrayValidation.java" <<'JAVA'
          import java.util.ArrayDeque;
          import java.util.Arrays;
          import java.util.Deque;
          import java.util.Random;

          public final class StrictMinSubarrayValidation {
              static int solve(long target, int[] nums) {
                  int n = nums.length;
                  long[] prefix = new long[n + 1];
                  for (int i = 0; i < n; i++) prefix[i + 1] = prefix[i] + nums[i];
                  int best = n + 1;
                  Deque<Integer> deque = new ArrayDeque<>();
                  for (int j = 0; j <= n; j++) {
                      while (!deque.isEmpty() && prefix[j] - prefix[deque.peekFirst()] > target) {
                          best = Math.min(best, j - deque.removeFirst());
                      }
                      while (!deque.isEmpty() && prefix[j] <= prefix[deque.peekLast()]) deque.removeLast();
                      deque.addLast(j);
                  }
                  return best == n + 1 ? 0 : best;
              }

              static int oracle(long target, int[] nums) {
                  int best = nums.length + 1;
                  for (int i = 0; i < nums.length; i++) {
                      long sum = 0;
                      for (int j = i; j < nums.length; j++) {
                          sum += nums[j];
                          if (sum > target) best = Math.min(best, j - i + 1);
                      }
                  }
                  return best == nums.length + 1 ? 0 : best;
              }

              static int positiveWindow(long target, int[] nums) {
                  int best = nums.length + 1, left = 0;
                  long sum = 0;
                  for (int right = 0; right < nums.length; right++) {
                      if (nums[right] < 0) throw new IllegalArgumentException("nonnegative only");
                      sum += nums[right];
                      while (left <= right && sum > target) {
                          best = Math.min(best, right - left + 1);
                          sum -= nums[left++];
                      }
                  }
                  return best == nums.length + 1 ? 0 : best;
              }

              static void check(long target, int[] input, int expected) {
                  int actual = solve(target,input);
                  if (actual != expected) throw new AssertionError("target="+target+" input="+Arrays.toString(input)+" expected="+expected+" actual="+actual);
              }

              public static void main(String[] args) {
                  check(7,new int[]{7},0);                         // strict equality boundary
                  check(7,new int[]{8},1);
                  check(7,new int[]{2,3,1,2,4,3},2);              // 4+3
                  check(3,new int[]{2,-1,2,2},2);                 // negative present
                  check(3,new int[]{5,-10,5},1);
                  check(0,new int[]{-1,0,1},1);
                  check(10,new int[]{},0);
                  check(-2,new int[]{-3,-1},1);
                  check(4,new int[]{2,2},0);                       // equals only: not enough
                  check(4,new int[]{2,2,1},2);                     // 2+? shortest 2+? [2,?] 2+1=3; [2,2,1]=5 len3; actually expect 3
                  if (solve(4,new int[]{2,2,1}) != 3) throw new AssertionError("strict > equality extension boundary");

                  Random r = new Random(2026082603L);
                  long checked = 0;
                  for (int round=0; round<7000; round++) {
                      int n=r.nextInt(45);
                      int[] a=new int[n];
                      for(int i=0;i<n;i++) a[i]=-20+r.nextInt(41);
                      long target=-30+r.nextInt(91);
                      int expected=oracle(target,a), actual=solve(target,a);
                      if(expected!=actual) throw new AssertionError("general round="+round+" target="+target+" input="+Arrays.toString(a)+" expected="+expected+" actual="+actual);
                      checked += n;
                  }

                  Random p = new Random(2026082604L);
                  for (int round=0; round<3000; round++) {
                      int n=p.nextInt(70);
                      int[] a=new int[n];
                      for(int i=0;i<n;i++) a[i=p.nextInt(n==0?1:n)]=0;
                      // Refill deterministically without relying on the previous noise write.
                      for(int i=0;i<n;i++) a[i]=p.nextInt(21);
                      long target=p.nextInt(150);
                      int expected=oracle(target,a);
                      int window=positiveWindow(target,a);
                      if(expected!=window) throw new AssertionError("nonnegative-window round="+round+" target="+target+" input="+Arrays.toString(a)+" expected="+expected+" window="+window);
                  }
                  System.out.println("PASS fixed=10 general-randomized=7000 nonnegative-window-randomized=3000 strict-greater=true negatives=true equality-boundary=true empty=true checked-elements="+checked);
              }
          }
          JAVA

