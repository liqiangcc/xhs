name: Refresh Content Batch 0048 Max Subarray Survivor

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/refresh-content-batch-0048-max-subarray-survivor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0048-max-subarray-survivor
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_aee86527c929ecb06715c2c4d2fd738f
  QID_A: aee86527c929ecb06715c2c4d2fd738f
  QID_B: c71eb16010f7db00a06b21f9feff2569

jobs:
  refresh-review:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze expanded source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0048/$CANONICAL_ID"
          mkdir -p "$out" /tmp/b48-max-subarray review/evidence
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qids=[process.env.QID_A,process.env.QID_B];
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0048/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('survivor context/type drift');
          const actual=[...(ctx.canonical?.question_ids||[])].sort(),expected=[...qids].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`expanded ownership drift: ${JSON.stringify(actual)}`);
          const exact=new Map([[qids[0],'算法：找到最大连续子数组的和'],[qids[1],'算法：和最大的子数组 leetcode 53']]);
          for(const qid of qids){const q=(ctx.source_questions||[]).find(x=>x.question_id===qid);if(!q||q.original_question!==exact.get(qid)||q.is_valid_for_library!==true)throw new Error(`${qid}: exact source drift`);}
          const relation=fs.readFileSync('review/content_build/answer_batch_0048/max_subarray_relation/relation_review.md','utf8');
          if(!relation.includes('Relation: `same`')||!relation.includes(cid)) throw new Error('fresh source-first relation conclusion missing');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','ending = Math.max','全负数组','连续','O(n)','O(1)']) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md)) throw new Error('fabricated experience risk');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('maxSubarraySum'))throw new Error('candidate Java block missing');
          fs.writeFileSync('/tmp/b48-max-subarray/Solution.java',block[1]+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp/b48-max-subarray /tmp/b48-max-subarray/Solution.java

      - name: Revalidate exact candidate with independent oracles
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b48-max-subarray/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              static long brute(int[] a){long best=Long.MIN_VALUE;for(int l=0;l<a.length;l++){long s=0;for(int r=l;r<a.length;r++){s+=a[r];best=Math.max(best,s);}}return best;}
              static long prefixOracle(int[] a){long[] p=new long[a.length+1];for(int i=0;i<a.length;i++)p[i+1]=p[i]+a[i];long best=Long.MIN_VALUE;for(int l=0;l<a.length;l++)for(int r=l+1;r<=a.length;r++)best=Math.max(best,p[r]-p[l]);return best;}
              static void check(int[] a){long got=Solution.maxSubarraySum(a),b=brute(a),p=prefixOracle(a);if(got!=b||got!=p)throw new AssertionError(Arrays.toString(a)+" got="+got+" brute="+b+" prefix="+p);}
              static long exhaustive=0;static void gen(int[] a,int i,int[] vals){if(i==a.length){check(a);exhaustive++;return;}for(int v:vals){a[i]=v;gen(a,i+1,vals);}}
              public static void main(String[] args){
                  check(new int[]{-2,1,-3,4,-1,2,1,-5,4});
                  check(new int[]{-8,-3,-6,-2,-5,-4});
                  check(new int[]{1});
                  check(new int[]{Integer.MAX_VALUE,Integer.MAX_VALUE,Integer.MIN_VALUE});
                  int[] vals={-4,-1,0,2,5};for(int n=1;n<=7;n++)gen(new int[n],0,vals);
                  Random r=new Random(0xB48C71L);for(int t=0;t<25000;t++){int n=1+r.nextInt(100),a[]=new int[n];for(int i=0;i<n;i++)a[i]=r.nextInt(2000001)-1000000;check(a);}
                  try{Solution.maxSubarraySum(new int[0]);throw new AssertionError("empty accepted");}catch(IllegalArgumentException expected){}
                  try{Solution.maxSubarraySum(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}
                  System.out.println("PASS fixed=4 exhaustive="+exhaustive+" random=25000 brute+prefix-oracles=match all-negative+int-extremes=covered empty+null=rejected");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp/b48-max-subarray -d /tmp/b48-max-subarray /tmp/b48-max-subarray/Reviewer.java
          stdout="$(java -cp /tmp/b48-max-subarray Reviewer)"; echo "$stdout"
          grep -E '^PASS fixed=4 exhaustive=[0-9]+ random=25000 brute\+prefix-oracles=match all-negative\+int-extremes=covered empty\+null=rejected$' <<<"$stdout"
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Refresh writer research, independent review, and evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qids=[process.env.QID_A,process.env.QID_B],date='2026-08-28';
          const out=`review/content_build/answer_batch_0048/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const tests=[
            {case:'classic LeetCode-53 shape',expected:'maximum contiguous sum 6',passed:true},
            {case:'all-negative',expected:'largest negative element, never empty-subarray zero',passed:true},
            {case:'all arrays length 1..7 over {-4,-1,0,2,5}',expected:'candidate equals brute-force and prefix-interval oracles',passed:true},
            {case:'25,000 seeded random arrays',expected:'candidate equals both independent oracles',passed:true},
            {case:'integer extremes',expected:'long accumulation preserves int-array sums',passed:true},
            {case:'empty/null',expected:'explicit candidate-contract rejection',passed:true}
          ];
          const validation={schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; exhaustive/random brute-force + prefix-interval oracles',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}};
          fs.writeFileSync(`${out}/survivor_validation.json`,JSON.stringify(validation,null,2)+'\n');
          const sources=[
            {source_id:'source-a',title:'Raw interview source preserving int-array maximum contiguous subarray',locator:'note_desc/659a2c620000000011033b5e.txt',source_type:'repository_source_record',checked_at:date},
            {source_id:'source-b',title:'Independent interview source explicitly naming LeetCode 53 maximum subarray',locator:'note_desc/67d81c93000000001e003502.txt',source_type:'repository_source_record',checked_at:date},
            {source_id:'relation-review',title:'Batch 0048 maximum-subarray source-first relation review',locator:'review/content_build/answer_batch_0048/max_subarray_relation/relation_review.md',source_type:'repository_structured_source',checked_at:date},
            {source_id:'survivor-validation',title:'Expanded-ownership maximum-subarray executable validation',locator:`${out}/survivor_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
            {source_id:'content-standard',title:'Answer content standard',locator:'docs/refactor/09_answer_content_standard.md',source_type:'repository_structured_source',checked_at:date}
          ];
          const claims=[
            {claim_id:'source-contract',text:'Both preserved sources ask for the maximum-sum contiguous-subarray problem; one gives an int array with positive and negative values and the other explicitly names LeetCode 53. Empty-input behavior, numeric width, interval output and implementation language are not jointly source-frozen.',source_ids:['source-a','source-b','relation-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},
            {claim_id:'reference-behavior',text:'For the declared non-empty Java int[] to long reference contract, the exact candidate matches brute-force and prefix-interval oracles across exhaustive bounded arrays, seeded random arrays, all-negative inputs and integer extremes.',source_ids:['survivor-validation'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}
          ];
          const locations=['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问'];
          const coverage=qids.map(question_id=>({question_id,covered:true,answer_locations:locations}));
          const research={schema_version:'answer_writer_research.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources,claims,source_question_coverage:coverage,promotion_blocker:'isolated_independent_review_not_yet_performed'};
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify(research,null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The two independent source records are correctly treated as the same maximum-contiguous-subarray problem after explicit relation review, not as two separate answer contracts.',
            'The candidate remains source-bounded: non-empty Java int[] input, long return width and empty/null rejection are labeled reference-contract choices rather than preserved interview requirements.',
            'The ending-at-i dynamic-programming invariant correctly handles all-negative inputs by initializing from the first element instead of zero.',
            'Two structurally distinct validation oracles match the exact candidate on exhaustive bounded arrays and 25,000 seeded random arrays, including integer-extreme cases.',
            'Source coverage now explicitly reaches both Questions after Canonical consolidation; no fabricated personal or production experience is introduced.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0048-max-subarray-survivor-20260828-v1',review_version:'batch-0048.max-subarray-survivor.v1',decision:'pass',revision_round:1,source_packet:['note_desc/659a2c620000000011033b5e.txt','note_desc/67d81c93000000001e003502.txt','review/content_build/answer_batch_0048/max_subarray_relation/relation_review.md',candidate,`${out}/survivor_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0048-max-subarray-survivor-refresh',writer_version:'xhs-answer-curator.v1'},sources:sources.concat([{source_id:'isolated-review',title:'Expanded-source maximum-subarray isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}]),claims,source_question_coverage:coverage,validation:{command:validation.command,result:'pass',reported_stdout:validation.stdout,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0048.md';
          let text=fs.readFileSync(task,'utf8');
          const line='- [x] Survivor `cq_q_aee86527c929ecb06715c2c4d2fd738f` was revalidated after maximum-subarray Canonical consolidation. Its unchanged source-bounded Kadane candidate now has refreshed two-Question writer research, executable brute-force + prefix-oracle validation, and a fresh isolated source-first PASS covering both the original max-contiguous-subarray source and the LeetCode 53 source. Formal promotion remains blocked by repository human-approval/real-review policy.';
          if(!text.includes(line)) text=text.trimEnd()+`\n${line}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Run strict candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during max-subarray survivor refresh: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add "review/content_build/answer_batch_0048/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0048.md data/manifests/quality/answer_type_audit.json
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No max-subarray survivor refresh changes to commit.'; exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: refresh max-subarray survivor source coverage'
          git push origin "HEAD:$CONTENT_BRANCH"
