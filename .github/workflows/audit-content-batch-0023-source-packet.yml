name: Audit Content Batch 0023 Source Packet

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/audit-content-batch-0023-source-packet.yml

permissions:
  contents: read

concurrency:
  group: content-batch-0023-source-packet
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 1

      - name: Validate frozen source packet and source-first dispositions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import re

          batch = '0023'
          task_path = pathlib.Path(f'tasks/answer-batches/TASK-20260711-0313-answer-batch-{batch}.md')
          packet_json_path = pathlib.Path(f'review/reports/ANSWER_BATCH_{batch}_SOURCE_PACKET.json')
          packet_md_path = pathlib.Path(f'review/reports/ANSWER_BATCH_{batch}_SOURCE_PACKET.md')
          boundary_path = pathlib.Path(f'review/content_build/answer_batch_{batch}/source_boundary_audit.md')

          for path in (task_path, packet_json_path, packet_md_path, boundary_path):
              if not path.exists():
                  raise SystemExit(f'missing required frozen source-first artifact: {path}')

          task = task_path.read_text(encoding='utf-8')
          original_ids = list(dict.fromkeys(re.findall(r'`(cq_q_[0-9a-f]{32})`', task)))
          if len(original_ids) != 10:
              raise SystemExit(f'expected 10 unique original batch Canonicals, got {len(original_ids)}')

          packet = json.loads(packet_json_path.read_text(encoding='utf-8'))
          packet_ids = [entry.get('canonical_id') for entry in packet.get('canonicals') or []]
          if packet.get('schema_version') != 'answer_batch_source_packet.v2' or packet.get('batch') != batch:
              raise SystemExit('frozen source packet schema/batch mismatch')
          if len(packet_ids) != 10 or set(packet_ids) != set(original_ids):
              raise SystemExit(f'frozen source packet does not preserve original batch membership: {packet_ids}')

          boundary = boundary_path.read_text(encoding='utf-8')
          dispositions = {
              cid: disposition.strip().lower()
              for cid, disposition in re.findall(r'^\| `(cq_q_[0-9a-f]{32})` \| ([^|]+) \|', boundary, flags=re.MULTILINE)
          }
          if set(dispositions) != set(original_ids):
              raise SystemExit(f'source-boundary audit must disposition every original Canonical: {sorted(dispositions)}')

          current_ids = set()
          for line in pathlib.Path('data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines():
              if line.strip():
                  current_ids.add(json.loads(line).get('canonical_id'))

          excluded = {cid for cid, disposition in dispositions.items() if 'exclude' in disposition}
          missing = set(original_ids) - current_ids
          if missing != excluded:
              raise SystemExit(f'current Canonical removals must exactly match source-first exclusions: missing={sorted(missing)} excluded={sorted(excluded)}')

          for cid in sorted(excluded):
              archived = pathlib.Path('review/archive/answers') / f'{cid}.md'
              active = pathlib.Path('review/answers') / f'{cid}.md'
              if not archived.exists():
                  raise SystemExit(f'excluded Canonical is missing archived historical answer: {cid}')
              if active.exists():
                  raise SystemExit(f'excluded Canonical still has an active formal answer: {cid}')

          print(f'PASS batch={batch} original=10 active={10-len(excluded)} excluded={len(excluded)} frozen_source_packet=true')
          PY