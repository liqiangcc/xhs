name: Review Content Batch 0030 Stock DP Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0030-stock-dp-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0030-stock-dp-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6ae96feaa0e3c49daad3242f62e1cc8e
  SOURCE_QID: 6ae96feaa0e3c49daad3242f62e1cc8e
  CANDIDATE_BLOB_SHA: 6cadea3ea71bd56ebc66aa042ff3fac437876eed

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun exhaustive oracle fixture
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0030/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const candidate=`review/candidates/answers/${cid}.md`;
          const expected='算法：买卖股票的最佳时机系列（使用动态规划解决：基础买卖、无限次交易、N 次交易限制）';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/67614c15000000000b021d4b.json','utf8'));
          const source=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!source||source.original_question!==expected) throw new Error('tagged stock-DP source drifted');
          const boundary=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0030/${cid}/source_boundary.json`,'utf8'));
          for(const x of ['whether N means exactly N or at most N completed transactions','fees','cooldown','short selling','simultaneous position limit']) if(!(boundary.not_preserved||[]).includes(x)) throw new Error(`missing fail-closed boundary: ${x}`);
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('Canonical ownership drifted');
          const text=fs.readFileSync(candidate,'utf8');
          for(const needle of ['“N 次”是恰好还是至多','“N 次限制”解释为**至多 k 次完整交易**','oldSell[t - 1] - price','oldBuy[t] + price','k >= prices.length / 2','来源没有手续费、冷冻期或持仓上限细节']) if(!text.includes(needle)) throw new Error(`candidate boundary/mechanism guard missing: ${needle}`);
          NODE
          javac "$out/StockProfitDp.java" "$out/StockProfitDpTest.java"
          test "$(java -cp "$out" StockProfitDpTest)" = 'PASS examples=yes invalid=yes exhaustive-arrays=5461 one=yes unlimited=yes k=yes'

      - name: Record independent source-first review and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0030/${cid}`;
          const boundary=`${out}/source_boundary.json`,fixture=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0030-stock-dp-20260825-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved source asks for the stock best-time family solved with dynamic programming and names basic, unlimited and N-limited variants, but does not preserve exact APIs or detailed trading rules.',
            'The candidate explicitly labels non-negative prices, one-share holding, no fee/cooldown/shorting, basic=at-most-one and N-limited=at-most-k as answer-side assumptions instead of recovered source facts.',
            'The one-transaction recurrence prevents a post-sale second purchase; the unlimited recurrence uses prior-day cash/hold; the at-most-k recurrence uses oldSell[t-1] -> buy[t] and oldBuy[t] -> sell[t], matching the declared completed-transaction layering.',
            'The k>=floor(n/2) shortcut is valid under the declared no-fee/no-cooldown/one-share contract and is not generalized to unpreserved variants.',
            'The displayed Java class compiles and the deterministic fixture checks 5461 arrays of length 0..6 over prices 0..3 against an independent exhaustive buy/sell/skip oracle for one, unlimited and k=0..4, plus named and invalid-input boundaries.',
            'Complexity, initialization, no-trade behavior and missing-source boundaries are explained; no fabricated project experience, source attribution, placeholder code or coding hard failure remains.',
            'Formal promotion remains subject to repository promotion and real-review policy.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0030.stock-dp.v1',decision:'pass',revision_round:1,source_packet:[boundary,candidate,fixture,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const boundaryTests=[
            {case:'standard [7,1,5,3,6,4]',expected:'one=5 unlimited=7 atMostK(2)=7',actual:'one=5 unlimited=7 atMostK(2)=7',passed:true},
            {case:'strictly falling [7,6,4,3,1]',expected:'one=0',actual:'one=0',passed:true},
            {case:'large k on [1,2,3,4,5]',expected:'atMostK(99)=4',actual:'4',passed:true},
            {case:'exhaustive oracle cross-check',expected:'all arrays length 0..6 over prices 0..3 match brute force for one/unlimited/k=0..4',actual:'5461 arrays passed',passed:true},
            {case:'invalid example API inputs',expected:'null, negative price and negative k rejected',actual:'pass',passed:true}
          ];
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,writer:{writer_id:'content-batch-0030-stock-dp-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'source-boundary',title:'Batch 0030 stock-DP frozen repository source boundary',locator:boundary,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Stock-DP exhaustive deterministic Java oracle fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Stock-DP independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The preserved source names a dynamic-programming stock best-time family with basic, unlimited and N-limited variants but does not preserve exact APIs or detailed trade constraints.',source_ids:['source-boundary'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'state-machine-recurrence',text:'Under the explicit candidate contract, the one/unlimited/at-most-k implementations are exhaustively equivalent to legal buy/sell/skip state search on the bounded oracle domain.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundary-validation',text:'The fixture verifies rising/falling/empty/singleton/large-k and invalid-input boundaries plus exhaustive arrays length 0..6 over prices 0..3 for k=0..4.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac StockProfitDp.java StockProfitDpTest.java && java StockProfitDpTest',result:'pass',reported_stdout:'PASS examples=yes invalid=yes exhaustive-arrays=5461 one=yes unlimited=yes k=yes',checks:['standard examples','edge cases','large-k degeneration','invalid inputs','exhaustive brute-force cross-check of 5461 arrays'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0030.stock-dp.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md';
          let text=fs.readFileSync(task,'utf8');
          const old='- [ ] `cq_q_6ae96feaa0e3c49daad3242f62e1cc8e` writer stage complete: source wording and Canonical ownership were re-read, the candidate explicitly separates source-preserved variants from its at-most-k/no-fee/no-cooldown execution contract, and the JDK 21 fixture exhaustively cross-checks all arrays of length 0..6 over prices 0..3 against an independent brute-force state search. Promotion remains blocked on isolated independent review and downstream evidence/strict gates.';
          const replacement='- [x] `cq_q_6ae96feaa0e3c49daad3242f62e1cc8e` candidate passed independent source-first review and exhaustive JDK 21 oracle evidence across 5461 bounded price arrays; missing trading-rule details remain explicit candidate assumptions. Formal promotion remains governed by repository promotion and real-review policy.';
          if(text.includes(old)) text=text.replace(old,replacement);
          fs.writeFileSync(task,text);
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during stock-DP independent review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0030/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0030 stock DP candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
