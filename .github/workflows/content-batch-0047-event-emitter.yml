            cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_c25e775df5cf86a7d8a4e7352ef4fb7e","version":1,"status":"draft","updated_at":"2026-08-28","answer_type":"coding","quality_tier":"candidate"} -->
          # 手写 EventEmitter：on / emit / once / off

          ## 核心结论

          原题只要求实现 `on`、`emit`、`once`、`off`，没有规定 Node.js `EventEmitter` 的全部兼容语义。这里先声明一个最小、可测试的面试契约：同一事件按注册顺序执行监听器；`emit` 把参数透传给监听器，并以 emitter 作为 `this`；`once` 在第一次调用前先注销，因此即使监听器内部重入 `emit` 也只执行一次；`off(event, listener)` 删除该事件下所有与这个原始函数相同的注册（包括 `once` 包装）；一次 `emit` 使用监听器快照，所以本轮执行期间新增或删除监听器只影响下一轮。监听器异常直接向调用方抛出，不在 emitter 内吞掉。

          ## 1 分钟版

          - 用 `Map<event, ListenerRecord[]>` 保存事件到监听器列表，数组天然保留注册顺序。
          - `on` 把普通监听器记录追加到数组。
          - `once` 也追加记录，但标记 `once: true`；`emit` 真正调用它之前先从实时列表删除，避免监听器内部再次 `emit` 时重复执行。
          - `emit` 先复制当前列表做快照，再按快照顺序调用。这样当前轮次的遍历不会被 `on/off` 修改数组所破坏。
          - `off` 按原始函数 identity 过滤，因此传给 `once` 的原函数也可以直接注销。
          - 复杂度：注册通常 O(1)；一次 `emit` 是 O(k)，k 为该事件本轮监听器数；`off` 需要扫描该事件监听器，为 O(k)。

          ## 3 分钟版

          ```javascript
          class EventEmitter {
            constructor() {
              this.events = new Map();
            }

            on(event, listener) {
              this.#assertListener(listener);
              const list = this.events.get(event) ?? [];
              list.push({ listener, original: listener, once: false });
              this.events.set(event, list);
              return this;
            }

            once(event, listener) {
              this.#assertListener(listener);
              const list = this.events.get(event) ?? [];
              list.push({ listener, original: listener, once: true });
              this.events.set(event, list);
              return this;
            }

            off(event, listener) {
              this.#assertListener(listener);
              const list = this.events.get(event);
              if (!list) return this;

              const next = list.filter(record => record.original !== listener);
              if (next.length === 0) this.events.delete(event);
              else this.events.set(event, next);
              return this;
            }

            emit(event, ...args) {
              const list = this.events.get(event);
              if (!list || list.length === 0) return false;

              const snapshot = [...list];
              for (const record of snapshot) {
                if (record.once) this.#removeRecord(event, record);
                record.listener.apply(this, args);
              }
              return true;
            }

            #removeRecord(event, target) {
              const list = this.events.get(event);
              if (!list) return;
              const next = list.filter(record => record !== target);
              if (next.length === 0) this.events.delete(event);
              else this.events.set(event, next);
            }

            #assertListener(listener) {
              if (typeof listener !== 'function') {
                throw new TypeError('listener must be a function');
              }
            }
          }
          ```

          这个实现把“原始 listener”和“本次注册 record”分开保存。`off` 处理的是原始函数 identity；`once` 的精确删除则处理 record identity。两种 identity 分开后，既能让 `off(event, originalFn)` 删除一次性监听器，也不会在触发某个 `once` 时误删同一函数的其他注册。

          ## 关键细节

          - **为什么 once 要先删再调**：如果先执行 listener，再删除，而 listener 内部同步调用同一事件的 `emit`，这个 once 监听器仍在实时列表里，会被再次触发。
          - **为什么 emit 要快照**：遍历实时数组时执行 `on/off` 会改变长度和索引，容易出现跳过、重复或“新监听器提前在本轮执行”。快照把本轮观察到的监听器集合固定下来。
          - **off 的重复注册语义**：原题没规定。这里明确选择“一次 off 删除该事件下同一原始函数的所有注册”；如果面试官要求只删一个实例，可以从数组尾部找到一个匹配 record 后只删除它。
          - **once 和 off 的配合**：没有把 once 变成一个用户不可见的匿名函数再丢失原引用，而是在 record 里保留 `original`，因此可以用原函数取消。
          - **异常语义**：这里不 catch listener 异常；某个监听器抛错时 `emit` 立即向上抛出，后续快照监听器不会继续执行。这是显式契约，不声称与某个具体库完全一致。
          - **返回值**：`on/once/off` 返回 `this` 便于链式调用；`emit` 返回是否在开始本轮时存在监听器。原题未规定返回值，这些都是实现选择而不是来源事实。

          ## 原理机制

          EventEmitter 的核心不是“维护一个对象数组”，而是维护两个不变量：第一，同一事件的监听器有稳定的注册顺序；第二，一次触发拥有明确的迭代视图。实时列表负责跨轮次状态，快照负责当前轮次视图；`once` 在调用前修改实时列表，所以当前快照仍能完成这次调用，但任何重入或下一轮都看不到它。

          这种设计也解释了为什么不能简单写成 `for (const fn of listeners) fn()` 后再处理一次性监听器：监听器本身可以同步修改 emitter，甚至递归触发同一事件。先定义“本轮快照 + 调用前移除 once”的状态转移，代码才有可推导的行为。

          ## 项目经验版

          来源没有提供真实项目中的事件总线、内存泄漏或故障案例，不能虚构。真实项目里还需要根据场景决定是否限制单事件监听器数量、是否支持 `off(event)` 全清、是否需要异步监听器、错误隔离、通配事件、优先级和调试元数据；这些都不属于原题四个方法的必需语义，应在需求明确后再扩展。

          ## 常见追问

          - 问：为什么不用 `Set` 存 listener？答：如果需要允许同一函数重复注册，`Set` 会天然去重；数组更直接地表示“每次注册都是一个独立 record”，也保留顺序。
          - 问：`once` 为什么不只是 `on(event, wrapper)`？答：可以，但必须保存 wrapper 与 original 的关系，否则 `off(event, originalFn)` 无法找到一次性注册；这里把这个关系显式放在 record 中。
          - 问：listener 在 emit 过程中新增 listener，新 listener 会立刻执行吗？答：本契约不会，因为 emit 使用开始时的快照；它从下一次 emit 才参与。
          - 问：listener 在 emit 过程中 off 另一个 listener，被删的 listener 本轮还执行吗？答：如果它已经在本轮快照里，仍会执行；删除只影响实时列表和后续轮次。
          - 问：如何避免 once 重入执行两次？答：在调用 once listener 之前先按 record identity 从实时列表删除，再调用用户函数。
          - 问：事件很多会不会一直占内存？答：当某事件最后一个 record 被 off 或 once 消耗后，删除对应 Map key；更复杂的泄漏检测属于额外需求。

          ## 易错点

          - `once` 调完 listener 才删除，遇到同步重入时执行两次。
          - 遍历实时监听器数组的同时 splice，导致索引错位或行为依赖修改顺序。
          - 给 once 包一层匿名函数，却没有保存 original，导致 `off(event, originalFn)` 失效。
          - 用 `Set` 后无意中改变“同一函数可以重复注册”的语义。
          - 没有定义 off 对重复注册到底删一个还是全部，却把某一种实现当成唯一正确答案。
          - 为了“健壮”把 listener 异常全部吞掉，反而让调用方无法观察失败。
          EOF
