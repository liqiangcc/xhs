name: Prepare Cache Consistency Review

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/prepare-cache-consistency-review.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tighten candidate and capture fixed review inputs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const id = 'cq_cache_consistency_a83eeb36';
          const candidatePath = `review/candidates/answers/${id}.md`;
          const outDir = `review/content_build/answer_batch_0009/${id}`;
          fs.mkdirSync(outDir, { recursive: true });

          let text = fs.readFileSync(candidatePath, 'utf8');
          if (!text.includes('"version":1,"status":"draft"')) throw new Error('unexpected cache candidate version');
          text = text.replace('"version":1,"status":"draft"', '"version":2,"status":"draft"');

          const projectSection = `## 项目经验版\n\n以下是一个**假设性落地示例，不代表真实个人项目经历**。假设商品详情服务以 MySQL 8.4 为真源、Redis 为 cache-aside 读缓存，写请求在一个 InnoDB 事务内更新商品行并插入 outbox 失效事件。事务提交后，CDC/worker 按商品主键路由事件并执行 \`DEL cache:product:{id}\`；重复事件允许重复删除，同一个 key 不存在时再次删除不会把旧值写回。\n\n如果失效消费者暂停，数据库仍是正确真值，但缓存会在显式失效到达或 TTL 到期前继续提供旧值，因此应同时观察最老 outbox 事件年龄、CDC 位点/延迟、Redis 删除失败率、热点 miss 回源率和数据库读放大。恢复时先从持久位点重放失效事件；如果位点已超出 binlog 保留窗口，则按受影响实体/时间窗做受控批量失效或重建，而不是假装链路仍连续。\n\n上线验证至少覆盖：DB 提交后立即杀掉失效 worker、Redis 超时、同一失效事件重复投递、消费者暂停后恢复、热点 key 同时过期、以及旧读请求跨越写事务完成后再回填等竞态。验收目标不是“任何时刻缓存和数据库字节完全相同”，而是已提交数据库变更都有可恢复的失效路径，陈旧窗口受业务约束和 TTL/告警共同界定，且故障恢复不会把缓存误当成真源。\n\n`;
          const replaced = text.replace(/## 项目经验版\n\n[\s\S]*?\n## 常见追问\n/, `${projectSection}## 常见追问\n`);
          if (replaced === text) throw new Error('project section replacement failed');
          text = replaced;

          const oneMinute = text.match(/## 1 分钟版\n\n([\s\S]*?)\n\n## 3 分钟版/);
          if (!oneMinute) throw new Error('1-minute section missing');
          const bulletCount = oneMinute[1].split(/\r?\n/).filter((line) => line.startsWith('- ')).length;
          if (bulletCount < 3 || bulletCount > 5) throw new Error(`1-minute bullet count out of bounds: ${bulletCount}`);
          if (!text.includes('假设性落地示例，不代表真实个人项目经历')) throw new Error('hypothetical project boundary missing');
          if (/项目映射提示：请补充/.test(text)) throw new Error('legacy project placeholder remained');

          fs.writeFileSync(candidatePath, text, 'utf8');
          const hash = crypto.createHash('sha256').update(text, 'utf8').digest('hex');
          fs.writeFileSync(`${outDir}/candidate_sha256.txt`, `${hash}\n`, 'utf8');

          const packet = {
            schema_version: 'isolated_answer_review_packet.v1',
            canonical_id: id,
            prepared_at: '2026-08-18',
            candidate: { path: candidatePath, sha256: hash, answer_type: 'scenario', version: 2 },
            context: { path: `${outDir}/context.json`, canonical_title: '如何保证 MySQL 与 Redis 的缓存一致性？' },
            review_contract: {
              mode: 'source_first_isolated',
              required_quality_contract: 'config/answer_quality.json',
              required_content_standard: 'docs/refactor/09_answer_content_standard.md',
              allowed_repository_inputs: [
                `${outDir}/context.json`,
                candidatePath,
                'config/answer_quality.json',
                'docs/refactor/09_answer_content_standard.md',
                '.agents/skills/xhs-answer-curator/SKILL.md'
              ],
              forbidden_before_conclusion: [
                `review/evidence/${id}.json`,
                `review/candidates/audits/${id}.json`,
                'review/reports/FINAL_SOURCE_FIRST_REVIEW.json',
                'review/reports/FINAL_SOURCE_FIRST_REVIEW.md',
                'historical review/remediation records',
                'writer rationale or self-score'
              ],
              required_checks: [
                'Verify Redis cache-aside read/write invalidation and TTL-bounded-staleness semantics against current Redis official documentation.',
                'Verify Redis DEL behavior and do not overstate repeated deletion as an end-to-end idempotency guarantee.',
                'Verify MySQL 8.4 transaction/binary-log ordering and commit boundaries; distinguish database durability from downstream CDC delivery.',
                'Verify the outbox/CDC claims against current Debezium official documentation and keep outbox, binlog and application worker responsibilities distinct.',
                'Check stale-read race windows, delayed double-delete limitations, hot-key stampede handling, retry/dead-letter/replay, binlog-retention recovery, observability and capacity boundaries.',
                'Verify all source variants are directly answered and hypothetical project examples cannot be read as fabricated personal experience.'
              ],
              promotion_boundary: 'Do not promote or fabricate human approval. Pilot human review remains a separate mandatory gate when required by config.'
            },
            primary_sources_to_verify_independently: [
              {
                source_id: 'redis-cache-aside',
                title: 'Redis cache-aside',
                locator: 'https://redis.io/docs/latest/develop/use-cases/cache-aside/',
                source_type: 'official_documentation',
                claims_to_check: [
                  'cache-aside reads primary on miss and repopulates Redis',
                  'writes invalidate the cache key rather than assuming cache is always latest',
                  'TTL bounds stale-data lifetime and hot-key expiration can cause stampedes'
                ]
              },
              {
                source_id: 'redis-del',
                title: 'Redis DEL command',
                locator: 'https://redis.io/docs/latest/commands/del/',
                source_type: 'official_documentation',
                claims_to_check: [
                  'DEL removes keys and missing keys do not create a replacement value',
                  'repeated deletion is safe only for the cache-key side effect, not a proof of distributed exactly-once delivery'
                ]
              },
              {
                source_id: 'mysql-84-binary-log',
                title: 'MySQL 8.4 The Binary Log',
                locator: 'https://dev.mysql.com/doc/refman/8.4/en/binary-log.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'transactional table changes are cached until COMMIT and the transaction is written to the binary log before COMMIT completes',
                  'binary logging is ordered with transaction completion but does not itself guarantee an external consumer has applied cache invalidation'
                ]
              },
              {
                source_id: 'mysql-84-transactions',
                title: 'MySQL 8.4 START TRANSACTION, COMMIT, and ROLLBACK',
                locator: 'https://dev.mysql.com/doc/refman/8.4/en/commit.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'InnoDB transaction commit/rollback boundaries and transaction logging behavior'
                ]
              },
              {
                source_id: 'debezium-outbox',
                title: 'Debezium Outbox Event Router',
                locator: 'https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'outbox pattern stores service state and event state so CDC can reliably relay committed outbox changes',
                  'the Debezium connector captures outbox-table changes and applies the outbox event router'
                ]
              }
            ],
            expected_output: {
              evidence_path: `review/evidence/${id}.json`,
              audit_path: `review/candidates/audits/${id}.json`,
              audit_command: `node scripts/xhs.js answer audit --candidate ${candidatePath} --require-evidence --noWrite`,
              reviewer_must_not_equal_writer: true
            }
          };
          fs.writeFileSync(`${outDir}/isolated_review_packet.json`, `${JSON.stringify(packet, null, 2)}\n`, 'utf8');
          NODE
          node scripts/xhs.js answer context --canonical-id cq_cache_consistency_a83eeb36 --noWrite > review/content_build/answer_batch_0009/cq_cache_consistency_a83eeb36/context.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('review/content_build/answer_batch_0009/cq_cache_consistency_a83eeb36/context.json', 'utf8'));
          if (!c.ok || c.canonical?.canonical_id !== 'cq_cache_consistency_a83eeb36') throw new Error('unexpected cache consistency context');
          if (!c.source_questions?.length || !c.source_variants?.length) throw new Error('cache consistency source context incomplete');
          NODE
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-cache-consistency-review.yml
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git commit -m "content: prepare cache consistency isolated review"
          git push origin HEAD:content/quality-completion
