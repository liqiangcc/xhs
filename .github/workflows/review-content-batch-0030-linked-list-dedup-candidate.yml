name: Review Content Batch 0030 Linked List Dedup Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0030-linked-list-dedup-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0030-linked-list-dedup-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6d4e32839e2073f17a3c433f128a9590
  SOURCE_QID: 6d4e32839e2073f17a3c433f128a9590
  CANDIDATE_BLOB_SHA: 4099f2fbee0fafd49077ff86d5e613e0f5d9a0ee

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first ambiguity guard and exhaustive fixture rerun
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0030/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          OUT="$out" CANDIDATE="$candidate" node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,out=process.env.OUT,candidate=process.env.CANDIDATE,expected='算法：删除链表中重复元素';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/6694f7db000000000a0247b6.json','utf8'));
          const src=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected||src.question_type!=='算法手撕_Coding') throw new Error('source wording drifted');
          const structured=JSON.parse(fs.readFileSync('note_structured/6694f7db000000000a0247b6.json','utf8'));
          if(!(structured.questions||[]).includes(expected)) throw new Error('structured wording drifted');
          const raw=fs.readFileSync('question/6694f7db000000000a0247b6_desc_questions.txt','utf8');
          if(!raw.includes('删除链表中重复元素')||/有序|保留一个|全部删除|LeetCode\s*8[23]/i.test(raw)) throw new Error('raw source unexpectedly contains a hidden dedup contract');
          const boundary=JSON.parse(fs.readFileSync(`${out}/source_boundary.json`,'utf8'));
          for(const missing of ['whether the list is sorted','whether one representative of each repeated value is retained or every node whose value repeats is removed','extra-space constraint']) if(!(boundary.not_preserved||[]).includes(missing)) throw new Error(`missing fail-closed boundary: ${missing}`);
          const text=fs.readFileSync(candidate,'utf8');
          for(const needle of ['有序+保留一个','有序+整组删除','无序+保留第一次出现','无序+整组删除','keepOneSorted','removeAllDuplicatesSorted','keepFirstUnsorted','keepOnlyGloballyUniqueUnsorted']) if(!text.includes(needle)) throw new Error(`candidate does not cover ambiguity branch: ${needle}`);
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('Canonical ownership drifted');
          NODE
          javac "$out/LinkedListDedup.java" "$out/LinkedListDedupTest.java"
          test "$(java -cp "$out" LinkedListDedupTest)" = 'PASS four-contract-examples=yes exhaustive-ternary-length7=yes empty=yes head-tail-duplicates=yes'

      - name: Record independent review and audit evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0030/${cid}`,boundary=`review/content_build/answer_batch_0030/${cid}/source_boundary.json`,fixture=`review/content_build/answer_batch_0030/${cid}/code_validation.json`,reviewPath=`review/content_build/answer_batch_0030/${cid}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0030-linked-list-dedup-20260825-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'All three repository source representations preserve only the generic request to remove duplicate linked-list elements; none preserves sortedness, keep-one versus remove-all semantics, mutation policy, key type, memory bound or method signature.',
            'The candidate does not silently collapse this ambiguity into LeetCode 82 or 83. It makes the two contract axes explicit and tells the interviewee to clarify them before selecting an implementation.',
            'For sorted input, adjacency is a valid global duplicate signal; keep-one uses one scan and O(1) extra space, while remove-all uses a dummy predecessor to skip complete equal-value runs including a duplicated head run.',
            'For unsorted input, the candidate correctly introduces memory: a seen set for stable keep-first and a two-pass frequency map for retaining only globally unique values.',
            'The executable fixture validates all four declared contracts over every length-0-through-7 list over a three-value alphabet, including empty, head/tail duplicate, all-equal and non-adjacent duplicate cases.',
            'The candidate distinguishes source facts from executable Java fixture assumptions and does not fabricate a hidden interviewer contract or project experience. No correctness hard failure remains.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0030.linked-list-dedup.v1',decision:'pass',revision_round:1,source_packet:['note_tagged/6694f7db000000000a0247b6.json','note_structured/6694f7db000000000a0247b6.json','question/6694f7db000000000a0247b6_desc_questions.txt',boundary,candidate,fixture],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const boundaryTests=[
            {case:'sorted keep one',expected:'1,1,2,3,3 -> 1,2,3',actual:'PASS four-contract-examples=yes',passed:true},
            {case:'sorted remove all repeated values',expected:'1,1,2,3,3 -> 2',actual:'PASS four-contract-examples=yes',passed:true},
            {case:'unsorted keep first',expected:'3,1,3,2,1 -> 3,1,2',actual:'PASS four-contract-examples=yes',passed:true},
            {case:'unsorted keep globally unique only',expected:'3,1,3,2,1,4 -> 2,4',actual:'PASS four-contract-examples=yes',passed:true},
            {case:'bounded exhaustive domain',expected:'all four implementations equal independent value-sequence oracles for every ternary list through length 7',actual:'PASS exhaustive-ternary-length7=yes',passed:true}
          ];
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,writer:{writer_id:'content-batch-0030-linked-list-dedup-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'source-boundary',title:'Frozen generic linked-list duplicate-removal source boundary',locator:boundary,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Four-contract exhaustive bounded linked-list fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Linked-list dedup independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-ambiguity',text:'The repository source preserves duplicate removal on a linked list but does not preserve sortedness or keep-one/remove-all semantics, so a unique hidden LeetCode contract cannot be asserted.',source_ids:['source-boundary','isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节','易错点']},{claim_id:'four-contract-algorithms',text:'Four explicitly separated sorted/unsorted and keep-one/remove-all implementations are executable and match independent bounded oracles.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac LinkedListDedup.java LinkedListDedupTest.java && java LinkedListDedupTest',result:'pass',reported_stdout:'PASS four-contract-examples=yes exhaustive-ternary-length7=yes empty=yes head-tail-duplicates=yes',checks:['four contract examples','all ternary lists length 0..7 for four implementations'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0030.linked-list-dedup.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md';
          let text=fs.readFileSync(task,'utf8');
          const old='- [ ] `cq_q_6d4e32839e2073f17a3c433f128a9590` writer stage complete without inventing hidden constraints: the source preserves only “删除链表中重复元素”, so the candidate explicitly separates sorted/unsorted and keep-one/remove-all semantics and validates four corresponding contracts exhaustively over all ternary-valued lists through length 7. Promotion remains blocked on isolated independent review and downstream evidence/strict gates.';
          const replacement='- [x] `cq_q_6d4e32839e2073f17a3c433f128a9590` candidate passed independent source-first review without inventing a hidden LeetCode contract: sorted/unsorted and keep-one/remove-all semantics remain explicit branches, and all four implementations match exhaustive bounded oracles. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(old)) throw new Error('writer-stage task note missing');
          fs.writeFileSync(task,text.replace(old,replacement));
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during linked-list dedup review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0030/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0030.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0030 linked-list dedup candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
