name: Build Content Batch 0041 setInterval Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0041-setinterval-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0041-setinterval-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_a7ba6548994bab4e4412f98bf4a8dee2
  SOURCE_QID: a7ba6548994bab4e4412f98bf4a8dee2

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
