permissions:
  contents: write

concurrency:
  group: content-batch-0042-max-subarray-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_aee86527c929ecb06715c2c4d2fd738f
  SOURCE_QID: aee86527c929ecb06715c2c4d2fd738f

jobs:
