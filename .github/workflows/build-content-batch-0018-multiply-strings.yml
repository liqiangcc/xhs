name: Content Batch 0018 Multiply Strings Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate multiply-strings fixture
        working-directory: review/content_build/answer_batch_0018/cq_q_297402fd71887dbeb07d182f057a1858
        shell: bash
        run: |
          set -euo pipefail
          javac MultiplyDecimalStrings.java MultiplyDecimalStringsTest.java
          stdout="$(java MultiplyDecimalStringsTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=14 randomized=4000 oracle=BigInteger commutative=true"

      - name: Verify recorded validation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('review/content_build/answer_batch_0018/cq_q_297402fd71887dbeb07d182f057a1858/code_validation.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'code_validation.v1'
          assert payload['canonical_id'] == 'cq_q_297402fd71887dbeb07d182f057a1858'
          assert payload['result'] == 'pass'
          assert payload['stdout'] == 'PASS fixed=14 randomized=4000 oracle=BigInteger commutative=true'
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0018/source_boundary_audit.md
          grep -Fq 'cq_q_297402fd71887dbeb07d182f057a1858' review/content_build/answer_batch_0018/source_boundary_audit.md
