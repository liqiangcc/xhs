name: Initialize Full Review Progress

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .review-progress-trigger

permissions:
  contents: write

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Initialize every Canonical ReviewProgress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js review today --date 2026-08-17 --limit 20 >/tmp/review-today.json
          node scripts/xhs.js review integrity --noWrite >/tmp/review-integrity.json
          node - <<'NODE'
          const fs = require('fs');
          const integrity = JSON.parse(fs.readFileSync('/tmp/review-integrity.json', 'utf8'));
          if (!integrity.ok) throw new Error(JSON.stringify(integrity));
          if (integrity.progress_item_count !== integrity.canonical_count) {
            throw new Error(`ReviewProgress coverage mismatch: ${integrity.progress_item_count}/${integrity.canonical_count}`);
          }
          if (integrity.missing_progress_count !== 0 || integrity.hard_failure_count !== 0) {
            throw new Error(JSON.stringify(integrity));
          }
          console.log(JSON.stringify(integrity, null, 2));
          NODE

      - name: Commit ReviewProgress coverage
        shell: bash
        run: |
          set -euo pipefail
          git add review/progress.json data/manifests/runs/latest_review_today.json
          git commit -m "content: initialize ReviewProgress for every Canonical"

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .review-progress-trigger .github/workflows/initialize-review-progress.yml
          git add -A
          git commit -m "chore: remove temporary ReviewProgress workflow"

      - name: Push content branch
        shell: bash
        run: git push origin HEAD:content/quality-completion
