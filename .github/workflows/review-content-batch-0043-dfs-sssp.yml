name: Review Content Batch 0043 DFS SSSP

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-dfs-sssp.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-dfs-sssp-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b0fbb220f5a52047eb85620c3e62c501
  SOURCE_QID: b0fbb220f5a52047eb85620c3e62c501

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：给定一个图，使用 DFS 求单源最短路径（带特殊条件处理）';
          const note=JSON.parse(fs.readFileSync('note_tagged/672207f0000000001b013994.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact)throw new Error('inventory drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid]))throw new Error('inventory ownership drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','shortestPaths','Math.addExact','BFS','Dijkstra'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];const impl=blocks.map(x=>x[1]).find(x=>x.includes('public final class Solution'));
          if(blocks.length!==1||!impl||!impl.includes('relaxDfs'))throw new Error('candidate implementation missing/ambiguous');
          fs.writeFileSync('/tmp/Solution.java',impl+'\n');const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_independent_dijkstra_oracle',candidate_sha256:sha,source_boundary:'DFS plus single-source shortest path is source-frozen; graph direction, edge-weight model, exact special conditions and output shape are not preserved'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent Dijkstra oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              record State(int v,long d){}
              static List<List<Solution.Edge>> graph(int n){List<List<Solution.Edge>> g=new ArrayList<>();for(int i=0;i<n;i++)g.add(new ArrayList<>());return g;}
              static long[] oracle(List<List<Solution.Edge>> g,int s){int n=g.size();long[]d=new long[n];Arrays.fill(d,Long.MAX_VALUE);d[s]=0;PriorityQueue<State>pq=new PriorityQueue<>(Comparator.comparingLong(State::d));pq.add(new State(s,0));while(!pq.isEmpty()){State x=pq.poll();if(x.d()!=d[x.v()])continue;for(Solution.Edge e:g.get(x.v())){long nd=Math.addExact(x.d(),e.weight());if(nd<d[e.to()]){d[e.to()]=nd;pq.add(new State(e.to(),nd));}}}return d;}
              static void check(List<List<Solution.Edge>> g,int s,String label){long[]got=Solution.shortestPaths(g,s),want=oracle(g,s);if(!Arrays.equals(got,want))throw new AssertionError(label+" got="+Arrays.toString(got)+" want="+Arrays.toString(want));}
              public static void main(String[]args){
                  List<List<Solution.Edge>> a=graph(6);a.get(0).add(new Solution.Edge(1,9));a.get(0).add(new Solution.Edge(2,1));a.get(2).add(new Solution.Edge(1,1));a.get(1).add(new Solution.Edge(3,2));a.get(3).add(new Solution.Edge(2,0));a.get(2).add(new Solution.Edge(4,7));a.get(1).add(new Solution.Edge(4,1));check(a,0,"late-improvement-cycle-disconnected");
                  List<List<Solution.Edge>> z=graph(4);z.get(0).add(new Solution.Edge(1,0));z.get(1).add(new Solution.Edge(2,0));z.get(2).add(new Solution.Edge(1,0));z.get(2).add(new Solution.Edge(3,5));check(z,0,"zero-cycle");
                  Random r=new Random(0x53535350524556L);long cases=0;for(int t=0;t<50000;t++){int n=1+r.nextInt(9);List<List<Solution.Edge>> g=graph(n);for(int u=0;u<n;u++)for(int v=0;v<n;v++)if(u!=v&&r.nextInt(100)<28)g.get(u).add(new Solution.Edge(v,r.nextInt(31)));check(g,r.nextInt(n),"random-"+t);cases++;}
                  boolean neg=false;try{List<List<Solution.Edge>> g=graph(2);g.get(0).add(new Solution.Edge(1,-3));Solution.shortestPaths(g,0);}catch(IllegalArgumentException e){neg=true;}if(!neg)throw new AssertionError("negative edge accepted");
                  boolean overflow=false;try{List<List<Solution.Edge>> g=graph(3);g.get(0).add(new Solution.Edge(1,Long.MAX_VALUE-1));g.get(1).add(new Solution.Edge(2,5));Solution.shortestPaths(g,0);}catch(ArithmeticException e){overflow=true;}if(!overflow)throw new AssertionError("overflow not rejected");
                  System.out.println("PASS fixed-late-improvement=covered zero-cycle=covered seeded-random="+cases+" dijkstra-oracle=match negative=rejected overflow=rejected");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)";echo "$stdout";test "$stdout" = 'PASS fixed-late-improvement=covered zero-cycle=covered seeded-random=50000 dijkstra-oracle=match negative=rejected overflow=rejected';echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_independent_dijkstra_oracle'||pre.candidate_sha256!==sha)throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const tests=[{case:'late shorter route, directed cycle and disconnected vertex',expected:'candidate source-to-all distances equal Dijkstra oracle',passed:true},{case:'zero-weight cycle',expected:'candidate terminates and preserves shortest distances',passed:true},{case:'50,000 seeded random nonnegative directed graphs up to 9 vertices',expected:'candidate distances equal structurally separate priority-queue Dijkstra oracle',passed:true},{case:'negative edge and long overflow',expected:'declared reference contract rejects both',passed:true}];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate and compare against independent priority-queue Dijkstra oracle',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The preserved source fixes DFS plus a single-source shortest-path request but does not preserve graph direction, edge-weight semantics, exact special conditions or whether output is one target versus all vertices.','The candidate explicitly labels its directed/nonnegative/source-to-all model as a reference contract instead of reconstructing missing source details.','The implementation does not misuse first-visit DFS as a shortest-path proof: a vertex is re-expanded whenever its distance decreases, while onPath only blocks the current recursive cycle.','An independent priority-queue Dijkstra oracle matches the exact candidate on targeted late-improvement/zero-cycle boundaries and 50,000 seeded random nonnegative directed graphs.','The answer correctly explains that BFS/Dijkstra are normally preferable and explicitly rejects negative weights and checked-distance overflow under the declared contract without fabricating project experience.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-dfs-sssp-20260827-v1',review_version:'batch-0043.dfs-sssp.v1',decision:'pass',revision_round:1,source_packet:['note_tagged/672207f0000000001b013994.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-dfs-sssp-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-note',title:'Tagged interview note preserving the DFS single-source shortest-path prompt',locator:'note_tagged/672207f0000000001b013994.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'DFS-relaxation writer validation',locator:`${out}/dfs_sssp_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent Dijkstra-oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'DFS shortest-path source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves DFS plus a single-source shortest-path request while graph direction, edge-weight model, exact special conditions and output shape remain unspecified.',source_ids:['tagged-note','source-inventory','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'reference-behavior',text:'Under the declared directed nonnegative source-to-all reference contract, the exact DFS-relaxation implementation matches independent Dijkstra results over fixed boundaries and 50,000 seeded random graphs.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent priority-queue Dijkstra oracle',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b0fbb220f5a52047eb85620c3e62c501` completed writer and isolated source-first review. The source preserves DFS plus a single-source shortest-path request but leaves graph direction, edge weights, exact special conditions and output shape unspecified, so the directed nonnegative source-to-all model is explicitly a reference contract. Writer validation matched Bellman-Ford on fixed boundaries and 30,000 seeded random graphs; the independent reviewer matched a structurally separate priority-queue Dijkstra oracle on late-improvement and zero-cycle boundaries plus 50,000 seeded random graphs, with negative-edge and checked-overflow rejection confirmed. Strict candidate audit, code gate, and repository gates are green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 DFS shortest-path candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
            sleep 5
          done
          exit 1
