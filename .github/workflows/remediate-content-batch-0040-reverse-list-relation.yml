name: Remediate Content Batch 0040 Reverse List Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0040-reverse-list-relation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0040-reverse-list-relation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_CID: cq_topic_77ee33f1
  DUP_QID: a674ac13e38ba3f81a2eb37d1ef5e5e9
  DUP_CID: cq_q_a674ac13e38ba3f81a2eb37d1ef5e5e9

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - id: relation
        name: Freeze source-first relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0040 /tmp/batch0040-reverse
          node scripts/xhs.js answer context --canonical-id "$TARGET_CID" --noWrite > /tmp/batch0040-reverse/target.json
          node scripts/xhs.js answer context --canonical-id "$DUP_CID" --noWrite > /tmp/batch0040-reverse/dup.json
          node <<'NODE'
          const fs=require('fs');
          const target=JSON.parse(fs.readFileSync('/tmp/batch0040-reverse/target.json','utf8'));
          const dup=JSON.parse(fs.readFileSync('/tmp/batch0040-reverse/dup.json','utf8'));
          if(!target.ok||target.canonical?.canonical_id!==process.env.TARGET_CID) throw new Error('target context missing');
          if(!dup.ok||dup.canonical?.canonical_id!==process.env.DUP_CID) throw new Error('duplicate context missing');
          if(target.answer_type!=='coding'||dup.answer_type!=='coding') throw new Error(`answer type drifted target=${target.answer_type} dup=${dup.answer_type}`);
          const targetSources=target.source_questions||[];
          const dupSources=dup.source_questions||[];
          if(targetSources.length===0) throw new Error('target has no live source Questions');
          if(dupSources.length!==1||dupSources[0].question_id!==process.env.DUP_QID) throw new Error(`duplicate must remain source singleton: ${JSON.stringify(dupSources)}`);
          if(dupSources[0].original_question!=='算法 2：手写实现翻转链表') throw new Error(`duplicate source wording drifted: ${dupSources[0].original_question}`);
          if(!/Coding/.test(String(dupSources[0].question_type||''))) throw new Error('duplicate source is not Coding');
          const bad=targetSources.filter(q=>!(/反转.*链表|链表.*反转|reverse.*linked|linked.*reverse/i.test(String(q.original_question||'')))||!/Coding/.test(String(q.question_type||'')));
          if(bad.length) throw new Error(`target live source context contains source outside reverse-linked-list Coding operation: ${JSON.stringify(bad.map(q=>({id:q.question_id,text:q.original_question,type:q.question_type})))}`);
          const owned=target.canonical?.question_ids||[];
          const sourceIds=targetSources.map(q=>q.question_id);
          if(sourceIds.some(id=>!owned.includes(id))) throw new Error(`target source context contains unowned Question: owned=${JSON.stringify(owned)} source=${JSON.stringify(sourceIds)}`);
          const bridge=[...sourceIds].sort()[0];
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`bridge_qid=${bridge}\n`);
          const facts=targetSources.map(q=>`- Survivor live source \`${q.question_id}\`: “${q.original_question}”.`).join('\n');
          const review=`# Batch 0040 Reverse-Linked-List Source-First Relation Review\n\n`+
            `## Primary-source facts\n\n${facts}\n`+
            `- Batch 0040 singleton \`${process.env.DUP_QID}\`: “${dupSources[0].original_question}”.\n`+
            `- Every live source Question returned for survivor \`${process.env.TARGET_CID}\` is a standalone Coding prompt whose observable operation is reversing a linked list; the Batch 0040 singleton preserves the same operation. No reviewed live source adds a materially distinct contract such as reverse-between, k-group reversal, doubly-linked-list reversal, copying instead of in-place relinking, or a different output objective.\n`+
            `- The survivor Canonical may retain historical/non-live ownership members that are not projected by answer context; this review does not infer relation facts from those absent members. The selected bridge is a current live survivor source Question.\n\n`+
            `No historical relation/remediation record was consulted before this conclusion.\n\n`+
            `## Decision\n\nRelation: \`same\`. Consolidate duplicate singleton \`${process.env.DUP_CID}\` into survivor \`${process.env.TARGET_CID}\`, preserving the new source Question under the survivor.\n\n`+
            `## Content consequence\n\nThe relation slice does not promote the survivor Answer. The existing survivor is still subject to source-bounded curation, isolated review, evidence/code gates, required human approval, and real-review policy.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0040/reverse_list_relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Select decide and apply reviewed duplicate pair
        shell: bash
        env:
          TARGET_QID: ${{ steps.relation.outputs.bridge_qid }}
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0040/reverse_list_relation_apply'
          mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$TARGET_QID,$DUP_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(r.relation_candidates)||r.relation_candidates.length!==1) throw new Error(`expected one RelationCandidate, got ${r.relation_candidates?.length}`);
          const c=r.relation_candidates[0];
          const actual=[...c.question_ids].sort();
          const expected=[process.env.TARGET_QID,process.env.DUP_QID].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`selected pair drifted: ${JSON.stringify(actual)}`);
          process.stdout.write(c.relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide \
            --relation-candidate-key "$key" \
            --relation same \
            --actor-type ai \
            --actor-id batch-0040-reverse-list-source-first-review \
            --actor-display-name 'Reverse linked list source-first reviewer' \
            --rationale 'Current live repository sources on both sides preserve the same standalone Coding operation: reverse a linked list. No reviewed source preserves a distinct reverse-between, k-group, doubly-linked-list, copy, or alternate-output contract.' > "$out/decide.json"
          node scripts/xhs.js dedup apply \
            --relation-candidate-key "$key" \
            --canonical-id "$TARGET_CID" \
            --canonical-title '算法：反转链表' > "$out/apply.json"

      - name: Verify reviewed consolidation and update task
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          if(byQ.get(process.env.DUP_QID)?.canonical_id!==process.env.TARGET_CID) throw new Error('Batch 0040 reverse-list Question not rebound to survivor');
          if(byC.has(process.env.DUP_CID)) throw new Error('duplicate reverse-list Canonical survived consolidation');
          const target=byC.get(process.env.TARGET_CID);
          if(!target || !(target.question_ids||[]).includes(process.env.DUP_QID)) throw new Error(`survivor missing new Question: ${JSON.stringify(target?.question_ids)}`);
          fs.writeFileSync('review/content_build/answer_batch_0040/reverse_list_relation_apply.md',
            '# Batch 0040 Reverse-Linked-List Relation Application\n\n'+
            '- Relation: `same`.\n'+
            '- Survivor: `'+process.env.TARGET_CID+'`; it now owns the reviewed Batch 0040 reverse-list Question.\n'+
            '- Retired duplicate Canonical: `'+process.env.DUP_CID+'`.\n'+
            '- This normalization does not promote the survivor Answer.\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0040.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_a674ac13e38ba3f81a2eb37d1ef5e5e9` was reviewed source-first against existing reverse-linked-list Canonical `cq_topic_77ee33f1`: all current live repository sources reviewed on both sides preserve the same standalone Coding operation—reverse a linked list—without a distinct reverse-between, k-group, doubly-linked-list, copy, or alternate-output contract. Relation is `same`; the Batch 0040 duplicate singleton is retired and its Question is consolidated under the survivor. This normalization does not promote content.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Refresh generated audits and run full gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during reverse-list relation slice: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: normalize batch 0040 reverse-list source relation'
          git push origin "HEAD:$CONTENT_BRANCH"
