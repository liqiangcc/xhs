name: Review Content Batch 0041 LCP v3

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0041-lcp-v3.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0041-lcp-review-v3
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_a735fdca7e7f00dbb5349db43e5f3987
  SOURCE_QID: a735fdca7e7f00dbb5349db43e5f3987

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Independently inspect source and execute candidate
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0041/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"; test -f "$out/writer_research.json"
          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const exact='算法：最长公共前缀（Longest Common Prefix）。';
          const tagged=JSON.parse(fs.readFileSync('note_tagged/67492ea90000000007032789.json','utf8')).tagged_questions||[];
          const src=tagged.find(x=>x.question_id===qid);
          if(!src||src.original_question!==exact||src.question_type!=='算法手撕_Coding'||src.is_valid_for_library!==true) throw new Error('source contract drifted');
          const raw=fs.readFileSync('note_desc/67492ea90000000007032789.txt','utf8');
          if(!raw.includes('最长公共前缀')||!raw.includes('暴力做的')) throw new Error('original-note source drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('active ownership/type drifted');
          const path=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(path,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','```java','本文实现选择','UTF-16']) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          if(/生产环境里我|我负责过|我在线上/.test(md)) throw new Error('fabricated first-person production claim risk');
          const m=md.match(/```java\n([\s\S]*?)```/); if(!m) throw new Error('candidate Java block missing');
          fs.writeFileSync('/tmp/Solution.java',m[1]);
          fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex')+'\n');
          NODE
          cat > /tmp/LcpReviewer.java <<'JAVA'
          import java.util.*;
          public final class LcpReviewer {
              static String oracle(String[] a) {
                  if (a.length == 0) return "";
                  String[] b = a.clone(); Arrays.sort(b);
                  String x=b[0], y=b[b.length-1]; int k=0;
                  while(k<x.length() && k<y.length() && x.charAt(k)==y.charAt(k)) k++;
                  return x.substring(0,k);
              }
              static void words(List<String> out,String p,int depth){
                  out.add(p); if(depth==3)return;
                  for(char c:new char[]{'a','b'}) words(out,p+c,depth+1);
              }
              public static void main(String[] args){
                  Solution s=new Solution(); List<String> w=new ArrayList<>(); words(w,"",0);
                  for(String a:w)for(String b:w)for(String c:w)for(String d:w){
                      String[] in={a,b,c,d}; String got=s.longestCommonPrefix(in), want=oracle(in);
                      if(!got.equals(want)) throw new AssertionError(Arrays.toString(in)+" got="+got+" want="+want);
                  }
                  String[][] cases={{"flower","flow","flight"},{"dog","racecar","car"},{"same"},{"prefix","pre","prevent"},{"","x"}};
                  for(String[] in:cases) if(!s.longestCommonPrefix(in).equals(oracle(in))) throw new AssertionError(Arrays.toString(in));
                  if(!s.longestCommonPrefix(new String[0]).equals("")) throw new AssertionError("empty array");
                  try{s.longestCommonPrefix(null);throw new AssertionError("null array");}catch(IllegalArgumentException expected){}
                  try{s.longestCommonPrefix(new String[]{"a",null});throw new AssertionError("null element");}catch(IllegalArgumentException expected){}
                  System.out.println("PASS independent-sort-extremes exhaustive-4word-binary-depth-3 known-cases empty-array null-rejected");
              }
          }
          JAVA
          javac /tmp/Solution.java /tmp/LcpReviewer.java
          stdout="$(java -cp /tmp LcpReviewer)"
          test "$stdout" = 'PASS independent-sort-extremes exhaustive-4word-binary-depth-3 known-cases empty-array null-rejected'
          echo "stdout=$stdout" >> "$GITHUB_ENV"

      - name: Freeze isolated review and strict evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0041/$cid"; sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0041/${cid}`;
          const sha=process.env.CANDIDATE_SHA;
          const boundary_tests=[
            {case:'first-character mismatch',expected:'empty prefix',passed:true},
            {case:'one string is a full prefix of another',expected:'shorter string returned',passed:true},
            {case:'empty string and empty-array reference boundaries',expected:'empty prefix',passed:true},
            {case:'exhaustive bounded tuples',expected:'candidate equals independent sort-extremes oracle',passed:true},
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'extract candidate Solution.java; javac Solution.java LcpReviewer.java && java LcpReviewer',stdout:process.env.REVIEW_STDOUT,boundary_tests},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The repository source preserves longest-common-prefix and that a direct/brute solution was used; it does not preserve language, null, empty-array, scale, or Unicode rules.','The candidate keeps unpreserved semantics explicitly outside source facts and declares them as reference implementation choices.','The extracted candidate Java code matches a separately implemented sort-extremes oracle over exhaustive bounded four-string tuples and explicit edge cases.','The first-mismatch stopping argument and loop invariant directly justify correctness.','The project-experience section does not invent production history for a pure algorithm prompt.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0041-lcp-v3-20260827',review_version:'batch-0041.lcp.v3',decision:'pass',revision_round:1,source_packet:['note_desc/67492ea90000000007032789.txt','note_tagged/67492ea90000000007032789.json','review/content_build/answer_batch_0041/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha) throw new Error('writer packet/hash drifted');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0041-lcp-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-original-note',title:'Original LCP interview note',locator:'note_desc/67492ea90000000007032789.txt',source_type:'repository_source_record',checked_at:date},{source_id:'repository-tagged-question',title:'Normalized LCP source Question',locator:`note_tagged/67492ea90000000007032789.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Writer LCP validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent sort-extremes LCP oracle',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'LCP source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'Source preserves a longest-common-prefix prompt and says a direct/brute solution was used.',source_ids:['repository-original-note','repository-tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版']},{claim_id:'source-boundary',text:'Language, scale, null, empty-array and Unicode semantics are not preserved and remain explicitly non-source choices.',source_ids:['repository-original-note','repository-tagged-question','isolated-review'],answer_locations:['核心结论','关键细节','常见追问']},{claim_id:'reference-implementation',text:'Declared Java vertical scan matches an independent sort-extremes oracle across exhaustive bounded tuples and boundary cases.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'extract candidate Solution.java; javac Solution.java LcpReviewer.java && java LcpReviewer',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0041.md';let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_a735fdca7e7f00dbb5349db43e5f3987` longest-common-prefix writer slice is staged source-first: the original note preserves “最长公共前缀 / 暴力做的”; null/empty-array/Unicode semantics remain explicitly non-source. A vertical-scan Java reference implementation passes known cases and exhaustive bounded tuples against an independent oracle. Independent source-first review is still required.';
          const passed='- [x] `cq_q_a735fdca7e7f00dbb5349db43e5f3987` passed isolated source-first review: the preserved source is only “最长公共前缀 / 暴力做的”; language/null/empty-array/Unicode rules stay explicitly non-source. The candidate Java implementation matches an independently implemented sort-extremes oracle across exhaustive bounded four-string tuples and boundary cases. Strict candidate evidence is bound; repository human approval and S11 real-review policy still block curated promotion.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review safely
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.head }}
        run: |
          set -euo pipefail
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0041/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0041.md
          git commit -m 'review: pass batch 0041 longest-common-prefix candidate source-first'
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse "origin/$CONTENT_BRANCH")" = "$BASE_SHA"
          git push origin "HEAD:$CONTENT_BRANCH"
