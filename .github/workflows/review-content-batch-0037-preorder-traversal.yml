name: Review Content Batch 0037 Preorder Traversal Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0037-preorder-traversal.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0037-preorder-traversal-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8d38cd370fa94eb8683b012eb6353aab
  SOURCE_QID: 8d38cd370fa94eb8683b012eb6353aab
  SOURCE_TAGGED: note_tagged/680a3a20000000001c03319f.json
  PRIMARY_SOURCE: https://leetcode.com/problems/binary-tree-preorder-traversal/

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A isolated source-first review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0037/$cid"; candidate="review/candidates/answers/$cid.md"; rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),qid=process.env.SOURCE_QID,cid=process.env.CANONICAL_ID;
          const q=(JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8')).tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法手撕：二叉树的前序遍历（Pre-order Traversal）';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('source drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift ${h}`);
          const one=(md.match(/## 1 分钟版\n\n([\s\S]*?)(?=\n## )/)||[])[1]||''; const bullets=(one.match(/^- /gm)||[]).length; if(bullets<3||bullets>5) throw new Error(`one-minute backbone drift ${bullets}`);
          for(const marker of ['根 → 左子树 → 右子树','先压右、后压左','O(n)','O(h)','空列表','Morris','层序遍历']) if(!md.includes(marker)) throw new Error(`missing ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          if(/我在线上|我负责过|线上事故|我们生产|真实项目里我曾/.test(md)) throw new Error('fabricated project claim');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)]; if(blocks.length!==1||!blocks[0][1].includes('preorderTraversal(TreeNode root)')) throw new Error('complete Java solution missing');
          fs.writeFileSync(`review/content_build/answer_batch_0037/${cid}/reviewer_tmp/Solution.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/PreorderReviewerTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public final class PreorderReviewerTest {
              private static long randomized;
              public static void main(String[] args) {
                  Solution s=new Solution();
                  verify(s,null,List.of());
                  verify(s,node(42),List.of(42));
                  Solution.TreeNode a=node(1); a.left=node(2); a.right=node(3); a.left.right=node(4); a.right.left=node(5);
                  verify(s,a,List.of(1,2,4,3,5));
                  Solution.TreeNode dup=node(7); dup.left=node(7); dup.right=node(7); verify(s,dup,List.of(7,7,7));
                  Random r=new Random(0x8D38CD370026L);
                  for(int n=0;n<=180;n++) for(int round=0;round<24;round++){Solution.TreeNode root=randomTree(n,r);verify(s,root,reference(root));randomized++;}
                  int depth=100000; Solution.TreeNode right=node(0),cur=right; for(int i=1;i<depth;i++){cur.right=node(i);cur=cur.right;}
                  List<Integer> out=s.preorderTraversal(right); if(out.size()!=depth)throw new AssertionError("deep size");for(int i=0;i<depth;i++)if(out.get(i)!=i)throw new AssertionError("deep order at "+i);
                  System.out.printf("PASS boundary=4 randomized_trees=%d deep_skew=%d duplicate_values=pass root-left-right=pass%n",randomized,depth);
              }
              static Solution.TreeNode node(int v){return new Solution.TreeNode(v);}
              static void verify(Solution s,Solution.TreeNode root,List<Integer> expected){List<Integer> actual=s.preorderTraversal(root);if(!actual.equals(expected))throw new AssertionError("actual="+actual+" expected="+expected);}
              static List<Integer> reference(Solution.TreeNode root){List<Integer> out=new ArrayList<>();referenceDfs(root,out);return out;}
              static void referenceDfs(Solution.TreeNode n,List<Integer> out){if(n==null)return;out.add(n.val);referenceDfs(n.left,out);referenceDfs(n.right,out);}
              static Solution.TreeNode randomTree(int n,Random r){if(n==0)return null;List<Solution.TreeNode> all=new ArrayList<>();for(int i=0;i<n;i++)all.add(node(r.nextInt(11)-5));List<Solution.TreeNode> available=new ArrayList<>();available.add(all.get(0));for(int i=1;i<n;i++){Solution.TreeNode child=all.get(i);while(true){Solution.TreeNode p=available.get(r.nextInt(available.size()));if(p.left!=null&&p.right!=null){available.remove(p);continue;}if(p.left==null&&p.right==null){if(r.nextBoolean())p.left=child;else p.right=child;}else if(p.left==null)p.left=child;else p.right=child;if(p.left!=null&&p.right!=null)available.remove(p);available.add(child);break;}}return all.get(0);}
          }
          JAVA
          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror Solution.java PreorderReviewerTest.java && java PreorderReviewerTest > stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/stdout.txt")"; test "$stdout" = 'PASS boundary=4 randomized_trees=4344 deep_skew=100000 duplicate_values=pass root-left-right=pass'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26',out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundary_tests=[
            {case:'null root',expected:'returns empty list',passed:true},
            {case:'single node',expected:'returns root only',passed:true},
            {case:'mixed left/right tree',expected:'root-left-right order',passed:true},
            {case:'duplicate node values',expected:'structural traversal preserves all nodes without deduplication',passed:true},
            {case:'100000-node right-skew tree',expected:'iterative traversal completes with exact 0..99999 order',passed:true},
            {case:'4344 seeded random trees',expected:'exact candidate matches independent recursive preorder reference',passed:true}
          ];
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The candidate directly answers the preserved binary-tree preorder question and does not invent hidden source constraints.','The root-left-right definition is implemented exactly by a complete iterative Java solution.','The explanation correctly derives right-before-left push order from LIFO stack semantics rather than memorizing a code pattern.','Time is O(n); auxiliary stack is O(h), worst-case O(n), with returned output space kept conceptually separate.','Null, duplicate values, unbalanced trees, recursion depth and Morris traversal are handled as explicit boundaries/tradeoffs.','Independent execution validates four fixed boundaries, 4344 randomized trees against a separately written recursive reference, and a 100000-node skew tree; no semantic mismatch was found.','The project mapping remains hypothetical and contains no fabricated production claim.'];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract exact candidate Java; javac -Xlint:all -Werror; fixed, 4344 randomized-reference and 100000-depth skew tests',stdout:process.env.REVIEW_STDOUT,checks:['exact candidate compiles','null and single-node boundaries','root-left-right fixed shape','duplicate values preserved structurally','4344 random trees match independent recursive reference','100000-node skew tree completes iteratively'],boundary_tests},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-preorder-20260826-v1',review_version:'preorder.iterative-randomized-skew.v1',decision:'pass',revision_round:1,source_packet:[process.env.SOURCE_TAGGED,process.env.PRIMARY_SOURCE,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after isolated conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26',out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex'),review=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`)),wr=JSON.parse(fs.readFileSync(`${out}/writer_research.json`)),wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`)),rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`));
          if(review.decision!=='pass'||review.candidate_sha256!==hash||wr.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||wv.candidate_sha256!==hash||rv.result!=='pass')throw new Error('review/evidence prerequisite drift');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'preorder-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Repository tagged binary-tree preorder interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'primary-reference',title:'LeetCode 144 Binary Tree Preorder Traversal',locator:process.env.PRIMARY_SOURCE,source_type:'official_documentation',checked_at:date},{source_id:'writer-validation',title:'Writer preorder executable validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent preorder validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh isolated source-first review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'preorder-semantics',text:'Binary-tree preorder visits root, then the left subtree, then the right subtree.',source_ids:['repository-source','primary-reference','reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'iterative-order',text:'The exact stack solution pushes right before left so the left child is popped first under LIFO semantics.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundaries-complexity',text:'The implementation handles null, duplicate values, random shapes and a 100000-node skew tree; the source-first review confirms O(n) time and O(h) auxiliary stack.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:wr.source_question_coverage,validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores:review.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:review.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');
          NODE

      - name: Candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passed isolated review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0037/$CANONICAL_ID/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md';let t=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_8d38cd370fa94eb8683b012eb6353aab` preorder-traversal candidate preserves the exact binary-tree source boundary, gives a complete iterative root-left-right Java solution, explains right-before-left stack ordering and O(n)/O(h) bounds, and passes fixed plus 2420 seeded randomized trees and a 50000-node skew-tree writer validation. Writer evidence is frozen; isolated source-first review remains pending.';
          const done='- [x] `cq_q_8d38cd370fa94eb8683b012eb6353aab` preorder-traversal candidate preserves the exact binary-tree source boundary, gives a complete iterative root-left-right Java solution, explains right-before-left stack ordering and O(n)/O(h) bounds, passes writer validation plus 4344 independent randomized trees and a 100000-node skew-tree check, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!t.includes(pending))throw new Error('task progress drift');t=t.replace(pending,done);fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0037/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0037/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md
          git commit -m 'review: pass batch 0037 preorder traversal candidate source-first'
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = "${{ steps.base.outputs.head }}" || { echo 'content branch moved during review' >&2; exit 1; }
          git push origin HEAD:"$CONTENT_BRANCH"
