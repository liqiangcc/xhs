name: Review Content Batch 0032 Linked List Middle Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0032-linked-list-middle-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0032-linked-list-middle-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_70a2325b23352069bfb96a47884bfeed
  SOURCE_QID: 70a2325b23352069bfb96a47884bfeed
  CANDIDATE_BLOB_SHA: 055908f29febe8f23f1524baca55e4a608ba4184

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          test -f "$out/code_validation.json"
          test -f "$out/writer_research.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=(packet.canonicals||[]).find(x=>x.canonical_id===cid);
          if(!entry) throw new Error('source packet member missing');
          const hits=entry.source_hits||[];
          if(hits.length!==1||hits[0]?.match_basis!=='question_id') throw new Error('source identity is not exact singleton');
          const q=hits[0].tagged_question;
          const expected='算法：链表怎么定位中间元素（快慢指针）';
          if(q?.question_id!==qid||q?.original_question!==expected||q?.is_valid_for_library!==true) throw new Error('source drifted');
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['slow = slow->next','fast = fast->next->next','偶数长度链表返回两个中间节点中的后一个','空链表返回 `nullptr`','有限、无环','O(n)','O(1)','不修改链表'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|按本题约束填写|长尾复习底稿/.test(text)) throw new Error('placeholder/template residue detected');
          NODE
          g++ -std=c++17 -O2 -Wall -Wextra -pedantic "$out/middle_node_test.cpp" -o /tmp/middle_node_writer_test
          test "$(/tmp/middle_node_writer_test)" = 'PASS lengths=0..20,999,1000,1001 second-middle-even topology-unchanged'
          python3 - <<'PY'
          # Independent index-level oracle: model only pointer-step counts, not writer test expectations.
          for n in range(0, 10001):
              slow=0
              fast=0
              # list nodes are 0..n-1; fast can move two edges only while a next node exists
              while fast < n and fast + 1 < n:
                  slow += 1
                  fast += 2
              expected = n // 2 if n else 0
              if n and slow != expected:
                  raise SystemExit(f'n={n}: slow={slow}, expected={expected}')
              if not n and slow != 0:
                  raise SystemExit('empty model drifted')
          print('PASS independent-index-oracle n=0..10000 floor(n/2)')
          PY

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_${batch}/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'empty list',expected:'nullptr',actual:'writer fixture pass',passed:true},
            {case:'odd lengths including 1,3,5,999,1001',expected:'unique middle at floor(n/2)',actual:'writer fixture pass',passed:true},
            {case:'even lengths including 2,4,20,1000',expected:'explicit answer-side contract returns second middle at index n/2',actual:'writer fixture pass',passed:true},
            {case:'topology preservation',expected:'no next pointer is modified',actual:'writer fixture snapshots all next pointers and passes',passed:true},
            {case:'independent step-count model n=0..10000',expected:'slow step count equals floor(n/2)',actual:'all passed',passed:true}
          ];
          fs.writeFileSync(validationPath,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'g++ writer fixture; independent Python step-count oracle',stdout:'PASS writer lengths=0..20,999,1000,1001; PASS independent-index-oracle n=0..10000 floor(n/2)',checks:['empty list','odd unique middle','explicit even second-middle contract','large lengths','input topology unchanged','independent index oracle'],boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0032-linked-list-middle-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source preserves exactly one question asking how to locate the middle element of a linked list with fast/slow pointers; it does not specify API, empty-input behavior, even-length tie semantics or cyclic-input behavior.',
            'The candidate explicitly labels finite acyclic singly-linked input, nullptr for empty input and second-middle behavior for even lengths as answer-side contracts instead of source facts.',
            'The loop guard ensures fast->next exists before the two-step advance, so empty, single-node and short-list boundaries avoid invalid dereference.',
            'The invariant is stated at the right level: fast advances twice as many edges as slow, and on termination slow has advanced floor(n/2) edges.',
            'The standalone C++ fixture covers lengths 0..20 plus 999/1000/1001 and verifies every next pointer remains unchanged.',
            'A separately authored step-count oracle checks every length from 0 through 10000 and independently confirms floor(n/2) slow steps.',
            'The candidate does not fabricate project experience and explicitly warns that cyclic input breaks the tail-null termination premise.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0032.linked-list-middle.v1',decision:'pass',revision_round:0,source_packet:[`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0032-linked-list-middle-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Batch 0032 exact source-first singleton boundary',locator:`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Linked-list middle C++ fixture plus independent index oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Linked-list middle independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source asks only how to locate a linked-list middle element using fast/slow pointers; API, empty/even/cycle semantics are not preserved source constraints.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'fast-slow-invariant',text:'Under the declared finite acyclic contract, each loop advances slow by one edge and fast by two, so termination leaves slow at index floor(n/2).',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundary-behavior',text:'The executable fixture verifies nullptr for empty input, unique odd middle, second middle for even input under the explicit answer-side contract, large lengths and topology preservation.',source_ids:['fixture','isolated-review'],answer_locations:['3 分钟版','关键细节','常见追问']},{claim_id:'complexity',text:'The implementation advances pointers only forward a constant number of times per traversed node and stores only two local pointers, giving O(n) time and O(1) auxiliary space for finite acyclic input.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'g++ writer fixture; independent Python step-count oracle',result:'pass',reported_stdout:'PASS writer + independent-index-oracle',checks:['fixed boundaries','large lengths','topology preservation','independent floor(n/2) oracle'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0032.linked-list-middle.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;
          let text=fs.readFileSync(task,'utf8');
          const pending=`- [ ] \`${cid}\` candidate staged source-first: exact singleton boundary preserved; C++ fast/slow implementation uses an explicit finite-acyclic and second-middle-for-even contract; executable fixture covers empty, odd/even, large lengths and non-mutation. Independent review still required.`;
          text=text.replace(pending+'\n','');
          const done=`- [x] \`${cid}\` candidate passed independent source-first review: the exact singleton source boundary is preserved; finite-acyclic, empty-input and even-length second-middle semantics remain explicit answer-side contracts; the C++ fixture covers empty/odd/even/large lengths with topology preservation, and an independent n=0..10000 step-count oracle confirms floor(n/2). Formal promotion remains governed by repository promotion and real-review policy.`;
          if(!text.includes(done)) text=(text.endsWith('\n')?text:text+'\n')+done+'\n';
          fs.writeFileSync(task,text);
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during linked-list middle review; discard local review and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m "review: pass batch ${BATCH} linked-list middle candidate"
          git push origin "HEAD:$CONTENT_BRANCH"
