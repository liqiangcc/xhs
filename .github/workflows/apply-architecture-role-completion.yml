name: Apply Architecture Role Completion

on:
  push:
    branches:
      - refactor/soc-srp-architecture
    paths:
      - .architecture-role-trigger

permissions:
  contents: write

jobs:
  apply:
    if: "${{ github.event.head_commit.message == 'chore: trigger architecture-role completion' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-refactor-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Decode architecture patches
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/architecture-patches.b64.part* > "$RUNNER_TEMP/architecture-patches.b64"
          base64 --decode "$RUNNER_TEMP/architecture-patches.b64" > "$RUNNER_TEMP/architecture-patches.tar.gz"
          mkdir -p "$RUNNER_TEMP/architecture-patches"
          tar -xzf "$RUNNER_TEMP/architecture-patches.tar.gz" -C "$RUNNER_TEMP/architecture-patches"
          sha256sum "$RUNNER_TEMP/architecture-patches"/*.patch

      - name: Complete quality report Publisher migration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/architecture-patches/p0.patch"
          git apply "$RUNNER_TEMP/architecture-patches/p0.patch"
          node --test test/canonical_check_application.test.js test/canonical_check_filesystem.test.js
          git add -A
          git commit -m "refactor: publish canonical quality reports through Publisher"

      - name: Complete relation candidate Publisher migration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/architecture-patches/p1.patch"
          git apply "$RUNNER_TEMP/architecture-patches/p1.patch"
          node --test \
            test/dedup_relation_suggestion_application.test.js \
            test/dedup_suggestion_ports.test.js \
            test/dedup_hotspot_filesystem.test.js
          git add -A
          git commit -m "refactor: publish relation candidate queues through Publisher"

      - name: Complete relation decision Gateway migration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check "$RUNNER_TEMP/architecture-patches/p2.patch"
          git apply "$RUNNER_TEMP/architecture-patches/p2.patch"
          node --test \
            test/repository_role_term_audit.test.js \
            test/dedup_relation_decision_application.test.js \
            test/dedup_relation_decision_filesystem.test.js
          git add -A
          git commit -m "refactor: record relation decisions through Gateway"

      - name: Run complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage
          git diff --exit-code

      - name: Remove temporary migration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .architecture-role-trigger \
            .github/workflows/apply-architecture-role-completion.yml \
            .github/workflows/export-source.yml \
            .github/tmp/architecture-patches.b64.part00 \
            .github/tmp/architecture-patches.b64.part01 \
            .github/tmp/architecture-patches.b64.part02 \
            .github/tmp/architecture-patches.b64.part03
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git commit -m "chore: remove temporary architecture migration machinery"

      - name: Push completed refactor
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refactor/soc-srp-architecture
