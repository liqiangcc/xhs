name: Review Content Batch 0038 Longest Unique Substring Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0038-longest-unique-substring.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0038-longest-unique-substring-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9a62670f3e7cce3ac78ef3e463b235aa
  SOURCE_QID: 9a62670f3e7cce3ac78ef3e463b235aa
  SOURCE_STRUCTURED: note_structured/67ea53ad000000001d00a6b0.json
  SOURCE_TAGGED: note_tagged/67ea53ad000000001d00a6b0.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first boundary and executable review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0038/$cid"; tmp="/tmp/longest-unique-review"
          rm -rf "$tmp"; mkdir -p "$tmp" "$out"
          python3 - <<'PY'
          import json,os,pathlib,re
          exact='算法：手撕算法题：给定一个字符串，请找出一个不包含重复字符的“最大无重复子串”的长度（滑动窗口实现）。'
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']
          structured=json.loads(pathlib.Path(os.environ['SOURCE_STRUCTURED']).read_text())
          if exact not in structured.get('questions',[]): raise SystemExit('structured source drift')
          tagged=json.loads(pathlib.Path(os.environ['SOURCE_TAGGED']).read_text())
          q=next((x for x in tagged.get('tagged_questions',[]) if x.get('question_id')==qid),None)
          if not q or q.get('original_question')!=exact or q.get('is_valid_for_library') is not True: raise SystemExit('tagged source drift')
          writer=json.loads(pathlib.Path(f'review/content_build/answer_batch_0038/{cid}/writer_research.json').read_text())
          if writer.get('review_state')!='writer_complete_isolated_review_pending': raise SystemExit('writer state drift')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md'); md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in ['滑动窗口','Math.max(left, previous + 1)','UTF-16','char','abba','O(n)']:
              if marker not in md: raise SystemExit(f'candidate missing {marker}')
          if len(re.findall(r'^- 问：',md,re.M))<5: raise SystemExit('followups insufficient')
          if re.search(r'我在线上|我负责过|我们生产|真实项目里我曾|线上事故',md): raise SystemExit('fabricated project claim')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java block, got {len(blocks)}')
          snippet=blocks[0].strip()
          harness='''import java.util.*;\n\npublic class CandidateHarness {\n'''+snippet+'''\n
              static int brute(String s){
                  if(s==null||s.isEmpty())return 0;
                  int best=0;
                  for(int i=0;i<s.length();i++){
                      Set<Character> seen=new HashSet<>();
                      for(int j=i;j<s.length();j++){
                          char c=s.charAt(j);
                          if(!seen.add(c))break;
                          best=Math.max(best,j-i+1);
                      }
                  }
                  return best;
              }
              static void check(String s,int expected){int got=longestUniqueSubstring(s);if(got!=expected)throw new AssertionError("expected="+expected+" got="+got+" s="+s);if(got!=brute(s))throw new AssertionError("oracle mismatch");}
              static void enumerate(char[] a,int i,char[] alphabet,long[] count){
                  if(i==a.length){String s=new String(a);int got=longestUniqueSubstring(s),oracle=brute(s);if(got!=oracle)throw new AssertionError("exhaustive mismatch "+s);count[0]++;return;}
                  for(char c:alphabet){a[i]=c;enumerate(a,i+1,alphabet,count);}
              }
              public static void main(String[] args){
                  check(null,0);check("",0);check("abcabcbb",3);check("bbbbb",1);check("pwwkew",3);check("abba",2);check("dvdf",3);check("tmmzuxt",5);
                  char[] alphabet={'a','b','中'};long[] exhaustive={0};for(int n=0;n<=9;n++)enumerate(new char[n],0,alphabet,exhaustive);
                  Random rnd=new Random(0x9a62670fL);char[] pool={'a','b','c','d','中','文','\\u0000','\\uD83D','\\uDE00'};int randomized=15000;
                  for(int t=0;t<randomized;t++){int n=rnd.nextInt(60);char[] a=new char[n];for(int i=0;i<n;i++)a[i]=pool[rnd.nextInt(pool.length)];String s=new String(a);int got=longestUniqueSubstring(s),oracle=brute(s);if(got!=oracle)throw new AssertionError("random mismatch got="+got+" oracle="+oracle+" n="+n);}
                  System.out.println("PASS exact_candidate deterministic=8 exhaustive="+exhaustive[0]+" randomized="+randomized+" oracle=independent-hashset-bruteforce contract=utf16-code-unit");
              }
          }
          '''
          pathlib.Path('/tmp/longest-unique-review/CandidateHarness.java').write_text(harness)
          PY

          javac "$out/writer_validation.java"
          writer_stdout="$(java -cp "$out" writer_validation)"
          test "$writer_stdout" = 'PASS deterministic=7 exhaustive=87381 randomized=10000 oracle=bruteforce-char-substrings contract=utf16-code-unit'
          (cd "$tmp" && javac CandidateHarness.java && java CandidateHarness > stdout.txt)
          reviewer_stdout="$(cat "$tmp/stdout.txt")"
          test "$reviewer_stdout" = 'PASS exact_candidate deterministic=8 exhaustive=29524 randomized=15000 oracle=independent-hashset-bruteforce contract=utf16-code-unit'

          WRITER_STDOUT="$writer_stdout" REVIEW_STDOUT="$reviewer_stdout" python3 - <<'PY'
          import hashlib,json,os,pathlib
          cid=os.environ['CANONICAL_ID'];qid=os.environ['SOURCE_QID'];date='2026-08-27';out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}');candidate=pathlib.Path(f'review/candidates/answers/{cid}.md');digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          wv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'result':'pass','validated_at':date,'command':'javac writer_validation.java && java writer_validation','stdout':os.environ['WRITER_STDOUT'],'checks':['null/empty and standard deterministic cases','abba left-boundary regression','87381 exhaustive small strings','10000 seeded randomized UTF-16 code-unit strings','brute-force contiguous-substring oracle']};(out/'writer_validation.json').write_text(json.dumps(wv,ensure_ascii=False,indent=2)+'\n')
          rv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract exact candidate Java block and compare against independent HashSet brute-force oracle','stdout':os.environ['REVIEW_STDOUT'],'checks':['exact candidate compiles under Java 21','8 deterministic cases including abba and tmmzuxt','29524 exhaustive strings over a,b,中 lengths 0..9','15000 seeded randomized UTF-16 code-unit strings','independent HashSet brute-force oracle']};(out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          findings=['The preserved source explicitly requests maximum non-repeating substring length and a sliding-window implementation; null handling and Java UTF-16 code-unit semantics are clearly labeled candidate contracts.','The candidate maintains the duplicate-free window invariant and uses max(left, previous + 1), preventing historical occurrences outside the current window from moving the left boundary backward.','The exact Java candidate compiles and matches an independent HashSet brute-force contiguous-substring oracle on deterministic, exhaustive and seeded randomized cases.','The answer distinguishes substring from subsequence and explicitly documents the Java char versus Unicode code-point boundary.','The O(n) expected-time explanation is consistent with one forward right-pointer scan and expected O(1) HashMap operations.','No fabricated production experience is claimed.']
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-longest-unique-20260827-v1','review_version':'longest-unique.sliding-window.v1','decision':'pass','revision_round':1,'source_packet':[os.environ['SOURCE_STRUCTURED'],os.environ['SOURCE_TAGGED'],str(candidate),'docs/refactor/09_answer_content_standard.md',str(out/'writer_validation.json'),str(out/'reviewer_validation.json')],'scores':{'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5},'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']};(out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'longest-unique-source-bounded-writer-20260827-v1','writer_version':'xhs-answer-curator.v1'},'sources':[{'source_id':'repository-structured','title':'Structured longest-unique substring source','locator':os.environ['SOURCE_STRUCTURED'],'source_type':'repository_structured_source','checked_at':date},{'source_id':'repository-tagged','title':'Tagged longest-unique substring source','locator':os.environ['SOURCE_TAGGED'],'source_type':'repository_structured_source','checked_at':date},{'source_id':'writer-validation','title':'Writer brute-force validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'reviewer-validation','title':'Independent exact-candidate brute-force review','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'isolated-review','title':'Fresh isolated source-first review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}],'claims':[{'claim_id':'source-boundary','text':'The preserved source explicitly asks for maximum non-repeating substring length using sliding window; null and UTF-16 char semantics are candidate contracts.','source_ids':['repository-structured','repository-tagged'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节']},{'claim_id':'window-invariant','text':'The left boundary advances to max(left, previous+1), preserving a duplicate-free current window without backward motion.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['1 分钟版','3 分钟版','关键细节','原理机制']},{'claim_id':'behavior-validation','text':'Writer and independent reviewer validations compare the exact sliding-window behavior with brute-force contiguous-substring oracles over deterministic, exhaustive and seeded randomized strings.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['3 分钟版','关键细节','常见追问','易错点']}],'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks']},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':review['scores'],'hard_failures':[],'uncovered_source_variants':[],'unsupported_claims':[],'findings':findings}}
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md');text=task.read_text();line='- [x] `cq_q_9a62670f3e7cce3ac78ef3e463b235aa` longest-unique-substring candidate preserves the exact sliding-window source boundary, labels Java null/UTF-16 character semantics as explicit candidate contracts, provides complete last-seen-index Java, passes writer differential validation plus an independent exact-candidate brute-force review across deterministic, exhaustive and seeded randomized strings, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.'
          if line not in text:
              if '## Progress' not in text:text=text.rstrip()+'\n\n## Progress\n'
              text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY
          rm -f "$out"/*.class

      - name: Commit reviewed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0038/$CANONICAL_ID/writer_validation.json" \
                  "review/content_build/answer_batch_0038/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0038/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md
          git commit -m 'review: pass batch 0038 longest-unique-substring candidate source-first'
          for attempt in 1 2 3; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"; git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
