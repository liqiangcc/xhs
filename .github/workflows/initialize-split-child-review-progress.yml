name: Initialize Split Child Review Progress

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/initialize-split-child-review-progress.yml
      - scripts/content/initialize_split_child_review_progress.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: initialize-split-child-review-progress
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Initialize only missing ReviewProgress items
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/initialize_split_child_review_progress.py > /tmp/init-progress.py
          python3 -m py_compile /tmp/init-progress.py
          python3 /tmp/init-progress.py

      - name: Verify integrity and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Verify no fabricated real-review telemetry
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          ids={'cq_q_88d86d8e4586504b5c9365f4126f7436','cq_q_b66328eb23ca1ba53a062a787c71a9dc'}
          progress=json.loads(Path('review/progress.json').read_text(encoding='utf-8'))
          rows={r.get('canonical_id'):r for r in progress.get('items',[]) if r.get('canonical_id') in ids}
          if set(rows)!=ids: raise SystemExit(f'missing target progress: {ids-set(rows)}')
          for cid,row in rows.items():
              if row.get('status')!='new' or row.get('review_count')!=0 or row.get('last_reviewed_at') is not None or row.get('mistake_count')!=0:
                  raise SystemExit(f'{cid}: initialization fabricated review telemetry: {row}')
          print('PASS split-child ReviewProgress initialized with zero real-review telemetry')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during ReviewProgress initialization: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add review/progress.json
          if git diff --cached --quiet; then echo 'ReviewProgress already initialized.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: initialize split-child review progress'
          git push origin "HEAD:$CONTENT_BRANCH"
