    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Freeze source boundary and ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "review/content_build/answer_batch_0034/$CANONICAL_ID"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "/tmp/$CANONICAL_ID.context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,note=process.env.SOURCE_NOTE;
          const tagged=JSON.parse(fs.readFileSync(note,'utf8'));
          const src=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：业务场景题（购物车合并）？';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          if(src.question_type!=='算法手撕_Coding') throw new Error(`source type drifted: ${src.question_type}`);
          const ctx=JSON.parse(fs.readFileSync(`/tmp/${cid}.context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
