name: Build Content Batch 0034 Cart Merge Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0034-cart-merge-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-cart-merge-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7b295050485d85a9831398730c0ce1a5
  SOURCE_QID: 43f70cfb3ecc582e11bf3dc305a18f3c
  SOURCE_NOTE: note_tagged/68bc0218000000001d02a145.json

jobs:
