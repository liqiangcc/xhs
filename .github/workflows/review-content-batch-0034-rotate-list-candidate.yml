name: Review Content Batch 0034 Rotate List Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0034-rotate-list-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-rotate-list-reviewer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7e93bb8ccd946bbd81a28ca6d880ccf5

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first isolated review and identity oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; candidate="review/candidates/answers/$cid.md"
          test -s "$candidate"; test -s "$out/source_mapping.json"; test -s "$out/code_validation.json"; test ! -e "$out/isolated_review_result.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const note=JSON.parse(fs.readFileSync(mapping.note_path,'utf8'));
          const q=(note.tagged_questions||[]).find(x=>x.question_id===mapping.note_question_id);
          const expected='算法：旋转链表 (LeetCode 61)';
          if(!q||q.original_question!==expected||q.question_type!=='算法手撕_Coding') throw new Error('preserved source drifted');
          const md=fs.readFileSync(candidate,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(!md.includes(h)) throw new Error(`missing ${h}`);
          for(const token of ['k % n','tail.next = head','O(n)','O(1)','节点身份','来源没有真实项目']) if(!md.includes(token)) throw new Error(`required content missing ${token}`);
          const f=md.match(/```java\n([\s\S]*?)\n```/); if(!f) throw new Error('Java fence missing'); fs.writeFileSync('/tmp/RotateList.java',f[1].trim()+'\n');
          NODE
          cat > /tmp/RotateListReviewTest.java <<'JAVA'
          import java.util.*;
          public final class RotateListReviewTest {
              static RotateList.ListNode[] make(int n){RotateList.ListNode[] a=new RotateList.ListNode[n];for(int i=0;i<n;i++){a[i]=new RotateList.ListNode(1000+i);if(i>0)a[i-1].next=a[i];}return a;}
              static void check(int n,int k){
                  RotateList.ListNode[] a=make(n); RotateList.ListNode head=n==0?null:a[0];
                  RotateList.ListNode r=RotateList.rotateRight(head,k);
                  if(n==0){if(r!=null)throw new AssertionError("empty");return;}
                  int shift=k%n; RotateList.ListNode[] exp=new RotateList.ListNode[n]; for(int i=0;i<n;i++) exp[i]=a[(i-shift+n)%n];
                  IdentityHashMap<RotateList.ListNode,Boolean> seen=new IdentityHashMap<>(); RotateList.ListNode p=r;
                  for(int i=0;i<n;i++){
                      if(p==null) throw new AssertionError("early null n="+n+" k="+k);
                      if(seen.put(p,Boolean.TRUE)!=null) throw new AssertionError("cycle/duplicate n="+n+" k="+k);
                      if(p!=exp[i]) throw new AssertionError("identity order n="+n+" k="+k+" i="+i);
                      p=p.next;
                  }
                  if(p!=null) throw new AssertionError("residual cycle/extra node");
                  if(seen.size()!=n) throw new AssertionError("lost node");
              }
              public static void main(String[] args){
                  check(0,0); for(int n=1;n<=8;n++) for(int k=0;k<=40;k++) check(n,k); check(5,Integer.MAX_VALUE);
                  boolean threw=false;try{RotateList.rotateRight(make(2)[0],-1);}catch(IllegalArgumentException e){threw=true;}if(!threw)throw new AssertionError("negative contract");
                  System.out.println("PASS exhaustive-n<=8-k<=40 identity-order no-cycle no-loss huge-k negative-contract");
              }
          }
          JAVA
          mkdir -p /tmp/rotate-review-classes
          javac -d /tmp/rotate-review-classes /tmp/RotateList.java /tmp/RotateListReviewTest.java
          stdout="$(java -cp /tmp/rotate-review-classes RotateListReviewTest)"
          test "$stdout" = 'PASS exhaustive-n<=8-k<=40 identity-order no-cycle no-loss huge-k negative-contract'
          hash="$(sha256sum "$candidate"|awk '{print $1}')"
          CANDIDATE_HASH="$hash" REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`,m=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const r={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_HASH,reviewed_at:'2026-08-26',review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0034-rotate-list-20260826-v1',review_version:'batch-0034.rotate-list.v1',decision:'pass',revision_round:1,source_packet:[m.note_path,path.join(out,'source_mapping.json'),'review/content_build/answer_batch_0034/source_boundary_audit.md',`review/candidates/answers/${cid}.md`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5},hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:['The preserved source identifies Rotate List as LeetCode 61 and coding intent, but the local source does not preserve the full platform statement, ListNode declaration, bounds, or negative-k semantics.','The candidate explicitly states a narrow right-rotation/non-negative-k contract and marks negative-k rejection as answer-side policy rather than recovered source.','The length/modulo/temporary-ring/cut algorithm preserves the original nodes, runs in O(n) time with O(1) auxiliary space, and explains the cut position rather than only presenting code.','The exact Java fence independently passed an identity-based oracle for every n<=8 and k<=40 plus huge k, proving expected node order, no lost/duplicated nodes and no residual cycle.','The answer calls out empty/singleton/modulo boundaries and does not fabricate project experience.'],validation:{command:'javac exact candidate fence + independent identity oracle && java RotateListReviewTest',result:'pass',stdout:process.env.REVIEW_STDOUT},promotion_blockers:['required_human_approval_not_yet_satisfied','repository_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(path.join(out,'isolated_review_result.json'),JSON.stringify(r,null,2)+'\n');
          NODE

      - name: Bind verdict after independent conclusion and commit
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";out="review/content_build/answer_batch_0034/$cid"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const r=JSON.parse(fs.readFileSync(path.join(out,'isolated_review_result.json'),'utf8'));if(r.decision!=='pass'||r.hard_failures.length)throw new Error('review fail');
          const wp=path.join(out,'writer_research.json'),w=JSON.parse(fs.readFileSync(wp,'utf8'));if(w.review_state!=='writer_complete_isolated_review_pending')throw new Error(`writer state ${w.review_state}`);
          w.review_state='independent_source_first_review_passed';w.sources.push({source_id:'isolated-review',title:'Independent source-first rotate-list candidate review',locator:path.join(out,'isolated_review_result.json'),source_type:'repository_structured_source',checked_at:'2026-08-26'});w.claims.push({claim_id:'isolated-review-verdict',text:'Independent review found no hard failures or uncovered source variants and validated exact node identity order/no-cycle invariants over bounded exhaustive n/k cases.',source_ids:['isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']});w.promotion_blocker='required_human_approval_and_real_review_policy_not_yet_satisfied';w.review={reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:1,scores:r.scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:r.findings};fs.writeFileSync(wp,JSON.stringify(w,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md';let t=fs.readFileSync(task,'utf8'),p='- Rotate-list canonical `'+cid+'` passed isolated source-first review and independent exhaustive identity/no-cycle validation; promotion remains blocked only by required human approval and repository real-review policy.';if(!t.includes(p))t=t.trimEnd()+'\n'+p+'\n';fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-review-bot;git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0034/$CANONICAL_ID/isolated_review_result.json" "review/content_build/answer_batch_0034/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git commit -m 'review: pass batch 0034 rotate-list candidate source-first'
          for attempt in 1 2 3 4 5;do if git pull --rebase origin "$CONTENT_BRANCH"&&git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi;git rebase --abort 2>/dev/null||true;sleep $((attempt*3));done;exit 1
