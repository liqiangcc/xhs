          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-26',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Exact tagged repository question and Batch 0033 frozen source boundary',locator:'note_tagged/663bb0e8000000001e027dad.json + review/content_build/answer_batch_0033/source_boundary_audit.md',source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'fixture',title:'Point-to-infinite-line deterministic C++20 validation against independent general-form oracle',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-26'}],claims:[{claim_id:'source-boundary',text:'The repository source preserves only a 2D point-to-line C++ coding task; line representation, API, numeric policy, degenerate behavior, precision and line-vs-segment details are not preserved source constraints.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'implementation',text:'Under the explicit answer-side contract of an infinite line through two distinct points, the exact compiled C++20 implementation returns abs(cross(B-A,P-A))/|B-A| and rejects A==B.',source_ids:['fixture'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'behavior-validation',text:'The fixture passes five fixed geometry cases, degenerate rejection, endpoint-order invariance, non-negativity, and 5,000 deterministic random cases against an independent Ax+By+C oracle.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md';
          let text=fs.readFileSync(task,'utf8');
          const marker='- [ ] Every candidate passes `answer audit --require-evidence`.';
          const note='- [ ] `cq_q_7642700411d0977839a2cd01a41e50ad` writer slice staged: exact tagged wording and singleton ownership are frozen; infinite-line/two-point/C++20/numeric/degenerate choices remain explicit answer-side contracts; the exact fixture covers five fixed cases plus 5,000 deterministic random cases against an independent general-form oracle. Isolated independent review is still required before promotion.';
          if(!text.includes(note)) {
            if(!text.includes(marker)) throw new Error('task completion marker missing');
            text=text.replace(marker,marker+'\n'+note);
            fs.writeFileSync(task,text);
          }
          NODE
          git diff --check

      - name: Run writer-safe repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
