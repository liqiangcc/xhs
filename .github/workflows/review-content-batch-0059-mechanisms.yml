name: Review Content Batch 0059 Mechanism Candidates

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0059-mechanisms.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-batch-0059-mechanisms-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Recheck source-first review boundaries
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const specs=[
            {
              cid:'cq_q_f32cdfd75a0bc2501dfc97c6967a6327',
              qids:['f32cdfd75a0bc2501dfc97c6967a6327','f90e8044c275051262a5d00f963870a8','fd640e8f64436e2d2cd9b96fbe2cb26c'],
              markers:['publisher confirms','manual ack','quorum queue','幂等','exactly-once']
            },
            {
              cid:'cq_q_65d3c5ebd158ae8b41e0d2cea973ce90',
              qids:['65d3c5ebd158ae8b41e0d2cea973ce90','6fa9860cd1ef62633a5c18f47c2aac2a','72635cea88de998cf6e6610deee0760c','79237909093bc557d8af0f1deee8e926'],
              markers:['singletonObjects','earlySingletonObjects','singletonFactories','getEarlyBeanReference','SmartInstantiationAwareBeanPostProcessor','BeanCurrentlyInCreationException','allowCircularReferences']
            }
          ];
          const sections=['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点'];
          for(const spec of specs){
            const base=`review/content_build/answer_batch_0059/${spec.cid}`;
            const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
            if(!ctx.ok||ctx.answer_type!=='mechanism'||ctx.canonical?.canonical_id!==spec.cid) throw new Error(`${spec.cid}: context/type drift`);
            if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(spec.qids)) throw new Error(`${spec.cid}: ownership drift`);
            if(!spec.qids.every(qid=>(ctx.source_questions||[]).some(x=>x.question_id===qid&&x.is_valid_for_library===true))) throw new Error(`${spec.cid}: source coverage drift`);
            const primary=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
            if(primary.schema_version!=='answer_primary_source_research.v1'||primary.canonical_id!==spec.cid||primary.source_boundary?.answer_type!=='mechanism') throw new Error(`${spec.cid}: primary research drift`);
            const md=fs.readFileSync(`review/candidates/answers/${spec.cid}.md`,'utf8');
            for(const section of sections) if(md.split(section).length-1!==1) throw new Error(`${spec.cid}: section drift ${section}`);
            for(const marker of spec.markers) if(!md.includes(marker)) throw new Error(`${spec.cid}: marker missing ${marker}`);
            if((md.match(/^- 问：/gm)||[]).length<5) throw new Error(`${spec.cid}: followups insufficient`);
            if(/生产环境里我|我负责过|我在线上|实际线上我们|我们项目中/.test(md)) throw new Error(`${spec.cid}: fabricated experience risk`);
            const digest=crypto.createHash('sha256').update(fs.readFileSync(`review/candidates/answers/${spec.cid}.md`)).digest('hex');
            const review=JSON.parse(fs.readFileSync(`${base}/isolated_review_result.json`,'utf8'));
            if(review.review_mode!=='source_first_isolated'||review.decision!=='pass'||review.candidate_sha256!==digest||review.hard_failures?.length) throw new Error(`${spec.cid}: isolated review drift`);
            const evidence=JSON.parse(fs.readFileSync(`review/evidence/${spec.cid}.json`,'utf8'));
            if(evidence.review_state!=='independent_source_first_review_passed'||evidence.candidate_sha256!==digest||evidence.review?.decision!=='pass'||evidence.review?.independent!==true) throw new Error(`${spec.cid}: evidence/review drift`);
          }
          NODE

      - name: Strict candidate audits
        shell: bash
        run: |
          set -euo pipefail
          for cid in \
            cq_q_f32cdfd75a0bc2501dfc97c6967a6327 \
            cq_q_65d3c5ebd158ae8b41e0d2cea973ce90
          do
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/$cid.md" --require-evidence --noWrite --noDraftCheck
          done

      - name: Repository closure gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:coverage
