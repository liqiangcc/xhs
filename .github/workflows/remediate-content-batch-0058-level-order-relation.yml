name: Remediate Content Batch 0058 Level Order Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0058-level-order-relation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0058-level-order-relation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_QID: 68a77b01c3a999732bc21dc888503621
  TARGET_CID: cq_q_68a77b01c3a999732bc21dc888503621
  DUP_QID: 3590292944e8b631aa2e0cf561c565e5
  DUP_CID: cq_q_3590292944e8b631aa2e0cf561c565e5

jobs:
  review-normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze source-first relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0058
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          const target=byC.get(process.env.TARGET_CID), dup=byC.get(process.env.DUP_CID);
          if(!target||!dup) throw new Error('both level-order Canonicals must exist before bounded relation review');
          if(!target.question_ids?.includes(process.env.TARGET_QID)) throw new Error('target bridge Question ownership drifted');
          if(!dup.question_ids?.includes(process.env.DUP_QID)) throw new Error('duplicate bridge Question ownership drifted');

          const targetCtx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0058/${process.env.TARGET_CID}/context.json`,'utf8'));
          const dupCtx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0058/${process.env.DUP_CID}/context.json`,'utf8'));
          if(targetCtx.answer_type!=='coding'||dupCtx.answer_type!=='coding') throw new Error('both relation sides must remain Coding');
          const allContexts=[targetCtx,dupCtx];
          for(const ctx of allContexts){
            for(const src of ctx.source_questions||[]){
              const row=byQ.get(src.question_id);
              if(!row||row.canonical_id!==ctx.canonical.canonical_id||row.is_valid_for_library!==true||row.original_question!==src.original_question){
                throw new Error(`${src.question_id}: frozen Question/context drift`);
              }
              const notePath=`note_tagged/${row.source_note_id}.json`;
              if(!fs.existsSync(notePath)) throw new Error(`${src.question_id}: primary repository note missing: ${notePath}`);
              const note=JSON.parse(fs.readFileSync(notePath,'utf8'));
              const found=note.tagged_questions?.some(q=>q.question_id===row.question_id&&q.original_question===row.original_question&&q.is_valid_for_library===true);
              if(!found) throw new Error(`${src.question_id}: primary repository source wording drifted`);
            }
          }

          const targetTexts=(targetCtx.source_questions||[]).map(q=>q.original_question);
          const dupTexts=(dupCtx.source_questions||[]).map(q=>q.original_question);
          const review=`# Batch 0058 Level-Order Traversal Source-First Relation Review\n\n`+
            `## Primary-source facts\n\n`+
            `- Survivor-side repository sources preserve only binary-tree level-order traversal / LeetCode 102 wording: ${targetTexts.map(x=>'“'+x+'”').join('；')}。\n`+
            `- Duplicate-side repository sources preserve “算法：层序遍历” / “算法：树的层序遍历”，and the frozen/current taxonomy binds this Canonical to tree/binary-tree + queue level-order traversal: ${dupTexts.map(x=>'“'+x+'”').join('；')}。\n`+
            `- Across both source packets, no source preserves a distinct contract such as N-ary-only traversal, zigzag order, bottom-up order, DFS output, or a different return shape. Both are Coding prompts for ordinary breadth-first level-order traversal.\n\n`+
            `No historical relation/remediation record was consulted before this conclusion.\n\n`+
            `## Decision\n\n`+
            `Relation: \`same\`. Consolidate \`${process.env.DUP_CID}\` into survivor \`${process.env.TARGET_CID}\`; preserve every valid source Question from both packets under the survivor. The LeetCode-102 wording is a named instance of the same ordinary binary-tree level-order traversal contract represented by the generic wording.\n\n`+
            `## Content consequence\n\n`+
            `Do not write two independent answers for the same operation. After normalization, Batch 0058 source inventory must be regenerated against current ownership before candidate writing. This relation decision does not promote any Answer.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0058/level_order_relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Select decide and apply reviewed relation
        shell: bash
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0058/level_order_relation_apply'
          mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$TARGET_QID,$DUP_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(r.relation_candidates)||r.relation_candidates.length!==1) throw new Error(`expected one RelationCandidate, got ${r.relation_candidates?.length}`);
          const c=r.relation_candidates[0];
          const actual=[...c.question_ids].sort(), expected=[process.env.TARGET_QID,process.env.DUP_QID].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`selected pair drifted: ${JSON.stringify(actual)}`);
          process.stdout.write(c.relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide \
            --relation-candidate-key "$key" \
            --relation same \
            --actor-type ai \
            --actor-id batch-0058-level-order-source-first-review \
            --actor-display-name 'Level-order source-first reviewer' \
            --rationale 'Current frozen repository sources on both Canonicals ask for ordinary tree/binary-tree breadth-first level-order traversal. LeetCode 102 is the named binary-tree instance; no source preserves a distinct traversal order, tree-kind-only contract, or output semantic.' > "$out/decide.json"
          node scripts/xhs.js dedup apply \
            --relation-candidate-key "$key" \
            --canonical-id "$TARGET_CID" \
            --canonical-title '算法：二叉树的层序遍历（Level Order Traversal / LeetCode 102）' > "$out/apply.json"

      - name: Verify consolidation and regenerate Batch 0058 source inventory
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q])), byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          if(byC.has(process.env.DUP_CID)) throw new Error('duplicate level-order Canonical survived consolidation');
          const target=byC.get(process.env.TARGET_CID);
          if(!target) throw new Error('level-order survivor missing');
          const expected=['68a77b01c3a999732bc21dc888503621','b0718b3bec6dd4f85105aaefce8cb37e','c98862ff84a6e807b311b750df86ad92','f4c91cb6297dfbe25f2e08cee70d6cd7','3590292944e8b631aa2e0cf561c565e5','8eab176c51a37f667765b1624f8aca4d'];
          for(const qid of expected){if(byQ.get(qid)?.canonical_id!==process.env.TARGET_CID||!target.question_ids?.includes(qid))throw new Error(`${qid}: survivor ownership missing`);}
          fs.writeFileSync('review/content_build/answer_batch_0058/level_order_relation_apply.md',
            '# Batch 0058 Level-Order Relation Application\n\n'+
            '- Relation: `same`.\n'+
            '- Survivor: `'+process.env.TARGET_CID+'`; it now owns all six reviewed level-order source Questions.\n'+
            '- Retired duplicate Canonical: `'+process.env.DUP_CID+'`.\n'+
            '- No Answer was promoted by this normalization.\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0058.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_3590292944e8b631aa2e0cf561c565e5` was reviewed source-first against `cq_q_68a77b01c3a999732bc21dc888503621`: current repository sources on both sides preserve the same ordinary tree/binary-tree breadth-first level-order traversal operation, with LeetCode 102 only naming the standard binary-tree instance. Relation is `same`; all six valid source Questions are consolidated under the survivor and the duplicate Canonical is retired. Candidate writing must target only the survivor.';
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/build_batch_0058_source_inventory.py > /tmp/inventory.py
          python3 /tmp/inventory.py

      - name: Refresh generated audits and run full gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during level-order relation slice: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then echo 'No changes to commit.'; exit 0; fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: normalize level-order source relation'
          git push origin "HEAD:$CONTENT_BRANCH"
