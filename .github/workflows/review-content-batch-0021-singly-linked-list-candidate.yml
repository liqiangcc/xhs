name: Review Content Batch 0021 Singly Linked List Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0021-singly-linked-list-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-singly-linked-list-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_37245bc43848028f006b2e4eaea7500c
  SOURCE_QID: 37245bc43848028f006b2e4eaea7500c
  SOURCE_NOTE: note_tagged/6655a5b10000000016010440.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum $SOURCE_NOTE | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review and independent Java validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0021/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"; test -f "$out/code_validation.json"; rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,note=process.env.SOURCE_NOTE;
          const source=JSON.parse(fs.readFileSync(note,'utf8'));
          const row=(source.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：手写代码实现单向链表的结构体,完成增删改查';
          if(!row||row.original_question!==expected||row.is_valid_for_library!==true)throw new Error(`primary source drift: ${JSON.stringify(row)}`);
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点'])if(md.split(h).length!==2)throw new Error(`section drift: ${h}`);
          for(const marker of ['题源只支持“手写单向链表结构并完成增删改查”','Java、泛型、按下标 CRUD','head','tail','size','tail.next == null','插入位置是 `[0,size]`','删除唯一节点','ArrayList','5000 次确定性随机 CRUD'])if(!md.includes(marker))throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md))throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<3)throw new Error('followups insufficient');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block)throw new Error('Java code block missing');
          fs.writeFileSync(`review/content_build/answer_batch_0021/${cid}/reviewer_tmp/SinglyLinkedList.java`,block[1]+'\n');
          NODE
          cat > "$out/reviewer_tmp/ReviewerHarness.java" <<'JAVA'
          import java.util.*;
          public final class ReviewerHarness {
            static void eq(Object a,Object b,String m){if(!Objects.equals(a,b))throw new AssertionError(m+": "+a+" != "+b);}
            static void expectOob(Runnable r){try{r.run();throw new AssertionError("expected IndexOutOfBoundsException");}catch(IndexOutOfBoundsException ok){}}
            public static void main(String[] args){
              SinglyLinkedList<Integer> x=new SinglyLinkedList<>(); ArrayList<Integer> y=new ArrayList<>();
              eq(x.size(),0,"empty size"); eq(x.isEmpty(),true,"empty flag"); expectOob(()->x.get(0)); expectOob(()->x.remove(0)); expectOob(()->x.insert(-1,1));
              x.add(null); y.add(null); x.insert(0,7); y.add(0,7); x.insert(x.size(),9); y.add(9); eq(x.toList(),y,"fixed list");
              eq(x.set(1,8),y.set(1,8),"set old"); eq(x.remove(0),y.remove(0),"remove head"); eq(x.remove(x.size()-1),y.remove(y.size()-1),"remove tail"); eq(x.toList(),y,"fixed removals");
              Random rnd=new Random(20260826L);
              for(int i=0;i<10000;i++){
                int op=rnd.nextInt(5), value=rnd.nextInt(2001)-1000;
                if(op==0||y.isEmpty()){int idx=rnd.nextInt(y.size()+1);x.insert(idx,value);y.add(idx,value);}
                else if(op==1){x.add(value);y.add(value);}
                else if(op==2){int idx=rnd.nextInt(y.size());eq(x.get(idx),y.get(idx),"get");}
                else if(op==3){int idx=rnd.nextInt(y.size());eq(x.set(idx,value),y.set(idx,value),"set");}
                else {int idx=rnd.nextInt(y.size());eq(x.remove(idx),y.remove(idx),"remove");}
                eq(x.size(),y.size(),"size"); eq(x.isEmpty(),y.isEmpty(),"isEmpty"); eq(x.toList(),y,"sequence");
              }
              expectOob(()->x.get(-1)); expectOob(()->x.get(x.size())); expectOob(()->x.insert(x.size()+1,1));
              System.out.println("PASS independent_ops=10000 oracle=ArrayList boundaries=empty-single-head-middle-tail-null-oob");
            }
          }
          JAVA
          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror SinglyLinkedList.java ReviewerHarness.java && java ReviewerHarness > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS independent_ops=10000 oracle=ArrayList boundaries=empty-single-head-middle-tail-null-oob'
          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['Primary source preserves only the requirement to handwrite a singly linked-list structure with CRUD; language, API shape, index-versus-value semantics, null policy, and tail-pointer policy are not preserved constraints.','Candidate clearly labels Java generics, index-based CRUD, null support, and tail tracking as answer-side assumptions rather than source facts.','The representation invariant is explicit and the CRUD pointer updates, index bounds, and head/tail transitions are internally consistent.','Candidate Java compiles with warnings treated as errors and an independent 10000-operation ArrayList differential harness passes empty, single-node, head/middle/tail, null, and out-of-bounds cases.','Complexity claims match the implementation: tail append and head insert/remove are constant time while index-based traversal operations are linear in the worst case.','No fabricated production experience or placeholder implementation was found; follow-ups are specific to the linked-list contract and include failure/boundary cases.'];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; independent 10000-operation ArrayList differential harness',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','empty and invalid-access behavior','single-node transitions','head/middle/tail insert and remove','set returns old value','null payload','negative and upper-bound rejection','10000 deterministic randomized CRUD operations against ArrayList'],boundary_tests:[{case:'source underspecifies API',expected:'answer marks Java/index/null/tail choices as candidate assumptions',passed:true},{case:'empty and single-node head/tail transitions',expected:'public behavior remains consistent across first insert and final remove',passed:true},{case:'index versus insertion bounds',expected:'get/set/remove use [0,size) while insert accepts [0,size]',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-singly-linked-list-20260826-v1',review_version:'singly-linked-list.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind evidence after independent conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8')),wv=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8')),rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||wv.result!=='pass'||rv.result!=='pass')throw new Error('evidence prerequisite drift');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'singly-linked-list-source-bounded-writer-20260824-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'primary-source',title:'Primary tagged interview note',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Writer linked-list differential validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent linked-list differential validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The primary source requires a handwritten singly linked-list structure with CRUD but does not preserve language or API-shape constraints.',source_ids:['primary-source'],answer_locations:['核心结论','1 分钟版','关键细节']},{claim_id:'implementation',text:'Under the explicitly declared Java/index-based contract, head/tail/size transitions and CRUD behavior pass writer and independent differential validation.',source_ids:['writer-validation','reviewer-validation'],answer_locations:['3 分钟版','关键细节','原理机制']},{claim_id:'complexity-and-boundaries',text:'The candidate distinguishes constant-time tail append/head updates from index-based linear traversal and covers empty, single-node, null, and index-boundary behavior.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';let text=fs.readFileSync(task,'utf8');
          const p='- `cq_q_37245bc43848028f006b2e4eaea7500c` — coding; source-first Java candidate staged with explicit answer-side API assumptions; fixed and 5000-operation `ArrayList` differential validation PASS; isolated review/evidence/formal audit remain pending before promotion.';
          const d='- `cq_q_37245bc43848028f006b2e4eaea7500c` — coding; source-first Java candidate keeps API/language assumptions explicit, passes writer 5000-operation plus independent reviewer 10000-operation `ArrayList` differential validation, and passes isolated source-first review with evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(!text.includes(p)&&!text.includes(d))throw new Error('task marker drift'); if(text.includes(p))fs.writeFileSync(task,text.replace(p,d));
          NODE

      - name: Strict candidate audit and complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git add -A; git diff --cached --check
          git config user.name 'xhs-review-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass singly-linked-list candidate source-first'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"; base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_source="$(git show "origin/$CONTENT_BRANCH:$SOURCE_NOTE" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_source" = '${{ steps.base.outputs.source_sha256 }}' || { echo 'source changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
