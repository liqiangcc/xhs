name: Remediate Batch 0021 Package Writer Gate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-batch-0021-package-writer-gate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: remediate-batch-0021-package-writer-gate
  cancel-in-progress: true

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Patch writer-only audit gate
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/build-content-batch-0021-package-interval-peak-candidate.yml
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/build-content-batch-0021-package-interval-peak-candidate.yml')
          text=p.read_text()
          old='node scripts/xhs.js answer audit --canonical-id "$CANONICAL_ID" --require-evidence --noWrite'
          new='node scripts/xhs.js answer audit --canonical-id "$CANONICAL_ID" --noWrite'
          if old not in text:
              if new in text:
                  print('already patched')
                  raise SystemExit(0)
              raise SystemExit('expected writer audit command not found')
          p.write_text(text.replace(old,new,1))
          PY
          git diff --check
          git diff -- "$target"

      - name: Commit corrected lifecycle gate
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/build-content-batch-0021-package-interval-peak-candidate.yml
          if git diff --quiet -- "$target"; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name xhs-ci-remediator
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "$target"
          git commit -m 'ci: allow package candidate audit before evidence review'
          git push origin HEAD:master
