name: Review Content Batch 0038 Longest-Palindrome Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0038-longest-palindrome.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0038-longest-palindrome-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_941c1d33b39c30a33ae65f2457810760
  SOURCE_QID: 941c1d33b39c30a33ae65f2457810760
  SOURCE_STRUCTURED: note_structured/681b2c5e000000001101ecb6.json
  SOURCE_TAGGED: note_tagged/681b2c5e000000001101ecb6.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Phase A source-first boundary and exact-candidate review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0038/$cid"
          tmp="$out/reviewer_tmp"
          rm -rf "$tmp"
          mkdir -p "$tmp"

          python3 - <<'PY'
          import json, os, pathlib, re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']
          exact='算法：最长回文子串 (空间复杂度优化)?'
          structured=json.loads(pathlib.Path(os.environ['SOURCE_STRUCTURED']).read_text())
          if exact not in structured.get('questions',[]): raise SystemExit('structured source drift')
          tagged=json.loads(pathlib.Path(os.environ['SOURCE_TAGGED']).read_text())
          q=next((x for x in tagged.get('tagged_questions',[]) if x.get('question_id')==qid),None)
          if not q or q.get('original_question')!=exact or q.get('is_valid_for_library') is not True:
              raise SystemExit('tagged source drift')

          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md')
          md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in [
              'expand(s, center, center)',
              'expand(s, center, center + 1)',
              '额外空间 `O(1)`',
              '时间 `O(n^2)`',
              'UTF-16',
              '起点最小',
              'Manacher',
              '`babad`',
              '`cbbd`'
          ]:
              if marker not in md: raise SystemExit(f'candidate missing {marker}')
          if len(re.findall(r'^- 问：',md,re.M)) < 5: raise SystemExit('followups insufficient')
          if re.search(r'我在线上|我负责过|我们生产|真实项目里我曾|线上事故',md): raise SystemExit('fabricated project claim')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java block, got {len(blocks)}')
          snippet=blocks[0].strip()
          harness='''import java.util.*;\n\npublic class CandidateHarness {\n'''+snippet+'''\n
            static String oracle(String s) {
              int bestStart=0,bestLen=0;
              for(int i=0;i<s.length();i++){
                for(int j=i;j<s.length();j++){
                  int len=j-i+1;
                  if(len<bestLen) continue;
                  boolean pal=true;
                  for(int l=i,r=j;l<r;l++,r--) if(s.charAt(l)!=s.charAt(r)){pal=false;break;}
                  if(pal && (len>bestLen || (len==bestLen && i<bestStart))){bestStart=i;bestLen=len;}
                }
              }
              return s.substring(bestStart,bestStart+bestLen);
            }

            static void check(String s) {
              String got=longestPalindrome(s), expected=oracle(s);
              if(!Objects.equals(got,expected)) throw new AssertionError("s="+s+" got="+got+" expected="+expected);
            }

            static void exhaustive(char[] alphabet, char[] buf, int pos) {
              if(pos==buf.length){check(new String(buf));return;}
              for(char c:alphabet){buf[pos]=c;exhaustive(alphabet,buf,pos+1);}
            }

            public static void main(String[] args) {
              boolean rejected=false;
              try{longestPalindrome(null);}catch(IllegalArgumentException e){rejected=true;}
              if(!rejected) throw new AssertionError("null accepted");
              String[] deterministic={"","a","aa","ab","aba","abba","babad","cbbd","aaaaa","abcda","bananas","forgeeksskeegfor","ac","abcdedcba","noonabbad"};
              for(String s:deterministic) check(s);
              int exhaustive=0;
              char[] alphabet={'a','b','c'};
              for(int n=0;n<=7;n++){
                int count=1; for(int i=0;i<n;i++) count*=alphabet.length;
                exhaustive+=count;
                exhaustive(alphabet,new char[n],0);
              }
              Random r=new Random(0x941c1d33L); int randomized=0;
              String randomAlphabet="abcde";
              for(int t=0;t<20000;t++){
                int n=r.nextInt(41); StringBuilder b=new StringBuilder();
                for(int i=0;i<n;i++) b.append(randomAlphabet.charAt(r.nextInt(randomAlphabet.length())));
                check(b.toString()); randomized++;
              }
              if(!longestPalindrome("babad").equals("bab")) throw new AssertionError("earliest-start tie drift");
              if(!longestPalindrome("cbbd").equals("bb")) throw new AssertionError("even center drift");
              System.out.println("PASS exact_candidate null=rejected deterministic="+deterministic.length+" exhaustive="+exhaustive+" randomized="+randomized+" oracle=bruteforce tie=earliest-start odd_even=covered");
            }
          }
          '''
          pathlib.Path(f'review/content_build/answer_batch_0038/{cid}/reviewer_tmp/CandidateHarness.java').write_text(harness)
          PY

          (cd "$tmp" && javac CandidateHarness.java && java CandidateHarness > stdout.txt)
          stdout="$(cat "$tmp/stdout.txt")"
          test "$stdout" = 'PASS exact_candidate null=rejected deterministic=15 exhaustive=3280 randomized=20000 oracle=bruteforce tie=earliest-start odd_even=covered'

          REVIEW_STDOUT="$stdout" python3 - <<'PY'
          import hashlib, json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-26'
          out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md')
          digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          checks=[
            'exact candidate Java implementation compiles under Java 21',
            'null is rejected and empty/single-character inputs follow the explicit contract',
            '15 deterministic cases cover odd/even centers, ties, all-equal strings and boundaries',
            'all 3280 strings of length 0..7 over a three-character alphabet match an independent brute-force oracle',
            '20000 seeded randomized strings of length 0..40 match the independent brute-force oracle',
            'babad resolves to the earliest-start longest palindrome and cbbd exercises the even-center path'
          ]
          rv={
            'schema_version':'answer_code_validation.v1',
            'canonical_id':cid,
            'candidate_sha256':digest,
            'result':'pass',
            'validated_at':date,
            'command':'extract the exact candidate Java block, compile it inside an independent harness, and compare deterministic/exhaustive/randomized outputs against a brute-force longest-palindrome oracle',
            'stdout':os.environ['REVIEW_STDOUT'],
            'checks':checks
          }
          (out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=[
            'The answer preserves the narrow source boundary and clearly labels Java/null/empty/tie/Unicode behavior as implementation contracts rather than source facts.',
            'The center-expansion invariant is explained for both odd and even centers, including the post-loop [left+1,right-1] boundary.',
            'The exact candidate implementation is complete Java rather than pseudocode and matches an independent brute-force oracle on deterministic, exhaustive, and randomized cases.',
            'The O(n^2) worst-case time and O(1) peak auxiliary search state are stated separately from returned-output storage.',
            'Tie behavior is deterministic and explicitly documented; the candidate does not assume an unstated online-judge acceptance rule.',
            'The UTF-16 char-unit boundary is explicit, and code-point/grapheme semantics are correctly left as a different contract.',
            'Manacher is presented as a time-optimization alternative with O(n) auxiliary arrays rather than being conflated with the requested space optimization.',
            'No fabricated production experience or business metric is claimed.'
          ]
          review={
            'schema_version':'isolated_review.v1',
            'canonical_id':cid,
            'candidate_sha256':digest,
            'reviewed_at':date,
            'review_mode':'source_first_isolated',
            'reviewer_id':'source-first-isolated-reviewer-longest-palindrome-20260826-v1',
            'review_version':'longest-palindrome.center-expansion.v1',
            'decision':'pass',
            'revision_round':1,
            'source_packet':[os.environ['SOURCE_STRUCTURED'],os.environ['SOURCE_TAGGED'],str(candidate),'docs/refactor/09_answer_content_standard.md',str(out/'reviewer_validation.json')],
            'scores':scores,
            'hard_failures':[],
            'unsupported_claims':[],
            'uncovered_source_variants':[],
            'findings':findings,
            'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          }
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Phase B bind evidence and record task progress
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"
          out="review/content_build/answer_batch_0038/$cid"
          javac "$out/writer_validation.java"
          java -cp "$out" writer_validation

          python3 - <<'PY'
          import json, os, pathlib
          cid=os.environ['CANONICAL_ID']; date='2026-08-26'
          out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}')
          writer=json.loads((out/'writer_research.json').read_text())
          wv=json.loads((out/'writer_validation.json').read_text())
          rv=json.loads((out/'reviewer_validation.json').read_text())
          review=json.loads((out/'isolated_review_result.json').read_text())
          if writer.get('review_state')!='writer_complete_isolated_review_pending' or wv.get('result')!='pass' or rv.get('result')!='pass' or review.get('decision')!='pass':
              raise SystemExit('phase state mismatch')
          evidence={
            'schema_version':'answer_evidence.v1',
            'canonical_id':cid,
            'candidate_sha256':review['candidate_sha256'],
            'checked_at':date,
            'writer':{'writer_id':'longest-palindrome-source-bounded-writer-20260826-v1','writer_version':'xhs-answer-curator.v1'},
            'sources':[
              {'source_id':'repository-structured','title':'Structured Hello interview source containing the longest-palindrome prompt','locator':os.environ['SOURCE_STRUCTURED'],'source_type':'repository_structured_source','checked_at':date},
              {'source_id':'repository-tagged','title':'Tagged longest-palindrome space-optimization question','locator':os.environ['SOURCE_TAGGED'],'source_type':'repository_structured_source','checked_at':date},
              {'source_id':'writer-validation','title':'Writer longest-palindrome brute-force differential validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'reviewer-validation','title':'Independent exact-candidate brute-force differential validation','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'isolated-review','title':'Fresh isolated source-first review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}
            ],
            'claims':[
              {'claim_id':'source-boundary','text':'The source asks for the longest palindromic substring with space-complexity optimization without specifying language, null/empty behavior, tie-breaking, or Unicode comparison units.','source_ids':['repository-structured','repository-tagged','isolated-review'],'answer_locations':['核心结论','1 分钟版','关键细节']},
              {'claim_id':'center-expansion','text':'Enumerating odd and even centers and expanding while the two boundary units match finds every candidate palindrome while storing only constant-size search state.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['1 分钟版','3 分钟版','关键细节','原理机制']},
              {'claim_id':'complexity-and-boundaries','text':'The exact candidate has O(n^2) worst-case time and O(1) peak auxiliary search state, uses Java UTF-16 char units, rejects null, returns empty for empty input, and resolves equal-length maxima by earliest start.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','常见追问']}
            ],
            'source_question_coverage':[{'question_id':os.environ['SOURCE_QID'],'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],
            'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks']},
            'review_state':'independent_source_first_review_passed',
            'review':{
              'reviewer_id':review['reviewer_id'],
              'review_version':review['review_version'],
              'independent':True,
              'decision':'pass',
              'revision_round':1,
              'scores':review['scores'],
              'hard_failures':[],
              'uncovered_source_variants':[],
              'unsupported_claims':[],
              'findings':review['findings']
            }
          }
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')

          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md')
          text=task.read_text()
          text=text.replace('- Status: `pending`','- Status: `in_progress`',1)
          progress='- [x] `cq_q_941c1d33b39c30a33ae65f2457810760` longest-palindrome candidate preserves the exact space-optimization source boundary, adopts explicit Java UTF-16/null/empty/earliest-start contracts, provides complete odd/even center-expansion Java, passes writer validation plus independent exact-candidate exhaustive and randomized brute-force differential validation, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.'
          if '## Progress' not in text:
              text=text.rstrip()+'\n\n## Progress\n\n'
          if progress not in text:
              text=text.rstrip()+'\n\n'+progress+'\n'
          task.write_text(text)
          PY
          rm -rf "$out/reviewer_tmp"

      - name: Commit reviewed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0038/$CANONICAL_ID/reviewer_validation.json" \
                  "review/content_build/answer_batch_0038/$CANONICAL_ID/isolated_review_result.json" \
                  "review/evidence/$CANONICAL_ID.json" \
                  tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md
          git commit -m 'review: pass batch 0038 longest-palindrome candidate source-first'
          for attempt in 1 2 3; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
