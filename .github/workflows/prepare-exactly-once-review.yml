name: Prepare Exactly Once Review

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/prepare-exactly-once-review.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tighten candidate and capture fixed review inputs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');

          const id = 'cq_message_exactly_once_4aede2ce';
          const candidatePath = `review/candidates/answers/${id}.md`;
          const outDir = `review/content_build/answer_batch_0009/${id}`;
          fs.mkdirSync(outDir, { recursive: true });

          let text = fs.readFileSync(candidatePath, 'utf8');
          if (!text.includes('"version":2,"status":"draft"')) throw new Error('unexpected exactly-once candidate version');
          text = text.replace('"version":2,"status":"draft"', '"version":3,"status":"draft"');

          const projectSection = `## 项目经验版\n\n以下是一个**假设性落地示例，不代表真实个人项目经历**。假设订单事件消费者使用 MySQL 8.4 保存 \`processed_event(consumer,event_id UNIQUE)\`、订单状态和 outbox；三者在同一个 InnoDB 事务中提交。消息重复到达时，唯一键竞争把重复执行变成可识别分支；只有首次事务成功后才允许推进 Kafka 消费位点。\n\n如果数据库事务已经提交、offset 提交前进程退出，Kafka 可以再次投递同一事件，但重复请求命中同一 \`event_id\` 后不再改业务状态。若 outbox relay 已调用第三方接口却在记录 delivered 前崩溃，则是否能安全重试取决于第三方是否接受稳定幂等键或提供结果查询/补偿；如果两者都没有，就必须明确降级为至少一次调用并用对账收敛，不能宣称跨系统 exactly-once。\n\n回归验证应故障注入数据库提交前/后崩溃、offset 提交失败、同一消息并发重复、outbox 模糊发送、Kafka 事务 abort 与下游 \`read_committed\` 读取。验收按业务状态和稳定事件 ID 判断“一次逻辑效果”，同时观察 duplicate-hit、事务失败、consumer lag、outbox 最老未投递年龄、DLQ 和重放恢复耗时，而不是用“网络上只看到一次消息”作为证明。\n\n`;
          const replaced = text.replace(/## 项目经验版\n\n[\s\S]*?\n## 常见追问\n/, `${projectSection}## 常见追问\n`);
          if (replaced === text) throw new Error('project section replacement failed');
          text = replaced;

          const oneMinute = text.match(/## 1 分钟版\n\n([\s\S]*?)\n\n## 3 分钟版/);
          if (!oneMinute) throw new Error('1-minute section missing');
          const bulletCount = oneMinute[1].split(/\r?\n/).filter((line) => line.startsWith('- ')).length;
          if (bulletCount < 3 || bulletCount > 5) throw new Error(`1-minute bullet count out of bounds: ${bulletCount}`);
          if (!text.includes('假设性落地示例，不代表真实个人项目经历')) throw new Error('hypothetical project boundary missing');
          if (/项目映射提示：/.test(text)) throw new Error('legacy project placeholder remained');

          fs.writeFileSync(candidatePath, text, 'utf8');
          const hash = crypto.createHash('sha256').update(text, 'utf8').digest('hex');
          fs.writeFileSync(`${outDir}/candidate_sha256.txt`, `${hash}\n`, 'utf8');

          const packet = {
            schema_version: 'isolated_answer_review_packet.v1',
            canonical_id: id,
            prepared_at: '2026-08-18',
            candidate: { path: candidatePath, sha256: hash, answer_type: 'scenario', version: 3 },
            context: { path: `${outDir}/context.json`, canonical_title: '如何实现消息处理的 exactly-once 业务效果？' },
            review_contract: {
              mode: 'source_first_isolated',
              required_quality_contract: 'config/answer_quality.json',
              required_content_standard: 'docs/refactor/09_answer_content_standard.md',
              allowed_repository_inputs: [
                `${outDir}/context.json`,
                candidatePath,
                'config/answer_quality.json',
                'docs/refactor/09_answer_content_standard.md',
                '.agents/skills/xhs-answer-curator/SKILL.md'
              ],
              forbidden_before_conclusion: [
                `review/evidence/${id}.json`,
                `review/candidates/audits/${id}.json`,
                'review/reports/FINAL_SOURCE_FIRST_REVIEW.json',
                'review/reports/FINAL_SOURCE_FIRST_REVIEW.md',
                'historical review/remediation records',
                'writer rationale or self-score'
              ],
              required_checks: [
                'Resolve the mixed-source-question-type risk from authoritative context before judging scope; reject a merged answer if source variants require distinct Canonicals.',
                'Verify Kafka 4.3 producer idempotence, transactional.id, sendOffsetsToTransaction and read_committed/LSO semantics against current Apache Kafka primary sources.',
                'Verify MySQL 8.4 InnoDB transaction and UNIQUE constraint semantics used by processed_event; distinguish database atomicity from MQ acknowledgement and external API effects.',
                'Verify outbox relay claims against current Debezium official documentation and require downstream idempotency/result-query/compensation boundaries for non-database side effects.',
                'Check stable event-id scope, concurrent duplicate races, retention/replay windows, offset ordering, ambiguous sends, DLQ/recovery, observability and capacity reasoning.',
                'Verify all source variants are directly answered and hypothetical project examples cannot be read as fabricated personal experience.'
              ],
              promotion_boundary: 'Do not promote or fabricate human approval. Pilot human review remains a separate mandatory gate when required by config.'
            },
            primary_sources_to_verify_independently: [
              {
                source_id: 'kafka-43-producer-config',
                title: 'Apache Kafka 4.3 Producer Configs',
                locator: 'https://kafka.apache.org/43/configuration/producer-configs/',
                source_type: 'official_documentation',
                claims_to_check: [
                  'enable.idempotence guarantees one copy for producer retries within its documented boundary and is enabled by default when configs do not conflict',
                  'idempotence requires acks=all, retries greater than zero and max.in.flight.requests.per.connection less than or equal to five'
                ]
              },
              {
                source_id: 'kafka-43-producer-api',
                title: 'Apache Kafka 4.3.1 KafkaProducer API',
                locator: 'https://kafka.apache.org/43/javadoc/org/apache/kafka/clients/producer/KafkaProducer.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'transactional.id enables transactional producer APIs and idempotence',
                  'sendOffsetsToTransaction marks offsets as part of the current transaction and they commit only if the transaction commits',
                  'Kafka transactional guarantees require transaction-aware downstream consumption'
                ]
              },
              {
                source_id: 'kafka-43-consumer-config',
                title: 'Apache Kafka 4.3 Consumer Configs',
                locator: 'https://kafka.apache.org/43/configuration/consumer-configs/',
                source_type: 'official_documentation',
                claims_to_check: [
                  'read_committed returns only committed transactional messages',
                  'read_committed is bounded by the last stable offset while transactions are open'
                ]
              },
              {
                source_id: 'mysql-84-innodb',
                title: 'MySQL 8.4 Introduction to InnoDB',
                locator: 'https://dev.mysql.com/doc/refman/8.4/en/innodb-introduction.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'InnoDB DML follows ACID transactions with commit, rollback and crash recovery'
                ]
              },
              {
                source_id: 'mysql-84-unique',
                title: 'MySQL 8.4 PRIMARY KEY and UNIQUE Index Constraints',
                locator: 'https://dev.mysql.com/doc/refman/8.4/en/constraint-primary-key.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'UNIQUE constraints reject duplicate key values subject to documented NULL semantics; processed_event must choose a non-null stable key design'
                ]
              },
              {
                source_id: 'debezium-outbox',
                title: 'Debezium Outbox Event Router',
                locator: 'https://debezium.io/documentation/reference/stable/transformations/outbox-event-router.html',
                source_type: 'official_documentation',
                claims_to_check: [
                  'outbox pattern persists internal state and event state so CDC can reliably relay committed outbox changes',
                  'outbox relay does not itself make arbitrary external API side effects exactly-once'
                ]
              }
            ],
            expected_output: {
              evidence_path: `review/evidence/${id}.json`,
              audit_path: `review/candidates/audits/${id}.json`,
              audit_command: `node scripts/xhs.js answer audit --candidate ${candidatePath} --require-evidence --noWrite`,
              reviewer_must_not_equal_writer: true
            }
          };
          fs.writeFileSync(`${outDir}/isolated_review_packet.json`, `${JSON.stringify(packet, null, 2)}\n`, 'utf8');
          NODE
          node scripts/xhs.js answer context --canonical-id cq_message_exactly_once_4aede2ce --noWrite > review/content_build/answer_batch_0009/cq_message_exactly_once_4aede2ce/context.json
          node - <<'NODE'
          const fs = require('fs');
          const c = JSON.parse(fs.readFileSync('review/content_build/answer_batch_0009/cq_message_exactly_once_4aede2ce/context.json', 'utf8'));
          if (!c.ok || c.canonical?.canonical_id !== 'cq_message_exactly_once_4aede2ce') throw new Error('unexpected exactly-once context');
          if (!c.source_questions?.length || !c.source_variants?.length) throw new Error('exactly-once source context incomplete');
          NODE
      - name: Remove one-off workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-exactly-once-review.yml
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git commit -m "content: prepare exactly-once isolated review"
          git push origin HEAD:content/quality-completion
