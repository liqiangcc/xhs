name: Integrate Promise.all CI gate

on:
  push:
    branches:
      - content/quality-completion

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Integrate candidate gate into central CI
        shell: python
        run: |
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          anchor = """      - name: Run batch 0013 parallel independent-task test
        working-directory: review/content_build/answer_batch_0013/cq_q_05d294848031e3626b66c720bb2273f1
        run: javac ParallelIndependentTasks.java ParallelIndependentTasksTest.java && java ParallelIndependentTasksTest

"""
          addition = anchor + """      - name: Audit batch 0013 Promise.all candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0758303ae6a5334a56c9c6239f2787ab.md --require-evidence --require-code --noWrite

      - name: Run batch 0013 Promise.all test
        working-directory: review/content_build/answer_batch_0013/cq_q_0758303ae6a5334a56c9c6239f2787ab
        run: node promise_all_test.js

"""
          if 'Audit batch 0013 Promise.all candidate' not in text:
              if anchor not in text:
                  raise SystemExit('parallel batch 0013 anchor not found')
              text = text.replace(anchor, addition, 1)

          diagnostic_anchor = "          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05d294848031e3626b66c720bb2273f1.md --require-evidence --require-code --noWrite > audit-diagnostics/parallel-independent-tasks.json || true\n"
          diagnostic_addition = diagnostic_anchor + "          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0758303ae6a5334a56c9c6239f2787ab.md --require-evidence --require-code --noWrite > audit-diagnostics/promise-all.json || true\n"
          if 'audit-diagnostics/promise-all.json' not in text:
              if diagnostic_anchor not in text:
                  raise SystemExit('batch 0013 diagnostic anchor not found')
              text = text.replace(diagnostic_anchor, diagnostic_addition, 1)

          text = text.replace(
              '// The shared coding auditor currently recognizes only Java/SQL\n',
              '// The shared coding auditor does not yet recognize Go fences.\n',
          )
          path.write_text(text)

      - name: Validate integrated gate
        run: |
          node --test test/answer_javascript_audit.test.js test/answer_candidate.test.js test/answer_code_validation.test.js
          node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0758303ae6a5334a56c9c6239f2787ab.md --require-evidence --require-code --noWrite
          (cd review/content_build/answer_batch_0013/cq_q_0758303ae6a5334a56c9c6239f2787ab && node promise_all_test.js)

      - name: Commit central gate and remove temporary workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-ci-integration-bot
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm -f .github/workflows/integrate-promise-all-ci.yml .github/workflows/content-batch-0013-promise-all.yml
          git add .github/workflows/ci.yml
          git commit -m "ci: gate batch 0013 Promise.all candidate"
          git pull --rebase origin content/quality-completion
          git push origin HEAD:content/quality-completion
