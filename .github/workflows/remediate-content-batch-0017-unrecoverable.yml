name: Remediate Content Batch 0017 Unrecoverable Questions

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0017-unrecoverable.yml
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: content-batch-0017-unrecoverable
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Retire source-unrecoverable singleton assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import pathlib
          import shutil

          root = pathlib.Path('.')
          targets = {
              'cq_q_240610761d28b1bf39c0dc3ff65a01f7': '原始 note_desc 明确说明算法题依赖一个未公开的特定场景，并因隐私原因没有保留题面；仓库没有输入、输出、约束、示例或业务规则，无法恢复确定性编码契约。',
              'cq_q_25996ab2beb9a70091998ac5eb0063aa': '原始来源只保留“补充 lc 螺旋矩阵”，没有标明是螺旋遍历、螺旋矩阵生成还是其他变体；仓库同时存在多个可恢复变体，不能猜测映射。',
              'cq_q_26cf490d9490e9cd7962dbe074fdc06d': '原始 note_desc 只说明“出了一道 sql 题”，未保留表、列、关联条件、聚合要求、期望结果或是否多表；无法唯一还原 SQL 契约。',
          }

          def read_json(path):
              return json.loads(path.read_text(encoding='utf-8'))
          def write_json(path, value):
              path.write_text(json.dumps(value, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          def read_jsonl(path):
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]
          def write_jsonl(path, rows):
              path.write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n' for row in rows), encoding='utf-8')

          canonical_path = root / 'data/questions/canonical_questions.jsonl'
          question_path = root / 'data/questions/questions.jsonl'
          progress_path = root / 'review/progress.json'
          audit_path = root / 'config/question_validity_audit.json'
          canonicals = read_jsonl(canonical_path)
          questions = read_jsonl(question_path)
          progress = read_json(progress_path)
          audit = read_json(audit_path)
          canonical_by_id = {row['canonical_id']: row for row in canonicals}
          question_by_id = {row['question_id']: row for row in questions}
          decisions = list(audit.get('decisions', []))
          by_ref = {(d.get('source_note_id'), d.get('source_question_index')): d for d in decisions}
          changed = False

          for cid, explanation in targets.items():
              qid = cid.removeprefix('cq_q_')
              canonical = canonical_by_id.get(cid)
              row = question_by_id.get(qid)
              if canonical is None:
                  if row and row.get('canonical_id') == cid and row.get('is_valid_for_library') is True:
                      raise SystemExit(f'{cid}: canonical missing but active Question still points to it')
                  if (root / 'review/answers' / f'{cid}.md').exists():
                      raise SystemExit(f'{cid}: canonical missing but active Answer remains')
                  if any(item.get('canonical_id') == cid for item in progress.get('items', [])):
                      raise SystemExit(f'{cid}: canonical missing but ReviewProgress remains')
                  continue
              if list(canonical.get('question_ids') or []) != [qid] or int(canonical.get('frequency', 0)) != 1:
                  raise SystemExit(f'{cid}: singleton ownership drifted')
              if not row or row.get('canonical_id') != cid or row.get('is_valid_for_library') is not True:
                  raise SystemExit(f'{cid}: active Question state drifted')

              ref = (row['source_note_id'], row['source_question_index'])
              replacement = {
                  'source_note_id': row['source_note_id'],
                  'source_question_index': row['source_question_index'],
                  'question_id': qid,
                  'original_question': row['original_question'],
                  'decision': 'exclude',
                  'exclusion_reason': 'incomplete_or_unreadable',
                  'exclusion_note': explanation,
              }
              prior = by_ref.get(ref)
              if prior is None:
                  decisions.append(replacement)
              elif prior != replacement:
                  decisions[decisions.index(prior)] = replacement
              by_ref[ref] = replacement

              canonicals = [c for c in canonicals if c.get('canonical_id') != cid]
              canonical_by_id.pop(cid, None)
              before = len(progress.get('items', []))
              progress['items'] = [i for i in progress.get('items', []) if i.get('canonical_id') != cid]
              if len(progress['items']) != before - 1:
                  raise SystemExit(f'{cid}: expected exactly one ReviewProgress row')

              active = root / 'review/answers' / f'{cid}.md'
              archive = root / 'review/archive/answers' / f'{cid}.md'
              if not active.exists():
                  raise SystemExit(f'{cid}: expected active Answer before retirement')
              archive.parent.mkdir(parents=True, exist_ok=True)
              if archive.exists():
                  if archive.read_bytes() != active.read_bytes():
                      raise SystemExit(f'{cid}: existing archive differs')
                  active.unlink()
              else:
                  shutil.move(str(active), str(archive))
              changed = True

          if changed:
              decisions.sort(key=lambda d: (str(d.get('source_note_id', '')), int(d.get('source_question_index', 0))))
              audit['decisions'] = decisions
              audit['audited_at'] = '2026-08-25'
              audit['include_count'] = sum(1 for d in decisions if d.get('decision') == 'include')
              audit['exclude_count'] = sum(1 for d in decisions if d.get('decision') == 'exclude')
              write_json(audit_path, audit)
              write_jsonl(canonical_path, sorted(canonicals, key=lambda c: c['canonical_id']))
              progress['updated_at'] = '2026-08-25'
              progress['items'] = sorted(progress.get('items', []), key=lambda i: i.get('canonical_id', ''))
              write_json(progress_path, progress)
          else:
              print('Batch 0017 unrecoverable remediation already materialized; idempotent no-op.')
          PY

      - name: Regenerate Question and index projections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest

      - name: Verify complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record bounded remediation progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0017.md')
          text = path.read_text(encoding='utf-8')
          line = '- [x] Source-unrecoverable singleton Questions `cq_q_240610761d28b1bf39c0dc3ff65a01f7`, `cq_q_25996ab2beb9a70091998ac5eb0063aa`, and `cq_q_26cf490d9490e9cd7962dbe074fdc06d` are excluded with explicit source reasons; singleton Canonicals, active Answers, and ReviewProgress rows are retired fail-closed.'
          if line not in text:
              text = text.rstrip() + '\n\n## Source-boundary remediation\n\n' + line + '\n'
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit only if source branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during validation: $base_head -> $remote_head"
            echo 'Discarding verified local mutation; retry against current state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo 'No batch 0017 remediation changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: retire unrecoverable batch 0017 questions'
          git push origin "HEAD:$CONTENT_BRANCH"
