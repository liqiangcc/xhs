name: Review Content Batch 0029 Kth Missing Positive Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0029-kth-missing-positive-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0029-kth-missing-positive-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_627564a8b30741a84b27a1367b3d22f6
  SOURCE_QID: 627564a8b30741a84b27a1367b3d22f6
  CANDIDATE_BLOB_SHA: adb11d6bb51be6d611bd6b4f2f7f22e292b4faaa

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun exact Java fixture
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          javac "$out/KthMissingPositive.java" "$out/KthMissingPositiveTest.java"
          test "$(java -cp "$out" KthMissingPositiveTest)" = 'PASS canonical=9 tail=6 before-first=1 empty=5 gaps=8 long-result=3000000000 null=rejected nonpositive-k=rejected'
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('source ownership drifted');
          const q=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.question_id===qid);
          if(!q||q.original_question!=='算法：第 K 个缺失的正整数') throw new Error('source wording drifted');
          if(!Array.isArray(q.tech_entities)||!q.tech_entities.includes('二分查找')) throw new Error('preserved binary-search entity drifted');
          const baseline=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!baseline.includes('quality_tier":"long_tail_baseline')||!baseline.includes('长尾复习底稿')) throw new Error('expected long-tail baseline no longer matches reviewed starting state');
          NODE

      - name: Record isolated source-first review and evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0029/${cid}`;
          const fixture=`${out}/code_validation.json`;
          const reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0029-kth-missing-positive-20260825-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved source only names the kth-missing-positive problem and records binary search as a technical entity; it does not preserve the complete array and k constraints. The candidate explicitly marks strictly increasing positive input and k>=1 as its executable contract instead of attributing those details to the source.',
            'Within that contract, missing(i)=arr[i]-(i+1) is monotone, so the first index whose cumulative missing count reaches k is a valid lower-bound target. The candidate derives the final value lo+k rather than presenting it as a memorized formula.',
            'The displayed Java block is a complete compilable class and matches the separately executed fixture implementation.',
            'The deterministic fixture passes the standard internal case, an answer after the array tail, an answer before the first element, empty input, multiple gaps, a long result beyond int range, null rejection and non-positive-k rejection.',
            'The candidate states the O(log n) core query cost while explicitly explaining that defensive O(n) validation of the sorted-positive precondition would change end-to-end complexity.',
            'Follow-ups cover the missing-count formula, monotonicity, lo+k derivation, tail behavior, invalid ordering and the O(n) alternative; no project experience, exact platform identity, or unpreserved constraints are fabricated.',
            'No uncovered source variant, unsupported source attribution, coding hard failure, or semantic blocker remains. Formal promotion remains subject to repository promotion and real-review policy.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0029.kth-missing-positive.v1',decision:'pass',revision_round:1,source_packet:['review/content_build/answer_batch_0029/source_boundary_audit.json',`${out}/writer_research.json`,candidate,fixture,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(reviewPath,JSON.stringify(review,null,2)+'\n');
          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,
            writer:{writer_id:'content-batch-0029-kth-missing-positive-candidate-builder',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'source-boundary',title:'Answer Batch 0029 frozen source-boundary audit',locator:'review/content_build/answer_batch_0029/source_boundary_audit.json',source_type:'repository_source_record',checked_at:date},
              {source_id:'fixture',title:'Kth-missing-positive deterministic Java fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Kth-missing-positive independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The preserved source names the kth-missing-positive problem and binary search but does not preserve the complete input/output constraints; the candidate contract is explicitly labeled as an assumption.',source_ids:['source-boundary'],answer_locations:['核心结论','1 分钟版','关键细节']},
              {claim_id:'lower-bound-mechanism',text:'Under the explicit strictly-increasing-positive-array contract, missing(i)=arr[i]-(i+1) is monotone and lower-bounding the first missing(i)>=k yields answer lo+k.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','3 分钟版','原理机制']},
              {claim_id:'boundary-validation',text:'The executable fixture verifies middle, tail, before-first, empty and multi-gap cases, a widened long result, and explicit null/non-positive-k boundaries.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:'javac KthMissingPositive.java KthMissingPositiveTest.java && java KthMissingPositiveTest',result:'pass',reported_stdout:'PASS canonical=9 tail=6 before-first=1 empty=5 gaps=8 long-result=3000000000 null=rejected nonpositive-k=rejected',checks:['standard internal answer','answer after array tail','answer before first element','empty array candidate contract','multiple internal gaps','return value beyond int range under widened k contract','explicit null rejection','explicit non-positive k rejection'],boundary_tests:[{case:'standard [2,3,4,7,11], k=5',expected:9,actual:9,passed:true},{case:'tail [1,2,3,4], k=2',expected:6,actual:6,passed:true},{case:'before first [2], k=1',expected:1,actual:1,passed:true},{case:'empty array, k=5',expected:5,actual:5,passed:true},{case:'long result [1], k=2999999999',expected:3000000000,actual:3000000000,passed:true}]},
            review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0029.kth-missing-positive.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Kth-missing-positive candidate passed isolated source-first review and deterministic Java evidence; formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during kth-missing-positive review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0029 kth-missing-positive candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
