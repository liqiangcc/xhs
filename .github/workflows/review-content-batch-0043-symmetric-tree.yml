name: Review Content Batch 0043 Symmetric Tree

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-symmetric-tree.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-symmetric-tree-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b2f3138ad7966d5ee56a02ddfbcc3892
  SOURCE_QID: b2f3138ad7966d5ee56a02ddfbcc3892

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：判断二叉树是否镜像对称';
          const raw=JSON.parse(fs.readFileSync('note_structured/680e66cb0000000023012aa3.json','utf8'));
          if(raw.questions?.[0]!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact)throw new Error('inventory drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid]))throw new Error('inventory ownership drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','isSymmetric','mirror(a.left, b.right)','O(n)'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('public static boolean isSymmetric'))throw new Error('candidate code missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_iterative_pair_oracle',candidate_sha256:sha,source_boundary:'Symmetric binary tree is frozen; Java API, node representation, empty-tree convention and recursion/iteration choice are not source-frozen'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent iterative pair oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              record Pair(Solution.TreeNode a, Solution.TreeNode b) {}
              static boolean oracle(Solution.TreeNode root){
                  if(root==null)return true;
                  ArrayDeque<Pair> q=new ArrayDeque<>();q.add(new Pair(root.left,root.right));
                  while(!q.isEmpty()){
                      Pair p=q.removeFirst();Solution.TreeNode a=p.a(),b=p.b();
                      if(a==null||b==null){if(a!=b)return false;continue;}
                      if(a.val!=b.val)return false;
                      q.addLast(new Pair(a.left,b.right));q.addLast(new Pair(a.right,b.left));
                  }
                  return true;
              }
              static Solution.TreeNode n(int v){return new Solution.TreeNode(v);}
              static Solution.TreeNode randomTree(Random r,int depth){if(depth==0||r.nextInt(4)==0)return null;Solution.TreeNode x=n(r.nextInt(9)-4);x.left=randomTree(r,depth-1);x.right=randomTree(r,depth-1);return x;}
              static Solution.TreeNode cloneTree(Solution.TreeNode x){if(x==null)return null;Solution.TreeNode y=n(x.val);y.left=cloneTree(x.left);y.right=cloneTree(x.right);return y;}
              static Solution.TreeNode mirrorClone(Solution.TreeNode x){if(x==null)return null;Solution.TreeNode y=n(x.val);y.left=mirrorClone(x.right);y.right=mirrorClone(x.left);return y;}
              static Solution.TreeNode symmetric(Random r){Solution.TreeNode half=randomTree(r,7),root=n(r.nextInt());root.left=cloneTree(half);root.right=mirrorClone(half);return root;}
              static void check(Solution.TreeNode root,String label){boolean got=Solution.isSymmetric(root),want=oracle(root);if(got!=want)throw new AssertionError(label+" got="+got+" want="+want);}
              public static void main(String[] args){
                  check(null,"empty");Solution.TreeNode one=n(1);check(one,"single");
                  Solution.TreeNode a=n(1);a.left=n(2);a.right=n(2);a.left.left=n(3);a.right.right=n(3);check(a,"outer symmetric");
                  a.right.left=n(4);check(a,"structural mismatch");a.left.right=n(4);check(a,"restored symmetric");a.right.left.val=5;check(a,"value mismatch");
                  Random r=new Random(0x53594d525657L);long arbitrary=0,symmetric=0;
                  for(int i=0;i<50000;i++){check(randomTree(r,8),"random-"+i);arbitrary++;}
                  for(int i=0;i<20000;i++){Solution.TreeNode root=symmetric(r);if(!Solution.isSymmetric(root)||!oracle(root))throw new AssertionError("constructed symmetric "+i);symmetric++;}
                  System.out.println("PASS fixed=6 arbitrary="+arbitrary+" constructed-symmetric="+symmetric+" iterative-pair-oracle=match structure-value-boundaries=covered");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)";echo "$stdout";grep -E '^PASS fixed=6 arbitrary=50000 constructed-symmetric=20000 iterative-pair-oracle=match structure-value-boundaries=covered$' <<<"$stdout";echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_iterative_pair_oracle'||pre.candidate_sha256!==sha)throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const tests=[{case:'empty/single and targeted structure/value cases',expected:'candidate equals iterative pair oracle',passed:true},{case:'50,000 seeded arbitrary trees',expected:'candidate equals structurally separate iterative pair oracle',passed:true},{case:'20,000 generated mirrored trees',expected:'both candidate and oracle return true',passed:true}];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; independent iterative node-pair oracle on targeted, arbitrary and constructed-mirror trees',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The preserved source asks only whether a binary tree is mirror-symmetric; language, node API, empty-tree convention and recursive/iterative form are not source-frozen.','The candidate explicitly labels its Java TreeNode and empty-tree behavior as a reference contract rather than attributing them to the source.','The recursive invariant is correct: mirror(a,b) requires paired roots to match, then compares outer children a.left/b.right and inner children a.right/b.left.','A structurally separate iterative queue of node pairs matches the exact candidate on fixed boundary cases, 50,000 seeded arbitrary trees and 20,000 generated mirrored trees.','The answer covers structure-vs-value mismatch, empty/single-node boundaries, O(n) time, O(h) recursion-stack cost and iterative tradeoffs without fabricated project experience.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-symmetric-tree-20260827-v1',review_version:'batch-0043.symmetric-tree.v1',decision:'pass',revision_round:1,source_packet:['note_structured/680e66cb0000000023012aa3.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-symmetric-tree-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving symmetric-tree prompt',locator:'note_structured/680e66cb0000000023012aa3.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Generated-mirror writer validation',locator:`${out}/symmetric_tree_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent iterative node-pair oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Symmetric-tree source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves a mirror-symmetric binary-tree coding task while language, node API, empty-tree convention and implementation form are not frozen constraints.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','关键细节','项目经验版']},{claim_id:'reference-behavior',text:'Under the declared Java tree contract, cross-pair recursion matches an independent iterative node-pair oracle across targeted, arbitrary and constructed-mirror trees.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent iterative node-pair oracle',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b2f3138ad7966d5ee56a02ddfbcc3892` completed writer and isolated source-first review. The source freezes only the symmetric-binary-tree task; Java API, empty-tree semantics and recursive/iterative choice remain explicit reference-contract decisions. Writer validation passed fixed cases and 30,000 generated mirror trees; the independent reviewer matched a structurally separate iterative node-pair oracle on targeted boundaries, 50,000 seeded arbitrary trees and 20,000 generated mirrored trees. Strict candidate audit, code gate, and repository gates are green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 symmetric-tree candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
            sleep 5
          done
          exit 1
