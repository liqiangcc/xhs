name: Apply Boundary Review Batch 001 Decisions

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .boundary-review-batch-001-decision-trigger

permissions:
  contents: write

jobs:
  decide:
    if: "${{ github.event.head_commit.message == 'chore: apply boundary review batch 001 decisions' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Record source-first decisions and merge plan
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const decisionsPath = 'data/manifests/canonical/boundary_review_decisions.json';
          const batchPath = 'review/content_build/canonical_boundary_review/batch_001/candidates.json';
          const outDir = 'review/content_build/canonical_boundary_review/batch_001';
          const manifest = JSON.parse(fs.readFileSync(decisionsPath, 'utf8'));
          const batch = JSON.parse(fs.readFileSync(batchPath, 'utf8'));
          const byCandidate = new Map(batch.candidates.map((row) => [row.candidate_id, row]));
          const decisions = [
            {
              candidate_id: 'boundary_cq_q_0165356d4f703eea4990e5bdda333d92_cq_q_ff67c5194b913ce1ab318f3020d31170',
              decision: 'merge',
              note: 'Both sources ask the synchronized lock-escalation path. JOL verification is a validation/follow-up of the same mechanism, not an independent core answer boundary.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_04d79b4f1d5942b0cb976a988536a3b2_cq_q_d3fea003c007b50735b8e695473de9ac',
              decision: 'merge',
              note: 'Both sources ask the same CMS-versus-G1 collector comparison with the same domain and core entities.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_1c4c8e00ef1bbd647ba9a00ab1dd4b45_cq_q_48206d6b985dc40c4ac6c4a417dc03c6',
              decision: 'merge',
              note: 'Both sources ask which Redis memory eviction policies exist; wording and expected answer boundary are equivalent.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_0866c4b58bd2fb97cb4b5379e767d035_cq_q_d3fea003c007b50735b8e695473de9ac',
              decision: 'merge',
              note: 'The extra selection wording is part of the CMS-versus-G1 comparison completion criteria: a correct comparison answer must include selection conditions and tradeoffs.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_60fb9ee432ae20f1a97138c93598c22f_cq_q_dcb9a48657af9b70e0f87735009a1cde',
              decision: 'merge',
              note: 'Both sources ask the equals/hashCode contract and why both must be overridden; implementation cautions are supporting detail within the same core question.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_00923a9a2d2c26ed41b659ec85c81e3f_cq_q_c9bf9012cc74f9e99ee13f7e84f745a2',
              decision: 'keep_separate',
              note: 'JAVA中的锁 is a broad taxonomy/overview spanning optimistic, pessimistic, spin, AQS and synchronized concepts; the other prompt is a focused synchronized-versus-ReentrantLock comparison.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_069edb2ce1a7e7a6ce526861cda5f9c8_cq_q_1fc572ff2870be00a79a0292f2d9552d',
              decision: 'keep_separate',
              note: 'Thread-safe session-manager design is an application scenario with multiple possible structures; ConcurrentHashMap thread safety is a focused implementation mechanism question.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_0ea2107893f23ca0d6ccfde82fe0d190_cq_q_46b80bbf2441759405c81fa0ceb5bec6',
              decision: 'merge',
              note: 'Both sources ask the final/finally/finalize comparison; adding uses does not create a distinct semantic boundary.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_13d712dbbbe982e220bc87d74737abcd_cq_q_1bb63b161281368c9e9095fa9bed3b90',
              decision: 'merge',
              note: 'Both sources ask the same String/StringBuffer/StringBuilder comparison with identical entities and expected comparison dimensions.',
              reviewed_at: '2026-08-17',
            },
            {
              candidate_id: 'boundary_cq_q_13d712dbbbe982e220bc87d74737abcd_cq_q_ae1651ba6576c28fcd53d4f4888dbd3e',
              decision: 'merge',
              note: 'Both sources ask the same String/StringBuffer/StringBuilder comparison; ordering and punctuation do not change the answer boundary.',
              reviewed_at: '2026-08-17',
            },
          ];
          const existing = new Map(manifest.items.map((item) => [item.candidate_id, item]));
          for (const decision of decisions) {
            if (!byCandidate.has(decision.candidate_id)) throw new Error(`batch candidate missing: ${decision.candidate_id}`);
            if (existing.has(decision.candidate_id)) throw new Error(`decision already exists: ${decision.candidate_id}`);
            manifest.items.push(decision);
          }
          fs.writeFileSync(decisionsPath, `${JSON.stringify(manifest, null, 2)}\n`);
          const mergePlan = [
            { target: 'cq_q_ff67c5194b913ce1ab318f3020d31170', source: 'cq_q_0165356d4f703eea4990e5bdda333d92', candidate_id: decisions[0].candidate_id },
            { target: 'cq_q_d3fea003c007b50735b8e695473de9ac', source: 'cq_q_04d79b4f1d5942b0cb976a988536a3b2', candidate_id: decisions[1].candidate_id },
            { target: 'cq_q_1c4c8e00ef1bbd647ba9a00ab1dd4b45', source: 'cq_q_48206d6b985dc40c4ac6c4a417dc03c6', candidate_id: decisions[2].candidate_id },
            { target: 'cq_q_d3fea003c007b50735b8e695473de9ac', source: 'cq_q_0866c4b58bd2fb97cb4b5379e767d035', candidate_id: decisions[3].candidate_id },
            { target: 'cq_q_60fb9ee432ae20f1a97138c93598c22f', source: 'cq_q_dcb9a48657af9b70e0f87735009a1cde', candidate_id: decisions[4].candidate_id },
            { target: 'cq_q_46b80bbf2441759405c81fa0ceb5bec6', source: 'cq_q_0ea2107893f23ca0d6ccfde82fe0d190', candidate_id: decisions[7].candidate_id },
            { target: 'cq_q_ae1651ba6576c28fcd53d4f4888dbd3e', source: 'cq_q_13d712dbbbe982e220bc87d74737abcd', candidate_id: decisions[9].candidate_id },
            { target: 'cq_q_ae1651ba6576c28fcd53d4f4888dbd3e', source: 'cq_q_1bb63b161281368c9e9095fa9bed3b90', candidate_id: decisions[8].candidate_id },
          ];
          fs.writeFileSync(path.join(outDir, 'review_result.json'), `${JSON.stringify({
            schema_version: 'canonical_boundary_review_result.v1',
            batch_id: 'batch_001',
            source_first: true,
            historical_reviewer_decisions_read_before_conclusion: false,
            decisions,
            merge_plan: mergePlan,
          }, null, 2)}\n`);
          fs.writeFileSync('/tmp/batch-001-merge-plan.json', JSON.stringify(mergePlan));
          NODE

      - name: Inventory all assets referenced by planned merges
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const cp = require('child_process');
          const plan = JSON.parse(fs.readFileSync('/tmp/batch-001-merge-plan.json', 'utf8'));
          function exists(p) { return fs.existsSync(p); }
          function refs(id) {
            try {
              const out = cp.execFileSync('git', ['grep', '-l', '-F', id, '--', 'review', 'data/manifests'], { encoding: 'utf8' });
              return out.split(/\r?\n/).filter(Boolean).sort();
            } catch (error) {
              if (error.status === 1) return [];
              throw error;
            }
          }
          const rows = plan.map((item) => ({
            ...item,
            source_assets: {
              formal_answer: exists(`review/answers/${item.source}.md`),
              candidate_answer: exists(`review/candidates/answers/${item.source}.md`),
              evidence: exists(`review/evidence/${item.source}.json`),
              references: refs(item.source),
            },
            target_assets: {
              formal_answer: exists(`review/answers/${item.target}.md`),
              candidate_answer: exists(`review/candidates/answers/${item.target}.md`),
              evidence: exists(`review/evidence/${item.target}.json`),
              references: refs(item.target),
            },
          }));
          fs.writeFileSync('review/content_build/canonical_boundary_review/batch_001/merge_asset_inventory.json', `${JSON.stringify({
            schema_version: 'canonical_merge_asset_inventory.v1',
            batch_id: 'batch_001',
            rows,
          }, null, 2)}\n`);
          NODE

      - name: Regenerate candidate queue with recorded decisions
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_canonical_boundaries.js
          node scripts/content/audit_canonical_boundaries.js --check
          node - <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('data/manifests/canonical/long_tail_duplicate_candidates.jsonl', 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const pending = rows.filter((row) => row.reviewer_decision === 'pending');
          if (pending.length !== 87) throw new Error(`expected 87 pending after batch 001, got ${pending.length}`);
          NODE

      - name: Verify repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run ci:check

      - name: Commit review decisions and inventory
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "content: review canonical boundary batch 001"

      - name: Remove temporary decision workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .boundary-review-batch-001-decision-trigger .github/workflows/apply-boundary-review-batch-001.yml
          git add -A
          git commit -m "chore: remove boundary review batch 001 decision workflow"

      - name: Push reviewed boundary state
        shell: bash
        run: git push origin HEAD:content/quality-completion
