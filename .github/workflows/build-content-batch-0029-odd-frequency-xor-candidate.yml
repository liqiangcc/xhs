name: Build Content Batch 0029 Odd Frequency XOR Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0029-odd-frequency-xor-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0029-odd-frequency-xor-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_5feff10b4655bf428fa0b06241a887e1
  SOURCE_QID: 5feff10b4655bf428fa0b06241a887e1

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Guard frozen source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0029/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('Canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：位运算应用：在一组多数出现偶数次、少数出现奇数次的数字中寻找特定数字';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          const packet=fs.readFileSync('review/content_build/answer_batch_0029/source_boundary_audit.md','utf8');
          if(!packet.includes(expected)||!packet.includes(cid)) throw new Error('frozen batch source packet missing current Canonical');
          NODE

      - id: state
        name: Guard writer idempotence
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          if [ -e "$candidate" ]; then
            test -e "$out/code_validation.json"
            test -e "$out/writer_research.json"
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write source-bounded candidate and executable fixture
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_5feff10b4655bf428fa0b06241a887e1","version":1,"status":"draft","updated_at":"2026-08-25","answer_type":"coding","quality_tier":"candidate"} -->
          # 用 XOR 找出出现奇数次的数字

          ## 核心结论

          题源只说明“多数数字出现偶数次、少数数字出现奇数次”，没有保存“奇数次数字到底有几个”的约束，因此不能把某一个经典题型冒充成唯一原题。位运算的核心事实是：相同整数异或偶数次会抵消为 0，0 与 x 异或仍是 x。于是：若恰好一个值出现奇数次，全部异或即可得到它；若恰好两个值出现奇数次，可先得到 `a ^ b`，再用其中一个为 1 的位把数组分组，分别异或恢复 a、b；若奇数次值的数量不固定且可能大于 2，仅靠一个总 XOR 不足以恢复全部值，需要额外约束或频次表。

          ## 1 分钟版

          - `x ^ x = 0`，偶数次出现的值两两抵消；异或满足交换律和结合律，所以输入顺序不影响结果。
          - **恰好一个奇数次值**：扫描一次，`xor ^= x`，最终 `xor` 就是答案，时间 O(n)、额外空间 O(1)。
          - **恰好两个奇数次值**：总 XOR 为 `a ^ b` 且非 0；取 `lowbit = xor & -xor`，a、b 在这一位必然不同。按该位是否为 0 分组，每组内部偶数次元素仍成对抵消，最终得到 a 和 b。
          - **任意多个奇数次值**：题源若没有数量上界，不能声称上述 O(1) 状态能找全。通用办法是用哈希表统计频次，再筛选奇数频次。
          - Java `int` 的 XOR 对正负数都按位工作；`xor & -xor` 在二进制补码下也能提取最低位的 1，包括最高位为唯一 1 的情况。

          ## 3 分钟版

          ```java
          final class OddFrequencyNumbers {
              static int findOneOdd(int[] nums) {
                  if (nums == null) throw new IllegalArgumentException("nums must not be null");
                  int xor = 0;
                  for (int x : nums) xor ^= x;
                  return xor;
              }

              static int[] findTwoOdd(int[] nums) {
                  if (nums == null) throw new IllegalArgumentException("nums must not be null");
                  int xor = 0;
                  for (int x : nums) xor ^= x;
                  if (xor == 0) {
                      throw new IllegalArgumentException("contract requires exactly two distinct odd-frequency values");
                  }
                  int lowbit = xor & -xor;
                  int a = 0;
                  int b = 0;
                  for (int x : nums) {
                      if ((x & lowbit) == 0) a ^= x;
                      else b ^= x;
                  }
                  return new int[]{a, b};
              }
          }
          ```

          对“一个奇数次值”，循环不变量是：处理前 k 个元素后，`xor` 等于这 k 个元素按频次奇偶性保留下来的异或结果；扫描结束时所有偶数频次值都抵消，只剩唯一奇数频次值。

          对“两个奇数次值”，先得到 `a ^ b`。因为 a != b，`a ^ b != 0`，必有某一位为 1；选最低这样的位后，a、b 会进入不同组。任何偶数频次值的所有副本拥有相同位值，会完整落在同一组，仍然能成对抵消，因此两个组的最终异或分别是 a、b。

          ## 关键细节

          - **先问数量约束**：一个、两个、还是任意多个奇数次值，决定了是否能用 O(1) 额外空间完成。
          - **为什么不能随便挑分组位**：必须从 `a ^ b` 的置 1 位中选，因为只有这些位能保证两个目标值被分开。
          - **`xor == 0` 的含义**：在“恰好两个不同奇数次值”的契约下不可能出现；若出现，说明输入不满足契约，而不是应该继续计算一个任意答案。
          - **顺序无关**：异或的交换律和结合律允许把相同值在数学上重新配对抵消，不要求它们在数组中相邻。
          - **负数不需要特殊分支**：这里处理的是 `int` 位模式，不是十进制字符串；负数同样满足 `x ^ x = 0`。
          - **任意多个奇数次值**：总 XOR 只保留这些值的整体异或，信息量不足以唯一反推每个成员；不要把“两数分组技巧”无条件递归成一个没有证明的通用算法。

          ## 原理机制

          XOR 可以看成对每一个二进制位分别做模 2 加法。一个值重复偶数次时，它在每个位上的 1 都出现偶数次，因此对总 XOR 的贡献为 0；重复奇数次时，最终贡献等价于出现一次。

          当只有两个奇数频次值 a、b 时，总 XOR 把问题压缩成 `a ^ b`。任取其中一个置 1 位，相当于找到一个能区分 a、b 的二进制特征；按该特征分桶后，每个偶数频次值的副本不会被拆散，所以桶内仍能利用 XOR 抵消。这一步的本质是“用已知差异位构造一个保持偶数配对、不拆散重复值的分区”。

          ## 项目经验版

          题源没有真实项目场景、输入规模或生产数据，不能虚构。工程实现前要先确认数据契约：奇数频次值数量是否固定、输入是否允许空数组、是否需要返回稳定顺序、是否可能违反前提。如果数据来自不可信外部输入，建议增加契约校验或在测试中覆盖违约样例，而不是依赖面试题的隐含前提。

          ## 常见追问

          - 问：为什么一个奇数次值可以直接全异或？答：所有偶数频次值的贡献都抵消为 0，唯一剩余的奇数频次值贡献等价于一次。
          - 问：两个奇数次值为什么不能直接从 `a ^ b` 还原？答：`a ^ b` 只给出两者哪些位不同，不唯一确定 a、b；需要再利用一个差异位把原数组分成两组，借助原始频次信息分别恢复。
          - 问：为什么 `lowbit = xor & -xor`？答：二进制补码的 `-xor` 会让最低置 1 位与原值共同保留，其更低位为 0，因此按位与得到只含最低置 1 位的掩码。
          - 问：如果有三个或更多奇数次值呢？答：仅有总 XOR 时信息不足。若题目没有额外结构，使用哈希表统计每个值的频次是直接可靠的通用方案。
          - 问：能处理负数吗？答：可以，XOR 基于 `int` 位模式；只要同一个负数的位模式相同，偶数次仍然抵消。

          ## 易错点

          - 没确认奇数频次值的数量，就直接套“一个数”或“两个数”的经典解法。
          - 两数场景随便选择一个分组位，不能保证两个目标值被分开。
          - `xor == 0` 时继续计算 `lowbit` 并返回伪结果，而不是识别输入违约。
          - 为了处理任意多个奇数次值，机械递归两数分组技巧，却没有信息充分性证明。
          - 把 XOR 位运算和十进制数值正负语义混为一谈，给负数增加不必要的特殊规则。
          EOF

          cat > "$out/OddFrequencyNumbers.java" <<'JAVA'
          final class OddFrequencyNumbers {
              static int findOneOdd(int[] nums) {
                  if (nums == null) throw new IllegalArgumentException("nums must not be null");
                  int xor = 0;
                  for (int x : nums) xor ^= x;
                  return xor;
              }

              static int[] findTwoOdd(int[] nums) {
                  if (nums == null) throw new IllegalArgumentException("nums must not be null");
                  int xor = 0;
                  for (int x : nums) xor ^= x;
                  if (xor == 0) throw new IllegalArgumentException("contract requires exactly two distinct odd-frequency values");
                  int lowbit = xor & -xor;
                  int a = 0;
                  int b = 0;
                  for (int x : nums) {
                      if ((x & lowbit) == 0) a ^= x;
                      else b ^= x;
                  }
                  return new int[]{a, b};
              }
          }
          JAVA

          cat > "$out/OddFrequencyNumbersTest.java" <<'JAVA'
          import java.util.Arrays;

          final class OddFrequencyNumbersTest {
              private static void expectOne(int expected, int[] nums) {
                  int actual = OddFrequencyNumbers.findOneOdd(nums);
                  if (actual != expected) throw new AssertionError("expected=" + expected + " actual=" + actual);
              }

              private static void expectTwo(int x, int y, int[] nums) {
                  int[] actual = OddFrequencyNumbers.findTwoOdd(nums);
                  Arrays.sort(actual);
                  int[] expected = new int[]{x, y};
                  Arrays.sort(expected);
                  if (!Arrays.equals(actual, expected)) throw new AssertionError("expected=" + Arrays.toString(expected) + " actual=" + Arrays.toString(actual));
              }

              public static void main(String[] args) {
                  expectOne(7, new int[]{2, 2, 7, 3, 3});
                  expectOne(-5, new int[]{-5, 4, 4, 9, 9, -8, -8});
                  expectOne(Integer.MIN_VALUE, new int[]{1, 1, Integer.MIN_VALUE});
                  expectTwo(5, 9, new int[]{1, 1, 2, 2, 5, 7, 7, 9});
                  expectTwo(-7, 12, new int[]{-7, 3, 3, 12, 8, 8});
                  expectTwo(Integer.MIN_VALUE, 0, new int[]{Integer.MIN_VALUE, 4, 4, 0, 6, 6});
                  boolean nullRejected=false;
                  try { OddFrequencyNumbers.findOneOdd(null); } catch (IllegalArgumentException expected) { nullRejected=true; }
                  if (!nullRejected) throw new AssertionError("null must be rejected explicitly");
                  boolean badTwoRejected=false;
                  try { OddFrequencyNumbers.findTwoOdd(new int[]{1,1,2,2}); } catch (IllegalArgumentException expected) { badTwoRejected=true; }
                  if (!badTwoRejected) throw new AssertionError("two-odd contract violation must be rejected");
                  System.out.println("PASS one-odd=3 two-odd=3 negatives=supported min-value=supported null=rejected bad-two=rejected");
              }
          }
          JAVA

      - name: Execute fixture and freeze writer research
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          javac "$out/OddFrequencyNumbers.java" "$out/OddFrequencyNumbersTest.java"
          stdout="$(java -cp "$out" OddFrequencyNumbersTest)"
          test "$stdout" = 'PASS one-odd=3 two-odd=3 negatives=supported min-value=supported null=rejected bad-two=rejected'
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const out=`review/content_build/answer_batch_0029/${cid}`;
          fs.writeFileSync(path.join(out,'code_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'javac OddFrequencyNumbers.java OddFrequencyNumbersTest.java && java OddFrequencyNumbersTest',stdout:process.env.STDOUT,checks:['one odd-frequency value with positive inputs','one odd-frequency negative value','Integer.MIN_VALUE bit pattern','two odd-frequency values','two odd-frequency values including negatives','two odd-frequency values including Integer.MIN_VALUE and zero','explicit null rejection','two-target contract violation rejection']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Answer Batch 0029 frozen source-boundary audit',locator:'review/content_build/answer_batch_0029/source_boundary_audit.md',source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Odd-frequency XOR deterministic Java fixture',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source says most values occur an even number of times and a minority occur an odd number of times, but does not preserve the exact number of odd-frequency targets.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','关键细节']},{claim_id:'xor-one-two',text:'The deterministic fixture validates the candidate implementations for exactly one and exactly two odd-frequency targets, including negative int values and Integer.MIN_VALUE bit patterns.',source_ids:['fixture'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']},{claim_id:'fail-closed',text:'The candidate explicitly rejects null input and detects xor==0 as a contract violation for the exactly-two-target implementation instead of returning a fabricated result.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Odd-frequency XOR candidate staged source-first while preserving the unresolved target-count boundary; deterministic Java validation covers exactly-one/exactly-two contracts, negatives, Integer.MIN_VALUE, and fail-closed input handling; isolated source-first review remains pending.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Run repository gates for writer stage
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:coverage

      - name: Commit candidate only from stable content head
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during odd-frequency writer: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0029/$CANONICAL_ID/context.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/OddFrequencyNumbers.java" "review/content_build/answer_batch_0029/$CANONICAL_ID/OddFrequencyNumbersTest.java" "review/content_build/answer_batch_0029/$CANONICAL_ID/code_validation.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage batch 0029 odd-frequency XOR candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
