name: Regenerate Answer Type Boundaries

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .answer-type-boundary-trigger

permissions:
  contents: write

jobs:
  regenerate:
    if: "${{ github.event.head_commit.message == 'chore: regenerate answer type boundaries' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Freeze pre-fix manifests
        shell: bash
        run: |
          set -euo pipefail
          cp data/manifests/quality/answer_type_audit.jsonl "$RUNNER_TEMP/answer_type_before.jsonl"
          cp data/manifests/quality/answer_pilot_set.json "$RUNNER_TEMP/pilot_before.json"

      - name: Verify targeted type regressions
        shell: bash
        run: |
          set -euo pipefail
          node --test test/answer_type_audit.test.js

      - name: Regenerate type-dependent quality state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_answer_types.js
          node scripts/content/build_answer_rewrite_queue.js
          node scripts/content/select_answer_pilot.js
          node scripts/content/build_pilot_answer_audit.js
          node scripts/content/build_pilot_human_review_plan.js

      - name: Record before-after classification evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/type_audit_boundary_fix
          node - "$RUNNER_TEMP/answer_type_before.jsonl" data/manifests/quality/answer_type_audit.jsonl "$RUNNER_TEMP/pilot_before.json" data/manifests/quality/answer_pilot_set.json <<'NODE'
          const fs = require('fs');
          const [beforePath, afterPath, pilotBeforePath, pilotAfterPath] = process.argv.slice(2);
          const parseJsonl = (p) => fs.readFileSync(p, 'utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const before = parseJsonl(beforePath);
          const after = parseJsonl(afterPath);
          const beforeMap = new Map(before.map((row) => [row.canonical_id, row]));
          const changed = after
            .filter((row) => beforeMap.get(row.canonical_id)?.answer_type !== row.answer_type)
            .map((row) => ({
              canonical_id: row.canonical_id,
              canonical_title: row.canonical_title,
              before: beforeMap.get(row.canonical_id)?.answer_type || null,
              after: row.answer_type,
              rationale: row.rationale,
              risk_flags: row.risk_flags,
            }));
          const count = (rows) => rows.reduce((acc, row) => {
            acc[row.answer_type] = (acc[row.answer_type] || 0) + 1;
            return acc;
          }, {});
          const pilotBefore = JSON.parse(fs.readFileSync(pilotBeforePath, 'utf8'));
          const pilotAfter = JSON.parse(fs.readFileSync(pilotAfterPath, 'utf8'));
          const ids = (manifest) => new Set((manifest.items || manifest.rows || []).map((row) => row.canonical_id));
          const beforeIds = ids(pilotBefore);
          const afterIds = ids(pilotAfter);
          const report = {
            schema_version: 'answer_type_boundary_fix.v1',
            changed_count: changed.length,
            before_type_counts: count(before),
            after_type_counts: count(after),
            changed,
            pilot_removed: [...beforeIds].filter((id) => !afterIds.has(id)).sort(),
            pilot_added: [...afterIds].filter((id) => !beforeIds.has(id)).sort(),
            targeted_expectations: {
              cq_cms_collector_c069b541: 'mechanism',
              cq_io_multiplexing_6e30840f: 'mechanism',
              cq_mq_selection_9293dfad: 'scenario',
              cq_redis_lock_ec98b854: 'scenario',
              cq_concurrent_transfer_a35181e0: 'coding',
              cq_tcp_handshake_39cc7c09: 'mechanism',
              cq_synchronized_lock_2886cc94: 'concept',
              cq_synchronized_volatile_2801d05c: 'concept',
              cq_tcp_wait_states_c808f88e: 'concept',
            },
          };
          const afterMap = new Map(after.map((row) => [row.canonical_id, row.answer_type]));
          for (const [id, expected] of Object.entries(report.targeted_expectations)) {
            if (afterMap.get(id) !== expected) {
              throw new Error(`${id}: expected ${expected}, got ${afterMap.get(id)}`);
            }
          }
          fs.writeFileSync(
            'review/content_build/type_audit_boundary_fix/report.json',
            `${JSON.stringify(report, null, 2)}\n`,
          );
          NODE

      - name: Verify generated quality state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_answer_types.js --check
          node scripts/content/build_answer_rewrite_queue.js --check
          node scripts/content/select_answer_pilot.js --check
          node scripts/content/build_pilot_answer_audit.js --check
          node scripts/content/build_pilot_human_review_plan.js --check
          node scripts/xhs.js answer queue check --set data/manifests/quality/answer_pilot_set.json --noWrite
          npm test
          npm run ci:check

      - name: Commit corrected type-dependent state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "content: correct pilot answer type boundaries"

      - name: Remove temporary regeneration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .answer-type-boundary-trigger .github/workflows/regenerate-answer-type-boundaries.yml
          git add -A
          git commit -m "chore: remove answer type boundary regeneration workflow"

      - name: Push corrected content state
        shell: bash
        run: git push origin HEAD:content/quality-completion
