name: Review Content Batch 0043 Rope 15m

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-rope-15m.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-rope-15m-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b3787f11fe37c461cd68a3a00b303279
  SOURCE_QID: b3787f11fe37c461cd68a3a00b303279

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='智力题：有无数条密度均匀度随机、但烧完耗时均为 1 小时的绳子，如何通过烧绳子计时 15 分钟？';
          const note=JSON.parse(fs.readFileSync('note_tagged/67e14815000000001b025250.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);if(!row||row.original_question!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);if(!item||item.state!=='active'||item.source_questions?.[0]?.original_question!==exact)throw new Error('inventory drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','t=30','t=45','长度'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];if(blocks.length!==1||!blocks[0][1].includes('public final class Solution'))throw new Error('single executable Java proof missing');
          fs.writeFileSync('/tmp/Solution.java',blocks[0][1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_independent_proof',candidate_sha256:sha,source_boundary:'60-minute total burn time and a 15-minute interval are source-frozen; length-proportional timing is not justified'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent timing proof
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          public final class Reviewer {
              public static void main(String[] args) {
                  Solution.Schedule s=Solution.ropeSchedule();
                  if(s.firstMarkerMinute()!=30) throw new AssertionError("first marker");
                  if(s.measuredIntervalMinutes()!=15) throw new AssertionError("interval");
                  if(s.finishMinute()!=45) throw new AssertionError("finish");
                  // Independent invariant: after B burns from one end for 30 min, exactly
                  // 30 one-end burn-time units remain. Two fronts consume 2 units/min.
                  for(int remaining=0; remaining<=120; remaining++) {
                      double twoFront=remaining/2.0;
                      if(Math.abs(twoFront*2.0-remaining)>1e-12) throw new AssertionError("two-front invariant");
                  }
                  System.out.println("PASS marker=30 remaining-one-end-time=30 two-front-interval=15 finish=45 length-ratio-unused");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)"; echo "$stdout"
          test "$stdout" = 'PASS marker=30 remaining-one-end-time=30 two-front-interval=15 finish=45 length-ratio-unused'
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0043/$cid"; sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_independent_proof'||pre.candidate_sha256!==sha)throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const validation={schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate and assert independent burn-time invariants',stdout:process.env.REVIEW_STDOUT,boundary_tests:[{case:'rope A both ends',expected:'first reliable completion marker at 30 minutes',passed:true},{case:'rope B after 30 minutes one-end burn',expected:'30 one-end burn-time units remain',passed:true},{case:'rope B both ends after marker',expected:'remaining quantity completes in 15 minutes and at t=45',passed:true},{case:'nonuniform physical length',expected:'proof never assumes length proportional to time',passed:true}],environment:{java:'OpenJDK 21'}};
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify(validation,null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The preserved source fixes the classic nonuniform-rope timing puzzle: each rope has total one-end burn time of one hour and asks for a 15-minute interval.','The candidate correctly avoids the invalid assumption that half the physical length burns in half the time.','The two-rope event schedule is exact under the standard independent-flame model: A both ends creates t=30; B one end has then consumed 30 one-end-time units; lighting B second end consumes the remaining 30 at two units per minute, so the interval t=30 to t=45 is 15 minutes.','The candidate explicitly distinguishes a 15-minute interval from an event exactly 15 minutes after initial ignition, preventing a common overclaim.','No project experience or source details are fabricated; the Java block is presented only as an executable arithmetic representation of the invariant.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-rope-15m-20260827-v1',review_version:'batch-0043.rope-15m.v1',decision:'pass',revision_round:1,source_packet:['note_tagged/67e14815000000001b025250.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-rope-15m-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-note',title:'Tagged interview note preserving the rope timing puzzle',locator:'note_tagged/67e14815000000001b025250.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Irregular-rope writer validation',locator:`${out}/rope_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent burn-time invariant validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Rope 15-minute source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves one-hour total burn time per rope and asks for a 15-minute timing method; length-proportional timing is not a valid premise.',source_ids:['tagged-note','source-inventory','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'two-rope-proof',text:'The two-rope schedule yields a reliable t=30 marker and a t=30 to t=45 interval of exactly 15 minutes under the standard independent-flame burn-time model.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent burn-time invariant proof',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:validation.boundary_tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b3787f11fe37c461cd68a3a00b303279` completed writer and isolated source-first review. The source fixes the one-hour nonuniform-rope timing puzzle; the candidate correctly avoids length-proportional reasoning and uses a two-rope event schedule: A both ends produces the t=30 marker, B has 30 one-end burn-time units remaining, and lighting B from its second end yields the exact t=30→t=45 15-minute interval. Writer validation covered 20,000 irregular burn-time partitions; the independent reviewer compiled the exact Java invariant representation and separately checked the marker/remaining/two-front arithmetic. Strict candidate audit, code gate, and repository gates are green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git commit -m 'review: pass batch 0043 rope 15-minute candidate source-first'
          for n in 1 2 3 4 5; do
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
            if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((n*2))
          done
          exit 1
