name: Build Content Batch 0043 Three Table SQL

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0043-three-table-sql.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-three-table-sql-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b0a6332f0d7a0639860523642571848f
  SOURCE_QID: b0a6332f0d7a0639860523642571848f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Freeze exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const exact='SQL 考题：三表关联查询及子查询的应用实现？';
          const note=JSON.parse(fs.readFileSync('note_tagged/67541ef40000000002014dce.json','utf8'));
          const row=(note.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==exact) throw new Error(`source wording drifted: ${row?.original_question}`);
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);
          if(!item||item.state!=='active'||item.answer_type!=='coding') throw new Error('batch0043 inventory state/type drifted');
          if(JSON.stringify(item.question_ids)!==JSON.stringify([qid])) throw new Error('inventory ownership drifted');
          if(item.source_questions?.[0]?.original_question!==exact) throw new Error('inventory source wording drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('live ownership/type drifted');
          NODE

      - name: Write source-bounded SQL candidate and executable fixture
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";out="review/content_build/answer_batch_0043/$cid";candidate="review/candidates/answers/$cid.md";mkdir -p "$out" review/candidates/answers
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_b0a6332f0d7a0639860523642571848f","version":1,"status":"draft","updated_at":"2026-08-27","answer_type":"coding","quality_tier":"candidate"} -->
          # SQL：三表关联查询与子查询

          ## 核心结论

          来源只保留“三表关联查询及子查询的应用实现”，没有保留真实表结构、字段、业务口径或目标结果，所以不能虚构唯一 SQL。下面明确给出一个可执行参考练习：`students(student_id,name)`、`courses(course_id,name)`、`scores(student_id,course_id,score)` 三表；查询“平均分高于全体成绩平均分的学生”，返回学生学号、姓名、其平均分和有成绩的课程数。主查询用三表关联，相关粒度在学生层聚合；标量子查询计算全体 `scores.score` 的基准平均值。

          ## 1 分钟版

          - 先确定结果粒度：一名学生一行，因此最终按学生主键/姓名分组。
          - `scores` 是学生与课程的事实表，用 `student_id` 关联 `students`、用 `course_id` 关联 `courses`，避免缺失连接条件造成笛卡尔积。
          - `AVG(sc.score)` 是每名学生自己的平均分；`COUNT(DISTINCT c.course_id)` 是有成绩的课程数。
          - 子查询 `SELECT AVG(score) FROM scores` 返回一个全局标量，放在 `HAVING` 中和每个学生聚合结果比较。
          - 这里采用 `INNER JOIN`，因此只返回至少有一条成绩的学生；是否保留无成绩学生是业务契约，来源没有规定。

          ## 3 分钟版

          参考 schema 与目标如上，SQL 可以写成：

          ```sql
          SELECT
              s.student_id,
              s.name,
              AVG(sc.score) AS avg_score,
              COUNT(DISTINCT c.course_id) AS course_count
          FROM students AS s
          JOIN scores AS sc
            ON sc.student_id = s.student_id
          JOIN courses AS c
            ON c.course_id = sc.course_id
          GROUP BY s.student_id, s.name
          HAVING AVG(sc.score) > (
              SELECT AVG(score)
              FROM scores
          )
          ORDER BY s.student_id;
          ```

          这里三表关联的作用不是“为了凑三张表”：`students` 提供学生维度，`scores` 提供成绩事实和两侧外键，`courses` 证明每条成绩对应有效课程并提供课程粒度计数。子查询只计算一次逻辑上的全局基准；主查询先按学生聚合，再由 `HAVING` 过滤聚合后的组。

          ## 关键细节

          - **WHERE 与 HAVING**：行级过滤应尽量在聚合前用 `WHERE`；依赖 `AVG(sc.score)` 这类聚合值的条件必须在聚合后处理，因此使用 `HAVING`。
          - **连接键完整性**：三表查询要逐条写清连接关系；遗漏 `c.course_id = sc.course_id` 会放大行数并污染平均值与计数。
          - **为什么不用 `AVG(DISTINCT sc.score)`**：两门课程分数相同并不代表重复成绩；是否去重要依赖业务唯一键，不能按数值去重。
          - **空集语义**：当 `scores` 为空时，全局 `AVG(score)` 为 `NULL`，主查询本身也没有学生分组，结果为空；若产品要求其他行为应另行定义。
          - **重复成绩记录**：当前参考契约把 `scores` 每行都视为有效成绩。若同一学生/课程只允许一条有效成绩，应由 schema 唯一约束或题目口径保证，而不是查询里偷偷去重。
          - **性能**：实际规模下先保证连接外键有合适索引，再看执行计划；是否重写为 CTE/派生表、是否物化全局平均值应根据目标数据库与数据量验证。

          ## 原理机制

          关系代数上，先把学生、成绩、课程按键做连接，形成“学生 × 课程成绩”的事实行；`GROUP BY` 把事实行收缩到学生粒度；每个分组上的 `AVG` 产生学生平均分。标量子查询在独立的全体成绩集合上产生一个基准值，`HAVING` 再比较“组内聚合值”和“全局聚合值”。关键不变量是：任何过滤或连接都不能无意改变一名学生应该参与平均计算的成绩行集合。

          ## 项目经验版

          来源没有真实项目 schema、数据量或执行计划，不能虚构线上优化收益。实际落地我会先核对主外键、成绩唯一性、无成绩学生语义和是否存在逻辑删除，再用目标数据库的 `EXPLAIN`、样本结果与基准数据验证行数和成本；这些是验证步骤，不是本题来源事实。

          ## 常见追问

          - 问：子查询能改成 JOIN/CTE 吗？答：可以先在 CTE/派生表算全局平均值再与主查询比较；应以可读性和执行计划为准，不能假设某种写法永远更快。
          - 问：为什么过滤平均分用 HAVING？答：因为学生平均分只有在分组聚合后才存在；`WHERE` 发生在分组前，不能直接过滤这个聚合结果。
          - 问：没有成绩的学生怎么办？答：当前 `INNER JOIN` 明确排除；若要求保留，应改 `LEFT JOIN` 并继续定义 `AVG(NULL)`、课程数和比较基准的业务语义。
          - 问：三表关联怎样避免重复统计？答：先确认 `scores` 的业务唯一键和表间基数；不能用 `DISTINCT score` 掩盖重复，应该从数据模型或明确的去重规则解决。
          - 问：怎样验证 SQL 正确？答：准备单成绩、多成绩、相同分数、低于/等于/高于全局平均值、空表等 fixture，对照手算结果，同时检查三表连接后的行数。

          ## 易错点

          - 在来源没有 schema 时把示例表名、字段和业务目标写成“原题就是这样”。
          - 漏写某一条 JOIN 条件，形成笛卡尔积后仍对错误行集聚合。
          - 用 `WHERE AVG(...)` 过滤聚合值，混淆 SQL 逻辑处理阶段。
          - 用 `AVG(DISTINCT score)` 或无依据的 `DISTINCT` 掩盖数据模型问题。
          - 没定义外连接、NULL、重复记录和空表语义，却把一种实现当成通用答案。
          EOF

          cat > "$out/sql_validation.py" <<'PY'
          import sqlite3

          SQL = '''
          SELECT
              s.student_id,
              s.name,
              AVG(sc.score) AS avg_score,
              COUNT(DISTINCT c.course_id) AS course_count
          FROM students AS s
          JOIN scores AS sc ON sc.student_id = s.student_id
          JOIN courses AS c ON c.course_id = sc.course_id
          GROUP BY s.student_id, s.name
          HAVING AVG(sc.score) > (SELECT AVG(score) FROM scores)
          ORDER BY s.student_id
          '''

          def setup(rows):
              con=sqlite3.connect(':memory:')
              con.execute('create table students(student_id integer primary key, name text not null)')
              con.execute('create table courses(course_id integer primary key, name text not null)')
              con.execute('create table scores(student_id integer not null, course_id integer not null, score real not null)')
              con.executemany('insert into students values(?,?)',[(1,'Alice'),(2,'Bob'),(3,'Cara'),(4,'Dan')])
              con.executemany('insert into courses values(?,?)',[(10,'Math'),(20,'English'),(30,'OS')])
              con.executemany('insert into scores values(?,?,?)',rows)
              return con

          con=setup([(1,10,90),(1,20,80),(2,10,60),(2,20,60),(3,10,70),(3,20,70)])
          # global average = 71.666..., only Alice (85) is strictly above.
          rows=[(sid,name,float(avg),cnt) for sid,name,avg,cnt in con.execute(SQL)]
          assert rows == [(1,'Alice',85.0,2)], rows

          # Equal-valued scores are separate course facts and both count; equality to global average is excluded by >.
          con=setup([(1,10,80),(1,20,80),(2,10,60),(2,20,60)])
          rows=[(sid,name,float(avg),cnt) for sid,name,avg,cnt in con.execute(SQL)]
          assert rows == [(1,'Alice',80.0,2)], rows

          # One valid fact remains a valid one-course group; students with no scores are excluded by inner joins.
          con=setup([(1,10,100),(2,20,0),(3,30,50)])
          rows=[(sid,name,float(avg),cnt) for sid,name,avg,cnt in con.execute(SQL)]
          assert rows == [(1,'Alice',100.0,1)], rows
          assert all(sid != 4 for sid,_,_,_ in rows)

          # Empty scores: scalar AVG is NULL and there are no groups, so result is empty.
          con=setup([])
          assert list(con.execute(SQL)) == []
          print('PASS above-global-average=exact equal-valued-course-facts=preserved equality-excluded one-course=covered no-score=excluded empty-scores=empty')
          PY
          stdout="$(python3 "$out/sql_validation.py")";echo "$stdout"
          test "$stdout" = 'PASS above-global-average=exact equal-valued-course-facts=preserved equality-excluded one-course=covered no-score=excluded empty-scores=empty'
          echo "WRITER_STDOUT=$stdout" >> "$GITHUB_ENV"
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const p=`review/candidates/answers/${process.env.CANONICAL_ID}.md`;
          fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex')+'\n');
          NODE

      - name: Freeze writer research and validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const tests=[{case:'three-table fixture with student averages above/equal/below global average',expected:'only strictly above-global-average student is returned',passed:true},{case:'two distinct courses with equal score values',expected:'both fact rows participate and course_count remains two',passed:true},{case:'one-course student plus no-score student',expected:'valid one-course group participates; no-score student excluded by explicit inner-join reference contract',passed:true},{case:'empty scores table',expected:'result is empty without fabricated aggregate row',passed:true}];
          fs.writeFileSync(`${out}/sql_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'python3 sql_validation.py against SQLite in-memory fixtures',stdout:process.env.WRITER_STDOUT,boundary_tests:tests,environment:{sqlite:'Python sqlite3'}},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'tagged-note',title:'Tagged interview note preserving generic three-table SQL/subquery prompt',locator:'note_tagged/67541ef40000000002014dce.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Executable SQLite three-table/subquery fixture',locator:`${out}/sql_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The source preserves a request to implement a three-table association query using a subquery but does not preserve real schema, fields, business filtering, grouping or target output.',source_ids:['tagged-note','source-inventory'],answer_locations:['核心结论','3 分钟版','关键细节']},{claim_id:'reference-behavior',text:'Under the explicitly declared students/courses/scores reference exercise, the exact SQL returns student-level aggregates strictly above the global score average and handles equal-valued facts, no-score students and empty scores according to the declared contract.',source_ids:['writer-validation'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

      - name: Writer repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit candidate with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0043/$CANONICAL_ID/sql_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/writer_research.json"
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: draft batch 0043 three-table SQL candidate'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
          done
          exit 1
