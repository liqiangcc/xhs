name: Content Batch 0062 Slow SQL Scenario

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0062-slow-sql.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0062-slow-sql
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_004333ab8f1c0f22014765e4e6f7abb0

jobs:
  write-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build source-bounded candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/content/build_batch_0062_slow_sql.py
          python3 scripts/content/build_batch_0062_slow_sql.py
      - name: Validate writer-stage source and structure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto');
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const base=`review/content_build/answer_batch_0062/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
          if(!ctx.ok||ctx.answer_type!=='scenario'||ctx.canonical?.canonical_id!==cid) throw new Error('context/type drift');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(['004333ab8f1c0f22014765e4e6f7abb0'])) throw new Error('ownership drift');
          const primary=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
          if(primary.schema_version!=='answer_primary_source_research.v1'||primary.source_boundary?.answer_type!=='scenario') throw new Error('primary research drift');
          for(const sourceId of ['mysql-84-slow-query-log','mysql-84-statement-digests','mysql-84-sys-statement-analysis','mysql-84-explain','mysql-84-optimizer-trace','mysql-84-index-optimization']) if(!(primary.sources||[]).some(x=>x.source_id===sourceId)) throw new Error(`primary source missing: ${sourceId}`);
          const mdPath=`review/candidates/answers/${cid}.md`;
          const md=fs.readFileSync(mdPath,'utf8');
          for(const section of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(section).length-1!==1) throw new Error(`section drift: ${section}`);
          for(const marker of ['MySQL 8.4','slow_query_log','long_query_time','sys.statement_analysis','Performance Schema','EXPLAIN ANALYZE','optimizer_trace','INFORMATION_SCHEMA.OPTIMIZER_TRACE','rows examined','P95/P99','回滚','一致性']) if(!md.includes(marker)) throw new Error(`required scenario marker missing: ${marker}`);
          if((md.match(/^- 问：/gm)||[]).length<5) throw new Error('followups insufficient');
          if(/我负责过|我在线上|实际线上我们|我们项目中|我把 SQL 从/.test(md)) throw new Error('fabricated experience risk');
          const digest=crypto.createHash('sha256').update(fs.readFileSync(mdPath)).digest('hex');
          const writer=JSON.parse(fs.readFileSync(`${base}/writer_research.json`,'utf8'));
          if(writer.candidate_sha256!==digest||writer.review_state!=='writer_complete_isolated_review_pending') throw new Error('writer research/digest drift');
          console.log(`CANDIDATE_SHA256=${digest}`);
          NODE
      - name: Writer-stage audit has only expected pre-review blockers
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --noWrite --noDraftCheck > /tmp/audit.json
          rc=$?
          set -e
          cat /tmp/audit.json
          test "$rc" -ne 0
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const row=report.rows?.[0];
          if(!row) throw new Error('audit row missing');
          const actual=[...(row.hard_failures||[])].sort();
          const expected=['missing_evidence','missing_independent_review'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`unexpected writer-stage hard failures: ${JSON.stringify(actual)}`);
          const errors=(row.errors||[]).map(x=>x.error);
          for(const e of errors) if(!['missing_evidence','missing_dimension_score','review_not_passed','total_score_below_minimum'].includes(e)) throw new Error(`unexpected writer-stage audit error: ${e}`);
          NODE
      - name: Baseline repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage
      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0062 slow-SQL writer: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add \
            scripts/content/build_batch_0062_slow_sql.py \
            "review/candidates/answers/$CANONICAL_ID.md" \
            "review/content_build/answer_batch_0062/$CANONICAL_ID/primary_source_research.json" \
            "review/content_build/answer_batch_0062/$CANONICAL_ID/writer_research.json" \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0062.md
          if git diff --cached --quiet; then echo 'No Batch 0062 slow-SQL writer changes to commit.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: stage batch 0062 slow-sql scenario candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
