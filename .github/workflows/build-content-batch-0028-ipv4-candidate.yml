      - name: Compile and execute deterministic candidate fixture
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0028/$CANONICAL_ID"
          pushd "$out" >/dev/null
          javac -encoding UTF-8 Ipv4ToInt.java Ipv4ToIntTest.java
          stdout="$(java Ipv4ToIntTest)"
          popd >/dev/null
          echo "$stdout"
          test "$stdout" = 'PASS valid=6 invalid=12 unsigned-boundaries=2 leading-zero-contract=decimal'
          STDOUT="$stdout" python3 - <<'PY'
          import json, os
          from pathlib import Path
