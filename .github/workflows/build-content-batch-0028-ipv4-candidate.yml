          PY

      - name: Commit only if content source head stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during candidate build: $base_head -> $remote_head"
            echo 'Discarding verified local writer slice; retry on newer state.'
            exit 0
          fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0028/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0028.md
          if git diff --cached --quiet; then echo 'No candidate changes to commit.'; exit 0; fi
          git diff --cached --check
          git config user.name 'xhs-content-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: draft batch 0028 IPv4 candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
