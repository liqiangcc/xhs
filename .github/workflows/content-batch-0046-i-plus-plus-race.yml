            {'source_id':'jdk-atomic','title':'Java SE 21 java.util.concurrent.atomic package/API','locator':'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/atomic/package-summary.html','source_type':'official_documentation','checked_at':date},
            {'source_id':'bytecode','title':'javap decomposition of exact unsafeIncrement candidate','locator':str(out/'unsafe_increment_bytecode.txt'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
            {'source_id':'writer-validation','title':'Exact i++ race candidate validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date}
          ]
          claims=[
            {'claim_id':'source-boundary','text':'The preserved Java-concurrency Question initializes i to 0 and asks what final values are possible when two threads execute i++ and why; it does not specify extra synchronization, volatile, or atomic wrappers. The answer states the minimal completion/join assumptions explicitly.','source_ids':['batch-inventory'],'answer_locations':['核心结论','关键细节']},
