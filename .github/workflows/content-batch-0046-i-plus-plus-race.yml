          (out/'unsafe_increment_bytecode.txt').write_text(bytecode)
          validation={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'javac --release 21; javap -c IncrementRace; java IncrementRaceTest','stdout':stdout,'checks':['unsafeIncrement bytecode contains separate getstatic/iadd/putstatic steps','deterministic lost-update decomposition yields 1','serialized decomposition yields 2','same-monitor synchronized increments yield 2 in 500 runs','AtomicInteger increments yield 2 in 500 runs']}
