          pathlib.Path('/tmp/b46-inc/IncrementRace.java').write_text(blocks[0].strip()+'\n')
          pathlib.Path('/tmp/b46-inc/candidate.sha256').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'\n')
          PY

      - name: Compile candidate and verify RMW decomposition plus safe fixes
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b46-inc
          cat > IncrementRaceTest.java <<'EOF'
          public final class IncrementRaceTest {
              public static void main(String[] args) throws Exception {
                  for (int r=0;r<500;r++) {
                      if (IncrementRace.synchronizedTwice()!=2) throw new AssertionError("synchronized lost update");
                      if (IncrementRace.atomicTwice()!=2) throw new AssertionError("atomic lost update");
                  }
                  int initial=0;
                  int t1Read=initial;
                  int t2Read=initial;
                  int afterT1Write=t1Read+1;
                  int lostUpdateFinal=t2Read+1;
                  if (afterT1Write!=1 || lostUpdateFinal!=1) throw new AssertionError("lost-update model failed");
                  int serialized=initial; serialized++; serialized++;
                  if (serialized!=2) throw new AssertionError("serialized model failed");
                  System.out.println("PASS synchronized=2 atomic=2 repeats=500 lost-update-interleaving=1 serialized-interleaving=2");
              }
          }
          EOF
          javac --release 21 IncrementRace.java IncrementRaceTest.java
          javap -classpath . -c IncrementRace > bytecode.txt
          grep -q 'getstatic' bytecode.txt
          grep -q 'iadd' bytecode.txt
          grep -q 'putstatic' bytecode.txt
          java IncrementRaceTest | tee stdout.txt
          test "$(cat stdout.txt)" = 'PASS synchronized=2 atomic=2 repeats=500 lost-update-interleaving=1 serialized-interleaving=2'

