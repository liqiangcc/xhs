name: Remediate Content Batch 0036 Temperature Relation

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0036-temperature-relation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-temperature-relation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  SOURCE_QID: 85d552bc1c5e793996cb2ea34fe2e614
  SOURCE_CID: cq_q_85d552bc1c5e793996cb2ea34fe2e614
  TARGET_QID: 870fc85ff34de337bdcf1e05799217ca
  TARGET_CID: cq_q_870fc85ff34de337bdcf1e05799217ca

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0036
          node <<'NODE'
          const fs=require('fs');
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(questions.map(q=>[q.question_id,q]));
          const byC=new Map(canonicals.map(c=>[c.canonical_id,c]));
          const expected=new Map([
            [process.env.SOURCE_QID,'算法：温度 (单调栈)'],
            [process.env.TARGET_QID,'算法手撕：每日温度（Daily Temperatures）。'],
          ]);
          for(const [qid,text] of expected){
            const q=byQ.get(qid);
            if(!q||q.original_question!==text) throw new Error(`${qid}: source wording drifted: ${q?.original_question}`);
            if(q.is_valid_for_library===false) throw new Error(`${qid}: unexpectedly invalid before relation review`);
            if(q.question_type!=='算法手撕_Coding') throw new Error(`${qid}: type drifted: ${q.question_type}`);
          }
          if(byQ.get(process.env.SOURCE_QID)?.canonical_id!==process.env.SOURCE_CID) throw new Error('shorthand singleton ownership drifted');
          if(byQ.get(process.env.TARGET_QID)?.canonical_id!==process.env.TARGET_CID) throw new Error('explicit Daily Temperatures ownership drifted');
          for(const [cid,qid] of [[process.env.SOURCE_CID,process.env.SOURCE_QID],[process.env.TARGET_CID,process.env.TARGET_QID]]){
            const c=byC.get(cid);
            if(!c||JSON.stringify(c.question_ids||[])!==JSON.stringify([qid])) throw new Error(`${cid}: expected singleton member set before reviewed consolidation`);
          }
          const matches=questions.filter(q=>q.is_valid_for_library!==false && /每日温度|温度.*单调栈|单调栈.*温度|daily\s*temperatures/i.test(q.original_question||''));
          const ids=[...new Set(matches.map(q=>q.canonical_id).filter(Boolean))].sort();
          const expectedIds=[process.env.SOURCE_CID,process.env.TARGET_CID].sort();
          if(matches.length!==2||JSON.stringify(ids)!==JSON.stringify(expectedIds)) throw new Error(`temperature relation neighborhood drifted: matches=${matches.length} ids=${JSON.stringify(ids)}`);
          const source=byQ.get(process.env.SOURCE_QID), target=byQ.get(process.env.TARGET_QID);
          const sourceEntities=[...(source.tech_entities||[])].map(String).map(x=>x.toLowerCase());
          const targetEntities=[...(target.tech_entities||[])].map(String).map(x=>x.toLowerCase());
          if(!sourceEntities.includes('单调栈')||!targetEntities.includes('单调栈')) throw new Error('monotonic-stack source entity agreement missing');
          const review=`# Answer Batch 0036 — Temperature / Daily Temperatures Relation Review\n\n`+
            `## Source-first facts\n\n`+
            `- shorthand source \`${process.env.SOURCE_QID}\`: ${expected.get(process.env.SOURCE_QID)}\n`+
            `- explicit source \`${process.env.TARGET_QID}\`: ${expected.get(process.env.TARGET_QID)}\n`+
            `- both are current valid Coding Questions and both are tagged with the monotonic-stack entity.\n`+
            `- repository-wide source-near enumeration for “每日温度 / 温度+单调栈 / Daily Temperatures” returns exactly these two Questions and exactly these two singleton Canonicals.\n\n`+
            `No historical relation/remediation record was consulted to form this conclusion. The shorthand source does not preserve a full formal statement, but within the current corpus its combination of “温度” plus the explicit “单调栈” method uniquely resolves to the same recoverable coding problem identified by the second source as Daily Temperatures. Treating it as a separate unknown temperature problem would duplicate one source-bounded problem while providing no distinct input/output or constraint evidence.\n\n`+
            `## Decision\n\n`+
            `Relation: \`same\`. Preserve \`${process.env.TARGET_CID}\` as the survivor because it has the source-explicit Daily Temperatures title. Retire singleton \`${process.env.SOURCE_CID}\` through the reviewed Select → Decide → Apply path. The survivor Answer remains \`needs_update\` until rebuilt and independently reviewed against both source Questions; this consolidation does not promote content.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0036/temperature_relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Select decide and apply exact reviewed pair
        shell: bash
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0036/temperature_relation_apply'
          mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$SOURCE_QID,$TARGET_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(r.relation_candidates)||r.relation_candidates.length!==1) throw new Error(`expected exactly one RelationCandidate, got ${r.relation_candidates?.length}`);
          const c=r.relation_candidates[0];
          const actual=[...c.question_ids].sort();
          const expected=[process.env.SOURCE_QID,process.env.TARGET_QID].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`selected Question pair drifted: ${JSON.stringify(actual)}`);
          process.stdout.write(c.relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide \
            --relation-candidate-key "$key" \
            --relation same \
            --actor-type ai \
            --actor-id batch-0036-temperature-source-first-review \
            --actor-display-name 'Batch 0036 temperature source-first reviewer' \
            --rationale 'Current source-first review found exactly two valid temperature/monotonic-stack Questions in the corpus. The shorthand “温度 (单调栈)” has no distinct contract evidence and uniquely aligns with the source-explicit Daily Temperatures Question; consolidate them without promoting the survivor Answer.' > "$out/decide.json"
          node scripts/xhs.js dedup apply \
            --relation-candidate-key "$key" \
            --canonical-id "$TARGET_CID" \
            --canonical-title '算法手撕：每日温度（Daily Temperatures）。' > "$out/apply.json"

      - name: Verify ownership effect and record task progress
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byCid=new Map(canon.map(x=>[x.canonical_id,x])), byQid=new Map(qs.map(x=>[x.question_id,x]));
          for(const qid of [process.env.SOURCE_QID,process.env.TARGET_QID]){
            if(byQid.get(qid)?.canonical_id!==process.env.TARGET_CID) throw new Error(`${qid}: expected survivor ownership after apply`);
          }
          if(byCid.has(process.env.SOURCE_CID)) throw new Error('duplicate shorthand Canonical survived same-relation consolidation');
          const target=byCid.get(process.env.TARGET_CID);
          const members=[...(target?.question_ids||[])].sort();
          const expected=[process.env.SOURCE_QID,process.env.TARGET_QID].sort();
          if(JSON.stringify(members)!==JSON.stringify(expected)) throw new Error(`survivor member set drifted after apply: ${JSON.stringify(members)}`);
          fs.writeFileSync('review/content_build/answer_batch_0036/temperature_relation_apply.md',
            '# Answer Batch 0036 — Temperature Relation Application\n\n'+
            '- Reviewed relation: `same`.\n'+
            `- Survivor: \`${process.env.TARGET_CID}\` (source-explicit Daily Temperatures title).\n`+
            `- Consolidated Questions: \`${process.env.SOURCE_QID}\`, \`${process.env.TARGET_QID}\`.\n`+
            `- Retired duplicate shorthand Canonical: \`${process.env.SOURCE_CID}\`.\n`+
            '- Mutation path: explicit pair Select → AI Decision → Application dedup apply with current ownership/freshness checks.\n'+
            '- Survivor Answer promotion remains deferred; it must be rebuilt and independently reviewed against the expanded two-Question source set.\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const note=`- [x] \`${process.env.SOURCE_CID}\` shorthand “温度 (单调栈)” singleton is source-first consolidated as \`same\` into source-explicit Daily Temperatures survivor \`${process.env.TARGET_CID}\`; corpus-wide source-near enumeration found exactly these two temperature/monotonic-stack Questions and no distinct contract evidence. The survivor Answer remains needs-update until rebuilt and independently reviewed against both source Questions.`;
          if(!text.includes(note)) text=text.trimEnd()+`\n${note}\n`;
          fs.writeFileSync(task,text);
          NODE

      - name: Refresh generated answer-type audit after consolidation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit

      - name: Full repository and answer gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during reviewed relation slice: $base_head -> $remote_head; fail closed and regenerate next run."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: consolidate batch 0036 temperature duplicate'
          git push origin "HEAD:$CONTENT_BRANCH"
