name: Export Source Snapshot

on:
  push:
    branches:
      - refactor/soc-srp-architecture
    paths:
      - .github/workflows/export-source.yml
      - .export-source-trigger

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude=.git -czf "$RUNNER_TEMP/xhs-source-${GITHUB_SHA}.tar.gz" .

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: xhs-source-${{ github.sha }}
          path: ${{ runner.temp }}/xhs-source-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 1
