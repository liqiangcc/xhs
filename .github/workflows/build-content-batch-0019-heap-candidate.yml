name: Content Batch 0019 Heap Candidate Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion' || startsWith(github.event.pull_request.head.ref, 'automation/batch0019-candidate-gate') || github.event.pull_request.head.ref == 'ci/batch0019-heap-candidate-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate heap fixture
        working-directory: review/content_build/answer_batch_0019/cq_q_2f351e2a49d14ad9643e8daed49006b0
        shell: bash
        run: |
          set -euo pipefail
          javac IntMinHeap.java IntMinHeapTest.java
          stdout="$(java IntMinHeapTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=10 randomized=5000 oracle=java-priority-queue heap=min duplicates=supported empty=throws mutation=input-none"

      - name: Run formal candidate audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_2f351e2a49d14ad9643e8daed49006b0.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate, evidence and isolated review binding
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cid = 'cq_q_2f351e2a49d14ad9643e8daed49006b0'
          candidate = Path(f'review/candidates/answers/{cid}.md').read_bytes()
          candidate_sha = hashlib.sha256(candidate).hexdigest()
          evidence = json.loads(Path(f'review/evidence/{cid}.json').read_text(encoding='utf-8'))
          review = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/isolated_review_result.json').read_text(encoding='utf-8'))
          validation = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/code_validation.json').read_text(encoding='utf-8'))

          expected_sha = '8d567824490d15750d34a4032656b7a077a13277279f9a8c48507baa52d0d87d'
          expected_stdout = 'PASS fixed=10 randomized=5000 oracle=java-priority-queue heap=min duplicates=supported empty=throws mutation=input-none'
          assert candidate_sha == expected_sha
          assert validation['result'] == 'pass'
          assert validation['stdout'] == expected_stdout
          assert evidence['schema_version'] == 'answer_evidence.v1'
          assert evidence['review_state'] == 'independent_source_first_review_passed'
          assert review['schema_version'] == 'isolated_review.v1'
          assert review['decision'] == 'pass'
          assert review['promotion_blockers'] == ['human_approval_required_for_pilot_promotion']
          assert evidence['candidate_sha256'] == expected_sha
          assert review['candidate_sha256'] == expected_sha
          coverage = evidence['source_question_coverage']
          assert coverage == [{
              'question_id': '2f351e2a49d14ad9643e8daed49006b0',
              'covered': True,
              'answer_locations': ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问'],
          }]
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'cq_q_2f351e2a49d14ad9643e8daed49006b0' review/content_build/answer_batch_0019/source_boundary_audit.md
          grep -Fq 'candidate-qualified' review/content_build/answer_batch_0019/source_boundary_audit.md
