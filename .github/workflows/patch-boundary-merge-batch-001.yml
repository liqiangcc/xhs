name: Patch Boundary Merge Batch 001 Verification

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .patch-boundary-merge-batch-001-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Correct archive invariant and retrigger merge batch
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/execute-boundary-merge-batch-001.yml
          grep -F 'review/answers/_archive/${source}.md' "$file"
          sed -i 's#review/answers/_archive/${source}.md#review/archive/answers/${source}.md#' "$file"
          grep -F 'review/archive/answers/${source}.md' "$file"
          printf 'merge-retry-2\n' > .boundary-merge-batch-001-trigger
          rm -f .patch-boundary-merge-batch-001-trigger .github/workflows/patch-boundary-merge-batch-001.yml
          git add -A
          git commit -m 'chore: execute canonical boundary merge batch 001'
          git push origin HEAD:content/quality-completion
