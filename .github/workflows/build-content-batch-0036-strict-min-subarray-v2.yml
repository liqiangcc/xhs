      - name: Commit writer artifact from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during strict minimum-subarray writer slice: $base_head -> $remote_head; fail closed."
            exit 1
          fi
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0036/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md
          git diff --cached --check
          git config user.name 'xhs-content-builder'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
