name: Review Content Batch 0021 Topological Sort Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0021-topological-sort-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-topological-sort-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_37ffe67ab69164654b0a19aa57b410df
  SOURCE_QID: 37ffe67ab69164654b0a19aa57b410df
  SOURCE_NOTE: note_desc/65f3d1b5000000001302669c.txt
  SOURCE_TAGGED: note_tagged/65f3d1b5000000001302669c.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_note_sha256=$(sha256sum "$SOURCE_NOTE" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_tagged_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review with independent permutation oracle
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0021/$cid"; candidate="review/candidates/answers/$cid.md"
          test -f "$candidate"; rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,out=`review/content_build/answer_batch_0021/${process.env.CANONICAL_ID}`;
          const raw=fs.readFileSync(process.env.SOURCE_NOTE,'utf8');
          if(!raw.includes('8.手撕 拓扑排序')) throw new Error('primary source wording drift');
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const tq=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tq||tq.original_question!=='算法：拓扑排序') throw new Error('tagged source drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift: ${h}`);
          for(const marker of ['Kahn','入度','O(V + E)','答案可能不唯一','来源没有真实项目经历','有向环']) if(!md.includes(marker)) throw new Error(`semantic marker missing: ${marker}`);
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责/.test(md)) throw new Error('fabricated project-experience claim detected');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1) throw new Error(`expected one Java block, got ${blocks.length}`);
          fs.writeFileSync(`${out}/reviewer_tmp/TopologicalSort.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/TopologicalSortReviewerTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.List;
          import java.util.Random;

          public final class TopologicalSortReviewerTest {
              private static long exhaustiveGraphs = 0;
              private static long randomGraphs = 0;

              public static void main(String[] args) {
                  for (int n = 0; n <= 4; n++) enumerateAllSimpleGraphs(n);
                  Random r = new Random(0x37ffe67aL);
                  for (int i = 0; i < 200; i++) checkAgainstPermutationOracle(5, randomEdges(5, r));
                  for (int i = 0; i < 100; i++) checkAgainstPermutationOracle(6, randomEdges(6, r));
                  checkAgainstPermutationOracle(3, new int[][]{{0,1},{0,1},{1,2}});
                  expectCycle(1, new int[][]{{0,0}});
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(-1, new int[0][]));
                  expect(NullPointerException.class, () -> TopologicalSort.sort(0, null));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{0}}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{-1,1}}));
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(2, new int[][]{{0,2}}));
                  System.out.printf("PASS exhaustive_graphs=%d random_graphs=%d permutation_oracle=pass duplicate_edges=pass self_loop=pass invalid=reject%n", exhaustiveGraphs, randomGraphs);
              }

              private static void enumerateAllSimpleGraphs(int n) {
                  List<int[]> possible = new ArrayList<>();
                  for (int u = 0; u < n; u++) for (int v = 0; v < n; v++) if (u != v) possible.add(new int[]{u,v});
                  int count = 1 << possible.size();
                  for (int mask = 0; mask < count; mask++) {
                      List<int[]> es = new ArrayList<>();
                      for (int i = 0; i < possible.size(); i++) if ((mask & (1 << i)) != 0) es.add(possible.get(i));
                      checkAgainstPermutationOracle(n, es.toArray(int[][]::new));
                      exhaustiveGraphs++;
                  }
              }

              private static int[][] randomEdges(int n, Random r) {
                  List<int[]> es = new ArrayList<>();
                  for (int u = 0; u < n; u++) for (int v = 0; v < n; v++) if (u != v && r.nextInt(5) == 0) es.add(new int[]{u,v});
                  randomGraphs++;
                  return es.toArray(int[][]::new);
              }

              private static void checkAgainstPermutationOracle(int n, int[][] edges) {
                  int[] witness = findValidPermutation(n, edges);
                  if (witness == null) {
                      expectCycle(n, edges);
                      return;
                  }
                  int[] actual = TopologicalSort.sort(n, edges);
                  validateOrder(n, edges, actual);
              }

              private static int[] findValidPermutation(int n, int[][] edges) {
                  int[] p = new int[n];
                  boolean[] used = new boolean[n];
                  return permute(0, p, used, edges) ? p.clone() : null;
              }

              private static boolean permute(int k, int[] p, boolean[] used, int[][] edges) {
                  if (k == p.length) return valid(p, edges);
                  for (int v = 0; v < p.length; v++) if (!used[v]) {
                      used[v] = true; p[k] = v;
                      if (permute(k + 1, p, used, edges)) return true;
                      used[v] = false;
                  }
                  return false;
              }

              private static boolean valid(int[] order, int[][] edges) {
                  int[] pos = new int[order.length];
                  for (int i = 0; i < order.length; i++) pos[order[i]] = i;
                  for (int[] e : edges) if (pos[e[0]] >= pos[e[1]]) return false;
                  return true;
              }

              private static void validateOrder(int n, int[][] edges, int[] order) {
                  if (order.length != n) throw new AssertionError("wrong length " + Arrays.toString(order));
                  boolean[] seen = new boolean[n];
                  for (int v : order) {
                      if (v < 0 || v >= n || seen[v]) throw new AssertionError("not a permutation " + Arrays.toString(order));
                      seen[v] = true;
                  }
                  if (!valid(order, edges)) throw new AssertionError("edge constraint violated " + Arrays.toString(order));
              }

              private static void expectCycle(int n, int[][] edges) {
                  expect(IllegalArgumentException.class, () -> TopologicalSort.sort(n, edges));
              }

              private static void expect(Class<? extends Throwable> type, Runnable action) {
                  try { action.run(); throw new AssertionError("missing " + type.getSimpleName()); }
                  catch (Throwable t) { if (!type.isInstance(t)) throw new AssertionError("wrong exception " + t); }
              }
          }
          JAVA

          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror TopologicalSort.java TopologicalSortReviewerTest.java && java TopologicalSortReviewerTest > reviewer_stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/reviewer_stdout.txt")"
          test "$stdout" = 'PASS exhaustive_graphs=4166 random_graphs=300 permutation_oracle=pass duplicate_edges=pass self_loop=pass invalid=reject'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The primary source preserves only a hand-written topological-sort request; Java, int[][] input, zero-based vertices, Kahn processing, arbitrary-valid-order semantics and exception-on-cycle behavior are not recovered source constraints.',
            'The candidate explicitly labels those language, API and cycle-policy choices as an executable answer-side contract instead of attributing them to the interview source.',
            'The Kahn invariant and cycle argument are correct: only current zero-indegree vertices are emitted, each outgoing edge is removed once, and an early-empty queue with unprocessed vertices implies a directed cycle in the remaining subgraph.',
            'Reviewer-extracted Java compiles with warnings as errors and is checked using an independent brute-force permutation-existence oracle on all 4,166 simple directed graphs through four vertices plus 300 deterministic arbitrary graphs on five/six vertices.',
            'The reviewer also verifies duplicate-edge behavior, self-loop rejection, malformed/out-of-range input rejection, and validates returned orders by permutation membership plus every edge constraint rather than one fixed expected order.',
            'No fabricated production experience, unsupported source expansion, placeholder implementation, or hidden uniqueness requirement was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract candidate Java; javac -Xlint:all -Werror; independent brute-force permutation oracle over exhaustive small graphs and deterministic n=5/6 graphs',stdout:process.env.REVIEW_STDOUT,checks:['candidate Java compiles with warnings-as-errors','all 4166 simple directed graphs for vertex counts 0..4 agree with independent permutation-existence oracle','300 deterministic arbitrary directed graphs on 5/6 vertices agree with the permutation oracle','returned orders are validated as full permutations satisfying every edge constraint','duplicate edges are handled consistently','self-loop/cyclic graph and declared invalid inputs reject'],boundary_tests:[{case:'source versus answer-side contract',expected:'Java/input representation/Kahn/cycle API remain explicitly answer-side choices',passed:true},{case:'non-unique valid orders',expected:'validation checks graph constraints rather than one fixed order',passed:true},{case:'cycle detection',expected:'no valid permutation implies candidate rejects; all valid-oracle graphs yield a valid order',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-topological-sort-20260826-v1',review_version:'topological-sort.kahn.permutation-oracle.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_NOTE,process.env.SOURCE_TAGGED,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence only after reviewer conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0021/${cid}`,candidate=`review/candidates/answers/${cid}.md`,hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const w=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||w.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('evidence prerequisite drift');
          if(!w.source_question_coverage?.some(x=>x.question_id===qid&&x.covered)) throw new Error('writer source coverage missing');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'topological-sort-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'raw-note',title:'Interview note preserving the hand-written topological-sort request',locator:process.env.SOURCE_NOTE,source_type:'repository_source_record',checked_at:date},{source_id:'tagged-question',title:'Tagged topological-sort question record',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer exhaustive-small-graph and DAG validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent brute-force permutation-oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The recoverable source asks only to hand-write topological sort; it does not prescribe language, graph representation, ordering policy, algorithm variant or cycle API.',source_ids:['raw-note','tagged-question'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'candidate-contract',text:'Java vertices 0..V-1, int[][] directed edges, any valid topological order, Kahn processing and exception-on-cycle are explicit answer-side choices.',source_ids:['raw-note','tagged-question','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},{claim_id:'implementation-validation',text:'The implementation is independently validated by a permutation-existence oracle across every simple directed graph through four vertices and deterministic arbitrary five/six-vertex graphs, in addition to writer validation.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- `cq_q_37ffe67ab69164654b0a19aa57b410df` — coding; source-bounded Java Kahn topological-sort candidate is staged with language/API/cycle behavior explicit, writer exhaustive-small-graph plus deterministic DAG validation PASS, and source binding recorded. Isolated independent review remains pending; formal promotion remains blocked by repository human approval and real-review policy.';
          const done='- `cq_q_37ffe67ab69164654b0a19aa57b410df` — coding; source-bounded Java Kahn topological-sort candidate keeps language/API/cycle behavior explicit, writer validation plus independent permutation-oracle validation PASS, isolated source-first review PASS, and complete evidence binding. Formal promotion remains blocked by repository human approval and real-review policy.';
          if(text.includes(pending)) text=text.replace(pending,done); else if(!text.includes(done)) throw new Error('task summary marker drift');
          const checkPending='- [ ] `cq_q_37ffe67ab69164654b0a19aa57b410df` writer pass is complete: raw note and tagged question bind the hand-written topological-sort request, a source-bounded Java Kahn candidate plus reproducible fixture are committed, and writer validation is PASS. Next gate is isolated source-first review.';
          const checkDone='- [x] `cq_q_37ffe67ab69164654b0a19aa57b410df` passes isolated source-first review: raw source and tagged question were reviewed before writer evidence, reviewer-owned permutation-oracle Java validation PASS, and complete evidence binding is frozen. Formal promotion remains governed by repository human approval and real-review policy.';
          if(text.includes(checkPending)) text=text.replace(checkPending,checkDone); else if(!text.includes(checkDone)) throw new Error('task checklist marker drift');
          fs.writeFileSync(task,text);
          NODE

      - name: Strict candidate audit and complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review without overwriting unrelated branch progress
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0021/$CANONICAL_ID/reviewer_tmp"
          git add -A; git diff --cached --check
          git config user.name 'xhs-review-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass topological sort candidate source-first'
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse origin/$CONTENT_BRANCH)"; base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then
            remote_candidate="$(git show "origin/$CONTENT_BRANCH:review/candidates/answers/$CANONICAL_ID.md" | sha256sum | awk '{print $1}')"
            remote_note="$(git show "origin/$CONTENT_BRANCH:$SOURCE_NOTE" | sha256sum | awk '{print $1}')"
            remote_tagged="$(git show "origin/$CONTENT_BRANCH:$SOURCE_TAGGED" | sha256sum | awk '{print $1}')"
            test "$remote_candidate" = '${{ steps.base.outputs.candidate_sha256 }}' || { echo 'candidate changed; fail closed'; exit 0; }
            test "$remote_note" = '${{ steps.base.outputs.source_note_sha256 }}' || { echo 'source note changed; fail closed'; exit 0; }
            test "$remote_tagged" = '${{ steps.base.outputs.source_tagged_sha256 }}' || { echo 'tagged source changed; fail closed'; exit 0; }
            git rebase "origin/$CONTENT_BRANCH"
          fi
          git push origin "HEAD:$CONTENT_BRANCH"
