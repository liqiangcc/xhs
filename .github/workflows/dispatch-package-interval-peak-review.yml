name: Dispatch Package Interval Peak Review

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/dispatch-package-interval-peak-review.yml

permissions:
  actions: write
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Dispatch source-first review
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run review-content-batch-0021-package-interval-peak-candidate.yml --ref master
      - name: Remove one-shot dispatcher
        run: |
          set -euo pipefail
          rm .github/workflows/dispatch-package-interval-peak-review.yml
          git config user.name 'xhs-coordinator-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove package review dispatcher'
          git push origin HEAD:master
