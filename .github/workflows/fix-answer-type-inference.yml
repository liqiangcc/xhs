name: Fix Answer Type Inference

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/fix-answer-type-inference.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Patch inference and add regression test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');

          const qualityPath = 'scripts/lib/answer_quality.js';
          let quality = fs.readFileSync(qualityPath, 'utf8');
          const oldFn = `function inferAnswerType(questions = [], canonical = {}) {
              const joined = questions.map((item) => item.question_type || '').join(' ').toLowerCase();
              const title = String(canonical.canonical_title || '').toLowerCase();
              if (/coding|算法手撕|sql/.test(joined)) return 'coding';
              if (/项目|project|故障|线上排障/.test(joined + title)) return 'project';
              if (/行为|behavior|自我介绍|职业|冲突|沟通/.test(joined + title)) return 'behavior';
              if (/场景|system|设计|架构|方案/.test(joined + title)) return 'scenario';
              if (/原理|mechanism|流程|过程|底层/.test(joined + title)) return 'mechanism';
              return 'concept';
          }`;
          const newFn = `function inferAnswerType(questions = [], canonical = {}) {
              const sourceTypes = questions.map((item) => item.question_type || '').join(' ').toLowerCase();
              const title = String(canonical.canonical_title || '').toLowerCase();

              // Source taxonomy is stronger evidence than title keywords. In
              // particular, technical wording such as \"无冲突\" must not be
              // mistaken for a behavioral-interview question merely because it
              // contains the substring \"冲突\".
              if (/coding|算法手撕|sql/.test(sourceTypes)) return 'coding';
              if (/场景|scenario|system|设计|架构|方案/.test(sourceTypes)) return 'scenario';
              if (/行为|behavior/.test(sourceTypes)) return 'behavior';
              if (/项目|project/.test(sourceTypes)) return 'project';
              if (/原理|mechanism|under.?the.?hood|流程|过程|底层/.test(sourceTypes)) return 'mechanism';
              if (/concept|八股文/.test(sourceTypes)) return 'concept';

              // Fall back to title semantics only when source taxonomy is absent
              // or unrecognized. Keep behavioral phrases narrow enough that
              // ordinary technical \"conflict\" terminology is not captured.
              if (/算法|sql|手撕/.test(title)) return 'coding';
              if (/自我介绍|职业规划|离职|行为面|团队冲突|同事冲突|上下级冲突|沟通经历/.test(title)) return 'behavior';
              if (/项目|线上故障|事故复盘/.test(title)) return 'project';
              if (/场景|系统设计|架构|方案|如何设计|迁移|扩容|高并发/.test(title)) return 'scenario';
              if (/原理|流程|过程|底层|源码/.test(title)) return 'mechanism';
              return 'concept';
          }`;
          if (!quality.includes(oldFn)) throw new Error('inferAnswerType source block changed unexpectedly');
          quality = quality.replace(oldFn, newFn);
          fs.writeFileSync(qualityPath, quality, 'utf8');

          const testPath = 'test/answer_candidate.test.js';
          let test = fs.readFileSync(testPath, 'utf8');
          const marker = `test('structured candidate rendering excludes generic type guidance', () => {`;
          const regression = `test('source scenario taxonomy wins over technical conflict wording in title', () => {
              const root = fs.mkdtempSync(path.join(os.tmpdir(), 'xhs-answer-type-scenario-'));
              writeJson(path.join(root, 'config', 'answer_quality.json'), QUALITY);
              writeJsonl(path.join(root, 'data', 'questions', 'canonical_questions.jsonl'), [{
                  schema_version: 'canonical_question.v1',
                  canonical_id: 'cq_short_url',
                  canonical_title: '百亿级短 URL 如何生成无冲突短码？',
                  aliases: ['场景：短URL生成器设计：百亿URL怎么做到无冲突？'],
                  question_ids: ['q-short-url'],
                  primary_domain: { l1: '系统设计', l2: '分布式ID与幂等' },
                  primary_entities: ['短链接', '无冲突'],
                  companies: ['阿里'],
                  frequency: 1,
                  review_priority: 'P2',
                  answer_status: 'needs_update',
              }]);
              writeJsonl(path.join(root, 'data', 'questions', 'questions.jsonl'), [{
                  question_id: 'q-short-url',
                  canonical_id: 'cq_short_url',
                  original_question: '场景：短URL生成器设计：百亿URL怎么做到无冲突？',
                  question_type: '场景设计_Scenario',
                  company: '阿里',
              }]);
              const context = buildAnswerContext({ root, canonicalId: 'cq_short_url' });
              assert.equal(context.answer_type, 'scenario');
              fs.rmSync(root, { recursive: true, force: true });
          });

          `;
          if (!test.includes(marker)) throw new Error('test insertion marker not found');
          if (!test.includes("source scenario taxonomy wins over technical conflict wording in title")) {
              test = test.replace(marker, regression + marker);
          }
          fs.writeFileSync(testPath, test, 'utf8');
          NODE

      - name: Verify targeted and full CI
        run: |
          node --test test/answer_candidate.test.js
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage
          git diff --check

      - name: Commit fix and remove one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-completion-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git rm .github/workflows/fix-answer-type-inference.yml
          git add scripts/lib/answer_quality.js test/answer_candidate.test.js
          git commit -m "fix: prefer source taxonomy for answer type inference"
          git push origin HEAD:content/quality-completion
