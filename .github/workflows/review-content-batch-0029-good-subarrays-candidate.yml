name: Review Content Batch 0029 Good Subarrays Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0029-good-subarrays-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0029-good-subarrays-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_67ba9bfbae99a725c25a0d4ac0b19f98
  SOURCE_QID: 67ba9bfbae99a725c25a0d4ac0b19f98
  CANDIDATE_BLOB_SHA: 123cfe371c1fe4834690a3998f9e134c668c45cb

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun exact Java fixture
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          javac "$out/SubarrayMultipleOfK.java" "$out/SubarrayMultipleOfKTest.java"
          test "$(java -cp "$out" SubarrayMultipleOfKTest)" = 'PASS count-standard=7 count-zeros=6 count-negative-elements=2 negative-k=7 exists-standard=true exists-alt=true exists-false=false length-two-zero=true k-zero=rejected null=rejected'
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('source ownership drifted');
          const q=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.question_id===qid);
          const expected='算法手撕：和为 K 的倍数的连续子数组（Good Subarrays，利用前缀和与哈希优化）。';
          if(!q||q.original_question!==expected) throw new Error('source wording drifted');
          if(!Array.isArray(q.tech_entities)||!q.tech_entities.includes('prefix sum')||!q.tech_entities.includes('hash table')) throw new Error('preserved algorithm entities drifted');
          if(!Array.isArray(q.business_context)||!q.business_context.includes('LeetCode 523/974')) throw new Error('523/974 ambiguity context drifted');
          const note=fs.readFileSync('note_tagged/68b00074000000001d02aaf6.json','utf8');
          if(!note.includes(expected)||!note.includes('LeetCode 523/974')) throw new Error('original tagged note no longer matches frozen source packet');
          const baseline=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!baseline.includes('quality_tier":"long_tail_baseline')) throw new Error('expected long-tail baseline no longer matches reviewed starting state');
          NODE

      - name: Record isolated source-first review and evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0029/${cid}`;
          const fixture=`${out}/code_validation.json`;
          const reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0029-good-subarrays-20260825-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved source explicitly names continuous subarrays whose sum is a multiple of K, prefix-sum/hash optimization, and a combined LeetCode 523/974 business context. Because the exact output contract is not preserved, collapsing it to only existence or only count would fabricate precision.',
            'The candidate preserves that ambiguity constructively by exposing two methods under the same prefix-remainder invariant: a count method using remainder frequencies and an existence-with-minimum-length method using earliest indices.',
            'The displayed Java block is a complete compilable class and matches the separately executed fixture implementation.',
            'The deterministic fixture passes the standard counting case, all-zero combinations, negative-element remainder normalization, negative-k normalization, positive and negative existence cases, the minimum length-two case, and explicit k=0/null boundaries.',
            'The candidate explains the empty-prefix seed, why earliest index is required for the length constraint, normalized modulo for negative values, long counting bounds, and the difference between hash-state semantics for counting versus existence.',
            'Complexity and data-structure tradeoffs are scoped to the explicit k!=0 candidate contract; no exact 523/974 contract, project history, or k=0 semantics are invented beyond the frozen source.',
            'No uncovered preserved variant remains because both source-compatible 523/974 interpretations are represented and distinguished. No coding hard failure or unsupported source attribution remains; formal promotion still follows repository promotion and real-review policy.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0029.good-subarrays.v1',decision:'pass',revision_round:1,source_packet:['review/content_build/answer_batch_0029/source_boundary_audit.json','note_tagged/68b00074000000001d02aaf6.json',`${out}/writer_research.json`,candidate,fixture,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(reviewPath,JSON.stringify(review,null,2)+'\n');
          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,
            writer:{writer_id:'content-batch-0029-good-subarrays-candidate-builder',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'source-boundary',title:'Answer Batch 0029 frozen source-boundary audit and original tagged note',locator:'review/content_build/answer_batch_0029/source_boundary_audit.json + note_tagged/68b00074000000001d02aaf6.json',source_type:'repository_source_record',checked_at:date},
              {source_id:'fixture',title:'Subarray-multiple-of-K deterministic Java fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Good-subarrays independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-ambiguity',text:'The preserved source names continuous subarrays whose sum is a multiple of K, prefix-sum/hash optimization, and LeetCode 523/974 together without preserving one exact output contract; the candidate therefore keeps and distinguishes both existence and counting variants.',source_ids:['source-boundary'],answer_locations:['核心结论','1 分钟版','关键细节','常见追问']},
              {claim_id:'remainder-invariant',text:'Under the explicit k!=0 candidate contract, equal normalized prefix remainders characterize subarrays whose sum is divisible by k; frequency state counts all such pairs while earliest-index state supports the length-at-least-two existence variant.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','3 分钟版','原理机制']},
              {claim_id:'boundary-validation',text:'The executable fixture verifies counting and existence variants, all-zero combinations, negative elements, negative k, minimum-length behavior, and explicit k=0/null boundaries.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:'javac SubarrayMultipleOfK.java SubarrayMultipleOfKTest.java && java SubarrayMultipleOfKTest',result:'pass',reported_stdout:'PASS count-standard=7 count-zeros=6 count-negative-elements=2 negative-k=7 exists-standard=true exists-alt=true exists-false=false length-two-zero=true k-zero=rejected null=rejected',checks:['counting variant standard prefix-remainder case','all-zero counting combinations','negative element remainder normalization','negative k normalization','existence variant positive cases','existence variant negative case','minimum length two behavior','explicit k=0 rejection','explicit null rejection'],boundary_tests:[{case:'count [4,5,0,-2,-3,1], k=5',expected:7,actual:7,passed:true},{case:'count [0,0,0], k=5',expected:6,actual:6,passed:true},{case:'count negative elements [-1,1,-4,4], k=5',expected:2,actual:2,passed:true},{case:'exists [23,2,4,6,7], k=6',expected:true,actual:true,passed:true},{case:'exists [23,2,6,4,7], k=13',expected:false,actual:false,passed:true}]},
            review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0029.good-subarrays.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Good-subarrays candidate passed isolated source-first review with both preserved 523/974 interpretations represented and deterministic Java evidence; formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during good-subarrays review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0029 good-subarrays candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
