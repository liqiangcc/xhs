name: Run Content Batch 0034 Deadlock Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/run-content-batch-0034-deadlock-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-deadlock-runner
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7db820e34ee11cbf1d7d3f980d6f2de3
  SOURCE_QID: 7db820e34ee11cbf1d7d3f980d6f2de3
  SOURCE_NOTE: note_tagged/685696fe0000000012033bb6.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Recover source-bounded candidate from registered writer
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; mkdir -p "$out"
          test ! -e "review/candidates/answers/$cid.md"
          git fetch --depth=1 origin master
          git show origin/master:.github/workflows/build-content-batch-0034-deadlock-candidate.yml > /tmp/writer.yml
          awk '
            /cat > "review\/candidates\/answers\/\$cid.md" <<'\''EOF'\''/ {copy=1; next}
            copy && /^[[:space:]]*EOF[[:space:]]*$/ {exit}
            copy {sub(/^          /, ""); print}
          ' /tmp/writer.yml > "review/candidates/answers/$cid.md"
          grep -q '^# 如何避免死锁？请写一个死锁案例$' "review/candidates/answers/$cid.md"

          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,note=process.env.SOURCE_NOTE,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const expected='如何避免死锁？请写一个死锁案例。';
          const tagged=JSON.parse(fs.readFileSync(note,'utf8')); const src=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected||src.question_type!=='手写代码_Coding') throw new Error('source wording/type drifted');
          const ctx=JSON.parse(fs.readFileSync(path.join(out,'context.json'),'utf8')); if(!ctx.ok||ctx.answer_type!=='coding') throw new Error('canonical context/type drifted');
          const library=(ctx.source_questions||[]).find(x=>x.original_question===expected); if(!library||!ctx.canonical.question_ids.includes(library.question_id)) throw new Error('Question -> Canonical mapping drifted');
          fs.writeFileSync(path.join(out,'source_mapping.json'),JSON.stringify({schema_version:'answer_source_mapping.v1',canonical_id:cid,library_question_id:library.question_id,note_question_id:qid,note_path:note,original_question:expected,question_type:src.question_type,domain:src.domain,verified_at:'2026-08-26'},null,2)+'\n');
          const boundary='review/content_build/answer_batch_0034/source_boundary_audit.md'; let text=fs.existsSync(boundary)?fs.readFileSync(boundary,'utf8'):'# Answer Batch 0034 Source Boundary Audit\n'; const heading=`## ${cid}`;
          if(!text.includes(heading)) text += `\n${heading}\n\n- Exact repository source: ${note}, question ${qid}.\n- Preserved wording: ${expected}\n- Preserved intent: explain how deadlocks are avoided and provide a concrete deadlocking Java example.\n- Not preserved: lock primitive, JDK version, business incident, timeout policy, database semantics, or monitor-vs-explicit-lock requirement.\n- Executable policy: deterministic opposite-order ReentrantLock deadlock, daemon workers, bounded ThreadMXBean detection.\n- Promotion remains blocked until isolated review, evidence gate, required human approval, and real-review policy are satisfied.\n`;
          fs.writeFileSync(boundary,text);
          NODE

      - name: Execute exact answer fence and freeze writer evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; mkdir -p "$out/classes"
          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8'); const fence=md.match(/```java\n([\s\S]*?)\n```/); if(!fence) throw new Error('Java fence missing');
          fs.writeFileSync(`review/content_build/answer_batch_0034/${cid}/DeadlockCase.java`,fence[1].trim()+'\n');
          NODE
          javac -d "$out/classes" "$out/DeadlockCase.java"
          stdout="$(timeout 8s java -cp "$out/classes" DeadlockCase)"
          case "$stdout" in DEADLOCK_DETECTED\ threads=*) ;; *) echo "unexpected stdout: $stdout" >&2; exit 1;; esac
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`; const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          fs.writeFileSync(path.join(out,'code_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:'2026-08-26',command:'javac exact candidate fence && timeout 8s java DeadlockCase',stdout:process.env.STDOUT,checks:['opposite first-lock ownership synchronized by latch','ThreadMXBean detects at least two deadlocked threads','bounded detection deadline','daemon workers let evidence process exit']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-26',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Exact repository deadlock question and boundary audit',locator:`${mapping.note_path} + ${out}/source_mapping.json + review/content_build/answer_batch_0034/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'fixture',title:'Deterministic JDK 21 deadlock reproduction and ThreadMXBean detection',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-26'}],claims:[{claim_id:'source-boundary',text:'The source asks how to avoid deadlock and to write a deadlock example without preserving a required primitive, JDK version, business incident or database scenario.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','项目经验版']},{claim_id:'deadlock-reproduction',text:'The exact candidate Java deterministically forms opposite ReentrantLock acquisition order after both threads hold one lock, and ThreadMXBean detects the resulting deadlock within a bounded deadline.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','原理机制']},{claim_id:'avoidance',text:'The answer distinguishes global lock ordering and avoiding hold-and-wait from bounded acquisition and from detection/diagnosis.',source_ids:['repository-source','fixture'],answer_locations:['核心结论','1 分钟版','关键细节','常见追问']}],source_question_coverage:[{question_id:mapping.library_question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8'); const p='- Deadlock canonical `'+cid+'` has a source-bounded JDK 21 candidate with deterministic opposite-lock-order reproduction, bounded ThreadMXBean detection, exact-code validation, and writer evidence; isolated review and promotion gates remain pending.'; if(!t.includes(p)) t=t.trimEnd()+'\n'+p+'\n'; fs.writeFileSync(task,t);
          NODE

      - name: Commit verified candidate if branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"; remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"; base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced: $base_head -> $remote_head; discard local mutation."; exit 0; fi
          git add review/candidates/answers/"$CANONICAL_ID".md review/content_build/answer_batch_0034 tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git diff --cached --check
          git config user.name xhs-content-builder; git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: build batch 0034 deadlock candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
