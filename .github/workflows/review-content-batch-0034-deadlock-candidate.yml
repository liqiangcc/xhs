name: Review Content Batch 0034 Deadlock Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0034-deadlock-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-deadlock-reviewer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7db820e34ee11cbf1d7d3f980d6f2de3

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first isolated review and exact-candidate revalidation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; candidate="review/candidates/answers/$cid.md"
          test -s "$candidate"; test -s "$out/source_mapping.json"; test -s "$out/code_validation.json"; test ! -e "$out/isolated_review_result.json"

          # Independent conclusion uses preserved source, current standards and exact candidate before writer history.
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const note=JSON.parse(fs.readFileSync(mapping.note_path,'utf8'));
          const q=(note.tagged_questions||[]).find(x=>x.question_id===mapping.note_question_id);
          const expected='如何避免死锁？请写一个死锁案例。';
          if(!q||q.original_question!==expected||q.question_type!=='手写代码_Coding') throw new Error('preserved source wording/type drifted');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(!md.includes(h)) throw new Error(`missing section ${h}`);
          for(const token of ['全局加锁顺序','互斥、持有并等待、不可剥夺、循环等待','tryLock','ThreadMXBean','CountDownLatch','来源没有提供真实线上事故']) if(!md.includes(token)) throw new Error(`required source-bounded content missing: ${token}`);
          if(!md.includes('发现死锁是诊断，不能替代设计阶段的预防')) throw new Error('detection/prevention boundary missing');
          const fence=md.match(/```java\n([\s\S]*?)\n```/); if(!fence) throw new Error('Java fence missing');
          fs.writeFileSync('/tmp/DeadlockCase.java',fence[1].trim()+'\n');
          const val=JSON.parse(fs.readFileSync(path.join(out,'code_validation.json'),'utf8')); if(val.result!=='pass') throw new Error('writer validation did not pass');
          NODE

          mkdir -p /tmp/deadlock-review-classes
          javac -d /tmp/deadlock-review-classes /tmp/DeadlockCase.java
          stdout="$(timeout 8s java -cp /tmp/deadlock-review-classes DeadlockCase)"
          case "$stdout" in DEADLOCK_DETECTED\ threads=*) ;; *) echo "independent deadlock detector failed: $stdout" >&2; exit 1;; esac
          count="${stdout##*=}"
          test "$count" -ge 2

          hash="$(sha256sum "$candidate" | awk '{print $1}')"
          CANDIDATE_HASH="$hash" REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          const result={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:process.env.CANDIDATE_HASH,reviewed_at:'2026-08-26',review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0034-deadlock-20260826-v1',review_version:'batch-0034.deadlock.v1',decision:'pass',revision_round:1,source_packet:[mapping.note_path,path.join(out,'source_mapping.json'),'review/content_build/answer_batch_0034/source_boundary_audit.md',`review/candidates/answers/${cid}.md`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5},hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:['The preserved source explicitly asks both how to avoid deadlock and for a deadlock code example; it does not preserve a required lock primitive, JDK version, business incident or database scenario.','The candidate directly separates prevention, bounded acquisition/failure recovery, and detection/diagnosis, rather than presenting deadlock detection as prevention.','The deliberate example is deterministic rather than sleep-probabilistic: a latch ensures both daemon workers hold opposite first ReentrantLocks before each requests the other lock.','The exact Java fence independently compiles on JDK 21 and ThreadMXBean.findDeadlockedThreads() reports at least two deadlocked threads within a bounded deadline; daemon workers allow the evidence process to exit without pretending the deadlock was resolved.','The avoidance explanation correctly ties global lock ordering to breaking circular wait, and scopes tryLock timeout to a failure/release/retry protocol while warning about livelock/retry storms. No production history is fabricated.'],validation:{command:'javac exact candidate fence && timeout 8s java DeadlockCase',result:'pass',stdout:process.env.REVIEW_STDOUT},promotion_blockers:['required_human_approval_not_yet_satisfied','repository_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(path.join(out,'isolated_review_result.json'),JSON.stringify(result,null,2)+'\n');
          NODE

      - name: Bind independent verdict only after conclusion
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          test -s "$out/writer_research.json"; test -s "$out/isolated_review_result.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const result=JSON.parse(fs.readFileSync(path.join(out,'isolated_review_result.json'),'utf8')); if(result.decision!=='pass'||result.hard_failures.length) throw new Error('isolated verdict not promotable');
          const wp=path.join(out,'writer_research.json'); const writer=JSON.parse(fs.readFileSync(wp,'utf8')); if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error(`writer state drifted: ${writer.review_state}`);
          writer.review_state='independent_source_first_review_passed';
          writer.sources.push({source_id:'isolated-review',title:'Independent source-first deadlock candidate review',locator:path.join(out,'isolated_review_result.json'),source_type:'repository_structured_source',checked_at:'2026-08-26'});
          writer.claims.push({claim_id:'isolated-review-verdict',text:'Independent source-first review found no hard failures, unsupported claims or uncovered source variants and independently reproduced the exact candidate deadlock under a bounded JDK 21 detector run.',source_ids:['isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','原理机制','常见追问']});
          writer.promotion_blocker='required_human_approval_and_real_review_policy_not_yet_satisfied';
          writer.review={reviewer_id:result.reviewer_id,review_version:result.review_version,independent:true,decision:'pass',revision_round:1,scores:result.scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:result.findings};
          fs.writeFileSync(wp,JSON.stringify(writer,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8'); const p='- Deadlock canonical `'+cid+'` passed isolated source-first review and exact-candidate bounded deadlock revalidation; promotion remains blocked only by required human approval and repository real-review policy.'; if(!t.includes(p)) t=t.trimEnd()+'\n'+p+'\n'; fs.writeFileSync(task,t);
          NODE

      - name: Commit isolated-review result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-review-bot; git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0034/$CANONICAL_ID/isolated_review_result.json" "review/content_build/answer_batch_0034/$CANONICAL_ID/writer_research.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git commit -m 'review: pass batch 0034 deadlock candidate source-first'
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin "$CONTENT_BRANCH" && git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi
            git rebase --abort 2>/dev/null || true; sleep $((attempt*3));
          done
          exit 1
