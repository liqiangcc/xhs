name: Repair Batch 0036 Strict Minimum Subarray Writer

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-content-batch-0036-strict-min-subarray-writer.yml

permissions:
  contents: write

concurrency:
  group: repair-batch-0036-strict-min-subarray-writer
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Correct strict greater-than fixed oracle and remove repair workflow
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/build-content-batch-0036-strict-min-subarray.yml'
          grep -F 'check(7,new int[]{2,3,1,2,4,3},2);' "$target"
          sed -i 's/check(7,new int\[\]{2,3,1,2,4,3},2);/check(7,new int[]{2,3,1,2,4,3},3);/' "$target"
          grep -F 'check(7,new int[]{2,3,1,2,4,3},3);' "$target"
          git rm .github/workflows/fix-content-batch-0036-strict-min-subarray-writer.yml
          git add "$target"
          git diff --cached --check
          git config user.name 'xhs-ci-remediation'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'ci: fix strict-min-subarray fixed expectation'
          git push origin HEAD:master
