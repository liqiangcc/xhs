name: Build Content Batch 0039 CAS Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0039-cas-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0039-cas-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9ffa48e1df8d78a08a74e14388301ebc
  SOURCE_QID: 9ffa48e1df8d78a08a74e14388301ebc

