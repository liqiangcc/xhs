name: Build Content Batch 0042 Dutch Flag Order

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0042-dutch-flag-order.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-dutch-flag-order-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_af091a4667cf97a15834eaa7bada1877
  SOURCE_QID: af091a4667cf97a15834eaa7bada1877

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze exact source boundary
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法：排序包含 1, 0, -1 三种元素的数组，按照 [1, -1, 0] 指定顺序排列 (荷兰国旗变形)';
          const raw=JSON.parse(fs.readFileSync('note_structured/678fa7d6000000002901c387.json','utf8'));
          if(raw.questions?.[12]!==exact)throw new Error('dutch-flag source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('ownership/type drifted');
          if(!(ctx.source_questions||[]).some(x=>x.question_id===qid&&x.original_question===exact))throw new Error('exact source missing');
          NODE

      - name: Write source-bounded candidate and validate implementation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";out="review/content_build/answer_batch_0042/$cid";candidate="review/candidates/answers/$cid.md";mkdir -p "$out" review/candidates/answers
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_af091a4667cf97a15834eaa7bada1877","version":1,"status":"draft","updated_at":"2026-08-27","answer_type":"coding","quality_tier":"candidate"} -->
          # 按 [1, -1, 0] 顺序原地整理三值数组

          ## 核心结论

          原题只要求把仅含 `1、0、-1` 的数组按 `[1,-1,0]` 的指定顺序排列，这是三向分区问题的自定义顺序版本。可以维护四个区域：已确定的 `1` 前缀、已确定的 `-1` 中段、尚未分类区间、已确定的 `0` 后缀。扫描未知区间时，`1` 放到左侧，`-1` 留在中间，`0` 放到右侧，最终得到目标分组。

          原题没有保存 API、是否必须原地、空数组和非法值语义。下面给出一个明确的 Java 参考契约：`reorder(int[] a)` 原地修改；空数组合法；`null` 抛 `NullPointerException`；若出现 `1/-1/0` 之外的值，先完整校验并抛 `IllegalArgumentException`，避免非法输入被部分改写。

          ## 1 分钟版

          - `oneEnd` 指向下一个应放 `1` 的位置，`scan` 扫描未知区间，`zeroStart` 指向下一个应放 `0` 的位置。
          - 循环不变量是：`[0,oneEnd)` 全是 `1`，`[oneEnd,scan)` 全是 `-1`，`[scan,zeroStart]` 未分类，`(zeroStart,n)` 全是 `0`。
          - 遇到 `1`：与 `oneEnd` 交换，然后 `oneEnd++`、`scan++`。
          - 遇到 `-1`：它已经属于中间区，只需 `scan++`。
          - 遇到 `0`：与 `zeroStart` 交换，只做 `zeroStart--`，不能立刻 `scan++`，因为换回来的元素仍未知。
          - 分区线性扫描，时间 O(n)，额外空间 O(1)。

          ## 3 分钟版

          ```java
          public final class Solution {
              private Solution() {}

              public static void reorder(int[] a) {
                  if (a == null) throw new NullPointerException("a");
                  for (int value : a) {
                      if (value != 1 && value != -1 && value != 0) {
                          throw new IllegalArgumentException("unsupported value: " + value);
                      }
                  }

                  int oneEnd = 0;
                  int scan = 0;
                  int zeroStart = a.length - 1;
                  while (scan <= zeroStart) {
                      if (a[scan] == 1) {
                          swap(a, scan, oneEnd);
                          oneEnd++;
                          scan++;
                      } else if (a[scan] == -1) {
                          scan++;
                      } else {
                          swap(a, scan, zeroStart);
                          zeroStart--;
                      }
                  }
              }

              private static void swap(int[] a, int i, int j) {
                  int t = a[i];
                  a[i] = a[j];
                  a[j] = t;
              }
          }
          ```

          关键在 `0` 分支：右端换到 `scan` 的元素可能仍是 `1`、`-1` 或 `0`，所以当前位置必须重新检查。相反，处理 `1` 时，若发生非自交换，从 `oneEnd` 换回来的元素来自已经确定的 `-1` 区，因此当前索引可以继续前进。

          ## 关键细节

          - 题目指定的是 `[1,-1,0]`，不能误写成自然数值顺序 `[-1,0,1]`。
          - 本实现选择原地修改，但这是参考契约，不是从原题补出的事实。
          - 预校验不是算法必须步骤；它只是让参考 API 在调用方违反三值前置条件时保持“拒绝且不部分修改”。如果题目明确保证输入合法，可以省略预扫描，核心分区仍是 O(n)。
          - 三向交换不保证一般意义上的稳定性；若元素除了类别值还携带身份且要求同类稳定，就需要换算法。
          - 计数三个值再覆盖数组也是 O(n)/O(1) 的正确替代方案；三向分区更直接体现荷兰国旗变形的不变量。
          - 空数组时 `zeroStart=-1`，循环不进入，结果仍为空。

          ## 原理机制

          三向分区不是做全序比较，而是在循环中持续缩小未知区间。每一步都把当前未知元素并入某个已知区域：`1` 扩大左前缀，`-1` 扩大中段，`0` 扩大右后缀。循环结束时 `scan > zeroStart`，未知区域为空，三个区域依次拼接就是 `[1] + [-1] + [0]`。

          证明正确性的重点不是“交换很多次”，而是不变量始终保持。三个分支都不会破坏已经确定的前缀、中段和后缀，并且每轮至少使未知区间减少一个元素，因此算法必然终止且终止状态满足目标顺序。

          ## 项目经验版

          原题没有真实项目经历，不能虚构线上使用。真实工程若遇到固定枚举值的重排，我会先确认是否允许原地修改、是否要求稳定、非法枚举如何处理以及数据量，再决定使用计数覆盖、三向分区还是通用排序。

          ## 常见追问

          - 问：为什么 `0` 分支不能 `scan++`？答：因为换回来的右端元素尚未分类，必须在当前索引再次判断。
          - 问：为什么 `1` 分支可以同时推进两个左侧指针？答：`oneEnd` 到 `scan` 之前已是确定的 `-1` 区，交换回来的值已经分类；若两指针相等则只是自交换。
          - 问：可以直接计数吗？答：可以。统计 `1/-1/0` 数量后按目标顺序覆盖数组，同样是 O(n) 时间和 O(1) 额外空间。
          - 问：这是稳定排序吗？答：一般不是。当前只有三个数值时同类元素没有额外身份；若元素带其它字段且要求稳定，需要重新定义方案。
          - 问：为什么先校验非法值？答：这是参考 API 的边界选择，用于保证非法输入在报错前不被部分修改，不是原题要求。
          - 问：为什么不是 O(n log n)？答：类别只有三个且目标顺序固定，不需要比较排序，只需把每个元素归入对应分区。

          ## 易错点

          - 忘记自定义顺序，按 `[-1,0,1]` 排列。
          - `0` 交换后错误递增 `scan`，跳过换回来的未知元素。
          - 把 `-1` 错误交换到最左侧，破坏 `[1] + [-1] + [0]` 不变量。
          - 没有声明输入前置条件，却把其它整数静默归入某一类。
          - 用通用比较排序忽略固定三类值这一题目结构。
          EOF

          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');const cid=process.env.CANONICAL_ID,md=fs.readFileSync(`review/candidates/answers/${cid}.md`);fs.writeFileSync('/tmp/candidate-sha',crypto.createHash('sha256').update(md).digest('hex')+'\n');const block=md.toString('utf8').match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('public static void reorder'))throw new Error('candidate code missing');fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java
          cat > /tmp/WriterValidation.java <<'JAVA'
          import java.util.*;
          public final class WriterValidation {
              static int rank(int x){return x==1?0:x==-1?1:2;}
              static int[] oracle(int[] a){Integer[] b=new Integer[a.length];for(int i=0;i<a.length;i++)b[i]=a[i];Arrays.sort(b,Comparator.comparingInt(WriterValidation::rank));int[] out=new int[a.length];for(int i=0;i<a.length;i++)out[i]=b[i];return out;}
              static void check(int[] a){int[] input=a.clone(),want=oracle(a);Solution.reorder(a);if(!Arrays.equals(a,want))throw new AssertionError(Arrays.toString(input)+" got="+Arrays.toString(a)+" want="+Arrays.toString(want));}
              static long exhaustive=0;
              static void gen(int[] a,int i,int[] vals){if(i==a.length){check(a.clone());exhaustive++;return;}for(int v:vals){a[i]=v;gen(a,i+1,vals);}}
              public static void main(String[] args){
                  int[] vals={1,-1,0};for(int n=0;n<=10;n++)gen(new int[n],0,vals);
                  Random r=new Random(0x444E46574CL);for(int t=0;t<20000;t++){int n=r.nextInt(300);int[] a=new int[n];for(int i=0;i<n;i++)a[i]=vals[r.nextInt(3)];check(a);}
                  int[] bad={1,-1,7,0},snapshot=bad.clone();try{Solution.reorder(bad);throw new AssertionError("bad accepted");}catch(IllegalArgumentException expected){}if(!Arrays.equals(bad,snapshot))throw new AssertionError("invalid input partially mutated");
                  try{Solution.reorder(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}
                  System.out.println("PASS exhaustive="+exhaustive+" random=20000 custom-order=1,-1,0 invalid=reject-unchanged null=rejected");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/WriterValidation.java
          stdout="$(java -cp /tmp WriterValidation)";echo "$stdout";grep -E '^PASS exhaustive=[0-9]+ random=20000 custom-order=1,-1,0 invalid=reject-unchanged null=rejected$' <<<"$stdout";echo "WRITER_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze writer research and validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0042/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0042/${cid}`,sha=process.env.CANDIDATE_SHA;
          const tests=[{case:'all arrays length 0..10 over {1,-1,0}',expected:'reference comparator order [1,-1,0]',passed:true},{case:'20,000 seeded random arrays',expected:'candidate equals comparator-order oracle',passed:true},{case:'invalid value',expected:'IllegalArgumentException before mutation',passed:true},{case:'null',expected:'NullPointerException',passed:true}];
          fs.writeFileSync(`${out}/dutch_flag_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; exhaustive/random comparator-order validation',stdout:process.env.WRITER_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'structured-note',title:'Structured interview note 678fa7d6000000002901c387',locator:'note_structured/678fa7d6000000002901c387.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_source_record',checked_at:date},{source_id:'writer-validation',title:'Dutch-flag custom-order exhaustive/random Java validation',locator:`${out}/dutch_flag_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source requires values 1, 0 and -1 to be reordered into custom order [1,-1,0]; API, mutation and invalid-input semantics are not source-frozen.',source_ids:['structured-note','source-inventory'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'Under the declared Java contract, three-way partitioning matches an independent comparator-order oracle over exhaustive bounded and seeded random arrays and rejects invalid values before mutation.',source_ids:['writer-validation'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed',candidate_sha256:sha},null,2)+'\n');
          NODE

      - name: Candidate repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit candidate with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0042/$CANONICAL_ID/writer_research.json" "review/content_build/answer_batch_0042/$CANONICAL_ID/dutch_flag_validation.json"
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: stage batch 0042 dutch-flag-order candidate'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
            sleep 5
          done
          exit 1
