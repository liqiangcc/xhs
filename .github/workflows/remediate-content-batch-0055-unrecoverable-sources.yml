name: Remediate Content Batch 0055 Unrecoverable Sources

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0055-unrecoverable-sources.yml
      - scripts/content/remediate_batch_0055_unrecoverable_sources.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0055-unrecoverable-sources
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fail-closed source remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0055_unrecoverable_sources.py > /tmp/remediate.py
          python3 -m py_compile /tmp/remediate.py
          python3 /tmp/remediate.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify explainable invalid projections and retired reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          targets=[
            ('cq_q_f980b179e23abf160c16d1c8876345fd','f980b179e23abf160c16d1c8876345fd','算法手撕：原创业务场景算法题。',['原创算法题','业务场景','输入输出','fail-closed']),
            ('cq_q_fb4bb71d8c35b1ff7e2fca5c36799af6','fb4bb71d8c35b1ff7e2fca5c36799af6','算法：数据库sql操作 出了两个题',['两个 SQL','表结构','查询目标','fail-closed']),
          ]
          canon={json.loads(x)['canonical_id'] for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          questions={row['question_id']:row for row in (json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip())}
          progress_ids={row.get('canonical_id') for row in json.loads((root/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'))
          decisions={row.get('question_id'):row for row in audit.get('decisions',[])}
          for cid,qid,expected,tokens in targets:
              if cid in canon: raise SystemExit(f'{cid}: retired Canonical still active')
              row=questions.get(qid)
              if not row or row.get('original_question')!=expected: raise SystemExit(f'{qid}: Question projection missing/wording drifted')
              if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'{qid}: invalid projection incorrect: {row}')
              if cid in progress_ids: raise SystemExit(f'{cid}: ReviewProgress still active')
              if (root/'review/answers'/f'{cid}.md').exists(): raise SystemExit(f'{cid}: active Answer still exists')
              if not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit(f'{cid}: archived baseline Answer missing')
              if (root/'review/candidates/answers'/f'{cid}.md').exists(): raise SystemExit(f'{cid}: unexpected candidate exists')
              if (root/'review/evidence'/f'{cid}.json').exists(): raise SystemExit(f'{cid}: unexpected candidate evidence exists')
              decision=decisions.get(qid)
              if not decision or decision.get('decision')!='exclude' or decision.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'{qid}: validity-audit exclusion missing')
              note=decision.get('exclusion_note') or ''
              for token in tokens:
                  if token not in note: raise SystemExit(f'{qid}: exclusion explanation missing {token}')
          print('PASS batch0055 unrecoverable source singletons retired fail-closed and explainable')
          PY

      - name: Verify complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record bounded batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0055.md')
          t=p.read_text(encoding='utf-8')
          lines=[
            '- [x] `cq_q_f980b179e23abf160c16d1c8876345fd` retired fail-closed as source-unrecoverable: the raw note preserves only “2、原创算法题”; no business scenario, statement, inputs/outputs, constraints, examples, objective, or expected result survives. Choosing any concrete algorithm would fabricate the original interview problem. The invalid Question remains explainable with `incomplete_or_unreadable`, while its generated long-tail baseline is archived and Canonical/ReviewProgress reachability is removed.',
            '- [x] `cq_q_fb4bb71d8c35b1ff7e2fca5c36799af6` retired fail-closed as source-unrecoverable: the raw note preserves only “数据库sql操作 出了两个题” and none of the two SQL statements, schemas, columns, sample rows, query goals, filters/joins/aggregations/windows/order rules, expected results, or dialect. Inventing concrete SQL would fabricate the interview questions. The invalid Question remains explainable with `incomplete_or_unreadable`, while its generated long-tail baseline is archived and Canonical/ReviewProgress reachability is removed.'
          ]
          if '## Progress' not in t: t=t.rstrip()+'\n\n## Progress\n'
          for line in lines:
              if line not in t: t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during remediation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then echo 'No batch 0055 unrecoverable-source changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0055 source fragments'
          git push origin "HEAD:$CONTENT_BRANCH"
