name: Remediate Batch 0009 Followups

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/remediate-batch-0009-followups.yml

permissions:
  contents: write

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Normalize question-specific followups without changing approval state
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');

          const ids = {
            jvm: 'cq_jvm_oom_5adc3ce1',
            kafka: 'cq_kafka_duplicate_0a558c94',
          };
          const candidatePath = (id) => path.join('review', 'candidates', 'answers', `${id}.md`);
          const sha256 = (text) => crypto.createHash('sha256').update(text, 'utf8').digest('hex');

          function bumpMetadata(text, expectedId) {
            const match = text.match(/^<!--\s*xhs-answer:\s*(\{.*\})\s*-->/);
            if (!match) throw new Error(`missing answer metadata for ${expectedId}`);
            const meta = JSON.parse(match[1]);
            if (meta.canonical_id !== expectedId) throw new Error(`canonical mismatch for ${expectedId}`);
            if (meta.status !== 'draft' || meta.quality_tier !== 'candidate') {
              throw new Error(`refusing to mutate non-candidate ${expectedId}`);
            }
            meta.version = Number(meta.version || 0) + 1;
            meta.updated_at = '2026-08-18';
            return text.replace(match[0], `<!-- xhs-answer: ${JSON.stringify(meta)} -->`);
          }

          const jvmPath = candidatePath(ids.jvm);
          const kafkaPath = candidatePath(ids.kafka);
          const previous = {
            [ids.jvm]: sha256(fs.readFileSync(jvmPath, 'utf8')),
            [ids.kafka]: sha256(fs.readFileSync(kafkaPath, 'utf8')),
          };

          let jvm = fs.readFileSync(jvmPath, 'utf8');
          if (/\n## 常见追问\s*\n/.test(jvm)) throw new Error('JVM candidate already has a common-followup section; refusing ambiguous rewrite');
          const jvmFollowups = `## 常见追问

- 问：\`Java heap space\` 和容器 \`OOMKilled\` 怎么快速区分？答：先结合完整 OOM 文本、heap/GC 证据和容器事件判断资源域；Java heap OOM 重点看 live set、heap dump 与 GC，而容器 OOMKilled 还要对比进程 RSS、cgroup limit、NMT 和非 heap/native 占用，不能只看 \`-Xmx\`。
- 问：为什么 OOM 后不能第一时间只把 \`-Xmx\` 调大？答：如果是持续泄漏，扩 heap 只会推迟复发；如果是 native/thread/container 资源耗尽，增大 \`-Xmx\` 反而会挤压非 heap 余量。只有确认资源类型和增长模式后，容量调整才有意义。
- 问：什么时候适合直接执行 \`jcmd GC.heap_dump\`，什么时候应先摘流？答：heap dump 和 class histogram 都可能是高影响诊断，大堆上会带来明显停顿和磁盘压力；高流量或严格 SLO 场景应优先摘流/隔离实例，并尽量依赖事故前预配的 heap dump、JFR、GC 日志和 NMT 证据。
- 问：RSS 持续增长但 NMT 基本不涨，能否说明没有 native leak？答：不能。NMT 主要覆盖 HotSpot/JVM 自身 native memory，并不覆盖任意第三方 native/JNI 等全部分配；此时应继续结合 direct buffer、线程、OS/容器指标和第三方 native 证据缩小范围。

`;
          if (!jvm.includes('\n## 易错点\n')) throw new Error('JVM candidate missing 易错点 insertion anchor');
          jvm = jvm.replace('\n## 易错点\n', `\n${jvmFollowups}## 易错点\n`);
          jvm = bumpMetadata(jvm, ids.jvm);
          fs.writeFileSync(jvmPath, jvm, 'utf8');

          let kafka = fs.readFileSync(kafkaPath, 'utf8');
          const kafkaFollowups = `## 常见追问

- 问：把 \`enable.auto.commit\` 关掉就不会重复了吗？答：不会。它只把 offset 提交时机交给应用；业务成功到手工提交成功之间仍然有故障窗口。真正控制业务重复副作用的是幂等或同事务状态设计。
- 问：手动 \`commitSync()\` 比 \`commitAsync()\` 更安全吗？答：\`commitSync()\` 会等待成功、不可恢复错误或超时，边界更直观；\`commitAsync()\` 不阻塞，错误通过 callback 返回。二者都不能把外部数据库写与 Kafka offset 自动变成一个事务，也都不能替代幂等。
- 问：Kafka 开启 \`enable.idempotence=true\` 后，Consumer 就不会重复了吗？答：不是。idempotent producer 主要防止 producer retry 在 Kafka 日志里产生重复；consumer 在“业务完成但 offset 未提交”的故障窗口仍可能重新读取同一 record。
- 问：Kafka transaction 能不能保证 MySQL 只写一次？答：不能自动保证。Kafka transaction 能原子协调 Kafka records 与 consumer offsets；MySQL 是另一个事务域。对 MySQL 仍应使用唯一约束/inbox/outbox/条件更新等方案，或采用经过明确验证的跨系统事务架构。
- 问：Redis \`SETNX\` 能不能做消费幂等？答：低风险、短窗口场景可以作为辅助，但关键业务必须考虑 key 过期、淘汰、故障恢复和数据持久性。若 Redis 去重键比 Kafka 可重放窗口更早消失，旧消息一旦回放仍会重复执行。通常将去重记录和业务写放在同一数据库事务更容易得到强边界。
- 问：为什么并行消费后不能直接提交最大 offset？答：因为同 partition 内低 offset 可能仍未完成。如果 100 没完成而 101、102 完成后提交 103，实例崩溃后 100 会被跳过。必须提交“连续完成前缀”的下一 offset。
- 问：出现大量 duplicate-hit 是坏事吗？答：幂等命中本身说明保护生效，但突增通常是上游重复生产、consumer crash/rebalance、offset commit 失败或重放行为发生变化的信号。应把 duplicate-hit 当成观测指标，而不是静默吞掉后完全不管。

`;
          const sectionPattern = /\n## 常见追问\s*\n[\s\S]*?\n## 易错点\s*\n/;
          if (!sectionPattern.test(kafka)) throw new Error('Kafka candidate followup section not found');
          kafka = kafka.replace(sectionPattern, `\n${kafkaFollowups}## 易错点\n`);
          kafka = bumpMetadata(kafka, ids.kafka);
          fs.writeFileSync(kafkaPath, kafka, 'utf8');

          const genericPatterns = [
            /这道题最先要澄清什么/,
            /如何验证回答不是背诵/,
            /方案的主要代价是什么/,
            /题目继续追问源码或底层时怎么答/,
            /核心判断是什么/,
          ];
          function assertFollowups(id, text, minimum) {
            const match = text.match(/(?:^|\n)##\s+常见追问\s*\n([\s\S]*?)(?=\n##\s+|$)/);
            if (!match) throw new Error(`${id}: 常见追问 section missing`);
            const lines = match[1].split(/\r?\n/).filter((line) => /^-\s*问[：:]/.test(line));
            if (lines.length < minimum) throw new Error(`${id}: only ${lines.length} recognized followups`);
            if (lines.some((line) => genericPatterns.some((pattern) => pattern.test(line)))) {
              throw new Error(`${id}: generic followup remains`);
            }
            return lines.length;
          }

          const counts = {
            [ids.jvm]: assertFollowups(ids.jvm, jvm, 3),
            [ids.kafka]: assertFollowups(ids.kafka, kafka, 3),
          };
          const current = {
            [ids.jvm]: sha256(jvm),
            [ids.kafka]: sha256(kafka),
          };
          if (previous[ids.jvm] === current[ids.jvm] || previous[ids.kafka] === current[ids.kafka]) {
            throw new Error('candidate hash did not change after deterministic remediation');
          }

          const checkpointPath = path.join('review', 'content_build', 'answer_batch_0009', 'followup_remediation_checkpoint.json');
          fs.mkdirSync(path.dirname(checkpointPath), { recursive: true });
          fs.writeFileSync(checkpointPath, `${JSON.stringify({
            schema_version: 'xhs_followup_remediation_checkpoint.v1',
            recorded_at: '2026-08-18',
            finding: 'generic_followups/followups_not_question_specific',
            remediation_scope: 'format and question-specific followups only; no reviewer or human approval state changed',
            candidates: Object.fromEntries(Object.keys(current).map((id) => [id, {
              previous_candidate_sha256: previous[id],
              remediated_candidate_sha256: current[id],
              recognized_question_specific_followups: counts[id],
              fresh_isolated_source_first_rereview_required: true,
              evidence_rebind_required: true,
              human_review_required: true,
            }])),
          }, null, 2)}\n`, 'utf8');

          const taskPath = 'tasks/answer-batches/TASK-20260711-0313-answer-batch-0009.md';
          let task = fs.readFileSync(taskPath, 'utf8');
          const marker = '### Followup-format remediation checkpoint (2026-08-18)';
          if (!task.includes(marker)) {
            const block = [
              marker,
              '',
              `- \`${ids.jvm}\`: remediated deterministic \`generic_followups\` / \`followups_not_question_specific\` by adding ${counts[ids.jvm]} question-specific Q/A bullets; candidate changed from \`${previous[ids.jvm]}\` to \`${current[ids.jvm]}\`. The previous isolated review/evidence is now historical for the old bytes; a fresh fixed-SHA source-first re-review and evidence rebind are required before any deterministic evidence PASS or promotion.`,
              `- \`${ids.kafka}\`: normalized the existing seven substantive followups into the repository parser contract (\`- 问：...答：...\`) without changing their technical meaning; candidate changed from \`${previous[ids.kafka]}\` to \`${current[ids.kafka]}\`. The previous isolated review/evidence is now historical for the old bytes; a fresh fixed-SHA source-first re-review and evidence rebind are required before any deterministic evidence PASS or promotion.`,
              '- No pilot human approval, promotion, curated-ready status, or completion claim was created by this remediation.',
              '',
            ].join('\n');
            const completion = '\n## Completion\n';
            if (!task.includes(completion)) throw new Error('batch task Completion anchor missing');
            task = task.replace(completion, `\n${block}${completion}`);
            fs.writeFileSync(taskPath, task, 'utf8');
          }

          console.log(JSON.stringify({ previous, current, counts }, null, 2));
          NODE

      - name: Verify deterministic followup rule is closed on remediated bytes
        shell: bash
        run: |
          set -euo pipefail
          for id in cq_jvm_oom_5adc3ce1 cq_kafka_duplicate_0a558c94; do
            set +e
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/${id}.md" --noManifest > "$RUNNER_TEMP/${id}.audit.log" 2>&1
            code=$?
            set -e
            cat "$RUNNER_TEMP/${id}.audit.log"
            if grep -Eq 'generic_followups|followups_not_question_specific' "$RUNNER_TEMP/${id}.audit.log"; then
              echo "followup-format defect still present for ${id}" >&2
              exit 1
            fi
            echo "${id}: followup-format regression closed; audit exit=${code} (other stale-evidence/human gates may remain by design)"
          done
          git diff --check

      - name: Commit remediation and retire one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-completion-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git rm .github/workflows/remediate-batch-0009-followups.yml
          git add \
            review/candidates/answers/cq_jvm_oom_5adc3ce1.md \
            review/candidates/answers/cq_kafka_duplicate_0a558c94.md \
            review/content_build/answer_batch_0009/followup_remediation_checkpoint.json \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0009.md
          git diff --cached --check
          git commit -m "content: remediate batch 0009 followup audits"
          git push origin HEAD:content/quality-completion
