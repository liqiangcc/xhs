name: Review Content Batch 0031 Longest Common Substring Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0031-longest-common-substring-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0031-longest-common-substring-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_6f2552a802a396a84447c14cfd6e326f
  SOURCE_QID: 6f2552a802a396a84447c14cfd6e326f
  CANDIDATE_BLOB_SHA: 073f1245422d0f567d17e10923b82013b08358a8

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun independent oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0031/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node - <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const tagged=(JSON.parse(fs.readFileSync('note_tagged/68109f31000000002202d190.json','utf8')).tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tagged||tagged.original_question!=='算法：最长公共子串 (DP)'||tagged.question_type!=='算法手撕_Coding'||tagged.is_valid_for_library!==true) throw new Error('source drifted');
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cs=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const c=cs.find(x=>x.canonical_id===cid),q=qs.find(x=>x.question_id===qid);
          if(!c||!q||q.canonical_id!==cid||JSON.stringify(c.question_ids||[])!==JSON.stringify([qid])) throw new Error('Canonical ownership drifted');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['最长公共**子串**要求连续','dp[i][j] = dp[i-1][j-1] + 1','dp[i][j] = 0','j` 必须从右往左更新','最长公共子串和最长公共子序列差在哪','UTF-16 code unit','题源没给返回规则'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/transition\s*\(|按本题约束填写|ProblemSpec/.test(text)) throw new Error('placeholder/template residue detected');
          NODE
          javac "$out/LongestCommonSubstring.java" "$out/LongestCommonSubstringTest.java"
          test "$(java -cp "$out" LongestCommonSubstringTest)" = 'PASS fixed=6 random-oracle=3000 empty=yes no-match=yes repeated=yes tie=yes null=rejected compression=reverse-j'

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0031/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryPath=`${out}/source_boundary.json`,validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'empty string vs abc',expected:'length 0 and empty substring',actual:'pass',passed:true},
            {case:'abcdef vs zabcf',expected:'length 3 common substring',actual:'abc / length 3',passed:true},
            {case:'aaaa vs baaa',expected:'length 3 with repeated characters preserved',actual:'aaa / length 3',passed:true},
            {case:'3000 deterministic pairs over abc, lengths 0..7',expected:'compressed DP length equals direct brute-force oracle and returned text occurs in both inputs',actual:'all passed',passed:true}
          ];
          fs.writeFileSync(validationPath,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'javac LongestCommonSubstring.java LongestCommonSubstringTest.java && java LongestCommonSubstringTest',stdout:'PASS fixed=6 random-oracle=3000 empty=yes no-match=yes repeated=yes tie=yes null=rejected compression=reverse-j',checks:['empty input','no common substring','known common substring','repeated characters','identical strings','multiple equal maxima','null rejection','3000 direct brute-force oracle comparisons'],boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0031-longest-common-substring-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved source asks specifically for longest common substring using DP and contains no API, tie-break, Unicode model, input-size or project-history constraints.',
            'The candidate defines the DP as the common suffix ending at each pair of positions, so a match extends the diagonal state and a mismatch resets to zero; this is the required continuity invariant and is explicitly contrasted with longest common subsequence.',
            'The one-dimensional compression updates j from right to left, preserving the prior-row diagonal dependency instead of reading a value overwritten in the current row.',
            'The implementation is a complete compilable Java class, returns both a valid substring and its length, rejects null inputs explicitly and handles empty/no-match/repeated-character cases.',
            'A deterministic direct brute-force oracle agrees with the compressed DP on 3000 generated input pairs, while fixed cases cover boundaries and multiple optimal matches.',
            'The source does not define a tie-break or Unicode code-point model; the candidate states those boundaries rather than silently claiming one universal contract.',
            'No production performance data or personal project experience is fabricated; alternatives such as suffix automata are framed only as possible choices for different scale constraints.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0031.longest-common-substring.v1',decision:'pass',revision_round:0,source_packet:['note_tagged/68109f31000000002202d190.json',boundaryPath,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0031-longest-common-substring-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Tagged longest-common-substring DP question',locator:`note_tagged/68109f31000000002202d190.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Longest-common-substring direct brute-force oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Longest-common-substring independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source requires longest common substring with DP but does not specify an API, tie-break, Unicode character model, input bounds or project context.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','3 分钟版','关键细节','项目经验版']},{claim_id:'dp-invariant',text:'For longest common substring, an equal character pair extends the prior diagonal common suffix by one while a mismatch resets the ending-at-this-pair state to zero; the answer is the maximum over all ending pairs.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']},{claim_id:'compression',text:'The one-dimensional implementation updates j in descending order so dp[j-1] is still the prior-row diagonal state when read.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','关键细节','原理机制','常见追问']},{claim_id:'oracle-validation',text:'The compiled Java implementation passes fixed boundary cases and matches a direct brute-force longest-common-substring oracle on 3000 deterministic generated input pairs.',source_ids:['fixture','isolated-review'],answer_locations:['3 分钟版','原理机制']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac LongestCommonSubstring.java LongestCommonSubstringTest.java && java LongestCommonSubstringTest',result:'pass',reported_stdout:'PASS fixed=6 random-oracle=3000 empty=yes no-match=yes repeated=yes tie=yes null=rejected compression=reverse-j',checks:['fixed boundaries','direct brute-force oracle','null boundary','returned substring validity'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0031.longest-common-substring.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md';
          let text=fs.readFileSync(task,'utf8');
          const done='- [x] `cq_q_6f2552a802a396a84447c14cfd6e326f` candidate passed independent source-first review: the substring-vs-subsequence boundary is explicit, mismatch-to-zero and reverse-j compression invariants are correct, the standalone Java implementation passes fixed boundaries plus 3000 direct brute-force oracle cases, and unspecified tie/Unicode/project constraints are not fabricated. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(done)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+done+'\n');
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced during longest-common-substring review; discard local review and retry later."; exit 0; fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0031/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0031 longest-common-substring candidate'
          git push origin "HEAD:$CONTENT_BRANCH"