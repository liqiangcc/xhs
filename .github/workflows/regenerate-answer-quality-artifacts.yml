name: Regenerate Answer Quality Artifacts

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .type-audit-trigger

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Install corrected audit implementation
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/tmp/type-audit-code.b64 > "$RUNNER_TEMP/type-audit-code.tar.gz"
          echo "f30afe8a80ce0d8daeb3bd71104057009be13cb9c5a9f1f1e8142596b515685b  $RUNNER_TEMP/type-audit-code.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/type-audit-code.tar.gz" -C .

      - name: Regenerate answer quality artifacts
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/audit_answer_types.js
          node scripts/content/build_answer_rewrite_queue.js
          node scripts/content/select_answer_pilot.js
          node scripts/content/build_pilot_answer_audit.js
          node scripts/content/build_pilot_human_review_plan.js

      - name: Update task evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('tasks/TASK-20260711-0313-long-tail-answer-quality.md')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              'Validation: `node scripts/xhs.js answer type-audit --check --noWrite` -> passed (9,260 Canonical)',
              'Validation: `node scripts/xhs.js answer type-audit --check --noWrite` -> passed (9,035 Canonical)'
          )
          text = text.replace(
              'Notes: 基于面试输出预期判定主类型，并独立记录来源类型信号、次要覆盖要求和风险标记；结果为 Concept 2122、Mechanism 2354、Scenario 2369、Coding 1724、Project 383、Behavior 308，2,752 条带混合/覆盖风险供后续 split review。',
              'Notes: 2026-08-17 修复跨来源文本拼接、`MySQL` 被 `sql` 子串误判为 Coding、以及哈希/Bean/ClassPath 等技术“冲突”被误判为 Behavior 的系统性缺陷；逐来源保留信号并按面试产物 fail-closed 判定。最终结果为 Concept 3,569、Mechanism 2,555、Scenario 1,637、Coding 814、Project 324、Behavior 136；2,076 条带混合/覆盖风险供后续 split review。'
          )
          text = text.replace(
              'Validation: `node scripts/xhs.js answer queue check --noWrite` -> passed (9,036 rows, 904 batches, each ≤10); all retained boundary candidates have explicit keep_separate decisions',
              'Validation: `node scripts/xhs.js answer queue check --noWrite` -> passed (9,035 rows, 904 batches, each ≤10); all retained boundary candidates have explicit keep_separate decisions'
          )
          text = text.replace(
              'Notes: 已在边界清单清零（0 pending）后重建最终稳定队列；HTTP 与进程/线程同义题后续归并后再次重建：全部 9,036 个非 curated Canonical 被稳定排序并分配唯一可恢复任务，共 904 批，每批最多 10 题。首 60 题试点 Canonical ID 保持冻结，不以队列重新排序覆盖。队列只冻结执行顺序，不等价于答案晋级。',
              'Notes: 已在边界清单清零（0 pending）并完成 ZooKeeper 锁重复题簇归并后重建稳定队列：全部 9,035 个 Canonical 被稳定排序并分配唯一可恢复任务，共 904 批，每批最多 10 题。Project/Behavior 额外标记 `personal_fact_verification_required`，没有真实个人事实时不得晋级。队列只冻结执行顺序，不等价于答案晋级。'
          )
          text = text.replace(
              'Notes: 新增确定性 selector；每类选择 10 题，均至少包含 3 条历史精选审计失败样本，Coding 同时优先占位实现风险，Project/Behavior 同时优先真实材料/混合题风险。样本清单将作为首 60 题的 100% 人工审查范围。',
              'Notes: 2026-08-17 按纠正后的实际 answer_type 重新选择确定性试点；六类各 10 题，优先历史审计失败、占位实现和个人事实核验等硬失败风险。新清单保留旧试点 27 题、替换 33 题；`answer_pilot_set.json` 是当前唯一试点范围，旧候选与证据仍保留为仓库资产但不自动计入当前试点。'
          )
          text = text.replace(
              'Notes: 2026-07-11 已将 26 份独立审查通过、待人工签核的候选整理为 `review/plans/pilot_human_review.md`（提交 `680ce0df`），其中包含不可替代的 candidate SHA-256 与签核/晋级命令；尚未产生任何人工决定，子任务保持 pending。',
              'Notes: 2026-08-17 根据当前纠正后试点重新生成 `review/plans/pilot_human_review.md`；仅列出机器审计与独立审查均通过的 15 份候选，并绑定不可替代的 candidate SHA-256、签核格式和晋级命令。尚未产生任何人工决定，子任务保持 pending。'
          )

          marker = '##### `TASK-20260711-0313-long-tail-answer-quality-T05-S03` 校准并冻结 v1 流水线'
          ledger = (
              '\n试点重选记录（2026-08-17）：修复 answer_type 系统性误分类后，重新生成 60 题试点与台账。'
              '当前为 15/60 `awaiting_human_review`、36/60 `candidate_pending`、15/60 `independent_review_passed`、'
              '45/60 `independent_review_pending`、0/60 `human_review_approved`、0 promoted。'
              '旧试点中已经形成的候选、证据和审查结论继续作为对应 Canonical 的有效资产，但当前试点计数严格以最新 manifest 为准。\n\n'
          )
          if ledger.strip() not in text:
              text = text.replace(marker, ledger + marker)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Verify corrected classifier and pilot
        shell: bash
        run: |
          set -euo pipefail
          node --test test/answer_type_audit.test.js test/build_pilot_human_review_plan.test.js
          node scripts/content/audit_answer_types.js --check
          node scripts/content/build_answer_rewrite_queue.js --check
          node scripts/content/select_answer_pilot.js --check
          node scripts/content/build_pilot_answer_audit.js --check
          node scripts/content/build_pilot_human_review_plan.js --check
          node scripts/xhs.js answer queue check --set data/manifests/quality/answer_pilot_set.json --noWrite
          npm test
          npm run ci:check

      - name: Commit corrected content planning state
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git commit -m "content: correct answer types and rebuild the pilot"

      - name: Remove temporary regeneration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .type-audit-trigger \
            .github/workflows/regenerate-answer-quality-artifacts.yml \
            .github/tmp/type-audit-code.b64
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git commit -m "chore: remove temporary answer audit regeneration machinery"

      - name: Push content branch
        shell: bash
        run: git push origin HEAD:content/quality-completion
