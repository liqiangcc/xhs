name: Build Content Batch 0037 Find Duplicate Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0037-find-duplicate-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0037-find-duplicate-build
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_89e953556faafa29795282e6ba142542
  TAGGED_QID: 52857410214c1022e3f200d2f01f2bc2
  SOURCE_TAGGED: note_tagged/66c848ed000000001d0147df.json
  OFFICIAL_SOURCE: https://leetcode.com/problems/find-the-duplicate-number/

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Guard repository source and canonical boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),qid=process.env.TAGGED_QID,cid=process.env.CANONICAL_ID;
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：LeetCode 287 寻找重复数？';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('tagged source drift');
          const formal=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!formal.includes('"status":"needs_update"')||!formal.includes('"quality_tier":"long_tail_baseline"')) throw new Error('formal answer no longer baseline');
          if(!formal.includes(expected)) throw new Error('formal source locator drift');
          if(fs.existsSync(`review/candidates/answers/${cid}.md`)) throw new Error('candidate already exists');
          NODE
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!c.ok||c.canonical?.canonical_id!==process.env.CANONICAL_ID||c.answer_type!=='coding') throw new Error('canonical/type drift');
          const src=c.source_questions||[];
          if(src.length<1) throw new Error('canonical has no source questions');
          if(!src.some(x=>(x.original_question||'').includes('LeetCode 287')&&(x.original_question||'').includes('重复'))) throw new Error(`canonical source wording drift: ${JSON.stringify(src)}`);
          NODE

      - name: Write candidate and executable writer validation
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0037/$cid"; mkdir -p "$out" review/candidates/answers
          cat > "review/candidates/answers/$cid.md" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_89e953556faafa29795282e6ba142542","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # LeetCode 287：寻找重复数

          ## 核心结论

          仓库只保留题号与题名；按 LeetCode 287 当前官方题面，数组长度为 `n+1`、元素在 `[1,n]`，只有一个不同的重复值，要求不修改数组且只用常数额外空间。把 `i -> nums[i]` 看成函数图后，重复值对应从 `nums[0]` 出发路径的环入口，因此用 Floyd 快慢指针可在 O(n) 时间、O(1) 额外空间内返回它。

          ## 1 分钟版

          - 值域 `[1,n]` 让数组值可以继续作为合法下标，数组天然形成单后继函数图。
          - 重复值有多个前驱；从 `nums[0]` 出发会形成“链 + 环”，环入口就是重复值。
          - 第一阶段 slow 走一步、fast 走两步直到环内相遇；第二阶段另一个指针回到 `nums[0]`，两者同速走，在入口再次相遇。
          - 不改数组，只维护 3 个整数指针，所以时间 O(n)、额外空间 O(1)。

          ## 3 分钟版

          ```java
          public final class Solution {
              public int findDuplicate(int[] nums) {
                  int slow = nums[0];
                  int fast = nums[0];
                  do {
                      slow = nums[slow];
                      fast = nums[nums[fast]];
                  } while (slow != fast);

                  int finder = nums[0];
                  while (finder != slow) {
                      finder = nums[finder];
                      slow = nums[slow];
                  }
                  return finder;
              }
          }
          ```

          官方约束保证每次下一跳都在合法范围内。第一阶段只保证找到环内相遇点；设起点到入口距离为 μ、环长为 λ，Floyd 相遇时的距离关系在模 λ 下成立，因此第二阶段让一个指针回到路径起点后，两者同速走会在入口汇合。

          ## 关键细节

          - `HashSet` 能判重，但需要 O(n) 额外空间，不满足题目要求。
          - 排序通常会修改原数组；复制后排序又需要 O(n) 额外空间。
          - 重复值可以出现两次以上，`[3,3,3,3,3]` 也应返回 `3`。
          - 返回的是重复“值”，不是某次重复出现的数组位置。
          - 空数组、越界值或多个不同重复值超出 LeetCode 287 的输入契约，正式算法无需重新定义这些非法输入的结果。
          - 两阶段总步数线性，额外状态只有 `slow/fast/finder`，所以 O(n) 时间、O(1) 额外空间。

          ## 原理机制

          把位置当节点、`nums[i]` 当有向边。因为所有值都落在 `1..n`，从 `nums[0]` 开始会一直在有限节点集合里跳转并最终进入环。重复值 `d` 至少有两个不同前驱；在这道题的单重复值约束下，可达路径的合流点就是环入口。Floyd 利用快指针相对慢指针每轮多走一步保证环内相遇，再利用路径长度与环长的同余关系定位入口。

          ## 项目经验版

          来源没有真实项目经历，不能虚构“线上使用 Floyd”。项目映射时只把它当成“受限单后继状态空间的环入口检测”技巧；一般业务判重更常见的是唯一索引、集合或排序，是否能套 Floyd 取决于是否真的存在可索引的单后继状态和同样的输入契约。

          ## 常见追问

          - 问：为什么重复数一定存在？答：`n+1` 个元素只能取 `[1,n]` 的 `n` 个值，由抽屉原理至少有重复；官方题面进一步保证只有一个不同的重复值。
          - 问：为什么环入口是重复值？答：重复值有多个前驱，函数图从起点的可达路径在这里合流并进入环；该题的单重复值约束把入口唯一绑定到这个值。
          - 问：为什么第二阶段能定位入口？答：设链长 μ、环长 λ，第一阶段相遇时慢指针行程与 μ 的差是 λ 的整数倍意义下的同余；从起点和相遇点各走 μ 步会同时到入口。
          - 问：二分计数可以吗？答：可以按值域统计 `<= mid` 的数量并用抽屉原理缩小区间，不修改数组且 O(1) 空间，但通常是 O(n log n)；Floyd 达到线性时间。
          - 问：为什么不能简单用求和差？答：重复值允许出现两次以上，可能同时缺少多个值，简单的“数组和减去 1..n 的和”不能唯一推出重复值，还要面对整数溢出。

          ## 易错点

          - 使用 `HashSet` 后仍把额外空间写成 O(1)。
          - 默认重复值恰好只出现两次。
          - 只背快慢指针代码，却解释不了数组为什么能映射成环、入口为什么等于重复值。
          - 第二阶段随意从下标 0 开始而不保持同一函数图路径起点，也没有重新证明距离关系。
          - 把题面契约外的非法输入处理当作本题必需逻辑。
          EOF

          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('int findDuplicate(int[] nums)')) throw new Error('complete Java implementation missing');
          fs.writeFileSync(`review/content_build/answer_batch_0037/${cid}/Solution.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/FindDuplicateWriterTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          import java.util.Random;

          public final class FindDuplicateWriterTest {
              public static void main(String[] args) {
                  Solution s=new Solution();
                  check(s,new int[]{1,3,4,2,2},2);
                  check(s,new int[]{3,1,3,4,2},3);
                  check(s,new int[]{3,3,3,3,3},3);
                  check(s,new int[]{1,1},1);
                  check(s,new int[]{2,1,2},2);
                  Random r=new Random(0x287L);
                  int cases=0;
                  for(int n=2;n<=120;n++) for(int round=0;round<20;round++) {
                      int duplicate=1+r.nextInt(n);
                      List<Integer> values=new ArrayList<>();
                      for(int v=1;v<=n;v++) values.add(v);
                      values.add(duplicate);
                      Collections.shuffle(values,r);
                      int[] nums=values.stream().mapToInt(Integer::intValue).toArray();
                      int[] before=nums.clone();
                      check(s,nums,duplicate);
                      if(!java.util.Arrays.equals(nums,before)) throw new AssertionError("input mutated");
                      cases++;
                  }
                  System.out.printf("PASS official_examples=3 boundaries=2 random_valid_cases=%d input_unchanged=pass multi_occurrence=pass%n",cases);
              }
              private static void check(Solution s,int[] nums,int expected) {
                  int actual=s.findDuplicate(nums);
                  if(actual!=expected) throw new AssertionError("actual="+actual+" expected="+expected+" nums="+java.util.Arrays.toString(nums));
              }
          }
          JAVA
          (cd "$out" && javac -Xlint:all -Werror Solution.java FindDuplicateWriterTest.java && java FindDuplicateWriterTest > writer_stdout.txt)
          stdout="$(cat "$out/writer_stdout.txt")"
          test "$stdout" = 'PASS official_examples=3 boundaries=2 random_valid_cases=2380 input_unchanged=pass multi_occurrence=pass'

          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          const sourceIds=(ctx.source_questions||[]).map(x=>x.question_id);
          fs.writeFileSync(`${out}/writer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:hash,result:'pass',validated_at:date,command:'javac -Xlint:all -Werror; execute examples, boundaries and 2380 seeded valid cases',stdout:process.env.STDOUT,checks:['official examples','small boundaries','multi-occurrence duplicate','2380 seeded valid arrays','input unchanged']},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Repository tagged LeetCode 287 interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'leetcode-287',title:'LeetCode 287 Find the Duplicate Number',locator:process.env.OFFICIAL_SOURCE,source_type:'official_documentation',checked_at:date},{source_id:'writer-validation',title:'Writer executable Floyd validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'official-contract',text:'LeetCode 287 defines n+1 integers in [1,n], one distinct repeated number, no input modification and constant extra space.',source_ids:['repository-source','leetcode-287'],answer_locations:['核心结论','1 分钟版','关键细节']},{claim_id:'floyd-behavior',text:'The exact candidate implementation returns the duplicate without mutation across examples, multi-occurrence and seeded valid cases.',source_ids:['writer-validation'],answer_locations:['3 分钟版','原理机制','关键细节']},{claim_id:'complexity',text:'The implementation maintains only a constant number of integer pointers and linear pointer advancement.',source_ids:['writer-validation'],answer_locations:['1 分钟版','关键细节']}],source_question_coverage:sourceIds.map(question_id=>({question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制','常见追问']})),promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

      - name: Record bounded progress and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_89e953556faafa29795282e6ba142542` LeetCode 287 candidate is bounded to the preserved repository question plus the official problem contract, contains a complete Floyd cycle-entry Java solution, and passes examples/boundaries/multi-occurrence plus 2380 seeded writer cases without mutation. Writer evidence is frozen; isolated source-first review remains pending.';
          if(!text.includes('`cq_q_89e953556faafa29795282e6ba142542` LeetCode 287 candidate')) text=text.trimEnd()+'\n'+note+'\n';
          fs.writeFileSync(task,text);
          NODE
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0037/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md
          git commit -m 'content: stage batch 0037 LeetCode 287 candidate'
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = "${{ steps.base.outputs.head }}" || { echo 'content branch moved during build'; exit 1; }
          git push origin HEAD:"$CONTENT_BRANCH"
