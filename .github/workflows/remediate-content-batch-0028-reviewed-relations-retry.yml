name: Remediate Content Batch 0028 Reviewed Relations Retry

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0028-reviewed-relations-retry.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0028-reviewed-relations
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply only the frozen reviewed relations through Application
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { createApplication } = require('./src/bootstrap/create-application');

          const root = process.cwd();
          const app = createApplication({ root });
          const specs = [
            {
              name: 'linked_list_reversal',
              sourceQid: '5d39b5ae05a488c7436cbfa9b21e746c',
              targetQid: '55c3a35aaf4f76ce9aab78ea39d9fddc',
              relation: 'same',
              canonicalId: 'cq_q_55c3a35aaf4f76ce9aab78ea39d9fddc',
              canonicalTitle: '算法：链表翻转。',
              rationale: 'Source-first batch 0028 review found one linked-list reversal answer boundary with no distinct source constraint; preserve the already source-qualified batch 0027 Canonical.',
            },
            {
              name: 'deep_copy_implementation_vs_concept',
              sourceQid: '5e21e188af5c4a9ffdb5eaf97cc39c97',
              targetQid: 'a156953489b7a1383bb2383470b3ad9f',
              relation: 'related',
              rationale: 'Source-first batch 0028 review found deep-copy implementation and shallow-versus-deep-copy concept related but response-contract distinct; keep the Coding Canonical separate.',
            },
            {
              name: 'big_number_addition_split_child',
              sourceQid: '37b2536da54c5df189dbb86c55a6bfa3',
              targetQid: '9ec87353b1ab16d78a9ddee336ca797c',
              relation: 'same',
              canonicalId: 'cq_topic_cc39dcdb',
              canonicalTitle: '算法：字符串大数加法',
              rationale: 'Source-first batch 0028 review found one decimal-string-addition Coding boundary; preserve the recovered empty-string-as-zero source variant and invalidate stale survivor answer/review state for rebuild.',
            },
          ];

          const questionRows = () => fs.readFileSync(path.join(root, 'data/questions/questions.jsonl'), 'utf8')
            .split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicalRows = () => fs.readFileSync(path.join(root, 'data/questions/canonical_questions.jsonl'), 'utf8')
            .split(/\r?\n/).filter(Boolean).map(JSON.parse);

          function ownership() {
            return {
              byQid: new Map(questionRows().map((row) => [row.question_id, row])),
              byCid: new Map(canonicalRows().map((row) => [row.canonical_id, row])),
            };
          }

          (async () => {
            const before = ownership();
            const exact = [
              ['5d39b5ae05a488c7436cbfa9b21e746c', 'cq_q_5d39b5ae05a488c7436cbfa9b21e746c'],
              ['5e21e188af5c4a9ffdb5eaf97cc39c97', 'cq_q_5e21e188af5c4a9ffdb5eaf97cc39c97'],
              ['37b2536da54c5df189dbb86c55a6bfa3', 'cq_q_37b2536da54c5df189dbb86c55a6bfa3'],
            ];
            for (const [qid, cid] of exact) {
              if (before.byQid.get(qid)?.canonical_id !== cid || !before.byCid.has(cid)) {
                throw new Error(`preflight ownership drift for ${qid}: expected ${cid}`);
              }
            }

            const results = {};
            for (const spec of specs) {
              const suggested = await app.dedup.suggest({ mode: 'pair', question_ids: [spec.sourceQid, spec.targetQid] });
              if (!Array.isArray(suggested.relation_candidates) || suggested.relation_candidates.length !== 1) {
                throw new Error(`${spec.name}: expected exactly one fresh RelationCandidate`);
              }
              const candidate = suggested.relation_candidates[0];
              const actual = [...candidate.question_ids].sort();
              const expected = [spec.sourceQid, spec.targetQid].sort();
              if (JSON.stringify(actual) !== JSON.stringify(expected)) {
                throw new Error(`${spec.name}: fresh candidate Question set drifted`);
              }
              const decision = await app.dedup.recordDecision({
                relation_candidate_key: candidate.relation_candidate_key,
                relation: spec.relation,
                actor: {
                  type: 'ai',
                  id: 'batch-0028-source-first-relation-review',
                  display_name: 'Batch 0028 source-first relation reviewer',
                },
                rationale: spec.rationale,
              });
              const applied = await app.dedup.applyDecision({
                relation_candidate_key: candidate.relation_candidate_key,
                ...(spec.relation === 'same' ? {
                  canonical_id: spec.canonicalId,
                  canonical_title: spec.canonicalTitle,
                } : {}),
              });
              results[spec.name] = { suggested, decision, applied };
            }

            const after = ownership();
            const expectedMerged = [
              ['5d39b5ae05a488c7436cbfa9b21e746c', 'cq_q_55c3a35aaf4f76ce9aab78ea39d9fddc', 'cq_q_5d39b5ae05a488c7436cbfa9b21e746c'],
              ['37b2536da54c5df189dbb86c55a6bfa3', 'cq_topic_cc39dcdb', 'cq_q_37b2536da54c5df189dbb86c55a6bfa3'],
            ];
            for (const [qid, survivor, retired] of expectedMerged) {
              if (after.byQid.get(qid)?.canonical_id !== survivor) throw new Error(`${qid}: survivor ownership mismatch`);
              if (after.byCid.has(retired)) throw new Error(`${retired}: duplicate Canonical was not retired`);
            }
            const deepQid = '5e21e188af5c4a9ffdb5eaf97cc39c97';
            const deepCid = 'cq_q_5e21e188af5c4a9ffdb5eaf97cc39c97';
            if (after.byQid.get(deepQid)?.canonical_id !== deepCid || !after.byCid.has(deepCid)) {
              throw new Error('related deep-copy Coding Canonical mutated unexpectedly');
            }

            const dir = path.join(root, 'review/content_build/answer_batch_0028');
            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path.join(dir, 'relation_apply_results.json'), JSON.stringify({
              schema_version: 'answer_batch_0028_relation_apply_results.v1',
              results,
            }, null, 2) + '\n');
            fs.writeFileSync(path.join(dir, 'relation_apply.md'), [
              '# Answer Batch 0028 — Reviewed Relation Application',
              '',
              'This execution materializes only relationships already concluded by the source-first `relation_review.md`. Each RelationCandidate was regenerated from current repository facts immediately before the explicit AI Decision and Application apply step.',
              '',
              '- Linked-list reversal: `same`; duplicate source Canonical retired into `cq_q_55c3a35aaf4f76ce9aab78ea39d9fddc`.',
              '- Deep-copy implementation vs concept: `related`; relation-only apply; Coding Canonical remains separate.',
              '- Big-number string addition split child: `same`; duplicate source Canonical retired into `cq_topic_cc39dcdb`; survivor answer/review state is intentionally stale until rebuilt against the empty-string-as-zero source variant.',
              '- Student/grade average SQL split child is not part of this mutation slice; fresh discovery/review is recorded separately and retains it as a distinct Canonical.',
              '',
            ].join('\n'));
          })().catch((error) => {
            console.error(error.stack || error.message);
            process.exitCode = 1;
          });
          NODE

      - name: Refresh derived answer-type manifest after Canonical consolidation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify exact content invariants and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only if the reviewed source head stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during reviewed relation apply: $base_head -> $remote_head"
            echo 'Discarding verified local mutation; a later run can retry on the newer source state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then
            echo 'Reviewed relation slice already applied.'
            exit 0
          fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'content: apply batch 0028 reviewed relations'
          git push origin "HEAD:$CONTENT_BRANCH"
