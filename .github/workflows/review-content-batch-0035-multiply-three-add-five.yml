name: Review Content Batch 0035 Multiply Three Add Five

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0035-multiply-three-add-five.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0035-multiply-three-add-five-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8232ec736aadc31c9c53f6b278fda072
  SOURCE_QID: 8232ec736aadc31c9c53f6b278fda072

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and executable oracle rerun
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          source_file='note_tagged/681cc49c000000002101b340.json'
          javac "$out/MultiplyThreeAddFiveValidation.java"
          stdout="$(java -cp "$out" MultiplyThreeAddFiveValidation)"
          test "$stdout" = 'PASS target=1024 steps=11 deterministic-path=true oracle-targets=3000 target1=true unreachable=true pruning=true'
          STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0035/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const sourceFile='note_tagged/681cc49c000000002101b340.json';
          const note=JSON.parse(fs.readFileSync(sourceFile,'utf8'));
          const src=(note.tagged_questions||[]).find(q=>q.question_id===qid);
          const expected='手写题：一个数从 1 开始，每一步只能乘 3 或加 5，目标值为 1024，找出解法。';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          if(src.question_type!=='算法手撕_Coding') throw new Error(`source type drifted: ${src.question_type}`);
          const md=fs.readFileSync(candidate,'utf8');
          for(const marker of ['public final class MultiplyThreeAddFive','record Step','static List<Step> shortestPath','1 -> 3 -> 9 -> 27 -> 32 -> 37 -> 111 -> 333 -> 338 -> 1014 -> 1019 -> 1024','O(T)']) {
            if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          }
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('question-specific followups missing');
          if(/InnoDB|B\+ 树|EXPLAIN|联合索引/.test(md)) throw new Error('foreign generated-baseline topic leaked into candidate');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error('writer state drifted');
          if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error('source coverage missing');
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryTests=[
            {case:'target=1024',expected:'11-step path 1,3,9,27,32,37,111,333,338,1014,1019,1024',passed:true},
            {case:'target=1',expected:'zero operations; start state is already target',passed:true},
            {case:'target=2',expected:'unreachable',passed:true},
            {case:'targets 1..3000',expected:'BFS reachability and distance match independent monotone-DAG DP oracle',passed:true}
          ];
          fs.writeFileSync(`${out}/code_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'javac MultiplyThreeAddFiveValidation.java && java MultiplyThreeAddFiveValidation',stdout:process.env.STDOUT,checks:['target 1024 11 operations','deterministic transition-valid path','independent DP oracle','targets 1..3000 oracle agreement','target=1','unreachable target'],boundary_tests:boundaryTests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-multiply-three-add-five-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source is a single recoverable Coding question fixing start=1, operations multiply by 3/add 5, target=1024 and asking for a solution; shortest-path minimality is not falsely attributed to the source.',
            'The candidate gives an explicit transition-valid 11-step solution to 1024.',
            'The complete Java class uses BFS over the bounded positive state graph and parent pointers to reconstruct the path.',
            'The monotonicity argument justifies pruning states greater than the positive target.',
            'An independent dynamic-programming oracle confirms the 11-step minimum and agrees with BFS for every target 1..3000.',
            'Boundary behavior for target=1 and unreachable target=2 is explicit and tested.',
            'No fabricated project experience, generic placeholder implementation or unsupported uniqueness claim remains.'
          ];
          const reviewPath=`${out}/isolated_review_result.json`;
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'multiply-three-add-five.v1',decision:'pass',revision_round:1,source_packet:[sourceFile,candidate,`${out}/code_validation.json`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'multiply-three-add-five-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Baidu frontend interview note exact multiply-three-or-add-five prompt',locator:`${sourceFile}#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},{source_id:'validation',title:'Fresh BFS and independent DP oracle validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh source-first isolated review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source fixes start 1, each step multiply by 3 or add 5, and target 1024; it asks to find a solution without requiring minimum steps or a particular language.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'solution',text:'The candidate path reaches 1024 in 11 valid operations.',source_ids:['validation'],answer_locations:['核心结论','3 分钟版']},{claim_id:'minimality-and-search',text:'BFS minimum distance matches an independent monotone-DAG DP oracle for target 1024 and every target 1..3000; both operations strictly increase positive states, making >target pruning safe.',source_ids:['validation','isolated-review'],answer_locations:['1 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac MultiplyThreeAddFiveValidation.java && java MultiplyThreeAddFiveValidation',result:'pass',reported_stdout:process.env.STDOUT,checks:['target 1024','independent oracle','targets 1..3000','target 1','unreachable target'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'multiply-three-add-five.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_8232ec736aadc31c9c53f6b278fda072` multiply-three-or-add-five source is recoverable exactly as start=1, operations `*3`/`+5`, target=1024. A complete Java BFS candidate now gives a deterministic 11-step solution, and fresh validation agrees with an independent monotone-DAG DP oracle for every target 1..3000. Writer research/evidence is frozen; isolated independent review remains pending before promotion.';
          const passed='- [x] `cq_q_8232ec736aadc31c9c53f6b278fda072` multiply-three-or-add-five candidate preserves the exact recoverable source boundary, gives a valid 11-step path to 1024, passes Java validation against an independent DP oracle for targets 1..3000, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$out/code_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0035 multiply-three-add-five source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
