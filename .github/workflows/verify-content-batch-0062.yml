name: Verify Content Batch 0062

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/verify-content-batch-0062.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-content-batch-0062
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0062'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Verify all Batch 0062 candidate evidence and code gates
        shell: bash
        run: |
          set -euo pipefail
          coding_ids=(
            cq_q_61d48051e02806afb811f793afd4a269
            cq_q_6a7c7f58ad4a4828e2c984b668d7ba32
            cq_q_6c5a986936f3d831fd8dc544ccd71910
            cq_q_9e1c6fe7d0d269300c71151cd8c24a81
            cq_q_ad98fcd2a28e860ad42d11065af2caea
            cq_q_d0b70d126320ddd7e4a234f0f3c6066f
            cq_q_e1cbd1e9e8df435dfb30e81ea69018c8
            cq_q_ffe5f2da4a3ce9f56c51bce699ab1b13
            cq_q_00bc3ebd89c0d03aae8db0a36cd747e2
          )
          scenario_ids=(
            cq_q_004333ab8f1c0f22014765e4e6f7abb0
          )
          for cid in "${coding_ids[@]}"; do
            test -f "review/content_build/answer_batch_0062/$cid/isolated_review_result.json"
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/$cid.md" --require-evidence --require-code --noWrite --noDraftCheck
          done
          for cid in "${scenario_ids[@]}"; do
            test -f "review/content_build/answer_batch_0062/$cid/isolated_review_result.json"
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/$cid.md" --require-evidence --noWrite --noDraftCheck
          done

      - name: Verify repository invariants required by Batch 0062
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          npm run ci:answer:code

      - name: Record deterministic Batch 0062 machine verification
        shell: bash
        env:
          BASE_HEAD: ${{ steps.base.outputs.head }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          batch = '0062'
          ids = [
              'cq_q_61d48051e02806afb811f793afd4a269',
              'cq_q_6a7c7f58ad4a4828e2c984b668d7ba32',
              'cq_q_6c5a986936f3d831fd8dc544ccd71910',
              'cq_q_9e1c6fe7d0d269300c71151cd8c24a81',
              'cq_q_ad98fcd2a28e860ad42d11065af2caea',
              'cq_q_d0b70d126320ddd7e4a234f0f3c6066f',
              'cq_q_e1cbd1e9e8df435dfb30e81ea69018c8',
              'cq_q_ffe5f2da4a3ce9f56c51bce699ab1b13',
              'cq_q_004333ab8f1c0f22014765e4e6f7abb0',
              'cq_q_00bc3ebd89c0d03aae8db0a36cd747e2',
          ]
          reviews = {}
          for cid in ids:
              p = Path(f'review/content_build/answer_batch_{batch}/{cid}/isolated_review_result.json')
              data = json.loads(p.read_text(encoding='utf-8'))
              if data.get('decision') != 'pass':
                  raise SystemExit(f'{cid}: isolated review is not PASS')
              reviews[cid] = {
                  'decision': data['decision'],
                  'candidate_sha256': data.get('candidate_sha256'),
                  'promotion_blockers': data.get('promotion_blockers', []),
              }

          out = Path(f'review/content_build/answer_batch_{batch}/batch_machine_verification.json')
          out.write_text(json.dumps({
              'schema_version': 'answer_batch_machine_verification.v1',
              'batch': batch,
              'verified_at': datetime.now(timezone.utc).isoformat().replace('+00:00', 'Z'),
              'verified_content_head': os.environ['BASE_HEAD'],
              'candidate_count': len(ids),
              'candidate_audit_require_evidence': 'pass',
              'coding_candidate_audit_require_code': 'pass',
              'isolated_review_decisions': 'all_pass',
              'canonical_check': 'pass',
              'review_integrity': 'pass',
              'answer_validate_strict': 'pass',
              'ci_answer_code': 'pass',
              'reviews': reviews,
              'remaining_gate': 'required_human_approval_and_real_review_policy',
              'promotion_performed': False,
          }, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          task = Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0062.md')
          text = task.read_text(encoding='utf-8')
          text = text.replace('- [ ] Every candidate passes `answer audit --require-evidence`.', '- [x] Every candidate passes `answer audit --require-evidence`.', 1)
          text = text.replace('- [ ] `answer validate --strict`, `canonical check`, and applicable code tests pass.', '- [x] `answer validate --strict`, `canonical check`, and applicable code tests pass.', 1)
          note = ('- [x] Batch 0062 deterministic machine completion gates revalidated at the frozen content HEAD recorded in '
                  '`review/content_build/answer_batch_0062/batch_machine_verification.json`: all 10 candidate evidence audits pass; '
                  'all 9 Coding candidates pass the code-required audit; all 10 isolated review decisions are PASS; '
                  '`canonical check`, `review integrity`, strict answer validation and the repository answer-code CI gate pass. '
                  'No promotion is performed because required human approval / real-review policy remains unsatisfied.')
          if note not in text:
              text = text.rstrip() + '\n' + note + '\n'
          task.write_text(text, encoding='utf-8')
          PY

      - name: Commit verification only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0062 verification: $base_head -> $remote_head"
            echo 'Discard verification record and retry against the new state.'
            exit 0
          fi
          git add \
            review/content_build/answer_batch_0062/batch_machine_verification.json \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0062.md
          if git diff --cached --quiet; then
            echo 'No Batch 0062 verification changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-verification-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: verify batch 0062 machine gates'
          git push origin "HEAD:$CONTENT_BRANCH"
