name: Automation Short Video Audit

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/automation-pilot-context.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0
      - name: Fast-forward to latest branch state
        run: git pull --ff-only origin content/quality-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit short-video candidate and refresh pilot ledger
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/reports
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_short_video_bcbcf234.md \
            --require-evidence --noWrite --noManifest \
            | tee review/reports/AUTOMATION_SHORT_VIDEO_AUDIT.txt
          node scripts/content/build_pilot_answer_audit.js
          node scripts/content/build_pilot_answer_audit.js --check
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage
      - name: Commit validated pilot ledger
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data/manifests/quality/pilot_answer_audit.json review/reports/AUTOMATION_SHORT_VIDEO_AUDIT.txt
          if git diff --cached --quiet; then
            echo "No validated ledger changes."
            exit 0
          fi
          git commit -m "content: validate short-video pilot candidate"
          git push origin HEAD:content/quality-completion
