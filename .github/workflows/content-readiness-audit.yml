name: Content Readiness Audit

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .content-readiness-audit-trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit answer/evidence/review readiness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const answerDir = path.join(root, 'review', 'answers');
          const evidenceDir = path.join(root, 'review', 'evidence');
          const candidateDir = path.join(root, 'review', 'candidates', 'answers');
          const auditDir = path.join(root, 'review', 'candidates', 'audits');
          const progressPath = path.join(root, 'review', 'progress.json');

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(p)); else out.push(p);
            }
            return out;
          }
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file,'utf8')); } catch { return null; }
          }
          function meta(text) {
            const m = (text.split(/\r?\n/,1)[0] || '').match(/<!--\s*xhs-answer:\s*(\{.*\})\s*-->/);
            if (!m) return null;
            try { return JSON.parse(m[1]); } catch { return null; }
          }

          const answers = walk(answerDir).filter(f => f.endsWith('.md') && !f.split(path.sep).includes('archive') && !f.split(path.sep).includes('archived'));
          const status = {}, tiers = {};
          const placeholders = [], suspiciousClaims = [];
          let evidenceCount = 0, pass=0, revise=0, reject=0, missingEvidence=0;
          let humanApproved=0, humanRejected=0, humanMissing=0;
          for (const file of answers) {
            const text = fs.readFileSync(file,'utf8');
            const m = meta(text) || {};
            const id = m.canonical_id || path.basename(file,'.md');
            status[m.status || 'missing'] = (status[m.status || 'missing'] || 0) + 1;
            tiers[m.quality_tier || 'missing'] = (tiers[m.quality_tier || 'missing'] || 0) + 1;
            const body = text.replace(/^<!--[^\n]*-->\s*/, '');
            if (/(?:TODO|TBD|待补充|占位(?!符)|请补充|\[填写|\{\{)/i.test(body)) placeholders.push(id);
            if (/(我在|我负责|我们项目|线上事故|最终提升|最终降低)/.test(text) && !/(项目映射|示例|模板|按真实经历|不要虚构|需替换|可结合)/.test(text)) suspiciousClaims.push(id);
            const ep = path.join(evidenceDir, `${id}.json`);
            if (!fs.existsSync(ep)) { missingEvidence++; continue; }
            evidenceCount++;
            const ev = readJson(ep);
            if (!ev) continue;
            const decision = ev.review && ev.review.decision;
            if (decision === 'pass') pass++; else if (decision === 'revise') revise++; else if (decision === 'reject') reject++;
            const hr = ev.human_review;
            if (hr && hr.reviewer_type === 'human' && hr.decision === 'approved') humanApproved++;
            else if (hr && hr.reviewer_type === 'human' && hr.decision === 'rejected') humanRejected++;
            else humanMissing++;
          }

          const candidateFiles = walk(candidateDir).filter(f => f.endsWith('.md'));
          const auditFiles = walk(auditDir).filter(f => f.endsWith('.json'));
          let auditPass=0, auditFail=0;
          const failedAuditIds=[];
          for (const file of auditFiles) {
            const row = readJson(file);
            if (!row) continue;
            if (row.ok === true) auditPass++;
            else { auditFail++; failedAuditIds.push(row.canonical_id || path.basename(file,'.json')); }
          }

          const progress = readJson(progressPath) || {};
          const progressItems = Array.isArray(progress) ? progress : (Array.isArray(progress.items) ? progress.items : []);
          const reviewedItems = progressItems.filter(item => Number(item && item.review_count || 0) > 0);
          const totalReviewMarks = reviewedItems.reduce((sum,item)=>sum+Number(item.review_count||0),0);
          const results = {};
          for (const item of reviewedItems) {
            const key = item.status || 'unknown';
            results[key] = (results[key] || 0) + 1;
          }

          const result = {
            answer_count: answers.length,
            status,
            quality_tier: tiers,
            evidence_count: evidenceCount,
            missing_evidence_count: missingEvidence,
            independent_review_decisions: {pass, revise, reject},
            human_review: {approved: humanApproved, rejected: humanRejected, missing_or_not_human: humanMissing},
            candidates: {answer_files: candidateFiles.length, audit_files: auditFiles.length, audit_pass: auditPass, audit_fail: auditFail, failed_ids: failedAuditIds.slice(0,100)},
            review_progress: {record_count: progressItems.length, reviewed_canonical_count: reviewedItems.length, total_review_marks: totalReviewMarks, reviewed_statuses: results},
            placeholder_count_excluding_technical_placeholder_word: placeholders.length,
            placeholder_ids: placeholders,
            suspicious_personal_claim_count: suspiciousClaims.length,
            suspicious_personal_claim_ids: suspiciousClaims,
          };
          console.log('CONTENT_READINESS_AUDIT=' + JSON.stringify(result));
          NODE

      - name: Regression-check final source-first review rules
        shell: bash
        run: |
          set +e
          AUDITED_SHA="$(git rev-parse HEAD)" node scripts/audit/final_content_source_first_review.js > "$RUNNER_TEMP/final-review-regression.log" 2>&1
          REVIEW_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/final-review-regression.log"
          test "$REVIEW_EXIT" = "2"
          node <<'NODE'
          const report = require('./review/reports/FINAL_SOURCE_FIRST_REVIEW.json');
          const answerFinding = report.findings.find((row) => row.code === 'ANSWER_NOT_COMPLETE');
          if (!answerFinding) throw new Error('expected ANSWER_NOT_COMPLETE while answers are not ready');
          if ((answerFinding.evidence.by_defect || {}).placeholder) throw new Error('technical placeholder wording is still misclassified');
          if (report.findings.some((row) => row.code === 'UNVERIFIED_PERSONAL_CLAIMS')) throw new Error('explicit behavior evidence boundary is still misclassified');
          if (report.findings.some((row) => row.code === 'REAL_REVIEW_VALIDATION_INCOMPLETE')) throw new Error('real review validation should satisfy the current SSOT gate');
          if (report.metrics.reviewed_canonical_count < 5 || report.metrics.total_review_marks < 10) throw new Error('real review metrics are below the SSOT threshold');
          console.log(JSON.stringify({
            regression_ok: true,
            reviewed_canonical_count: report.metrics.reviewed_canonical_count,
            total_review_marks: report.metrics.total_review_marks,
            answer_defects: answerFinding.evidence.by_defect,
          }));
          NODE

      - name: Validate revised Redis AOF candidate and isolated rereview
        shell: bash
        run: |
          node <<'NODE'
          const path = require('path');
          const { auditOneCandidate } = require('./scripts/lib/answer_quality');
          const candidate = path.join(process.cwd(), 'review', 'candidates', 'answers', 'cq_aof_e522aa87.md');
          const row = auditOneCandidate(candidate, { root: process.cwd(), noWrite: true });
          console.log(JSON.stringify(row, null, 2));
          if (row.candidate_sha256 !== '72f964208c4f40deebd44e96a9299c6e606f3cc1a28cd83b86a243b8eb29983b') {
            throw new Error(`unexpected AOF candidate hash: ${row.candidate_sha256}`);
          }
          if (!row.ok) {
            throw new Error(`AOF candidate/rereview audit failed: ${JSON.stringify({ hard_failures: row.hard_failures, errors: row.errors })}`);
          }
          if (row.total_score < 90) throw new Error(`AOF rereview score below promotion threshold: ${row.total_score}`);
          if ((row.hard_failures || []).length) throw new Error(`unexpected AOF hard failures: ${row.hard_failures.join(',')}`);
          console.log(JSON.stringify({
            aof_source_first_rereview_passed: true,
            candidate_sha256: row.candidate_sha256,
            total_score: row.total_score,
          }));
          NODE

      - name: Validate revised CAS candidate and source-first rereview
        shell: bash
        run: |
          node <<'NODE'
          const path = require('path');
          const fs = require('fs');
          const { auditOneCandidate } = require('./scripts/lib/answer_quality');
          const candidate = path.join(process.cwd(), 'review', 'candidates', 'answers', 'cq_cas_64fa0b00.md');
          const row = auditOneCandidate(candidate, { root: process.cwd(), noWrite: true });
          console.log(JSON.stringify(row, null, 2));
          if (row.candidate_sha256 !== '09001d37311bf7d760a79d38bd7b7ce8566bf93b3d45ebf1de674d006cef2939') {
            throw new Error(`unexpected CAS candidate hash: ${row.candidate_sha256}`);
          }
          if (!row.ok) {
            throw new Error(`CAS candidate/rereview audit failed: ${JSON.stringify({ hard_failures: row.hard_failures, errors: row.errors })}`);
          }
          if (row.total_score < 90) throw new Error(`CAS rereview score below promotion threshold: ${row.total_score}`);
          if ((row.hard_failures || []).length) throw new Error(`unexpected CAS hard failures: ${row.hard_failures.join(',')}`);
          const stored = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'review', 'candidates', 'audits', 'cq_cas_64fa0b00.json'), 'utf8'));
          if (!stored.ok || stored.candidate_sha256 !== row.candidate_sha256 || stored.total_score !== row.total_score) {
            throw new Error(`stored CAS audit is stale: ${JSON.stringify({stored, computed: row})}`);
          }
          console.log(JSON.stringify({
            cas_source_first_rereview_passed: true,
            candidate_sha256: row.candidate_sha256,
            total_score: row.total_score,
          }));
          NODE

      - name: Validate revised GC algorithms candidate and source-first rereview
        shell: bash
        run: |
          node <<'NODE'
          const path = require('path');
          const fs = require('fs');
          const { auditOneCandidate } = require('./scripts/lib/answer_quality');
          const candidate = path.join(process.cwd(), 'review', 'candidates', 'answers', 'cq_gc_algorithms_3f884748.md');
          const row = auditOneCandidate(candidate, { root: process.cwd(), noWrite: true });
          console.log(JSON.stringify(row, null, 2));
          if (row.candidate_sha256 !== '4be181753c63263603a8dacbd0cdc892f227197e1033580f840f732838d85b70') {
            throw new Error(`unexpected GC algorithms candidate hash: ${row.candidate_sha256}`);
          }
          if (!row.ok) {
            throw new Error(`GC algorithms candidate/rereview audit failed: ${JSON.stringify({ hard_failures: row.hard_failures, errors: row.errors })}`);
          }
          if (row.total_score < 90) throw new Error(`GC algorithms rereview score below promotion threshold: ${row.total_score}`);
          if ((row.hard_failures || []).length) throw new Error(`unexpected GC algorithms hard failures: ${row.hard_failures.join(',')}`);
          const stored = JSON.parse(fs.readFileSync(path.join(process.cwd(), 'review', 'candidates', 'audits', 'cq_gc_algorithms_3f884748.json'), 'utf8'));
          if (!stored.ok || stored.candidate_sha256 !== row.candidate_sha256 || stored.total_score !== row.total_score) {
            throw new Error(`stored GC algorithms audit is stale: ${JSON.stringify({stored, computed: row})}`);
          }
          console.log(JSON.stringify({
            gc_algorithms_source_first_rereview_passed: true,
            candidate_sha256: row.candidate_sha256,
            total_score: row.total_score,
          }));
          NODE
