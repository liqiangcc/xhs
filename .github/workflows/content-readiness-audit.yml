name: Content Readiness Audit

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .content-readiness-audit-trigger

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit answer/evidence/review readiness
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const root = process.cwd();
          const answerDir = path.join(root, 'review', 'answers');
          const evidenceDir = path.join(root, 'review', 'evidence');
          const candidateDir = path.join(root, 'review', 'candidates', 'answers');
          const auditDir = path.join(root, 'review', 'candidates', 'audits');
          const progressPath = path.join(root, 'review', 'progress.json');

          function walk(dir) {
            if (!fs.existsSync(dir)) return [];
            const out = [];
            for (const e of fs.readdirSync(dir, {withFileTypes:true})) {
              const p = path.join(dir, e.name);
              if (e.isDirectory()) out.push(...walk(p)); else out.push(p);
            }
            return out;
          }
          function readJson(file) {
            try { return JSON.parse(fs.readFileSync(file,'utf8')); } catch { return null; }
          }
          function meta(text) {
            const m = (text.split(/\r?\n/,1)[0] || '').match(/<!--\s*xhs-answer:\s*(\{.*\})\s*-->/);
            if (!m) return null;
            try { return JSON.parse(m[1]); } catch { return null; }
          }

          const answers = walk(answerDir).filter(f => f.endsWith('.md') && !f.split(path.sep).includes('archive') && !f.split(path.sep).includes('archived'));
          const status = {}, tiers = {};
          const placeholders = [], suspiciousClaims = [];
          let evidenceCount = 0, pass=0, revise=0, reject=0, missingEvidence=0;
          let humanApproved=0, humanRejected=0, humanMissing=0;
          for (const file of answers) {
            const text = fs.readFileSync(file,'utf8');
            const m = meta(text) || {};
            const id = m.canonical_id || path.basename(file,'.md');
            status[m.status || 'missing'] = (status[m.status || 'missing'] || 0) + 1;
            tiers[m.quality_tier || 'missing'] = (tiers[m.quality_tier || 'missing'] || 0) + 1;
            const body = text.replace(/^<!--[^\n]*-->\s*/, '');
            if (/(?:TODO|TBD|待补充|占位(?!符)|请补充|\[填写|\{\{)/i.test(body)) placeholders.push(id);
            if (/(我在|我负责|我们项目|线上事故|最终提升|最终降低)/.test(text) && !/(项目映射|示例|模板|按真实经历|不要虚构|需替换|可结合)/.test(text)) suspiciousClaims.push(id);
            const ep = path.join(evidenceDir, `${id}.json`);
            if (!fs.existsSync(ep)) { missingEvidence++; continue; }
            evidenceCount++;
            const ev = readJson(ep);
            if (!ev) continue;
            const decision = ev.review && ev.review.decision;
            if (decision === 'pass') pass++; else if (decision === 'revise') revise++; else if (decision === 'reject') reject++;
            const hr = ev.human_review;
            if (hr && hr.reviewer_type === 'human' && hr.decision === 'approved') humanApproved++;
            else if (hr && hr.reviewer_type === 'human' && hr.decision === 'rejected') humanRejected++;
            else humanMissing++;
          }

          const candidateFiles = walk(candidateDir).filter(f => f.endsWith('.md'));
          const auditFiles = walk(auditDir).filter(f => f.endsWith('.json'));
          let auditPass=0, auditFail=0;
          const failedAuditIds=[];
          for (const file of auditFiles) {
            const row = readJson(file);
            if (!row) continue;
            if (row.ok === true) auditPass++;
            else { auditFail++; failedAuditIds.push(row.canonical_id || path.basename(file,'.json')); }
          }

          const progress = readJson(progressPath) || {};
          const progressItems = Array.isArray(progress) ? progress : (Array.isArray(progress.items) ? progress.items : []);
          const reviewedItems = progressItems.filter(item => Number(item && item.review_count || 0) > 0);
          const totalReviewMarks = reviewedItems.reduce((sum,item)=>sum+Number(item.review_count||0),0);
          const results = {};
          for (const item of reviewedItems) {
            const key = item.status || 'unknown';
            results[key] = (results[key] || 0) + 1;
          }

          const result = {
            answer_count: answers.length,
            status,
            quality_tier: tiers,
            evidence_count: evidenceCount,
            missing_evidence_count: missingEvidence,
            independent_review_decisions: {pass, revise, reject},
            human_review: {approved: humanApproved, rejected: humanRejected, missing_or_not_human: humanMissing},
            candidates: {answer_files: candidateFiles.length, audit_files: auditFiles.length, audit_pass: auditPass, audit_fail: auditFail, failed_ids: failedAuditIds.slice(0,100)},
            review_progress: {record_count: progressItems.length, reviewed_canonical_count: reviewedItems.length, total_review_marks: totalReviewMarks, reviewed_statuses: results},
            placeholder_count_excluding_technical_placeholder_word: placeholders.length,
            placeholder_ids: placeholders,
            suspicious_personal_claim_count: suspiciousClaims.length,
            suspicious_personal_claim_ids: suspiciousClaims,
          };
          console.log('CONTENT_READINESS_AUDIT=' + JSON.stringify(result));
          NODE

      - name: Regression-check final source-first review rules
        shell: bash
        run: |
          set +e
          AUDITED_SHA="$(git rev-parse HEAD)" node scripts/audit/final_content_source_first_review.js > "$RUNNER_TEMP/final-review-regression.log" 2>&1
          REVIEW_EXIT=$?
          set -e
          cat "$RUNNER_TEMP/final-review-regression.log"
          test "$REVIEW_EXIT" = "2"
          node <<'NODE'
          const report = require('./review/reports/FINAL_SOURCE_FIRST_REVIEW.json');
          const answerFinding = report.findings.find((row) => row.code === 'ANSWER_NOT_COMPLETE');
          if (!answerFinding) throw new Error('expected ANSWER_NOT_COMPLETE while answers are not curated-ready');
          if ((answerFinding.evidence.by_defect || {}).placeholder) throw new Error('technical placeholder wording is still misclassified');
          if (report.findings.some((row) => row.code === 'UNVERIFIED_PERSONAL_CLAIMS')) throw new Error('explicit behavior evidence boundary is still misclassified');
          const stabilityFinding = report.findings.find((row) => row.code === 'REAL_REVIEW_VALIDATION_INCOMPLETE');
          if (!stabilityFinding) throw new Error('expected S11 to remain incomplete until four consecutive real sampled review weeks pass');
          if (report.metrics.real_review_stability_weeks !== 4) throw new Error('final review is not enforcing the four-week S11 window');
          if (report.metrics.real_review_stability_ok !== false) throw new Error('current branch must not claim S11 completion without four valid weekly rounds');
          if (!report.real_review_stability || !Array.isArray(report.real_review_stability.reports)) throw new Error('missing machine-readable S11 stability evidence');
          console.log(JSON.stringify({
            regression_ok: true,
            reviewed_canonical_count_telemetry: report.metrics.reviewed_canonical_count,
            total_review_marks_telemetry: report.metrics.total_review_marks,
            s11_end_week: report.metrics.real_review_stability_end_week,
            s11_reports: report.real_review_stability.reports,
            answer_defects: answerFinding.evidence.by_defect,
          }));
          NODE

      - name: Validate source-first rereview regression manifest
        run: node scripts/audit/verify_rereview_regressions.js
