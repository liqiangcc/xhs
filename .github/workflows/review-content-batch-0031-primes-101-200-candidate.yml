name: Review Content Batch 0031 Primes 101 200 Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0031-primes-101-200-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0031-primes-101-200-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_701fa4ca7ce982e96b1ac55a7828a80f
  SOURCE_QID: 701fa4ca7ce982e96b1ac55a7828a80f
  CANDIDATE_BLOB_SHA: 2b4a02d8c34984317b39211959b6d6cee93b653b

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0031/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/primes-context.json
          node - <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='算法：打印 101~200 之间所有的素数并统计个数';
          const tagged=(JSON.parse(fs.readFileSync('note_tagged/67e27930000000001c00d918.json','utf8')).tagged_questions||[]).find(x=>x.question_id===qid);
          if(!tagged||tagged.original_question!==expected||tagged.question_type!=='算法手撕_Coding'||tagged.is_valid_for_library!==true) throw new Error('source drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/primes-context.json','utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('canonical context missing or drifted');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected) throw new Error('source context missing');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const required=['闭区间 `[101, 200]`','共有 21 个','d <= n / d','121 = 11*11','169 = 13*13','Integer.MAX_VALUE','O((R-L+1)*sqrt(R))'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|transition\s*\(|按本题约束填写|TODO|占位|长尾复习底稿/.test(text)) throw new Error('placeholder/template residue detected');
          NODE

          javac "$out/PrimeRange.java" "$out/PrimeRangeTest.java"
          test "$(java -cp "$out" PrimeRangeTest)" = 'PASS fixed-range=21 exact-list=yes oracle=-20..500 boundaries=yes square-composites=yes'

          python3 - <<'PY'
          def is_prime_review(n):
              if n < 2:
                  return False
              for d in range(2, n):
                  if n % d == 0:
                      return False
              return True
          actual=[n for n in range(101,201) if is_prime_review(n)]
          expected=[101,103,107,109,113,127,131,137,139,149,151,157,163,167,173,179,181,191,193,197,199]
          assert actual == expected, (actual, expected)
          assert len(actual) == 21
          assert not is_prime_review(121) and not is_prime_review(169)
          print('PASS reviewer-naive-oracle exact-list=21 inclusive-101-200=yes squares=compound')
          PY

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_0031/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryPath=`${out}/source_boundary.json`,validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'preserved question range',expected:'101~200 plus print and count only',actual:'source matched exactly',passed:true},
            {case:'inclusive answer-side interpretation',expected:'exact prime list starts 101, ends 199, count 21',actual:'independent naive oracle matched',passed:true},
            {case:'square composites',expected:'121 and 169 rejected at sqrt boundary',actual:'both rejected',passed:true},
            {case:'implementation cross-check',expected:'optimized isPrime agrees with naive divisor oracle for -20..500',actual:'all values matched',passed:true},
            {case:'displayed helper vs executable helper',expected:'Integer.MAX_VALUE loop guard present in both',actual:'aligned',passed:true}
          ];
          fs.writeFileSync(validationPath,JSON.stringify({
            schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,
            command:'javac PrimeRange.java PrimeRangeTest.java && java PrimeRangeTest; independent reviewer Python naive divisor oracle over [101,200]',
            stdout:'PASS fixed-range=21 exact-list=yes oracle=-20..500 boundaries=yes square-composites=yes; PASS reviewer-naive-oracle exact-list=21 inclusive-101-200=yes squares=compound',
            checks:['exact inclusive [101,200] prime list','exact count 21','1/2 and 101/199/200 boundaries','121=11^2 and 169=13^2 square composites','optimized Java isPrime vs independent naive divisor oracle for every integer -20..500','displayed and executable helper share Integer.MAX_VALUE overflow guard'],
            boundary_tests:tests
          },null,2)+'\n');

          const reviewer='source-first-isolated-reviewer-batch-0031-primes-101-200-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved source is a singleton coding question asking to print all primes in 101~200 and report their count; it does not preserve a programming language, API shape, primality algorithm or an explicit open/closed interval convention.',
            'The candidate makes the consequential interval choice explicit as an answer-side inclusive [101,200] interpretation instead of presenting it as recovered source wording.',
            'The primality argument is correct: every composite n has at least one factor not exceeding sqrt(n), so after 2 is handled separately it is sufficient to test odd divisors through the inclusive square-root boundary.',
            'The implementation uses d <= n/d, avoiding d*d overflow in the reusable int helper while preserving the intended square-root stopping condition; the displayed helper and executable helper are aligned after remediation.',
            'Under the declared inclusive interpretation, an independent naive reviewer oracle yields exactly 21 primes: 101 through 199 with the same explicit list as the candidate; 121 and 169 confirm the inclusive square-root boundary.',
            'The standalone Java implementation also matches a separate naive divisor oracle for every integer from -20 through 500 and preserves the fixed-range output/count contract.',
            'The answer does not fabricate production experience or source constraints; sieve/segmented-sieve discussion is explicitly framed as an extension beyond the fixed interview problem.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,
            review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0031.primes-101-200.v1',decision:'pass',revision_round:1,
            source_packet:['note_tagged/67e27930000000001c00d918.json',boundaryPath,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,
            remediation_history_observed_after_source_first_conclusion:['candidate display/executable helper overflow-guard alignment was remediated before this fixed-blob review'],
            promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');

          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,
            writer:{writer_id:'content-batch-0031-primes-101-200-builder',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'repository-source',title:'Tagged fixed-range prime-number coding question',locator:`note_tagged/67e27930000000001c00d918.json#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'fixture',title:'PrimeRange executable Java validation plus independent reviewer naive oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Prime range candidate independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The preserved source asks to print primes in 101~200 and report the count; inclusive interval interpretation, Java API and algorithm choice are answer-side decisions.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节','常见追问']},
              {claim_id:'sqrt-mechanism',text:'A composite integer has a factor at or below its square root, so checking the inclusive sqrt boundary is sufficient; after handling 2, only odd candidate divisors are needed.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']},
              {claim_id:'fixed-result',text:'Under the explicit inclusive [101,200] interpretation, an independent naive reviewer oracle and the Java fixture both produce the exact 21-number prime list stated in the candidate.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','3 分钟版','常见追问']},
              {claim_id:'implementation-boundaries',text:'The executable implementation covers n<2, 2, even composites, square composites and a reusable int loop-overflow guard, and agrees with a naive divisor oracle on every integer -20..500.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','关键细节','易错点']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:'javac PrimeRange.java PrimeRangeTest.java && java PrimeRangeTest; reviewer Python naive oracle',result:'pass',reported_stdout:'PASS fixed-range=21 exact-list=yes oracle=-20..500 boundaries=yes square-composites=yes',checks:['exact list/count','independent fixed-range oracle','square-root boundary','optimized-vs-naive oracle','overflow-guard alignment'],boundary_tests:tests},
            review_state:'independent_source_first_review_passed',
            review:{reviewer_id:reviewer,review_version:'batch-0031.primes-101-200.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md';
          let text=fs.readFileSync(task,'utf8');
          const done='- [x] `cq_q_701fa4ca7ce982e96b1ac55a7828a80f` candidate passed independent source-first review: the source boundary is fixed to printing/counting primes for 101~200, the inclusive interval interpretation is explicit answer-side, the sqrt-factor invariant and square-composite boundaries are correct, and the Java implementation matches independent naive oracles with the exact 21-prime list. Formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(done)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+done+'\n');
          NODE

      - name: Audit candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo 'Content branch advanced during primes review; discard local review and retry later.'
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0031/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0031.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0031 primes 101-200 candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
