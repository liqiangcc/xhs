name: Review Content Batch 0036 Three Thread ABC Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0036-three-thread-abc.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0036-three-thread-abc-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_89d62736c56f9d7f6d1114493dff60eb
  SOURCE_QID: 89d62736c56f9d7f6d1114493dff60eb
  SOURCE_TAGGED: note_tagged/66c75a74000000001f0152ed.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: |
          set -euo pipefail
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "candidate_sha256=$(sha256sum review/candidates/answers/$CANONICAL_ID.md | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "implementation_sha256=$(sha256sum review/content_build/answer_batch_0036/$CANONICAL_ID/RoundRobinABC.java | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$(sha256sum "$SOURCE_TAGGED" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Phase A source-first review and independent concurrency stress
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0036/$cid"; candidate="review/candidates/answers/$cid.md"
          rm -rf "$out/reviewer_tmp"; mkdir -p "$out/reviewer_tmp"

          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='算法：三个线程轮流打印 A、B、C';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('source question drift');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift ${h}`);
          for(const marker of ['Semaphore','a=1, b=0, c=0','ABCABC','O(rounds)','O(1)','中断边界']) if(!md.includes(marker)) throw new Error(`semantic marker missing ${marker}`);
          if(!md.includes('来源只保留')||!md.includes('这里采用一个明确的回答契约')) throw new Error('source/answer-side contract boundary missing');
          if(/真实项目里我|线上事故|我们生产|我在线上|我负责|我优化到/.test(md)) throw new Error('fabricated project claim');
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups insufficient');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public final class RoundRobinABC')) throw new Error('complete Java class missing');
          fs.writeFileSync(`review/content_build/answer_batch_0036/${cid}/reviewer_tmp/RoundRobinABC.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/RoundRobinABCReviewerTest.java" <<'JAVA'
          import java.util.Random;
          import java.util.concurrent.ExecutionException;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          import java.util.concurrent.Future;
          import java.util.concurrent.TimeUnit;
          import java.util.concurrent.TimeoutException;
          import java.util.concurrent.atomic.AtomicReference;

          public final class RoundRobinABCReviewerTest {
              private static long exactCases;
              private static long randomizedCases;

              public static void main(String[] args) throws Exception {
                  for (int rounds : new int[] {0,1,2,3,10,100,1000}) checkTimed(rounds);

                  Random r = new Random(0x89D62736C56FL);
                  for (int i = 0; i < 500; i++) {
                      checkTimed(r.nextInt(251));
                      randomizedCases++;
                  }

                  boolean negative=false;
                  try { RoundRobinABC.print(-1); } catch (IllegalArgumentException e) { negative=true; }
                  if(!negative) throw new AssertionError("negative rounds must reject");

                  AtomicReference<Throwable> interruptionResult=new AtomicReference<>();
                  Thread caller=new Thread(() -> {
                      try {
                          RoundRobinABC.print(1_000_000);
                          interruptionResult.set(new AssertionError("interrupted caller unexpectedly completed"));
                      } catch (Throwable t) {
                          interruptionResult.set(t);
                      }
                  }, "reviewer-caller");
                  caller.start();
                  Thread.sleep(20);
                  caller.interrupt();
                  caller.join(3000);
                  if(caller.isAlive()) throw new AssertionError("interrupted caller did not terminate");
                  if(!(interruptionResult.get() instanceof InterruptedException)) throw new AssertionError("caller interruption was not propagated: "+interruptionResult.get());
                  long deadline=System.nanoTime()+TimeUnit.SECONDS.toNanos(3);
                  while(hasPrinterThreads() && System.nanoTime()<deadline) Thread.sleep(10);
                  if(hasPrinterThreads()) throw new AssertionError("worker printer threads leaked after caller interruption");

                  System.out.printf("PASS fixed=7 exact_cases=%d random=%d exact-order=pass no-deadlock=pass negative=reject caller-interrupt=propagated workers=terminated%n",
                      exactCases, randomizedCases);
              }

              private static void checkTimed(int rounds) throws Exception {
                  ExecutorService executor=Executors.newSingleThreadExecutor();
                  Future<String> future=executor.submit(() -> RoundRobinABC.print(rounds));
                  try {
                      String actual=future.get(3,TimeUnit.SECONDS);
                      String expected="ABC".repeat(rounds);
                      if(!actual.equals(expected)) throw new AssertionError("rounds="+rounds+" actual="+actual+" expected="+expected);
                      exactCases++;
                  } catch (TimeoutException e) {
                      future.cancel(true);
                      throw new AssertionError("deadlock/timeout rounds="+rounds,e);
                  } catch (ExecutionException e) {
                      throw new AssertionError("execution failed rounds="+rounds,e.getCause());
                  } finally {
                      executor.shutdownNow();
                      if(!executor.awaitTermination(3,TimeUnit.SECONDS)) throw new AssertionError("review executor did not terminate");
                  }
              }

              private static boolean hasPrinterThreads() {
                  for(Thread t:Thread.getAllStackTraces().keySet()) if(t.isAlive() && t.getName().startsWith("printer-")) return true;
                  return false;
              }
          }
          JAVA
          (cd "$out/reviewer_tmp" && javac -Xlint:all -Werror RoundRobinABC.java RoundRobinABCReviewerTest.java && java RoundRobinABCReviewerTest > stdout.txt)
          stdout="$(cat "$out/reviewer_tmp/stdout.txt")"
          test "$stdout" = 'PASS fixed=7 exact_cases=507 random=500 exact-order=pass no-deadlock=pass negative=reject caller-interrupt=propagated workers=terminated'

          REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved repository source says only “算法：三个线程轮流打印 A、B、C”; it does not specify repetition count, Java API, busy-wait policy, or cancellation/error semantics.',
            'The candidate preserves that sparse boundary and explicitly labels A-first order, equal rounds, Java, zero/negative-round handling, and caller-interruption behavior as answer-side contracts.',
            'The three-Semaphore topology correctly implements a single logical token: A starts with one permit, B/C with zero, and every normal print transfers eligibility only to the unique successor A→B→C→A.',
            'Because a thread must acquire its dedicated permit before appending, scheduler start/run order cannot make B or C observably print ahead of the predecessor on the normal path; no busy spin is used.',
            'The returned StringBuilder result is read only after joins; the candidate correctly distinguishes O(rounds) returned-output space from O(1) synchronization state rather than claiming total O(1) memory.',
            'Reviewer-owned validation extracts the exact candidate Java fence and executes 507 timed exact-output cases, including 500 seeded randomized round counts, with no deadlock and exact ABC repetition.',
            'An independent cancellation probe interrupts the caller during a million-round invocation, confirms InterruptedException propagation, and verifies all named printer worker threads terminate rather than leaking.',
            'The answer appropriately states that production failure propagation/output-action failure would require an additional contract; no fabricated production experience, placeholder implementation, or uncovered source variant was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,command:'extract exact candidate Java; javac -Xlint:all -Werror; execute timed exact-order stress and caller-interruption leak check',stdout:process.env.REVIEW_STDOUT,checks:['exact candidate Java compiles with warnings as errors','rounds 0/1/2/3/10/100/1000 produce exact ABC repetition','500 seeded randomized round counts produce exact ABC repetition','every invocation terminates within timeout','negative rounds reject','caller interruption propagates and printer workers terminate'],boundary_tests:[{case:'rounds=0',expected:'empty output and all three threads terminate',passed:true},{case:'scheduler variability',expected:'observable output remains exact ABC repetition',passed:true},{case:'large round count',expected:'1000 rounds exact order without deadlock',passed:true},{case:'caller interrupted during join',expected:'propagate InterruptedException and interrupt all workers',passed:true}]},null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-three-thread-abc-20260826-v1',review_version:'three-thread-abc.semaphore-stress.v1',decision:'pass',revision_round:0,source_packet:[process.env.SOURCE_TAGGED,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          NODE

      - name: Phase B bind writer evidence after independent conclusion
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const r=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          const wr=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const wv=JSON.parse(fs.readFileSync(`${out}/writer_validation.json`,'utf8'));
          const rv=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(r.decision!=='pass'||r.candidate_sha256!==hash||wr.review_state!=='writer_complete_isolated_review_pending'||wv.result!=='pass'||rv.result!=='pass') throw new Error('review/evidence prerequisite drift');
          if(wv.candidate_sha256!==hash) throw new Error('writer candidate binding drift');
          const ev={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,writer:{writer_id:'three-thread-abc-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'tagged-source',title:'Repository tagged three-thread ABC interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer three-thread ABC executable validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent timed concurrency stress and cancellation validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Fresh isolated source-first review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source requires only three threads taking turns to print A, B and C; rounds, Java API and cancellation policy are not specified.',source_ids:['tagged-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'round-robin-correctness',text:'Under the explicit A-first/equal-round contract, the exact candidate Java fence produces strict ABC repetition and terminates across fixed and randomized concurrent runs.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','关键细节','原理机制']},{claim_id:'blocking-and-space',text:'The implementation blocks on Semaphore permits instead of busy waiting and maintains constant synchronization state; the test-oriented returned output itself grows with rounds.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['1 分钟版','关键细节','易错点']},{claim_id:'interruption-boundary',text:'The declared caller-interruption path propagates InterruptedException and interrupts worker threads; richer production failure coordination remains outside the preserved source contract.',source_ids:['reviewer-validation','isolated-review'],answer_locations:['关键细节','项目经验版']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],validation:{command:rv.command,result:'pass',reported_stdout:rv.stdout,checks:rv.checks,boundary_tests:rv.boundary_tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:r.reviewer_id,review_version:r.review_version,independent:true,decision:'pass',revision_round:0,scores:r.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:r.findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(ev,null,2)+'\n');
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Update task and commit review
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0036/$CANONICAL_ID/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'); const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let t=fs.readFileSync(task,'utf8');
          const pending='- `cq_q_89d62736c56f9d7f6d1114493dff60eb` three-thread ABC candidate preserves the minimal source boundary, explicitly adopts A-first/equal-round Java semantics, uses a blocking three-Semaphore token ring, and passes fixed plus 200 seeded concurrent writer checks with deadlock timeouts; isolated review and promotion gates remain pending.';
          const done='- [x] `cq_q_89d62736c56f9d7f6d1114493dff60eb` three-thread ABC candidate preserves the minimal source boundary, explicitly adopts A-first/equal-round Java semantics, uses a blocking three-Semaphore token ring, passes fixed plus randomized writer/reviewer exact-order stress and caller-interruption termination checks, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!t.includes(pending)) throw new Error('pending task line drift');
          t=t.replace(pending,done); fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-review-bot
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add "review/content_build/answer_batch_0036/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0036/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md
          git commit -m "review: pass batch 0036 three-thread ABC candidate source-first"
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse "origin/$CONTENT_BRANCH")" = "${{ steps.base.outputs.head }}" || { echo 'content branch moved during review' >&2; exit 1; }
          git push origin HEAD:"$CONTENT_BRANCH"
