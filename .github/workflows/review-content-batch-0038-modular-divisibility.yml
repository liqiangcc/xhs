name: Review Content Batch 0038 Modular Divisibility Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0038-modular-divisibility.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0038-modular-divisibility-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9c3a49f5f175dcfabd68eccd2c46e01e
  SOURCE_QID: 9c3a49f5f175dcfabd68eccd2c46e01e
  SOURCE_TAGGED: note_tagged/6668516a000000000e033155.json

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first exact-candidate review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0038/$cid"; tmp="/tmp/mod-review"
          rm -rf "$tmp"; mkdir -p "$tmp" "$out"
          python3 - <<'PY'
          import json,os,pathlib,re
          exact='数学/逻辑：17^400 - 19^100 的结果能否被10整除？'
          cid=os.environ['CANONICAL_ID'];qid=os.environ['SOURCE_QID']
          tagged=json.loads(pathlib.Path(os.environ['SOURCE_TAGGED']).read_text())
          q=next((x for x in tagged.get('tagged_questions',[]) if x.get('question_id')==qid),None)
          if not q or q.get('original_question')!=exact or q.get('is_valid_for_library') is not True: raise SystemExit('source drift')
          writer=json.loads(pathlib.Path(f'review/content_build/answer_batch_0038/{cid}/writer_research.json').read_text())
          if writer.get('review_state')!='writer_complete_isolated_review_pending': raise SystemExit('writer state drift')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md');md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in ['可以被 10 整除','7^400','9^100','400 % 4','Math.floorMod','O(log exponent)']:
              if marker not in md: raise SystemExit(f'candidate missing {marker}')
          if len(re.findall(r'^- 问：',md,re.M))<5: raise SystemExit('followups insufficient')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one Java block, got {len(blocks)}')
          snippet=blocks[0].strip()
          harness='''public class CandidateHarness {\n'''+snippet+'''\n
            public static void main(String[] args) {
              if(modPow(17,400,10)!=1L) throw new AssertionError("17 residue");
              if(modPow(19,100,10)!=1L) throw new AssertionError("19 residue");
              if(!divisibleBy10()) throw new AssertionError("divisibility");
              long checks=0;
              for(long b=-40;b<=40;b++) for(long e=0;e<=150;e++) {
                long expected=java.math.BigInteger.valueOf(b).pow((int)e).mod(java.math.BigInteger.TEN).longValue();
                long got=modPow(b,e,10);
                if(got!=expected) throw new AssertionError("mismatch b="+b+" e="+e+" got="+got+" expected="+expected);
                checks++;
              }
              System.out.println("PASS exact_candidate left=1 right=1 difference=0 crosscheck="+checks+" oracle=BigInteger");
            }
          }
          '''
          pathlib.Path('/tmp/mod-review/CandidateHarness.java').write_text(harness)
          PY

          javac "$out/writer_validation.java"
          writer_stdout="$(java -cp "$out" writer_validation)"
          test "$writer_stdout" = 'PASS left_mod10=1 right_mod10=1 difference_mod10=0 exact_big_integer=0 modpow_crosscheck=20301'
          (cd "$tmp" && javac CandidateHarness.java && java CandidateHarness > stdout.txt)
          reviewer_stdout="$(cat "$tmp/stdout.txt")"
          test "$reviewer_stdout" = 'PASS exact_candidate left=1 right=1 difference=0 crosscheck=12231 oracle=BigInteger'
          python3 - <<'PY' > "$tmp/python-proof.txt"
          left=pow(17,400,10); right=pow(19,100,10); diff=(left-right)%10
          assert (left,right,diff)==(1,1,0)
          print('PASS python_modular_oracle left=1 right=1 difference=0')
          PY
          test "$(cat "$tmp/python-proof.txt")" = 'PASS python_modular_oracle left=1 right=1 difference=0'

          WRITER_STDOUT="$writer_stdout" REVIEW_STDOUT="$reviewer_stdout" PY_STDOUT="$(cat "$tmp/python-proof.txt")" python3 - <<'PY'
          import hashlib,json,os,pathlib
          cid=os.environ['CANONICAL_ID'];qid=os.environ['SOURCE_QID'];date='2026-08-27';out=pathlib.Path(f'review/content_build/answer_batch_0038/{cid}');candidate=pathlib.Path(f'review/candidates/answers/{cid}.md');digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          wv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'result':'pass','validated_at':date,'command':'javac writer_validation.java && java writer_validation','stdout':os.environ['WRITER_STDOUT'],'checks':['17^400 mod10=1','19^100 mod10=1','exact BigInteger difference mod10=0','20301 modPow cases cross-checked with BigInteger']};(out/'writer_validation.json').write_text(json.dumps(wv,ensure_ascii=False,indent=2)+'\n')
          rv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract exact Java candidate and cross-check residues with Java BigInteger and independent Python pow','stdout':os.environ['REVIEW_STDOUT']+'; '+os.environ['PY_STDOUT'],'checks':['exact candidate compiles under Java 21','candidate returns residues 1 and 1 and divisibility true','12231 generic modPow cases match BigInteger','independent Python modular arithmetic returns difference residue 0']};(out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')
          findings=['The preserved source exactly asks whether 17^400 - 19^100 is divisible by 10.','The answer directly proves 17^400 ≡ 1 (mod 10) using the period-4 last-digit cycle of 7 and 19^100 ≡ 1 (mod 10) using the period-2 cycle of 9.','The exact candidate Java compiles and independently matches BigInteger and Python modular oracles.','The answer correctly explains that divisibility of a difference depends on congruence modulo 10 and does not require expanding or comparing the full powers.','The generic binary modular exponentiation implementation is O(log exponent) and keeps intermediate values bounded under modulus 10.','No fabricated project experience is claimed.']
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-modular-divisibility-20260827-v1','review_version':'modular-divisibility.v1','decision':'pass','revision_round':1,'source_packet':[os.environ['SOURCE_TAGGED'],str(candidate),'docs/refactor/09_answer_content_standard.md',str(out/'writer_validation.json'),str(out/'reviewer_validation.json')],'scores':{'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5},'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']};(out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'modular-divisibility-source-bounded-writer-20260827-v1','writer_version':'xhs-answer-curator.v1'},'sources':[{'source_id':'repository-tagged','title':'Tagged modular-divisibility source','locator':os.environ['SOURCE_TAGGED'],'source_type':'repository_structured_source','checked_at':date},{'source_id':'writer-validation','title':'Writer modulo/BigInteger validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'reviewer-validation','title':'Independent exact-candidate modular review','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'isolated-review','title':'Fresh isolated source-first modular review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}],'claims':[{'claim_id':'source-boundary','text':'The preserved source asks whether 17^400 - 19^100 is divisible by 10.','source_ids':['repository-tagged'],'answer_locations':['核心结论','1 分钟版','3 分钟版']},{'claim_id':'residue-proof','text':'Both powers have residue 1 modulo 10, so the difference has residue 0 and is divisible by 10.','source_ids':['writer-validation','reviewer-validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','关键细节','原理机制']},{'claim_id':'executable-validation','text':'The exact fast modular exponentiation code is cross-checked against BigInteger and independent Python modular arithmetic.','source_ids':['writer-validation','reviewer-validation'],'answer_locations':['3 分钟版','关键细节','常见追问','易错点']}],'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':rv['checks']},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':review['scores'],'hard_failures':[],'uncovered_source_variants':[],'unsupported_claims':[],'findings':findings}}
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md');text=task.read_text();line='- [x] `cq_q_9c3a49f5f175dcfabd68eccd2c46e01e` modular-divisibility candidate preserves the exact 17^400 - 19^100 / 10-divisibility source boundary, gives the direct last-digit-cycle proof plus a generic binary modular-power implementation, passes writer BigInteger validation and independent exact-candidate BigInteger/Python modular review, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.'
          if line not in text:
              if '## Progress' not in text:text=text.rstrip()+'\n\n## Progress\n'
              text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY
          rm -f "$out"/*.class

      - name: Commit reviewed candidate evidence
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0038/$CANONICAL_ID/writer_validation.json" "review/content_build/answer_batch_0038/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0038/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0038.md
          git commit -m 'review: pass batch 0038 modular-divisibility candidate source-first'
          for attempt in 1 2 3; do if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi; git fetch origin "$CONTENT_BRANCH"; git rebase "origin/$CONTENT_BRANCH"; done
          exit 1
