name: Remediate Content Batch 0036 C System Bitness Relation V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0036-c-system-bitness-relation-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-c-system-bitness-relation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  SOURCE_QID: 8759fdb2629c78e7f847052e43922d24
  SOURCE_CID: cq_q_8759fdb2629c78e7f847052e43922d24
  TARGET_QID: 37772fa23763570fb8d04764450230d3
  TARGET_CID: cq_q_37772fa23763570fb8d04764450230d3

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first duplicate relation conclusion
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0036
          node <<'NODE'
          const fs=require('fs');
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const cs=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(qs.map(q=>[q.question_id,q])),byC=new Map(cs.map(c=>[c.canonical_id,c]));
          const pairs=[[process.env.SOURCE_QID,process.env.SOURCE_CID,'如何用 C 语言判断当前 system 是 32 位还是 64 位？'],[process.env.TARGET_QID,process.env.TARGET_CID,'如何使用 C 语言编写代码来判断当前操作系统是 32 位还是 64 位？']];
          for(const [qid,cid,title] of pairs){const q=byQ.get(qid),c=byC.get(cid);if(!q||q.original_question!==title||q.canonical_id!==cid||q.is_valid_for_library===false)throw new Error(`${qid}: source/ownership drift`);if(!c||JSON.stringify(c.question_ids||[])!==JSON.stringify([qid]))throw new Error(`${cid}: expected singleton`);}
          const phrase='用C语言判断当前系统是32位还是64位';
          for(const p of ['note_desc/66e0126e000000002603f658.txt','note_desc/67e9712a000000000b02c3fb.txt']) if(!fs.readFileSync(p,'utf8').includes(phrase)) throw new Error(`${p}: raw phrase missing`);
          // Narrow by explicit C-language wording. The prior probe intentionally failed closed
          // because a Java-int 32/64-bit question matched the broader OS/system regex.
          const neighborhood=qs.filter(q=>q.is_valid_for_library!==false && /(?:32\s*位.*64\s*位|64\s*位.*32\s*位)/.test(q.original_question||'') && /C\s*语言/i.test(q.original_question||''));
          const actual=neighborhood.map(q=>q.question_id).sort(),expected=[process.env.SOURCE_QID,process.env.TARGET_QID].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected))throw new Error(`narrow C system-bitness neighborhood drifted: ${JSON.stringify(neighborhood.map(q=>({qid:q.question_id,text:q.original_question,cid:q.canonical_id})))}`);
          const review=`# C System Bitness Source-First Relation Review\n\n## Primary-source facts\n\n- \`${process.env.SOURCE_QID}\` and \`${process.env.TARGET_QID}\` come from two interview-note captures whose raw question line is identically “${phrase}”.\n- The surrounding interview question sequence is also the same.\n- The active 32/64-bit neighborhood narrowed to explicit C-language wording contains exactly these two Questions; the broader first probe also found an unrelated Java-int question and therefore correctly failed closed.\n- The tagged wording differs only by normalization (“system” versus “操作系统” / “使用 C 语言编写代码”), not by a preserved observable contract.\n- Neither raw source defines whether “system bitness” means compiled-process ABI/pointer representation, OS-kernel bitness, or CPU capability.\n\nNo historical answer/relation/remediation record was consulted before this conclusion.\n\n## Decision\n\nRelation: \`same\`. Consolidate \`${process.env.SOURCE_CID}\` into survivor \`${process.env.TARGET_CID}\`. The survivor Answer remains needs-update and must explicitly distinguish compiled-program pointer/ABI facts from host OS/CPU bitness.\n`;
          fs.writeFileSync('review/content_build/answer_batch_0036/c_system_bitness_relation_review.md',review);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite

      - name: Decide and apply reviewed same relation
        shell: bash
        run: |
          set -euo pipefail
          out='review/content_build/answer_batch_0036/c_system_bitness_relation_apply'; mkdir -p "$out"
          node scripts/xhs.js canonical suggest --question-ids "$SOURCE_QID,$TARGET_QID" --noManifest > "$out/suggest.json"
          key="$(node - "$out/suggest.json" <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          if(!Array.isArray(r.relation_candidates)||r.relation_candidates.length!==1)throw new Error(`expected one relation candidate, got ${r.relation_candidates?.length}`);
          const c=r.relation_candidates[0],a=[...c.question_ids].sort(),e=[process.env.SOURCE_QID,process.env.TARGET_QID].sort();if(JSON.stringify(a)!==JSON.stringify(e))throw new Error(`pair drifted: ${JSON.stringify(a)}`);process.stdout.write(c.relation_candidate_key);
          NODE
          )"
          node scripts/xhs.js dedup decide --relation-candidate-key "$key" --relation same --actor-type ai --actor-id batch-0036-c-system-bitness-source-first-review-v2 --actor-display-name 'C system bitness source-first reviewer' --rationale 'Two primary raw interview notes preserve the identical C system-bitness line in the same surrounding question sequence; tagged wording differs only by normalization.' > "$out/decide.json"
          node scripts/xhs.js dedup apply --relation-candidate-key "$key" --canonical-id "$TARGET_CID" --canonical-title '如何使用 C 语言编写代码来判断当前操作系统是 32 位还是 64 位？' > "$out/apply.json"

      - name: Verify ownership and record cross-batch progress
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const qs=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse),cs=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const byQ=new Map(qs.map(q=>[q.question_id,q])),byC=new Map(cs.map(c=>[c.canonical_id,c]));
          for(const qid of [process.env.SOURCE_QID,process.env.TARGET_QID])if(byQ.get(qid)?.canonical_id!==process.env.TARGET_CID)throw new Error(`${qid}: survivor ownership missing`);
          if(byC.has(process.env.SOURCE_CID))throw new Error('retired duplicate Canonical remains');
          const a=[...(byC.get(process.env.TARGET_CID)?.question_ids||[])].sort(),e=[process.env.SOURCE_QID,process.env.TARGET_QID].sort();if(JSON.stringify(a)!==JSON.stringify(e))throw new Error(`survivor members drifted ${JSON.stringify(a)}`);
          fs.writeFileSync('review/content_build/answer_batch_0036/c_system_bitness_relation_apply.md',`# C System Bitness Relation Application\n\n- Reviewed relation: \`same\`.\n- Survivor: \`${process.env.TARGET_CID}\`.\n- Retired duplicate: \`${process.env.SOURCE_CID}\`.\n- Both source Questions now route to the survivor; no formal Answer promotion occurs in this normalization slice.\n`);
          const t36='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';let a36=fs.readFileSync(t36,'utf8');
          const old='- [ ] `cq_q_8759fdb2629c78e7f847052e43922d24` C system-bitness source boundary is source-first audited: the wording is recoverable but leaves `system` ambiguous between compiled-process ABI/pointer representation, OS kernel, and CPU capability. Any rebuilt answer must distinguish those meanings and must not present a `sizeof` probe as a portable host-OS-bitness detector; candidate/reviewer work remains pending.';
          const done='- [x] `cq_q_8759fdb2629c78e7f847052e43922d24` duplicate C system-bitness singleton is source-first consolidated as `same` into `cq_q_37772fa23763570fb8d04764450230d3`: both primary raw notes preserve the identical interview line “用C语言判断当前系统是32位还是64位” in the same question sequence. The survivor Answer remains needs-update and must preserve the compiled-process ABI/pointer-representation versus host-OS/CPU semantic boundary.';
          if(!a36.includes(old))throw new Error('batch 0036 audit marker missing');fs.writeFileSync(t36,a36.replace(old,done));
          const t21='tasks/answer-batches/TASK-20260711-0313-answer-batch-0021.md';let a21=fs.readFileSync(t21,'utf8');const note='- `cq_q_37772fa23763570fb8d04764450230d3` now survives a source-first `same` consolidation with duplicate `cq_q_8759fdb2629c78e7f847052e43922d24`; two raw interview notes preserve the identical C system-bitness line. The consolidated Answer remains needs-update pending a source-bounded rebuild and isolated review that distinguishes compiled-process ABI/pointer representation from host OS or CPU bitness.';if(!a21.includes(note))a21=a21.trimEnd()+`\n${note}\n`;fs.writeFileSync(t21,a21);
          NODE

      - name: Refresh audit and run complete gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"; base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced: $base_head -> $remote_head; fail closed without push."; exit 0; fi
          git add -A; git diff --cached --check
          git config user.name 'xhs-remediation-bot'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: consolidate duplicate C system-bitness sources'
          git push origin "HEAD:$CONTENT_BRANCH"
