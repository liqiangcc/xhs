name: Remediate Content Batch 0054 Unrecoverable Max-N Combination Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0054-unrecoverable-max-n-combination.yml
      - scripts/content/remediate_batch_0054_unrecoverable_max_n_combination.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0054-unrecoverable-max-n-combination
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CID: cq_q_f2613a7970f7d61ff1180e5663db4e55
  QID: f2613a7970f7d61ff1180e5663db4e55

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fail-closed source remediation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0054_unrecoverable_max_n_combination.py > /tmp/remediate.py
          python3 -m py_compile /tmp/remediate.py
          python3 /tmp/remediate.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify fail-closed projection
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=Path('.'); cid=os.environ['CID']; qid=os.environ['QID']; expected='算法：最大为 N 的数字组合。'
          canon={json.loads(x)['canonical_id'] for x in (r/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          qs={x['question_id']:x for x in (json.loads(s) for s in (r/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if s.strip())}
          progress={x.get('canonical_id') for x in json.loads((r/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit={x.get('question_id'):x for x in json.loads((r/'config/question_validity_audit.json').read_text(encoding='utf-8')).get('decisions',[])}
          row=qs.get(qid); decision=audit.get(qid)
          assert cid not in canon and cid not in progress
          assert row and row.get('original_question')==expected and row.get('canonical_id') is None and row.get('is_valid_for_library') is False and row.get('exclusion_reason')=='incomplete_or_unreadable'
          assert not (r/'review/answers'/f'{cid}.md').exists() and (r/'review/archive/answers'/f'{cid}.md').exists()
          assert not (r/'review/candidates/answers'/f'{cid}.md').exists()
          assert decision and decision.get('decision')=='exclude' and decision.get('exclusion_reason')=='incomplete_or_unreadable'
          note=decision.get('exclusion_note') or ''
          for token in ['最大为 N 的数字组合','输入输出格式','回溯','fail-closed','猜测']: assert token in note, token
          print('PASS batch0054 max-N combination retired fail-closed with explainable audit trail')
          PY

      - name: Run repository closure gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0054.md'); t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_f2613a7970f7d61ff1180e5663db4e55` retired fail-closed as source-unrecoverable. Repository source-first review found only “最大为 N 的数字组合”, a `回溯` taxonomy hint, and the interview note that the candidate had an idea but did not finish in 25 minutes. No candidate-number domain, reuse/order/dedup semantics, meaning of “最大为 N”, N domain, input/output format, or no-solution behavior is recoverable. Those omissions distinguish incompatible executable problems, so selecting a concrete backtracking/permutation/digit-search contract would fabricate the interview question. The original Question remains as explicitly explainable `incomplete_or_unreadable` noise while its singleton Canonical, ReviewProgress, and active long-tail Answer are retired and the baseline Answer is archived.'
          if '## Progress' not in t: t=t.rstrip()+'\n\n## Progress\n'
          if line not in t: t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"; base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during remediation: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add -A
          if git diff --cached --quiet; then echo 'No batch0054 max-N remediation changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0054 max-N combination question'
          git push origin "HEAD:$CONTENT_BRANCH"
