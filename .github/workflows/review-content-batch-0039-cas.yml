name: Review Content Batch 0039 CAS Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0039-cas.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0039-cas-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_9ffa48e1df8d78a08a74e14388301ebc
  SOURCE_QID: 9ffa48e1df8d78a08a74e14388301ebc

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first exact-candidate review
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0039/$cid"; tmp="/tmp/cas-review"
          rm -rf "$tmp"; mkdir -p "$tmp" "$out"

          python3 - <<'PY'
          import json,os,pathlib,re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; exact='CAS了解不？手写一个？'
          rows=[json.loads(x) for x in pathlib.Path('data/questions/questions.jsonl').read_text().splitlines() if x.strip()]
          row=next((x for x in rows if x.get('question_id')==qid),None)
          if not row or row.get('original_question')!=exact or row.get('canonical_id')!=cid or row.get('is_valid_for_library') is not True:
              raise SystemExit('current source/ownership drift')
          tagged=json.loads(pathlib.Path('note_tagged/682de771000000002301f55d.json').read_text()).get('tagged_questions',[])
          src=next((x for x in tagged if x.get('question_id')==qid),None)
          if not src or src.get('original_question')!=exact or src.get('is_valid_for_library') is not True:
              raise SystemExit('primary repository source drift')
          inventory=json.loads(pathlib.Path('review/content_build/answer_batch_0039/source_inventory.json').read_text())
          item=next((x for x in inventory.get('items',[]) if x.get('canonical_id')==cid),None)
          if not item or not any(q.get('question_id')==qid and q.get('original_question')==exact for q in item.get('source_questions',[])):
              raise SystemExit('frozen source inventory drift')

          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md'); md=candidate.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          for marker in ['语义模拟、不是 lock-free CAS','AtomicInteger.compareAndSet','CAS loop','重新读取并重新计算','AtomicStampedReference','ABA','Math.incrementExact','复合不变量','辅助空间 O(1)']:
              if marker not in md: raise SystemExit(f'candidate boundary marker missing: {marker}')
          if len(re.findall(r'^- 问：',md,re.M)) < 5: raise SystemExit('followups insufficient')
          blocks=re.findall(r'```java\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one directly compilable Java block, got {len(blocks)}')
          pathlib.Path('/tmp/cas-review/CasExamples.java').write_text(blocks[0].strip()+'\n')
          PY

          cat > "$tmp/CasReviewerTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.List;
          import java.util.concurrent.CountDownLatch;
          import java.util.concurrent.atomic.AtomicInteger;
          import java.util.concurrent.atomic.AtomicStampedReference;

          public final class CasReviewerTest {
              public static void main(String[] args) throws Exception {
                  CasExamples.LockedCasInt locked = new CasExamples.LockedCasInt(7);
                  if (!locked.compareAndSet(7, 8) || locked.get() != 8) throw new AssertionError("locked CAS success");
                  if (locked.compareAndSet(7, 9) || locked.get() != 8) throw new AssertionError("stale expected changed state");

                  AtomicInteger counter = new AtomicInteger();
                  int threads=6, each=15000;
                  CountDownLatch start=new CountDownLatch(1);
                  List<Thread> ws=new ArrayList<>();
                  for(int t=0;t<threads;t++) {
                      Thread w=new Thread(() -> {
                          try { start.await(); } catch (InterruptedException e) { throw new RuntimeException(e); }
                          for(int i=0;i<each;i++) CasExamples.incrementAndGet(counter);
                      });
                      ws.add(w); w.start();
                  }
                  start.countDown(); for(Thread w:ws) w.join();
                  if(counter.get()!=threads*each) throw new AssertionError("lost update: "+counter.get());

                  AtomicInteger stale=new AtomicInteger(3);
                  int observed=stale.get();
                  if(!stale.compareAndSet(3,4)) throw new AssertionError("competing update");
                  if(stale.compareAndSet(observed,5) || stale.get()!=4) throw new AssertionError("stale expected accepted");

                  AtomicInteger max=new AtomicInteger(Integer.MAX_VALUE);
                  try { CasExamples.incrementAndGet(max); throw new AssertionError("expected overflow"); }
                  catch (ArithmeticException expected) { if(max.get()!=Integer.MAX_VALUE) throw new AssertionError("overflow changed state"); }

                  Object a=new Object(), b=new Object();
                  AtomicStampedReference<Object> ref=new AtomicStampedReference<>(a,0);
                  int stamp=ref.getStamp();
                  if(!ref.compareAndSet(a,b,0,1) || !ref.compareAndSet(b,a,1,2)) throw new AssertionError("A-B-A setup");
                  if(ref.compareAndSet(a,new Object(),stamp,stamp+1)) throw new AssertionError("stale stamp accepted after ABA");
                  System.out.println("PASS exact-candidate locked-semantics stale-expected concurrent-retry no-lost-update overflow-fail-closed stamped-aba-detection");
              }
          }
          JAVA

          javac "$tmp/CasExamples.java" "$tmp/CasReviewerTest.java"
          reviewer_stdout="$(java -cp "$tmp" CasReviewerTest)"
          test "$reviewer_stdout" = 'PASS exact-candidate locked-semantics stale-expected concurrent-retry no-lost-update overflow-fail-closed stamped-aba-detection'

          javac "$out/CasExamples.java" "$out/CasExamplesTest.java"
          writer_stdout="$(java -cp "$out" CasExamplesTest)"
          test "$writer_stdout" = 'PASS locked-semantic-cas stale-expected concurrent-cas-loop no-lost-update stamped-aba-detection overflow-fail-closed'
          find "$out" -name '*.class' -delete

          REVIEW_STDOUT="$reviewer_stdout" WRITER_STDOUT="$writer_stdout" python3 - <<'PY'
          import hashlib,json,os,pathlib
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; date='2026-08-27'
          out=pathlib.Path(f'review/content_build/answer_batch_0039/{cid}')
          candidate=pathlib.Path(f'review/candidates/answers/{cid}.md'); digest=hashlib.sha256(candidate.read_bytes()).hexdigest()
          checks=[
            'the single exact candidate Java block compiles directly on Java 21',
            'synchronized semantic compare-and-set preserves compare-then-write behavior without being mislabeled lock-free',
            'concurrent AtomicInteger retry loop reaches the exact final count without lost updates',
            'stale expected values fail without overwriting a competing update',
            'Math.incrementExact overflow fails before shared state is modified',
            'AtomicStampedReference rejects a stale stamp after an A-B-A sequence'
          ]
          boundary_tests=[
            {'case':'semantic CAS expected match','expected':'update and true','actual':'verified','passed':True},
            {'case':'semantic CAS stale expected','expected':'no update and false','actual':'verified','passed':True},
            {'case':'6 x 15000 concurrent CAS-loop increments','expected':'90000 exactly','actual':'90000','passed':True},
            {'case':'stale AtomicInteger expected after competing update','expected':'CAS false and value remains 4','actual':'verified','passed':True},
            {'case':'Integer.MAX_VALUE increment','expected':'ArithmeticException and state unchanged','actual':'verified','passed':True},
            {'case':'A-B-A with stale stamp','expected':'stale stamped CAS rejected','actual':'rejected','passed':True}
          ]
          rv={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'extract the single exact candidate Java block, javac on Java 21, execute independent concurrency/boundary fixture','stdout':os.environ['REVIEW_STDOUT'],'writer_fixture_stdout':os.environ['WRITER_STDOUT'],'checks':checks,'boundary_tests':boundary_tests}
          (out/'reviewer_validation.json').write_text(json.dumps(rv,ensure_ascii=False,indent=2)+'\n')

          findings=[
            'The repository source preserves only the short request “CAS了解不？手写一个？” and does not specify whether “hand write” means a hardware/JVM primitive, a semantic simulation, or a CAS-based retry algorithm.',
            'The candidate handles that ambiguity explicitly: synchronized is labeled only as a mutual-exclusion semantic simulation, while the retry example is built on JDK AtomicInteger.compareAndSet rather than claiming unsynchronized Java can manufacture atomic compare-and-set.',
            'After the audit-driven revision, the answer contains one complete Java block instead of a method-only fragment; the exact candidate block independently compiles and passes stale-expected, concurrent-retry, no-lost-update and fail-closed overflow tests.',
            'The ABA discussion is bounded to value-only comparison and the stamped-reference mitigation is independently reproduced with an A-B-A sequence and stale stamp rejection.',
            'The answer now states retry-dependent time cost and O(1) auxiliary space, plus contention, retry side effects, compound-state and performance boundaries instead of claiming CAS is universally faster than locking.',
            'No personal production metrics or unverifiable project experience are fabricated.'
          ]
          scores={'facts_and_evidence':24,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-cas-20260827-v2','review_version':'cas.v2','decision':'pass','revision_round':1,'source_packet':['data/questions/questions.jsonl','note_tagged/682de771000000002301f55d.json','review/content_build/answer_batch_0039/source_inventory.json',str(candidate),'docs/refactor/09_answer_content_standard.md','Java SE 21 AtomicInteger API','Java SE 21 java.util.concurrent.atomic package specification','Java SE 21 AtomicStampedReference API','Java Language Specification §17.1 Synchronization',str(out/'reviewer_validation.json')],'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']}
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')

          evidence={
            'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,
            'writer':{'writer_id':'cas-source-bounded-writer-20260827-v1','writer_version':'xhs-answer-curator.v1'},
            'sources':[
              {'source_id':'primary-source','title':'Repository tagged interview source note','locator':'note_tagged/682de771000000002301f55d.json','source_type':'repository_structured_source','checked_at':date},
              {'source_id':'batch-inventory','title':'Frozen Batch 0039 source inventory','locator':'review/content_build/answer_batch_0039/source_inventory.json','source_type':'repository_source_record','checked_at':date},
              {'source_id':'jdk-atomic-package','title':'Java SE 21 java.util.concurrent.atomic package specification','locator':'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/atomic/package-summary.html','source_type':'official_documentation','checked_at':date},
              {'source_id':'jdk-atomic-integer','title':'Java SE 21 AtomicInteger API','locator':'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/atomic/AtomicInteger.html','source_type':'official_documentation','checked_at':date},
              {'source_id':'jdk-stamped','title':'Java SE 21 AtomicStampedReference API','locator':'https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/util/concurrent/atomic/AtomicStampedReference.html','source_type':'official_documentation','checked_at':date},
              {'source_id':'jls-sync','title':'Java Language Specification synchronization and monitors','locator':'https://docs.oracle.com/javase/specs/jls/se21/html/jls-17.html#jls-17.1','source_type':'official_specification_or_standard','checked_at':date},
              {'source_id':'writer-validation','title':'Writer deterministic CAS Java validation','locator':str(out/'code_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'reviewer-validation','title':'Independent exact-candidate CAS Java validation','locator':str(out/'reviewer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},
              {'source_id':'isolated-review','title':'Fresh isolated source-first CAS review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}
            ],
            'claims':[
              {'claim_id':'source-boundary','text':'The repository source asks only whether the candidate knows CAS and can hand-write it; it does not preserve a required implementation layer or API contract.','source_ids':['primary-source','batch-inventory','isolated-review'],'answer_locations':['核心结论','1 分钟版']},
              {'claim_id':'atomic-compare-set','text':'Java SE 21 AtomicInteger.compareAndSet atomically updates when the current value equals the expected value; the atomic package provides atomic variable classes intended for lock-free thread-safe programming on single variables.','source_ids':['jdk-atomic-package','jdk-atomic-integer','reviewer-validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','原理机制']},
              {'claim_id':'synchronized-boundary','text':'Java synchronized methods/statements use monitor mutual exclusion, so the synchronized example is a lock-based semantic simulation rather than a lock-free primitive implementation.','source_ids':['jls-sync','reviewer-validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节']},
              {'claim_id':'aba-stamp','text':'AtomicStampedReference atomically couples a reference with an integer stamp; the independent fixture demonstrates stale-stamp rejection after A-B-A.','source_ids':['jdk-stamped','writer-validation','reviewer-validation','isolated-review'],'answer_locations':['1 分钟版','关键细节','常见追问']},
              {'claim_id':'retry-behavior','text':'Independent exact-candidate execution verifies stale-expected failure, concurrent retry without lost updates, and overflow failure before state mutation for the candidate retry loop.','source_ids':['reviewer-validation','isolated-review'],'answer_locations':['3 分钟版','关键细节','原理机制','常见追问','易错点']}
            ],
            'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],
            'validation':{'command':rv['command'],'result':'pass','reported_stdout':rv['stdout'],'checks':checks,'boundary_tests':boundary_tests},
            'review_state':'independent_source_first_review_passed',
            'review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'revision_round':review['revision_round'],'independent':True,'decision':'pass','scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'promotion_blockers':review['promotion_blockers']}
          }
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')

          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0039.md'); text=task.read_text()
          old='- [x] `cq_q_9ffa48e1df8d78a08a74e14388301ebc` now has a source-bounded CAS candidate. It explicitly separates a `synchronized` semantic simulation from a real lock-free CAS loop backed by JDK `AtomicInteger.compareAndSet`, instead of claiming pure Java can manufacture a hardware/JVM atomic primitive. The Java fixture verifies conditional-update semantics, stale-expected rejection, concurrent retry without lost updates, stamped A-B-A detection and fail-closed overflow. Writer research is frozen; formal evidence/promotion remains blocked on isolated independent review.'
          new='- [x] `cq_q_9ffa48e1df8d78a08a74e14388301ebc` has a source-bounded CAS candidate that now passes isolated source-first review and complete evidence binding after an audit-driven revision made the Java answer directly compilable as one complete block. Independent exact-candidate Java 21 execution verifies lock-based semantic CAS, stale-expected rejection, concurrent AtomicInteger retry without lost updates, fail-closed overflow and stamped A-B-A detection. Formal promotion remains governed by repository human approval and real-review policy.'
          if old in text: text=text.replace(old,new,1)
          elif new not in text: text=text.rstrip()+'\n'+new+'\n'
          task.write_text(text)
          PY

      - name: Validate exact candidate evidence and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          npm run ci:answer:evidence
          npm run ci:answer:code

      - name: Commit isolated review
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/content_build/answer_batch_0039/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0039/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0039.md
          git commit -m 'review: pass batch 0039 CAS source-first'
          for attempt in 1 2 3; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
