name: Content Batch 0018 Linked List Equal Values Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate linked-list equal-value fixture
        working-directory: review/content_build/answer_batch_0018/cq_q_294cb4b4464c886329fda6efb26f3d5a
        shell: bash
        run: |
          set -euo pipefail
          javac LinkedListEqualValueMatches.java LinkedListEqualValueMatchesTest.java
          stdout="$(java LinkedListEqualValueMatchesTest)"
          echo "$stdout"
          test "$stdout" = "PASS fixed=7 randomized=5000 oracle=nested-loop duplicateSemantics=cartesian-pairs order=left-then-right"

      - name: Verify recorded validation contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('review/content_build/answer_batch_0018/cq_q_294cb4b4464c886329fda6efb26f3d5a/code_validation.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['schema_version'] == 'code_validation.v1'
          assert payload['canonical_id'] == 'cq_q_294cb4b4464c886329fda6efb26f3d5a'
          assert payload['result'] == 'pass'
          assert payload['stdout'] == 'PASS fixed=7 randomized=5000 oracle=nested-loop duplicateSemantics=cartesian-pairs order=left-then-right'
          PY

      - name: Verify source-first boundary artifact exists
        shell: bash
        run: |
          set -euo pipefail
          test -f review/content_build/answer_batch_0018/source_boundary_audit.md
          grep -Fq 'cq_q_294cb4b4464c886329fda6efb26f3d5a' review/content_build/answer_batch_0018/source_boundary_audit.md
