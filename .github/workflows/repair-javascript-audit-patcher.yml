name: Repair JavaScript Audit Patcher

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/repair-javascript-audit-patcher.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1
      - name: Repair patcher syntax and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          path=Path('.github/workflows/patch-answer-quality-javascript-audit.yml')
          text=path.read_text(encoding='utf-8')
          bad=".replace(/^          /gm, '')"
          if bad not in text:
              raise SystemExit('patcher syntax marker drifted')
          path.write_text(text.replace(bad,''),encoding='utf-8')
          PY
          rm .github/workflows/repair-javascript-audit-patcher.yml
          git diff --check
          git add .github/workflows/patch-answer-quality-javascript-audit.yml .github/workflows/repair-javascript-audit-patcher.yml
          git config user.name 'xhs-ci-repair-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'ci: fix JavaScript audit patch runner syntax'
          git push origin HEAD:master
