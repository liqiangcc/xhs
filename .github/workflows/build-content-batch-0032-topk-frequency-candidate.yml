name: Build Content Batch 0032 Top-K Frequency Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0032-topk-frequency-candidate.yml
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: content-batch-0032-topk-frequency-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_7319ee99a3dc9a9345e37e442a027695
  SOURCE_QID: 7319ee99a3dc9a9345e37e442a027695

jobs:
  build-candidate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Guard exact source and frozen boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "review/reports/ANSWER_BATCH_${BATCH}_SOURCE_PACKET.json"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const expected='算法基础：LeetCode 347. 前 K 个高频元素（变型：求第 2 个高频元素）。';
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          NODE

      - id: state
        shell: bash
        run: |
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          if [ -e "$candidate" ]; then
            test -e "$out/code_validation.json"
            test -e "$out/writer_research.json"
            echo 'pending=false' >> "$GITHUB_OUTPUT"
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Write source-bounded candidate and deterministic oracle fixture
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"; mkdir -p "$out"
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_7319ee99a3dc9a9345e37e442a027695","version":1,"status":"draft","updated_at":"2026-08-25","answer_type":"coding","quality_tier":"candidate"} -->
          # 前 K 个高频元素：频次表 + 大小为 K 的最小堆

          ## 核心结论

          这题先用哈希表统计每个元素出现次数，再维护一个 **大小最多为 K 的最小堆**：堆里始终保留当前看过元素中排名最高的 K 个，堆顶放“这 K 个里面最差的那个”，这样新元素只有在比堆顶更值得保留时才替换它。设数组长度为 `n`、不同元素数为 `m`，复杂度是 `O(n + m log k)`，空间是 `O(m + k)`。

          来源同时写了“LeetCode 347 前 K 个高频元素”和“变型：求第 2 个高频元素”，但没有给出相同频次时谁算第 1/第 2。为了让变型可执行，下面明确采用一个**答案侧确定性契约**：先按频次降序，再按数值升序排序；“第 2 个”指这个全序中的第 2 个元素。若面试官说相同频次视为并列名次，则问题语义已经变化，需要重新定义结果。

          ## 1 分钟版

          - 第一遍扫描用 `HashMap<Integer, Integer>` 得到 `value -> frequency`。
          - 堆最多保存 K 个元素，比较规则让“频次低”更差；频次相同时，数值更大更差，因为最终答案侧契约希望数值小的排前面。
          - 每个不同元素入堆；若堆大小超过 K，就弹出当前最差元素，因此处理完后堆中正好是全局前 K。
          - 最小堆弹出顺序是“从差到好”，所以最后反转一次，就得到频次降序、同频数值升序的确定顺序。
          - 求“第 2 个高频元素”可直接取 `topKFrequent(nums, 2)` 的第二项，但前提是至少有两个不同元素，并且先约定同频 tie-break。
          - 时间 `O(n + m log k)`；当 `k=2` 时堆操作是常数级，但哈希表仍需 `O(m)` 空间。

          ## 3 分钟版

          ```java
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.PriorityQueue;

          public final class TopKFrequent {
              private record Entry(int value, int frequency) {}

              // Answer-side deterministic order:
              // frequency descending, then value ascending.
              public static List<Integer> topKFrequent(int[] nums, int k) {
                  if (nums == null) throw new NullPointerException("nums");

                  Map<Integer, Integer> frequency = new HashMap<>();
                  for (int value : nums) {
                      frequency.merge(value, 1, Integer::sum);
                  }
                  if (k <= 0 || k > frequency.size()) {
                      throw new IllegalArgumentException("k must be in [1, distinctCount]");
                  }

                  Comparator<Entry> worstFirst = Comparator
                          .comparingInt(Entry::frequency)
                          .thenComparing(Comparator.comparingInt(Entry::value).reversed());
                  PriorityQueue<Entry> heap = new PriorityQueue<>(worstFirst);

                  for (Map.Entry<Integer, Integer> e : frequency.entrySet()) {
                      heap.offer(new Entry(e.getKey(), e.getValue()));
                      if (heap.size() > k) heap.poll();
                  }

                  List<Integer> result = new ArrayList<>(k);
                  while (!heap.isEmpty()) result.add(heap.poll().value());
                  Collections.reverse(result);
                  return result;
              }

              public static int secondMostFrequent(int[] nums) {
                  return topKFrequent(nums, 2).get(1);
              }
          }
          ```

          例如 `[1,1,1,2,2,3]`，频次是 `1->3, 2->2, 3->1`。当 `k=2` 时，最终保留 `1` 和 `2`，结果是 `[1,2]`，所以在上述确定性契约下第二个高频元素是 `2`。

          ## 关键细节

          - **为什么是最小堆**：我们只需要保留 K 个最好元素，因此堆顶应该快速暴露“当前 K 个里最差的一个”；新候选进来后超出 K 就把它弹掉。
          - **堆比较器与最终顺序相反**：最终想要“频次高优先、同频数值小优先”，所以堆顶的“最差”应是“频次低优先弹、同频数值大优先弹”。
          - **不能只比较频次就声称能求唯一的第 2 名**：如果两个值频次相同，标准 Top-K 语义可能允许任意返回；“第 2 个”必须额外定义并列规则或 tie-break。
          - **K 的边界**：本答案定义 `1 <= k <= distinctCount`；空数组因此没有合法的正 K。来源没有给 API，这属于答案侧接口约束。
          - **重复值正是统计对象**：哈希表的 key 是元素，value 是出现次数；不能先把数组去重后再丢失频次信息。
          - **另一种做法**：因为单个元素频次最多为 `n`，可以做 bucket：`frequency -> values`，理论上做到 `O(n + m)`，但需要 `O(n)` 桶空间；堆方案更直接适合 K 较小的场景。
          - **复杂度**：统计 `O(n)`；每个不同元素一次 `offer`，最多一次 `poll`，每次 `O(log k)`，所以是 `O(n + m log k)`；哈希表 `O(m)`、堆 `O(k)`。

          ## 原理机制

          正确性不变量是：处理完任意一部分不同元素后，堆中保存的是这些已处理元素里按目标排名最好的至多 K 个。加入一个新元素后，候选集合只比之前多一个；若大小不超过 K，全部保留即可；若变成 K+1 个，只要删除其中排名最差的元素，剩下的就仍是这 K+1 个里的最佳 K 个。比较器让堆顶恰好是这个“最差元素”，所以一次 `poll()` 就恢复不变量。

          这个不变量也解释了为什么不需要把全部 `m` 个元素按频次排序：完整排序需要 `O(m log m)`，而大小为 K 的堆只关心晋级线附近的 K 个元素，把排序成本降到 `O(m log k)`。

          ## 项目经验版

          来源是纯算法题，没有真实项目经历可还原，因此不虚构线上 Top-K 业务。工程里如果数据量大到无法一次放进内存，真正的难点会变成频次统计本身：可能需要分片聚合、流式 heavy-hitter 近似算法或外部存储。那已经是新的系统设计问题，不能把这里的单机 `HashMap + heap` 直接包装成生产结论。

          ## 常见追问

          - 问：为什么不用最大堆？答：最大堆适合把所有元素放进去后连续弹 K 次，但堆规模会到 `m`；大小固定为 K 的最小堆只保存候选边界，空间更小，复杂度是 `O(m log k)`。
          - 问：如果 K 接近不同元素总数呢？答：`log k` 接近 `log m`，堆的优势会减弱；完整排序或 bucket 方案可能更简单。
          - 问：相同频次时谁排前面？答：来源没有规定。为了让“第 2 个”有确定结果，本答案采用数值升序作为 tie-break；如果题目说并列或允许任意顺序，就应按新的契约处理。
          - 问：能做到线性时间吗？答：可以利用频次范围 `1..n` 做 bucket，统计后从高频桶向低频桶收集，时间可到 `O(n + m)`，代价是桶数组占 `O(n)` 空间。
          - 问：为什么不能直接维护两个计数最大的值而不建哈希表？答：数组是无序流，同一个值可能分散出现；在不知道每个值最终频次前，仅看当前局部计数无法安全决定全局前两名，仍需要某种频次状态。
          - 问：如果数据持续流入且 key 数非常大怎么办？答：精确答案需要维护足够的频次状态；若内存不能承受，就要引入分片/外存或近似 heavy-hitter 算法，并明确误差模型，这超出当前算法题边界。

          ## 易错点

          - 只写“哈希 + 堆”但没有定义堆顶究竟代表最好还是最差，比较器方向写反。
          - 把标准 Top-K 的“任意顺序可接受”直接套到“第 2 个高频元素”，忽略同频时名次不唯一。
          - 堆已经只保留 K 个元素，却忘记最终弹出顺序是从差到好，直接返回导致顺序反了。
          - 把复杂度写成 `O(n log k)` 而不说明实际堆操作次数按不同元素数 `m` 计算；更精确是 `O(n + m log k)`。
          - 用完整排序得到正确答案后却声称是堆方案，或把 `O(m log m)` 误写成 `O(m log k)`。
          - 为了处理 tie 擅自选择规则，却没有说明这是来源之外的答案侧契约。
          EOF

          cat > "$out/TopKFrequentFixture.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;
          import java.util.PriorityQueue;
          import java.util.Random;

          public final class TopKFrequentFixture {
              record Entry(int value, int frequency) {}

              static List<Integer> actual(int[] nums, int k) {
                  if (nums == null) throw new NullPointerException("nums");
                  Map<Integer,Integer> f = new HashMap<>();
                  for (int v : nums) f.merge(v, 1, Integer::sum);
                  if (k <= 0 || k > f.size()) throw new IllegalArgumentException("k");
                  Comparator<Entry> worstFirst = Comparator.comparingInt(Entry::frequency)
                          .thenComparing(Comparator.comparingInt(Entry::value).reversed());
                  PriorityQueue<Entry> heap = new PriorityQueue<>(worstFirst);
                  for (Map.Entry<Integer,Integer> e : f.entrySet()) {
                      heap.offer(new Entry(e.getKey(), e.getValue()));
                      if (heap.size() > k) heap.poll();
                  }
                  List<Integer> out = new ArrayList<>();
                  while (!heap.isEmpty()) out.add(heap.poll().value());
                  Collections.reverse(out);
                  return out;
              }

              static List<Integer> oracle(int[] nums, int k) {
                  if (nums == null) throw new NullPointerException("nums");
                  Map<Integer,Integer> f = new HashMap<>();
                  for (int v : nums) f.merge(v, 1, Integer::sum);
                  if (k <= 0 || k > f.size()) throw new IllegalArgumentException("k");
                  List<Integer> values = new ArrayList<>(f.keySet());
                  values.sort((a,b) -> {
                      int byFreq = Integer.compare(f.get(b), f.get(a));
                      return byFreq != 0 ? byFreq : Integer.compare(a,b);
                  });
                  return new ArrayList<>(values.subList(0, k));
              }

              static void check(int[] a, int k) {
                  List<Integer> x = actual(a,k), y = oracle(a,k);
                  if (!x.equals(y)) throw new AssertionError("actual="+x+" oracle="+y+" k="+k);
              }

              public static void main(String[] args) {
                  check(new int[]{1,1,1,2,2,3}, 2);
                  check(new int[]{4,4,3,3,2}, 2);
                  check(new int[]{-1,-1,-2,-2,-2,7}, 2);
                  check(new int[]{9}, 1);
                  boolean badZero=false,badTooLarge=false,badEmpty=false;
                  try { actual(new int[]{1},0); } catch (IllegalArgumentException e) { badZero=true; }
                  try { actual(new int[]{1},2); } catch (IllegalArgumentException e) { badTooLarge=true; }
                  try { actual(new int[]{},1); } catch (IllegalArgumentException e) { badEmpty=true; }
                  if(!badZero||!badTooLarge||!badEmpty) throw new AssertionError("invalid-k contract failed");

                  Random r = new Random(7319L);
                  int cases = 0;
                  for (int t=0; t<20000; t++) {
                      int n = 1 + r.nextInt(100);
                      int[] a = new int[n];
                      for (int i=0;i<n;i++) a[i]=r.nextInt(21)-10;
                      Map<Integer,Integer> distinct = new HashMap<>();
                      for(int v:a) distinct.merge(v,1,Integer::sum);
                      int k = 1 + r.nextInt(distinct.size());
                      check(a,k);
                      cases++;
                  }
                  System.out.println("PASS fixed-boundaries randomized=20000 oracle=full-sort deterministic-tie=frequency-desc-value-asc");
              }
          }
          JAVA

