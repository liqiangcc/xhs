name: Review Content Batch 0042 Min Swaps Sort String V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0042-min-swaps-sort-string-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-min-swaps-sort-string-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_ae26e919521a374b27e6632b2969aa13
  SOURCE_QID: ae26e919521a374b27e6632b2969aa13

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const exact='算法 7：交换字符串中的任意两个字符，求使其有序的最小操作次数';
          const raw=JSON.parse(fs.readFileSync('note_structured/67de17c2000000001a005fa3.json','utf8'));
          if(raw.questions?.[6]!==exact) throw new Error('source boundary drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error('ownership/type drifted');
          if(!(ctx.source_questions||[]).some(x=>x.question_id===qid&&x.original_question===exact)) throw new Error('exact source question missing');
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','互不相同','重复字符','任意位置交换','0 -> 3 -> 1 -> 2 -> 0','4-1=3']) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5) throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md)) throw new Error('fabricated experience risk');
          const block=md.match(/```java\n([\s\S]*?)\n```/);
          if(!block||!block[1].includes('minSwapsToSort')) throw new Error('candidate code missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');
          const sha=crypto.createHash('sha256').update(fs.readFileSync(`review/candidates/answers/${cid}.md`)).digest('hex');
          fs.writeFileSync('/tmp/candidate-sha',sha+'\n');
          fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_bfs_oracle',source_boundary:'arbitrary swaps to ordered string; comparator, duplicates, Unicode unit and language not frozen',reference_contract:'distinct Java UTF-16 char values sorted ascending',candidate_sha256:sha},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent BFS minimum-swap oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              static Map<String,Integer> distances(String sorted) {
                  Map<String,Integer> d=new HashMap<>(); ArrayDeque<String> q=new ArrayDeque<>(); d.put(sorted,0); q.add(sorted);
                  while(!q.isEmpty()) { String s=q.remove(); int cur=d.get(s); char[] a=s.toCharArray();
                      for(int i=0;i<a.length;i++) for(int j=i+1;j<a.length;j++) { char left=a[i],right=a[j]; a[i]=right;a[j]=left; String n=new String(a); a[i]=left;a[j]=right; if(!d.containsKey(n)){d.put(n,cur+1);q.add(n);} }
                  } return d;
              }
              public static void main(String[] args) {
                  long checked=0; if(Solution.minSwapsToSort("dcab")!=3) throw new AssertionError("corrected four-cycle must be 3");
                  for(int n=0;n<=7;n++) { StringBuilder b=new StringBuilder(); for(int i=0;i<n;i++) b.append((char)('a'+i)); Map<String,Integer> d=distances(b.toString()); int expected=1; for(int x=2;x<=n;x++) expected*=x; if(d.size()!=expected) throw new AssertionError("BFS coverage n="+n); for(var e:d.entrySet()){int got=Solution.minSwapsToSort(e.getKey());if(got!=e.getValue())throw new AssertionError("s="+e.getKey()+" got="+got+" bfs="+e.getValue());checked++;}}
                  try{Solution.minSwapsToSort("aab");throw new AssertionError("duplicates accepted");}catch(IllegalArgumentException expected){}
                  try{Solution.minSwapsToSort(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}
                  System.out.println("PASS bfs-state-space="+checked+" n=0..7 arbitrary-transpositions=exact corrected-dcab=3 duplicates=rejected null=rejected");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)"; echo "$stdout"
          grep -E '^PASS bfs-state-space=[0-9]+ n=0\.\.7 arbitrary-transpositions=exact corrected-dcab=3 duplicates=rejected null=rejected$' <<<"$stdout"
          echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0042/$cid"; sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs'); const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0042/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8')); if(pre.decision!=='pass_pending_bfs_oracle'||pre.candidate_sha256!==sha) throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8')); if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha) throw new Error('writer packet/hash drifted');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const boundaryTests=[{case:'all distinct permutations n=0..7',expected:'candidate equals exact BFS distance under arbitrary transpositions',passed:true},{case:'dcab',expected:'four-cycle requires exactly 3 swaps',passed:true},{case:'duplicate chars',expected:'explicitly rejected under stated reference contract',passed:true},{case:'null',expected:'explicit NullPointerException reference contract',passed:true}];
          const findings=['Source freezes only arbitrary character swaps plus ordered target and minimum operation count; comparator, duplicate semantics, character unit, and implementation language are not preserved.','Candidate makes a narrow explicit distinct-Java-char ascending reference contract and does not present it as source fact.','The corrected dcab example is a single four-cycle [3,2,0,1] and requires 3 swaps; the earlier pre-staging 2-swap assertion was caught by writer validation and never committed as candidate content.','Independent BFS over the full arbitrary-transposition state graph for every distinct permutation of lengths 0 through 7 exactly matches the candidate result.','Duplicate-character ambiguity, adjacent-swap distinction, UTF-16 char boundary, complexity, and no-fabrication project boundary are explicit.'];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; exhaustive BFS arbitrary-transposition oracle n=0..7',stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0042-min-swaps-20260827-v2',review_version:'batch-0042.min-swaps.v2',decision:'pass',revision_round:1,source_packet:['note_structured/67de17c2000000001a005fa3.json','review/content_build/answer_batch_0042/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']}; fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0042-min-swaps-builder-v2',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving min-swaps prompt',locator:'note_structured/67de17c2000000001a005fa3.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0042 frozen source inventory',locator:'review/content_build/answer_batch_0042/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Corrected writer constructive min-swaps validation',locator:`${out}/min_swaps_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent exhaustive BFS transposition oracle',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Min-swaps source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source asks for minimum arbitrary character swaps needed to order the string without preserving comparator, duplicate, Unicode-unit or language constraints.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'For the explicit distinct-Java-char ascending contract, cycle decomposition returns the exact minimum; exhaustive independent BFS validates every distinct permutation of sizes 0 through 7 and confirms dcab requires 3 swaps.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'exhaustive BFS arbitrary-transposition oracle n=0..7',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:boundaryTests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'}; fs.mkdirSync('review/evidence',{recursive:true}); fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          git add "review/content_build/answer_batch_0042/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0042/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name xhs-review-bot; git config user.email '43640935+liqiangcc@users.noreply.github.com'; git commit -m 'review: pass batch 0042 min-swaps string candidate source-first'
          for attempt in 1 2 3; do git fetch origin "$CONTENT_BRANCH"; if ! git rebase "origin/$CONTENT_BRANCH"; then git rebase --abort || true; exit 1; fi; if git push origin "HEAD:$CONTENT_BRANCH"; then exit 0; fi; sleep 5; done; exit 1
