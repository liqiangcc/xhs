name: Fix Content Batch 0042 Dutch Flag Writer Seed

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-content-batch-0042-dutch-flag-order-seed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-content-batch-0042-dutch-flag-order-seed
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Repair Java long seed and push
        shell: bash
        run: |
          set -euo pipefail
          target='.github/workflows/build-content-batch-0042-dutch-flag-order.yml'
          grep -F 'new Random(0x444E46574C)' "$target"
          sed -i 's/new Random(0x444E46574C)/new Random(0x444E46574CL)/' "$target"
          grep -F 'new Random(0x444E46574CL)' "$target"
          git diff --check
          git config user.name Liqiangcc
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "$target"
          git commit -m 'ci: fix batch 0042 dutch-flag writer random seed'
          git push origin HEAD:master
