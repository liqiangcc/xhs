name: Build Content Batch 0034 KMP Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0034-kmp-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-kmp-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7e01e07cd1fe6acda1a2206768766697
  SOURCE_QID: 7e01e07cd1fe6acda1a2206768766697
  SOURCE_NOTE: note_tagged/67e55f22000000001c01e146.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Freeze source boundary and ownership
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,note=process.env.SOURCE_NOTE,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`;
          const expected='算法：实现子串匹配（KMP 算法或暴力搜索）。';
          const tagged=JSON.parse(fs.readFileSync(note,'utf8')); const src=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected||src.question_type!=='算法手撕_Coding') throw new Error('source wording/type drifted');
          if(src.domain?.l1!=='算法'||src.domain?.l2!=='字符串') throw new Error('source domain drifted');
          const ctx=JSON.parse(fs.readFileSync(path.join(out,'context.json'),'utf8')); if(!ctx.ok||ctx.answer_type!=='coding') throw new Error('canonical context/type drifted');
          const library=(ctx.source_questions||[]).find(x=>x.original_question===expected); if(!library||!ctx.canonical.question_ids.includes(library.question_id)) throw new Error('Question -> Canonical mapping drifted');
          if(fs.existsSync(`review/candidates/answers/${cid}.md`)) throw new Error('candidate already exists; refuse overwrite');
          fs.writeFileSync(path.join(out,'source_mapping.json'),JSON.stringify({schema_version:'answer_source_mapping.v1',canonical_id:cid,library_question_id:library.question_id,note_question_id:qid,note_path:note,original_question:expected,question_type:src.question_type,domain:src.domain,verified_at:'2026-08-26'},null,2)+'\n');
          const boundary='review/content_build/answer_batch_0034/source_boundary_audit.md'; let text=fs.existsSync(boundary)?fs.readFileSync(boundary,'utf8'):'# Answer Batch 0034 Source Boundary Audit\n'; const heading=`## ${cid}`;
          if(!text.includes(heading)) text += `\n${heading}\n\n- Exact repository source: ${note}, question ${qid}.\n- Preserved wording: ${expected}\n- Preserved intent: implement substring matching, with KMP or brute-force search accepted by the source wording.\n- Not preserved: API name, null-input contract, character encoding/code-point semantics, maximum lengths, or whether all matches versus first match are required.\n- Executable candidate policy: non-null Java String inputs, return the first UTF-16 char index or -1, and return 0 for an empty pattern; use KMP as the primary implementation and explain brute force as the simpler alternative.\n- Promotion remains blocked until isolated review, evidence gate, required human approval, and real-review policy are satisfied.\n`;
          fs.writeFileSync(boundary,text);
          NODE

      - name: Write source-bounded KMP candidate and exact fixture
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"
          cat > "review/candidates/answers/$cid.md" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_7e01e07cd1fe6acda1a2206768766697","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # 实现子串匹配：KMP 与暴力搜索

          ## 核心结论

          来源允许 KMP 或暴力搜索。这里先明确可执行契约：输入是两个非 `null` 的 Java `String`，返回 pattern 在 text 中**第一次出现**的 UTF-16 `char` 下标；找不到返回 -1；空 pattern 返回 0。暴力法从每个可能起点重新比较，最坏 O(nm)；KMP 预处理 pattern 的最长相等真前后缀数组 `lps`，失配时复用已经匹配的信息，让 text 指针不回退，时间 O(n+m)、额外空间 O(m)。

          ## 1 分钟版

          - `lps[i]` 表示 `pattern[0..i]` 的“最长真前缀 = 后缀”的长度。
          - 匹配时 `i` 指向 text、`j` 指向 pattern；字符相等就同时前进。
          - 失配且 `j > 0` 时，不把 `i` 退回起点，而令 `j = lps[j-1]`，尝试复用已经匹配后缀对应的前缀。
          - 只有 `j == 0` 仍失配时才推进 `i`。
          - 当 `j == pattern.length()`，首次匹配起点就是 `i - j`；因为 text 的 `i` 单调向前，所以这是第一次出现位置。

          ## 3 分钟版

          ```java
          public final class KmpSearch {
              public static int indexOf(String text, String pattern) {
                  if (text == null || pattern == null) {
                      throw new IllegalArgumentException("text and pattern must be non-null");
                  }
                  if (pattern.isEmpty()) return 0;

                  int[] lps = buildLps(pattern);
                  int i = 0;
                  int j = 0;
                  while (i < text.length()) {
                      if (text.charAt(i) == pattern.charAt(j)) {
                          i++;
                          j++;
                          if (j == pattern.length()) return i - j;
                      } else if (j > 0) {
                          j = lps[j - 1];
                      } else {
                          i++;
                      }
                  }
                  return -1;
              }

              private static int[] buildLps(String pattern) {
                  int[] lps = new int[pattern.length()];
                  for (int i = 1, len = 0; i < pattern.length();) {
                      if (pattern.charAt(i) == pattern.charAt(len)) {
                          lps[i++] = ++len;
                      } else if (len > 0) {
                          len = lps[len - 1];
                      } else {
                          lps[i++] = 0;
                      }
                  }
                  return lps;
              }
          }
          ```

          例如 `text = "abababca"`、`pattern = "ababca"`。前面已经匹配到较长前缀后发生失配，KMP 不需要把 text 指针重新拉回候选起点；`lps` 告诉我们当前已匹配串的某个后缀本身又是 pattern 的前缀，于是只回退 pattern 指针继续比较。

          ## 关键细节

          - **`lps` 不是“相同字符个数”**：它要求前缀与后缀连续且内容完全相等，并且是真前缀，不能等于整个当前串。
          - **为什么是线性**：构造 `lps` 时 `i` 只向前，`len` 回退沿已计算的 lps 链；匹配时 text 的 `i` 从不回退。整体回退次数被前进次数摊销，因此 O(n+m)。
          - **空 pattern**：当前答案明确返回 0，与“空串在开头匹配”的常见 `indexOf` 契约一致；这是答案侧 API 约定，不冒充来源额外要求。
          - **字符语义**：Java `String.charAt` 按 UTF-16 code unit 比较，所以返回的是 `char` 下标。若题目要求 Unicode code point 或 grapheme cluster，需要改契约与实现。
          - **暴力法**：对每个起点 `s`，从 `j=0` 开始比较 `text[s+j]` 与 `pattern[j]`；代码更短、短输入可能足够，但重复前缀场景会反复比较。
          - **首次匹配**：本实现一旦 `j == m` 就立即返回，因此不是“返回全部出现位置”的接口。

          ## 原理机制

          假设已经匹配了 pattern 的前 `j` 个字符，却在下一个字符失配。已匹配内容的某个后缀如果同时也是 pattern 的前缀，那么这个后缀不需要和 text 再比较一次；令 `j = lps[j-1]` 就把 pattern 移到仍可能成立的最长位置。若这个位置仍失配，再沿 lps 链继续缩短。KMP 的核心就是把“已知相等关系”编码进 lps，避免 text 回溯。

          ## 项目经验版

          来源没有真实项目、文本规模或延迟指标，不能虚构线上收益。实际选择时先看输入规模、pattern 复用次数和语言库能力：一次很短的查找直接用标准库通常最清晰；如果面试要求手写或需要解释最坏复杂度，再实现 KMP。若同一个 pattern 要匹配大量文本，可以复用已构建的 lps；若需求变成多 pattern 搜索，则应重新评估 Aho-Corasick 等不同问题模型。

          ## 常见追问

          - 问：为什么失配时用 `lps[j-1]`，不是 `lps[j]`？答：当前失败发生在 pattern[j]，真正已经匹配成功的是 `[0,j)`，所以要查询最后一个已匹配字符 `j-1` 对应的最长可复用前后缀。
          - 问：KMP 会不会漏掉重叠匹配？答：当前接口只返回第一次匹配，不讨论后续；如果要找全部匹配，命中后可把 `j` 回退到 `lps[j-1]` 继续扫描，从而保留重叠可能。
          - 问：暴力法一定很差吗？答：不是。它实现简单、常数小；区别在最坏复杂度保证，重复前缀会让暴力法重复比较，而 KMP 保证 O(n+m)。
          - 问：`lps` 怎么自己检查？答：逐位置写出 `pattern[0..i]` 的所有真前缀与后缀，取最长相等长度，再和代码结果对照；像 `aaaa` 会得到 `[0,1,2,3]`。
          - 问：为什么返回 UTF-16 下标？答：这是本 Java API 使用 `charAt` 的明确边界；来源没有规定 code point 语义，不能暗中把两种索引混为一谈。

          ## 易错点

          - 构造 `lps` 失配时直接把 `len` 清零，漏掉更短的可复用前后缀。
          - 匹配失配且 `j>0` 时同时推进 `i`，从而跳过合法匹配。
          - 忘记处理空 pattern，随后访问 `pattern.charAt(0)` 越界。
          - 把 Java `char` 下标描述成 Unicode code point 下标。
          - 只背 O(n+m)，却解释不出 text 指针为什么不回退以及 lps 回退如何摊销。
          EOF

          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID; const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8'); const fence=md.match(/```java\n([\s\S]*?)\n```/); if(!fence) throw new Error('Java fence missing'); fs.writeFileSync(`review/content_build/answer_batch_0034/${cid}/KmpSearch.java`,fence[1].trim()+'\n');
          NODE
          cat > "$out/KmpSearchTest.java" <<'JAVA'
          import java.util.Random;

          public final class KmpSearchTest {
              private static void check(String text, String pattern) {
                  int actual = KmpSearch.indexOf(text, pattern);
                  int expected = text.indexOf(pattern);
                  if (actual != expected) throw new AssertionError("text="+text+" pattern="+pattern+" expected="+expected+" actual="+actual);
              }
              public static void main(String[] args) {
                  check("", ""); check("", "a"); check("a", ""); check("aaaaa", "aaa"); check("abababca", "ababca"); check("mississippi", "issip"); check("abc", "abcd");
                  Random r = new Random(20260826L);
                  for (int round=0; round<5000; round++) {
                      int n=r.nextInt(60), m=r.nextInt(20); StringBuilder t=new StringBuilder(), p=new StringBuilder();
                      for(int i=0;i<n;i++) t.append((char)('a'+r.nextInt(4)));
                      for(int i=0;i<m;i++) p.append((char)('a'+r.nextInt(4)));
                      check(t.toString(),p.toString());
                  }
                  boolean threw=false; try { KmpSearch.indexOf(null,"a"); } catch(IllegalArgumentException e){threw=true;} if(!threw) throw new AssertionError("null text contract");
                  System.out.println("PASS edges overlap fallback absent empty randomized-5000 null-contract exact-fence");
              }
          }
          JAVA

      - name: Run JDK 21 fixture and freeze writer evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0034/$cid"; mkdir -p "$out/classes"
          javac -d "$out/classes" "$out/KmpSearch.java" "$out/KmpSearchTest.java"
          stdout="$(java -cp "$out/classes" KmpSearchTest)"; test "$stdout" = 'PASS edges overlap fallback absent empty randomized-5000 null-contract exact-fence'
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path'),cid=process.env.CANONICAL_ID,out=`review/content_build/answer_batch_0034/${process.env.CANONICAL_ID}`; const mapping=JSON.parse(fs.readFileSync(path.join(out,'source_mapping.json'),'utf8'));
          fs.writeFileSync(path.join(out,'code_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:'2026-08-26',command:'javac exact KMP fence + deterministic tests && java KmpSearchTest',stdout:process.env.STDOUT,checks:['empty and absent patterns','overlapping/repeated-prefix examples','fallback-heavy examples','5000 deterministic randomized cases against String.indexOf','null contract']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-26',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Exact repository KMP/substring question and boundary audit',locator:`${mapping.note_path} + ${out}/source_mapping.json + review/content_build/answer_batch_0034/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:'2026-08-26'},{source_id:'fixture',title:'Deterministic JDK 21 KMP exact-fence validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-26'}],claims:[{claim_id:'source-boundary',text:'The source requests substring matching and explicitly allows KMP or brute force, without preserving API/null/Unicode/all-match details.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','项目经验版']},{claim_id:'implementation',text:'The exact candidate KMP implementation matches Java first-occurrence String.indexOf semantics on fixed edge cases and 5000 deterministic randomized ASCII cases under the stated contract.',source_ids:['fixture'],answer_locations:['3 分钟版','关键细节','原理机制']},{claim_id:'complexity',text:'The candidate explains the no-text-backtracking mechanism and lps fallback that give KMP O(n+m) time and O(m) extra space.',source_ids:['repository-source','fixture'],answer_locations:['核心结论','1 分钟版','关键细节','原理机制']}],source_question_coverage:[{question_id:mapping.library_question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md'; let t=fs.readFileSync(task,'utf8'); const p='- KMP canonical `'+cid+'` has a source-bounded first-match candidate, exact Java fence, deterministic edge/randomized validation, and writer evidence; isolated review and promotion gates remain pending.'; if(!t.includes(p)) t=t.trimEnd()+'\n'+p+'\n'; fs.writeFileSync(task,t);
          NODE

      - name: Commit verified candidate if branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"; remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"; base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced: $base_head -> $remote_head; discard local mutation."; exit 0; fi
          git add review/candidates/answers/"$CANONICAL_ID".md review/content_build/answer_batch_0034 tasks/answer-batches/TASK-20260711-0313-answer-batch-0034.md
          git diff --cached --check
          git config user.name xhs-content-builder; git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: build batch 0034 KMP candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
