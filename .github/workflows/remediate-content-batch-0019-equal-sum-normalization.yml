name: Remediate Content Batch 0019 Equal-Sum Normalization

# Guarded one-off normalization. The push trigger is intentionally limited to this
# workflow file; if the preceding source-unrecoverable slice has not landed yet,
# this job exits without touching the content branch and can be safely retriggered.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/remediate-content-batch-0019-equal-sum-normalization.yml

permissions:
  contents: write

jobs:
  normalize:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - name: Check prerequisite remediation slice
        id: prereq
        shell: bash
        run: |
          set -euo pipefail
          task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0019.md'
          if grep -Fq 'Four source-unrecoverable singleton Questions are excluded without inventing coding contracts' "$task"; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Prerequisite source-unrecoverable slice is present.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Prerequisite source-unrecoverable slice has not landed; guarded no-op.'
          fi

      - name: Setup Node
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java 21
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Go
        if: steps.prereq.outputs.ready == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Normalize equal-sum Question and Canonical ownership
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import pathlib
          import re

          ROOT = pathlib.Path('.')
          OLD_QID = '2f278e6b489feb680f8b173047815566'
          CANONICAL_ID = 'cq_q_2f278e6b489feb680f8b173047815566'
          OLD_TEXT = '算法：判断一个数组能否拆分成两个和相等的子数组。'
          NEW_TEXT = '给一个数组判断能否拆成两个数组，这两个数组的元素和相等'
          NEW_TITLE = '算法：给一个数组判断能否拆成两个数组，使两个数组的元素和相等。'
          NOTE_PATH = ROOT / 'note_tagged/68c80460000000001d029216.json'
          CANONICAL_PATH = ROOT / 'data/questions/canonical_questions.jsonl'
          QUESTION_PATH = ROOT / 'data/questions/questions.jsonl'
          AUDIT_PATH = ROOT / 'config/question_validity_audit.json'
          ANSWER_PATH = ROOT / f'review/answers/{CANONICAL_ID}.md'

          def normalize(text: str) -> str:
              return re.sub(r'[^\w\u4e00-\u9fa5]', '', str(text).lower())

          def qid(text: str) -> str:
              return hashlib.md5(normalize(text).encode('utf-8')).hexdigest()

          def read_json(path: pathlib.Path):
              return json.loads(path.read_text(encoding='utf-8'))

          def write_json(path: pathlib.Path, value) -> None:
              path.write_text(json.dumps(value, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          def read_jsonl(path: pathlib.Path):
              return [json.loads(line) for line in path.read_text(encoding='utf-8').splitlines() if line.strip()]

          def write_jsonl(path: pathlib.Path, rows) -> None:
              path.write_text(''.join(json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(',', ':')) + '\n' for row in rows), encoding='utf-8')

          NEW_QID = qid(NEW_TEXT)
          if NEW_QID != '603d950161a66de0191f24236561b8df':
              raise SystemExit(f'unexpected normalized question id: {NEW_QID}')

          note = read_json(NOTE_PATH)
          matches = [q for q in note.get('tagged_questions', []) if q.get('question_id') in {OLD_QID, NEW_QID}]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one old/new tagged Question, got {len(matches)}')
          tagged = matches[0]
          if tagged.get('question_id') == OLD_QID:
              if tagged.get('original_question') != OLD_TEXT:
                  raise SystemExit(f'old tagged Question text drifted: {tagged.get("original_question")!r}')
              tagged['question_id'] = NEW_QID
              tagged['original_question'] = NEW_TEXT
          elif tagged.get('original_question') != NEW_TEXT:
              raise SystemExit(f'new tagged Question text drifted: {tagged.get("original_question")!r}')
          write_json(NOTE_PATH, note)

          questions = read_jsonl(QUESTION_PATH)
          old_rows = [row for row in questions if row.get('question_id') == OLD_QID]
          new_rows = [row for row in questions if row.get('question_id') == NEW_QID]
          if old_rows and new_rows:
              raise SystemExit('both old and normalized Question ids already exist')
          source_row = (old_rows or new_rows)
          if len(source_row) != 1:
              raise SystemExit(f'expected exactly one old/new Question projection, got {len(source_row)}')
          source_row = source_row[0]
          if source_row.get('source_note_id') != '68c80460000000001d029216':
              raise SystemExit(f'Question source note drifted: {source_row.get("source_note_id")}')
          source_index = source_row.get('source_question_index')

          canonicals = read_jsonl(CANONICAL_PATH)
          canonical_matches = [row for row in canonicals if row.get('canonical_id') == CANONICAL_ID]
          if len(canonical_matches) != 1:
              raise SystemExit(f'expected singleton Canonical {CANONICAL_ID}, got {len(canonical_matches)}')
          canonical = canonical_matches[0]
          owned = list(canonical.get('question_ids') or [])
          if owned == [OLD_QID]:
              canonical['question_ids'] = [NEW_QID]
          elif owned != [NEW_QID]:
              raise SystemExit(f'Canonical ownership drifted: {owned}')
          canonical['canonical_title'] = NEW_TITLE
          canonical['aliases'] = [NEW_TITLE]
          write_jsonl(CANONICAL_PATH, sorted(canonicals, key=lambda row: row['canonical_id']))

          audit = read_json(AUDIT_PATH)
          decisions = list(audit.get('decisions', []))
          audit_matches = [d for d in decisions if d.get('source_note_id') == source_row['source_note_id'] and d.get('source_question_index') == source_index]
          if len(audit_matches) != 1:
              raise SystemExit(f'expected one validity-audit decision for source ref, got {len(audit_matches)}')
          decision = audit_matches[0]
          if decision.get('decision') != 'include':
              raise SystemExit(f'normalized Question must remain included, got {decision.get("decision")}')
          if decision.get('question_id') == OLD_QID:
              decision['question_id'] = NEW_QID
              decision['original_question'] = NEW_TEXT
          elif decision.get('question_id') != NEW_QID or decision.get('original_question') != NEW_TEXT:
              raise SystemExit('validity-audit decision drifted from old/new expected state')
          audit['audited_at'] = '2026-08-23'
          audit['include_count'] = sum(1 for d in decisions if d.get('decision') == 'include')
          audit['exclude_count'] = sum(1 for d in decisions if d.get('decision') == 'exclude')
          write_json(AUDIT_PATH, audit)

          answer = ANSWER_PATH.read_text(encoding='utf-8')
          if OLD_TEXT in answer:
              answer = answer.replace(OLD_TEXT, NEW_TITLE)
          elif NEW_TITLE not in answer:
              raise SystemExit('active Answer contains neither old nor normalized title')
          ANSWER_PATH.write_text(answer, encoding='utf-8')

          task_path = ROOT / 'tasks/answer-batches/TASK-20260711-0313-answer-batch-0019.md'
          task = task_path.read_text(encoding='utf-8')
          old_line = '- `cq_q_2f278e6b489feb680f8b173047815566` — coding; normalization required because source says partition into two arrays/groups of equal sum while current `子数组` wording can incorrectly imply contiguity.'
          new_line = '- `cq_q_2f278e6b489feb680f8b173047815566` — coding; normalized to the repository-preserved two-array/two-group equal-sum contract; contiguous `子数组` wording is removed. Candidate generation remains required.'
          if old_line in task:
              task = task.replace(old_line, new_line)
          elif new_line not in task:
              raise SystemExit('batch task normalization line drifted')
          progress_line = '- [x] `cq_q_2f278e6b489feb680f8b173047815566` is normalized from misleading contiguous `子数组` wording to the source-preserved two-array equal-sum partition contract; Question hash ownership, Canonical title/alias, validity-audit binding, and active Answer title are kept consistent.'
          if progress_line not in task:
              task = task.rstrip() + '\n' + progress_line + '\n'
          task_path.write_text(task, encoding='utf-8')

          audit_doc_path = ROOT / 'review/content_build/answer_batch_0019/source_boundary_audit.md'
          audit_doc = audit_doc_path.read_text(encoding='utf-8')
          old_heading = '### `cq_q_2f278e6b489feb680f8b173047815566` — normalization required'
          new_heading = '### `cq_q_2f278e6b489feb680f8b173047815566` — normalized; candidate-qualified'
          old_body = 'Repository source says `给一个数组判断能否拆成两个数组，这两个数组的元素和相等`. The current title says `两个和相等的子数组`, which can imply contiguous subarrays and therefore narrows the problem beyond the source. Normalize the contract to the recoverable partition/group meaning, or retain the ambiguity explicitly; do not choose contiguous-subarray semantics without evidence.'
          new_body = 'Repository source says `给一个数组判断能否拆成两个数组，这两个数组的元素和相等`. The Question and Canonical are normalized to that recoverable partition/group meaning, and the misleading contiguous `子数组` wording is removed. A candidate may now implement equal-sum partition, but input constraints, non-empty-group requirements, integer sign/range, and concrete API remain implementation assumptions unless separately sourced.'
          if old_heading in audit_doc:
              audit_doc = audit_doc.replace(old_heading, new_heading)
          elif new_heading not in audit_doc:
              raise SystemExit('source-boundary heading drifted')
          if old_body in audit_doc:
              audit_doc = audit_doc.replace(old_body, new_body)
          elif new_body not in audit_doc:
              raise SystemExit('source-boundary body drifted')
          audit_doc_path.write_text(audit_doc, encoding='utf-8')

          print(f'Normalized {CANONICAL_ID}: {OLD_QID} -> {NEW_QID}')
          PY

      - name: Regenerate Question and index projections
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest

      - name: Verify full repository gates
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit normalization to content branch
        if: steps.prereq.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'Equal-sum normalization already applied; no commit needed.'
            exit 0
          fi
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "content: normalize batch 0019 equal-sum partition question"
          git push origin HEAD:content/quality-completion
