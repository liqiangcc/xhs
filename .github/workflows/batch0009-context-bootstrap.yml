name: Batch 0009 Context Bootstrap

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/batch0009-context-bootstrap.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate fixed source contexts
        shell: bash
        run: |
          set -euo pipefail
          ids=(
            cq_online_migration_3302e67d
            cq_short_url_c0218e46
            cq_arch_layering_02c49d25
            cq_coroutine_878b831f
          )
          for id in "${ids[@]}"; do
            dir="review/content_build/answer_batch_0009/$id"
            mkdir -p "$dir"
            node scripts/xhs.js answer context --canonical-id "$id" --noManifest > "$dir/context.json"
            node -e 'const fs=require("fs"); const p=process.argv[1]; const v=JSON.parse(fs.readFileSync(p,"utf8")); if(!v.ok || v.canonical?.canonical_id !== process.argv[2]) process.exit(1)' "$dir/context.json" "$id"
          done

      - name: Commit generated contexts and remove bootstrap workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-completion-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git rm .github/workflows/batch0009-context-bootstrap.yml
          git add review/content_build/answer_batch_0009
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "review: bootstrap remaining batch 0009 contexts"
          git push origin HEAD:content/quality-completion
