name: Review Content Batch 0032 Top-K Frequency Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0032-topk-frequency-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0032-topk-frequency-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_7319ee99a3dc9a9345e37e442a027695
  SOURCE_QID: 7319ee99a3dc9a9345e37e442a027695
  CANDIDATE_BLOB_SHA: 2c32aa995466fb6728cc0f32f434d1f76d89cb28

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard, compile actual candidate, and independent exhaustive oracle
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          test -f "$out/code_validation.json"
          test -f "$out/writer_research.json"
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH;
          const expected='算法基础：LeetCode 347. 前 K 个高频元素（变型：求第 2 个高频元素）。';
          const packet=JSON.parse(fs.readFileSync(`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,'utf8'));
          const entry=(packet.canonicals||[]).find(x=>x.canonical_id===cid);
          if(!entry) throw new Error('source packet member missing');
          const hits=entry.source_hits||[];
          if(hits.length!==1||hits[0]?.match_basis!=='question_id') throw new Error('source identity is not exact singleton');
          const q=hits[0].tagged_question;
          if(q?.question_id!==qid||q?.original_question!==expected||q?.is_valid_for_library!==true) throw new Error('source drifted');
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          const text=fs.readFileSync(candidate,'utf8');
          const required=['HashMap<Integer, Integer>','PriorityQueue<Entry>','heap.size() > k','Collections.reverse(result)','O(n + m log k)','频次降序','数值升序'];
          for(const needle of required) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/ProblemSpec|按本题约束填写|长尾复习底稿/.test(text)) throw new Error('placeholder/template residue detected');
          const m=text.match(/```java\s*\n([\s\S]*?)\n```/);
          if(!m) throw new Error('candidate Java block missing');
          fs.writeFileSync('/tmp/TopKFrequent.java',m[1]);
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/TopKFrequent.java
          cat >/tmp/TopKFrequentIndependentTest.java <<'JAVA'
          import java.util.ArrayList;
          import java.util.HashMap;
          import java.util.List;
          import java.util.Map;

          public final class TopKFrequentIndependentTest {
              private static List<Integer> oracle(int[] nums, int k) {
                  if (nums == null) throw new NullPointerException("nums");
                  Map<Integer,Integer> f = new HashMap<>();
                  for (int v : nums) f.merge(v, 1, Integer::sum);
                  if (k <= 0 || k > f.size()) throw new IllegalArgumentException("k");
                  List<Integer> values = new ArrayList<>(f.keySet());
                  values.sort((a,b) -> {
                      int c = Integer.compare(f.get(b), f.get(a));
                      return c != 0 ? c : Integer.compare(a,b);
                  });
                  return new ArrayList<>(values.subList(0,k));
              }

              private static void check(int[] nums) {
                  Map<Integer,Integer> f = new HashMap<>();
                  for (int v : nums) f.merge(v,1,Integer::sum);
                  for (int k=1;k<=f.size();k++) {
                      List<Integer> actual = TopKFrequent.topKFrequent(nums,k);
                      List<Integer> expected = oracle(nums,k);
                      if (!actual.equals(expected)) throw new AssertionError("k="+k+" actual="+actual+" expected="+expected);
                  }
                  if (f.size() >= 2) {
                      int expectedSecond = oracle(nums,2).get(1);
                      int actualSecond = TopKFrequent.secondMostFrequent(nums);
                      if (actualSecond != expectedSecond) throw new AssertionError("second actual="+actualSecond+" expected="+expectedSecond);
                  }
              }

              private static long enumerate(int[] a, int pos) {
                  if (pos == a.length) { check(a.clone()); return 1L; }
                  long cases=0;
                  for (int v=-2;v<=2;v++) { a[pos]=v; cases += enumerate(a,pos+1); }
                  return cases;
              }

              public static void main(String[] args) {
                  check(new int[]{1,1,1,2,2,3});
                  check(new int[]{4,4,3,3,2});
                  check(new int[]{-1,-1,-2,-2,-2,7});
                  check(new int[]{9});
                  boolean nullRejected=false,zeroRejected=false,tooLargeRejected=false,emptyRejected=false;
                  try { TopKFrequent.topKFrequent(null,1); } catch (NullPointerException e) { nullRejected=true; }
                  try { TopKFrequent.topKFrequent(new int[]{1},0); } catch (IllegalArgumentException e) { zeroRejected=true; }
                  try { TopKFrequent.topKFrequent(new int[]{1},2); } catch (IllegalArgumentException e) { tooLargeRejected=true; }
                  try { TopKFrequent.topKFrequent(new int[]{},1); } catch (IllegalArgumentException e) { emptyRejected=true; }
                  if(!nullRejected||!zeroRejected||!tooLargeRejected||!emptyRejected) throw new AssertionError("invalid-input contract failed");
                  long cases=0;
                  for(int n=1;n<=7;n++) cases += enumerate(new int[n],0);
                  if(cases != 97655L) throw new AssertionError("cases="+cases);
                  System.out.println("PASS actual-candidate exhaustive=97655 alphabet=-2..2 all-k plus-boundaries oracle=full-sort deterministic-tie=frequency-desc-value-asc");
              }
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/TopKFrequentIndependentTest.java
          independent_stdout="$(java -cp /tmp TopKFrequentIndependentTest)"
          test "$independent_stdout" = 'PASS actual-candidate exhaustive=97655 alphabet=-2..2 all-k plus-boundaries oracle=full-sort deterministic-tie=frequency-desc-value-asc'
          echo "$independent_stdout"

      - name: Write independent source-first review evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`,out=`review/content_build/answer_batch_${batch}/${cid}`;
          const sha=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const validationPath=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const tests=[
            {case:'standard top-k example',expected:'[1,2] for [1,1,1,2,2,3], k=2 under explicit deterministic order',actual:'pass',passed:true},
            {case:'equal-frequency tie',expected:'smaller numeric value ranks first only because answer-side tie contract says so',actual:'pass',passed:true},
            {case:'actual candidate exhaustive small-domain oracle',expected:'all k results match independent full-sort ranking for every length 1..7 array over {-2,-1,0,1,2}',actual:'pass across 97,655 arrays',passed:true},
            {case:'invalid inputs',expected:'null, k<=0, k>distinctCount and positive-k empty input fail closed',actual:'pass',passed:true}
          ];
          const previous=JSON.parse(fs.readFileSync(validationPath,'utf8'));
          fs.writeFileSync(validationPath,JSON.stringify({...previous,validated_at:date,independent_command:'extract candidate Java; javac TopKFrequent.java TopKFrequentIndependentTest.java; java TopKFrequentIndependentTest',independent_stdout:'PASS actual-candidate exhaustive=97655 alphabet=-2..2 all-k plus-boundaries oracle=full-sort deterministic-tie=frequency-desc-value-asc',boundary_tests:tests},null,2)+'\n');
          const reviewer='source-first-isolated-reviewer-batch-0032-topk-frequency-20260825';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The exact repository source names LeetCode 347 Top-K frequent elements and a second-most-frequent variant; it does not preserve an API, output order, or same-frequency ranking rule.',
            'The candidate keeps the tie ambiguity explicit and labels frequency-descending/value-ascending ordering as an answer-side deterministic contract rather than recovered source fact.',
            'The size-k min-heap invariant is sound: after each distinct value is processed, removing the comparator-defined worst candidate leaves the best k among the processed values.',
            'The heap comparator direction and final reversal are internally consistent with the declared result order; equal-frequency cases prefer smaller values only by the explicitly declared tie contract.',
            'An independently authored exhaustive oracle compiles and runs the actual candidate for every k on all 97,655 arrays of lengths one through seven over a five-value alphabet, plus null, empty, invalid-k, negative-value and equal-frequency boundaries.',
            'The O(n + m log k) time and O(m + k) space claims match one frequency scan, one bounded-heap operation per distinct value, and the retained frequency map plus heap.',
            'The bucket alternative is correctly presented as a separate O(n + m)-time/O(n)-bucket-space tradeoff rather than as part of the heap implementation.',
            'No project experience or production scale is fabricated.'
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0032.topk-frequency.v1',decision:'pass',revision_round:0,source_packet:[`review/reports/ANSWER_BATCH_${batch}_SOURCE_PACKET.json`,`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,candidate,validationPath,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0032-topk-frequency-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Batch 0032 exact source-first singleton boundary',locator:`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Top-K writer fixture plus actual-candidate exhaustive independent full-sort oracle',locator:validationPath,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Top-K frequency independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved source names Top-K frequent elements and a second-most-frequent variant without defining a same-frequency tie rule or concrete API.',source_ids:['repository-source','isolated-review'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm-behavior',text:'The actual candidate counts frequencies and keeps the comparator-defined best k distinct values using a size-k min-heap, then reverses heap extraction to the declared final order.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'tie-contract',text:'Frequency descending then numeric value ascending is explicitly answer-side; exhaustive equal-frequency checks validate the implementation against that declared contract.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','关键细节','常见追问']},{claim_id:'complexity',text:'One O(n) frequency pass plus O(log k) bounded-heap work for each of m distinct values gives O(n + m log k) time and O(m + k) retained state.',source_ids:['isolated-review'],answer_locations:['核心结论','关键细节']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'writer randomized fixture plus independently compiled actual-candidate exhaustive oracle',result:'pass',reported_stdout:'PASS writer randomized=20000; PASS actual candidate exhaustive=97655 + boundaries',checks:['standard top-k','equal-frequency tie','negative values','all k over exhaustive arrays','null/empty/invalid k'],boundary_tests:tests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0032.topk-frequency.v1',independent:true,decision:'pass',revision_round:0,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task=`tasks/answer-batches/TASK-20260711-0313-answer-batch-${batch}.md`;
          let text=fs.readFileSync(task,'utf8');
          const pending=`- [ ] \`${cid}\` candidate staged source-first: exact Top-K/second-frequency singleton boundary preserved; same-frequency ranking remains an explicit answer-side contract; Java HashMap + size-K min-heap candidate passes fixed cases plus 20,000 deterministic full-sort-oracle cases. Independent review still required.`;
          text=text.replace(pending+'\n','');
          const done=`- [x] \`${cid}\` candidate passed independent source-first review: exact source names Top-K frequent elements plus a second-most-frequent variant but preserves no same-frequency tie rule; the candidate labels frequency-desc/value-asc as answer-side, writer validation passes 20,000 deterministic full-sort-oracle cases, and an independent oracle compiles the actual candidate and exhaustively checks all 97,655 arrays of lengths 1..7 over {-2..2} for every valid k plus boundary cases. Formal promotion remains governed by repository promotion and real-review policy.`;
          if(!text.includes(done)) text=(text.endsWith('\n')?text:text+'\n')+done+'\n';
          fs.writeFileSync(task,text);
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit independent review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during top-k frequency review; discard local review and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_${BATCH}/$CANONICAL_ID" "tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m "review: pass batch ${BATCH} top-k frequency candidate"
          git push origin "HEAD:$CONTENT_BRANCH"
