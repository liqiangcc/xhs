name: Remediate Content Batch 0033 Softskills Source Boundary

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0033-softskills-source-boundary.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0033-softskills-source-boundary
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7531e07d0f1e21e2eb6dab2bae97c0e9
  SOURCE_QID: 7531e07d0f1e21e2eb6dab2bae97c0e9

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Freeze source-first exclusion disposition
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='软素质、沟通能力、抗压能力考察';
          const structured=JSON.parse(fs.readFileSync('note_structured/682bc94900000000220258d7.json','utf8'));
          if(!(structured.questions||[]).includes(expected)) throw new Error('structured source wording drifted');
          const tagged=JSON.parse(fs.readFileSync('note_tagged/682bc94900000000220258d7.json','utf8'));
          const row=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          if(!row||row.original_question!==expected) throw new Error('tagged source wording drifted');
          if(row.question_type!=='算法手撕_Coding'||!(row.tech_entities||[]).includes('快排')) throw new Error('expected contaminated coding metadata no longer present; re-audit before mutation');
          const raw=fs.readFileSync('note_json/682bc94900000000220258d7.json','utf8');
          for(const needle of ['考察内容：对前面几场面试的总结','面试者软素质（沟通能力、抗压能力）','针对个人经历也提了一些问题']) {
            if(!raw.includes(needle)) throw new Error(`strong raw source evidence missing: ${needle}`);
          }
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])||Number(canon.frequency)!==1) throw new Error(`retirement is only safe for expected singleton Canonical: ${JSON.stringify(canon)}`);
          const boundary='review/content_build/answer_batch_0033/source_boundary_audit.md';
          let text=fs.readFileSync(boundary,'utf8');
          const heading=`## ${cid}`;
          const section=`\n## ${cid}\n\n- Exact repository projections: \`note_structured/682bc94900000000220258d7.json\` and \`note_tagged/682bc94900000000220258d7.json\`.\n- Stronger raw source: \`note_json/682bc94900000000220258d7.json\` says the HR round assessed the interviewee's soft qualities (communication and stress resistance) and also asked some questions about personal experience; it does not preserve any concrete soft-skill question and contains no quick-sort coding task at this position.\n- Current projected wording: \`${expected}\`.\n- Disposition: fail closed as \`incomplete_or_unreadable\`. The phrase is an assessment-category summary, not a recoverable interview Question; the current Coding/quick-sort metadata is unsupported derived contamination.\n- Required remediation: mark the tagged row invalid with an explicit reason, record the validity-audit exclusion, retire singleton Canonical \`${cid}\`, remove its ReviewProgress, archive its placeholder baseline Answer, rebuild Question/index/type projections, and keep the invalid Question as an explained non-Canonical projection.\n- No Coding candidate may be authored from the unsupported \`快排\` entity.\n`;
          if(!text.includes(heading)) fs.writeFileSync(boundary,text+section);
          NODE

      - name: Apply fail-closed singleton retirement
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import pathlib
          import shutil

          root=pathlib.Path('.')
          cid='cq_q_7531e07d0f1e21e2eb6dab2bae97c0e9'
          qid='7531e07d0f1e21e2eb6dab2bae97c0e9'
          text='软素质、沟通能力、抗压能力考察'
          note_path=root/'note_tagged/682bc94900000000220258d7.json'
          audit_path=root/'config/question_validity_audit.json'
          canon_path=root/'data/questions/canonical_questions.jsonl'
          questions_path=root/'data/questions/questions.jsonl'
          progress_path=root/'review/progress.json'
          task_path=root/'tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md'
          explanation=(
              '最强 raw source 只说明 HR 面“考察面试者软素质（沟通能力、抗压能力）”，并笼统提到针对个人经历问了一些问题，'
              '没有保留任何具体软素质问法；更没有保留快排或其他 Coding 合同。当前 question_type=算法手撕_Coding / tech_entities=快排 属于派生污染，'
              '不能据此生成答案，按 incomplete_or_unreadable fail closed。'
          )

          def read_json(p): return json.loads(p.read_text(encoding='utf-8'))
          def write_json(p,v): p.write_text(json.dumps(v,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          def read_jsonl(p): return [json.loads(x) for x in p.read_text(encoding='utf-8').splitlines() if x.strip()]
          def write_jsonl(p,rows): p.write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n' for r in rows),encoding='utf-8')

          note=read_json(note_path)
          matches=[(i,r) for i,r in enumerate(note.get('tagged_questions') or []) if r.get('question_id')==qid]
          if len(matches)!=1 or matches[0][1].get('original_question')!=text:
              raise SystemExit('tagged singleton source drifted')
          source_index,row=matches[0]
          row['is_valid_for_library']=False
          row['invalid_reason']='incomplete_or_unreadable'
          write_json(note_path,note)

          audit=read_json(audit_path)
          decisions=audit.setdefault('decisions',[])
          matches=[d for d in decisions if d.get('source_note_id')=='682bc94900000000220258d7' and d.get('source_question_index')==source_index]
          if len(matches)>1: raise SystemExit('duplicate validity decisions for source row')
          payload={'source_note_id':'682bc94900000000220258d7','source_question_index':source_index,'question_id':qid,'original_question':text,'decision':'exclude','exclusion_reason':'incomplete_or_unreadable','exclusion_note':explanation}
          if matches:
              matches[0].clear(); matches[0].update(payload)
          else:
              decisions.append(payload)

          canon=read_jsonl(canon_path)
          target=[r for r in canon if r.get('canonical_id')==cid]
          if len(target)!=1 or target[0].get('question_ids')!=[qid] or int(target[0].get('frequency',0))!=1:
              raise SystemExit('Canonical retirement guard failed')
          canon=[r for r in canon if r.get('canonical_id')!=cid]
          write_jsonl(canon_path,canon)

          questions=read_jsonl(questions_path)
          questions=[r for r in questions if r.get('canonical_id')!=cid and r.get('question_id')!=qid]
          write_jsonl(questions_path,questions)

          progress=read_json(progress_path)
          if isinstance(progress,dict) and isinstance(progress.get('items'),list):
              progress['items']=[r for r in progress['items'] if r.get('canonical_id')!=cid]
          elif isinstance(progress,list):
              progress=[r for r in progress if r.get('canonical_id')!=cid]
          elif isinstance(progress,dict):
              progress.pop(cid,None)
          else:
              raise SystemExit('unexpected ReviewProgress shape')
          write_json(progress_path,progress)

          active=root/'review/answers'/f'{cid}.md'
          archived=root/'review/archive/answers'/f'{cid}.md'
          archived.parent.mkdir(parents=True,exist_ok=True)
          if active.exists():
              if archived.exists(): raise SystemExit('both active and archived answers exist')
              shutil.move(str(active),str(archived))
          elif not archived.exists():
              raise SystemExit('baseline answer missing from both active and archive')
          for base in [root/'review/candidates/answers',root/'review/evidence']:
              item=base/(f'{cid}.md' if base.name=='answers' else f'{cid}.json')
              if item.exists():
                  dest=root/'review/archive'/base.relative_to(root/'review')/item.name
                  dest.parent.mkdir(parents=True,exist_ok=True)
                  if dest.exists(): raise SystemExit(f'archive collision: {dest}')
                  shutil.move(str(item),str(dest))

          source_invalid=0
          for p in sorted((root/'note_tagged').glob('*.json')):
              try: n=read_json(p)
              except Exception: continue
              source_invalid += sum(1 for r in n.get('tagged_questions') or [] if r.get('is_valid_for_library') is False)
          audit['source_invalid_row_count']=source_invalid
          audit['include_count']=sum(1 for d in decisions if d.get('decision')=='include')
          audit['exclude_count']=sum(1 for d in decisions if d.get('decision')=='exclude')
          audit['audited_at']='2026-08-26'
          write_json(audit_path,audit)

          task=task_path.read_text(encoding='utf-8')
          task=task.replace('- Canonical count: `10`','- Canonical count: `9` active (`10` original source members; `1` fail-closed exclusion)')
          old=f'- `{cid}` — coding; risks: long_tail_baseline, placeholder_implementation'
          new=f'- `{cid}` — retired; source-first exclusion: assessment-category summary only, no recoverable Question/Coding contract'
          if old in task: task=task.replace(old,new)
          elif new not in task: raise SystemExit('batch 0033 canonical list marker drifted')
          marker='- [ ] Every candidate passes `answer audit --require-evidence`.'
          note_line=f'- [x] `{cid}` was retired source-first: raw HR-round evidence only preserves a soft-skills assessment category, not a concrete question; unsupported Coding/quick-sort metadata was removed via `incomplete_or_unreadable` fail-closed exclusion.'
          if note_line not in task:
              if marker not in task: raise SystemExit('batch 0033 completion marker missing')
              task=task.replace(marker,marker+'\n'+note_line)
          task_path.write_text(task.rstrip()+'\n',encoding='utf-8')
          print('PASS staged batch 0033 softskills singleton retirement')
          PY

      - name: Rebuild generated projections
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify exact exclusion and repository integrity
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json,pathlib
          root=pathlib.Path('.')
          cid='cq_q_7531e07d0f1e21e2eb6dab2bae97c0e9'; qid='7531e07d0f1e21e2eb6dab2bae97c0e9'
          canon=[json.loads(x) for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if any(r.get('canonical_id')==cid for r in canon): raise SystemExit('retired Canonical remains active')
          questions=[json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          rows=[r for r in questions if r.get('question_id')==qid]
          if len(rows)!=1: raise SystemExit(f'expected retained invalid projection, got {len(rows)}')
          row=rows[0]
          if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable':
              raise SystemExit(f'invalid projection not explicit: {row}')
          progress=json.loads((root/'review/progress.json').read_text(encoding='utf-8'))
          items=progress.get('items',[]) if isinstance(progress,dict) else progress
          if any(r.get('canonical_id')==cid for r in items): raise SystemExit('retired ReviewProgress remains')
          if (root/'review/answers'/f'{cid}.md').exists() or not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit('answer archive state invalid')
          tagged=json.loads((root/'note_tagged/682bc94900000000220258d7.json').read_text(encoding='utf-8'))
          tagged_rows=[r for r in tagged.get('tagged_questions') or [] if r.get('question_id')==qid]
          if len(tagged_rows)!=1 or tagged_rows[0].get('is_valid_for_library') is not False or tagged_rows[0].get('invalid_reason')!='incomplete_or_unreadable': raise SystemExit('tagged invalid state drifted')
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'))
          decisions=[d for d in audit.get('decisions') or [] if d.get('question_id')==qid]
          if len(decisions)!=1 or decisions[0].get('decision')!='exclude' or decisions[0].get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit('validity audit exclusion missing')
          task=(root/'tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md').read_text(encoding='utf-8')
          if '- Canonical count: `9` active' not in task or f'- [x] `{cid}` was retired source-first' not in task: raise SystemExit('task disposition not recorded')
          boundary=(root/'review/content_build/answer_batch_0033/source_boundary_audit.md').read_text(encoding='utf-8')
          if f'## {cid}' not in boundary or 'assessment-category summary' not in boundary: raise SystemExit('frozen source-boundary disposition missing')
          print('PASS batch 0033 softskills row is an explained invalid projection with no active Canonical/ReviewProgress/Answer')
          PY
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during source-boundary retirement: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: retire unrecoverable batch 0033 softskills projection'
          git push origin "HEAD:$CONTENT_BRANCH"
