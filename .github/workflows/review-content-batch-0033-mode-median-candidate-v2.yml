name: Review Content Batch 0033 Mode Median Candidate V2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0033-mode-median-candidate-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0033-mode-median-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_742b944807ccd957a6deaa5416e47617
  SOURCE_QID: 742b944807ccd957a6deaa5416e47617
  CANDIDATE_BLOB_SHA: 31a487f77f2d68ffaa95fb49588f05a607f68b28

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated guard and exact implementation validation
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0033/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const expected='算法：给定数组找众数及其众数中的中位数';
          const note=JSON.parse(fs.readFileSync('note_structured/663b7649000000001e038251.json','utf8'));
          if(!(note.questions||[]).includes(expected)) throw new Error('source wording drifted');
          const boundary=fs.readFileSync('review/content_build/answer_batch_0033/source_boundary_audit.md','utf8');
          for(const needle of ['Preserved wording: `算法：给定数组找众数及其众数中的中位数`','whether all tied modes must be returned','the definition of median when the mode count is even','reject null/empty input','do not mutate the input']) if(!boundary.includes(needle)) throw new Error(`boundary drifted: ${needle}`);
          const rows=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const source=rows.find(x=>x.question_id===qid);
          if(!source||source.canonical_id!==cid) throw new Error('Question ownership drifted');
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('Canonical ownership drifted');
          const text=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const needle of ['所有出现次数达到最大值的不同元素构成“众数集合”','若众数个数为偶数，则返回中间两个众数的算术平均值','空数组或 `null` 直接拒绝','实现不修改输入','先转成 `long`','复杂度是 O(n + k log k)','此时每个不同值都是众数']) if(!text.includes(needle)) throw new Error(`candidate guard missing: ${needle}`);
          if(/我负责|我在线上|我们线上/.test(text)) throw new Error('fabricated experience detected');
          const open='```java\n',start=text.indexOf(open)+open.length,end=text.indexOf('\n```',start);
          if(start<open.length||end<0) throw new Error('Java fence missing');
          fs.mkdirSync('/tmp/xhs-mode-median-v2',{recursive:true});
          fs.writeFileSync('/tmp/xhs-mode-median-v2/ModeMedian.java',text.slice(start,end)+'\n');
          NODE
          cmp -s /tmp/xhs-mode-median-v2/ModeMedian.java "$out/ModeMedian.java"
          cp "$out/ModeMedianTest.java" /tmp/xhs-mode-median-v2/ModeMedianTest.java
          javac /tmp/xhs-mode-median-v2/ModeMedian.java /tmp/xhs-mode-median-v2/ModeMedianTest.java
          test "$(java -cp /tmp/xhs-mode-median-v2 ModeMedianTest)" = 'PASS fixed=5 exhaustive=9840 invalid-input=2 overflow-safe-even-median=true'

      - name: Record isolated review with audit-complete boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0033/${cid}`;
          const boundary='review/content_build/answer_batch_0033/source_boundary_audit.md';
          const fixture=`${out}/code_validation.json`,reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0033-mode-median-20260826-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The preserved repository source asks only for the mode(s) of a given array and the median among the mode values; type, tied-mode API, even-cardinality median semantics, null/empty behavior, mutation policy and implementation language are not preserved.',
            'The candidate keeps those missing details explicit as answer-side contracts: int input, all maximum-frequency distinct values as the mode set, arithmetic-mean median for an even mode count, null/empty rejection, non-mutation and a Java Result API.',
            'The displayed Java implementation is byte-for-byte identical to the validated ModeMedian.java fixture and compiles under JDK 21; sorting the collected modes removes any dependency on HashMap iteration order.',
            'Casting before the even-median addition makes the Integer.MIN_VALUE/Integer.MAX_VALUE boundary overflow-safe and the fixed test verifies -0.5.',
            'The TreeMap oracle checks all 9,840 non-empty arrays of lengths 1..8 over {-1,0,1}, in addition to named single-mode, tied-mode, signed, extreme-integer and all-distinct cases plus invalid inputs.',
            'The answer covers complexity, state definition, input/output contract, edge cases, a selection-algorithm variant, and topic-specific follow-ups without fabricated project experience or unrelated content.'
          ];
          const boundaryTests=[
            {case:'single mode [1,1,2,3]',expected:'modes=[1], median=1.0',actual:'modes=[1], median=1.0',passed:true},
            {case:'two tied modes [1,1,2,2,3]',expected:'modes=[1,2], median=1.5',actual:'modes=[1,2], median=1.5',passed:true},
            {case:'extreme tied modes [MIN,MIN,MAX,MAX]',expected:'median=-0.5 without int overflow',actual:'median=-0.5',passed:true},
            {case:'all distinct [3,1,2]',expected:'modes=[1,2,3], median=2.0',actual:'modes=[1,2,3], median=2.0',passed:true},
            {case:'null and empty inputs',expected:'IllegalArgumentException',actual:'both rejected',passed:true},
            {case:'exhaustive bounded oracle',expected:'all arrays length 1..8 over {-1,0,1} match independent TreeMap oracle',actual:'9840 arrays passed',passed:true}
          ];
          fs.writeFileSync(reviewPath,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0033.mode-median.v2',decision:'pass',revision_round:1,source_packet:['note_structured/663b7649000000001e038251.json',boundary,candidate,fixture,`${out}/ModeMedian.java`,`${out}/ModeMedianTest.java`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,writer:{writer_id:'content-batch-0033-mode-median-candidate-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'repository-source',title:'Exact repository interview question and Batch 0033 frozen source boundary',locator:'note_structured/663b7649000000001e038251.json + '+boundary,source_type:'repository_source_record',checked_at:date},{source_id:'fixture',title:'Mode-set median deterministic JDK 21 validation against independent TreeMap oracle',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Mode-set median independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source asks for array mode(s) and the median among their values; tie, even-median, invalid-input and API semantics are answer-side contracts.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节','易错点']},{claim_id:'algorithm',text:'The exact fenced Java implementation counts frequencies, retains all maximum-frequency values, sorts them, and computes the declared median with overflow-safe even-case arithmetic.',source_ids:['fixture','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'validation',text:'The JDK 21 fixture passes named edge cases, invalid inputs and all 9,840 bounded arrays against an independent TreeMap oracle.',source_ids:['fixture','isolated-review'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'javac ModeMedian.java ModeMedianTest.java && java ModeMedianTest',result:'pass',reported_stdout:'PASS fixed=5 exhaustive=9840 invalid-input=2 overflow-safe-even-median=true',checks:['single mode','two tied modes','signed tied modes','extreme overflow-safe median','all-distinct mode set','9840 exhaustive arrays','null/empty rejection'],boundary_tests:boundaryTests},review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0033.mode-median.v2',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}};
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md';
          let text=fs.readFileSync(task,'utf8');
          const old='- [ ] `cq_q_742b944807ccd957a6deaa5416e47617` writer slice staged: exact repository wording was frozen in `review/content_build/answer_batch_0033/source_boundary_audit.md`; the candidate keeps tied-mode, even-cardinality median, null/empty and Java API semantics explicitly answer-side; the exact Java fixture passes five fixed edge cases, null/empty rejection, overflow-safe extreme integers, and all 9,840 arrays of lengths 1..8 over {-1,0,1} against an independent TreeMap oracle. Isolated independent review is still required before this item can be marked reviewed or promoted.';
          const replacement='- [x] `cq_q_742b944807ccd957a6deaa5416e47617` passed isolated source-first review after aligning the displayed Java with the validated fixture; source-preserved wording remains bounded, all answer-side mode/median/null/API choices are explicit, and the JDK 21 fixture passes named boundaries plus all 9,840 bounded arrays against an independent TreeMap oracle. Formal promotion remains governed by repository human-approval and real-review policy.';
          if(!text.includes(old)) throw new Error('batch 0033 task marker drifted');
          fs.writeFileSync(task,text.replace(old,replacement));
          NODE

      - name: Audit candidate and full repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during isolated review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0033/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0033.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0033 mode-median candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
