name: Audit Content Batch 0020 Source Packet

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/audit-content-batch-0020-source-packet.yml

permissions:
  contents: read

concurrency:
  group: content-batch-0020-source-packet
  cancel-in-progress: true

jobs:
  verify-frozen-source-packet:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 1

      - name: Verify immutable pre-remediation source snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          batch = '0020'
          packet_path = Path(f'review/reports/ANSWER_BATCH_{batch}_SOURCE_PACKET.json')
          rendered_path = Path(f'review/reports/ANSWER_BATCH_{batch}_SOURCE_PACKET.md')
          boundary_path = Path(f'review/content_build/answer_batch_{batch}/source_boundary_audit.md')

          for path in (packet_path, rendered_path, boundary_path):
              if not path.is_file():
                  raise SystemExit(f'missing frozen source-first artifact: {path}')

          packet = json.loads(packet_path.read_text(encoding='utf-8'))
          if packet.get('schema_version') != 'answer_batch_source_packet.v2':
              raise SystemExit('unexpected source packet schema')
          if packet.get('batch') != batch:
              raise SystemExit('unexpected source packet batch')
          canonicals = packet.get('canonicals') or []
          if len(canonicals) != 10:
              raise SystemExit(f'frozen packet canonical count != 10: {len(canonicals)}')
          ids = [entry.get('canonical_id') for entry in canonicals]
          if len(ids) != len(set(ids)):
              raise SystemExit('duplicate Canonical ids in frozen packet')
          missing_hits = [entry.get('canonical_id') for entry in canonicals if not entry.get('source_hits')]
          if missing_hits:
              raise SystemExit(f'frozen packet lost repository source hits: {missing_hits}')

          rendered = rendered_path.read_text(encoding='utf-8')
          boundary = boundary_path.read_text(encoding='utf-8')
          for cid in ids:
              if cid not in rendered:
                  raise SystemExit(f'rendered packet missing Canonical: {cid}')
              if cid not in boundary:
                  raise SystemExit(f'boundary audit missing frozen Canonical disposition: {cid}')

          # Keep the source packet immutable once the boundary audit begins. Active
          # Canonicals may later be normalized or retired, but the original source
          # snapshot remains the evidence used to justify those dispositions.
          print(f'PASS frozen batch {batch} source packet: canonicals=10 source_hits=10/10')
          PY
