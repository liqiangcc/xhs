name: Canonical Boundary Review Batch 001

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .canonical-boundary-review-batch-001-trigger

permissions:
  contents: write

jobs:
  capture:
    if: "${{ github.event.head_commit.message == 'chore: capture canonical boundary review batch 001' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Capture first ten pending boundary pairs
        shell: bash
        run: |
          set -euo pipefail
          out=review/content_build/canonical_boundary_review/batch_001
          mkdir -p "$out/contexts"
          node - <<'NODE'
          const fs = require('fs');
          const rows = fs.readFileSync('data/manifests/canonical/long_tail_duplicate_candidates.jsonl', 'utf8')
            .split(/\r?\n/).filter(Boolean).map(JSON.parse)
            .filter((row) => row.reviewer_decision === 'pending')
            .slice(0, 10);
          fs.writeFileSync('review/content_build/canonical_boundary_review/batch_001/candidates.json', `${JSON.stringify({
            schema_version: 'canonical_boundary_review_batch.v1',
            batch_id: 'batch_001',
            count: rows.length,
            candidates: rows,
          }, null, 2)}\n`);
          fs.writeFileSync('/tmp/boundary-batch-001.tsv', rows.flatMap((row) => row.canonical_ids.map((id) => `${row.candidate_id}\t${id}`)).join('\n') + '\n');
          NODE
          while IFS=$'\t' read -r candidate id; do
            mkdir -p "$out/contexts/$candidate"
            node scripts/xhs.js answer context --canonical-id "$id" --noWrite > "$out/contexts/$candidate/$id.json"
          done < /tmp/boundary-batch-001.tsv

      - name: Verify read-only capture and repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:check

      - name: Commit source-first review inputs
        shell: bash
        run: |
          set -euo pipefail
          git add review/content_build/canonical_boundary_review/batch_001
          git commit -m "content: capture canonical boundary review batch 001"

      - name: Remove temporary capture workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .canonical-boundary-review-batch-001-trigger .github/workflows/canonical-boundary-review-batch-001.yml
          git add -A
          git commit -m "chore: remove canonical boundary review batch 001 workflow"

      - name: Push review inputs
        shell: bash
        run: git push origin HEAD:content/quality-completion
