name: Review Content Batch 0043 Reverse Words

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0043-reverse-words.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0043-reverse-words-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_af1ffa479590a36c15ac1fbcb3de6987
  SOURCE_QID: af1ffa479590a36c15ac1fbcb3de6987

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first inspection before writer records
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,exact='算法手撕：句子反转输出（Reverse Words in a String）。';
          const raw=JSON.parse(fs.readFileSync('note_structured/68998c2a0000000004000492.json','utf8'));
          if(raw.questions?.[5]!==exact)throw new Error('source boundary drifted');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0043/source_inventory.json','utf8'));
          const item=(inv.items||[]).find(x=>x.canonical_id===cid);if(!item||item.state!=='active'||item.answer_type!=='coding'||item.source_questions?.[0]?.original_question!==exact)throw new Error('inventory drifted');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));if(!ctx.ok||ctx.answer_type!=='coding'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid]))throw new Error('live context drifted');
          const p=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(p,'utf8');
          for(const marker of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点','reverseWords','ASCII','O(n)'])if(!md.includes(marker))throw new Error(`marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<5)throw new Error('followups missing');
          if(/生产环境里我|我负责过|我在线上|实际线上我们/.test(md))throw new Error('fabricated experience risk');
          const block=md.match(/```java\n([\s\S]*?)\n```/);if(!block||!block[1].includes('public static String reverseWords'))throw new Error('candidate code missing');
          fs.writeFileSync('/tmp/Solution.java',block[1]+'\n');const sha=crypto.createHash('sha256').update(fs.readFileSync(p)).digest('hex');fs.writeFileSync('/tmp/candidate-sha',sha+'\n');fs.writeFileSync('/tmp/pre.json',JSON.stringify({decision:'pass_pending_forward_deque_oracle',candidate_sha256:sha,source_boundary:'Reverse Words in a String is frozen; API, exact whitespace set, null behavior and mutation semantics are not source-frozen'},null,2)+'\n');
          NODE
          javac -encoding UTF-8 -d /tmp /tmp/Solution.java

      - name: Execute independent forward-token deque oracle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/Reviewer.java <<'JAVA'
          import java.util.*;
          public final class Reviewer {
              static String oracle(String s){
                  if(s==null)throw new NullPointerException("s");
                  ArrayDeque<String> words=new ArrayDeque<>();int i=0,n=s.length();
                  while(i<n){while(i<n&&s.charAt(i)==' ')i++;if(i>=n)break;int start=i;while(i<n&&s.charAt(i)!=' ')i++;words.addFirst(s.substring(start,i));}
                  return String.join(" ",words);
              }
              static void check(String s){String got=Solution.reverseWords(s),want=oracle(s);if(!got.equals(want))throw new AssertionError("input=["+s+"] got=["+got+"] want=["+want+"]");if(!got.isEmpty()&&(got.charAt(0)==' '||got.charAt(got.length()-1)==' '||got.contains("  ")))throw new AssertionError("output spacing invariant failed: ["+got+"]");}
              static long exhaustive=0;static void gen(char[] a,int i,char[] alphabet){if(i==a.length){check(new String(a));exhaustive++;return;}for(char c:alphabet){a[i]=c;gen(a,i+1,alphabet);}}
              public static void main(String[] args){char[] alphabet={' ','a','b'};for(int n=0;n<=9;n++)gen(new char[n],0,alphabet);for(String s:new String[]{"  hello   world  ","the sky is blue","🙂  hello  世界","a good   example"})check(s);Random r=new Random(0x525657524556L);String[] words={"a","bb","cat","世界","🙂","xy9"};long chars=0;for(int t=0;t<30000;t++){StringBuilder b=new StringBuilder();b.append(" ".repeat(r.nextInt(6)));int count=r.nextInt(14);for(int i=0;i<count;i++){if(i>0)b.append(" ".repeat(1+r.nextInt(6)));b.append(words[r.nextInt(words.length)]);}b.append(" ".repeat(r.nextInt(6)));chars+=b.length();check(b.toString());}try{Solution.reverseWords(null);throw new AssertionError("null accepted");}catch(NullPointerException expected){}System.out.println("PASS exhaustive="+exhaustive+" random=30000 chars="+chars+" forward-deque-oracle=match spacing=invariant unicode-word-content=covered null=rejected");}
          }
          JAVA
          javac -encoding UTF-8 -cp /tmp -d /tmp /tmp/Reviewer.java
          stdout="$(java -cp /tmp Reviewer)";echo "$stdout";grep -E '^PASS exhaustive=[0-9]+ random=30000 chars=[0-9]+ forward-deque-oracle=match spacing=invariant unicode-word-content=covered null=rejected$' <<<"$stdout";echo "REVIEW_STDOUT=$stdout" >> "$GITHUB_ENV"

      - name: Freeze independent review and evidence
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID";qid="$SOURCE_QID";out="review/content_build/answer_batch_0043/$cid";sha="$(cat /tmp/candidate-sha)"
          CANDIDATE_SHA="$sha" node <<'NODE'
          const fs=require('fs');const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-27',out=`review/content_build/answer_batch_0043/${cid}`,sha=process.env.CANDIDATE_SHA;
          const pre=JSON.parse(fs.readFileSync('/tmp/pre.json','utf8'));if(pre.decision!=='pass_pending_forward_deque_oracle'||pre.candidate_sha256!==sha)throw new Error('preconclusion drifted');
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));if(writer.review_state!=='writer_complete_isolated_review_pending'||writer.candidate_sha256!==sha)throw new Error('writer packet/hash drifted');
          const tests=[{case:'all strings length 0..9 over {space,a,b}',expected:'candidate equals forward-token/deque oracle',passed:true},{case:'30,000 seeded random sentences',expected:'candidate equals independent oracle and spacing invariant',passed:true},{case:'non-ASCII word content',expected:'whole words preserved under ASCII-space contract',passed:true},{case:'null',expected:'NullPointerException',passed:true}];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:date,command:'compile exact candidate; independent forward-token/deque oracle exhaustive/random validation',stdout:process.env.REVIEW_STDOUT,boundary_tests:tests,environment:{java:'OpenJDK 21'}},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=['The source freezes a Reverse Words in a String coding task; API shape, exact whitespace set, null behavior and mutability are not preserved constraints.','The candidate clearly labels ASCII-space parsing and Java null behavior as a reference contract rather than source facts.','The right-to-left invariant is correct: the output contains exactly the already-consumed right-side words in final order, while the unprocessed prefix strictly shrinks.','A structurally independent forward tokenizer that pushes words to the front of a deque matches the exact candidate on all strings length 0..9 over a small alphabet and 30,000 seeded random sentences; normalized-spacing invariants also hold.','The answer distinguishes word-order reversal from character reversal, states O(n) time and output-space accounting, handles empty/all-space input, and does not fabricate project experience.'];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0043-reverse-words-20260827-v1',review_version:'batch-0043.reverse-words.v1',decision:'pass',revision_round:1,source_packet:['note_structured/68998c2a0000000004000492.json','review/content_build/answer_batch_0043/source_inventory.json',`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          const evidence={schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:sha,checked_at:date,writer:{writer_id:'content-batch-0043-reverse-words-builder',writer_version:'xhs-answer-curator.v1'},sources:[{source_id:'structured-note',title:'Structured interview note preserving Reverse Words in a String prompt',locator:'note_structured/68998c2a0000000004000492.json',source_type:'repository_source_record',checked_at:date},{source_id:'source-inventory',title:'Batch 0043 frozen live source inventory',locator:'review/content_build/answer_batch_0043/source_inventory.json',source_type:'repository_structured_source',checked_at:date},{source_id:'writer-validation',title:'Writer split/reverse/join oracle validation',locator:`${out}/reverse_words_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'reviewer-validation',title:'Independent forward-token/deque oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},{source_id:'isolated-review',title:'Reverse-words source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}],claims:[{claim_id:'source-contract',text:'The source preserves a Reverse Words in a String task while API, exact whitespace set, null handling and mutability are not source-frozen.',source_ids:['structured-note','source-inventory','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','易错点']},{claim_id:'reference-behavior',text:'Under the declared ASCII-space Java reference contract, exact right-to-left scanning matches independent forward-token/deque semantics across exhaustive and seeded-random inputs.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],validation:{command:'independent forward-token/deque oracle exhaustive/random validation',result:'pass',reported_stdout:process.env.REVIEW_STDOUT,boundary_tests:tests},review:{reviewer_id:review.reviewer_id,review_version:review.review_version,independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings},promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};fs.mkdirSync('review/evidence',{recursive:true});fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          NODE

      - name: Strict candidate audit and repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:code

      - name: Commit review artifacts and progress with safe concurrent rebase
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_af1ffa479590a36c15ac1fbcb3de6987` completed writer and isolated source-first review. The source freezes Reverse Words in a String while API/whitespace/null semantics remain explicit reference-contract choices. Writer validation passed fixed cases and 50,000 seeded random sentences; the independent reviewer matched a structurally separate forward-token/deque oracle on every string through length 9 over a bounded alphabet plus 30,000 seeded random sentences, with spacing invariants, Unicode word content, strict candidate audit, code gate, and repository gates green. Formal evidence is staged; repository human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY
          git add "review/content_build/answer_batch_0043/$CANONICAL_ID/reviewer_validation.json" "review/content_build/answer_batch_0043/$CANONICAL_ID/isolated_review_result.json" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0043.md
          git diff --cached --check
          if git diff --cached --quiet;then exit 0;fi
          git config user.name xhs-review-bot
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0043 reverse-words candidate source-first'
          for attempt in 1 2 3;do
            git fetch origin "$CONTENT_BRANCH"
            if ! git rebase "origin/$CONTENT_BRANCH";then git rebase --abort||true;exit 1;fi
            if git push origin "HEAD:$CONTENT_BRANCH";then exit 0;fi
            sleep 5
          done
          exit 1
