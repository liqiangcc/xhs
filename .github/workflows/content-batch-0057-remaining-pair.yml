name: Content Batch 0057 Remaining Pair

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0057-remaining-pair.yml
      - scripts/content/build_batch_0057_remaining_pair.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0057-remaining-pair
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  build-review-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build, execute, and source-first review remaining pair
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/build_batch_0057_remaining_pair.py > /tmp/build.py
          python3 -m py_compile /tmp/build.py
          python3 /tmp/build.py

      - name: Run candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          # The active content branch predates the Python-fence validator added to
          # master. Use the tested current validator/test bytes for this dry-run
          # gate without staging them into the content candidate commit; PR #2's
          # base already carries the canonical validator change.
          git show origin/master:scripts/lib/answer_quality.js > scripts/lib/answer_quality.js
          git show origin/master:test/answer_code_validation.test.js > test/answer_code_validation.test.js
          for cid in \
            cq_q_b454431bf82c811ddfc2d5dd208269bc \
            cq_q_fe0291a155ad4a502b6d0607ba6ad0b9; do
            node scripts/xhs.js answer audit --candidate "review/candidates/answers/$cid.md" --require-evidence --noWrite --noDraftCheck
          done
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          # Restore branch-local validator bytes so the commit contains only
          # reviewed Batch 0057 content artifacts.
          git checkout -- scripts/lib/answer_quality.js test/answer_code_validation.test.js
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0057 remaining-pair build: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          for cid in \
            cq_q_b454431bf82c811ddfc2d5dd208269bc \
            cq_q_fe0291a155ad4a502b6d0607ba6ad0b9; do
            git add \
              "review/candidates/answers/$cid.md" \
              "review/content_build/answer_batch_0057/$cid" \
              "review/evidence/$cid.json"
          done
          git add tasks/answer-batches/TASK-20260711-0313-answer-batch-0057.md
          if git diff --cached --quiet; then
            echo 'No Batch 0057 remaining-pair changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: review batch 0057 remaining pair candidates'
          git push origin "HEAD:$CONTENT_BRANCH"
