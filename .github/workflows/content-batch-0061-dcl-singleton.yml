name: Content Batch 0061 DCL Singleton

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/content-batch-0061-dcl-singleton.yml
      - scripts/content/build_batch_0061_dcl_singleton.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0061-dcl-singleton
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_0616abe7f8861fde19fda29ad5b2b305

jobs:
  build-review-validate-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Reconcile live DCL source ownership and evidence vocabulary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/content/build_batch_0061_dcl_singleton.py')
          text = p.read_text(encoding='utf-8')
          old_qids = "QIDS = ['0616abe7f8861fde19fda29ad5b2b305']"
          new_qids = "QIDS = ['0616abe7f8861fde19fda29ad5b2b305', 'a5debbf3aaaeb184307a2e4f489f2141']"
          old_variants = "EXPECTED_VARIANTS = {'算法手撕：使用 Java 实现基于 DCL（双重检查锁）的单例。'}"
          new_variants = "EXPECTED_VARIANTS = {'算法：手写单例模式（双重检查锁）。', '算法：手写单例模式（懒汉式、双重检查锁）'}"
          if old_qids in text:
              text = text.replace(old_qids, new_qids, 1)
          elif new_qids not in text:
              raise SystemExit('DCL builder QID constants are not at an accepted state')
          if old_variants in text:
              text = text.replace(old_variants, new_variants, 1)
          elif new_variants not in text:
              raise SystemExit('DCL builder source variants are not at an accepted state')
          old_type = "'source_type': 'external_primary_source'"
          new_type = "'source_type': 'official_specification_or_standard'"
          if old_type in text:
              text = text.replace(old_type, new_type)
          elif new_type not in text:
              raise SystemExit('DCL primary-source type is not at an accepted state')
          p.write_text(text, encoding='utf-8')
          PY

      - name: Build, execute, and source-first review candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/content/build_batch_0061_dcl_singleton.py
          python3 scripts/content/build_batch_0061_dcl_singleton.py

      - name: Run candidate and repository gates
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/lib/answer_quality.js > scripts/lib/answer_quality.js
          git show origin/master:test/answer_code_validation.test.js > test/answer_code_validation.test.js
          node scripts/xhs.js answer audit \
            --candidate "review/candidates/answers/$CANONICAL_ID.md" \
            --require-evidence --noWrite --noDraftCheck
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git checkout -- scripts/lib/answer_quality.js test/answer_code_validation.test.js
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0061 DCL singleton build: $base_head -> $remote_head"
            echo 'Discard verified local mutation; retry against current state.'
            exit 0
          fi
          git add \
            scripts/content/build_batch_0061_dcl_singleton.py \
            "review/candidates/answers/$CANONICAL_ID.md" \
            "review/content_build/answer_batch_0061/$CANONICAL_ID" \
            "review/evidence/$CANONICAL_ID.json" \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0061.md
          if git diff --cached --quiet; then
            echo 'No Batch 0061 DCL singleton changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-content-builder
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: review batch 0061 DCL singleton candidate'
          git push origin "HEAD:$CONTENT_BRANCH"
