name: Reconcile Content Batch 0045 Preorder Duplicate

on:
  push:
    branches: [content/quality-completion]
    paths: [.github/workflows/reconcile-content-batch-0045-preorder-duplicate.yml]

permissions:
  contents: write

concurrency:
  group: content-batch-0045-preorder-reconcile
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  TARGET_CID: cq_q_8d38cd370fa94eb8683b012eb6353aab
  TARGET_QID: 8d38cd370fa94eb8683b012eb6353aab
  SOURCE_CID: cq_q_b9fd3f10a57949d80677b6a0a726518d
  SOURCE_QID: b9fd3f10a57949d80677b6a0a726518d

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify source-first duplicate relation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0045
          node scripts/xhs.js answer context --canonical-id "$TARGET_CID" --noWrite > /tmp/target.json
          node scripts/xhs.js answer context --canonical-id "$SOURCE_CID" --noWrite > /tmp/source.json
          node <<'NODE'
          const fs=require('fs');
          const t=JSON.parse(fs.readFileSync('/tmp/target.json','utf8')),s=JSON.parse(fs.readFileSync('/tmp/source.json','utf8'));
          const tc=process.env.TARGET_CID,sc=process.env.SOURCE_CID,tq=process.env.TARGET_QID,sq=process.env.SOURCE_QID;
          if(!t.ok||!s.ok||t.answer_type!=='coding'||s.answer_type!=='coding')throw new Error('live contexts invalid');
          if(JSON.stringify(t.canonical?.question_ids)!==JSON.stringify([tq]))throw new Error('target ownership drifted');
          if(JSON.stringify(s.canonical?.question_ids)!==JSON.stringify([sq]))throw new Error('source ownership drifted');
          const a=t.source_questions.find(x=>x.question_id===tq),b=s.source_questions.find(x=>x.question_id===sq);
          const ea='算法手撕：二叉树的前序遍历（Pre-order Traversal）',eb='算法：前序遍历二叉树';
          if(a?.original_question!==ea||b?.original_question!==eb)throw new Error(`source wording drifted: ${a?.original_question} / ${b?.original_question}`);
          const n1=JSON.parse(fs.readFileSync('note_tagged/680a3a20000000001c03319f.json','utf8'));
          const n2=JSON.parse(fs.readFileSync('note_tagged/6827fdad0000000022004404.json','utf8'));
          if(!n1.tagged_questions?.some(x=>x.question_id===tq&&x.original_question===ea))throw new Error('target primary source drifted');
          if(!n2.tagged_questions?.some(x=>x.question_id===sq&&x.original_question===eb))throw new Error('source primary source drifted');
          const candidate=`review/candidates/answers/${tc}.md`;
          const review=`review/content_build/answer_batch_0037/${tc}/isolated_review_result.json`;
          if(!fs.existsSync(candidate)||!fs.existsSync(review))throw new Error('reviewed target candidate missing');
          const body=fs.readFileSync(candidate,'utf8');
          for(const token of ['根','左子树','右子树','先压右','再压左'])if(!body.includes(token))throw new Error(`candidate missing ${token}`);
          const oldReview=JSON.parse(fs.readFileSync(review,'utf8'));if(oldReview.decision!=='pass')throw new Error('target candidate not independently passed');
          fs.writeFileSync('review/content_build/answer_batch_0045/preorder_relation_review.json',JSON.stringify({schema_version:'canonical_relation_review.v1',reviewed_at:'2026-08-28',source_first:true,target_canonical_id:tc,source_canonical_id:sc,target_question_ids:[tq],source_question_ids:[sq],relation:'duplicate',decision:'merge_source_into_target',rationale:['Both preserved Questions ask for binary-tree preorder traversal; the target additionally preserves the English Pre-order Traversal label but no distinct variant.','Both are coding questions and neither source adds a different traversal contract.','The existing target candidate defines and validates root-left-right traversal, directly covering the shorter source wording.','Merging avoids a duplicate Answer while preserving both original Question records under one Canonical.'],post_merge_requirement:'Refresh candidate source coverage and isolated review for both source Questions before promotion.'},null,2)+'\n');
          NODE

      - name: Merge duplicate Canonical transactionally
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical merge --target "$TARGET_CID" --source "$SOURCE_CID" --reason 'Batch 0045 source-first review: 前序遍历二叉树 is duplicate of existing binary-tree Pre-order Traversal Canonical' --noManifest > /tmp/merge.json
          node <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync('/tmp/merge.json','utf8'));
          if(!r.ok||r.target!==process.env.TARGET_CID||r.source!==process.env.SOURCE_CID)throw new Error(`merge failed: ${JSON.stringify(r)}`);
          if(JSON.stringify(r.moved_question_ids)!==JSON.stringify([process.env.SOURCE_QID]))throw new Error(`unexpected moved scope ${JSON.stringify(r.moved_question_ids)}`);
          NODE
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Validate target candidate after merged ownership
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0037/$TARGET_CID"
          node scripts/xhs.js answer context --canonical-id "$TARGET_CID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs');const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0037/${process.env.TARGET_CID}/context.json`,'utf8'));
          const expected=[process.env.TARGET_QID,process.env.SOURCE_QID].sort(),owned=[...(ctx.canonical?.question_ids||[])].sort();
          if(JSON.stringify(owned)!==JSON.stringify(expected))throw new Error(`merged ownership wrong ${JSON.stringify(owned)}`);
          for(const qid of expected)if(!ctx.source_questions?.some(x=>x.question_id===qid&&x.is_valid_for_library===true))throw new Error(`${qid}: merged source not reachable`);
          if(ctx.canonical?.answer_status!=='needs_update')throw new Error(`target answer must be invalidated after merge, got ${ctx.canonical?.answer_status}`);
          NODE
          javac "$out/Solution.java" "$out/PreorderWriterTest.java"
          java -cp "$out" PreorderWriterTest | tee /tmp/preorder.stdout
          grep -F 'PASS fixed=4 randomized_trees=2420 deep_skew=50000 null=pass order=pass' /tmp/preorder.stdout

      - name: Refresh evidence and post-merge isolated review
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),crypto=require('crypto');
          const cid=process.env.TARGET_CID,q1=process.env.TARGET_QID,q2=process.env.SOURCE_QID,out=`review/content_build/answer_batch_0037/${cid}`;
          const candidate=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8'),sha=crypto.createHash('sha256').update(candidate).digest('hex');
          const locations=['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点'];
          const stdout=fs.readFileSync('/tmp/preorder.stdout','utf8').trim();
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:sha,result:'pass',validated_at:'2026-08-28',command:'compile candidate implementation after duplicate Canonical merge and compare 2420 randomized trees to recursive reference plus 50000-node skew boundary',stdout,checks:['root-left-right fixed cases','2420 randomized trees match recursive reference','50000-node skew tree avoids recursive-call depth in candidate','null boundary']},null,2)+'\n');
          const research={schema_version:'answer_writer_research.v1',canonical_id:cid,candidate_sha256:sha,checked_at:'2026-08-28',review_state:'isolated_review_pass_post_merge',sources:[{source_id:'source-detailed',title:'Tagged binary-tree preorder interview source',locator:'note_tagged/680a3a20000000001c03319f.json',source_type:'repository_structured_source',checked_at:'2026-08-28'},{source_id:'source-short',title:'Tagged shorter preorder-tree source',locator:'note_tagged/6827fdad0000000022004404.json',source_type:'repository_structured_source',checked_at:'2026-08-28'},{source_id:'merge-relation',title:'Batch 0045 preorder duplicate relation review',locator:'review/content_build/answer_batch_0045/preorder_relation_review.json',source_type:'repository_source_record',checked_at:'2026-08-28'},{source_id:'validation',title:'Executable preorder validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-28'}],claims:[{claim_id:'preorder-semantics',text:'Both preserved source Questions ask for binary-tree preorder traversal; the answer’s root-left-right order directly covers both.',source_ids:['source-detailed','source-short','merge-relation','validation'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'iterative-ordering',text:'The stack implementation pushes right before left so LIFO processing visits left before right and matches a recursive reference on deterministic randomized trees.',source_ids:['validation'],answer_locations:['1 分钟版','3 分钟版','原理机制','关键细节']}],source_question_coverage:[{question_id:q1,covered:true,answer_locations:locations},{question_id:q2,covered:true,answer_locations:locations}],promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'};
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify(research,null,2)+'\n');
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:sha,reviewed_at:'2026-08-28',review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0045-preorder-post-merge-20260828-v2',review_version:'batch-0045.preorder.post-merge.v2',decision:'pass',revision_round:2,source_packet:['review/content_build/answer_batch_0045/preorder_relation_review.json',`${out}/context.json`,`review/candidates/answers/${cid}.md`,`${out}/reviewer_validation.json`,'docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5},hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings:['The two Questions are duplicate phrasings of binary-tree preorder traversal and belong under one Canonical.','The candidate directly defines root-left-right order and explains right-before-left stack push from LIFO semantics.','Post-merge execution passes fixed cases, 2420 randomized trees against a recursive reference, and a 50000-node skew-tree boundary.','No new source variant or unsupported project claim is introduced by the merged shorter wording.'],promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify(review,null,2)+'\n');
          NODE

      - name: Run integrity gates and record task progress
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0045.md');t=p.read_text(encoding='utf-8')
          line='- [x] `cq_q_b9fd3f10a57949d80677b6a0a726518d` was reconciled source-first as a duplicate of the existing reviewed binary-tree preorder Canonical `cq_q_8d38cd370fa94eb8683b012eb6353aab`. Both original Questions remain reachable from the merged Canonical; candidate evidence and isolated review were refreshed for both source wordings. Formal promotion remains blocked by repository human-approval/real-review policy.'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit if branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote="$(git rev-parse "origin/$CONTENT_BRANCH")";base='${{ steps.base.outputs.head }}'
          if [ "$remote" != "$base" ]; then echo "branch advanced: $base -> $remote; discard verified local mutation"; exit 0; fi
          git rm .github/workflows/reconcile-content-batch-0045-preorder-duplicate.yml
          git add -A
          git diff --cached --check
          git config user.name xhs-remediation-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: merge duplicate batch 0045 preorder canonical'
          git push origin "HEAD:$CONTENT_BRANCH"
