name: Content Batch 0019 Descendant Candidate Gate

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'content/quality-completion' || startsWith(github.event.pull_request.head.ref, 'automation/batch0019-candidate-gate')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: content/quality-completion

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate source-exact descendant fixtures
        shell: bash
        run: |
          set -euo pipefail

          path_sum_dir='review/content_build/answer_batch_0019/cq_q_84bd83ff8f06510515f6b71534cd2ac5'
          (
            cd "$path_sum_dir"
            javac BinaryTreePathSum.java BinaryTreePathSumTest.java
            stdout="$(java BinaryTreePathSumTest)"
            echo "$stdout"
            test "$stdout" = 'PASS fixed=10 randomized=5000 oracle=iterative-root-to-leaf-enumeration mutation=none'
          )

          consecutive_dir='review/content_build/answer_batch_0019/cq_q_2a5006d66e022875a36106ef0c25c2c2'
          (
            cd "$consecutive_dir"
            javac LongestConsecutiveSequence.java LongestConsecutiveSequenceTest.java
            stdout="$(java LongestConsecutiveSequenceTest)"
            echo "$stdout"
            test "$stdout" = 'PASS fixed=10 randomized=5000 oracle=sort-deduplicate-scan mutation=none'
          )

      - name: Run formal candidate audits
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_84bd83ff8f06510515f6b71534cd2ac5.md \
            --require-evidence \
            --require-code \
            --noWrite
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_2a5006d66e022875a36106ef0c25c2c2.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate, evidence and isolated-review bindings
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          cases = [
              {
                  'cid': 'cq_q_84bd83ff8f06510515f6b71534cd2ac5',
                  'qid': '84bd83ff8f06510515f6b71534cd2ac5',
                  'sha': 'e456ec1627231ec5e52e3f92037ea29a2f4a6103100ae51236245d7ea4816be2',
                  'stdout': 'PASS fixed=10 randomized=5000 oracle=iterative-root-to-leaf-enumeration mutation=none',
              },
              {
                  'cid': 'cq_q_2a5006d66e022875a36106ef0c25c2c2',
                  'qid': '2a5006d66e022875a36106ef0c25c2c2',
                  'sha': '3c81f326ca291d6de6f7ee006682cf13dc91421791d54d39afa849fbd820f8c6',
                  'stdout': 'PASS fixed=10 randomized=5000 oracle=sort-deduplicate-scan mutation=none',
              },
          ]

          for case in cases:
              cid = case['cid']
              candidate = Path(f'review/candidates/answers/{cid}.md').read_bytes()
              candidate_sha = hashlib.sha256(candidate).hexdigest()
              evidence = json.loads(Path(f'review/evidence/{cid}.json').read_text(encoding='utf-8'))
              review = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/isolated_review_result.json').read_text(encoding='utf-8'))
              validation = json.loads(Path(f'review/content_build/answer_batch_0019/{cid}/code_validation.json').read_text(encoding='utf-8'))

              assert candidate_sha == case['sha'], (cid, candidate_sha)
              assert validation['schema_version'] == 'code_validation.v1'
              assert validation['result'] == 'pass'
              assert validation['stdout'] == case['stdout']
              assert evidence['schema_version'] == 'answer_evidence.v1'
              assert evidence['review_state'] == 'independent_source_first_review_passed'
              assert review['schema_version'] == 'isolated_review.v1'
              assert review['decision'] == 'pass'
              assert review['hard_failures'] == []
              assert review['promotion_blockers'] == ['human_approval_required_for_pilot_promotion']
              assert evidence['candidate_sha256'] == case['sha']
              assert review['candidate_sha256'] == case['sha']
              assert evidence['source_question_coverage'] == [{
                  'question_id': case['qid'],
                  'covered': True,
                  'answer_locations': ['核心结论', '1 分钟版', '3 分钟版', '关键细节', '原理机制', '常见追问'],
              }]
          PY

      - name: Verify source-first descendant boundaries
        shell: bash
        run: |
          set -euo pipefail
          audit='review/content_build/answer_batch_0019/source_boundary_audit.md'
          tagged='note_tagged/68ad5735000000001c033a19.json'
          test -f "$audit"
          test -f "$tagged"
          grep -Fq 'cq_q_84bd83ff8f06510515f6b71534cd2ac5' "$audit"
          grep -Fq 'cq_q_2a5006d66e022875a36106ef0c25c2c2' "$audit"
          grep -Fq '二叉树路径和' "$tagged"
          grep -Fq '最长连续序列长度' "$tagged"
