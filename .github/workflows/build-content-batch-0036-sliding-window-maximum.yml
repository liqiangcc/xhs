          const fs=require('fs');
          const cid=process.env.CANONICAL_ID, explicit=process.env.EXPLICIT_QID, shorthand=process.env.SHORTHAND_QID;
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0036/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('Sliding Window Maximum canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          const members=[...(ctx.canonical?.question_ids||[])].sort();
          const expected=[explicit,shorthand].sort();
          if(JSON.stringify(members)!==JSON.stringify(expected)) throw new Error(`consolidated ownership drifted: ${JSON.stringify(members)}`);
          const byQ=new Map((ctx.source_questions||[]).map(q=>[q.question_id,q]));
          const expectedTitles=new Map([
            [explicit,'算法手撕：滑动窗口最大值（Sliding Window Maximum）。'],
            [shorthand,'算法手撕：滑动窗口的最大值（Sliding Window Maximum）。'],
          ]);
          for(const [qid,text] of expectedTitles){
            const q=byQ.get(qid);
            if(!q||q.original_question!==text) throw new Error(`${qid}: source wording drifted: ${q?.original_question}`);
          }
          const rr=fs.readFileSync('review/content_build/answer_batch_0036/sliding_window_max_relation_review.md','utf8');
          const phrase='给定一个数组和滑动窗口大小K，返回每个滑动窗口的最大值。';
          if(!rr.includes('Relation: `same`')||!rr.includes(phrase)||!rr.includes(cid)) throw new Error('sliding-window relation review missing or stale');
          NODE

      - name: Write source-bounded candidate and executable oracle fixture
