  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0036-sliding-window-maximum.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-sliding-window-maximum-writer
  cancel-in-progress: true

