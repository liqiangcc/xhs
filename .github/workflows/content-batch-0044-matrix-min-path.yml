          import java.util.*;
          public final class WriterTest {
              static long bruteRightDown(long[][] g,int r,int c){if(r==g.length-1&&c==g[0].length-1)return g[r][c];long best=Long.MAX_VALUE;if(r+1<g.length)best=Math.min(best,bruteRightDown(g,r+1,c));if(c+1<g[0].length)best=Math.min(best,bruteRightDown(g,r,c+1));return Math.addExact(g[r][c],best);}
              static long bellman(long[][]g){int m=g.length,n=g[0].length,V=m*n;long[]d=new long[V];Arrays.fill(d,Long.MAX_VALUE);d[0]=g[0][0];int[][]dirs={{1,0},{-1,0},{0,1},{0,-1}};for(int it=0;it<V-1;it++){boolean ch=false;for(int r=0;r<m;r++)for(int c=0;c<n;c++){int u=r*n+c;if(d[u]==Long.MAX_VALUE)continue;for(int[]x:dirs){int nr=r+x[0],nc=c+x[1];if(nr<0||nr>=m||nc<0||nc>=n)continue;int v=nr*n+nc;long nd=d[u]+g[nr][nc];if(nd<d[v]){d[v]=nd;ch=true;}}}if(!ch)break;}return d[V-1];}
