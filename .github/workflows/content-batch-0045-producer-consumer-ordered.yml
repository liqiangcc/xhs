      - name: Run exact Go candidate with race and adversarial ordering tests
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/b45-producer-consumer
          cat > go.mod <<'EOF'
          module orderedpc

          go 1.23
          EOF
          cat > orderedpc_test.go <<'EOF'
          package orderedpc

          import (
              "runtime"
              "sync"
              "testing"
          )

          func requireOrdered(t *testing.T, got []int, n int) {
              t.Helper()
              if len(got) != n {
                  t.Fatalf("len=%d want=%d: %v", len(got), n, got)
              }
              for i, v := range got {
                  if v != i+1 {
                      t.Fatalf("index=%d got=%d want=%d full=%v", i, v, i+1, got)
                  }
              }
          }

          func TestOrderedProducerConsumer(t *testing.T) {
              for i := 0; i < 200; i++ {
                  runtime.Gosched()
                  requireOrdered(t, OrderedProducerConsumer(100, 2), 100)
              }
              requireOrdered(t, OrderedProducerConsumer(1, 2), 1)
              requireOrdered(t, OrderedProducerConsumer(0, 2), 0)
          }

          func TestConcurrentInvocationsIndependent(t *testing.T) {
              const calls = 24
              var wg sync.WaitGroup
              wg.Add(calls)
              errs := make(chan string, calls)
              for i := 0; i < calls; i++ {
                  go func() {
                      defer wg.Done()
                      got := OrderedProducerConsumer(100, 2)
                      if len(got) != 100 {
                          errs <- "wrong length"
                          return
                      }
                      for j, v := range got {
                          if v != j+1 {
                              errs <- "wrong ordering"
                              return
                          }
                      }
                  }()
              }
              wg.Wait()
              close(errs)
              for err := range errs {
                  t.Fatal(err)
              }
          }

          func TestInvalidConsumerCountPanics(t *testing.T) {
              defer func() {
                  if recover() == nil {
                      t.Fatal("expected panic for zero consumers")
                  }
              }()
              OrderedProducerConsumer(10, 0)
          }
          EOF
          gofmt -w orderedpc.go orderedpc_test.go
          go test -race -count=5 ./... | tee stdout.txt
          grep -q '^ok[[:space:]]\+orderedpc' stdout.txt
          printf '%s\n' 'PASS ordered=1..100 consumers=2 repeated=1000 race=clean concurrent-calls=24 zero-input=empty invalid-consumers=rejected' > validation-summary.txt

