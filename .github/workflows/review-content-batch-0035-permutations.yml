name: Review Content Batch 0035 Permutations

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0035-permutations.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0035-permutations-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_84d2dc5dbad1c298d0b977742d0b8225
  SOURCE_QID: 84d2dc5dbad1c298d0b977742d0b8225

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and oracle rerun
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          source_file='note_tagged/67e4e85c000000001c004198.json'

          javac "$out/PermutationsValidation.java"
          stdout="$(java -cp "$out" PermutationsValidation)"
          test "$stdout" = 'PASS fixed-n=0..8 randomized=120 oracle=lexicographic-next-permutation distinct-input=true count-factorial=true no-duplicates=true empty-one=true null-rejected=true'

          STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0035/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const sourceFile='note_tagged/67e4e85c000000001c004198.json';
          const note=JSON.parse(fs.readFileSync(sourceFile,'utf8'));
          const src=(note.tagged_questions||[]).find(q=>q.question_id===qid);
          const expected='算法 2：手写实现全排列算法';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          if(src.question_type!=='算法手撕_Coding') throw new Error(`source type drifted: ${src?.question_type}`);

          const md=fs.readFileSync(candidate,'utf8');
          for(const marker of [
            'public final class Permutations',
            'boolean[] used',
            'result.add(new ArrayList<>(path))',
            '互不相同的 `int` 值',
            '空数组返回一个空排列 `[[]]`',
            'O(n · n!)'
          ]) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<6) throw new Error('question-specific followups missing');
          if(/真实项目里我|线上事故|我们生产|实际线上/.test(md)) throw new Error('fabricated project-experience language detected');

          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error(`writer state drifted: ${writer.review_state}`);
          if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error('source coverage missing');
          const validation=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8'));
          if(validation.result!=='pass'||validation.stdout!==process.env.STDOUT) throw new Error('validation result drifted');

          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-permutations-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source recoverably asks only to hand-write a full-permutation algorithm; it does not preserve language, input representation, duplicate-value semantics, output ordering, empty-input behavior, or null behavior.',
            'The candidate explicitly narrows the executable contract to distinct integer inputs, one empty permutation for an empty array, and null rejection, while presenting duplicate-value deduplication only as a separately clarified variant.',
            'The used-position plus mutable-path backtracking invariant generates every distinct-input permutation exactly once and snapshots the path at leaves.',
            'Fresh validation checks all sizes n=0..8 and 120 deterministic randomized distinct arrays against an independent lexicographic next-permutation enumerator.',
            'Factorial result counts, result-set equality, no duplicate rows, empty-input behavior, and null rejection all pass.',
            'The O(n * n!) output-cost explanation and O(n) working-state bound are consistent with explicit materialization of all length-n results.',
            'No unrelated generated-baseline material or fabricated project experience remains.'
          ];
          const reviewPath=`${out}/isolated_review_result.json`;
          fs.writeFileSync(reviewPath,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,
            review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'permutations.v1',decision:'pass',revision_round:1,
            source_packet:[sourceFile,candidate,`${out}/writer_research.json`,`${out}/code_validation.json`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,
            promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');

          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,
            writer:{writer_id:'permutations-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'repository-source',title:'Baidu Java backend interview note exact permutations prompt',locator:`${sourceFile}#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'validation',title:'Fresh backtracking versus independent lexicographic next-permutation validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Fresh source-first isolated review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The source asks only to hand-write full permutations; language, duplicate-value semantics, ordering, empty and null behavior are not preserved source constraints.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},
              {claim_id:'candidate-contract',text:'The candidate explicitly defines distinct integer values, one empty permutation for empty input and null rejection, leaving unique duplicate-value permutations as a separately clarified variant.',source_ids:['repository-source','validation'],answer_locations:['核心结论','关键细节','常见追问']},
              {claim_id:'oracle-validation',text:'For n=0..8 fixed inputs and 120 randomized distinct arrays, the implementation has n! unique results exactly equal to an independent lexicographic next-permutation result set.',source_ids:['validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:validation.command,result:'pass',reported_stdout:process.env.STDOUT,checks:validation.checks,boundary_tests:validation.boundary_tests},
            review_state:'independent_source_first_review_passed',
            review:{reviewer_id:reviewer,review_version:'permutations.v1',independent:true,decision:'pass',revision_round:1,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_84d2dc5dbad1c298d0b977742d0b8225` permutations source is recoverable only as “hand-write full permutations”. The candidate explicitly bounds distinct-input, empty-array and null semantics instead of attributing them to the source, supplies a complete Java backtracking implementation, and passes fixed n=0..8 plus 120 randomized distinct-input cases against an independent lexicographic next-permutation oracle with factorial-count/no-duplicate checks. Writer research is frozen; isolated independent source-first review remains pending before promotion.';
          const passed='- [x] `cq_q_84d2dc5dbad1c298d0b977742d0b8225` permutations candidate preserves the minimal recoverable source boundary, explicitly bounds distinct-input/empty/null semantics, supplies complete Java backtracking, passes n=0..8 plus 120 randomized cases against an independent lexicographic oracle with factorial/no-duplicate checks, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$out/code_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0035 permutations source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
