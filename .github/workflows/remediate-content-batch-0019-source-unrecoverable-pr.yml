name: Remediate Content Batch 0019 Source-Unrecoverable Questions

# Default-branch registered transport for the bounded source retirement. The
# mutation is verified in Actions and exported to an unprotected staging branch;
# the automation controller can then merge that verified commit into the active
# content branch. PR synchronization is the reliable execution trigger because
# the workflow definition is read from master.
on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/remediate-content-batch-0019-source-unrecoverable-pr.yml

permissions:
  contents: write

concurrency:
  group: master-trigger-batch-0019-source-unrecoverable
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  STAGING_BRANCH: automation/batch-0019-source-remediation

jobs:
  remediate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion' || startsWith(github.event.pull_request.head.ref, 'automation/batch0019-controller')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout content branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - name: Synchronize to latest content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_BRANCH"
          git reset --hard "origin/$CONTENT_BRANCH"

      - name: Check whether this bounded slice is already complete
        id: status
        shell: bash
        run: |
          set -euo pipefail
          task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0019.md'
          if grep -Fq 'Four source-unrecoverable singleton Questions are excluded without inventing coding contracts' "$task"; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'Source-unrecoverable batch 0019 slice is already complete.'
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo 'Source-unrecoverable batch 0019 slice still requires remediation.'
          fi

      - name: Setup Node
        if: steps.status.outputs.pending == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source-bounded retirement
        id: mutate
        if: steps.status.outputs.pending == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          mkdir -p .ci
          : > .ci/batch-0019-source-remediation.log
          {
            python3 scripts/content/remediate_batch_0019_unrecoverable.py
            node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
            node scripts/xhs.js index build --noManifest
            node scripts/content/check_question_coverage.js --check
            node scripts/xhs.js canonical check --noWrite
            node scripts/xhs.js answer validate --strict --noWrite
          } 2>&1 | tee -a .ci/batch-0019-source-remediation.log

      - name: Export failure diagnostic to staging branch
        if: steps.status.outputs.pending == 'true' && steps.mutate.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cp .ci/batch-0019-source-remediation.log /tmp/batch-0019-source-remediation.log
          git fetch origin "$CONTENT_BRANCH"
          git reset --hard "origin/$CONTENT_BRANCH"
          mkdir -p .ci
          cp /tmp/batch-0019-source-remediation.log .ci/batch-0019-source-remediation.log
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add .ci/batch-0019-source-remediation.log
          git commit -m "ci: record batch 0019 source remediation failure"
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"

      - name: Fail after exporting diagnostics
        if: steps.status.outputs.pending == 'true' && steps.mutate.outcome == 'failure'
        run: exit 1

      - name: Record bounded remediation progress
        if: steps.status.outputs.pending == 'true' && steps.mutate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          rm -f .ci/batch-0019-source-remediation.log
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0019.md')
          text = path.read_text(encoding='utf-8')
          marker = '## Remediation progress\n'
          section = '''## Remediation progress

- [x] Four source-unrecoverable singleton Questions are excluded without inventing coding contracts: `cq_q_2dcc4ae8850241c339c211516c55b307` (the supplied Shell script body is absent), `cq_q_2e11155d7a78e8fda6758fc98aa44029` (only “一道sql” is preserved), `cq_q_3022a886d714c0fc8bc2fa4d0b7812a5` (only “深拷贝” is preserved without an object-model/API contract), and `cq_q_3022eb4f8a66f69b09a2d019164f0bb5` (source is ambiguous between palindromic sequence/subsequence/substring and conflicts with Manacher). Their singleton Canonicals are retired, active placeholder Answers archived, ReviewProgress entries removed, and the Question validity audit records explicit `incomplete_or_unreadable` reasons.
- [ ] Two source-recoverable normalization records remain: `cq_q_2e26508950e5da505c44621129f41a26` must be split back into the two tasks actually preserved by source, and `cq_q_2f278e6b489feb680f8b173047815566` must replace misleading `子数组` wording with two groups/arrays of equal sum before answer generation.
'''
          if marker in text:
              text = text[:text.index(marker)].rstrip() + '\n\n' + section
          else:
              text = text.rstrip() + '\n\n' + section
          path.write_text(text, encoding='utf-8')
          PY

      - name: Export verified remediation to staging branch
        if: steps.status.outputs.pending == 'true' && steps.mutate.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No remediation changes to export.'
            exit 0
          fi
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "content: retire source-unrecoverable batch 0019 questions"
          git push --force origin "HEAD:refs/heads/$STAGING_BRANCH"
