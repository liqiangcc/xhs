name: Review Content Batch 0060 Heap vs Stack

on:
  push:
    branches: [content/quality-completion]
    paths:
      - .github/workflows/review-content-batch-0060-heap-vs-stack.yml
      - review/candidates/answers/cq_q_96ce9da81bb3e87508f94b80b5cfb62d.md
      - review/evidence/cq_q_96ce9da81bb3e87508f94b80b5cfb62d.json
      - review/content_build/answer_batch_0060/cq_q_96ce9da81bb3e87508f94b80b5cfb62d/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-batch-0060-heap-vs-stack-review
  cancel-in-progress: true

env:
  CANONICAL_ID: cq_q_96ce9da81bb3e87508f94b80b5cfb62d

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Recheck source-first review boundary
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const qids=['8d9ee90477e6807dd5fb3c3ff848b38c','96ce9da81bb3e87508f94b80b5cfb62d','e8f888efc320df32f6c1e52588d6b3f5'];
          const base=`review/content_build/answer_batch_0060/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
          if(!ctx.ok||ctx.answer_type!=='concept'||JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(qids)) throw new Error('context/ownership drift');
          const p=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
          for(const id of ['linux-man-pages-alloca','linux-man-pages-malloc','jvms26-jvm-stacks','jvms26-heap']) if(!(p.sources||[]).some(x=>x.source_id===id)) throw new Error(`primary source missing: ${id}`);
          const path=`review/candidates/answers/${cid}.md`,digest=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex');
          if(digest!=='3f4814a4194bc2bf7901c191b542727f3ced8e72e54d6c40f2f34fcfc3e3c241') throw new Error(`candidate digest drift: ${digest}`);
          const r=JSON.parse(fs.readFileSync(`${base}/isolated_review_result.json`,'utf8'));
          if(r.review_mode!=='source_first_isolated'||r.decision!=='pass'||r.candidate_sha256!==digest||r.hard_failures?.length||r.unsupported_claims?.length||r.uncovered_source_variants?.length) throw new Error('review drift');
          if(Object.values(r.scores||{}).reduce((a,b)=>a+b,0)<90) throw new Error('review score below gate');
          const e=JSON.parse(fs.readFileSync(`review/evidence/${cid}.json`,'utf8'));
          if(e.review_state!=='independent_source_first_review_passed'||e.candidate_sha256!==digest||e.review?.decision!=='pass'||e.review?.independent!==true) throw new Error('evidence drift');
          if(JSON.stringify((e.source_question_coverage||[]).map(x=>x.question_id))!==JSON.stringify(qids)) throw new Error('source coverage drift');
          NODE
      - name: Strict candidate audit
        shell: bash
        run: node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --noWrite --noDraftCheck
      - name: Question coverage closure
        shell: bash
        run: node scripts/content/check_question_coverage.js --check
      - name: Canonical closure
        shell: bash
        run: node scripts/xhs.js canonical check --noWrite
      - name: Review integrity closure
        shell: bash
        run: node scripts/xhs.js review integrity --noWrite
      - name: Strict answer validation closure
        shell: bash
        run: node scripts/xhs.js answer validate --strict --noWrite
      - name: Repository validation closure
        shell: bash
        run: node scripts/xhs.js validate all --noWrite
      - name: Unit and integration closure
        shell: bash
        run: npm test
      - name: CI check closure
        shell: bash
        run: npm run ci:check
      - name: Answer semantic closure
        shell: bash
        run: npm run ci:answer:semantic
      - name: Answer evidence closure
        shell: bash
        run: npm run ci:answer:evidence
      - name: Answer code closure
        shell: bash
        run: npm run ci:answer:code
      - name: Answer coverage closure
        shell: bash
        run: npm run ci:answer:coverage
