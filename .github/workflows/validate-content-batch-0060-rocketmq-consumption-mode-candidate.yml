name: Validate Content Batch 0060 RocketMQ Consumption Mode Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/validate-content-batch-0060-rocketmq-consumption-mode-candidate.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: content-batch-0060-rocketmq-consumption-mode-candidate-validation
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_484a655e20e46bf3e62d1de0c2da6e97

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard frozen source and candidate structure
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID;
          const qids=['484a655e20e46bf3e62d1de0c2da6e97','484cc261f2e058a639b84865778fbe1e'];
          const base=`review/content_build/answer_batch_0060/${cid}`;
          const ctx=JSON.parse(fs.readFileSync(`${base}/context.json`,'utf8'));
          if(!ctx.ok||ctx.answer_type!=='concept'||ctx.canonical?.canonical_id!==cid) throw new Error('context/type drift');
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify(qids)) throw new Error(`ownership drift: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const primary=JSON.parse(fs.readFileSync(`${base}/primary_source_research.json`,'utf8'));
          if(primary.schema_version!=='answer_primary_source_research.v1'||primary.canonical_id!==cid) throw new Error('primary research drift');
          for(const sourceId of ['rocketmq4-consumer-core-concept','rocketmq4-push-consumer','rocketmq5-consumer-load-balancing','rocketmq5-consumer-domain-model']) if(!(primary.sources||[]).some(x=>x.source_id===sourceId)) throw new Error(`primary source missing: ${sourceId}`);
          const mdPath=`review/candidates/answers/${cid}.md`,md=fs.readFileSync(mdPath,'utf8');
          for(const section of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(section).length-1!==1) throw new Error(`section drift: ${section}`);
          for(const marker of ['Clustering','Broadcasting','Consumer Group','MessageModel.CLUSTERING','MessageModel.BROADCASTING','PushConsumer','SimpleConsumer','PullConsumer']) if(!md.includes(marker)) throw new Error(`required RocketMQ marker missing: ${marker}`);
          if((md.match(/^- 问：/gm)||[]).length<3) throw new Error('followups insufficient');
          if(/生产环境里我|我负责过|我在线上|实际线上我们|我们项目中/.test(md)) throw new Error('fabricated experience risk');
          if(!md.includes('Push/Pull')||!md.includes('另外的分类维度')||!md.includes('4.x')) throw new Error('classification/version boundary missing');
          const digest=crypto.createHash('sha256').update(fs.readFileSync(mdPath)).digest('hex');
          const expected='0414ac51a45c6afc99644feec652e93de5628c8fb6a6ff528e95fa59bbde43e8';
          if(digest!==expected) throw new Error(`candidate digest drifted: ${digest}`);
          const writer=JSON.parse(fs.readFileSync(`${base}/writer_research.json`,'utf8'));
          if(writer.candidate_sha256!==digest||writer.review_state!=='writer_complete_isolated_review_pending') throw new Error('writer research/digest drift');
          if(JSON.stringify((writer.source_question_coverage||[]).map(x=>x.question_id))!==JSON.stringify(qids)) throw new Error('writer source coverage drift');
          NODE
      - name: Writer-stage audit has only expected pre-review blockers
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --noWrite --noDraftCheck > /tmp/audit.json
          rc=$?
          set -e
          cat /tmp/audit.json
          test "$rc" -ne 0
          node <<'NODE'
          const fs=require('fs');
          const report=JSON.parse(fs.readFileSync('/tmp/audit.json','utf8'));
          const row=report.rows?.[0]; if(!row) throw new Error('audit row missing');
          const actual=[...(row.hard_failures||[])].sort(),expected=['missing_evidence','missing_independent_review'].sort();
          if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`unexpected writer-stage hard failures: ${JSON.stringify(actual)}`);
          for(const e of (row.errors||[]).map(x=>x.error)) if(!['missing_evidence','missing_dimension_score','review_not_passed','total_score_below_minimum'].includes(e)) throw new Error(`unexpected writer-stage audit error: ${e}`);
          NODE
      - name: Baseline repository invariants
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
