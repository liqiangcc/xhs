name: Remediate Content Batch 0035 Generic SQL Unrecoverable Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0035-generic-sql-unrecoverable.yml
      - scripts/content/remediate_batch_0035_unrecoverable_sql_prompt.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0035-generic-sql-unrecoverable
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_82b0328e96bc4a148f49b73e6ff2dbd2

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply source-first fail-closed retirement
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/remediate_batch_0035_unrecoverable_sql_prompt.py > /tmp/remediate.py
          python3 -m py_compile /tmp/remediate.py
          python3 /tmp/remediate.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest
          node scripts/xhs.js answer type-audit --noManifest

      - name: Verify explainable invalid SQL projection and retired reachability
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('.');cid='cq_q_82b0328e96bc4a148f49b73e6ff2dbd2';expected='写SQL题目';source='67d3dbe1000000001b024087'
          canon={json.loads(x)['canonical_id'] for x in (root/'data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()}
          rows=[r for r in (json.loads(x) for x in (root/'data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()) if r.get('source_note_id')==source and r.get('original_question')==expected]
          if len(rows)!=1: raise SystemExit(f'expected one invalid SQL Question projection, got {len(rows)}')
          row=rows[0];qid=row['question_id']
          progress_ids={r.get('canonical_id') for r in json.loads((root/'review/progress.json').read_text(encoding='utf-8')).get('items',[])}
          audit=json.loads((root/'config/question_validity_audit.json').read_text(encoding='utf-8'));decisions=[r for r in audit.get('decisions',[]) if r.get('source_note_id')==source and r.get('source_question_index')==row.get('source_question_index')]
          if cid in canon: raise SystemExit('retired SQL Canonical still active')
          if row.get('canonical_id') is not None or row.get('is_valid_for_library') is not False or row.get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'invalid SQL projection incorrect: {row}')
          if cid in progress_ids: raise SystemExit('SQL ReviewProgress still active')
          if (root/'review/answers'/f'{cid}.md').exists(): raise SystemExit('active SQL baseline Answer still exists')
          if not (root/'review/archive/answers'/f'{cid}.md').exists(): raise SystemExit('archived SQL baseline Answer missing')
          if (root/'review/candidates/answers'/f'{cid}.md').exists(): raise SystemExit('unexpected SQL candidate exists')
          if len(decisions)!=1 or decisions[0].get('question_id')!=qid or decisions[0].get('decision')!='exclude' or decisions[0].get('exclusion_reason')!='incomplete_or_unreadable': raise SystemExit(f'validity exclusion missing/drifted: {decisions}')
          note=decisions[0].get('exclusion_note') or ''
          for token in ('让写sql','表结构','查询的结果','SQL 方言','strict-valid Coding'):
              if token not in note: raise SystemExit(f'exclusion explanation missing {token}')
          print(f'PASS generic SQL source retired fail-closed and explainable question={qid}')
          PY

      - name: Verify complete repository gates after retirement
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Record bounded batch progress
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md');t=p.read_text(encoding='utf-8')
          line='- [x] Source-unrecoverable singleton `cq_q_82b0328e96bc4a148f49b73e6ff2dbd2` is excluded fail-closed: the source only preserves “面试官就让写sql” / “写SQL题目”, without schema, requested result, predicates, joins, grouping, ordering, dialect or examples. Its Canonical is retired, baseline Answer archived, ReviewProgress removed, and invalid Question projection remains explainable instead of fabricating a SQL problem.'
          if '## Progress' not in t:t=t.rstrip()+'\n\n## Progress\n'
          if line not in t:t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")";base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ];then echo "Content branch advanced during remediation: $base_head -> $remote_head";echo 'Discard verified local mutation.';exit 0;fi
          git add -A
          if git diff --cached --quiet;then echo 'No generic SQL remediation changes.';exit 0;fi
          git diff --cached --check
          git config user.name xhs-remediation-bot;git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'content: retire unrecoverable batch 0035 generic SQL question'
          git push origin "HEAD:$CONTENT_BRANCH"
