name: Prepare Content Batch 0051 Source Inventory

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/prepare-content-batch-0051-source-inventory.yml
      - scripts/content/prepare_batch_0051_source_inventory.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0051-source-inventory
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze Batch 0051 source-first inventory
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/prepare_batch_0051_source_inventory.py > /tmp/prepare.py
          python3 -m py_compile /tmp/prepare.py
          python3 /tmp/prepare.py

      - name: Validate inventory state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          node scripts/content/check_question_coverage.js --check

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0051 inventory: $base_head -> $remote_head"
            echo 'Discard verified local inventory; retry against current state.'
            exit 0
          fi
          git add review/content_build/answer_batch_0051/source_inventory.json tasks/answer-batches/TASK-20260711-0313-answer-batch-0051.md
          if git diff --cached --quiet; then
            echo 'No Batch 0051 inventory changes to commit.'
            exit 0
          fi
          git diff --cached --check
          git config user.name xhs-source-audit-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: freeze batch 0051 live source inventory'
          git push origin "HEAD:$CONTENT_BRANCH"
