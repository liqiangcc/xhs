name: Build Content Batch 0037 Daily New Old Users Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0037-daily-new-old-users-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0037-daily-new-old-users-build
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_8c97435494ae4e1055f82e1a4710634d
  SOURCE_QID: 8c97435494ae4e1055f82e1a4710634d
  SOURCE_TAGGED: note_tagged/67ffada6000000000d0171d2.json

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Guard exact source and long-tail baseline
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),qid=process.env.SOURCE_QID,cid=process.env.CANONICAL_ID;
          const tagged=JSON.parse(fs.readFileSync(process.env.SOURCE_TAGGED,'utf8'));
          const q=(tagged.tagged_questions||[]).find(x=>x.question_id===qid);
          const expected='SQL 应用：给定一张用户登录日志表，请编写 SQL 统计“每天老用户和新增用户”的数量（考察点：左连接或 `NOT EXISTS` 判断新老用户）。';
          if(!q||q.original_question!==expected||q.is_valid_for_library!==true) throw new Error('source question drift');
          const formal=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!formal.includes('"status":"needs_update"')||!formal.includes('"quality_tier":"long_tail_baseline"')) throw new Error('formal answer no longer long-tail baseline');
          if(!formal.includes(expected)) throw new Error('formal source locator drift');
          if(fs.existsSync(`review/candidates/answers/${cid}.md`)) throw new Error('candidate already exists');
          NODE
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs'),c=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!c.ok||c.canonical?.canonical_id!==process.env.CANONICAL_ID||c.answer_type!=='coding') throw new Error('canonical/type drift');
          const src=c.source_questions||[];
          if(!src.some(x=>(x.original_question||'').includes('每天老用户和新增用户'))) throw new Error(`canonical source wording drift: ${JSON.stringify(src)}`);
          NODE

      - name: Write source-bounded SQL candidate and fixture
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; out="review/content_build/answer_batch_0037/$cid"; mkdir -p "$out" review/candidates/answers
          cat > "review/candidates/answers/$cid.md" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_8c97435494ae4e1055f82e1a4710634d","version":1,"status":"draft","updated_at":"2026-08-26","answer_type":"coding","quality_tier":"candidate"} -->
          # SQL：统计每天新增用户和老用户数量

          ## 核心结论

          来源只说明“用户登录日志表”，没有给真实表名、字段名、时区和同日多次登录的计数口径。这里先声明最小契约：`login_log(user_id, login_time)` 每行是一条登录事件；统计粒度是“用户-自然日”，同一用户同一天登录多次只算 1 人；某用户第一次出现的自然日算新增用户，之后再次出现的日期算老用户。先去重得到每日活跃用户，再求每个用户的首次登录日，最后按日期条件聚合。

          ## 1 分钟版

          - 先把事件日志去重成 `DISTINCT user_id + login_date`，避免一个人当天多次登录被重复计数。
          - 再按 `user_id` 求 `MIN(login_date)`，得到首次登录日 `first_date`。
          - 当 `login_date = first_date` 时计入新增；当 `login_date > first_date` 时计入老用户。
          - 最终按 `login_date` 分组，分别对两个条件求和；该口径下每天 `新增 + 老用户 = 当天去重活跃用户数`。

          ## 3 分钟版

          假设登录表为 `login_log(user_id, login_time)`，并以数据库当前会话的自然日切分：

          ```sql
          WITH daily_users AS (
              SELECT DISTINCT
                     user_id,
                     DATE(login_time) AS login_date
              FROM login_log
          ),
          first_login AS (
              SELECT
                  user_id,
                  MIN(DATE(login_time)) AS first_date
              FROM login_log
              GROUP BY user_id
          )
          SELECT
              d.login_date,
              SUM(CASE WHEN d.login_date = f.first_date THEN 1 ELSE 0 END) AS new_users,
              SUM(CASE WHEN d.login_date > f.first_date THEN 1 ELSE 0 END) AS old_users
          FROM daily_users AS d
          JOIN first_login AS f
            ON f.user_id = d.user_id
          GROUP BY d.login_date
          ORDER BY d.login_date;
          ```

          如果面试官明确希望用 `NOT EXISTS` 判断“当天是否第一次出现”，也可以在已经去重的 `daily_users` 上判断是否存在更早日期：

          ```sql
          WITH daily_users AS (
              SELECT DISTINCT user_id, DATE(login_time) AS login_date
              FROM login_log
          )
          SELECT
              d.login_date,
              SUM(CASE WHEN NOT EXISTS (
                      SELECT 1
                      FROM daily_users AS p
                      WHERE p.user_id = d.user_id
                        AND p.login_date < d.login_date
                  ) THEN 1 ELSE 0 END) AS new_users,
              SUM(CASE WHEN EXISTS (
                      SELECT 1
                      FROM daily_users AS p
                      WHERE p.user_id = d.user_id
                        AND p.login_date < d.login_date
                  ) THEN 1 ELSE 0 END) AS old_users
          FROM daily_users AS d
          GROUP BY d.login_date
          ORDER BY d.login_date;
          ```

          两种写法的业务定义相同；第一种先物化“首次日期”通常更容易解释和验证，第二种更直接体现题干提示的 `NOT EXISTS` 思路。

          ## 关键细节

          - **先定义人数而不是事件数**：题目问“用户数量”，本答案按用户-日去重；若业务要统计登录次数，口径会完全不同。
          - **新增只发生一次**：某用户第一次登录日是新增；同一用户当天后续登录不会再次计数，未来日期都属于老用户。
          - **自然日依赖时区**：`DATE(login_time)` 的具体日界线取决于数据库和时间字段语义；生产环境应先把 UTC 时间转换到业务时区再截日。
          - **NULL 用户**：真实表若允许 `user_id IS NULL`，需要先定义匿名日志是否参与用户统计；本最小契约假设 `user_id` 非空。
          - **性能**：大表上真正的成本来自按用户求首次日期和按用户-日去重。可考虑维护用户首登维表，或根据查询引擎设计 `(user_id, login_time)` 等访问路径，并用执行计划验证。
          - **增量数仓**：若只扫描当天分区就无法判断“是否历史首次”。需要历史首登状态、用户维表或可访问的历史数据，不能把“当天第一次出现”误当成“生命周期第一次出现”。

          ## 原理机制

          这道题的核心是把事件流映射成用户状态。原始日志是一对多事件：一个用户一天可能有多行。`daily_users` 先把它压成“用户-日”集合；`first_login` 再为每个用户计算生命周期最小日期。于是每一条用户-日记录只有两种互斥状态：日期等于最小日期就是新增，晚于最小日期就是老用户。最后按日期聚合这些状态即可。这个分解让“去重口径”和“新老判定”相互独立，也方便分别验证。

          ## 项目经验版

          来源没有真实业务表规模、分区策略或生产执行计划，不能虚构项目数据。真实数仓里我会先确认业务时区、用户唯一键、是否包含匿名登录、迟到数据如何回补，以及是否已有“用户首次登录日”维度；再根据分区和索引/排序键设计增量方案，并用执行计划和分区扫描量验证成本。这些是落地检查项，不是本题来源事实。

          ## 常见追问

          - 问：为什么必须先 `DISTINCT`？答：因为统计的是人数而不是登录事件；不去重时一个用户当天多次登录会把同一个人累加多次。
          - 问：为什么不能只看当天分区判断新增？答：新增是生命周期首次登录；只看当天无法知道用户过去是否出现过，除非另有首登维表或历史状态。
          - 问：用左连接怎么写？答：把当天去重用户 `d` 左连接更早日期的同用户记录 `p`；若 `p.user_id IS NULL` 则当天是首次出现。不过要防止一名老用户匹配多条历史记录造成行数膨胀，通常应先聚合历史或使用 `NOT EXISTS`。
          - 问：`MIN(login_date)` 和 `NOT EXISTS` 哪个更好？答：语义都能表达首次出现；选择取决于数据布局和优化器。先求首登日更容易复用，`NOT EXISTS` 则直接表达“不存在更早记录”，最终应看执行计划与数据量。
          - 问：跨时区怎么办？答：先把时间戳转换到明确的业务时区，再截取自然日；否则 UTC 午夜和业务午夜不同会让首登日期及每天人数漂移。

          ## 易错点

          - 直接按登录事件 `COUNT(*)`，把同一用户一天多次登录重复计数。
          - 把“当天第一次登录”当成“用户生命周期首次登录”。
          - 用左连接历史明细后直接聚合，导致一个老用户因匹配多条历史登录而被重复放大。
          - 没有定义自然日时区，却把 `DATE(timestamp)` 的结果当成绝对业务日期。
          - 为了省扫描只看当天数据，却没有任何历史首登状态支撑新老判断。
          EOF

          cat > "$out/sql_validation.py" <<'PY'
          import sqlite3
          con=sqlite3.connect(':memory:')
          con.execute('create table login_log(user_id text not null, login_time text not null)')
          con.executemany('insert into login_log values(?,?)',[
              ('u1','2026-01-01 08:00:00'),('u1','2026-01-01 09:00:00'),('u2','2026-01-01 10:00:00'),
              ('u1','2026-01-02 07:00:00'),('u3','2026-01-02 12:00:00'),('u3','2026-01-02 13:00:00'),
              ('u2','2026-01-03 06:00:00'),('u3','2026-01-03 07:00:00'),('u4','2026-01-03 08:00:00'),
          ])
          q1='''WITH daily_users AS (SELECT DISTINCT user_id, DATE(login_time) AS login_date FROM login_log), first_login AS (SELECT user_id, MIN(DATE(login_time)) AS first_date FROM login_log GROUP BY user_id) SELECT d.login_date, SUM(CASE WHEN d.login_date=f.first_date THEN 1 ELSE 0 END), SUM(CASE WHEN d.login_date>f.first_date THEN 1 ELSE 0 END) FROM daily_users d JOIN first_login f ON f.user_id=d.user_id GROUP BY d.login_date ORDER BY d.login_date'''
          q2='''WITH daily_users AS (SELECT DISTINCT user_id, DATE(login_time) AS login_date FROM login_log) SELECT d.login_date, SUM(CASE WHEN NOT EXISTS (SELECT 1 FROM daily_users p WHERE p.user_id=d.user_id AND p.login_date<d.login_date) THEN 1 ELSE 0 END), SUM(CASE WHEN EXISTS (SELECT 1 FROM daily_users p WHERE p.user_id=d.user_id AND p.login_date<d.login_date) THEN 1 ELSE 0 END) FROM daily_users d GROUP BY d.login_date ORDER BY d.login_date'''
          expected=[('2026-01-01',2,0),('2026-01-02',1,1),('2026-01-03',1,2)]
          rows1=list(con.execute(q1)); rows2=list(con.execute(q2))
          assert rows1==expected,(rows1,expected); assert rows2==expected,(rows2,expected); assert rows1==rows2
          active=list(con.execute("select DATE(login_time),count(distinct user_id) from login_log group by DATE(login_time) order by 1"))
          assert [(d,n+o) for d,n,o in rows1]==active
          print('PASS days=3 expected=2/0,1/1,1/2 same-day-duplicates=deduped min-date=not-exists-equivalent active-invariant=pass')
          PY
          python3 "$out/sql_validation.py" > "$out/writer_stdout.txt"
          stdout="$(cat "$out/writer_stdout.txt")"
          test "$stdout" = 'PASS days=3 expected=2/0,1/1,1/2 same-day-duplicates=deduped min-date=not-exists-equivalent active-invariant=pass'

          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26',out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          fs.writeFileSync(`${out}/writer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:hash,result:'pass',validated_at:date,command:'python3 sql_validation.py against deterministic in-memory SQLite fixture',stdout:process.env.STDOUT,checks:['same-day duplicate login events count once per user-day','first day classifies as new','later days classify as old','MIN(first_date) and NOT EXISTS formulations are equivalent on fixture','new+old equals distinct active users per day']},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Repository tagged daily new/old login-user SQL question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'fixture',title:'Deterministic daily new/old user SQLite fixture',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved question asks for daily new and old user counts from login logs and points to left join or NOT EXISTS; concrete schema, timezone and deduplication details are not supplied.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','关键细节']},{claim_id:'classification-behavior',text:'Under the explicit user-day contract, first-date aggregation and NOT EXISTS formulations both produce 2/0, 1/1 and 1/2 new/old counts on a fixture containing duplicate same-day events and returning users.',source_ids:['fixture'],answer_locations:['3 分钟版','原理机制','常见追问']},{claim_id:'active-invariant',text:'For every fixture day, new_users + old_users equals distinct active users after user-day deduplication.',source_ids:['fixture'],answer_locations:['1 分钟版','关键细节']}],source_question_coverage:(ctx.source_questions||[]).map(x=>({question_id:x.question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制','常见追问']})),promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

