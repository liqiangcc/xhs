          const note='- [x] `cq_q_8c97435494ae4e1055f82e1a4710634d` daily new/old users SQL candidate preserves the login-log source boundary, explicitly defines user-day deduplication and lifecycle-first-login semantics, provides both first-date and `NOT EXISTS` formulations, and passes deterministic writer validation including duplicate same-day events and the active-user invariant. Writer evidence is frozen; isolated source-first review remains pending.';
          if(!t.includes('`cq_q_8c97435494ae4e1055f82e1a4710634d` daily new/old users SQL candidate')) t=t.trimEnd()+'\n'+note+'\n'; fs.writeFileSync(task,t);
