name: Review Content Batch 0036 Sliding Window Maximum

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0036-sliding-window-maximum.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0036-sliding-window-maximum-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b55a6649e9e0b7e2351c5d1f3d5f167c
  EXPLICIT_QID: b55a6649e9e0b7e2351c5d1f3d5f167c
  SHORTHAND_QID: 86a4c030e736e3eea9fed1f6b739694d

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and reviewer-owned oracle
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          test -f "$candidate"
          rm -rf "$out/reviewer_tmp"
          mkdir -p "$out/reviewer_tmp"

          # Phase A intentionally excludes writer_research, writer validation,
          # historical formal-answer content, evidence ledgers, and remediation
          # records. Form the review conclusion from primary source + current
          # candidate + current answer standard first.
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID, explicit=process.env.EXPLICIT_QID, shorthand=process.env.SHORTHAND_QID;
          const tagged=[
            ['note_tagged/68b124e8000000001b032114.json',explicit,'算法手撕：滑动窗口最大值（Sliding Window Maximum）。'],
            ['note_tagged/68b85518000000001d026c52.json',shorthand,'算法手撕：滑动窗口的最大值（Sliding Window Maximum）。'],
          ];
          for(const [file,qid,text] of tagged){
            const note=JSON.parse(fs.readFileSync(file,'utf8'));
            const q=(note.tagged_questions||[]).find(x=>x.question_id===qid);
            if(!q||q.original_question!==text) throw new Error(`${qid}: tagged primary source drifted: ${q?.original_question}`);
          }
          const explicitRaw=fs.readFileSync('note_desc/68b124e8000000001b032114.txt','utf8');
          const shorthandRaw=fs.readFileSync('note_desc/68b85518000000001d026c52.txt','utf8');
          const explicitPhrase='给定一个数组和滑动窗口大小K，返回每个滑动窗口的最大值。';
          if(!explicitRaw.includes(explicitPhrase)) throw new Error('explicit raw contract missing');
          if(!shorthandRaw.includes('算法  滑动窗口的最大值')) throw new Error('shorthand raw source phrase missing');

          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']){
            if(md.split(h).length!==2) throw new Error(`section missing/duplicated: ${h}`);
          }
          for(const marker of [
            'public final class SlidingWindowMaximum','maxSlidingWindow','deque.peekFirst() <= i - k',
            'nums[deque.peekLast()] <= nums[i]','时间 `O(n)`','额外空间 `O(k)`',
            '来源没有保存函数签名','这些是测试合同，不冒充原题原文'
          ]) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<6) throw new Error('question-specific followups insufficient');
          if(/真实项目里我|线上事故|我们生产|实际线上/.test(md)) throw new Error('fabricated project-experience language detected');
          const code=md.match(/```java\n([\s\S]*?)\n```/);
          if(!code) throw new Error('Java code block missing');
          fs.writeFileSync(`review/content_build/answer_batch_0036/${cid}/reviewer_tmp/SlidingWindowMaximum.java`,code[1]+'\n');
          NODE

          cat > "$out/reviewer_tmp/SlidingWindowMaximumReviewer.java" <<'JAVA'
          import java.util.Arrays;
          import java.util.Random;

          public final class SlidingWindowMaximumReviewer {
              static int[] oracle(int[] nums, int k) {
                  int[] out = new int[nums.length - k + 1];
                  for (int left = 0; left + k <= nums.length; left++) {
                      int max = nums[left];
                      for (int j = left + 1; j < left + k; j++) max = Math.max(max, nums[j]);
                      out[left] = max;
                  }
                  return out;
              }
              static void check(int[] nums, int k, int[] expected) {
                  int[] actual = SlidingWindowMaximum.maxSlidingWindow(nums, k);
                  if (!Arrays.equals(actual, expected)) {
                      throw new AssertionError("nums=" + Arrays.toString(nums) + " k=" + k
                              + " expected=" + Arrays.toString(expected) + " actual=" + Arrays.toString(actual));
                  }
              }
              public static void main(String[] args) {
                  check(new int[]{1,3,-1,-3,5,3,6,7},3,new int[]{3,3,5,5,6,7});
                  check(new int[]{1},1,new int[]{1});
                  check(new int[]{4,3,2,1},2,new int[]{4,3,2});
                  check(new int[]{1,2,3,4},2,new int[]{2,3,4});
                  check(new int[]{2,2,2,2},2,new int[]{2,2,2});
                  check(new int[]{-4,-2,-5,-1},2,new int[]{-2,-2,-1});
                  check(new int[]{9,1,9,1,9},3,new int[]{9,9,9});
                  check(new int[]{5,1,4,3,2},5,new int[]{5});
                  check(new int[]{7,6,5},1,new int[]{7,6,5});
                  try { SlidingWindowMaximum.maxSlidingWindow(new int[]{1,2},0); throw new AssertionError("k=0 accepted"); } catch (IllegalArgumentException expected) {}
                  try { SlidingWindowMaximum.maxSlidingWindow(new int[]{1,2},3); throw new AssertionError("k>n accepted"); } catch (IllegalArgumentException expected) {}
                  try { SlidingWindowMaximum.maxSlidingWindow(null,1); throw new AssertionError("null accepted"); } catch (IllegalArgumentException expected) {}

                  Random r = new Random(2026082603L);
                  long windows = 0;
                  for (int round = 0; round < 3000; round++) {
                      int n = 1 + r.nextInt(80);
                      int[] nums = new int[n];
                      for (int i = 0; i < n; i++) nums[i] = r.nextInt(201) - 100;
                      int k = 1 + r.nextInt(n);
                      int[] expected = oracle(nums,k);
                      int[] actual = SlidingWindowMaximum.maxSlidingWindow(nums,k);
                      if (!Arrays.equals(actual, expected)) {
                          throw new AssertionError("round=" + round + " nums=" + Arrays.toString(nums) + " k=" + k);
                      }
                      windows += expected.length;
                  }
                  System.out.println("PASS fixed=9 invalid=3 randomized=3000 oracle=quadratic-window-scan checked-windows=" + windows);
              }
          }
          JAVA
          javac "$out/reviewer_tmp/SlidingWindowMaximum.java" "$out/reviewer_tmp/SlidingWindowMaximumReviewer.java"
          reviewer_stdout="$(java -cp "$out/reviewer_tmp" SlidingWindowMaximumReviewer)"
          case "$reviewer_stdout" in
            PASS\ fixed=9\ invalid=3\ randomized=3000\ oracle=quadratic-window-scan\ checked-windows=*) ;;
            *) echo "unexpected reviewer validation output: $reviewer_stdout"; exit 1 ;;
          esac

          REVIEWER_STDOUT="$reviewer_stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-sliding-window-maximum-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const boundaryTests=[
            {case:'canonical mixed example',expected:'[3,3,5,5,6,7]',passed:true},
            {case:'duplicate maxima',expected:'equal values preserve correct maxima while newest equal candidate may dominate',passed:true},
            {case:'k=1 and k=n',expected:'identity maxima and one global maximum respectively',passed:true},
            {case:'3000 deterministic randomized arrays',expected:'exact agreement with independent quadratic window oracle',passed:true}
          ];
          const findings=[
            'The primary repository source preserves array + window-size-K -> maximum for every window; the second consolidated source only repeats the problem title. Exact method signature, invalid-k behavior, null behavior and complexity requirement are not preserved source facts.',
            'The candidate explicitly labels null and invalid-k behavior as an adopted executable contract rather than source wording.',
            'The deque stores indices, expires indices at <= i-k, removes dominated tail candidates and exposes the current maximum at the head.',
            'Java extracted directly from the candidate compiles and matches a reviewer-owned quadratic oracle on fixed duplicate/boundary cases plus 3000 deterministic randomized arrays.',
            'Each index is inserted once and removed at most once, supporting O(n) amortized time; at most k live candidate indices support O(k) auxiliary space.',
            'No fabricated production experience or unsupported source-specific API constraint was found.'
          ];
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({
            schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:date,
            command:'extract candidate Java; javac SlidingWindowMaximum.java SlidingWindowMaximumReviewer.java; java SlidingWindowMaximumReviewer',
            stdout:process.env.REVIEWER_STDOUT,
            checks:['candidate code compiles directly','canonical example','duplicates','increasing/decreasing','negative values','k=1','k=n','adopted invalid-input behavior','3000 deterministic randomized arrays'],
            boundary_tests:boundaryTests,
            oracle:'independent quadratic per-window maximum scan'
          },null,2)+'\n');
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,
            review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'sliding-window-maximum.v1',decision:'pass',revision_round:1,
            source_packet:['note_desc/68b124e8000000001b032114.txt','note_desc/68b85518000000001d026c52.txt','note_tagged/68b124e8000000001b032114.json','note_tagged/68b85518000000001d026c52.json',candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,
            promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');
          NODE

      - name: Bind evidence only after source-first conclusion
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0036/$CANONICAL_ID"
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,explicit=process.env.EXPLICIT_QID,shorthand=process.env.SHORTHAND_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0036/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const review=JSON.parse(fs.readFileSync(`${out}/isolated_review_result.json`,'utf8'));
          if(review.decision!=='pass'||review.candidate_sha256!==hash) throw new Error('isolated-review binding drifted');

          // Only after the independent conclusion may the reviewer inspect writer evidence.
          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          const writerValidation=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8'));
          const reviewerValidation=JSON.parse(fs.readFileSync(`${out}/reviewer_validation.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending'||writerValidation.result!=='pass'||reviewerValidation.result!=='pass') throw new Error('post-conclusion evidence prerequisite drifted');
          for(const qid of [explicit,shorthand]) if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error(`${qid}: writer coverage missing`);

          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,
            writer:{writer_id:'sliding-window-maximum-source-bounded-writer-20260826-v1',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'explicit-source',title:'Source-explicit Sliding Window Maximum interview record',locator:`note_tagged/68b124e8000000001b032114.json#question_id=${explicit}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'shorthand-source',title:'Consolidated Sliding Window Maximum shorthand source',locator:`note_tagged/68b85518000000001d026c52.json#question_id=${shorthand}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'relation-review',title:'Source-first same-relation review',locator:'review/content_build/answer_batch_0036/sliding_window_max_relation_review.md',source_type:'repository_structured_source',checked_at:date},
              {source_id:'writer-validation',title:'Writer quadratic-oracle validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'reviewer-validation',title:'Independent candidate-code compilation and quadratic-oracle validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Fresh source-first isolated review',locator:`${out}/isolated_review_result.json`,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The survivor covers both consolidated sources while exact API, invalid-k behavior, null behavior and complexity requirement remain non-source assumptions.',source_ids:['explicit-source','shorthand-source','relation-review'],answer_locations:['核心结论','3 分钟版','关键细节']},
              {claim_id:'algorithm-correctness',text:'The candidate Java monotonic deque matches independent quadratic per-window validation across fixed and randomized inputs.',source_ids:['writer-validation','reviewer-validation','isolated-review'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']},
              {claim_id:'complexity',text:'The candidate deque operations admit O(n) amortized total time and O(k) live auxiliary indices.',source_ids:['isolated-review'],answer_locations:['核心结论','1 分钟版','关键细节','原理机制']}
            ],
            source_question_coverage:[
              {question_id:explicit,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']},
              {question_id:shorthand,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版']}
            ],
            validation:{command:reviewerValidation.command,result:'pass',reported_stdout:reviewerValidation.stdout,checks:reviewerValidation.checks,boundary_tests:reviewerValidation.boundary_tests},
            review_state:'independent_source_first_review_passed',
            review:{reviewer_id:review.reviewer_id,review_version:'sliding-window-maximum.v1',independent:true,decision:'pass',revision_round:1,scores:review.scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings:review.findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0036.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [ ] `cq_q_b55a6649e9e0b7e2351c5d1f3d5f167c` consolidated Sliding Window Maximum survivor now has a source-bounded candidate with explicit adopted API/invalid-input assumptions and an executable Java monotonic-deque implementation matching an independent quadratic oracle across fixed boundaries plus 5000 deterministic randomized arrays. Writer evidence is frozen; isolated source-first review is still required before promotion.';
          const passed='- [x] `cq_q_b55a6649e9e0b7e2351c5d1f3d5f167c` consolidated Sliding Window Maximum survivor covers both source Questions without inventing missing API constraints, uses complete Java monotonic-deque logic, passes writer plus independent reviewer quadratic-oracle validation across duplicate/boundary cases and thousands of deterministic randomized arrays, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE
          node scripts/xhs.js review integrity --noWrite

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit isolated review only from stable candidate head
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "review/content_build/answer_batch_0036/$CANONICAL_ID/reviewer_tmp"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during sliding-window review slice: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass sliding-window-maximum candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
