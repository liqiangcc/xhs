name: One-off Pilot Ledger Sync

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/one-off-pilot-ledger-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Rebuild deterministic pilot audit ledger
        run: |
          set -euo pipefail
          node scripts/content/build_pilot_answer_audit.js
          node scripts/content/build_pilot_answer_audit.js --check
      - name: Commit ledger when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- data/manifests/quality/pilot_answer_audit.json; then
            echo "Pilot ledger already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manifests/quality/pilot_answer_audit.json
          git commit -m "content: refresh pilot audit ledger"
          git push origin HEAD:content/quality-completion
