name: Build Content Batch 0032 Next Permutation Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0032-next-permutation-candidate.yml
  pull_request:
    branches: [master]

permissions:
  contents: write

concurrency:
  group: content-batch-0032-next-permutation-candidate
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  BATCH: '0032'
  CANONICAL_ID: cq_q_713ec8f89a446c2c77c27989faaa00d1
  SOURCE_QID: 713ec8f89a446c2c77c27989faaa00d1

jobs:
  build-candidate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Guard exact source and frozen boundary
        shell: bash
        run: |
          set -euo pipefail
          test -f "review/reports/ANSWER_BATCH_${BATCH}_SOURCE_PACKET.json"
          test -f "review/content_build/answer_batch_${BATCH}/source_boundary_audit.md"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > /tmp/context.json
          node <<'NODE'
          const fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,batch=process.env.BATCH,expected='算法题：下一个排列';
          const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error('canonical context missing');
          if(ctx.answer_type!=='coding') throw new Error(`answer type drifted: ${ctx.answer_type}`);
          if(JSON.stringify(ctx.canonical?.question_ids||[])!==JSON.stringify([qid])) throw new Error(`ownership drifted: ${JSON.stringify(ctx.canonical?.question_ids)}`);
          const src=(ctx.source_questions||[]).find(x=>x.question_id===qid);
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          const boundary=fs.readFileSync(`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,'utf8');
          if(!boundary.includes(`| \`${cid}\` | \`${qid}\` | ${expected} |`)) throw new Error('frozen boundary missing');
          NODE

      - id: state
        shell: bash
        run: |
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          if [ -e "$candidate" ]; then test -e "$out/code_validation.json"; test -e "$out/writer_research.json"; echo 'pending=false' >> "$GITHUB_OUTPUT"; else echo 'pending=true' >> "$GITHUB_OUTPUT"; fi

      - name: Write source-bounded candidate and brute-force oracle fixture
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"; mkdir -p "$out"
          cat > "$candidate" <<'EOF'
          <!-- xhs-answer: {"schema_version":"answer.v1","canonical_id":"cq_q_713ec8f89a446c2c77c27989faaa00d1","version":1,"status":"draft","updated_at":"2026-08-25","answer_type":"coding","quality_tier":"candidate"} -->
          # 下一个排列：原地求下一个字典序排列

          ## 核心结论

          来源只有“算法题：下一个排列”，没有给 API、是否允许原地修改、重复元素语义或最大排列是否回绕。下面把这些都明确为**答案侧契约**：给定 `int[]`，原地改成按数值字典序严格更大的最小排列；如果当前已经是最大排列，则回绕到最小的升序排列；允许重复值；`null` 或长度小于 2 时不做修改。

          在线性时间、常数额外空间内可以完成三步：从右向左找到第一个下降转折 `i`，使 `nums[i] < nums[i+1]`；再从右端找到第一个严格大于 `nums[i]` 的元素交换；最后反转后缀 `i+1..n-1`。

          ## 1 分钟版

          - 从右往左找第一个 `nums[i] < nums[i+1]`。它右边的后缀此时一定是非递增的；这个 `i` 是还能让整体变大的最右位置。
          - 如果找不到这样的 `i`，说明整个数组已经非递增，也就是当前多重集合的最大字典序，直接整段反转得到最小升序排列。
          - 如果找到 `i`，从右往左找第一个 `nums[j] > nums[i]`。因为后缀非递增，这个元素就是“能让第 i 位变大的最小可用值”。
          - 交换 `i` 和 `j` 后，后缀仍处于非递增方向；把它反转成非递减，就得到在新前缀下最小的后缀。
          - 因此前缀只在最右可变位置增加了最小幅度，后缀又取最小，整体正好是下一个字典序排列。
          - 两次线性扫描加一次反转，总时间 `O(n)`，额外空间 `O(1)`。

          ## 3 分钟版

          ```java
          public final class NextPermutation {
              public static void nextPermutation(int[] nums) {
                  if (nums == null || nums.length < 2) return;

                  int i = nums.length - 2;
                  while (i >= 0 && nums[i] >= nums[i + 1]) i--;

                  if (i >= 0) {
                      int j = nums.length - 1;
                      while (nums[j] <= nums[i]) j--;
                      swap(nums, i, j);
                  }

                  reverse(nums, i + 1, nums.length - 1);
              }

              private static void reverse(int[] nums, int left, int right) {
                  while (left < right) swap(nums, left++, right--);
              }

              private static void swap(int[] nums, int i, int j) {
                  int t = nums[i];
                  nums[i] = nums[j];
                  nums[j] = t;
              }
          }
          ```

          例如 `[1,2,3]`：转折点是 `2`，右侧最小的大值是 `3`，交换后后缀只有一个元素，得到 `[1,3,2]`。`[3,2,1]` 找不到转折点，整段反转得到 `[1,2,3]`。`[1,1,5]` 的转折点是第二个 `1`，与右侧 `5` 交换后得到 `[1,5,1]`，重复元素不需要特殊去重逻辑。

          ## 关键细节

          - **为什么找最右转折点**：要得到“刚好大一点”的排列，应尽量保持更高位前缀不变，所以修改位置必须尽可能靠右。
          - **为什么从右端找第一个更大值**：转折点右侧已经非递增，从右端向左遇到的第一个 `> nums[i]` 的值，就是后缀中严格大于它的最小值；重复值也自然满足这个结论。
          - **为什么交换后只需反转后缀**：交换前后缀非递增；选中的 `j` 是最右侧大于 pivot 的位置，交换后该后缀仍可通过反转得到其最小非递减排列，无需排序。
          - **最大排列回绕**：来源未写回绕规则；这里采用常见的循环式 next-permutation 契约，最大排列变成最小排列。如果调用方希望“没有下一个排列”返回布尔值或 Optional，需要改 API，而不是悄悄改变语义。
          - **重复元素**：比较条件必须是 pivot 搜索用 `>=`、successor 搜索用 `<=`，这样要求真正的严格增加，同时不会把相等值当作下一排列。
          - **输入修改**：本答案选择原地修改，是答案侧接口约定；如果题目要求不可变输入，可先复制再执行同一算法。
          - **复杂度**：pivot 扫描、successor 扫描、后缀反转都至多线性，总时间 `O(n)`；只用若干下标和临时变量，额外空间 `O(1)`。

          ## 原理机制

          字典序比较先看第一个不同位置。为了找当前排列之后的最小排列，就要让这个“第一个不同位置”尽量靠右，并且只增加到刚好能增加的最小值。最右转折点 `i` 正是这样的边界：它右边已经是该后缀的最大排列（非递增），单独改后缀不可能再变大，所以必须提升 `nums[i]`。

          提升 pivot 时，又必须选择后缀中严格大于它的最小值，避免前缀增加过多。完成这一步后，前缀已经确定为“所有更大前缀中的最小一个”；因此剩余后缀必须排成最小顺序，也就是非递减。由于后缀已有单调结构，交换后直接反转即可线性完成。

          ## 项目经验版

          来源是纯算法题，没有真实项目背景，因此不虚构生产使用经历。工程实现时我会先确认 API 是否采用“最大排列回绕”、是否允许原地修改，以及元素比较是否只是整数自然序；若元素是对象或需要自定义 comparator，这些都属于接口契约扩展，算法的不变量仍是“最右可提升位置 + 最小提升值 + 最小后缀”。

          ## 常见追问

          - 问：为什么不能直接把数组排序后找下一种？答：那通常至少要 `O(n log n)`，而当前后缀的单调结构足以在线性时间直接构造下一排列。
          - 问：为什么 pivot 条件是 `<` 而不是 `<=`？答：相等值交换不会让字典序变大；必须找到一个能被右侧更大元素严格提升的位置。
          - 问：重复元素会漏掉排列吗？答：不会。successor 只要求严格大于 pivot，并选取后缀中的最小更大值；相等元素保持在同一多重集合中，反转后缀得到对应的最小排列。
          - 问：最大排列怎么办？答：本答案侧契约定义为回绕到最小升序排列；如果题目要求返回“无下一个”，需要把这一点改成显式返回状态。
          - 问：为什么后缀不是 sort？答：找 pivot 时已经证明原后缀非递增；交换最右的最小更大值后，反转即可得到最小后缀，不需要一般排序。
          - 问：空数组或单元素数组呢？答：本 API 把它们定义为 no-op；它们只有一个可观察排列状态。

          ## 易错点

          - pivot 搜索写成 `nums[i] > nums[i+1]`，导致重复值边界错误。
          - successor 搜索允许 `nums[j] == nums[i]`，交换后字典序并没有变大。
          - 交换 pivot 后忘记把后缀变成最小顺序，得到的只是某个更大排列，不一定是“下一个”。
          - 最大排列时只返回不处理，和“循环到最小排列”的答案侧契约不一致。
          - 用排序处理后缀，虽然可能正确，却把可利用的单调结构和 `O(n)` 目标浪费掉。
          EOF

          cat > "$out/NextPermutationFixture.java" <<'JAVA'
          import java.util.Arrays;
          import java.util.Random;

          public final class NextPermutationFixture {
              static void actual(int[] nums) {
                  if (nums == null || nums.length < 2) return;
                  int i = nums.length - 2;
                  while (i >= 0 && nums[i] >= nums[i + 1]) i--;
                  if (i >= 0) {
                      int j = nums.length - 1;
                      while (nums[j] <= nums[i]) j--;
                      swap(nums, i, j);
                  }
                  reverse(nums, i + 1, nums.length - 1);
              }
              static void reverse(int[] a,int l,int r){ while(l<r) swap(a,l++,r--); }
              static void swap(int[] a,int i,int j){ int t=a[i]; a[i]=a[j]; a[j]=t; }

              static int compare(int[] a, int[] b) {
                  for (int i=0;i<a.length;i++) { int c=Integer.compare(a[i],b[i]); if(c!=0)return c; }
                  return 0;
              }
              static int[] oracle(int[] input) {
                  if (input == null) return null;
                  int[] work=input.clone();
                  Holder h=new Holder();
                  permute(work,0,input,h);
                  return h.bestGreater!=null ? h.bestGreater : h.minimum;
              }
              static final class Holder { int[] bestGreater; int[] minimum; }
              static void permute(int[] a,int pos,int[] original,Holder h){
                  if(pos==a.length){
                      int[] p=a.clone();
                      if(h.minimum==null||compare(p,h.minimum)<0)h.minimum=p;
                      if(compare(p,original)>0&&(h.bestGreater==null||compare(p,h.bestGreater)<0))h.bestGreater=p;
                      return;
                  }
                  for(int i=pos;i<a.length;i++){ swap(a,pos,i); permute(a,pos+1,original,h); swap(a,pos,i); }
              }
              static void check(int[] input){
                  int[] expected=oracle(input);
                  int[] actual=input==null?null:input.clone();
                  actual(actual);
                  if(!Arrays.equals(actual,expected)) throw new AssertionError("input="+Arrays.toString(input)+" actual="+Arrays.toString(actual)+" expected="+Arrays.toString(expected));
              }
              public static void main(String[] args){
                  check(null); check(new int[]{}); check(new int[]{1}); check(new int[]{1,2,3}); check(new int[]{1,3,2}); check(new int[]{3,2,1}); check(new int[]{1,1,5}); check(new int[]{1,5,1}); check(new int[]{2,2,0,1});
                  Random r=new Random(713ec8L);
                  for(int t=0;t<1200;t++){ int n=r.nextInt(8); int[] a=new int[n]; for(int i=0;i<n;i++)a[i]=r.nextInt(5)-2; check(a); }
                  System.out.println("PASS fixed-boundaries randomized=1200 brute-force-lexicographic-oracle duplicates-and-wraparound");
              }
          }
          JAVA

      - name: Execute fixture and freeze writer evidence
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"
          javac "$out/NextPermutationFixture.java"
          stdout="$(java -cp "$out" NextPermutationFixture)"
          test "$stdout" = 'PASS fixed-boundaries randomized=1200 brute-force-lexicographic-oracle duplicates-and-wraparound'
          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),path=require('path');
          const batch=process.env.BATCH,cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,out=`review/content_build/answer_batch_${batch}/${cid}`;
          fs.writeFileSync(path.join(out,'code_validation.json'),JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,result:'pass',validated_at:'2026-08-25',command:'javac NextPermutationFixture.java && java NextPermutationFixture',stdout:process.env.STDOUT,checks:['null/empty/single no-op','ascending next','descending wraparound','duplicate values','mixed suffix','1,200 deterministic randomized arrays vs brute-force lexicographic oracle']},null,2)+'\n');
          fs.writeFileSync(path.join(out,'writer_research.json'),JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:'2026-08-25',review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Batch 0032 exact source-first singleton boundary',locator:`review/content_build/answer_batch_${batch}/source_boundary_audit.md`,source_type:'repository_source_record',checked_at:'2026-08-25'},{source_id:'fixture',title:'Next-permutation deterministic brute-force oracle fixture',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:'2026-08-25'}],claims:[{claim_id:'source-boundary',text:'The preserved source only names the next-permutation algorithm problem; API, in-place mutation, duplicate handling and wraparound are explicitly answer-side contracts.',source_ids:['repository-source'],answer_locations:['核心结论','关键细节']},{claim_id:'algorithm-behavior',text:'The fixture validates rightmost-pivot, smallest-greater-successor and suffix-reversal behavior against a brute-force lexicographic oracle over fixed boundaries and 1,200 deterministic random arrays.',source_ids:['fixture'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'duplicates-wraparound',text:'Executable checks cover duplicate values and the answer-side maximum-to-minimum wraparound contract.',source_ids:['fixture'],answer_locations:['核心结论','关键细节','常见追问']}],source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

      - name: Record bounded progress
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          python3 - <<'PY'
          import os,pathlib
          batch=os.environ['BATCH']; cid=os.environ['CANONICAL_ID']; path=pathlib.Path(f'tasks/answer-batches/TASK-20260711-0313-answer-batch-{batch}.md'); text=path.read_text(encoding='utf-8')
          note=f"- [ ] `{cid}` candidate staged source-first: exact next-permutation singleton boundary preserved; in-place, duplicate and wraparound semantics are explicit answer-side contracts; Java candidate passes fixed boundaries plus 1,200 deterministic brute-force lexicographic-oracle cases. Independent review still required.\n"
          if note not in text: path.write_text(text.rstrip()+"\n"+note,encoding='utf-8')
          PY

      - name: Commit candidate from stable content snapshot
        if: steps.state.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          base_head='${{ steps.base.outputs.head }}'; git fetch --depth=1 origin "$CONTENT_BRANCH"; remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          if [ "$remote_head" != "$base_head" ]; then echo "Content branch advanced: $base_head -> $remote_head; discard mixed snapshot."; exit 0; fi
          candidate="review/candidates/answers/$CANONICAL_ID.md"; out="review/content_build/answer_batch_${BATCH}/$CANONICAL_ID"; task="tasks/answer-batches/TASK-20260711-0313-answer-batch-${BATCH}.md"
          git config user.name 'xhs-content-builder'; git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "$candidate" "$out" "$task"; git diff --cached --check; git commit -m "content: stage batch ${BATCH} next-permutation candidate"; git push origin "HEAD:$CONTENT_BRANCH"
