name: Remediate Content Batch 0022 Source Boundaries

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
    paths:
      - .github/workflows/remediate-content-batch-0022-boundaries.yml

permissions:
  contents: write

concurrency:
  group: content-batch-0022-source-boundaries
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  remediate:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'content/quality-completion'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout latest content branch
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - name: Synchronize and capture base head
        id: base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_BRANCH"
          git reset --hard "origin/$CONTENT_BRANCH"
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check whether bounded remediation is already complete
        id: status
        shell: bash
        run: |
          set -euo pipefail
          task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0022.md'
          boundary='review/content_build/answer_batch_0022/source_boundary_audit.md'
          if [ -f "$boundary" ] \
             && grep -Fq 'Active after source-boundary audit: `7`' "$task" \
             && grep -Fq 'first continuous digit substring' "$task" \
             && grep -Fq '类似于股票卖出的最佳时机' "$task" \
             && grep -Fq '贪心+双指针' "$task"; then
            echo 'pending=false' >> "$GITHUB_OUTPUT"
            echo 'Batch 0022 source-boundary remediation already complete.'
          else
            echo 'pending=true' >> "$GITHUB_OUTPUT"
            echo 'Batch 0022 source-boundary remediation is pending.'
          fi

      - name: Set up Node.js 22
        if: steps.status.outputs.pending == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        if: steps.status.outputs.pending == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        if: steps.status.outputs.pending == 'true'
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Apply source-first boundary dispositions
        if: steps.status.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/content/remediate_batch_0022_boundaries.py
          node scripts/xhs.js migrate build-questions --build-date 2026-06-30 --noManifest
          node scripts/xhs.js index build --noManifest

      - name: Verify exact batch 0022 dispositions
        if: steps.status.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          retired = {
              'cq_q_3bd9ce7e8b983c0e09e7b573588a0d3a',
              'cq_q_3de03dc6dea1f4c4fa3022b5283db2ea',
              'cq_q_3e406e6dedb661f2b0b02d4355917de0',
          }
          normalized_cid = 'cq_q_3bf259d7b6e7b206848ba45de660e99a'
          normalized_qid = '5f1229da81132a7214d064e2a8fc0b4c'
          old_qid = '3bf259d7b6e7b206848ba45de660e99a'
          qualified = {
              'cq_q_3aa1637d60f1dbea7bb4279a4ae3f6a1',
              'cq_q_3ae198b1c39ab778836b9d3b8bd106b0',
              'cq_q_3c1de47a37045804edd3e2e78ec3856d',
              'cq_q_3c7d96b17f91a649fa290bd93958f08c',
              'cq_q_3d550dfc40061007739e893f666d49f2',
              'cq_q_3e0fe4f12f951128a2a1fb250199dcd6',
              normalized_cid,
          }

          canon = [json.loads(x) for x in Path('data/questions/canonical_questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          by_cid = {row['canonical_id']: row for row in canon}
          leaked = sorted(retired & by_cid.keys())
          if leaked:
              raise SystemExit(f'retired batch 0022 Canonicals are still active: {leaked}')
          missing = sorted(qualified - by_cid.keys())
          if missing:
              raise SystemExit(f'qualified batch 0022 Canonicals disappeared: {missing}')

          row = by_cid.get(normalized_cid)
          if not row or row.get('question_ids') != [normalized_qid]:
              raise SystemExit(f'normalized Canonical ownership mismatch: {row}')
          title = row.get('canonical_title', '')
          if '第一个连续数字子串' not in title or '指定子串' in title:
              raise SystemExit(f'normalized Canonical title is not source-preserving: {title}')

          questions = [json.loads(x) for x in Path('data/questions/questions.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          if any(q.get('question_id') == old_qid for q in questions):
              raise SystemExit('old broad string-extraction Question id still present')
          q = next((q for q in questions if q.get('question_id') == normalized_qid), None)
          if not q or q.get('canonical_id') != normalized_cid:
              raise SystemExit('normalized string-extraction Question projection is missing or misbound')
          if '第一个连续数字子串' not in q.get('original_question', ''):
              raise SystemExit('normalized Question wording drifted')

          progress = json.loads(Path('review/progress.json').read_text(encoding='utf-8'))
          progress_ids = {item.get('canonical_id') for item in progress.get('items', [])}
          leaked_progress = sorted(retired & progress_ids)
          if leaked_progress:
              raise SystemExit(f'retired Canonicals still have ReviewProgress: {leaked_progress}')
          for cid in retired:
              if Path(f'review/answers/{cid}.md').exists():
                  raise SystemExit(f'{cid}: retired Canonical still has an active Answer')
              if not Path(f'review/archive/answers/{cid}.md').exists():
                  raise SystemExit(f'{cid}: retired Canonical Answer was not archived')

          audit = json.loads(Path('config/question_validity_audit.json').read_text(encoding='utf-8'))
          excluded_qids = {
              d.get('question_id')
              for d in audit.get('decisions', [])
              if d.get('decision') == 'exclude' and d.get('exclusion_reason') == 'incomplete_or_unreadable'
          }
          expected_retired_qids = {cid.removeprefix('cq_q_') for cid in retired}
          if not expected_retired_qids <= excluded_qids:
              raise SystemExit('validity audit is missing one or more batch 0022 fail-closed exclusions')
          PY

      - name: Verify repository integrity and full quality gates
        if: steps.status.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only if content head stayed stable during validation
        if: steps.status.outputs.pending == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during validation: $base_head -> $remote_head"
            echo 'Discarding this verified local mutation; a later trigger will retry against the newer source state.'
            exit 0
          fi
          if git diff --quiet; then
            echo 'No batch 0022 source-boundary remediation changes remain.'
            exit 0
          fi
          git config user.name "xhs-remediation-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "content: apply batch 0022 source-boundary dispositions"
          git push origin "HEAD:$CONTENT_BRANCH"
