name: Content Batch 0044 Simplified Shared Ptr

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/content-batch-0044-simplified-shared-ptr.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0044-simplified-shared-ptr
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_b744814b5ab42c16a426c373788f2e7f
  SOURCE_QID: b744814b5ab42c16a426c373788f2e7f

jobs:
  validate-review-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Freeze source and exact C++ candidate
        shell: bash
        run: |
          set -euo pipefail
          cid="$CANONICAL_ID"; qid="$SOURCE_QID"; out="review/content_build/answer_batch_0044/$cid"; mkdir -p "$out" /tmp/b44-sp review/evidence
          node scripts/xhs.js answer context --canonical-id "$cid" --noWrite > /tmp/b44-sp/context.json
          python3 - <<'PY'
          import hashlib,json,os,pathlib,re
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; exact='代码实现：写一个简化的智能指针（shared_ptr）类的核心逻辑。'
          ctx=json.loads(pathlib.Path('/tmp/b44-sp/context.json').read_text())
          if not ctx.get('ok') or ctx.get('canonical',{}).get('canonical_id')!=cid or ctx.get('answer_type')!='coding': raise SystemExit('context drift')
          if ctx.get('canonical',{}).get('question_ids') != [qid]: raise SystemExit('ownership drift')
          src=next((x for x in ctx.get('source_questions',[]) if x.get('question_id')==qid),None)
          if not src or src.get('original_question')!=exact or src.get('is_valid_for_library') is not True: raise SystemExit('source drift')
          inv=json.loads(pathlib.Path('review/content_build/answer_batch_0044/source_inventory.json').read_text())
          item=next((x for x in inv.get('items',[]) if x.get('canonical_id')==cid),None)
          if not item or item.get('answer_type')!='coding' or item.get('question_ids')!=[qid]: raise SystemExit('inventory drift')
          p=pathlib.Path(f'review/candidates/answers/{cid}.md'); md=p.read_text()
          for h in ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']:
              if md.count(h)!=1: raise SystemExit(f'section drift {h}')
          blocks=re.findall(r'```cpp\n(.*?)\n```',md,re.S)
          if len(blocks)!=1: raise SystemExit(f'expected one cpp block, got {len(blocks)}')
          pathlib.Path('/tmp/b44-sp/SimpleSharedPtr.hpp').write_text(blocks[0].strip()+'\n')
          digest=hashlib.sha256(p.read_bytes()).hexdigest(); pathlib.Path('/tmp/b44-sp/candidate.sha256').write_text(digest+'\n')
          pathlib.Path(f'review/content_build/answer_batch_0044/{cid}/context.json').write_text(json.dumps(ctx,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Compile and run independent ownership/lifetime tests
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/b44-sp/test.cpp <<'CPP'
          #include "SimpleSharedPtr.hpp"
          #include <cassert>
          #include <vector>
          #include <iostream>
          struct Probe { static int alive; static int destroyed; int value; explicit Probe(int v):value(v){++alive;} ~Probe(){--alive;++destroyed;} };
          int Probe::alive=0; int Probe::destroyed=0;
          int main(){
            { SimpleSharedPtr<Probe> p; assert(!p); assert(p.use_count()==0); }
            assert(Probe::alive==0);
            {
              SimpleSharedPtr<Probe> a(new Probe(7)); assert(a.use_count()==1); assert(a->value==7);
              SimpleSharedPtr<Probe> b(a); assert(a.use_count()==2 && b.use_count()==2 && a.get()==b.get());
              SimpleSharedPtr<Probe> c(std::move(b)); assert(!b && b.use_count()==0); assert(c.use_count()==2);
              a=a; assert(a.use_count()==2); c=c; assert(c.use_count()==2);
              SimpleSharedPtr<Probe> d; d=a; assert(a.use_count()==3 && d.use_count()==3);
              d.reset(new Probe(9)); assert(d.use_count()==1 && d->value==9); assert(a.use_count()==2); assert(Probe::alive==2);
              c.reset(); assert(a.use_count()==1); assert(Probe::alive==2);
              d.reset(); assert(Probe::alive==1);
              std::vector<SimpleSharedPtr<Probe>> copies; for(int i=0;i<1000;i++) copies.push_back(a); assert(a.use_count()==1001); copies.clear(); assert(a.use_count()==1);
            }
            assert(Probe::alive==0); assert(Probe::destroyed==2);
            { SimpleSharedPtr<int> p; bool threw=false; try{(void)*p;}catch(const std::logic_error&){threw=true;} assert(threw); }
            std::cout << "PASS null copy move self-assign reset last-release thousand-copies null-deref destroyed=" << Probe::destroyed << "\n";
          }
          CPP
          (cd /tmp/b44-sp && g++ -std=c++17 -Wall -Wextra -Werror -pedantic test.cpp -o test && ./test | tee stdout.txt)
          grep -q '^PASS null copy move self-assign reset last-release thousand-copies null-deref destroyed=2$' /tmp/b44-sp/stdout.txt

      - name: Write source-first evidence
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_SHA="$(cat /tmp/b44-sp/candidate.sha256)" STDOUT="$(cat /tmp/b44-sp/stdout.txt)" python3 - <<'PY'
          import json,os,pathlib
          cid=os.environ['CANONICAL_ID']; qid=os.environ['SOURCE_QID']; digest=os.environ['CANDIDATE_SHA']; stdout=os.environ['STDOUT']; date='2026-08-28'; out=pathlib.Path(f'review/content_build/answer_batch_0044/{cid}')
          checks=['empty owner has null pointer and count 0','copy shares one control block and increments strong count','move transfers ownership without incrementing count','copy/move self-assignment keeps ownership valid','reset isolates new ownership and releases previous ownership exactly once','1000 copies collapse back to one owner without premature destruction','last release destroys managed object exactly once','null dereference follows declared logic_error contract']
          val={'schema_version':'answer_code_validation.v1','canonical_id':cid,'candidate_sha256':digest,'result':'pass','validated_at':date,'command':'compile exact C++17 candidate with independent lifetime/assertion harness','stdout':stdout,'checks':checks}
          (out/'writer_validation.json').write_text(json.dumps(val,ensure_ascii=False,indent=2)+'\n')
          research={'schema_version':'answer_writer_research.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'review_state':'writer_complete_isolated_review_pending','sources':[{'source_id':'primary-source','title':'C++ backend interview tagged source','locator':'note_tagged/68c36f32000000001d00c805.json','source_type':'repository_structured_source','checked_at':date},{'source_id':'batch-inventory','title':'Frozen Batch 0044 source inventory','locator':'review/content_build/answer_batch_0044/source_inventory.json','source_type':'repository_source_record','checked_at':date},{'source_id':'validation','title':'Exact C++ ownership and lifetime validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date}],'claims':[{'claim_id':'source-boundary','text':'The source asks only for the core logic of a simplified shared_ptr, so weak references, atomic concurrency, custom deleters, aliasing, arrays and make_shared are explicitly out of scope rather than claimed as source requirements.','source_ids':['primary-source','batch-inventory'],'answer_locations':['核心结论','关键细节']},{'claim_id':'ownership-invariant','text':'The exact implementation shares one control block across copies, transfers the token on moves, and destroys the managed object only when strong_count transitions from one to zero.','source_ids':['validation'],'answer_locations':['核心结论','1 分钟版','3 分钟版','原理机制']}],'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],'promotion_blocker':'isolated_independent_review_not_yet_performed'}
          (out/'writer_research.json').write_text(json.dumps(research,ensure_ascii=False,indent=2)+'\n')
          scores={'facts_and_evidence':25,'directness_and_relevance':20,'type_specific_completeness':20,'mechanism_and_causality':15,'boundaries_and_tradeoffs':10,'followup_quality':5,'oral_quality':5}
          findings=['The candidate narrows “simplified shared_ptr” instead of pretending to implement the full standard-library type.','A single shared control block maintains the strong-count invariant across copy, move, assignment, reset and destruction.','Copy-and-swap avoids releasing old ownership before safely acquiring new ownership; move operations transfer the token without increasing the count.','The exact C++17 candidate is compiled with warnings-as-errors and independently exercises null ownership, copy/move/self-assignment, reset, 1000-copy fan-out and last-release destruction.','The concurrency and cyclic-reference limitations are explicit, preventing the teaching implementation from being misrepresented as production std::shared_ptr.']
          review={'schema_version':'isolated_review.v1','canonical_id':cid,'candidate_sha256':digest,'reviewed_at':date,'review_mode':'source_first_isolated','reviewer_id':'source-first-isolated-reviewer-batch-0044-shared-ptr-20260828-v1','review_version':'batch-0044.simplified-shared-ptr.v1','decision':'pass','revision_round':1,'source_packet':['note_tagged/68c36f32000000001d00c805.json','review/content_build/answer_batch_0044/source_inventory.json',f'review/candidates/answers/{cid}.md',str(out/'writer_validation.json'),'docs/refactor/09_answer_content_standard.md'],'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings,'promotion_blockers':['repository_human_approval_and_real_review_policy_not_yet_satisfied']}
          (out/'isolated_review_result.json').write_text(json.dumps(review,ensure_ascii=False,indent=2)+'\n')
          boundary=[{'case':'empty SimpleSharedPtr','expected':'get=null and use_count=0','actual':'passed','passed':True},{'case':'copy then move ownership','expected':'copy count increments, move source empties without count increment','actual':'passed','passed':True},{'case':'reset and last release','expected':'old/new managed objects each destroyed exactly once at final owner release','actual':'passed; destroyed=2','passed':True},{'case':'1000 temporary copies','expected':'count reaches 1001 then returns to 1 with object still alive','actual':'passed','passed':True}]
          evidence={'schema_version':'answer_evidence.v1','canonical_id':cid,'candidate_sha256':digest,'checked_at':date,'writer':{'writer_id':'content-batch-0044-shared-ptr-builder','writer_version':'xhs-answer-curator.v1'},'sources':[{'source_id':'primary-source','title':'C++ backend interview tagged source','locator':'note_tagged/68c36f32000000001d00c805.json','source_type':'repository_structured_source','checked_at':date},{'source_id':'batch-inventory','title':'Frozen Batch 0044 source inventory','locator':'review/content_build/answer_batch_0044/source_inventory.json','source_type':'repository_source_record','checked_at':date},{'source_id':'validation','title':'Exact C++ ownership and lifetime validation','locator':str(out/'writer_validation.json'),'source_type':'executable_test_or_reproducible_experiment','checked_at':date},{'source_id':'isolated-review','title':'Simplified shared_ptr isolated review','locator':str(out/'isolated_review_result.json'),'source_type':'repository_structured_source','checked_at':date}],'claims':[{'claim_id':'source-boundary','text':'The source requests simplified shared_ptr core logic; the answer explicitly separates its teaching subset from omitted full-library features.','source_ids':['primary-source','batch-inventory','isolated-review'],'answer_locations':['核心结论','关键细节']},{'claim_id':'lifetime-mechanism','text':'Executable validation confirms the shared control-block reference-count invariant and one-time last-owner destruction across copy, move, reset and large copy fan-out.','source_ids':['validation','isolated-review'],'answer_locations':['核心结论','1 分钟版','3 分钟版','原理机制','常见追问']}],'source_question_coverage':[{'question_id':qid,'covered':True,'answer_locations':['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问','易错点']}],'validation':{'command':val['command'],'result':'pass','reported_stdout':stdout,'checks':checks,'boundary_tests':boundary},'review_state':'independent_source_first_review_passed','review':{'reviewer_id':review['reviewer_id'],'review_version':review['review_version'],'independent':True,'decision':'pass','revision_round':1,'scores':scores,'hard_failures':[],'unsupported_claims':[],'uncovered_source_variants':[],'findings':findings},'promotion_blocker':'repository_human_approval_and_real_review_policy_not_yet_satisfied'}
          pathlib.Path(f'review/evidence/{cid}.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n')
          task=pathlib.Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0044.md'); text=task.read_text(); line='- [x] `cq_q_b744814b5ab42c16a426c373788f2e7f` completed source-bounded simplified shared_ptr construction and isolated review. The candidate defines a teaching subset instead of claiming complete std::shared_ptr semantics, maintains one shared control-block strong-count invariant across copy/move/reset/destruction, and explicitly excludes weak references, atomic concurrency, custom deleters, aliasing, arrays and make_shared. The exact C++17 code passes warnings-as-errors plus independent null/copy/move/self-assignment/reset/1000-copy/last-release lifetime tests. Strict candidate/code/repository gates pass; human approval and real-review policy remain promotion blockers.'
          if '## Progress' not in text: text=text.rstrip()+'\n\n## Progress\n'
          if line not in text: text=text.rstrip()+'\n'+line+'\n'
          task.write_text(text)
          PY

      - name: Run strict gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noDraftCheck
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm test
          npm run ci:check

      - name: Commit reviewed packet
        shell: bash
        run: |
          set -euo pipefail
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "review/content_build/answer_batch_0044/$CANONICAL_ID" "review/evidence/$CANONICAL_ID.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0044.md
          if git diff --cached --quiet; then exit 0; fi
          git diff --cached --check
          git commit -m 'review: pass batch 0044 simplified shared-ptr candidate'
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$CONTENT_BRANCH"; then exit 0; fi
            git fetch origin "$CONTENT_BRANCH"
            git rebase "origin/$CONTENT_BRANCH"
          done
          exit 1
