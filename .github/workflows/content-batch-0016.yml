name: Content Batch 0016

on:
  push:
    branches:
      - content/quality-completion
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate file Top-K candidate fixture
        working-directory: review/content_build/answer_batch_0016/cq_q_1f1bcfca5e814405d8f577ae7f3bab1e
        run: |
          javac FileTopK.java FileTopKTest.java
          java FileTopKTest

      - name: Audit completed file Top-K candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_1f1bcfca5e814405d8f577ae7f3bab1e.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Validate mirror binary-tree candidate fixture
        working-directory: review/content_build/answer_batch_0016/cq_q_21a9060b741ad865a51b0d12f1a80372
        run: |
          javac MirrorBinaryTree.java MirrorBinaryTreeTest.java
          java MirrorBinaryTreeTest

      - name: Audit completed mirror binary-tree candidate
        run: |
          node scripts/xhs.js answer audit \
            --candidate review/candidates/answers/cq_q_21a9060b741ad865a51b0d12f1a80372.md \
            --require-evidence \
            --require-code \
            --noWrite

      - name: Verify candidate inputs are immutable under validation
        run: |
          git diff --exit-code -- \
            review/candidates/answers/cq_q_1f1bcfca5e814405d8f577ae7f3bab1e.md \
            review/content_build/answer_batch_0016/cq_q_1f1bcfca5e814405d8f577ae7f3bab1e \
            review/evidence/cq_q_1f1bcfca5e814405d8f577ae7f3bab1e.json \
            review/candidates/answers/cq_q_21a9060b741ad865a51b0d12f1a80372.md \
            review/content_build/answer_batch_0016/cq_q_21a9060b741ad865a51b0d12f1a80372 \
            review/evidence/cq_q_21a9060b741ad865a51b0d12f1a80372.json
