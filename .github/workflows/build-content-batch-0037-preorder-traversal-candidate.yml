          CID="$cid" node <<'NODE'
          const fs=require('fs'),cid=process.env.CID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('preorderTraversal(TreeNode root)')) throw new Error('complete Java implementation missing');
          fs.writeFileSync(`review/content_build/answer_batch_0037/${cid}/Solution.java`,blocks[0][1]+'\n');
          NODE

          cat > "$out/PreorderWriterTest.java" <<'JAVA'
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Random;

          public final class PreorderWriterTest {
              private static int randomCases;
              public static void main(String[] args) {
                  Solution s=new Solution();
                  check(s,null,List.of());
                  check(s,node(7),List.of(7));
                  Solution.TreeNode sample=node(1); sample.right=node(2); sample.right.left=node(3);
                  check(s,sample,List.of(1,2,3));
                  Solution.TreeNode full=node(1); full.left=node(2); full.right=node(3); full.left.left=node(4); full.left.right=node(5); full.right.left=node(6); full.right.right=node(7);
                  check(s,full,List.of(1,2,4,5,3,6,7));
                  Random r=new Random(0x8D38CD37L);
                  for(int n=0;n<=120;n++) for(int round=0;round<20;round++) { Solution.TreeNode root=randomTree(n,r); check(s,root,reference(root)); randomCases++; }
                  int depth=50000; Solution.TreeNode skew=node(0),cur=skew; for(int i=1;i<depth;i++){cur.right=node(i);cur=cur.right;}
                  List<Integer> got=s.preorderTraversal(skew); if(got.size()!=depth||got.get(0)!=0||got.get(depth-1)!=depth-1) throw new AssertionError("deep skew mismatch");
                  System.out.printf("PASS fixed=4 randomized_trees=%d deep_skew=%d null=pass order=pass%n",randomCases,depth);
              }
              static Solution.TreeNode node(int v){return new Solution.TreeNode(v);}
              static void check(Solution s,Solution.TreeNode root,List<Integer> expected){List<Integer> actual=s.preorderTraversal(root);if(!actual.equals(expected))throw new AssertionError("actual="+actual+" expected="+expected);}
              static List<Integer> reference(Solution.TreeNode root){List<Integer> out=new ArrayList<>();ref(root,out);return out;}
              static void ref(Solution.TreeNode n,List<Integer> out){if(n==null)return;out.add(n.val);ref(n.left,out);ref(n.right,out);}
              static Solution.TreeNode randomTree(int n,Random r){if(n==0)return null;List<Solution.TreeNode> nodes=new ArrayList<>();for(int i=0;i<n;i++)nodes.add(node(r.nextInt(2001)-1000));List<Solution.TreeNode> open=new ArrayList<>();open.add(nodes.get(0));for(int i=1;i<n;i++){Solution.TreeNode child=nodes.get(i);while(true){Solution.TreeNode p=open.get(r.nextInt(open.size()));if(p.left!=null&&p.right!=null){open.remove(p);continue;}if(p.left==null&&p.right==null){if(r.nextBoolean())p.left=child;else p.right=child;}else if(p.left==null)p.left=child;else p.right=child;if(p.left!=null&&p.right!=null)open.remove(p);open.add(child);break;}}return nodes.get(0);}
          }
          JAVA
          (cd "$out" && javac -Xlint:all -Werror Solution.java PreorderWriterTest.java && java PreorderWriterTest > writer_stdout.txt)
          stdout="$(cat "$out/writer_stdout.txt")"
          test "$stdout" = 'PASS fixed=4 randomized_trees=2420 deep_skew=50000 null=pass order=pass'

          STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cid=process.env.CANONICAL_ID,date='2026-08-26',out=`review/content_build/answer_batch_0037/${cid}`,candidate=`review/candidates/answers/${cid}.md`;
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex'); const ctx=JSON.parse(fs.readFileSync('/tmp/context.json','utf8'));
          fs.writeFileSync(`${out}/writer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:hash,result:'pass',validated_at:date,command:'extract exact candidate Java; javac -Xlint:all -Werror; execute fixed, randomized and 50000-depth skew-tree cases',stdout:process.env.STDOUT,checks:['null tree returns empty list','single/sample/full trees follow root-left-right','2420 seeded randomized trees match recursive reference','50000-node right-skew tree completes iteratively']},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source',title:'Repository tagged binary-tree preorder interview question',locator:process.env.SOURCE_TAGGED,source_type:'repository_structured_source',checked_at:date},{source_id:'primary-reference',title:'LeetCode 144 Binary Tree Preorder Traversal',locator:process.env.PRIMARY_SOURCE,source_type:'official_documentation',checked_at:date},{source_id:'writer-validation',title:'Writer preorder executable validation',locator:`${out}/writer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'preorder-semantics',text:'Binary-tree preorder visits root, then left subtree, then right subtree.',source_ids:['repository-source','primary-reference','writer-validation'],answer_locations:['核心结论','1 分钟版','3 分钟版']},{claim_id:'iterative-ordering',text:'The exact candidate stack implementation pushes right before left so LIFO traversal visits left before right.',source_ids:['writer-validation'],answer_locations:['1 分钟版','3 分钟版','原理机制']},{claim_id:'boundary-and-space',text:'The implementation returns an empty list for null, matches a recursive reference on randomized trees, and handles a 50000-node skew tree without recursive-call depth.',source_ids:['writer-validation'],answer_locations:['关键细节','常见追问','易错点']}],source_question_coverage:(ctx.source_questions||[]).map(x=>({question_id:x.question_id,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制','常见追问']})),promotion_blocker:'isolated_independent_review_not_yet_performed'},null,2)+'\n');
          NODE

      - name: Record bounded progress and commit candidate
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md';let t=fs.readFileSync(task,'utf8');
          const note='- [x] `cq_q_8d38cd370fa94eb8683b012eb6353aab` preorder-traversal candidate preserves the exact binary-tree source boundary, gives a complete iterative root-left-right Java solution, explains right-before-left stack ordering and O(n)/O(h) bounds, and passes fixed plus 2420 seeded randomized trees and a 50000-node skew-tree writer validation. Writer evidence is frozen; isolated source-first review remains pending.';
          if(!t.includes('`cq_q_8d38cd370fa94eb8683b012eb6353aab` preorder-traversal candidate'))t=t.trimEnd()+'\n'+note+'\n';fs.writeFileSync(task,t);
          NODE
          git config user.name xhs-content-builder
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git add "review/candidates/answers/$CANONICAL_ID.md" "review/content_build/answer_batch_0037/$CANONICAL_ID" tasks/answer-batches/TASK-20260711-0313-answer-batch-0037.md
          git commit -m 'content: stage batch 0037 preorder traversal candidate'
          git fetch origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = "${{ steps.base.outputs.head }}" || { echo 'content branch moved during build'; exit 1; }
          git push origin HEAD:"$CONTENT_BRANCH"
