name: Review Content Batch 0035 Three Thread Ordered Print

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0035-three-thread-ordered-print.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0035-three-thread-ordered-print-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_84514fd4ca5bfa916e7260a3b68ea6ed
  SOURCE_QID: 84514fd4ca5bfa916e7260a3b68ea6ed

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first isolated review and concurrency rerun
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          source_file='note_tagged/684acd11000000002001fe99.json'

          javac "$out/ThreeThreadOrderedPrinterValidation.java"
          stdout="$(java -cp "$out" ThreeThreadOrderedPrinterValidation)"
          test "$stdout" = 'PASS fixed=5 stress=200 randomized-start=true exact-order=true owner-partition=true interrupt-cancel=true output-failure-cancel=true timeout-clean=true'

          STDOUT="$stdout" node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-26';
          const out=`review/content_build/answer_batch_0035/${cid}`;
          const candidate=`review/candidates/answers/${cid}.md`;
          const sourceFile='note_tagged/684acd11000000002001fe99.json';
          const note=JSON.parse(fs.readFileSync(sourceFile,'utf8'));
          const src=(note.tagged_questions||[]).find(q=>q.question_id===qid);
          const expected='并发编程设计：三个线程如何协同按规律顺序打印数字（1,4,7.../2,5,8.../3,6,9...）的思路';
          if(!src||src.original_question!==expected) throw new Error(`source wording drifted: ${src?.original_question}`);
          if(src.question_type!=='算法手撕_Coding') throw new Error(`source type drifted: ${src?.question_type}`);

          const md=fs.readFileSync(candidate,'utf8');
          for(const marker of [
            'public final class ThreeThreadOrderedPrinter',
            'private boolean cancelled',
            'while (!cancelled && next <= limit && owner(next) != workerId)',
            'cancelled = true',
            'signalAllTurns()',
            'limit` 是实现/测试契约',
            '输出失败也必须传播取消'
          ]) if(!md.includes(marker)) throw new Error(`candidate marker missing: ${marker}`);
          if((md.match(/- 问：/g)||[]).length<6) throw new Error('question-specific followups missing');
          if(/真实项目里我|线上事故|我们生产|实际线上/.test(md)) throw new Error('fabricated project-experience language detected');

          const writer=JSON.parse(fs.readFileSync(`${out}/writer_research.json`,'utf8'));
          if(writer.review_state!=='writer_complete_isolated_review_pending') throw new Error(`writer state drifted: ${writer.review_state}`);
          if(!writer.source_question_coverage?.some(x=>x.question_id===qid&&x.covered===true)) throw new Error('source coverage missing');
          if(!writer.claims?.some(x=>x.claim_id==='cancellation-behavior')) throw new Error('cancellation evidence claim missing');

          const validation=JSON.parse(fs.readFileSync(`${out}/code_validation.json`,'utf8'));
          if(validation.result!=='pass'||validation.stdout!==process.env.STDOUT) throw new Error('validation result drifted');
          const hash=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const boundaryTests=validation.boundary_tests||[];
          const reviewer='source-first-isolated-reviewer-three-thread-ordered-print-20260826-v1';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository source recoverably asks only for the coordination design for three threads owning the 1,4,7... / 2,5,8... / 3,6,9... pattern; it does not preserve a finite limit, language, synchronization API, interruption contract, or callback-failure policy.',
            'The candidate explicitly labels the finite limit and cancellation behavior as implementation/test contracts rather than source facts.',
            'The lock-protected next state and modulo-3 owner predicate preserve one global sequence while assigning every value to the correct worker.',
            'Fresh executable validation covers fixed limits and 200 deterministic randomized-start stress runs with bounded joins and exact sequence/ownership assertions.',
            'The remediated shared cancelled state closes the missing-owner deadlock that otherwise occurs when a waiting worker is interrupted or the output callback throws.',
            'The answer explains while-based Condition predicates, termination wakeups, failure semantics, alternatives, and tradeoffs without fabricating project experience.',
            'No unsupported claim that Condition or the finite limit was mandated by the source remains.'
          ];
          const reviewPath=`${out}/isolated_review_result.json`;
          fs.writeFileSync(reviewPath,JSON.stringify({
            schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:hash,reviewed_at:date,
            review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'three-thread-ordered-print.v1',
            decision:'pass',revision_round:2,
            source_packet:[sourceFile,candidate,`${out}/writer_research.json`,`${out}/code_validation.json`,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],
            scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,
            promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']
          },null,2)+'\n');

          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:hash,checked_at:date,
            writer:{writer_id:'three-thread-ordered-print-source-bounded-writer-20260826-v2',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'repository-source',title:'Backend interview note exact three-thread ordered-print prompt',locator:`${sourceFile}#question_id=${qid}`,source_type:'repository_source_record',checked_at:date},
              {source_id:'validation',title:'Fresh three-thread ordering and cancellation validation',locator:`${out}/code_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Fresh source-first isolated review after cancellation remediation',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-boundary',text:'The source asks for the coordination idea for the three modulo-3 thread sequences; finite limit, Java/Condition details and cancellation policy are not preserved source constraints.',source_ids:['repository-source'],answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节']},
              {claim_id:'ordered-owner-behavior',text:'Under the explicit finite-limit contract, fixed and 200 randomized-start stress executions emit exactly 1..limit and assign every value to its modulo-3 worker.',source_ids:['validation'],answer_locations:['1 分钟版','3 分钟版','原理机制','常见追问']},
              {claim_id:'cancellation-behavior',text:'Shared cancellation plus wake-all prevents missing-owner deadlock when a waiting worker is interrupted or the output callback fails, and bounded joins verify clean termination.',source_ids:['validation','isolated-review'],answer_locations:['核心结论','关键细节','原理机制','常见追问','易错点']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:validation.command,result:'pass',reported_stdout:process.env.STDOUT,checks:validation.checks,boundary_tests:boundaryTests},
            review_state:'independent_source_first_review_passed',
            review:{reviewer_id:reviewer,review_version:'three-thread-ordered-print.v1',independent:true,decision:'pass',revision_round:2,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');

          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md';
          let text=fs.readFileSync(task,'utf8');
          const pending='- [x] `cq_q_84514fd4ca5bfa916e7260a3b68ea6ed` three-thread ordered-print source is recoverable as a coordination-design Coding question. The candidate now uses shared cancellation to close the interrupted-worker/output-failure deadlock hole, and fresh validation passes fixed limits plus 200 randomized-start stress runs, modulo-3 ownership checks, interrupt cancellation, output-failure cancellation, and bounded joins. Writer research is frozen; isolated independent source-first review remains pending before promotion.';
          const passed='- [x] `cq_q_84514fd4ca5bfa916e7260a3b68ea6ed` three-thread ordered-print candidate preserves the recoverable source boundary, explicitly labels finite-limit/cancellation semantics as implementation contracts, closes interrupted-worker/output-failure missing-owner deadlock, passes fixed plus 200 randomized-start concurrency validation, and passes isolated source-first review with complete evidence binding. Formal promotion remains governed by repository human approval and real-review policy.';
          if(!text.includes(pending)) throw new Error('writer-progress marker missing or stale');
          fs.writeFileSync(task,text.replace(pending,passed));
          NODE

      - name: Strict candidate audit and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit passing review from stable content head
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0035/$CANONICAL_ID"
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          test "$(git rev-parse origin/$CONTENT_BRANCH)" = '${{ steps.base.outputs.head }}' || { echo 'Content branch advanced during review; fail closed.'; exit 1; }
          git add "review/evidence/$CANONICAL_ID.json" "$out/code_validation.json" "$out/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0035.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0035 three-thread ordered-print source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
