name: Prepare GC Algorithms Batch 0010

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .github/workflows/prepare-gc-algorithms-batch-0010.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: content/quality-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare current source-first candidate and isolated review packet
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const { execFileSync } = require('child_process');

          const id = 'cq_gc_algorithms_3f884748';
          const buildDir = `review/content_build/answer_batch_0010/${id}`;
          const candidatePath = `review/candidates/answers/${id}.md`;
          const taskPath = 'tasks/answer-batches/TASK-20260711-0313-answer-batch-0010.md';
          fs.mkdirSync(buildDir, {recursive:true});

          const contextRaw = execFileSync('node', ['scripts/xhs.js', 'answer', 'context', '--canonical-id', id, '--noWrite'], {encoding:'utf8'});
          const context = JSON.parse(contextRaw);
          if (context.answer_type !== 'concept') throw new Error(`expected concept context, got ${context.answer_type}`);
          fs.writeFileSync(path.join(buildDir, 'context.json'), `${JSON.stringify(context, null, 2)}\n`, 'utf8');

          const candidate = Buffer.from(' c2NhdmVuZ2luZ+OAgeWvueixoeW5tOm+k+etieS/oeaBr++8jOaKiuW3peS9nOS8mOWFi+mZuOS4reWcqOabtOWPkeiDveS6p+eUn+Wkp+mhneaUtuWblOWGheWtmOeahOWMq+Wfn+OAggpjb3B5LZXQpPC9wPg==', 'base64').toString('utf8');
          fs.writeFileSync(candidatePath, candidate, 'utf8');
          const candidateSha = crypto.createHash('sha256').update(candidate, 'utf8').digest('hex');
          fs.writeFileSync(path.join(buildDir, 'candidate_sha256.txt'), `${candidateSha}\n`, 'utf8');

          const packet = {"schema_version":"isolated_answer_review_packet.v1","canonical_id":"cq_gc_algorithms_3f884748","prepared_at":"2026-08-19","review_contract":{"mode":"source_first_isolated","required_quality_contract":"config/answer_quality.json","required_content_standard":"docs/refactor/09_answer_content_standard.md","allowed_repository_inputs":["review/content_build/answer_batch_0010/cq_gc_algorithms_3f884748/context.json","review/candidates/answers/cq_gc_algorithms_3f884748.md","config/answer_quality.json","docs/refactor/09_answer_content_standard.md",".agents/skills/xhs-answer-curator/SKILL.md"],"forbidden_before_conclusion":["review/evidence/cq_gc_algorithms_3f884748.json","review/candidates/audits/cq_gc_algorithms_3f884748.json","review/reports/FINAL_SOURCE_FIRST_REVIEW.json","review/reports/FINAL_SOURCE_FIRST_REVIEW.md","historical review/remediation records","writer rationale or self-score"],"required_checks":["Independently verify the response contract from current source questions and reject the candidate if concept is not the correct type.","Verify the basic mark/sweep, copying-or-evacuation, and compaction distinctions without projecting textbook layouts onto every current HotSpot collector.","Verify the JDK 25 collector/version boundaries for Serial, Parallel, G1, ZGC and the server-class default-selection statement.","Verify the candidate's G1 region/evacuation description and its boundary that G1 combines multiple mechanisms rather than mapping to one textbook algorithm.","Check that Eden/Survivor wording is explicitly collector-scoped, tuning advice is evidence-driven, and no fabricated project experience is implied.","Check all source-question variants, oral-answer quality, followups, version specificity, and unsupported absolute claims."],"promotion_boundary":"Do not promote or fabricate human approval. Pilot human review remains a separate mandatory gate when required by config."},"primary_sources_to_verify_independently":[{"source_id":"oracle-jdk25-gc-introduction","title":"Java SE 25 HotSpot VM Garbage Collection Tuning Guide: Introduction","locator":"https://docs.oracle.com/en/java/javase/25/gctuning/introduction-garbage-collection-tuning.html","source_type":"official_documentation","claims_to_check":["HotSpot uses generational scavenging with aging, parallel/concurrent work, and compaction of live objects as techniques","collector choice depends on performance goals and workload rather than a single universal algorithm ranking"]},{"source_id":"oracle-jdk25-available-collectors","title":"Java SE 25 HotSpot VM Garbage Collection Tuning Guide: Available Collectors","locator":"https://docs.oracle.com/en/java/javase/25/gctuning/available-collectors.html","source_type":"official_documentation","claims_to_check":["current HotSpot choices include Serial, Parallel, G1, and ZGC","Parallel emphasizes throughput, G1 is mostly concurrent and pause-goal oriented, and ZGC targets low latency","collector-selection recommendations are starting points and remain workload dependent"]},{"source_id":"oracle-jdk25-gc-factors","title":"Java SE 25 HotSpot VM Garbage Collection Tuning Guide: Factors Affecting GC Performance","locator":"https://docs.oracle.com/en/java/javase/25/gctuning/factors-affecting-garbage-collection-performance.html","source_type":"official_documentation","claims_to_check":["young-generation sizing affects collection frequency and old-generation headroom","the Eden/two-Survivor discussion is documented with a serial-collector example and should not be universalized to every collector"]},{"source_id":"oracle-jdk25-g1","title":"Java SE 25 HotSpot VM Garbage Collection Tuning Guide: G1","locator":"https://docs.oracle.com/en/java/javase/25/gctuning/garbage-first-g1-garbage-collector1.html","source_type":"official_documentation","claims_to_check":["G1 uses region-based young/old roles and evacuation of live objects from selected collection sets","G1 combines stop-the-world evacuation with concurrent/global marking work and should not be reduced to one textbook algorithm"]},{"source_id":"oracle-jdk25-ergonomics","title":"Java SE 25 HotSpot VM Garbage Collection Tuning Guide: Ergonomics","locator":"https://docs.oracle.com/en/java/javase/25/gctuning/ergonomics.html","source_type":"official_documentation","claims_to_check":["G1 is the default on server-class machines while Serial is used otherwise under the documented default-selection boundary","pause-time and throughput goals are behavior-based tuning dimensions"]}],"expected_output":{"evidence_path":"review/evidence/cq_gc_algorithms_3f884748.json","audit_path":"review/candidates/audits/cq_gc_algorithms_3f884748.json","audit_command":"node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_gc_algorithms_3f884748.md --require-evidence --noWrite","reviewer_must_not_equal_writer":true},"writer_checkpoint":{"writer_id":"answer-curator","source_refresh":"Oracle Java SE 25 primary documentation only","candidate_changed":true,"fresh_isolated_review_required":true,"human_approval_fabricated":false,"promotion_recorded":false}};
          packet.candidate = {
            path: candidatePath,
            sha256: candidateSha,
            answer_type: 'concept',
            version: 2
          };
          packet.context = {
            path: path.join(buildDir, 'context.json'),
            canonical_title: context.canonical_question && (context.canonical_question.title || context.canonical_question.question || context.canonical_question.text) || null
          };
          fs.writeFileSync(path.join(buildDir, 'isolated_review_packet.json'), `${JSON.stringify(packet, null, 2)}\n`, 'utf8');

          let task = fs.readFileSync(taskPath, 'utf8');
          task = task.replace('- Status: `pending`', '- Status: `in_progress`');
          const marker = '### GC algorithms writer/source refresh checkpoint (2026-08-19)';
          if (!task.includes(marker)) {
            const block = [
              marker,
              '',
              `- \`${id}\`: refreshed the candidate against current Oracle Java SE 25 primary GC documentation and tightened the collector/version boundaries: textbook mark/sweep-copy/compaction concepts are separated from Serial/Parallel/G1/ZGC implementations, G1 evacuation is region-scoped, and Serial-style Eden/Survivor layout is no longer generalized to every collector.`,
              `- Fixed candidate SHA-256: \`${candidateSha}\`. Fresh isolated source-first review, evidence binding, deterministic \`--require-evidence\` audit, mandatory pilot human approval and atomic promotion remain pending; no reviewer/human/promotion state was fabricated.`,
              '',
            ].join('\n');
            const completion = '\n## Completion\n';
            if (!task.includes(completion)) throw new Error('Completion anchor missing');
            task = task.replace(completion, `\n${block}${completion}`);
          }
          fs.writeFileSync(taskPath, task, 'utf8');
          console.log(JSON.stringify({id, candidateSha, answer_type: context.answer_type}, null, 2));
          NODE
          git diff --check

      - name: Run repository regression checks that do not require fabricated review evidence
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run ci:check
          git diff --check

      - name: Commit prepared candidate and retire one-off workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "xhs-completion-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"
          git rm .github/workflows/prepare-gc-algorithms-batch-0010.yml
          git add \
            review/candidates/answers/cq_gc_algorithms_3f884748.md \
            review/content_build/answer_batch_0010/cq_gc_algorithms_3f884748/context.json \
            review/content_build/answer_batch_0010/cq_gc_algorithms_3f884748/candidate_sha256.txt \
            review/content_build/answer_batch_0010/cq_gc_algorithms_3f884748/isolated_review_packet.json \
            tasks/answer-batches/TASK-20260711-0313-answer-batch-0010.md
          git diff --cached --check
          git commit -m "content: prepare GC algorithms batch 0010 candidate"
          git push origin HEAD:content/quality-completion
