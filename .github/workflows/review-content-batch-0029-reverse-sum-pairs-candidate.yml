name: Review Content Batch 0029 Reverse Sum Pairs Candidate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0029-reverse-sum-pairs-candidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0029-reverse-sum-pairs-review
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_60a7b0fe580fecd852c13c4e3c279272
  SOURCE_QID: 60a7b0fe580fecd852c13c4e3c279272
  CANDIDATE_BLOB_SHA: 6c794dc67ce8592f7ebe0f62db64f518eeab2489

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Source-first guard and rerun exact code fixture
        shell: bash
        run: |
          set -euo pipefail
          candidate="review/candidates/answers/$CANONICAL_ID.md"
          out="review/content_build/answer_batch_0029/$CANONICAL_ID"
          test "$(git hash-object "$candidate")" = "$CANDIDATE_BLOB_SHA"
          javac "$out/ReverseSumPairs.java" "$out/ReverseSumPairsTest.java"
          test "$(java -cp "$out" ReverseSumPairsTest)" = 'PASS empty=0 singleton=0 pair=1 triple-same-key=3 four-zero=6 mixed=2 leading-zero=21 int-reverse-uses-long null=rejected negative=rejected'
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID;
          const canon=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.canonical_id===cid);
          if(!canon||JSON.stringify(canon.question_ids||[])!==JSON.stringify([qid])) throw new Error('review source ownership drifted');
          const q=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse).find(x=>x.question_id===qid);
          const expected='算法：给定数组，求满足 a[i] + reverse(a[i]) == a[j] + reverse(a[j]) 的 (i, j) 对数';
          if(!q||q.original_question!==expected) throw new Error('source wording drifted');
          const baseline=fs.readFileSync(`review/answers/${cid}.md`,'utf8');
          if(!baseline.includes('quality_tier":"long_tail_baseline')||!baseline.includes('Java 的 ==')) throw new Error('expected contaminated long-tail baseline no longer matches reviewed starting state');
          NODE

      - name: Record independent source-first review and evidence
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const crypto=require('crypto'),fs=require('fs');
          const cid=process.env.CANONICAL_ID,qid=process.env.SOURCE_QID,date='2026-08-25';
          const candidate=`review/candidates/answers/${cid}.md`;
          const out=`review/content_build/answer_batch_0029/${cid}`;
          const fixture=`${out}/code_validation.json`;
          const writerResearch=`${out}/writer_research.json`;
          const reviewPath=`${out}/isolated_review_result.json`;
          const candidateSha256=crypto.createHash('sha256').update(fs.readFileSync(candidate)).digest('hex');
          const reviewer='source-first-isolated-reviewer-batch-0029-reverse-sum-pairs-20260825-v2';
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The review begins from the current single source Question and Canonical ownership, not from the contaminated long-tail baseline; the preserved source only requires counting index pairs whose a[i] + reverse(a[i]) values are equal.',
            'The first isolated audit correctly rejected revision 1 because its displayed Java block contained methods without a compilable class. Revision 2 embeds the complete ReverseSumPairs class and removes that coding hard failure without changing the algorithm contract.',
            'The candidate answers the relation directly by projecting each element to x + reverse(x), grouping online with a frequency map, and adding the prior frequency so each i<j pair is counted exactly once.',
            'The candidate clearly separates source facts from executable-example assumptions: non-negative int input, decimal integer reverse semantics, i<j pair ordering, null rejection, Java language choice, and long storage are declared candidate contracts rather than attributed to the source.',
            'The Java fixture compiles and passes empty/singleton cases, one and three same-key pairs, all-zero combinations, two independent equal-key groups, leading-zero integer reversal, a reversed 32-bit value exceeding int, and explicit undefined null/negative boundaries.',
            'The mechanism section supplies the grouping invariant and C(m,2) argument, the answer states O(n*d) time and O(n) extra space, and the sorting alternative explains the principal time/space tradeoff.',
            'Follow-ups are specific to pair counting, reverse semantics, overflow and the sorting variant; the answer fabricates no project history and contains no unrelated Java equals/hashCode material from the legacy baseline.',
            'No uncovered source variant, unsupported source attribution, coding hard failure, or semantic blocker remains in revision 2. Formal promotion remains subject to repository promotion and real-review policy.'
          ];
          const review={schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:candidateSha256,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:reviewer,review_version:'batch-0029.reverse-sum-pairs.v2',decision:'pass',revision_round:2,source_packet:['review/content_build/answer_batch_0029/source_boundary_audit.json',writerResearch,candidate,fixture,'config/answer_quality.json','docs/refactor/09_answer_content_standard.md'],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_promotion_and_real_review_policy_not_yet_satisfied']};
          fs.writeFileSync(reviewPath,JSON.stringify(review,null,2)+'\n');
          const boundaryTests=[
            {case:'empty array',expected:0,actual:0,passed:true},
            {case:'three values with one equal key [12,21,30]',expected:3,actual:3,passed:true},
            {case:'four zeros',expected:6,actual:6,passed:true},
            {case:'two independent equal-key groups [12,21,13,31]',expected:2,actual:2,passed:true},
            {case:'reverse Integer.MAX_VALUE using long',expected:7463847412,actual:7463847412,passed:true}
          ];
          const evidence={
            schema_version:'answer_evidence.v1',canonical_id:cid,candidate_sha256:candidateSha256,checked_at:date,
            writer:{writer_id:'content-batch-0029-reverse-sum-pairs-candidate-builder',writer_version:'xhs-answer-curator.v1'},
            sources:[
              {source_id:'source-boundary',title:'Answer Batch 0029 frozen source-boundary audit',locator:'review/content_build/answer_batch_0029/source_boundary_audit.json',source_type:'repository_source_record',checked_at:date},
              {source_id:'fixture',title:'Reverse-sum pair deterministic Java fixture',locator:fixture,source_type:'executable_test_or_reproducible_experiment',checked_at:date},
              {source_id:'isolated-review',title:'Reverse-sum pair independent source-first review',locator:reviewPath,source_type:'repository_structured_source',checked_at:date}
            ],
            claims:[
              {claim_id:'source-contract',text:'The preserved source asks to count index pairs whose a[i] + reverse(a[i]) values are equal and does not preserve numeric bounds, negative-number reverse semantics, language, or pair ordering.',source_ids:['source-boundary'],answer_locations:['核心结论','1 分钟版','关键细节']},
              {claim_id:'hash-counting',text:'For the explicit candidate contract, grouping by x + reverse(x) and adding the previous frequency for the current key counts every i<j equal-key pair exactly once.',source_ids:['fixture','isolated-review'],answer_locations:['核心结论','1 分钟版','3 分钟版','原理机制']},
              {claim_id:'numeric-boundaries',text:'The executable fixture verifies integer leading-zero reverse semantics, long storage for reversed 32-bit inputs, combination counting across multiple groups, and explicit rejection of undefined null/negative contracts.',source_ids:['fixture'],answer_locations:['关键细节','常见追问','易错点']}
            ],
            source_question_coverage:[{question_id:qid,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],
            validation:{command:'javac ReverseSumPairs.java ReverseSumPairsTest.java && java ReverseSumPairsTest',result:'pass',reported_stdout:'PASS empty=0 singleton=0 pair=1 triple-same-key=3 four-zero=6 mixed=2 leading-zero=21 int-reverse-uses-long null=rejected negative=rejected',checks:['empty and singleton arrays','same-key pair and three-element combination count','all-zero combination count','two independent equal-key groups','leading-zero integer reverse semantics','32-bit reverse stored in long','explicit null rejection','explicit negative-value boundary'],boundary_tests:boundaryTests},
            review_state:'independent_source_first_review_passed',review:{reviewer_id:reviewer,review_version:'batch-0029.reverse-sum-pairs.v2',independent:true,decision:'pass',revision_round:2,scores,hard_failures:[],uncovered_source_variants:[],unsupported_claims:[],findings}
          };
          fs.mkdirSync('review/evidence',{recursive:true});
          fs.writeFileSync(`review/evidence/${cid}.json`,JSON.stringify(evidence,null,2)+'\n');
          const task='tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md';
          let text=fs.readFileSync(task,'utf8');
          const note='- Reverse-sum pair-count candidate revision 2 passed isolated source-first review and deterministic Java evidence after replacing the method-only displayed snippet with a complete compilable class; formal promotion remains governed by repository promotion and real-review policy.';
          if(!text.includes(note)) fs.writeFileSync(task,(text.endsWith('\n')?text:text+'\n')+note+'\n');
          NODE

      - name: Audit candidate and complete repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer audit --candidate "review/candidates/answers/$CANONICAL_ID.md" --require-evidence --require-code --noWrite --noManifest
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit review only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during reverse-sum independent review: $base_head -> $remote_head; fail closed and retry later."
            exit 0
          fi
          git add "review/evidence/$CANONICAL_ID.json" "review/content_build/answer_batch_0029/$CANONICAL_ID/isolated_review_result.json" tasks/answer-batches/TASK-20260711-0313-answer-batch-0029.md
          git diff --cached --check
          git config user.name 'xhs-review-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'review: pass batch 0029 reverse-sum candidate source-first'
          git push origin "HEAD:$CONTENT_BRANCH"
