  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0034-min-subarray-partition-writer
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_7cf94a421237d5445dc8e6a277be9489
  SOURCE_QID: 7cf94a421237d5445dc8e6a277be9489
  SOURCE_NOTE: note_tagged/685696fe0000000012033bb6.json

jobs:
