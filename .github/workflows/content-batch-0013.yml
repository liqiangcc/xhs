name: Content Batch 0013

on:
  push:
    branches:
      - content/quality-completion
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  candidate-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Audit binary-tree diameter candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_055a106e79b4b8651c11ddb5633f467d.md --require-evidence --require-code --noWrite

      - name: Run binary-tree diameter fixture
        working-directory: review/content_build/answer_batch_0013/cq_q_055a106e79b4b8651c11ddb5633f467d
        run: javac BinaryTreeDiameter.java BinaryTreeDiameterTest.java && java BinaryTreeDiameterTest

      - name: Audit parallel independent-task candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_05d294848031e3626b66c720bb2273f1.md --require-evidence --require-code --noWrite

      - name: Run parallel independent-task fixture
        working-directory: review/content_build/answer_batch_0013/cq_q_05d294848031e3626b66c720bb2273f1
        run: javac ParallelIndependentTasks.java ParallelIndependentTasksTest.java && java ParallelIndependentTasksTest

      - name: Audit Promise.all candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_0758303ae6a5334a56c9c6239f2787ab.md --require-evidence --require-code --noWrite

      - name: Run Promise.all fixture
        working-directory: review/content_build/answer_batch_0013/cq_q_0758303ae6a5334a56c9c6239f2787ab
        run: node promise_all_test.js

      - name: Audit linked-list common-node candidate
        run: node scripts/xhs.js answer audit --candidate review/candidates/answers/cq_q_08084c56954c213d036776b7cddffdf7.md --require-evidence --require-code --noWrite

      - name: Run linked-list common-node fixture
        working-directory: review/content_build/answer_batch_0013/cq_q_08084c56954c213d036776b7cddffdf7
        run: javac LinkedListFirstCommonNode.java LinkedListFirstCommonNodeTest.java && java LinkedListFirstCommonNodeTest

      - name: Verify no generated changes
        run: git diff --exit-code
