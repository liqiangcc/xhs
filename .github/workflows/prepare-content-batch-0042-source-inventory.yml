name: Prepare Content Batch 0042 Source Inventory

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/prepare-content-batch-0042-source-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0042-source-inventory
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Extract live contexts and classify stale scheduled entries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/batch0042-context
          node <<'NODE'
          const fs=require('fs');
          const {spawnSync}=require('child_process');
          const ids=[
            'cq_q_aaec8b46cd3d79fe404075828be32744',
            'cq_q_ab9374b0bb7cceded9319a8201cc2b24',
            'cq_q_ac84e5db17665ebccb2f19fb39727e90',
            'cq_q_acd59133be76bf111656b5fb1c49c624',
            'cq_q_ad3a48d5db87388f867a2f597860d103',
            'cq_q_adba6c6166d2030d07b88f2e58455f26',
            'cq_q_ae26e919521a374b27e6632b2969aa13',
            'cq_q_aee86527c929ecb06715c2c4d2fd738f',
            'cq_q_af04033d46af9a331ad55c6bbf12d9b6',
            'cq_q_af091a4667cf97a15834eaa7bada1877',
          ];
          const canonicals=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const questions=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const canonicalSet=new Set(canonicals.map(x=>x.canonical_id));
          const schedule=[];
          for(const cid of ids){
            if(canonicalSet.has(cid)){
              const r=spawnSync(process.execPath,['scripts/xhs.js','answer','context','--canonical-id',cid,'--noWrite'],{encoding:'utf8'});
              if(r.status!==0) throw new Error(`${cid}: context failed: ${r.stderr||r.stdout}`);
              fs.writeFileSync(`/tmp/batch0042-context/${cid}.json`,r.stdout);
              schedule.push({canonical_id:cid,state:'active'});
            } else {
              const qid=cid.replace(/^cq_q_/,'');
              const q=questions.find(x=>x.question_id===qid)||null;
              if(q?.is_valid_for_library===true && q?.canonical_id===cid) throw new Error(`${cid}: missing Canonical while active Question still points to it`);
              schedule.push({canonical_id:cid,state:'stale_task_entry_absent_from_canonical_ssot',source_question:q?{question_id:q.question_id,original_question:q.original_question,is_valid_for_library:q.is_valid_for_library,canonical_id:q.canonical_id,invalid_reason:q.invalid_reason||q.exclusion_reason||null}:null});
            }
          }
          fs.writeFileSync('/tmp/batch0042-schedule.json',JSON.stringify(schedule,null,2)+'\n');
          console.log(`PASS active=${schedule.filter(x=>x.state==='active').length} stale=${schedule.filter(x=>x.state!=='active').length}`);
          NODE

      - name: Freeze bounded source inventory
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p review/content_build/answer_batch_0042
          node <<'NODE'
          const fs=require('fs');
          const schedule=JSON.parse(fs.readFileSync('/tmp/batch0042-schedule.json','utf8'));
          const allowedTypes=new Set(['coding','concept','mechanism','scenario','project','behavior']);
          const items=[];
          for(const scheduled of schedule){
            if(scheduled.state!=='active') { items.push(scheduled); continue; }
            const cid=scheduled.canonical_id;
            const ctx=JSON.parse(fs.readFileSync(`/tmp/batch0042-context/${cid}.json`,'utf8'));
            if(!ctx.ok||ctx.canonical?.canonical_id!==cid) throw new Error(`${cid}: invalid context`);
            if(!allowedTypes.has(ctx.answer_type)) throw new Error(`${cid}: unsupported answer type ${ctx.answer_type}`);
            const sourceQuestions=Array.isArray(ctx.source_questions)?ctx.source_questions:[];
            if(sourceQuestions.length===0) throw new Error(`${cid}: no source questions in context`);
            const owned=Array.isArray(ctx.canonical?.question_ids)?ctx.canonical.question_ids:[];
            const sourceIds=sourceQuestions.map(q=>q.question_id).filter(Boolean);
            if(JSON.stringify([...owned].sort())!==JSON.stringify([...sourceIds].sort())) throw new Error(`${cid}: ownership/source mismatch`);
            items.push({canonical_id:cid,state:'active',answer_type:ctx.answer_type,canonical_title:ctx.canonical?.canonical_title??null,question_ids:owned,source_questions:sourceQuestions,active_answer_metadata:ctx.answer?.metadata??ctx.answer_metadata??null});
          }
          const active=items.filter(x=>x.state==='active');
          const stale=items.filter(x=>x.state!=='active');
          const out={schema_version:'answer_batch_source_inventory.v1',batch:'0042',frozen_at:'2026-08-27',scheduled_count:items.length,active_canonical_count:active.length,stale_scheduled_count:stale.length,source_first:true,note:'Live-state-aware inventory. Stale scheduled IDs are not resurrected: they remain explicit historical queue entries when the current Canonical SSOT no longer contains them. Active entries freeze exact Question ownership and answer type before drafting.',items};
          fs.writeFileSync('review/content_build/answer_batch_0042/source_inventory.json',JSON.stringify(out,null,2)+'\n');
          console.log(`PASS frozen scheduled=${items.length} active=${active.length} stale=${stale.length} types=${[...new Set(active.map(x=>x.answer_type))].sort().join(',')}`);
          NODE

      - name: Validate inventory against live projections
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const inv=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0042/source_inventory.json','utf8'));
          if(inv.scheduled_count!==10||inv.items.length!==10) throw new Error('expected exactly 10 scheduled batch0042 entries');
          if(inv.active_canonical_count<1) throw new Error('no live batch0042 entries remain');
          const canonicalRows=fs.readFileSync('data/questions/canonical_questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          const questionRows=fs.readFileSync('data/questions/questions.jsonl','utf8').split(/\r?\n/).filter(Boolean).map(JSON.parse);
          for(const item of inv.items){
            const canonical=canonicalRows.find(x=>x.canonical_id===item.canonical_id);
            if(item.state==='active'){
              if(!canonical) throw new Error(`${item.canonical_id}: live Canonical missing`);
              if(JSON.stringify([...(canonical.question_ids||[])].sort())!==JSON.stringify([...item.question_ids].sort())) throw new Error(`${item.canonical_id}: frozen ownership drifted`);
              for(const sq of item.source_questions){
                const row=questionRows.find(x=>x.question_id===sq.question_id);
                if(!row||row.canonical_id!==item.canonical_id||row.is_valid_for_library!==true||row.original_question!==sq.original_question) throw new Error(`${sq.question_id}: source projection drifted`);
              }
            } else {
              if(canonical) throw new Error(`${item.canonical_id}: stale entry unexpectedly exists again`);
              const q=item.source_question;
              if(q?.is_valid_for_library===true && q?.canonical_id===item.canonical_id) throw new Error(`${item.canonical_id}: stale entry would leave dangling active ownership`);
            }
          }
          console.log(`PASS batch0042 live projection active=${inv.active_canonical_count} stale=${inv.stale_scheduled_count}`);
          NODE
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite

      - name: Start bounded task and record completed batch 0041 reviews
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          inv=json.loads(Path('review/content_build/answer_batch_0042/source_inventory.json').read_text(encoding='utf-8'))
          p=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0042.md')
          t=p.read_text(encoding='utf-8')
          t=t.replace('- Status: `pending`','- Status: `in_progress`',1)
          t=t.replace('- Canonical count: `10`',f"- Scheduled canonical count: `10`; live active count after prior remediation: `{inv['active_canonical_count']}`",1)
          line=f"- [x] Live-state-aware source-first inventory frozen in `review/content_build/answer_batch_0042/source_inventory.json`: {inv['active_canonical_count']} scheduled Canonicals remain active and {inv['stale_scheduled_count']} stale scheduled entries are preserved as explicit non-resurrected history. Active entries freeze exact source Questions and current answer types before drafting."
          if '## Progress' not in t: t=t.rstrip()+'\n\n## Progress\n'
          if line not in t: t=t.rstrip()+'\n'+line+'\n'
          p.write_text(t,encoding='utf-8')

          p41=Path('tasks/answer-batches/TASK-20260711-0313-answer-batch-0041.md')
          q=p41.read_text(encoding='utf-8')
          q=q.replace('- [x] `cq_q_a791750e006147b75dcb2c13b7fa90e9` candidate drafted source-first:','- [x] `cq_q_a791750e006147b75dcb2c13b7fa90e9` passed isolated source-first review:',1)
          q=q.replace(' Isolated independent review is still pending.',' Strict candidate evidence is bound; repository human approval and S11 real-review policy still block curated promotion.',1)
          q=q.replace('- [x] `cq_q_aa5412e581a46db5a2dbf3f5bc6262eb` candidate drafted source-first:','- [x] `cq_q_aa5412e581a46db5a2dbf3f5bc6262eb` passed isolated source-first review:',1)
          q=q.replace(' Isolated independent review is still pending.',' Strict candidate evidence is bound; repository human approval and S11 real-review policy still block curated promotion.',1)
          p41.write_text(q,encoding='utf-8')
          PY

      - name: Commit only if content branch stayed stable
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse "origin/$CONTENT_BRANCH")"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during inventory: $base_head -> $remote_head"
            echo 'Discard verified local inventory; later run may retry against current live state.'
            exit 0
          fi
          git add review/content_build/answer_batch_0042/source_inventory.json tasks/answer-batches/TASK-20260711-0313-answer-batch-0042.md tasks/answer-batches/TASK-20260711-0313-answer-batch-0041.md
          if git diff --cached --quiet; then echo 'No batch0042 inventory changes.'; exit 0; fi
          git diff --cached --check
          git config user.name xhs-source-audit-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git commit -m 'review: freeze batch 0042 live source inventory'
          git push origin "HEAD:$CONTENT_BRANCH"
