name: Repair Batch 0034 Min Subarray Writer Gate

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/fix-batch-0034-min-subarray-writer-gate.yml

permissions:
  contents: write

concurrency:
  group: repair-batch-0034-min-subarray-writer-gate
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 1

      - name: Replace inappropriate repository-wide writer gate
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/build-content-batch-0034-min-subarray-partition-candidate.yml')
          text = p.read_text()
          old = '''      - name: Verify focused repository gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          npm test
'''
          new = '''      - name: Verify exact code fence against validated fixture
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID;
          const md=fs.readFileSync(`review/candidates/answers/${cid}.md`,'utf8');
          const match=md.match(/```java\\n([\\s\\S]*?)\\n```/);
          if(!match) throw new Error('Java fence missing');
          const fixture=fs.readFileSync(`review/content_build/answer_batch_0034/${cid}/MinSubarrayPartition.java`,'utf8').trim();
          if(match[1].trim()!==fixture) throw new Error('candidate code fence differs from validated fixture');
          NODE
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old gate, found {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY

      - name: Commit repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fix-batch-0034-min-subarray-writer-gate.yml
          git diff --check
          git config user.name xhs-ci-repair-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add .github/workflows/build-content-batch-0034-min-subarray-partition-candidate.yml .github/workflows/fix-batch-0034-min-subarray-writer-gate.yml
          git commit -m 'ci: align batch 0034 min-subarray writer with bounded validation'
          git push origin HEAD:master
