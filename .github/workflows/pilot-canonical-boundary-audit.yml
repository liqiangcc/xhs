name: Pilot Canonical Boundary Audit

on:
  push:
    branches:
      - content/quality-completion
    paths:
      - .pilot-canonical-boundary-trigger

permissions:
  contents: write

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'chore: audit pilot canonical boundaries' }}"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configure Git
        shell: bash
        run: |
          git config user.name "xhs-content-bot"
          git config user.email "43640935+liqiangcc@users.noreply.github.com"

      - name: Capture target contexts and TCP relation candidates
        shell: bash
        run: |
          set -euo pipefail
          out=review/content_build/pilot_canonical_boundary_audit
          mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id cq_tcp_handshake_39cc7c09 --noWrite > "$out/cq_tcp_handshake_39cc7c09.json"
          node scripts/xhs.js answer context --canonical-id cq_q_b7070ee7dadc35e7b4e4bb15db9ddd44 --noWrite > "$out/cq_q_b7070ee7dadc35e7b4e4bb15db9ddd44.json"
          node scripts/xhs.js canonical suggest --entity TCP --limit 100
          cp data/manifests/dedup/relation_candidate_queues.json "$out/tcp-relation-candidates.json"
          node - "$out/tcp-relation-candidates.json" "$out/pair-candidate.json" <<'NODE'
          const fs = require('fs');
          const [input, output] = process.argv.slice(2);
          const doc = JSON.parse(fs.readFileSync(input, 'utf8'));
          const a = 'cq_tcp_handshake_39cc7c09';
          const b = 'cq_q_b7070ee7dadc35e7b4e4bb15db9ddd44';
          const rows = doc.candidates || doc.rows || doc.items || [];
          const matches = rows.filter((row) => {
            const raw = JSON.stringify(row);
            return raw.includes(a) && raw.includes(b);
          });
          fs.writeFileSync(output, `${JSON.stringify({ schema_version: 'pilot_pair_candidate.v1', target: a, neighbor: b, match_count: matches.length, matches }, null, 2)}\n`);
          NODE

      - name: Verify repository gates
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:check

      - name: Commit boundary audit evidence
        shell: bash
        run: |
          set -euo pipefail
          git add review/content_build/pilot_canonical_boundary_audit data/manifests/dedup/relation_candidate_queues.json
          git commit -m "content: audit TCP handshake canonical boundary"

      - name: Remove temporary boundary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .pilot-canonical-boundary-trigger .github/workflows/pilot-canonical-boundary-audit.yml
          git add -A
          git commit -m "chore: remove pilot canonical boundary audit workflow"

      - name: Push boundary evidence
        shell: bash
        run: git push origin HEAD:content/quality-completion
