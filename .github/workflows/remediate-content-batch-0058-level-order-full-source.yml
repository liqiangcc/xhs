name: Remediate Content Batch 0058 Level Order Full Source

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/remediate-content-batch-0058-level-order-full-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0058-level-order-full-source
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Apply fully reviewed level-order relation
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin master
          git show origin/master:scripts/content/apply_batch_0058_level_order_relation.js > /tmp/apply_batch_0058_level_order_relation.js
          node /tmp/apply_batch_0058_level_order_relation.js

      - name: Regenerate Batch 0058 source inventory
        shell: bash
        run: |
          set -euo pipefail
          git show origin/master:scripts/content/build_batch_0058_source_inventory.py > /tmp/build_batch_0058_source_inventory.py
          python3 /tmp/build_batch_0058_source_inventory.py

      - name: Refresh generated audits and run full gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/xhs.js answer type-audit
          node scripts/content/check_question_coverage.js --check
          node scripts/xhs.js canonical check --noWrite
          node scripts/xhs.js review integrity --noWrite
          node scripts/xhs.js answer type-audit --check --noWrite
          node scripts/xhs.js answer validate --strict --noWrite
          node scripts/xhs.js validate all --noWrite
          npm test
          npm run ci:check
          npm run ci:answer:semantic
          npm run ci:answer:evidence
          npm run ci:answer:code
          npm run ci:answer:coverage

      - name: Commit only from stable content head
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$CONTENT_BRANCH"
          remote_head="$(git rev-parse origin/$CONTENT_BRANCH)"
          base_head='${{ steps.base.outputs.head }}'
          if [ "$remote_head" != "$base_head" ]; then
            echo "Content branch advanced during Batch 0058 level-order normalization: $base_head -> $remote_head; fail closed without push."
            exit 0
          fi
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git config user.name 'xhs-remediation-bot'
          git config user.email '43640935+liqiangcc@users.noreply.github.com'
          git commit -m 'content: normalize fully reviewed level-order sources'
          git push origin "HEAD:$CONTENT_BRANCH"
