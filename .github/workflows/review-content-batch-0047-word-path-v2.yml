name: Review Content Batch 0047 Word Path Candidate v2

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/review-content-batch-0047-word-path-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0047-word-path-review-v2
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_q_c5b4000d8ac232781338c2a1dd71be15
  SOURCE_QID: c5b4000d8ac232781338c2a1dd71be15
  SOURCE_IMG_TXT: note_img_txt/680e66cb0000000023012aa3.txt
  CANDIDATE: review/candidates/answers/cq_q_c5b4000d8ac232781338c2a1dd71be15.md
  OUT: review/content_build/answer_batch_0047/cq_q_c5b4000d8ac232781338c2a1dd71be15
  TASK: tasks/answer-batches/TASK-20260711-0313-answer-batch-0047.md
  ROUND1_COMMIT: 77f7bf728ca3f1e05ee0a5da324eeb1951652749

jobs:
  validate-and-record:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Source-first boundary and oral-quality checks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs');
          const src=fs.readFileSync(process.env.SOURCE_IMG_TXT,'utf8');
          if(!src.includes('单词路径(二维字母表,是否存在给\n定字符串的路径)')) throw new Error('image transcription source drift');
          const inventory=JSON.parse(fs.readFileSync('review/content_build/answer_batch_0047/source_inventory.json','utf8'));
          const item=inventory.items.find(x=>x.canonical_id===process.env.CANONICAL_ID);
          if(!item||item.state!=='active'||item.answer_type!=='coding'||JSON.stringify(item.question_ids)!==JSON.stringify([process.env.SOURCE_QID])) throw new Error('inventory boundary drift');
          const md=fs.readFileSync(process.env.CANDIDATE,'utf8');
          for(const h of ['## 核心结论','## 1 分钟版','## 3 分钟版','## 关键细节','## 原理机制','## 项目经验版','## 常见追问','## 易错点']) if(md.split(h).length!==2) throw new Error(`section drift ${h}`);
          const one=(md.match(/## 1 分钟版\n\n([\s\S]*?)(?=\n## )/)||[])[1]||'';
          const bullets=(one.match(/^- /gm)||[]).length;
          if(bullets<3||bullets>5) throw new Error(`one-minute backbone drift ${bullets}`);
          if(!md.includes('二维字母表')||!md.includes('给定字符串')) throw new Error('source supplement missing');
          if(!md.includes('采用经典单词搜索的最小可执行约定')) throw new Error('candidate contract is not explicit');
          if(/我在线上|我负责过|线上事故|我们生产|真实项目里我曾/.test(md)) throw new Error('fabricated project claim');
          const blocks=[...md.matchAll(/```java\n([\s\S]*?)\n```/g)];
          if(blocks.length!==1||!blocks[0][1].includes('public final class WordPath')) throw new Error('complete Java candidate missing');
          fs.writeFileSync(`${process.env.OUT}/reviewer_tmp/WordPath.java`,blocks[0][1]+'\n');
          NODE

      - name: Independently execute exact revised Java candidate
        shell: bash
        run: |
          set -euo pipefail
          cat > "$OUT/reviewer_tmp/WordPathReviewerTest.java" <<'JAVA'
          import java.util.*;
          public final class WordPathReviewerTest {
              static long exhaustiveCases;
              static void check(boolean v,String name){if(!v)throw new AssertionError(name);}
              public static void main(String[] args) {
                  char[][] sample={{'A','B','C','E'},{'S','F','C','S'},{'A','D','E','E'}};
                  check(WordPath.exists(sample,"ABCCED"),"ABCCED");
                  check(WordPath.exists(sample,"SEE"),"SEE");
                  check(!WordPath.exists(sample,"ABCB"),"no reuse");
                  check(WordPath.exists(new char[][]{{'A'}},"A"),"single");
                  check(!WordPath.exists(new char[][]{{'A'}},"AA"),"single no reuse");
                  check(WordPath.exists(new char[][]{{'X','A'},{'A','B'}},"AB"),"scan all starts");
                  check(WordPath.exists(new char[][]{},""),"empty word on empty board");
                  check(!WordPath.exists(null,"A"),"null board");
                  check(!WordPath.exists(sample,null),"null word");
                  boolean firstNullRejected=false;
                  try { WordPath.exists(new char[][]{null},"A"); } catch (IllegalArgumentException e){ firstNullRejected=true; }
                  boolean raggedRejected=false;
                  try { WordPath.exists(new char[][]{{'A'},{'B','C'}},"A"); } catch (IllegalArgumentException e){ raggedRejected=true; }
                  boolean raggedEmptyRejected=false;
                  try { WordPath.exists(new char[][]{{'A'},{'B','C'}},""); } catch (IllegalArgumentException e){ raggedEmptyRejected=true; }
                  check(firstNullRejected,"first-null row must be explicitly rejected");
                  check(raggedRejected,"ragged board must be explicitly rejected");
                  check(raggedEmptyRejected,"empty word must not bypass board-shape validation");
                  exhaustiveTwoByThree();
                  System.out.printf("PASS fixed=12 exhaustive=%d shape-contract=pass%n",exhaustiveCases);
              }
              static void exhaustiveTwoByThree(){
                  int rows=2,cols=3,cells=rows*cols;
                  for(int boardMask=0;boardMask<(1<<cells);boardMask++){
                      char[][] b=new char[rows][cols];
                      for(int p=0;p<cells;p++) b[p/cols][p%cols]=((boardMask>>>p)&1)==0?'A':'B';
                      for(int len=0;len<=6;len++) for(int wm=0;wm<(1<<len);wm++){
                          StringBuilder sb=new StringBuilder();
                          for(int i=0;i<len;i++) sb.append(((wm>>>i)&1)==0?'A':'B');
                          String w=sb.toString();
                          boolean expected=reference(b,w),actual=WordPath.exists(b,w);
                          if(actual!=expected) throw new AssertionError("mismatch board="+Arrays.deepToString(b)+" word="+w+" expected="+expected+" actual="+actual);
                          exhaustiveCases++;
                      }
                  }
              }
              static boolean reference(char[][] b,String w){if(w.isEmpty())return true;for(int r=0;r<b.length;r++)for(int c=0;c<b[0].length;c++)if(refDfs(b,w,r,c,0,0))return true;return false;}
              static boolean refDfs(char[][] b,String w,int r,int c,int i,int used){int rows=b.length,cols=b[0].length;if(r<0||r>=rows||c<0||c>=cols)return false;int bit=1<<(r*cols+c);if((used&bit)!=0||b[r][c]!=w.charAt(i))return false;if(i==w.length()-1)return true;int next=used|bit;return refDfs(b,w,r+1,c,i+1,next)||refDfs(b,w,r-1,c,i+1,next)||refDfs(b,w,r,c+1,i+1,next)||refDfs(b,w,r,c-1,i+1,next);}
          }
          JAVA
          (cd "$OUT/reviewer_tmp" && javac -Xlint:all -Werror WordPath.java WordPathReviewerTest.java && java WordPathReviewerTest > stdout.txt)
          stdout="$(cat "$OUT/reviewer_tmp/stdout.txt")"
          echo "$stdout"
          test "$stdout" = 'PASS fixed=12 exhaustive=8128 shape-contract=pass'

      - name: Freeze round-1 FAIL and revised PASS evidence
        shell: bash
        run: |
          set -euo pipefail
          stdout="$(cat "$OUT/reviewer_tmp/stdout.txt")"
          REVIEW_STDOUT="$stdout" node <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),cp=require('child_process');
          const cid=process.env.CANONICAL_ID,out=process.env.OUT,candidate=process.env.CANDIDATE,date='2026-08-28';
          const current=fs.readFileSync(candidate),currentHash=crypto.createHash('sha256').update(current).digest('hex');
          const old=cp.execFileSync('git',['show',`${process.env.ROUND1_COMMIT}:${candidate}`]);
          const oldHash=crypto.createHash('sha256').update(old).digest('hex');
          const oldText=old.toString('utf8');
          const oldOne=(oldText.match(/## 1 分钟版\n\n([\s\S]*?)(?=\n## )/)||[])[1]||'';
          const oldBullets=(oldOne.match(/^- /gm)||[]).length;
          if(oldBullets!==6) throw new Error(`round-1 snapshot drifted: bullets=${oldBullets}`);
          const round1Findings=[
            {severity:'major',code:'one_minute_backbone_count',detail:'Round-1 candidate had 6 one-minute backbone bullets while the current semantic standard requires 3–5.'},
            {severity:'major',code:'rectangular_contract_first_null_row',detail:'Round-1 implementation dereferenced board[0] before validating a null first row, contradicting its explicit rectangular-input rejection contract.'},
            {severity:'major',code:'empty_word_bypasses_shape_contract',detail:'Round-1 implementation returned true for an empty word before validating later ragged/null rows, so invalid board shapes bypassed the documented contract.'}
          ];
          fs.writeFileSync(`${out}/isolated_review_round1.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:oldHash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0047-word-path-20260828-r1',review_version:'batch-0047.word-path.r1',decision:'fail',revision_round:1,source_packet:['review/content_build/answer_batch_0047/source_inventory.json',process.env.SOURCE_IMG_TXT,`${process.env.ROUND1_COMMIT}:${candidate}`,'docs/refactor/09_answer_content_standard.md'],scores:{facts_and_evidence:25,directness_and_relevance:17,type_specific_completeness:14,mechanism_and_causality:15,boundaries_and_tradeoffs:6,followup_quality:5,oral_quality:3},hard_failures:['coding_candidate_input_contract_does_not_match_first-null-row_and_empty-word-ragged_behavior'],unsupported_claims:[],uncovered_source_variants:[],findings:round1Findings,promotion_blockers:['revision_required','repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          fs.writeFileSync(`${out}/reviewer_validation.json`,JSON.stringify({schema_version:'answer_code_validation.v1',canonical_id:cid,candidate_sha256:currentHash,result:'pass',validated_at:date,runtime:'OpenJDK 21',command:'extract exact revised candidate Java; javac -Xlint:all -Werror; fixed boundaries; exhaustive 2x3 A/B boards and all A/B words length 0..6',stdout:process.env.REVIEW_STDOUT,checks:['exact candidate compiles','classic ABCCED/SEE/ABCB semantics','no cell reuse','all starting cells searched','null and empty boundaries','null/ragged rows explicitly rejected before empty-word shortcut','all 8128 exhaustive board/word combinations match independent reference']},null,2)+'\n');
          fs.writeFileSync(`${out}/writer_research.json`,JSON.stringify({schema_version:'answer_writer_research.v1',canonical_id:cid,checked_at:date,review_state:'writer_complete_isolated_review_pending',sources:[{source_id:'repository-source-image-transcription',title:'Tencent WXG interview image transcription',locator:process.env.SOURCE_IMG_TXT,source_type:'repository_source_record',checked_at:date},{source_id:'reviewer-validation',title:'Exact revised word-path executable validation',locator:`${out}/reviewer_validation.json`,source_type:'executable_test_or_reproducible_experiment',checked_at:date}],claims:[{claim_id:'source-boundary',text:'The preserved image transcription asks whether a given string path exists in a two-dimensional letter table; neighbor directions and cell reuse are not preserved source constraints.',source_ids:['repository-source-image-transcription'],answer_locations:['核心结论','1 分钟版','关键细节','易错点']},{claim_id:'candidate-contract',text:'Under the explicitly chosen four-neighbor/no-reuse contract, the exact revised Java implementation matches an independent exhaustive reference and enforces its rectangular-input boundary.',source_ids:['reviewer-validation'],answer_locations:['3 分钟版','关键细节','原理机制','常见追问']}],source_question_coverage:[{question_id:process.env.SOURCE_QID,covered:true,answer_locations:['核心结论','1 分钟版','3 分钟版','关键细节','原理机制','常见追问']}],promotion_blocker:'repository_human_approval_and_real_review_policy_not_yet_satisfied'},null,2)+'\n');
          const scores={facts_and_evidence:25,directness_and_relevance:20,type_specific_completeness:20,mechanism_and_causality:15,boundaries_and_tradeoffs:10,followup_quality:5,oral_quality:5};
          const findings=[
            'The repository image transcription is source-bounded to a two-dimensional letter table and path-existence question; the candidate explicitly labels four-neighbor/no-reuse semantics as its executable convention because those details are not preserved in the source.',
            'Revision 2 reduces the one-minute backbone from six points to five, satisfying the current oral-quality standard without losing the DFS state, pruning, backtracking invariant or complexity boundary.',
            'Revision 2 validates board shape before the empty-word shortcut and explicitly rejects null/ragged rows, resolving the round-1 input-contract mismatch.',
            'The exact revised OpenJDK 21 implementation passes classic positive/negative cases and all 8,128 combinations formed by every 2x3 A/B board and every A/B word of length 0 through 6 against an independent reference search.',
            'The project section remains hypothetical and variants such as diagonal movement, reusable cells and path-returning APIs are separated from the chosen contract rather than fabricated as source facts.'
          ];
          fs.writeFileSync(`${out}/isolated_review_result.json`,JSON.stringify({schema_version:'isolated_review.v1',canonical_id:cid,candidate_sha256:currentHash,reviewed_at:date,review_mode:'source_first_isolated',reviewer_id:'source-first-isolated-reviewer-batch-0047-word-path-20260828-r2',review_version:'batch-0047.word-path.r2-exhaustive',decision:'pass',revision_round:2,source_packet:['review/content_build/answer_batch_0047/source_inventory.json',process.env.SOURCE_IMG_TXT,candidate,'docs/refactor/09_answer_content_standard.md',`${out}/reviewer_validation.json`],scores,hard_failures:[],unsupported_claims:[],uncovered_source_variants:[],findings,promotion_blockers:['repository_human_approval_and_real_review_policy_not_yet_satisfied']},null,2)+'\n');
          fs.writeFileSync(`${out}/remediation_record.json`,JSON.stringify({schema_version:'answer_remediation.v1',canonical_id:cid,recorded_at:date,round1_commit:process.env.ROUND1_COMMIT,round1_candidate_sha256:oldHash,revised_candidate_sha256:currentHash,resolved_findings:round1Findings.map(x=>x.code),regression_validation:`${out}/reviewer_validation.json`,final_isolated_review:`${out}/isolated_review_result.json`,result:'pass'},null,2)+'\n');
          NODE

      - name: Record batch progress and push artifacts safely
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT/reviewer_tmp"
          node <<'NODE'
          const fs=require('fs'),p=process.env.TASK,cid=process.env.CANONICAL_ID;
          let text=fs.readFileSync(p,'utf8');
          const marker=`- [x] \`${cid}\` revision 2 source-first review PASS`;
          if(!text.includes(marker)){
            text += `${marker}: the image transcription preserves only a two-dimensional letter-table path-existence question, so four-neighbor/no-reuse behavior remains an explicit candidate contract rather than source fact. Independent round 1 found Major defects in the six-point 1-minute backbone and in rectangular-input handling (first-null-row and empty-word ragged paths contradicted the documented rejection contract). Revision 2 compresses the oral backbone to five points, validates shape before the empty-word shortcut, and passes exact OpenJDK 21 compilation plus 12 fixed/boundary checks and exhaustive comparison over all 8,128 two-by-three A/B board/word combinations. Formal promotion remains blocked by repository human-approval/real-review policy.\n`;
            fs.writeFileSync(p,text);
          }
          NODE
          git config user.name xhs-review-bot
          git config user.email 43640935+liqiangcc@users.noreply.github.com
          git add "$OUT" "$TASK"
          git commit -m 'review: pass remediated batch 0047 word-path candidate'
          git fetch origin "$CONTENT_BRANCH"
          git rebase "origin/$CONTENT_BRANCH"
          git push origin HEAD:"$CONTENT_BRANCH"
