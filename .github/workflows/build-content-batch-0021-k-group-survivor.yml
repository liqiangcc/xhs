name: Build Content Batch 0021 K Group Survivor

on:
  push:
    branches: [master]
    paths:
      - .github/workflows/build-content-batch-0021-k-group-survivor.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: content-batch-0021-k-group-survivor
  cancel-in-progress: true

env:
  CONTENT_BRANCH: content/quality-completion
  CANONICAL_ID: cq_topic_745b29f7
  QID_A: 37b42623861093a397be5bff1ee3fad6
  QID_B: 47f6e217cc684f406d6472441b015c41
  QID_C: 74dcc97230485151dd50aa5d7664cc0c
  SOURCE_A: note_desc/67f9c763000000001c016f0f.txt
  SOURCE_B: note_desc/68b2bb7c000000001d00459e.txt
  SOURCE_C: note_desc/66023fea000000001400552b.txt

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CONTENT_BRANCH }}
          fetch-depth: 1

      - id: base
        shell: bash
        run: echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Guard consolidated source boundary
        shell: bash
        run: |
          set -euo pipefail
          out="review/content_build/answer_batch_0021/$CANONICAL_ID"; mkdir -p "$out"
          node scripts/xhs.js answer context --canonical-id "$CANONICAL_ID" --noWrite > "$out/context.json"
          node <<'NODE'
          const fs=require('fs'),cid=process.env.CANONICAL_ID;
          const ctx=JSON.parse(fs.readFileSync(`review/content_build/answer_batch_0021/${cid}/context.json`,'utf8'));
          if(!ctx.ok||ctx.canonical?.canonical_id!==cid||ctx.answer_type!=='coding') throw new Error('consolidated Canonical context missing or type drifted');
          const members=[...(ctx.canonical?.question_ids||[])].sort();
          const expected=[process.env.QID_A,process.env.QID_B,process.env.QID_C].sort();
          if(JSON.stringify(members)!==JSON.stringify(expected)) throw new Error(`consolidated membership drifted: ${JSON.stringify(members)}`);
          const byQ=new Map((ctx.source_questions||[]).map(x=>[x.question_id,x.original_question]));
          const expectedText=new Map([
            [process.env.QID_A,'算法手撕：LeetCode 25 - K 个一组翻转链表。给定一个链表，每 k 个节点一组进行翻转，请返回翻转后的链表'],
            [process.env.QID_B,'算法手撕：K 个一组翻转链表（Reverse Nodes in k-Group）。'],
            [process.env.QID_C,'算法：K 个一组翻转链表。'],
          ]);
          for(const [qid,text] of expectedText) if(byQ.get(qid)!==text) throw new Error(`${qid}: source wording drifted: ${byQ.get(qid)}`);
          const rawA=fs.readFileSync(process.env.SOURCE_A,'utf8');
          const rawB=fs.readFileSync(process.env.SOURCE_B,'utf8');
          const rawC=fs.readFileSync(process.env.SOURCE_C,'utf8');
          if(!rawA.includes('手撕LC 25. K 个一组翻转链表')) throw new Error('raw source A drifted');
          if(!rawB.includes('手撕：k个一组翻转链表')) throw new Error('raw source B drifted');
